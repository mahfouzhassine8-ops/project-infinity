name: Infinity 1.0.8 | Deep Rebrand

on:
  workflow_dispatch:
  push:
    branches: [infinity-1.0.8-deep-rebrand]
    paths:
      - '.github/workflows/infinity-1.0.8-deep-rebrand.yml'
      - 'scripts/infinity_1_0_8_deep_rebrand.py'
      - 'scripts/infinity71.py'
      - 'scripts/infinity-responsive-v5.py'
      - 'scripts/infinity_upper_layer_repack.py'
      - 'patches/infinity-7.1-audited/**'
      - 'patches/infinity-responsive-v5/**'
      - 'addons/service.infinity.compat/**'
      - 'addons/service.infinity.refresh/**'

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4

      - name: Install branding/preflight tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick fonts-dejavu-core
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' >/dev/null
          python3 -m py_compile scripts/infinity_1_0_8_deep_rebrand.py

      - name: Apply exact responsive v5 baseline then deep rebrand
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 21.3-Omega https://github.com/xbmc/xbmc.git kodi
          test "$(git -C kodi rev-parse HEAD)" = a3a448d26b8d560a65655dab2cd122994dc4e146
          python3 scripts/infinity71.py source --source kodi
          python3 scripts/infinity-responsive-v5.py source --source kodi
          python3 scripts/infinity_1_0_8_deep_rebrand.py source \
            --source kodi --receipt preflight/deep-rebrand-source.json
          python3 scripts/infinity_1_0_8_deep_rebrand.py verify-source --source kodi
          grep -q 'versionCode 2103122' kodi/tools/android/packaging/xbmc/build.gradle.in
          grep -q 'versionName "1.0.8-Deep-Rebrand-1"' kodi/tools/android/packaging/xbmc/build.gradle.in
          grep -q 'android:icon="@mipmap/ic_launcher"' kodi/tools/android/packaging/xbmc/AndroidManifest.xml.in
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' kodi/tools/android/packaging/xbmc/AndroidManifest.xml.in
          grep -q 'Infinity' kodi/tools/android/packaging/xbmc/strings.xml.in
          grep -q 'windowSplashScreenAnimatedIcon' kodi/tools/android/packaging/xbmc/res/values-v31/infinity_splash_theme.xml
          grep -q '<monochrome ' kodi/tools/android/packaging/xbmc/res/mipmap-anydpi-v33/ic_launcher.xml
          test -s kodi/media/splash.jpg
          test -s kodi/media/vendor_logo.png
          test -s kodi/media/vendor_icon.png

      - name: Revalidate responsive bridge and Android Java ownership
        run: |
          set -euo pipefail
          python3 scripts/infinity-responsive-v5.py verify --source kodi
          python3 scripts/validate-infinity71-java.py --source kodi \
            --android-jar "$ANDROID_HOME/platforms/android-34/android.jar" --out preflight/v5-java
          grep -q 'static final int VERSION = 5' kodi/tools/android/packaging/xbmc/src/InfinityCoreBridge.java.in
          grep -q 'Infinity.NativeDeviceMode' kodi/xbmc/windowing/android/WinSystemAndroid.cpp
          python3 scripts/validate_infinity_skin_contract.py
          python3 -m py_compile addons/service.infinity.compat/service.py \
            addons/service.infinity.compat/layout_service.py \
            addons/service.infinity.compat/theme_contract.py \
            addons/service.infinity.refresh/service.py

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-1.0.8-Deep-Rebrand-Preflight
          path: |
            preflight/deep-rebrand-source.json
            preflight/v5-java/Main.javap.txt
          if-no-files-found: warn
          retention-days: 30

  engine:
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      NDK_VER: 21.4.7075529
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4

      - name: Prepare matched Android/branding toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y autoconf bison build-essential curl flex gawk git gperf \
            lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev unzip zip zlib1g-dev \
            ccache python3 nasm yasm imagemagick fonts-dejavu-core
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' "ndk;$NDK_VER"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi

      - name: Apply v4 + responsive v5 + deep rebrand to exact Kodi 21.3
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 21.3-Omega https://github.com/xbmc/xbmc.git kodi
          test "$(git -C kodi rev-parse HEAD)" = a3a448d26b8d560a65655dab2cd122994dc4e146
          python3 scripts/infinity71.py source --source kodi
          python3 scripts/infinity-responsive-v5.py source --source kodi
          python3 scripts/infinity_1_0_8_deep_rebrand.py source \
            --source kodi --receipt engine-deep-rebrand-source.json
          python3 scripts/infinity_1_0_8_deep_rebrand.py verify-source --source kodi

      - uses: actions/cache/restore@v4
        id: deps-cache
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            ~/.ccache
          key: infinity-responsive-v5-21.3-arm64-${{ runner.os }}-${{ hashFiles('patches/infinity-7.1-audited/contract.json', 'patches/infinity-responsive-v5/contract.json') }}
          restore-keys: |
            infinity-responsive-v5-21.3-arm64-${{ runner.os }}-
            infinity-71-audited-deps-21.3-arm64-${{ runner.os }}-

      - name: Prepare matched dependencies and native build configuration
        id: depends
        run: |
          set -euo pipefail
          mkdir -p "$TARBALLS" "$DEPENDS" "$BUILD_DIR"
          cd kodi/tools/depends
          ./bootstrap
          ./configure --with-tarballs="$TARBALLS" --host=aarch64-linux-android \
            --with-sdk-path="$ANDROID_HOME" --with-ndk-path="$ANDROID_HOME/ndk/$NDK_VER" \
            --prefix="$DEPENDS" --enable-debug=yes
          make -j"$(nproc)"
          make -C target/cmakebuildsys BUILD_DIR="$BUILD_DIR"

      - name: Compile-check changed native owners
        run: |
          set -euo pipefail
          CMAKE_BIN=$(sed -n 's/^CMAKE_COMMAND:INTERNAL=//p' "$BUILD_DIR/CMakeCache.txt")
          test -x "$CMAKE_BIN"
          "$CMAKE_BIN" -S "$PWD/kodi" -B "$BUILD_DIR" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          python3 scripts/infinity71.py native-check --build-dir "$BUILD_DIR"

      - name: Build source-branded responsive engine and APK
        run: |
          set -euo pipefail
          make -C "$BUILD_DIR" -j"$(nproc)"
          make -C "$BUILD_DIR" apk -j"$(nproc)"
          APK=$(find kodi "$BUILD_DIR" -type f -name '*.apk' -print -quit)
          test -n "$APK"
          mkdir -p engine
          cp "$APK" engine/Infinity-1.0.8-Deep-Rebrand-Engine-Base.apk
          cp engine-deep-rebrand-source.json engine/deep-rebrand-source.json
          python3 scripts/infinity71.py record-engine \
            --apk engine/Infinity-1.0.8-Deep-Rebrand-Engine-Base.apk \
            --output engine/engine-overlay-manifest.json --source-commit "$GITHUB_SHA"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging \
            engine/Infinity-1.0.8-Deep-Rebrand-Engine-Base.apk | tee engine/base-badging.txt
          grep -q "package: name='com.projectinfinity.kodi' versionCode='2103122'" engine/base-badging.txt
          grep -q "application-label:'Infinity'" engine/base-badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump resources \
            engine/Infinity-1.0.8-Deep-Rebrand-Engine-Base.apk > engine/base-resources.txt
          grep -q 'ic_launcher' engine/base-resources.txt
          printf '%s\n' 'Source-built responsive v5 engine plus Android/source-owned Infinity deep branding. Runtime verification still required.' > engine/README.txt

      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-1.0.8-Deep-Rebrand-Engine
          path: engine/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - uses: actions/cache/save@v4
        if: always() && steps.depends.conclusion == 'success' && steps.deps-cache.outputs.cache-hit != 'true'
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            ~/.ccache
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

  package:
    needs: engine
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install packaging branding tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick fonts-dejavu-core unzip zip
          sdkmanager 'build-tools;34.0.0' >/dev/null
      - uses: actions/download-artifact@v5
        with:
          name: Infinity-1.0.8-Deep-Rebrand-Engine
          path: engine

      - name: Apply preserved Infinity lock and current upper layer
        run: |
          set -euo pipefail
          mkdir -p candidate
          python3 scripts/infinity71.py overlay \
            --apk engine/Infinity-1.0.8-Deep-Rebrand-Engine-Base.apk \
            --manifest engine/engine-overlay-manifest.json \
            --output candidate/with-lock-unsigned.apk
          python3 scripts/infinity_upper_layer_repack.py \
            candidate/with-lock-unsigned.apk candidate/upper-layer-unsigned.apk

      - name: Re-assert final user-facing Infinity branding
        run: |
          set -euo pipefail
          python3 scripts/infinity_1_0_8_deep_rebrand.py apk \
            --input candidate/upper-layer-unsigned.apk \
            --output candidate/Infinity-1.0.8-Deep-Rebrand-unsigned.apk \
            --receipt candidate/deep-rebrand-apk.json
          python3 scripts/infinity_1_0_8_deep_rebrand.py verify-apk \
            --apk candidate/Infinity-1.0.8-Deep-Rebrand-unsigned.apk

      - name: Sign permanent Infinity update and verify identity
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          bash scripts/sign-infinity71.sh \
            candidate/Infinity-1.0.8-Deep-Rebrand-unsigned.apk \
            candidate/Infinity-1.0.8-Deep-Rebrand.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs \
            candidate/Infinity-1.0.8-Deep-Rebrand.apk | tee candidate/signing-verification.txt
          grep -qi 'd7adeb68e9341596a02bd3262b737a0f45fc6e771ed7e60285437e833b58c6d7' candidate/signing-verification.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging \
            candidate/Infinity-1.0.8-Deep-Rebrand.apk | tee candidate/badging.txt
          grep -q "package: name='com.projectinfinity.kodi' versionCode='2103122'" candidate/badging.txt
          grep -q "application-label:'Infinity'" candidate/badging.txt

      - name: Final engine/branding regression gates
        run: |
          set -euo pipefail
          python3 scripts/infinity_1_0_8_deep_rebrand.py verify-apk \
            --apk candidate/Infinity-1.0.8-Deep-Rebrand.apk
          python3 - <<'PY'
          import hashlib, zipfile
          base='engine/Infinity-1.0.8-Deep-Rebrand-Engine-Base.apk'
          final='candidate/Infinity-1.0.8-Deep-Rebrand.apk'
          with zipfile.ZipFile(base) as a, zipfile.ZipFile(final) as b:
              for name in a.namelist():
                  if name == 'lib/arm64-v8a/libkodi.so' or (name.startswith('classes') and name.endswith('.dex')):
                      assert a.read(name) == b.read(name), name
              dex=b''.join(b.read(n) for n in b.namelist() if n.startswith('classes') and n.endswith('.dex'))
              native=b.read('lib/arm64-v8a/libkodi.so')
              assert b'Published responsive v5' in dex
              assert b'Infinity.NativeDeviceMode' in native
              assert 'assets/media/splash.jpg' in b.namelist()
              assert 'assets/media/vendor_logo.png' in b.namelist()
          print('PASS: responsive v5 engine/DEX preserved through deep branding package phase')
          PY
          sha256sum candidate/Infinity-1.0.8-Deep-Rebrand.apk | tee candidate/Infinity-1.0.8-Deep-Rebrand.sha256
          cp engine/deep-rebrand-source.json candidate/deep-rebrand-source.json
          cat > candidate/DEVICE-TEST.txt <<'EOF'
          DEVICE TEST REQUIRED — build/static success is not runtime proof.

          Branding:
          - Samsung launcher: trimmed Infinity icon, circle/squircle masks, Android themed icon.
          - Cold launch in Light mode: light Infinity Android splash; no stock Kodi splash/logo.
          - Cold launch in Dark/OLED: black/deep Infinity splash; no stock Kodi splash/logo.
          - First-run/storage/permission progress text says Infinity.
          - Native startup handoff remains Infinity branded.
          - Settings/About/normal English UI uses Infinity naming; required Kodi legal attribution may remain in legal/About text.
          - Web UI logo/title is Infinity if the web interface is used.

          Regression:
          - Package remains com.projectinfinity.kodi and updates over the permanent Infinity signing line.
          - Responsive Bridge v5 cover/inner/fold behavior still works.
          - Audio/media playback, refresh controller, PiP, player, locked C30.4.1 skin and Install from ZIP are regression checks; this build does not redesign them.

          Do not call this a locked APK until on-device acceptance passes.
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-1.0.8-Deep-Rebrand
          path: |
            candidate/Infinity-1.0.8-Deep-Rebrand.apk
            candidate/Infinity-1.0.8-Deep-Rebrand.sha256
            candidate/signing-verification.txt
            candidate/badging.txt
            candidate/deep-rebrand-source.json
            candidate/deep-rebrand-apk.json
            candidate/DEVICE-TEST.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
