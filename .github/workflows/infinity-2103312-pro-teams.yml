name: Infinity | 2103312 Cobra Pro teams
on:
  workflow_dispatch:
  push:
    branches: [repair/2103312-pro-teams]
    paths: ['repairs/pro-teams-2103312/**', '.github/workflows/infinity-2103312-pro-teams.yml']
permissions: {contents: read, actions: read}
concurrency:
  group: infinity-2103312-pro-teams
  cancel-in-progress: true
jobs:
  candidate-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: 'platform-tools platforms;android-35 build-tools;34.0.0'}
      - name: Download the exact 3311 source and matching build proof
        uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 37391709971
          name: Infinity-2103311-Kodi-Process-Isolation-Verification
          github-token: ${{ github.token }}
          path: parent3311
      - name: Download the exact 2103311 APK
        uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 37391709971
          name: Infinity-2103311-Kodi-Process-Isolation-RC1-APK
          github-token: ${{ github.token }}
          path: base3311
      - name: Verify inherited source and stage Cobra team features
        run: |
          set -euo pipefail
          mkdir -p source3312 evidence3312 "$HOME/.android"
          tar --no-same-owner -xzf parent3311/repaired-shell-source.tar.gz -C source3312
          python3 repairs/pro-teams-2103312/apply.py --source source3312/shell-kodi --parent-proof parent3311/SOURCE-PRESERVATION.json --out evidence3312
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          python3 repairs/pro-teams-2103312/build.py prepare --source source3312/shell-kodi --base base3311/Infinity-2103311-Kodi-Process-Isolation-RC1.apk --base-proof parent3311/APK-VERIFICATION.json --build build3312 --out evidence3312
      - name: Compile and test Cobra integration and Infinity preservation
        env:
          KODI_ANDROID_KEY_ALIAS: androiddebugkey
          KODI_ANDROID_KEY_PASSWORD: android
          KODI_ANDROID_STORE_PASSWORD: android
        run: |
          set -euo pipefail
          export KODI_ANDROID_STORE_FILE="$HOME/.android/debug.keystore"
          cd build3312
          ./gradlew --no-daemon --console=plain :xbmc:testReleaseUnitTest :xbmc:assembleRelease :xbmc:exportPreservationTools :processprobe:assembleDebug :processprobe:assembleDebugAndroidTest 2>&1 | tee ../evidence3312/android-build.log
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify chooser survival across a real Android process exit
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KODI_ANDROID_KEY_ALIAS: androiddebugkey
          KODI_ANDROID_KEY_PASSWORD: android
          KODI_ANDROID_STORE_PASSWORD: android
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 repairs/chooser-isolation-2103311/run_process_probe.py --build build3312 --out evidence3312
      - name: Verify protected payload and bytecode then permanently sign
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 repairs/pro-teams-2103312/build.py package --source source3312/shell-kodi --base base3311/Infinity-2103311-Kodi-Process-Isolation-RC1.apk --base-proof parent3311/APK-VERIFICATION.json --build build3312 --out evidence3312 2>&1 | tee evidence3312/package.log
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103312-Cobra-Pro-Teams-RC1-APK
          path: evidence3312/*.apk
          compression-level: 1
          retention-days: 90
          if-no-files-found: error
      - name: Export test results and exact Android source
        if: always()
        run: |
          mkdir -p evidence3312
          cp repairs/pro-teams-2103312/README.md evidence3312/
          if test -d build3312/xbmc/build/test-results; then cp -a build3312/xbmc/build/test-results evidence3312/; fi
          if test -d build3312/xbmc/build/reports/tests; then cp -a build3312/xbmc/build/reports/tests evidence3312/test-reports; fi
          if test -d build3312/processprobe/build/outputs/androidTest-results; then cp -a build3312/processprobe/build/outputs/androidTest-results evidence3312/process-exit-tests; fi
          if test -d source3312/shell-kodi; then tar -czf evidence3312/repaired-shell-source.tar.gz -C source3312 shell-kodi; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103312-Cobra-Pro-Teams-Verification
          path: |
            evidence3312/
            !evidence3312/*.apk
          retention-days: 90
          if-no-files-found: error

