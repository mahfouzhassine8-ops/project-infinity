name: Preserve Infinity 7.0 Asset Objects
on:
  push:
    branches: [infinity-7.1-core-unified]
    paths: ['.github/workflows/import-infinity-7.1-assets.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Verify donor and preserve three exact binary assets without changing branch refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p result
          curl --fail --location --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPO/actions/artifacts/10037657045/zip" -o /tmp/donor.zip
          python3 - <<'PY'
          import base64, hashlib, io, json, os, urllib.request, zipfile
          from pathlib import Path
          archive = Path('/tmp/donor.zip').read_bytes()
          assert hashlib.sha256(archive).hexdigest() == '2d98f01bd8e7d7b4fe2e1d718ca265432a99c7f3484d50c3d21bc539b6b212d3'
          wanted = {
            'assets/addons/skin.estuary/media/osd/fullscreen/buttons/infinity-lock.png': 'e780ace57f5c9147aaa237637f4d9880b8d1cd8d',
            'assets/addons/skin.estuary/media/osd/fullscreen/buttons/infinity-unlock.png': '750dd9df4480472222aa66f789ee27b5bb51d0a1',
            'res/drawable-nodpi/project_infinity_icon.png': 'c8f3d6e07d7ed847f0415291e044c076e2405ef0',
          }
          with zipfile.ZipFile(io.BytesIO(archive)) as outer:
            names = [n for n in outer.namelist() if n.endswith('.apk')]
            assert len(names) == 1
            apk_bytes = outer.read(names[0])
          records = []
          with zipfile.ZipFile(io.BytesIO(apk_bytes)) as apk:
            for name, expected in wanted.items():
              data = apk.read(name)
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == expected, (name, actual)
              req = urllib.request.Request(
                'https://api.github.com/repos/' + os.environ['REPO'] + '/git/blobs',
                data=json.dumps({'content': base64.b64encode(data).decode(), 'encoding':'base64'}).encode(),
                headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json','Content-Type':'application/json'},
                method='POST')
              with urllib.request.urlopen(req, timeout=60) as response:
                blob = json.load(response)
              assert blob['sha'] == expected
              records.append({'name':name, 'sha':expected, 'size':len(data)})
              print(name, expected, len(data))
          Path('result/asset-blobs.json').write_text(json.dumps(records, indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-7.1-Preserved-Asset-Objects
          path: result/asset-blobs.json
          retention-days: 7
          if-no-files-found: error
