name: Cobra Pro | 2103307 sports and motion candidate
on:
  workflow_dispatch:
  push:
    branches: [candidate-cobra-pro-sports-2103307]
    paths: ['repairs/pro-sports-2103307/**', '.github/workflows/infinity-2103307-pro-sports.yml']
permissions: {contents: read, actions: read}
concurrency:
  group: cobra-pro-2103307
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: 'platform-tools platforms;android-35 build-tools;34.0.0'}
      - name: Download exact inherited Android source
        uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 37232671642
          name: Infinity-304-Power-Route-Validation-NO-APK
          github-token: ${{ github.token }}
          path: parent3305
      - name: Download locked 2103306 APK
        uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 37245988389
          name: Infinity-2103306-Provider-Coordinates-RC1-APK-NOT-DEVICE-ACCEPTED
          github-token: ${{ github.token }}
          path: base3306
      - name: Guard base and stage only the Cobra source delta
        run: |
          set -euo pipefail
          mkdir -p verified3307 evidence3307 "$HOME/.android"
          tar --no-same-owner -xzf parent3305/repaired-shell-source.tar.gz -C verified3307
          python3 repairs/pro-sports-2103307/apply.py --source verified3307/shell-kodi --proof parent3305/ANDROID-SOURCE-PROOF.json --out evidence3307
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          python3 repairs/pro-sports-2103307/build.py prepare --source verified3307/shell-kodi --base base3306/Infinity-2103306-Provider-Coordinates-RC1.apk --build build3307 --out evidence3307
      - name: Compile, render production views and run integration regressions
        env:
          KODI_ANDROID_KEY_ALIAS: androiddebugkey
          KODI_ANDROID_KEY_PASSWORD: android
          KODI_ANDROID_STORE_PASSWORD: android
        run: |
          set -euo pipefail
          export KODI_ANDROID_STORE_FILE="$HOME/.android/debug.keystore"
          cd build3307
          ./gradlew --no-daemon --console=plain :xbmc:testReleaseUnitTest :xbmc:assembleRelease 2>&1 | tee ../evidence3307/android-build.log
      - name: Preserve original Infinity payload and permanently sign candidate
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 repairs/pro-sports-2103307/build.py package --source verified3307/shell-kodi --base base3306/Infinity-2103306-Provider-Coordinates-RC1.apk --build build3307 --out evidence3307 2>&1 | tee evidence3307/package.log
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103307-Cobra-Pro-Sports-RC1-APK-NOT-DEVICE-ACCEPTED
          path: evidence3307/*.apk
          compression-level: 1
          retention-days: 90
          if-no-files-found: error
      - name: Collect checks and source export
        if: always()
        run: |
          mkdir -p evidence3307
          cp repairs/pro-sports-2103307/README.md evidence3307/
          if test -d build3307/xbmc/build/test-results; then cp -a build3307/xbmc/build/test-results evidence3307/; fi
          if test -d build3307/xbmc/build/reports/tests; then cp -a build3307/xbmc/build/reports/tests evidence3307/test-reports; fi
          if test -d verified3307/shell-kodi; then tar -czf evidence3307/repaired-shell-source.tar.gz -C verified3307 shell-kodi; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Cobra-Pro-2103307-Verification
          path: |
            evidence3307/
            !evidence3307/*.apk
          retention-days: 90
          if-no-files-found: error
