name: Infinity500 reviewed native corrections - full ARM64 integration
on:
  push:
    branches: [work/infinity-2103500-consolidated-repair-20261115]
    paths: [repairs/infinity-consolidated-2103500-20261115/CI-NATIVE.json, repairs/infinity-consolidated-2103500-20261115/QA-PACKAGE-REQUEST.json]
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency: {group: infinity500-native-integration, cancel-in-progress: false}
jobs:
  arm64:
    if: github.ref == 'refs/heads/work/infinity-2103500-consolidated-repair-20261115' && !startsWith(github.event.head_commit.message, 'QA500 stage:')
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      GH_TOKEN: '${{ github.token }}'
      NDK_VER: '21.4.7075529'
      DEPENDS: '${{ github.workspace }}/android-tools/xbmc-depends'
      TARBALLS: '${{ github.workspace }}/android-tools/xbmc-tarballs'
      BUILD_DIR: '${{ github.workspace }}/kodi-build'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools build-tools;35.0.0 platforms;android-34', log-accepted-android-sdk-licenses: false}
      - name: Retained authenticated source and dependency inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13274901825', run-id: '41726452356', merge-multiple: true, github-token: '${{ github.token }}', path: verified-inputs}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13571276665', run-id: '42364232328', merge-multiple: true, github-token: '${{ github.token }}', path: previous-review}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13595626273', run-id: '42425522122', merge-multiple: true, github-token: '${{ github.token }}', path: exact464}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13771187253', run-id: '42830516841', merge-multiple: true, github-token: '${{ github.token }}', path: signed80}
      - name: Exact native binary and full source map authenticated inside signed500
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13990558917', run-id: '43314732573', merge-multiple: true, github-token: '${{ github.token }}', path: baseline500-native}
      - name: Restore exact500 native source and apply reviewed native allowlist
        run: python repairs/infinity-consolidated-2103500-20261115/build_native.py prepare
      - name: Pinned official Ubuntu dependency tooling
        run: bash repairs/infinity-consolidated-2103500-20261115/prepare_ci_tooling.sh
      - uses: actions/cache@v4
        with: {path: /usr/local/lib/android/sdk/ndk/21.4.7075529, key: infinity-pinned-ndk-linux-21.4.7075529-v1}
      - name: Unchanged verified NDK and dependencies
        run: |
          bash native500-frozen-tools/repairs/android-checkpoint-shutdown/install_ndk.sh
          python repairs/infinity-consolidated-2103500-20261115/build_native.py dependencies
      - name: Full real ARM64 compile/link and exact500 ABI comparison
        run: python repairs/infinity-consolidated-2103500-20261115/build_native.py compile
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Infinity500-Native-ARM64-${{ github.run_id }}-NO-INSTALLER
          path: |
            native500-output/libkodi.so
            native500-output/ARM64.json
            native500-output/ABI-COMPARISON.json
            native500-output/SOURCE-PRESERVATION.json
            native500-output/NATIVE-SOURCE-MAP.json
          if-no-files-found: error
          compression-level: 1
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Infinity500-Native-Evidence-${{ github.run_id }}-NO-INSTALLER
          path: |
            native500-output/*.json
            native500-output/*.log
            native500-output/*.txt
          if-no-files-found: warn
          retention-days: 90

  fast-qa-stage:
    name: Assemble exact500 four-member unsigned QA input; original signing remains gated
    if: github.ref == 'refs/heads/work/infinity-2103500-consolidated-repair-20261115' && startsWith(github.event.head_commit.message, 'QA500 stage:')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      GH_TOKEN: '${{ github.token }}'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools build-tools;35.0.0 platforms;android-34', log-accepted-android-sdk-licenses: false}
      - name: Exact original-signed500 input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '14128448982', run-id: '43632329510', github-token: '${{ github.token }}', merge-multiple: true, path: fastqa-inputs/base}
      - name: Retain approved finished native engine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '14187138056', run-id: '43774504911', github-token: '${{ github.token }}', merge-multiple: true, path: fastqa-inputs/native}
      - name: Retain approved two-class Cast discovery DEX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '14180278660', run-id: '43762472390', github-token: '${{ github.token }}', merge-multiple: true, path: fastqa-inputs/cast}
      - name: Stage QA with exact500 input hashes and no original signing keys
        run: python3 repairs/infinity-consolidated-2103500-20261115/stage_fast_qa.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Infinity500-FastQA-${{ github.run_id }}-UNSIGNED-NOT-INSTALLABLE
          path: fastqa-output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Infinity500-FastQA-${{ github.run_id }}-FAILURE-NO-INSTALLER
          path: fastqa-output/QA-STAGING.json
          if-no-files-found: ignore
          retention-days: 30
