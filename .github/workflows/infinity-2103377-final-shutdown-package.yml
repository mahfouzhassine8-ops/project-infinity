name: Infinity | 2103377 package exact green shutdown repair
on:
  push:
    branches: [work/infinity-2103377-final-shutdown-package]
    paths:
      - '.github/workflows/infinity-2103377-final-shutdown-package.yml'
      - 'repairs/shutdown-final-2103377/package.py'
permissions: {contents: read, actions: read}
concurrency: {group: infinity-2103377-final-shutdown-package, cancel-in-progress: false}
env:
  NDK_VER: 21.4.7075529
  INFINITY_NATIVE_SOURCE_COMMIT: d04bd087ddcd92723c88b9405e19539f2176929c
jobs:
  signed-test-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-${{ runner.os }}-21.4.7075529-v1
      - run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - uses: actions/download-artifact@v8
        with:
          run-id: 38422970383
          name: Infinity-2103377-Final-Shutdown-Native-Evidence
          github-token: ${{ github.token }}
          path: native-evidence
      - uses: actions/download-artifact@v8
        with:
          run-id: 38422970383
          name: Infinity-2103377-Final-Shutdown-Android
          github-token: ${{ github.token }}
          path: android-evidence
      - uses: actions/download-artifact@v8
        with:
          run-id: 38323908660
          name: Cobra-2103376-Critical-Preview-Signed-Test-APK
          github-token: ${{ github.token }}
          path: parent-apk
      - name: Permanently sign exact green corrections and verify locked payload
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          python3 repairs/shutdown-final-2103377/package.py --parent parent-apk/Cobra-2103376-Critical-Preview-RC1.apk --donor android-evidence/donor.apk --native native-evidence --android android-evidence --out final-shutdown-apk
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103377-Final-Shutdown-Signed-Test-APK
          path: final-shutdown-apk/Infinity-2103377-Final-Shutdown-RC1.apk
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103377-Final-Shutdown-Package-Receipts
          path: |
            final-shutdown-apk/*.json
            final-shutdown-apk/*.txt
            final-shutdown-apk/*.sha256
          retention-days: 90
          if-no-files-found: error
