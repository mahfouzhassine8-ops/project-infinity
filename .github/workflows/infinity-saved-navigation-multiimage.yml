name: Infinity corrective APK packaging - independent of runtime tests
on:
  push:
    branches: [work/infinity-saved-route-correction-20261023]
    paths:
      - '.github/workflows/infinity-saved-navigation-multiimage.yml'
      - 'repairs/save-later-multiimage-20261023/tracking/overlay/**'
      - 'repairs/save-later-multiimage-20261023/tracking/SCOPE.json'
      - 'repairs/save-later-multiimage-20261023/tracking/parent_saved_navigation.py'
      - 'repairs/save-later-multiimage-20261023/saved_navigation.py'
      - 'repairs/save-later-multiimage-20261023/component_contract.py'
      - 'repairs/save-later-multiimage-20261023/native_contract.py'
      - 'repairs/save-later-multiimage-20261023/navigation_native.py'
      - 'repairs/save-later-multiimage-20261023/owner_binding.py'
      - 'repairs/save-later-multiimage-20261023/build.py'
      - 'repairs/save-later-multiimage-20261023/dex_binding.py'
      - 'repairs/save-later-multiimage-20261023/final_eight_native.py'
      - 'repairs/save-later-multiimage-20261023/tracking/final-eight/overlay/**'
      - 'repairs/save-later-multiimage-20261023/universal/overlay/**'
      - 'repairs/save-later-multiimage-20261023/universal/SCOPE.json'
      - 'repairs/save-later-multiimage-20261023/universal/OVERLAY-PREIMAGES.json'
      - 'repairs/save-later-multiimage-20261023/universal/InfinitySearch101.java'
      - 'repairs/save-later-multiimage-20261023/universal/search_dex.py'
      - 'repairs/save-later-multiimage-20261023/universal/PreserveSearchPrimary.java'
      - 'repairs/save-later-multiimage-20261023/universal/information_native.py'
      - 'repairs/save-later-multiimage-20261023/performance/overlay/**'
      - 'repairs/save-later-multiimage-20261023/performance/SCOPE.json'
      - 'repairs/save-later-multiimage-20261023/performance/OVERLAY-PREIMAGES.json'
      - 'repairs/save-later-multiimage-20261023/performance/BASE34-CONTROLLER-PINS.json'
      - 'repairs/save-later-multiimage-20261023/performance/reference.py'
      - 'repairs/save-later-multiimage-20261023/performance/popup_native.py'
      - 'repairs/save-later-multiimage-20261023/performance/selection_native.py'
  workflow_dispatch:
    inputs:
      authorization:
        description: User-authorized correction to compile and package; tests are selected separately
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-saved-navigation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: ARM64 compilation, permanent signing and package integrity only
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    env:
      NDK_VER: 21.4.7075529
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
      PYTHONDONTWRITEBYTECODE: '1'
      AUTHORIZED_SCOPE: ${{ inputs.authorization }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - name: Require authorized correction scope and unchanged protected source
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          if os.environ['GITHUB_EVENT_NAME']=='push':
              assert os.environ['GITHUB_REF']=='refs/heads/work/infinity-saved-route-correction-20261023', 'Unapproved build branch'
              with open('repairs/save-later-multiimage-20261023/tracking/SCOPE.json') as file:
                  scope=json.load(file)
              assert scope['authorization']=='2026-10-23 user-approved end-to-end tracking/navigation/responsiveness correction, execute in stated priority', 'Build scope is not user-authorized'
              assert scope['cobra_modifications'] is False, 'Cobra protection changed'
              assert {'shutdown','Normal Close','Essential-First','Close/reopen'}.issubset(set(scope['forbidden_tests'])), 'Shutdown isolation changed'
              assert 'compilation/signing/component binding/package and data integrity relevant to these changes' in scope['allowed_tests'], 'Signing not authorized by tracked scope'
          elif os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch':
              assert os.environ['AUTHORIZED_SCOPE'].strip(), 'Explicit correction scope required'
          else:
              raise RuntimeError('Unapproved build trigger')
          with open('repairs/save-later-multiimage-20261023/tracking/final-eight/SCOPE.json') as file:
              final_scope=json.load(file)
          assert final_scope['authorization']=='2026-10-24 final eight corrective takeover'
          assert final_scope['cobra_modifications'] is False
          assert final_scope['shutdown_tests']=='NOT RUN; independent'
          import hashlib,pathlib
          repair=pathlib.Path('repairs/save-later-multiimage-20261023')
          for name,pin in final_scope['locked_trackit_files'].items():
              assert hashlib.sha256((repair/name).read_bytes()).hexdigest()==pin, 'Locked TrackIt changed: '+name
          paths=subprocess.check_output(['git','diff','--name-only','8df2e26f481eb7ff2d791c8cab39548de949d030','HEAD'],text=True).splitlines()
          assert paths and all(p.startswith('repairs/save-later-multiimage-20261023/') or p in {'.github/workflows/infinity-saved-navigation-multiimage.yml','.github/workflows/infinity-saved-navigation-android.yml','.github/workflows/infinity-shutdown-verification.yml','.github/scripts/test_infinity_focused_policy.py','AGENTS.md','docs/INFINITY-FOCUSED-TESTING-POLICY.md'} for p in paths),paths
          assert not any('cobra' in p.lower() for p in paths),paths
          universal=json.loads((repair/'universal/SCOPE.json').read_text())
          assert universal['baseline_commit']=='07c7a9d6e488fe8cea091de792547f16e97c884d'
          assert universal['cobra_modifications'] is False and universal['original_signer_required'] is True
          assert universal['shutdown_tests']=='NOT RUN; independent'
          assert universal['branch']=='work/infinity-saved-route-correction-20261023'
          subprocess.run(['git','merge-base','--is-ancestor',universal['baseline_commit'],'HEAD'],check=True)
          subprocess.run(['git','merge-base','--is-ancestor',universal['preserved_checkpoint'],'HEAD'],check=True)
          performance=json.loads((repair/'performance/SCOPE.json').read_text())
          assert performance['authorization']=='2026-10-24 critical performance refresh responsive polish addendum; continue implement optimize verify integrate'
          assert performance['baseline_commit']=='c0dba465e6b74af7bd82ea0c16755d5bf7508f1e'
          assert performance['baseline_build']=='40086558043'
          assert performance['cobra_modifications'] is False and performance['trackit_route_memory_modifications'] is False
          assert performance['original_signer_required'] is True and performance['shutdown_tests']=='NOT RUN; independent'
          subprocess.run(['git','merge-base','--is-ancestor',performance['baseline_commit'],'HEAD'],check=True)
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 39868217775
          name: Infinity-Universal-Persistence-INTERNAL-QA-NOT-ACCEPTED
          github-token: ${{ github.token }}
          path: rc8-input
      - uses: actions/download-artifact@v4
        with:
          run-id: 39862996414
          name: Infinity-Universal-Persistence-INTERNAL-QA-NOT-ACCEPTED
          github-token: ${{ github.token }}
          path: rc7-native-modes
      - uses: actions/download-artifact@v4
        with:
          run-id: 39867073954
          name: Infinity-Receipt-Race-Android17-Investigation
          github-token: ${{ github.token }}
          path: verified-dex-tools
      - uses: actions/download-artifact@v4
        with:
          run-id: 38132105717
          name: Infinity-2103367-Verified-Compiler-Dependencies
          github-token: ${{ github.token }}
          path: dependency-transfer
      - uses: actions/download-artifact@v4
        with:
          run-id: 39994772688
          name: Infinity-Saved-Navigation-MultiImage-INTERNAL-QA-NOT-ACCEPTED
          github-token: ${{ github.token }}
          path: signed-navigation-proof
      - uses: actions/download-artifact@v4
        with:
          run-id: 40086558043
          name: Infinity-Saved-Navigation-MultiImage-INTERNAL-QA-NOT-ACCEPTED
          github-token: ${{ github.token }}
          path: signed-universal-reference
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools build-tools;34.0.0 platforms;android-34
          log-accepted-android-sdk-licenses: false
      - name: Restore passed compiler dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y python3-yaml python3-dev libsqlite3-dev libssl-dev libffi-dev
          (cd rc8-input && sha256sum -c SHA256SUMS)
          (cd rc7-native-modes && sha256sum -c SHA256SUMS)
          (cd signed-navigation-proof && sha256sum -c SHA256SUMS)
          (cd signed-universal-reference && sha256sum -c SHA256SUMS)
          (cd dependency-transfer && sha256sum -c SHA256SUMS)
          tar --no-same-owner -xf dependency-transfer/verified-android-dependencies.tar
          tar --no-same-owner -xf dependency-transfer/verified-compiler-cache.tar -C "$HOME"
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-linux-21.4.7075529-v1
      - run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - name: Stage exact source and required component ownership bindings
        run: |
          set -euo pipefail
          python3 repairs/save-later-multiimage-20261023/build.py prepare --parent rc8-input --modes rc7-native-modes
          python3 repairs/save-later-multiimage-20261023/dex_binding.py prepare --apk rc8-input/Infinity-2103401-Universal-Persistence-RC8-NOT-ACCEPTED.apk --stage targeted-component-overlay --jars verified-dex-tools/receipt-evidence/tool-jars --android "$ANDROID_HOME/platforms/android-34/android.jar" --d8 "$ANDROID_HOME/build-tools/34.0.0/d8" --out targeted-dex
          python3 repairs/save-later-multiimage-20261023/universal/search_dex.py --apk rc8-input/Infinity-2103401-Universal-Persistence-RC8-NOT-ACCEPTED.apk --primary targeted-dex/classes.dex --jars verified-dex-tools/receipt-evidence/tool-jars --android "$ANDROID_HOME/platforms/android-34/android.jar" --d8 "$ANDROID_HOME/build-tools/34.0.0/d8" --out targeted-search-dex
          git diff --exit-code
      - name: Compile only the complete matching native engine
        run: |
          set -euo pipefail
          python3 repairs/save-later-multiimage-20261023/build.py compile 2>&1 | tee checkpoint-targeted/NATIVE-COMPILATION.log
          git diff --exit-code
      - name: Permanently sign internal QA candidate and verify every member delta
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 repairs/save-later-multiimage-20261023/build.py package --parent rc8-input --dex targeted-dex --out targeted-internal-qa
          (cd targeted-internal-qa && sha256sum -c SHA256SUMS)
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: Infinity-Saved-Navigation-MultiImage-INTERNAL-QA-NOT-ACCEPTED
          path: targeted-internal-qa/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Infinity-Saved-Navigation-MultiImage-Build-Evidence
          path: |
            checkpoint-targeted/*.json
            checkpoint-targeted/*.log
            checkpoint-targeted/*.sh
            targeted-dex/DEX-PRESERVATION.json
            targeted-dex/ORIGINAL-CALLERS.json
            targeted-dex/EXACT-FIELDS.log
            targeted-search-dex/SEARCH-DEX-PRESERVATION.json
            targeted-search-dex/SEARCH-PRIMARY-PRESERVATION.log
          retention-days: 90
          if-no-files-found: warn
