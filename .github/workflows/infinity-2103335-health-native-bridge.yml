name: Infinity | 2103335 Health native trace bridge
on:
  workflow_dispatch:
  push:
    branches: [repair/infinity-health-native-bridge-2103335]
    paths:
      - 'repairs/health-native-bridge-2103335/**'
      - '.github/workflows/infinity-2103335-health-native-bridge.yml'
permissions: {contents: read, actions: read}
concurrency: {group: infinity-2103335-health-native-bridge, cancel-in-progress: true}
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 ndk;21.4.7075529'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 37732755842
          name: Infinity-2103334-Delivery-Evidence
          github-token: ${{ github.token }}
          path: parent3334
      - uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 37732755842
          name: Infinity-2103334-Script-Exit-RC1-APK
          github-token: ${{ github.token }}
          path: base3334
      - name: Verify exact 2103334 parent and prepare Android-only diagnostic bridge
        run: |
          set -euo pipefail
          mkdir -p source3334 evidence3335 "$HOME/.android"
          python3 -m py_compile repairs/health-native-bridge-2103335/*.py
          tar --no-same-owner -xzf parent3334/repaired-shell-source.tar.gz -C source3334
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          python3 repairs/health-native-bridge-2103335/package.py prepare             --source source3334/shell-kodi             --proof parent3334/SOURCE-PRESERVATION.json             --base base3334/Infinity-2103334-Script-Exit-RC1.apk             --build build3335 --out evidence3335
      - name: Compile Android bridge and run focused exporter tests
        env:
          KODI_ANDROID_KEY_ALIAS: androiddebugkey
          KODI_ANDROID_KEY_PASSWORD: android
          KODI_ANDROID_STORE_PASSWORD: android
          KODI_ANDROID_STORE_FILE: ${{ runner.home }}/.android/debug.keystore
        run: |
          set -euo pipefail
          ./build3335/gradlew --no-daemon --console=plain -p build3335             :xbmc:testReleaseUnitTest             --tests com.projectinfinity.kodi.NativeTraceBridge335Test             :xbmc:assembleRelease :xbmc:exportPreservationTools
      - name: Verify byte-preserved native payload, DEX scope and permanent signer
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 repairs/health-native-bridge-2103335/package.py package             --source source3334/shell-kodi             --proof parent3334/SOURCE-PRESERVATION.json             --base base3334/Infinity-2103334-Script-Exit-RC1.apk             --build build3335 --out evidence3335
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103335-Native-Trace-Bridge-RC1-APK
          path: evidence3335/Infinity-2103335-Native-Trace-Bridge-RC1.apk
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - name: Prepare compact delivery evidence
        if: success()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          out=Path('compact3335');out.mkdir()
          apk=Path('evidence3335/Infinity-2103335-Native-Trace-Bridge-RC1.apk')
          (out/'DELIVERY.json').write_text(json.dumps({
            'file':apk.name,'size':apk.stat().st_size,'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
            'apk_parent':2103334,'native_recompiled':False,'shutdown_behavior_changed':False,
            'purpose':'Expose existing current/previous native critical shutdown timelines in Health Center report.txt',
            'locked':False},indent=2)+'\n')
          for p in Path('evidence3335').iterdir():
              if p.is_file() and p.suffix not in ('.apk','.so') and p.stat().st_size<24*1024*1024:
                  shutil.copy2(p,out/p.name)
          PY
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103335-Delivery-Evidence
          path: compact3335/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103335-Verification
          path: |
            evidence3335/
            !evidence3335/*.apk
            build3335/xbmc/build/test-results/testReleaseUnitTest/
            build3335/xbmc/build/reports/tests/testReleaseUnitTest/
          compression-level: 1
          retention-days: 90
          if-no-files-found: warn
