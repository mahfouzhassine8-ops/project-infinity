name: Infinity | 2103339 selective Kodi22 native
on:
  workflow_dispatch:
  push:
    branches: [work/kodi22-selective-shutdown-2103339]
    paths:
      - 'repairs/kodi22-selective-2103339/native.py'
      - 'repairs/kodi22-selective-2103339/test_native.py'
      - '.github/workflows/infinity-2103339-selective-native.yml'
permissions: {contents: read, actions: read}
concurrency: {group: infinity-2103339-selective-native, cancel-in-progress: false}
env:
  NDK_VER: 21.4.7075529
jobs:
  native-engine:
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    env:
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build-3339
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - name: Verify isolated source delta and host tooling
        run: |
          set -euo pipefail
          mkdir -p engine3339
          git diff --name-only 2bb8f12f700ee69fe5d86629e6639bc0b1a0b79e HEAD > engine3339/repository-delta.txt
          python3 - <<'PY'
          from pathlib import Path
          names=Path('engine3339/repository-delta.txt').read_text().splitlines()
          assert names
          assert all(n.startswith('repairs/kodi22-selective-2103339/') or n.startswith('.github/workflows/infinity-2103339-') for n in names),names
          PY
          sudo apt-get update -qq
          sudo apt-get install -y python3-yaml python3-dev g++
          python3 -m py_compile repairs/kodi22-selective-2103339/*.py
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            ~/.ccache
          key: infinity-piers-3339-arm64-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            infinity-piers-3339-arm64-${{ runner.os }}-
            infinity-jobmanager-3327-arm64-${{ runner.os }}-
            infinity-cooperative-3326-arm64-${{ runner.os }}-
            infinity-diagnostics-3325-arm64-${{ runner.os }}-
            infinity-shutdown-3313-arm64-${{ runner.os }}-
            infinity-close-3308-arm64-${{ runner.os }}-
            infinity-provider-3306-arm64-${{ runner.os }}-
      - name: Reconstruct approved engine and apply only upstream player fix
        run: |
          set -euo pipefail
          python3 repairs/kodi22-selective-2103339/native.py reconstruct 2>&1 | tee engine3339/source-and-tests.log
      - name: Test actual player-close method and real Kodi lock helpers
        run: |
          set -euo pipefail
          python3 repairs/kodi22-selective-2103339/test_native.py 2>&1 | tee engine3339/player-host-tests.log
          python3 repairs/kodi22-selective-2103339/native.py verify
      - name: Retain exact reviewed source and host evidence before compile
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103339-Reviewed-Source
          path: |
            engine3339/source-manifest.json
            engine3339/native-reviewed.patch
            engine3339/StopPlaying-*.cpp
            engine3339/HOST-TESTS.json
            engine3339/player-host-tests.log
            engine3339/reviewed-native-source.tar.gz
          compression-level: 1
          retention-days: 90
          if-no-files-found: error
      - uses: actions/cache/restore@v4
        with:
          path: kodi/tools/depends
          key: infinity-piers-3339-depends-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            infinity-piers-3339-depends-${{ runner.os }}-
            infinity-cooperative-3326-depends-${{ runner.os }}-
            infinity-provider-3306-depends-build-${{ runner.os }}-
      - name: Compile fresh ARM64 libkodi and recheck every protected source input
        run: |
          set -euo pipefail
          python3 repairs/kodi22-selective-2103339/native.py compile 2>&1 | tee engine3339/native-build.log
      - uses: actions/cache/save@v4
        if: always() && !cancelled()
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            ~/.ccache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Upload compiled candidate only after all gates pass
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103339-Selective-Native
          path: |
            engine3339/libkodi.so
            engine3339/ENGINE-PROOF.json
            engine3339/source-manifest.json
            engine3339/native-reviewed.patch
            engine3339/HOST-TESTS.json
            engine3339/elf-identity.txt
          compression-level: 1
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103339-Native-Verification
          path: |
            engine3339/
            !engine3339/libkodi.so
            !engine3339/reviewed-native-source.tar.gz
          compression-level: 1
          retention-days: 90
          if-no-files-found: warn
