name: Infinity 2103402 functional UI-only QA signed APK
on:
  push:
    branches: [work/infinity-2103402-functional-qa-20261024]
    paths:
      - "repairs/infinity-2103402-final/**"
      - ".github/workflows/infinity-2103402-functional-qa.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: infinity-2103402-functional-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Locked-baseline UI overlay, exact-delta, signer identity and QA artifact
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      INFINITY_BASELINE_APK: ${{ github.workspace }}/signed-2103401/Infinity-2103401-Universal-Performance-QA.apk
      INFINITY_SIGNED_CC35_ZIP: ${{ github.workspace }}/signed-2103401/script.infinity.commandcenter-0.3.5.35.zip
      INFINITY_SIGNED_SKIN242_ZIP: ${{ github.workspace }}/signed-2103401/skin.infinity.diggz-1.0.5.242.zip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 40089463702
          name: Infinity-Saved-Navigation-MultiImage-INTERNAL-QA-NOT-ACCEPTED
          github-token: ${{ github.token }}
          path: signed-2103401
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.7"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;35.0.0 platforms;android-34"
          log-accepted-android-sdk-licenses: false
      - name: Fail closed on source boundary and signed reference identity
        run: |
          set -euo pipefail
          (cd signed-2103401 && sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          from subprocess import check_output
          names=check_output(['git','diff','--name-only','1738478709cd8881f7ad4a524e7abbbc82b5d79c','HEAD'],text=True).splitlines()
          allowed=lambda n: (n.startswith('repairs/infinity-2103402-final/') or
                  n in ('handoffs/INFINITY-2103402-FINAL-STABILIZATION-AUTHORIZED-20261024.md',
                        'handoffs/INFINITY-2103402-ASTRA-TAKEOVER-CHECKPOINT-20261024.md',
                        '.github/workflows/infinity-2103402-scoped-tests.yml',
                        '.github/workflows/infinity-saved-navigation-android.yml',
                        '.github/workflows/infinity-2103402-functional-qa.yml'))
          assert names and all(map(allowed,names)), 'Unapproved source change: '+repr([n for n in names if not allowed(n)])
          assert not any('cobra' in n.lower() for n in names), 'Cobra is protected'
          PY
          (cd repairs/infinity-2103402-final && python3 -m unittest -v \
            test_staging_audit test_visual_scope test_clock_reflow_scope \
            test_home_reflow_scope test_information_spacing_scope)
      - name: Stage only pinned 2103402 UI and Home patches
        run: |
          set -euo pipefail
          python3 repairs/infinity-2103402-final/package_functional_qa.py make --baseline signed-2103401 --out ui-qa
      - name: Align using Android SDK, permanently sign with original release key
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${INFINITY_KEYSTORE_B64:?Existing release keystore secret required}"
          : "${INFINITY_STORE_PASSWORD:?Existing keystore password required}"
          : "${INFINITY_KEY_PASSWORD:?Existing private-key password required}"
          : "${INFINITY_KEY_ALIAS:?Existing signing key alias required}"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          printf '%s' "$INFINITY_KEYSTORE_B64" | base64 -d > ui-qa/qa-keystore.jks
          chmod 600 ui-qa/qa-keystore.jks
          if "$ZIPALIGN" -h 2>&1 | grep -q -- '-P'; then
            "$ZIPALIGN" -P 16 -f 4 ui-qa/unsigned-2103402.apk ui-qa/aligned-2103402.apk
          else
            "$ZIPALIGN" -p -f 4 ui-qa/unsigned-2103402.apk ui-qa/aligned-2103402.apk
          fi
          "$SIGNER" sign \
            --ks ui-qa/qa-keystore.jks \
            --ks-key-alias "$INFINITY_KEY_ALIAS" \
            --ks-pass env:INFINITY_STORE_PASSWORD \
            --key-pass env:INFINITY_KEY_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out ui-qa/Infinity-2103402-Functional-Corrective-QA.apk \
            ui-qa/aligned-2103402.apk
          "$SIGNER" verify --verbose --print-certs "$INFINITY_BASELINE_APK" > ui-qa/ORIGINAL-SIGNATURE.txt
          "$SIGNER" verify --verbose --print-certs ui-qa/Infinity-2103402-Functional-Corrective-QA.apk > ui-qa/QA-SIGNATURE.txt
          python3 - <<'PY'
          import re,pathlib
          p=pathlib.Path('ui-qa')
          pattern=r'Signer #1 certificate SHA-256 digest:\s*([0-9a-fA-F]{64})'
          original=re.search(pattern,(p/'ORIGINAL-SIGNATURE.txt').read_text())
          new=re.search(pattern,(p/'QA-SIGNATURE.txt').read_text())
          assert original and new, 'apksigner returned no certificate fingerprints'
          accepted='d7adeb68e9341596a02bd3262b737a0f45fc6e771ed7e60285437e833b58c6d7'
          assert original.group(1).lower()==new.group(1).lower()==accepted, 'Signing key mismatch'
          print('Original Infinity signing certificate exactly retained')
          PY
          "$AAPT" dump badging ui-qa/Infinity-2103402-Functional-Corrective-QA.apk | grep -E "^package: name='com.projectinfinity.kodi' versionCode='2103402'"
          python3 repairs/infinity-2103402-final/package_functional_qa.py verify \
            --baseline signed-2103401 \
            --signed ui-qa/Infinity-2103402-Functional-Corrective-QA.apk
          rm -f ui-qa/qa-keystore.jks ui-qa/unsigned-2103402.apk ui-qa/aligned-2103402.apk
          (cd ui-qa && sha256sum *.apk *.zip > SHA256SUMS)
      - name: Upload signed install-over QA and exact component ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-2103402-FUNCTIONAL-UI-QA-SIGNED-UNVERIFIED-ON-FOLD
          path: |
            ui-qa/Infinity-2103402-Functional-Corrective-QA.apk
            ui-qa/script.infinity.commandcenter-0.3.5.36.zip
            ui-qa/script.infinity.uirepair-0.1.18.zip
            ui-qa/script.infinity.watchedbridge-1.0.16.zip
            ui-qa/skin.infinity.diggz-1.0.5.243.zip
            ui-qa/QA-STAGE-RECEIPT.json
            ui-qa/ORIGINAL-SIGNATURE.txt
            ui-qa/QA-SIGNATURE.txt
            ui-qa/SHA256SUMS
          retention-days: 90
          if-no-files-found: error
