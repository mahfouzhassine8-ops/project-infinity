name: G2 Candidate 6 - Side-by-Side Device Test
run-name: 'G2 Candidate #6 | side-by-side test without touching #5'

on:
  workflow_dispatch:
  push:
    branches: [g2-candidate-6-mapping]
    paths:
      - '.github/workflows/build-g2-candidate6-side-by-side.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: g2-candidate6-side-by-side
  cancel-in-progress: false

jobs:
  package-test-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;34.0.0 platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Download the already-verified unsigned Candidate 6
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source out
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/mahfouzhassine8-ops/project-infinity/actions/artifacts/10078340957/zip' \
            -o source/candidate6.zip
          echo 'a571b0c0488c3726e6134d601b13beb42bf67f7ba2ec0e8adbc05a7473f52568  source/candidate6.zip' | sha256sum -c -
          unzip -q source/candidate6.zip -d source/unpacked
          APK=$(find source/unpacked -type f -name 'G2-Candidate-6-unsigned.apk' -print -quit)
          test -n "$APK"
          cp "$APK" source/G2-Candidate-6-unsigned.apk
          echo 'dbe2922171d77a15dfc2138e517956d92db4aa0f8d559d19b2620ed99ba461b4  source/G2-Candidate-6-unsigned.apk' | sha256sum -c -

      - name: Install Apktool
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar \
            -o apktool.jar
          echo '56d59c524fc764263ba8d345754d8daf55b1887818b15cd3b594f555d249e2db  apktool.jar' | sha256sum -c -

      - name: Give Candidate 6 its own Android package identity
        shell: bash
        run: |
          set -euo pipefail
          java -jar apktool.jar d -f source/G2-Candidate-6-unsigned.apk -o work
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = Path('work/AndroidManifest.xml')
          tree = ET.parse(manifest)
          root = tree.getroot()
          android = 'http://schemas.android.com/apk/res/android'
          A = lambda n: '{%s}%s' % (android, n)

          old_pkg = root.attrib.get('package')
          expected = 'com.projectinfinity.kodi'
          new_pkg = 'com.projectinfinity.kodi.candidate6test'
          if old_pkg != expected:
              raise SystemExit(f'Refusing unexpected package: {old_pkg!r}')

          # A different package ID is deliberate: Android can install this beside #5
          # even though #5's original private signing key no longer exists.
          root.set('package', new_pkg)

          component_tags = {
              'application', 'activity', 'activity-alias', 'service',
              'receiver', 'provider', 'instrumentation'
          }
          identity_attrs = {
              A('authorities'), A('permission'), A('readPermission'),
              A('writePermission'), A('taskAffinity'), A('process')
          }

          for elem in root.iter():
              tag = elem.tag.rsplit('}', 1)[-1]
              name = elem.attrib.get(A('name'))
              if name and tag in component_tags:
                  # Preserve the actual Java class namespace. Changing the app package
                  # must not point Android at nonexistent candidate6test Java classes.
                  if name.startswith('.'):
                      elem.set(A('name'), old_pkg + name)
                  elif '.' not in name:
                      elem.set(A('name'), old_pkg + '.' + name)
              elif name and name.startswith(old_pkg + '.'):
                  # Custom permission identities should be unique to the test package.
                  if tag in {'permission', 'uses-permission', 'uses-permission-sdk-23'}:
                      elem.set(A('name'), new_pkg + name[len(old_pkg):])

              for attr in identity_attrs:
                  value = elem.attrib.get(attr)
                  if value and old_pkg in value:
                      elem.set(attr, value.replace(old_pkg, new_pkg))

          app = root.find('application')
          if app is None:
              raise SystemExit('No application element')
          app.set(A('label'), 'Infinity Candidate 6')

          ET.register_namespace('android', android)
          tree.write(manifest, encoding='utf-8', xml_declaration=True)
          print(f'Side-by-side package: {old_pkg} -> {new_pkg}')
          PY

      - name: Rebuild side-by-side Candidate 6
        shell: bash
        run: |
          set -euo pipefail
          java -jar apktool.jar b work -o out/G2-Candidate-6-side-by-side-unsigned.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging out/G2-Candidate-6-side-by-side-unsigned.apk | tee out/badging-before-sign.txt
          grep -q "package: name='com.projectinfinity.kodi.candidate6test'" out/badging-before-sign.txt

      - name: Sign TEST package with a disposable identity
        shell: bash
        env:
          PASS: candidate6test-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          keytool -genkeypair \
            -keystore out/candidate6-test.keystore \
            -alias candidate6test \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname 'CN=Infinity Candidate 6 Side-by-Side Test,O=Infinity,C=US' \
            >/dev/null 2>&1
          "$BT/zipalign" -f 4 \
            out/G2-Candidate-6-side-by-side-unsigned.apk \
            out/G2-Candidate-6-side-by-side-aligned.apk
          "$BT/apksigner" sign \
            --ks out/candidate6-test.keystore \
            --ks-key-alias candidate6test \
            --ks-pass env:PASS --key-pass env:PASS \
            --out out/G2-Candidate-6-SIDE-BY-SIDE-TEST.apk \
            out/G2-Candidate-6-side-by-side-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs \
            out/G2-Candidate-6-SIDE-BY-SIDE-TEST.apk \
            | tee out/signature.txt
          "$BT/aapt" dump badging out/G2-Candidate-6-SIDE-BY-SIDE-TEST.apk \
            | tee out/badging.txt
          grep -q "package: name='com.projectinfinity.kodi.candidate6test'" out/badging.txt
          rm -f out/candidate6-test.keystore \
            out/G2-Candidate-6-side-by-side-unsigned.apk \
            out/G2-Candidate-6-side-by-side-aligned.apk

      - name: Write safety/readme note
        shell: bash
        run: |
          cat > out/READ-ME-FIRST.txt <<'EOF'
          G2 Candidate #6 SIDE-BY-SIDE TEST

          This APK intentionally uses package:
          com.projectinfinity.kodi.candidate6test

          It is NOT an update for installed G2 #5 and will NOT replace #5.
          #5 remains installed with its existing app data untouched.

          Candidate #6 contains the already-verified mapper-only change from artifact 10078340957.
          Because it is a different Android package, its private app data starts separately.

          Do not uninstall #5.
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: G2-Candidate-6-SIDE-BY-SIDE-TEST
          path: |
            out/G2-Candidate-6-SIDE-BY-SIDE-TEST.apk
            out/READ-ME-FIRST.txt
            out/badging.txt
            out/signature.txt
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
