name: Infinity | 2103377 RC2 package exact green native and 274 Java
on:
  push:
    branches: [work/infinity-2103377-shutdown-drain-rc2]
    paths:
      - '.github/workflows/infinity-2103377-drain-rc2-green-package.yml'
permissions: {contents: read, actions: read}
concurrency: {group: infinity-2103377-rc2-package-green, cancel-in-progress: false}
env:
  NDK_VER: 21.4.7075529
  INFINITY_NATIVE_SOURCE_COMMIT: 633b8d9444527eb8df5dbbf291c787fd03766b2d
jobs:
  rc2-signed-test-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: 'platform-tools build-tools;34.0.0', log-accepted-android-sdk-licenses: false}
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-${{ runner.os }}-21.4.7075529-v1
      - run: bash repairs/android-checkpoint-shutdown/install_ndk.sh

      # The fully compiled RC2 native library and nine targeted C++ cases have
      # already passed. This job never compiles or modifies that native library.
      - uses: actions/download-artifact@v8
        with:
          run-id: 38488207608
          name: Infinity-2103377-Drain-RC2-Native-Evidence
          github-token: '${{ github.token }}'
          path: native-evidence
      # Separate independently green replay: original 274 unchanged Android
      # cases from run 38415112606 plus complete source/donor identity check.
      - uses: actions/download-artifact@v8
        with:
          run-id: 38489062045
          name: Infinity-2103377-Drain-RC2-Android-Preserved-274
          github-token: '${{ github.token }}'
          path: android-evidence
      - uses: actions/download-artifact@v8
        with:
          run-id: 38351703759
          name: Infinity-2103377-Android-Verification
          github-token: '${{ github.token }}'
          path: green-234
      - uses: actions/download-artifact@v8
        with:
          run-id: 38323908660
          name: Cobra-2103376-Critical-Preview-Signed-Test-APK
          github-token: '${{ github.token }}'
          path: parent-apk

      - name: Recheck 274 test/source identities without re-running or rebuilding old tests
        run: |
          set -euo pipefail
          python3 repairs/shutdown-final-2103377/reuse_android.py --folder android-evidence --green green-234
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          pinned=json.loads(Path('repairs/shutdown-drain-2103377/RC2-GREEN-SAVED.json').read_text())
          root=Path('native-evidence/checkpoint-build')
          proof=json.loads((root/'ENGINE-PROOF.json').read_text())
          android=json.loads(Path('android-evidence/ANDROID-VERIFICATION.json').read_text())
          reuse=json.loads(Path('android-evidence/ANDROID-REUSE-PROOF.json').read_text())
          host=json.loads((root/'RC2-PRUNE-HOST-TESTS.json').read_text())
          assert proof['source_commit']==pinned['native']['source_commit']
          assert proof['complete_native_engine_compiled'] and proof['rc2_optional_queued_prune_compiled']
          assert proof['native_sha256']==hashlib.sha256((root/'libkodi.so').read_bytes()).hexdigest()
          assert host['passed']==host['tests']==9
          assert android['source_commit']==pinned['android']['original_tested_source_sha']
          assert android['totals']==dict(tests=274,failures=0,errors=0,skipped=0)
          assert reuse['source_commit']==__import__('os').environ['GITHUB_SHA']
          assert reuse['runtime_source_byte_identical'] and reuse['fresh_test_results_preserved']
          assert hashlib.sha256(Path('android-evidence/donor.apk').read_bytes()).hexdigest()==reuse['donor_sha256']
          print('PASS: reused exact green native + 9 native tests + original 274 Java cases; current Java source reverified byte-identically')
          PY

      - name: Permanently sign exact preverified RC2 and protect locked payload
        env:
          INFINITY_KEYSTORE_B64: '${{ secrets.INFINITY_KEYSTORE_B64 }}'
          INFINITY_STORE_PASSWORD: '${{ secrets.INFINITY_STORE_PASSWORD }}'
          INFINITY_KEY_PASSWORD: '${{ secrets.INFINITY_KEY_PASSWORD }}'
          INFINITY_KEY_ALIAS: '${{ secrets.INFINITY_KEY_ALIAS }}'
        run: |
          set -euo pipefail
          python3 repairs/shutdown-final-2103377/package.py \
            --parent parent-apk/Cobra-2103376-Critical-Preview-RC1.apk \
            --donor android-evidence/donor.apk \
            --native native-evidence --android android-evidence --out rc2-package

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103377-Drain-RC2-Signed-Test-APK
          path: rc2-package/Infinity-2103377-Shutdown-Drain-RC2.apk
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103377-Drain-RC2-Packaging-Receipts
          path: |
            rc2-package/*.json
            rc2-package/*.txt
            rc2-package/*.sha256
            android-evidence/ANDROID-REUSE-PROOF.json
            repairs/shutdown-drain-2103377/RC2-GREEN-SAVED.json
          if-no-files-found: warn
          retention-days: 90
