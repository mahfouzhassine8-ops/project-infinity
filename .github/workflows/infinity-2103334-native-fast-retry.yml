name: Infinity | 2103334 fast native retry
on:
  workflow_dispatch:
  push:
    branches: [repair/infinity-python-exit-2103334]
    paths:
      - 'repairs/python-exit-2103334/native_fast_retry.py'
      - '.github/workflows/infinity-2103334-native-fast-retry.yml'
permissions: {contents: read, actions: read}
concurrency: {group: infinity-2103334-native-fast-retry, cancel-in-progress: false}
env:
  NDK_VER: 21.4.7075529
jobs:
  native-engine:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}

      - name: Restore exact completed dependency and ccache snapshot from first 3334 compile
        id: completed-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            ~/.ccache
          key: infinity-python-exit-3334-arm64-${{ runner.os }}-37724566406

      - name: Require exact cache hit and prior successful host-test evidence
        env:
          CACHE_HIT: ${{ steps.completed-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "$CACHE_HIT" = "true"
          test -d "$DEPENDS/aarch64-linux-android-21-debug"
          test -d "$DEPENDS/x86_64-linux-gnu-native"

      - uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 37724566406
          name: Infinity-2103334-Host-Tests
          github-token: ${{ github.token }}
          path: prior-host-tests

      - name: Reconstruct exact reviewed 3334 source and rerun source-level gates
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y python3-yaml python3-dev
          test -s prior-host-tests/python-test.log
          test -s prior-host-tests/messenger-test.log
          mkdir -p engine3334
          python3 repairs/python-exit-2103334/native_ci.py prepare 2>&1 | tee engine3334/fast-source-tests.log

      - name: Recompile only from completed dependency prefix and verify reviewed source
        run: |
          set -euo pipefail
          python3 repairs/python-exit-2103334/native_fast_retry.py 2>&1 | tee engine3334/fast-native-build.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103334-Python-Exit-Native-Fast-Retry
          path: engine3334/
          compression-level: 1
          retention-days: 90
          if-no-files-found: error
