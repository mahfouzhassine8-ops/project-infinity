name: Infinity | Cobra Structural UI Bridge
on:
  workflow_dispatch:
  push:
    branches: [infinity-cobra-mobile-tv-guide-views]
    paths:
      - 'scripts/infinity_cobra_mobile_tv_guide_views.py'
      - '.github/workflows/infinity-cobra-mobile-tv-guide-views.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-cobra-structural-ui-bridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-update:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools}
      - uses: actions/download-artifact@v5
        with:
          name: Infinity-RC3-Cobra-Player-Presentation-Fix
          run-id: 35084976493
          github-token: ${{ github.token }}
          path: runtime2103141
      - name: Verify exact 2103141 signed presentation baseline
        run: |
          mkdir -p baseline background-candidate
          APK=$(find runtime2103141 -name '*.apk' -type f | head -1)
          test -s "$APK"
          cp "$APK" baseline/Infinity-2103141.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging baseline/Infinity-2103141.apk | tee baseline/badging.txt
          grep -q "versionCode='2103141'" baseline/badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs baseline/Infinity-2103141.apk | tee baseline/signing.txt
          grep -qi 'd7adeb68e9341596a02bd3262b737a0f45fc6e771ed7e60285437e833b58c6d7' baseline/signing.txt
      - name: Reconstruct exact RC3 Runtime v3 + 2103141 presentation source
        run: |
          bash scripts/infinity_live_app_ci_1.sh
          git -C kodi diff --binary -- xbmc > native-before.patch
          python3 scripts/infinity_background_resume.py --source kodi --receipt background-resume-source.json
          python3 scripts/infinity_background_control_bridge.py --source kodi --receipt background-resume-source.json --packager scripts/package_background_resume.py
          python3 scripts/infinity_cobra_async_lifecycle.py --source kodi --receipt background-resume-source.json --packager scripts/package_background_resume.py
          python3 scripts/apply_cobra_approved_ui.py --source kodi
          python3 scripts/infinity_1_0_9_cobra_zip_ui_runtime_matcher_fix.py --source kodi
          python3 scripts/infinity_cobra_ui_frontend_matcher_fix.py --source kodi
          python3 scripts/infinity_cobra_player_presentation_fix.py --source kodi
      - name: Apply structural ZIP UI bridge
        run: |
          python3 -m py_compile scripts/infinity_cobra_mobile_tv_guide_views.py
          python3 scripts/infinity_cobra_mobile_tv_guide_views.py --source kodi
          JAVA=kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          for token in 'MOBILE VIEW' 'TV GUIDE  ▦' 'showCobraChannelActions(channel)' 'selectGuidePreview(channel)' 'select again for fullscreen' 'COBRA VIEW  •  '; do grep -Fq "$token" "$JAVA" || { echo "missing $token"; exit 1; }; done
          git -C kodi diff --binary -- xbmc > native-after.patch
          cmp native-before.patch native-after.patch
      - name: Promote presentation runtime to 2103142
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('kodi/tools/android/packaging/xbmc/build.gradle.in');s=p.read_text()
          s=re.sub(r'versionCode \d+','versionCode 2103142',s,count=1)
          s=re.sub(r'versionName "[^"]+"','versionName "1.0.9-Cobra-Structural-UI-Bridge"',s,count=1);p.write_text(s)
          q=Path('scripts/infinity_background_resume.py');t=q.read_text();t=re.sub(r'VERSION_CODE = \d+','VERSION_CODE = 2103142',t,count=1);t=re.sub(r"RELEASE = '[^']+'","RELEASE = '1.0.9-Cobra-Structural-UI-Bridge'",t,count=1);q.write_text(t)
          pack=Path('scripts/package_background_resume.py');u=pack.read_text();u=re.sub(r'Infinity-1\.0\.9-[A-Za-z0-9-]+','Infinity-1.0.9-Cobra-Structural-UI-Bridge',u);pack.write_text(u)
          PY
      - name: Compile Android presentation shell only, sign and preserve native libraries
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          python3 scripts/package_background_resume.py --source kodi --base-apk baseline/Infinity-2103141.apk --build-dir structural-ui-build --out background-candidate
          APK=$(find background-candidate -name '*.apk' -type f | head -1); test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee background-candidate/badging.txt
          grep -q "versionCode='2103142'" background-candidate/badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | tee background-candidate/signing.txt
          grep -qi 'd7adeb68e9341596a02bd3262b737a0f45fc6e771ed7e60285437e833b58c6d7' background-candidate/signing.txt
          python3 - <<'PY'
          import hashlib,zipfile
          a=zipfile.ZipFile('baseline/Infinity-2103141.apk'); bpath=next(__import__('pathlib').Path('background-candidate').glob('*.apk')); b=zipfile.ZipFile(bpath)
          libs=[n for n in a.namelist() if n.startswith('lib/') and not n.endswith('/')]; assert libs
          for n in libs: assert n in b.namelist() and hashlib.sha256(a.read(n)).digest()==hashlib.sha256(b.read(n)).digest(),n
          joined=b''.join(b.read(n) for n in b.namelist() if n.startswith('classes') and n.endswith('.dex'))
          for token in (b'MOBILE VIEW',b'TV GUIDE',b'INSTALL COBRA UI PACKAGE',b'Crop / Fill'):
              assert token in joined,token
          print('PASS: structural UI bridge signed; 2103141 native libraries preserved exactly')
          PY
          sha256sum "$APK" | tee background-candidate/structural-ui-bridge.sha256
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-Cobra-Structural-UI-Bridge-2103142
          path: background-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
