name: Infinity | 2103326 cooperative shutdown native repair
on:
  workflow_dispatch:
  push:
    branches: [repair/infinity-cooperative-close-2103326]
    paths:
      - 'repairs/cooperative-close-2103326/native_repair.py'
      - 'repairs/cooperative-close-2103326/test_cooperative.py'
      - 'repairs/cooperative-close-2103326/test_trace.py'
      - '.github/workflows/infinity-2103326-native-repair.yml'
permissions: {contents: read, actions: read}
concurrency: {group: infinity-2103326-native-repair, cancel-in-progress: false}
env:
  NDK_VER: 21.4.7075529
jobs:
  native-engine:
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    env:
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            ~/.ccache
          key: infinity-cooperative-3326-arm64-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            infinity-cooperative-3326-arm64-${{ runner.os }}-
            infinity-diagnostics-3325-arm64-${{ runner.os }}-
            infinity-shutdown-3313-arm64-${{ runner.os }}-
            infinity-close-3308-arm64-${{ runner.os }}-
            infinity-provider-3306-arm64-${{ runner.os }}-
      - name: Reconstruct immutable native 3308 then exact passed 3325 instrumentation
        run: |
          set -euo pipefail
          mkdir -p engine3326
          sudo apt-get update -qq
          sudo apt-get install -y python3-yaml python3-dev
          git archive 5183a91b5ea49819d8beef706a80720bad1879bd .github/workflows/infinity-2103313-shutdown.yml repairs/shutdown-2103313 | tar -x
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          recipe=yaml.safe_load(Path('.github/workflows/infinity-2103313-shutdown.yml').read_text())
          selected=[]
          for step in recipe['jobs']['native-engine']['steps']:
              if 'run' in step:selected.append(step['run'])
              if step.get('name')=='Test and apply captured shutdown-owner delta':break
          else:raise RuntimeError('Native parent endpoint missing')
          assert len(selected)==6
          assert not any('shutdown-2103313/native_patch.py apply' in x for x in selected)
          Path('engine3326/reconstruct.sh').write_text('set -euo pipefail\n'+'\n'.join(selected))
          PY
          bash engine3326/reconstruct.sh 2>&1 | tee engine3326/source-reconstruction.log
          python3 repairs/shutdown-diagnostics-2103325/native_patch.py apply --source kodi --parent-proof engine3308/source-manifest.json --receipt engine3326/parent325-source.json
      - name: Apply exact repair and test actual shutdown methods, independent capture and API 21
        run: |
          set -euo pipefail
          python3 repairs/cooperative-close-2103326/native_repair.py --source kodi --proof engine3326/parent325-source.json --receipt engine3326/source-manifest.json
          python3 repairs/cooperative-close-2103326/test_cooperative.py --source kodi 2>&1 | tee engine3326/cooperative-host-tests.log
          python3 repairs/cooperative-close-2103326/test_trace.py --source kodi 2>&1 | tee engine3326/trace-tests.log
      - uses: actions/cache/restore@v4
        with:
          path: kodi/tools/depends
          key: infinity-cooperative-3326-depends-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            infinity-provider-3306-depends-build-${{ runner.os }}-
            infinity-repair-3304-depends-build-${{ runner.os }}-
            infinity-e2e-3303-depends-build-${{ runner.os }}-
      - name: Compile only ARM64 native engine and verify every protected source input
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          stage=Path('scripts/infinity_live_app_ci_2.sh').read_text()
          old='python3 scripts/infinity_gui_render_hardening_v3.py apply --source kodi --receipt engine/gui-render-hardening-source.json'
          assert stage.count(old)==1
          stage=stage.replace(old,'python3 scripts/infinity_gui_render_hardening_v3.py verify --source kodi')
          marker='make -C "$BUILD_DIR" apk -j"$(nproc)"'
          assert stage.count(marker)==1
          Path('engine3326/compile.sh').write_text(stage[:stage.index(marker)])
          PY
          bash engine3326/compile.sh 2>&1 | tee engine3326/native-build.log
          python3 - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          receipt=json.loads(Path('engine3326/source-manifest.json').read_text())
          for name,digest in receipt['after'].items():
              assert hashlib.sha256((Path('kodi')/name).read_bytes()).hexdigest()==digest,name
          libs=list(Path(os.environ['BUILD_DIR']).rglob('libkodi.so'));assert len(libs)==1,libs
          source=libs[0];data=source.read_bytes()
          for token in (b'infinity-shutdown-2103326-v1',b'infinity-shutdown-native.jsonl',b'BeginShutdown'):
              assert token in data,token
          shutil.copy2(source,'engine3326/libkodi.so')
          proof={'candidate':2103326,'apk_parent':2103325,'locked_rollback':2103324,'source_commit':os.environ['GITHUB_SHA'],
                 'native_sha256':hashlib.sha256(data).hexdigest(),'baseline_kodi_commit':'a3a448d26b8d560a65655dab2cd122994dc4e146',
                 'parent_packaged_native_sha256':'e244f0ef2de7f0943659c6e721c4b26045f7f2cca18d50bc0c6298a29428ede1',
                 'diagnostics_only':False,'shutdown_behavior_changed':True,'physical_device_verified':False,'locked':False,'installable_apk':False}
          Path('engine3326/ENGINE-PROOF.json').write_text(json.dumps(proof,indent=2)+'\n')
          PY
          readelf -h -n -W engine3326/libkodi.so > engine3326/elf-identity.txt
      - uses: actions/cache/save@v4
        if: always() && !cancelled()
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            ~/.ccache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103326-Cooperative-Native-Validation
          path: engine3326/
          compression-level: 1
          retention-days: 90
          if-no-files-found: error
