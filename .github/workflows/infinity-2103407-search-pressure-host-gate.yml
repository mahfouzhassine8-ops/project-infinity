          assert subprocess.check_output(['git','rev-parse','HEAD:'+historical_probe],text=True).strip()=='c3e32de69ba273bb408fbf305edf43ed41779529'
          allowed_workflows.add(historical_probe)
          assert all(n.startswith('repairs/infinity-final-closure-2103407/') or n in allowed_workflows for n in names), names
          assert not any('cobra' in n.lower() for n in names), names
          scope=json.load(open('repairs/infinity-final-closure-2103407/SCOPE.json'))
          assert scope['baseline']['commit']==baseline
          assert len(scope['workstreams'])==7
          print('PASS protected407 source boundary; runtime recipes restricted to reviewed repair ownership; no Cobra paths')
