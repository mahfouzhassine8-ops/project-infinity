name: Dual Infinity | G0 signed bootstrap, one engine only
on:
  workflow_dispatch:
    inputs:
      shell_run:
        description: 'Successful repaired shell run with exact donor provenance and 14 executed tests'
        required: true
        type: string
permissions: {contents: read, actions: read}
concurrency: {group: dual-infinity-g0-bootstrap-package, cancel-in-progress: false}
jobs:
  package-verified-bootstrap:
    if: github.ref == 'refs/heads/experiment/dual-infinity-2103368-g0'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 38137092930
          name: Infinity-2103368-Installer-Close-RC1-APK
          github-token: ${{ github.token }}
          path: protected-apk
      - uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: ${{ inputs.shell_run }}
          name: Dual-Infinity-G0-Compile-Only-Donor-Internal
          github-token: ${{ github.token }}
          path: compiled-shell
      - uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: ${{ inputs.shell_run }}
          name: Dual-Infinity-G0-Decoy-Shell-Compilation-Evidence
          github-token: ${{ github.token }}
          path: probe-evidence
      - name: Associate verified cached engine and permanently sign separate bootstrap
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 experiments/dual-infinity/package_bootstrap.py --base protected-apk/Infinity-2103368-Installer-Close-RC1.apk --donor compiled-shell/xbmc-release.apk --probe-evidence probe-evidence/decoy-shell-evidence --build-tools "$ANDROID_HOME/build-tools/34.0.0" --output bootstrap-evidence
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Dual-Infinity-G0-Signed-Bootstrap-APK
          path: bootstrap-evidence/Infinity-Dual-Test-G0-Bootstrap-2-Startup-Repair.apk
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Dual-Infinity-G0-Bootstrap-Delivery-Evidence
          path: |
            bootstrap-evidence/BOOTSTRAP-DELIVERY.json
            bootstrap-evidence/final-manifest.txt
            bootstrap-evidence/*ids.txt
            bootstrap-evidence/*.sha256
            bootstrap-evidence/*.signing.txt
          retention-days: 90
          if-no-files-found: warn
