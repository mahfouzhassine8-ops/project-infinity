name: Kodi452 Pause Stop ARM64 integration only - no APK or signing
on:
  workflow_dispatch:
  push:
    branches: [work/infinity-kodi-452-pause-stop-arm64-20261104]
    paths:
      - repairs/infinity-kodi-pause-stop-arm64-20261104/BUILD-REQUEST.json
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-kodi452-pause-stop-arm64-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-integration:
    if: github.ref == 'refs/heads/work/infinity-kodi-452-pause-stop-arm64-20261104'
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    env:
      GH_TOKEN: ${{ github.token }}
      NDK_VER: '21.4.7075529'
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools build-tools;35.0.0 platforms;android-34'
          log-accepted-android-sdk-licenses: false
      - name: Verify exact branch source toolchain and immutable input identities
        run: python3 repairs/infinity-kodi-pause-stop-arm64-20261104/integration.py metadata
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '13274901825'
          run-id: '41726452356'
          merge-multiple: true
          github-token: ${{ github.token }}
          path: verified-inputs
      - name: Integrate one exact source file over preserved452 native inputs
        run: python3 repairs/infinity-kodi-pause-stop-arm64-20261104/integration.py restore
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11698374892'
          run-id: '38132105717'
          merge-multiple: true
          github-token: ${{ github.token }}
          path: dependency-transfer
      - name: Restore original compiler dependencies and compiler cache
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y python3-yaml python3-dev libsqlite3-dev libssl-dev libffi-dev
          (cd dependency-transfer && sha256sum -c SHA256SUMS)
          tar --no-same-owner -xf dependency-transfer/verified-android-dependencies.tar
          tar --no-same-owner -xf dependency-transfer/verified-compiler-cache.tar -C "$HOME"
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-linux-21.4.7075529-v1
      - name: Restore original pinned NDK
        run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - name: Compile native engine and inspect ARM64 symbols without packaging
        run: python3 repairs/infinity-kodi-pause-stop-arm64-20261104/integration.py compile
      - name: Retain engine and evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-Kodi452-Pause-Stop-ARM64-${{ github.run_id }}-INTERNAL-NOT-APK
          path: |
            pause-stop-native/libkodi.so
            pause-stop-native/*.json
            pause-stop-native/*.txt
            pause-stop-native/compile-native.sh
            kodi-build/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 90
