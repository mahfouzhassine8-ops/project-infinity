name: Infinity | 2103209 Package Recovery

on:
  workflow_dispatch:
  push:
    branches: [infinity-cobra-2103209-package-recovery-rc1]
    paths:
      - '.github/workflows/infinity-2103209-package-recovery.yml'
      - 'repairs/python311-gil-2103209/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: infinity-2103209-package-recovery-${{ github.sha }}
  cancel-in-progress: false

env:
  NDK_VER: 21.4.7075529
  RUNTIME_COMMIT: b42760a25a27d23baa5db5770824cb8d32ec2290

jobs:
  package-and-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout isolated recovery
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Download exact successful 2103208 parent
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103208-Integration-Polish-TEST-CANDIDATE-Replica-1-Attempt-1
          run-id: 35676573761
          github-token: ${{ github.token }}
          path: baseline208

      - name: Reuse exact proven 2103209 native engine from failed packaging run
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103209-Python311-GIL-Native-Engine
          run-id: 35693288744
          github-token: ${{ github.token }}
          path: native209

      - name: Prove reused native artifact before packaging
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          OLD='e230a498a716ce0b82acedfce494fc521457af646c2f504965b247dcb5ee9281'
          FOLLOW='ddb60bd932b929724a9b0d2226043dc54d0d1912'
          proof=json.loads(Path('native209/pythoninvoker-threadstate-v2-source.json').read_text())
          assert proof['upstream_followup']==FOLLOW
          assert all(proof['checks'].values())
          apk=Path('native209/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2-Engine-Base.apk')
          with zipfile.ZipFile(apk) as z:
              native=z.read('lib/arm64-v8a/libkodi.so')
          digest=hashlib.sha256(native).hexdigest()
          expected=Path('native209/2103209-native-engine-sha256.txt').read_text().strip()
          assert digest==expected
          assert digest!=OLD
          print('PASS: exact already-built 2103209 Python 3.11 engine reused:',digest)
          PY

      - name: Recreate controlled 2103209 source and native base
        run: |
          set -euo pipefail
          mkdir -p audit209 engine
          cp native209/pythoninvoker-threadstate-v2-source.json engine/pythoninvoker-threadstate-v2-source.json
          cp native209/pythoninvoker-threadstate-v2-source.stage1.json engine/pythoninvoker-threadstate-v2-source.stage1.json
          python3 repairs/python311-gil-2103209/ci.py prepare \
            --base-dir baseline208 \
            --native-apk native209/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2-Engine-Base.apk \
            --shell shell-kodi \
            --out audit209/native-base

      - name: Create intermediate Android build keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          test -s "$HOME/.android/debug.keystore"

      - name: Build Android shell, permanently sign, and verify candidate
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 scripts/package_background_resume.py \
            --source shell-kodi \
            --base-apk audit209/native-base/Infinity-2103208-Python311-GIL-Patched-Base.apk \
            --build-dir build209 \
            --out signed209
          python3 repairs/python311-gil-2103209/ci.py verify \
            --final signed209/Infinity-1.0.9-Cobra-Python311-GIL-Stability-RC1.apk \
            --base-dir baseline208 \
            --native-apk native209/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2-Engine-Base.apk \
            --audit signed209/background-resume-apk-audit.json
          python3 repairs/python311-gil-2103209/ci.py deliver

      - name: Publish recovered 2103209 TEST CANDIDATE
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103209-Python311-GIL-Stability-TEST-CANDIDATE
          path: signed209/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Preserve recovery audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103209-Python311-GIL-Package-Recovery-Evidence
          path: |
            audit209/
            engine/pythoninvoker-threadstate-v2-source.json
            engine/pythoninvoker-threadstate-v2-source.stage1.json
            repairs/python311-gil-2103209/
            signed209/*.json
            signed209/*.txt
          if-no-files-found: warn
          retention-days: 90
