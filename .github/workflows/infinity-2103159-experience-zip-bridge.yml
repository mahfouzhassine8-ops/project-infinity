name: Infinity | 2103159 Experience ZIP Bridge
on:
  workflow_dispatch:
  push:
    branches: [infinity-2103159-experience-zip-bridge-rc1]
    paths:
      - '.github/workflows/infinity-2103159-experience-zip-bridge.yml'
      - 'repairs/infinity-experience-2103159/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-2103159-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit-and-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      NDK_VER: 21.4.7075529
      RUNTIME_COMMIT: b42760a25a27d23baa5db5770824cb8d32ec2290
    steps:
      - name: Check out immutable reconstruction stack
        uses: actions/checkout@v5
        with:
          ref: cce2de3042cca22b531fa8ed9e13659c19dab8a4
          fetch-depth: 0
          persist-credentials: false
      - name: Check out locked 2103155 recipe
        uses: actions/checkout@v5
        with:
          ref: 4d1ed032df7e13fd27cc2170fc5e028f5059ec32
          path: refinement-delta
          persist-credentials: false
      - name: Check out 2103156 diagnostics recipe
        uses: actions/checkout@v5
        with:
          ref: b3bcb619b08205dcfc1451424b2d41e05fd37633
          path: audit-delta
          persist-credentials: false
      - name: Check out locked 2103157 TV/navigation recipe
        uses: actions/checkout@v5
        with:
          ref: 7d95f8dd1696e340bde82cb73ce4e04a0bc2ac98
          path: view-delta
          persist-credentials: false
      - name: Check out exact locked 2103158 health baseline
        uses: actions/checkout@v5
        with:
          ref: fd2af59bab2edcaea6be9e5046720715e25e64e0
          path: health-delta
          persist-credentials: false
      - name: Check out isolated experience bridge delta
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: experience-delta
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v5
        with:
          name: Infinity-1.0.9-Cobra-Full-Feature-Candidate-2
          run-id: 35044752997
          github-token: ${{ github.token }}
          path: run40
      - uses: actions/download-artifact@v5
        with:
          name: Infinity-Cobra-Player-Reboot-Lock-2103152
          run-id: 35169846333
          github-token: ${{ github.token }}
          path: rollback2103152
      - uses: actions/download-artifact@v5
        with:
          name: Infinity-Cobra-Guide-Player-Refinement-2103153-Audited
          run-id: 35176733529
          github-token: ${{ github.token }}
          path: rollback2103153
      - uses: actions/download-artifact@v5
        with:
          name: Infinity-Cobra-Adaptive-Views-EPG-Repair-RC1-2103155
          run-id: 35188339917
          github-token: ${{ github.token }}
          path: baseline155
      - uses: actions/download-artifact@v5
        with:
          name: Infinity-Cobra-Diagnostics-Audit-RC1-2103156
          run-id: 35192605567
          github-token: ${{ github.token }}
          path: baseline156
      - uses: actions/download-artifact@v5
        with:
          name: Infinity-Cobra-TV-Navigation-Appearance-RC1-2103157
          run-id: 35200244871
          github-token: ${{ github.token }}
          path: baseline157
      - name: Download exact locked 2103158 APK and matching UI
        uses: actions/download-artifact@v5
        with:
          name: Infinity-Cobra-Health-Playback-RC1-2103158
          run-id: 35206405387
          github-token: ${{ github.token }}
          path: baseline158
      - name: Reconstruct exact locked 2103158 and preserve rollback
        run: |
          set -euo pipefail
          python3 -m pip install pyyaml
          python3 experience-delta/repairs/infinity-experience-2103159/ci.py reconstruct
      - name: Test bridge and build exact UI 1.4.0 ZIP
        run: |
          set -euo pipefail
          python3 experience-delta/repairs/infinity-experience-2103159/tests/run.py --splash rollback159/2103158-splash.java.in --ui baseline158/Infinity-Cobra-UI-1.3.9.zip --out audit159/host
          mkdir -p signed159
          python3 experience-delta/repairs/infinity-experience-2103159/build_ui_zip.py --base baseline158/Infinity-Cobra-UI-1.3.9.zip --out signed159/Infinity-Cobra-UI-1.4.0-Experience.zip
      - name: Apply Splash-only bridge and preserve Cobra 2103158 algorithms
        run: |
          set -euo pipefail
          python3 experience-delta/repairs/infinity-experience-2103159/apply.py --source kodi --receipt audit159/patch.json
          cmp kodi/tools/android/packaging/xbmc/src/Splash.java.in audit159/host/Splash.java.in
          cmp kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in rollback159/2103158-activity.java.in
          python3 refinement-delta/repairs/cobra-epg-rc1/tests/run_tests.py --source kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in --out audit159/epg-host
          python3 refinement-delta/repairs/cobra-epg-rc1/tests/run_short.py --source kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in --host audit159/epg-host --out audit159/epg-short
          python3 refinement-delta/repairs/cobra-epg-rc1/tests/run_inherited.py --source kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in --repository refinement-delta --mode-harness audit157/host/modes/CobraModesHarness.java --out audit159/inherited
          python3 experience-delta/repairs/infinity-experience-2103159/ci.py promote
      - name: Compile sign and verify bridge APK with locked native payload
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 scripts/package_background_resume.py --source kodi --base-apk background-rollback/Infinity-Run40-Exact-Base.apk --build-dir experience-build --out signed159
          python3 experience-delta/repairs/infinity-experience-2103159/ci.py verify
      - name: Render inherited Cobra and new experience chooser Android UI
        run: |
          set -euo pipefail
          python3 experience-delta/repairs/infinity-experience-2103159/tests/android.py --build experience-build --out audit159/android
          python3 experience-delta/repairs/infinity-experience-2103159/ci.py deliver
      - name: Upload verified APK and ZIP candidate
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-Experience-Zip-Bridge-RC1-2103159
          path: signed159/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Preserve visual and audit evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103159-Experience-Bridge-Evidence
          path: |
            audit159/
            engine/background-resume-source.json
            engine/native-before.patch
            engine/native-after-2103159.patch
            signed159/*.json
            signed159/*.txt
            experience-delta/repairs/infinity-experience-2103159/
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve exact locked 2103158 rollback
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Cobra-2103158-Complete-Rollback-For-2103159
          path: rollback159/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
