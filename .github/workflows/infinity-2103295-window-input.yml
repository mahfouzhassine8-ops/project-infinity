name: Infinity | 2103295 Window Local Input
on:
  workflow_dispatch:
  push:
    branches: [candidate-infinity-2103295-window-input]
    paths:
      - 'repairs/window-input-2103295/**'
      - '.github/workflows/infinity-2103295-window-input.yml'
permissions: {contents: read, actions: read}
concurrency:
  group: infinity-2103295-window-input
  cancel-in-progress: true
env:
  NDK_VER: 21.4.7075529

jobs:
  native-engine:
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    env:
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools}
      - uses: actions/cache/restore@v4
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            ~/.ccache
          key: infinity-deep-audio-21.3-arm64-${{ runner.os }}-${{ hashFiles('patches/infinity-7.1-audited/contract.json', 'patches/infinity-responsive-v5/contract.json', 'patches/infinity-refresh/**', 'patches/infinity-media/**', 'patches/infinity-audio-policy/**') }}
          restore-keys: |
            infinity-responsive-v5-21.3-arm64-${{ runner.os }}-
            infinity-71-audited-deps-21.3-arm64-${{ runner.os }}-

      - name: Source preflight before expensive native build
        run: |
          set -euo pipefail
          python3 -m py_compile \
            repairs/window-input-2103295/window_input.py \
            repairs/window-input-2103295/test_window_input.py \
            repairs/text-reflow-2103294/text_reflow.py \
            repairs/text-reflow-2103294/test_text_reflow.py \
            repairs/window-input-2103295/package_apk.py \
            repairs/inplace-reflow-2103291/inplace_reflow.py \
            repairs/inplace-reflow-2103291/test_contract.py \
            repairs/inplace-reflow-2103291/prepare_base.py \
            repairs/inplace-reflow-2103291/android_package_delta.py
          bash scripts/infinity_live_app_ci_1.sh
          test "$(git -C kodi rev-parse HEAD)" = a3a448d26b8d560a65655dab2cd122994dc4e146
          mkdir -p engine audit3295
          python3 scripts/infinity_python_invoker_hardening_v2.py apply --source kodi --receipt engine/pythoninvoker-threadstate-v2-source.json
          python3 scripts/infinity_python_invoker_hardening_v2.py verify --source kodi
          python3 scripts/infinity_python_invoker_hardening_v3.py apply --source kodi --receipt engine/pythoninvoker-runtime-v3-source.json
          python3 scripts/infinity_python_invoker_hardening_v3.py verify --source kodi
          python3 repairs/native-fd-2103285/apply.py --source kodi --receipt engine/native-fd-source.json
          python3 repairs/native-responsive-2103290/native_layout.py apply --source kodi --receipt engine/native-responsive-source.json
          python3 repairs/native-responsive-2103290/native_layout.py verify --source kodi --receipt engine/native-responsive-source.json
          python3 repairs/native-responsive-2103290/test_contract.py --source kodi
          python3 repairs/inplace-reflow-2103291/inplace_reflow.py apply --source kodi --receipt engine/inplace-reflow-source.json
          python3 repairs/inplace-reflow-2103291/inplace_reflow.py verify --source kodi --receipt engine/inplace-reflow-source.json
          python3 repairs/inplace-reflow-2103291/test_contract.py --source kodi
          python3 repairs/fold-unification-2103293/container_reflow.py apply --source kodi --receipt engine/container-reflow-source.json
          python3 repairs/fold-unification-2103293/container_reflow.py verify --source kodi --receipt engine/container-reflow-source.json
          python3 repairs/fold-unification-2103293/test_container_reflow.py --source kodi
          python3 repairs/text-reflow-2103294/text_reflow.py apply --source kodi --receipt engine/text-reflow-source.json
          python3 repairs/text-reflow-2103294/text_reflow.py verify --source kodi --receipt engine/text-reflow-source.json
          python3 repairs/text-reflow-2103294/test_text_reflow.py --source kodi | tee audit3295/text-cache-tests.txt
          cp engine/text-reflow-source.json engine/TEXT-REFLOW-BYTE-MANIFEST.json audit3295/
          # Complete the inherited 3294 render-hardening baseline before protecting
          # its hashes. This is the same parent transform formerly run in CI stage 2.
          python3 scripts/infinity_gui_render_hardening_v3.py apply --source kodi --receipt engine/gui-render-hardening-source.json
          python3 scripts/infinity_gui_render_hardening_v3.py verify --source kodi
          python3 repairs/window-input-2103295/window_input.py apply --source kodi --receipt engine/window-input-source.json
          python3 repairs/window-input-2103295/window_input.py verify --source kodi --receipt engine/window-input-source.json
          python3 repairs/window-input-2103295/test_window_input.py --source kodi | tee audit3295/window-input-tests.txt
          cp engine/window-input-source.json engine/WINDOW-INPUT-BYTE-MANIFEST.json audit3295/
          git -C kodi diff --check -- \
            xbmc/addons/Skin.h xbmc/addons/Skin.cpp \
            xbmc/guilib/GUIFontManager.cpp xbmc/guilib/GUIControl.h xbmc/guilib/GUIControl.cpp \
            xbmc/guilib/GUIControlGroup.h xbmc/guilib/GUIControlGroup.cpp \
            xbmc/guilib/GUIControlFactory.cpp xbmc/guilib/GUIWindow.h xbmc/guilib/GUIWindow.cpp \
            xbmc/guilib/GUIListLabel.h xbmc/guilib/GUIListLabel.cpp \
            xbmc/guilib/GUITextBox.h xbmc/guilib/GUITextBox.cpp \
            xbmc/platform/android/activity/AndroidTouch.h xbmc/platform/android/activity/AndroidTouch.cpp \
            xbmc/platform/android/activity/JNIMainActivity.cpp
          sha256sum kodi/xbmc/interfaces/python/PythonInvoker.cpp kodi/xbmc/interfaces/python/PythonInvoker.h > audit3295/python-protected.txt
          cp engine/inplace-reflow-source.json engine/container-reflow-source.json audit3295/

      - name: Full ARM64 native rebuild
        run: |
          set -euo pipefail
          # Preserve the parent build recipe; its one baseline apply has already
          # happened before the candidate's whole-source byte snapshot.
          python3 - <<'PY'
          from pathlib import Path
          stage=Path('scripts/infinity_live_app_ci_2.sh').read_text()
          inherited='python3 scripts/infinity_gui_render_hardening_v3.py apply --source kodi --receipt engine/gui-render-hardening-source.json'
          assert stage.count(inherited)==1
          stage=stage.replace(inherited,'python3 scripts/infinity_gui_render_hardening_v3.py verify --source kodi',1)
          Path('audit3295/inherited-native-build.sh').write_text(stage)
          PY
          # Persist the complete native transcript even when compilation fails so
          # the always-uploaded evidence artifact contains the actionable error.
          bash audit3295/inherited-native-build.sh 2>&1 | tee audit3295/native-build.log

          # Diagnostic fan-out: after the expensive native build succeeds, run every preservation/
          # responsive verifier and report all failures in this one attempt instead of stopping at
          # the first red gate and paying for another full native compile just to discover the next.
          failures=0
          gate() {
            local label="$1"; shift
            echo "::group::DIAGNOSTIC GATE: $label"
            if "$@"; then
              echo "PASS: $label"
            else
              rc=$?
              echo "::error title=$label::FAILED (exit $rc)"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          }

          gate "Python runtime hardening v3"             python3 scripts/infinity_python_invoker_hardening_v3.py verify --source kodi
          gate "Native FD preservation"             python3 repairs/native-fd-2103285/apply.py --verify --source kodi --receipt engine/native-fd-source.json
          gate "Responsive resolver API"             grep -Fq 'GetNativeResponsiveResolution' kodi/xbmc/addons/Skin.cpp
          gate "Responsive base fallback"             grep -Fq 'responsive/base' kodi/xbmc/addons/Skin.cpp
          gate "Responsive opt-in API"             grep -Fq 'UsesNativeResponsiveLayout' kodi/xbmc/addons/Skin.cpp
          gate "Android responsive viewport trace"             grep -Fq 'Infinity responsive viewport:' kodi/xbmc/windowing/android/WinSystemAndroid.cpp
          gate "2103291 in-place reflow verifier"             python3 repairs/inplace-reflow-2103291/inplace_reflow.py verify --source kodi --receipt engine/inplace-reflow-source.json
          gate "2103291 contract tests"             python3 repairs/inplace-reflow-2103291/test_contract.py --source kodi
          gate "Protected Python source hashes"             sha256sum -c audit3295/python-protected.txt

          gate "2103293 container source preservation" python3 repairs/fold-unification-2103293/container_reflow.py verify --source kodi --receipt engine/container-reflow-source.json
          gate "2103293 compiled C++ state scenarios" python3 repairs/fold-unification-2103293/test_container_reflow.py --source kodi
          gate "2103294 text source and inherited resolver preservation" python3 repairs/text-reflow-2103294/text_reflow.py verify --source kodi --receipt engine/text-reflow-source.json
          gate "2103294 compiled retained-text scenarios" python3 repairs/text-reflow-2103294/test_text_reflow.py --source kodi
          gate "2103295 window-input source and whole native preservation" python3 repairs/window-input-2103295/window_input.py verify --source kodi --receipt engine/window-input-source.json
          gate "2103295 compiled input/UI-frame scenarios" python3 repairs/window-input-2103295/test_window_input.py --source kodi
          if [ "$failures" -ne 0 ]; then
            echo "::error title=2103291 diagnostic fan-out::$failures post-build gate(s) failed; see grouped results above."
            exit 1
          fi

      - name: Bind inherited reflow and window-local input source proof
        run: |
          set -euo pipefail
          mkdir -p engine3295
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          apk=Path('engine/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2-Engine-Base.apk')
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              lib=z.read('lib/arm64-v8a/libkodi.so')
          digest=hashlib.sha256(lib).hexdigest()
          assert digest!='704ad669552af11cd173bca358a4c6a513be5c37e731031f2ce0eda2f14067bb'
          text=json.loads(Path('engine/text-reflow-source.json').read_text())
          assert text['candidate']==2103294 and text['unexpected_native_source_changes']==0
          assert len(text['protected_parent_sources'])==11
          window=json.loads(Path('engine/window-input-source.json').read_text())
          assert window['candidate']==2103295 and window['unexpected_native_source_changes']==0
          assert len(window['changed_files'])==3 and window['java_changed'] is False
          assert digest!='91400d51655c0e85b5e069a4108eda0fcc6a40bb0edb9f2014e1a901dac9cab2'
          assert digest!='16bb23fb27bdefe1464a4c11d65195069f0819948ae5213872f8519decd8c3cc'
          for token in (b'INFINITY_FD_POLL_V1',b'infinity-native-responsive-v1.json',
                        b'Infinity responsive viewport:',b'Infinity in-place responsive reflow:',
                        b'controls_reused=true window_reload=false',b'Infinity input viewport:',b'Infinity input down:'):
              assert token in lib,token
          source=json.loads(Path('engine/inplace-reflow-source.json').read_text())
          assert source['window_objects_reused'] is True
          assert source['controls_reused'] is True
          assert source['full_window_reload_on_resize'] is False
          Path('engine3295/libkodi.so').write_bytes(lib)
          report={
            'schema':1,'native_engine_sha256':digest,
            'parent_2103290_native_sha256':'16bb23fb27bdefe1464a4c11d65195069f0819948ae5213872f8519decd8c3cc',
            'parent_2103290_apk_sha256':'cefb61ab84d5eae78110bae7ef381f36f2e1f3f7b770e2f7792e9dfd196b6eef',
            'kodi':'21.3-Omega','fd_repair_preserved':True,'python_repairs_preserved':True,
            'native_responsive_layout_v1_preserved':True,'inplace_responsive_reflow_v1':True,'container_reflow_v1':True,'text_reflow_v1':True,'window_input_v1':True,'candidate':2103295,
            'source_parent_apk_sha256':'34c7bf61235316b2c5730056cf3136c281c1e886f2d991bb46fef9d708df73c3',
            'source_parent_native_sha256':'91400d51655c0e85b5e069a4108eda0fcc6a40bb0edb9f2014e1a901dac9cab2',
            'locked_parent_apk_sha256':'5dba74e227434c036df10818813c96ce0697d196fde2c68e1d2320a803f6a093',
            'locked_parent_native_sha256':'704ad669552af11cd173bca358a4c6a513be5c37e731031f2ce0eda2f14067bb',
            'window_objects_reused':True,'controls_reused':True,'skin_payload_changed':False,
            'physical_device_verified':False}
          Path('engine3295/ENGINE-PROOF.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          Path('engine3295/CONTAINER-REFLOW-SOURCE.json').write_text(Path('engine/container-reflow-source.json').read_text())
          Path('engine3295/INPLACE-REFLOW-SOURCE.json').write_text(Path('engine/inplace-reflow-source.json').read_text())
          Path('engine3295/TEXT-REFLOW-SOURCE.json').write_text(Path('engine/text-reflow-source.json').read_text())
          Path('engine3295/TEXT-REFLOW-BYTE-MANIFEST.json').write_text(Path('engine/TEXT-REFLOW-BYTE-MANIFEST.json').read_text())
          Path('engine3295/WINDOW-INPUT-SOURCE.json').write_text(Path('engine/window-input-source.json').read_text())
          Path('engine3295/WINDOW-INPUT-BYTE-MANIFEST.json').write_text(Path('engine/WINDOW-INPUT-BYTE-MANIFEST.json').read_text())
          Path('engine3295/SHA256SUMS.txt').write_text(digest+'  libkodi.so\n')
          print('PASS 2103295 window-local input engine',digest)
          PY
          readelf -h -n -d -W engine3295/libkodi.so > engine3295/elf-identity.txt

      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103295-Window-Local-Input-Engine
          path: engine3295/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103295-Window-Local-Input-Evidence
          path: audit3295/
          if-no-files-found: warn
          retention-days: 90

  package:
    needs: native-engine
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools}
      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103295-Window-Local-Input-Engine
          path: engine3295
      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103294-Retained-Text-Reflow-RC1-Candidate
          run-id: 37078736137
          github-token: ${{ github.token }}
          path: parent3294
      - name: Preserve every locked APK payload except native UI and integer version code
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;34.0.0' >/dev/null
          mkdir -p final3295
          python3 repairs/window-input-2103295/package_apk.py build --parent parent3294/Infinity-2103294-Retained-Text-Reflow-RC1.apk --engine-proof engine3295/ENGINE-PROOF.json --native engine3295/libkodi.so --out final3295/unsigned.apk --proof final3295/unsigned-proof.json
          bash scripts/sign-infinity71.sh final3295/unsigned.apk final3295/Infinity-2103295-Window-Local-Input-RC1.apk
          rm final3295/unsigned.apk
          python3 repairs/window-input-2103295/package_apk.py verify --parent parent3294/Infinity-2103294-Retained-Text-Reflow-RC1.apk --engine-proof engine3295/ENGINE-PROOF.json --out final3295/Infinity-2103295-Window-Local-Input-RC1.apk --proof final3295/APK-PRESERVATION.json
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging final3295/Infinity-2103295-Window-Local-Input-RC1.apk > final3295/badging.txt
          grep -q "versionCode='2103295'" final3295/badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs final3295/Infinity-2103295-Window-Local-Input-RC1.apk > final3295/signing.txt
          grep -qi 'd7adeb68e9341596a02bd3262b737a0f45fc6e771ed7e60285437e833b58c6d7' final3295/signing.txt
          sha256sum final3295/Infinity-2103295-Window-Local-Input-RC1.apk > final3295/SHA256SUMS.txt
          cp engine3295/*json final3295/
      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103295-Window-Local-Input-RC1-Candidate
          path: final3295/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
