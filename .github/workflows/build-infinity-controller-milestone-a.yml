name: Infinity Controller Milestone A

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-infinity-controller-milestone-a.yml'
      - 'scripts/patch-infinity-controller-milestone-a.py'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;34.0.0 platform-tools'

      - name: Install apktool
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends unzip curl
          curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

      - name: Download known-good Stable 2 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9987128748/zip" \
            -o /tmp/base.zip
          mkdir -p /tmp/base
          unzip -q /tmp/base.zip -d /tmp/base
          APK=$(find /tmp/base -name '*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" /tmp/base.apk

      - name: Record original native hash
        run: |
          set -euo pipefail
          unzip -p /tmp/base.apk lib/arm64-v8a/libkodi.so | sha256sum | awk '{print $1}' > /tmp/libkodi-before.sha256
          cat /tmp/libkodi-before.sha256

      - name: Decode Stable 2
        run: java -jar /tmp/apktool.jar d -f /tmp/base.apk -o /tmp/decoded

      - name: Create Infinity Controller brain
        run: python3 scripts/patch-infinity-controller-milestone-a.py

      - name: Verify brain wiring
        run: |
          set -euo pipefail
          CTRL=$(find /tmp/decoded -path '*/com/projectinfinity/kodi/InfinityController.smali' -o -path '*/org/xbmc/kodi/InfinityController.smali' | head -1)
          LISTENER=$(find /tmp/decoded -name 'InfinityController$ListenerRunnable.smali' | head -1)
          MAIN=$(find /tmp/decoded -path '*/com/projectinfinity/kodi/Main.smali' -o -path '*/org/xbmc/kodi/Main.smali' | head -1)
          test -n "$CTRL"
          test -n "$LISTENER"
          test -n "$MAIN"
          grep -q 'isVideoPlaying:Z' "$CTRL"
          grep -q 'shouldAllowPiP()Z' "$CTRL"
          grep -q '127.0.0.1' "$LISTENER"
          grep -q '0x2382' "$LISTENER"
          grep -q 'Player.OnPlay' "$LISTENER"
          grep -q 'Player.OnStop' "$LISTENER"
          grep -q 'InfinityController;->init(Landroid/app/Activity;)V' "$MAIN"
          grep -q 'onUserLeaveHint()V' "$MAIN"
          grep -q 'android:supportsPictureInPicture="true"' /tmp/decoded/AndroidManifest.xml

      - name: Rebuild
        run: java -jar /tmp/apktool.jar b /tmp/decoded -o /tmp/Infinity-5.3-Milestone-A-unsigned.apk

      - name: Verify libkodi.so stayed byte-for-byte unchanged
        run: |
          set -euo pipefail
          unzip -p /tmp/Infinity-5.3-Milestone-A-unsigned.apk lib/arm64-v8a/libkodi.so | sha256sum | awk '{print $1}' > /tmp/libkodi-after.sha256
          echo "Before: $(cat /tmp/libkodi-before.sha256)"
          echo "After:  $(cat /tmp/libkodi-after.sha256)"
          cmp /tmp/libkodi-before.sha256 /tmp/libkodi-after.sha256

      - name: Sign 5.3 test APK
        env:
          PASS: infinity${{ github.run_id }}${{ github.run_attempt }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          keytool -genkeypair \
            -keystore /tmp/infinity.keystore \
            -alias infinity \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Infinity Controller Milestone A, O=Project Infinity, C=US" \
            >/dev/null 2>&1
          "$BT/zipalign" -f 4 \
            /tmp/Infinity-5.3-Milestone-A-unsigned.apk \
            /tmp/Infinity-5.3-Milestone-A-aligned.apk
          "$BT/apksigner" sign \
            --ks /tmp/infinity.keystore \
            --ks-key-alias infinity \
            --ks-pass env:PASS \
            --key-pass env:PASS \
            --out /tmp/Infinity-5.3-Milestone-A.apk \
            /tmp/Infinity-5.3-Milestone-A-aligned.apk
          "$BT/apksigner" verify --verbose /tmp/Infinity-5.3-Milestone-A.apk

      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-5.3-Milestone-A-Brain
          path: /tmp/Infinity-5.3-Milestone-A.apk
          retention-days: 30
