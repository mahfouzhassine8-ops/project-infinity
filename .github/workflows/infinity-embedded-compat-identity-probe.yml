name: "Infinity | inspect embedded preserved service version (READ ONLY)"
on:
  push:
    branches: [work/infinity-post-2103384-feature-restoration]
    paths: ["repairs/integration-20261018/PROBE.marker"]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  inspect-native-signed-parent:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v8
        with:
          run-id: 39169187099
          name: Infinity-2103385-UI-Restoration-Signed-EXPERIMENTAL-and-Return
          github-token: ${{ github.token }}
          path: native385
      - uses: actions/download-artifact@v8
        with:
          # Hash-pinned original .227 source used by approved .228 delta,
          # not the later rebuilt helper .012 artifact's non-deterministic ZIP.
          run-id: 39114438060
          name: Infinity-UI-Restoration-Current-Skins-and-Helper
          github-token: ${{ github.token }}
          path: skin227
      - name: Verify exact native artifact and report embedded addon.xml metadata only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import zipfile
          base=Path('native385')
          artifact=next(base.rglob('Infinity-2103385-UI-Restoration-TEST1.apk'))
          receipt=json.loads(next(base.rglob('SIGNED-2103385.json')).read_text())
          row=next(a for a in receipt['artifacts']
                   if a['native_restored_2103384'] is False)
          assert row['file']==artifact.name
          assert hashlib.sha256(artifact.read_bytes()).hexdigest()==row['sha256']
          assert receipt['source_commit']=='b6434fe29d1b78451a4911a2760afa6b36d307e8'
          report={'signed_producer_sha256':row['sha256'],'source_commit':receipt['source_commit'],
                  'lineage_ok':True,'all_previous_members_preserved':True,'addons':{}}
          with zipfile.ZipFile(artifact) as z:
              assert z.testzip() is None
              for aid in ('service.infinity.compat','script.infinity.commandcenter',
                          'script.skinshortcuts','resource.images.studios.white',
                          'resource.images.recordlabels.white'):
                  filename='assets/addons/'+aid+'/addon.xml'
                  if filename not in z.namelist():
                      report['addons'][aid]={'present':False}
                      continue
                  raw=z.read(filename)
                  node=ET.fromstring(raw)
                  info={'present':True,'id':node.get('id'),'version':node.get('version'),
                        'addon_xml_sha256':hashlib.sha256(raw).hexdigest(),
                        'requires':[dict(addon=imp.get('addon'),version=imp.get('version'))
                                    for imp in node.findall('./requires/import')]}
                  assert info['id']==aid
                  report['addons'][aid]=info
          # The reviewed .228 patch only changes skin version and 13 OSD
          # image colors; its dependency imports are inherited from .227.
          skin=next(Path('skin227').rglob('skin.infinity.diggz-1.0.5.227-Coordinated-TEST.zip'))
          assert hashlib.sha256(skin.read_bytes()).hexdigest()==(
              'cc07fe41ccef2b9eca52b8b273ac5ad9a6c1f498a008d64ac0526a7e62dbe699')
          with zipfile.ZipFile(skin) as z:
              assert z.testzip() is None
              xml=ET.fromstring(z.read('skin.infinity.diggz/addon.xml'))
              assert xml.get('id')=='skin.infinity.diggz' and xml.get('version')=='1.0.5.227'
              needs={row.get('addon'):row.get('version')
                     for row in xml.findall('./requires/import')}
          report['reviewed_skin_227_requires']=needs
          version=report['addons']['service.infinity.compat']['version']
          required=needs.get('service.infinity.compat')
          def nums(x): return tuple(int(v) for v in x.split('.'))
          report['original_compat_meets_skin_declared_minimum']=(
              required is None or nums(version)>=nums(required))
          report['skin_228_inherits_requirements_from_227']=True
          report['original_compat_versioncode_unmodified']=version
          Path('EMBEDDED-COMPAT-IDENTITY.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103384-Embedded-Compat-Metadata-READONLY
          path: EMBEDDED-COMPAT-IDENTITY.json
          if-no-files-found: warn
          retention-days: 30
