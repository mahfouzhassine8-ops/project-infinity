name: onn TV 2103234 integrated shell preaudit

on:
  workflow_dispatch:
  push:
    branches: [infinity-cobra-2103234-onn4kpro-tv-integrated-shell-playing-rc14]
    paths:
      - '.github/workflows/onn-tv-2103234-integrated-shell-preaudit.yml'
      - 'repairs/onn4kpro-tv-integrated-shell-playing-2103234/**'

permissions:
  contents: read
  actions: read

jobs:
  preaudit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download exact 2103208 Android source parent
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103208-Integration-Polish-TEST-CANDIDATE-Replica-1-Attempt-1
          run-id: 35676573761
          github-token: ${{ github.token }}
          path: baseline208

      - name: Download preserved 2103209 source reconstruction engine
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103209-Python311-GIL-Native-Engine
          run-id: 35693288744
          github-token: ${{ github.token }}
          path: native209

      - name: Reconstruct exact locked RC13 source
        run: |
          set -euo pipefail
          mkdir -p engine audit234
          cp native209/pythoninvoker-threadstate-v2-source.json engine/pythoninvoker-threadstate-v2-source.json
          cp native209/pythoninvoker-threadstate-v2-source.stage1.json engine/pythoninvoker-threadstate-v2-source.stage1.json
          python3 repairs/python311-gil-2103209/ci.py prepare \
            --base-dir baseline208 \
            --native-apk native209/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2-Engine-Base.apk \
            --shell shell-kodi \
            --out audit234/mobile-source-base
          python3 repairs/cobra-media-library-health-2103210/apply.py --shell shell-kodi
          python3 repairs/cobra-library-health-2103211/apply.py --shell shell-kodi
          python3 repairs/health-media-trim-2103212/apply.py --shell shell-kodi
          python3 repairs/live-blue-ambient-settings-return-2103213/apply.py --shell shell-kodi
          python3 repairs/media-details-final-2103214/apply.py --shell shell-kodi
          python3 repairs/smart-return-experience-drawer-2103215/apply.py --shell shell-kodi
          python3 repairs/smart-return-experience-display-2103216/apply.py --shell shell-kodi
          python3 repairs/media-return-context-2103217/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-2103218/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-remote-2103219/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-grid-only-2103220/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-remote-ui-2103221/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-player-multiview-2103222/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-hardening-2103223/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-native-remote-2103224/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-handoff-focus-2103225/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-navigation-motion-2103230/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-adaptive-ui-polish-2103231/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-integrated-drawer-2103232/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-glass-system-2103233/apply.py --shell shell-kodi

      - name: Dry-run RC14 integrated shell correction
        run: |
          set -euo pipefail
          python3 -m py_compile repairs/onn4kpro-tv-integrated-shell-playing-2103234/apply.py
          python3 repairs/onn4kpro-tv-integrated-shell-playing-2103234/apply.py --shell shell-kodi
          python3 - <<'PY'
          import json
          r=json.load(open('engine/background-resume-source.json'))
          assert r['version_code']==2103234
          assert r['version_name']=='1.0.9-Cobra-Onn4KPro-TV-Integrated-Shell-Playing-RC14'
          assert r['tv_drawer_inline_column'] is True
          assert r['tv_drawer_guide_overlay'] is False
          assert r['tv_drawer_back_restores_underlay'] is True
          assert r['tv_drawer_groups_visible_while_open'] is True
          assert r['tv_playing_channel_indicator'] is True
          assert r['tv_playing_indicator_actual_session'] is True
          assert r['tv_preview_instruction_removed'] is True
          assert r['tv_border_density_reduced'] is True
          assert r['tv_glass_system'] is True
          assert r['tv_ambient_mode_retired'] is True
          assert r['tv_navigation_hierarchy']=='drawer-groups-grid-player'
          assert r['tv_mini_player_preserved'] is True
          assert r['native_engine_rebuilt'] is False
          assert r['playback_engine_unchanged'] is True
          print('PASS: RC14 integrated shell source receipt')
          PY

          JAVA=shell-kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          grep -Fq 'cobra_tv_glass_system_2103233' "$JAVA"
          grep -Fq 'cobra_tv_integrated_shell_playing_2103234' "$JAVA"
          grep -Fq 'mCobraGuideShell.addView(panel' "$JAVA"
          grep -Fq 'mCobraTvDrawerInline=true' "$JAVA"
          grep -Fq 'cobraTvChannelPlaybackState' "$JAVA"
          grep -Fq '▶ PLAYING' "$JAVA"
          grep -Fq 'cobraTvCloseDrawerRestoreFocus();return;' "$JAVA"
          ! grep -Fq 'Select the current channel again to watch' "$JAVA"
          ! grep -Fq 'AMBIENT MODE  •' "$JAVA"
          grep -Fq 'startCobraPreview(mGuidePreviewChannel)' "$JAVA"
          grep -Fq 'mCobraPreviewPlayer=session' "$JAVA"
          grep -Fq 'cobra_tv_grid_settings' "$JAVA"
          grep -Fq 'versionCode 2103234' shell-kodi/tools/android/packaging/xbmc/build.gradle.in
          grep -Fq 'versionName "1.0.9-Cobra-Onn4KPro-TV-Integrated-Shell-Playing-RC14"' shell-kodi/tools/android/packaging/xbmc/build.gradle.in

      - name: Audit RC14 source shape
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('shell-kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in')
          s=p.read_text()
          checks={
            'inline_drawer': 'mCobraGuideShell.addView(panel' in s,
            'overlay_host_fallback_only': 'cobra_experience_drawer_host' in s,
            'preview_instruction_removed': 'Select the current channel again to watch' not in s,
            'playing_text': '▶ PLAYING' in s,
            'actual_session_helper': 'cobraTvChannelPlaybackState' in s,
            'back_restore': 'cobraTvCloseDrawerRestoreFocus();return;' in s,
            'rc13_glass': 'cobra_tv_glass_system_2103233' in s,
            'rc14_marker': 'cobra_tv_integrated_shell_playing_2103234' in s,
          }
          assert all(checks.values()),checks
          Path('audit234/rc14-source-checks.json').write_text(json.dumps(checks,indent=2,sort_keys=True))
          Path('audit234/InfinityLiveActivity-RC14.java.in').write_text(s)
          print(json.dumps(checks,sort_keys=True))
          PY

      - name: Preserve preaudit
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103234-Integrated-Shell-Preaudit
          path: audit234/
          retention-days: 30
