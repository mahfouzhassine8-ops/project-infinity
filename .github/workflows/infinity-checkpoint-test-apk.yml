name: Infinity | 2103337 installed participant repair APK (reuse compiled shell)
on:
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency: {group: infinity-checkpoint-test-apk, cancel-in-progress: false}
env:
  NDK_VER: 21.4.7075529
jobs:
  package-test-apk:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'work/android-checkpoint-shutdown-2103335'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: '${{ github.event.workflow_run.head_sha }}'}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 ndk;21.4.7075529'
          log-accepted-android-sdk-licenses: false
      - name: Verify packaging gates
        run: python3 tools/checkpoint-apk/test_package.py
      - uses: actions/download-artifact@v8
        with:
          run-id: 37735801149
          name: Infinity-2103335-Delivery-Evidence
          github-token: ${{ github.token }}
          path: parent
      - uses: actions/download-artifact@v8
        with:
          run-id: 37735801149
          name: Infinity-2103335-Native-Trace-Bridge-RC1-APK
          github-token: ${{ github.token }}
          path: base
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: Infinity-Checkpoint-Work-Native-Internal
          github-token: ${{ github.token }}
          path: engine
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: Infinity-Checkpoint-Work-Native-Validation
          github-token: ${{ github.token }}
          path: engine-proof
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: Infinity-2103337-Android-Donor-Internal
          github-token: ${{ github.token }}
          path: shell/xbmc/build/outputs/apk/release
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: Infinity-Checkpoint-Work-Android-Validation
          github-token: ${{ github.token }}
          path: evidence
      - name: Restore already compiled shell and associated native proof
        run: |
          set -euo pipefail
          cp engine-proof/ENGINE-PROOF.json engine/ENGINE-PROOF.json
          mkdir -p source
          tar --no-same-owner -xzf evidence/runtime-shell-source.tar.gz -C source
      - name: Associate green engine and verify preserved payload and permanent signer
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          INFINITY_ENGINE_SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          INFINITY_NATIVE_RUN_ID: ${{ github.event.workflow_run.id }}
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 tools/checkpoint-apk/package.py package --source source/shell-kodi --base base/Infinity-2103335-Native-Trace-Bridge-RC1.apk --build shell --out evidence --engine engine
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103337-Checkpoint-Installed-Fix-RC1-APK
          path: evidence/Infinity-2103337-Checkpoint-Installed-Fix-RC1.apk
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103337-Checkpoint-Test-Evidence
          path: |
            evidence/
            !evidence/*.apk
            !evidence/*.so
            shell/xbmc/build/test-results/testReleaseUnitTest/
          retention-days: 90
          if-no-files-found: error
