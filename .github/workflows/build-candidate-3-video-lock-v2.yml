name: ♾️ Build Candidate 3 - Lock Animation Fix

on:
  push:
    paths:
      - '.github/workflows/build-candidate-3-video-lock-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;34.0.0 platform-tools'
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin unzip curl
          curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
      - name: Download Stable 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9978114291/zip -o /tmp/stable2.zip
          mkdir -p /tmp/stable2 && unzip -q /tmp/stable2.zip -d /tmp/stable2
          APK=$(find /tmp/stable2 -name '*.apk' -type f | head -1)
          cp "$APK" /tmp/Infinity-Stable-2.apk
      - name: Decode
        run: java -jar /tmp/apktool.jar d -f /tmp/Infinity-Stable-2.apk -o /tmp/decoded
      - name: Patch icon-only lock lifecycle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          skin=Path('/tmp/decoded/assets/addons/skin.estuary')
          osd=skin/'xml/VideoOSD.xml'
          text=osd.read_text()
          marker='<control type="radiobutton" id="804">'
          lock='''<control type="radiobutton" id="7999">\n\t\t\t\t\t\t<include content="OSDButton">\n\t\t\t\t\t\t\t<param name="texture" value="osd/fullscreen/buttons/infinity-lock.png"/>\n\t\t\t\t\t\t</include>\n\t\t\t\t\t\t<label>Lock screen</label>\n\t\t\t\t\t\t<onclick>Dialog.Close(VideoOSD)</onclick>\n\t\t\t\t\t\t<onclick>ActivateWindow(1199)</onclick>\n\t\t\t\t\t\t<visible>Player.HasVideo</visible>\n\t\t\t\t\t</control>\n\t\t\t\t\t'''
          if 'id="7999"' not in text:
              if marker not in text: raise SystemExit('OSD insertion point missing')
              osd.write_text(text.replace(marker,lock+marker,1))

          overlay=skin/'xml/Custom_1199_InfinityVideoLock.xml'
          overlay.write_text('''<?xml version="1.0" encoding="utf-8"?>
<window type="dialog" id="1199">
  <onload>SetProperty(InfinityLockHint,true)</onload>
  <onload>ClearProperty(InfinityUnlockVisible)</onload>
  <onload>ClearProperty(InfinityUnlocking)</onload>
  <onload>AlarmClock(InfinityHideLockHint,ClearProperty(InfinityLockHint),00:00:01,silent)</onload>
  <onunload>CancelAlarm(InfinityHideLockHint,silent)</onunload>
  <onunload>CancelAlarm(InfinityHideUnlock,silent)</onunload>
  <onunload>CancelAlarm(InfinityFinishUnlock,silent)</onunload>
  <defaultcontrol always="true">9900</defaultcontrol>
  <controls>
    <control type="button" id="9900">
      <left>0</left><top>0</top><width>100%</width><height>100%</height>
      <texturefocus colordiffuse="00FFFFFF">white.png</texturefocus>
      <texturenofocus colordiffuse="00FFFFFF">white.png</texturenofocus>
      <label></label>
      <onclick condition="String.IsEmpty(Window.Property(InfinityUnlocking))">SetProperty(InfinityUnlockVisible,true)</onclick>
      <onclick condition="String.IsEmpty(Window.Property(InfinityUnlocking))">CancelAlarm(InfinityHideUnlock,silent)</onclick>
      <onclick condition="String.IsEmpty(Window.Property(InfinityUnlocking))">AlarmClock(InfinityHideUnlock,ClearProperty(InfinityUnlockVisible),00:00:03,silent)</onclick>
    </control>

    <!-- Initial lock: property is explicitly cleared after one second, so it fully disappears. -->
    <control type="image">
      <left>48</left><top>35</top><width>58</width><height>58</height>
      <texture>osd/fullscreen/buttons/infinity-lock.png</texture>
      <visible>!String.IsEmpty(Window.Property(InfinityLockHint)) + String.IsEmpty(Window.Property(InfinityUnlocking))</visible>
      <animation effect="fade" start="0" end="100" time="100">Visible</animation>
      <animation effect="fade" start="100" end="0" time="220">Hidden</animation>
    </control>

    <!-- Tap screen: only this lock button appears. -->
    <control type="button" id="9901">
      <left>38</left><top>25</top><width>80</width><height>80</height>
      <texturefocus>osd/fullscreen/buttons/infinity-lock.png</texturefocus>
      <texturenofocus>osd/fullscreen/buttons/infinity-lock.png</texturenofocus>
      <label></label>
      <visible>!String.IsEmpty(Window.Property(InfinityUnlockVisible)) + String.IsEmpty(Window.Property(InfinityUnlocking))</visible>
      <animation effect="fade" start="0" end="100" time="100">Visible</animation>
      <onclick>CancelAlarm(InfinityHideUnlock,silent)</onclick>
      <onclick>ClearProperty(InfinityUnlockVisible)</onclick>
      <onclick>SetProperty(InfinityUnlocking,true)</onclick>
      <onclick>AlarmClock(InfinityFinishUnlock,Dialog.Close(1199),00:00:01,silent)</onclick>
    </control>

    <!-- Unlock icon gets a full second to render before the lock window closes. -->
    <control type="image">
      <left>48</left><top>35</top><width>58</width><height>58</height>
      <texture>osd/fullscreen/buttons/infinity-unlock.png</texture>
      <visible>!String.IsEmpty(Window.Property(InfinityUnlocking))</visible>
      <animation effect="fade" start="0" end="100" time="90">Visible</animation>
      <animation effect="zoom" start="88" end="104" center="77,64" time="140">Visible</animation>
      <animation effect="fade" start="100" end="0" time="220" delay="500">Visible</animation>
    </control>
  </controls>
</window>
''')
          PY
          SKIN=/tmp/decoded/assets/addons/skin.estuary
          mkdir -p "$SKIN/media/osd/fullscreen/buttons"
          cat >/tmp/lock.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="74" height="74" viewBox="0 0 74 74"><rect x="14" y="31" width="46" height="35" rx="7" fill="white"/><path d="M24 31V22c0-8 5-14 13-14s13 6 13 14v9" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/><circle cx="37" cy="47" r="4" fill="#111318"/><rect x="35" y="47" width="4" height="10" rx="2" fill="#111318"/></svg>
          SVG
          cat >/tmp/unlock.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="74" height="74" viewBox="0 0 74 74"><rect x="14" y="31" width="46" height="35" rx="7" fill="white"/><path d="M24 31V22c0-8 5-14 13-14 6 0 11 3 13 8" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/><circle cx="37" cy="47" r="4" fill="#111318"/><rect x="35" y="47" width="4" height="10" rx="2" fill="#111318"/></svg>
          SVG
          rsvg-convert -w 74 -h 74 /tmp/lock.svg -o "$SKIN/media/osd/fullscreen/buttons/infinity-lock.png"
          rsvg-convert -w 74 -h 74 /tmp/unlock.svg -o "$SKIN/media/osd/fullscreen/buttons/infinity-unlock.png"
          grep -n '00:00:01' "$SKIN/xml/Custom_1199_InfinityVideoLock.xml"
          grep -n 'infinity-unlock.png' "$SKIN/xml/Custom_1199_InfinityVideoLock.xml"
      - name: Rebuild and sign
        run: |
          set -euo pipefail
          java -jar /tmp/apktool.jar b /tmp/decoded -o /tmp/unsigned.apk
          BT="$ANDROID_HOME/build-tools/34.0.0"
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/project-infinity.keystore -alias projectinfinity -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Infinity Candidate 3, OU=Personal Build, O=Infinity, L=Detroit, ST=Michigan, C=US" >/dev/null 2>&1
          "$BT/zipalign" -f 4 /tmp/unsigned.apk /tmp/aligned.apk
          "$BT/apksigner" sign --ks ~/.android/project-infinity.keystore --ks-key-alias projectinfinity --ks-pass pass:android --key-pass pass:android --out /tmp/Infinity-Candidate-3.apk /tmp/aligned.apk
          "$BT/apksigner" verify --verbose /tmp/Infinity-Candidate-3.apk
      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-Candidate-3-Lock-Fade-Unlock-Fix
          path: /tmp/Infinity-Candidate-3.apk
          retention-days: 30
