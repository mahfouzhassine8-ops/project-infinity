name: Infinity | 2103330 directory result shutdown repair
on:
  workflow_dispatch:
  push:
    branches: [repair/infinity-directory-close-2103330]
    paths:
      - 'repairs/directory-close-2103330/native_repair.py'
      - 'repairs/directory-close-2103330/native_ci.py'
      - 'repairs/directory-close-2103330/native-delta.json'
      - 'repairs/directory-close-2103330/test_native.py'
      - 'repairs/directory-close-2103330/test-parent.json'
      - '.github/workflows/infinity-2103330-native-directory.yml'
permissions: {contents: read, actions: read}
concurrency: {group: infinity-2103330-native-directory, cancel-in-progress: false}
env:
  NDK_VER: 21.4.7075529
jobs:
  native-engine:
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    env:
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            ~/.ccache
          key: infinity-directory-3330-arm64-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            infinity-jobmanager-3327-arm64-${{ runner.os }}-
            infinity-cooperative-3326-arm64-${{ runner.os }}-
            infinity-diagnostics-3325-arm64-${{ runner.os }}-
      - name: Reconstruct exact 3327 and verify result-wait repair with real host threads
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y python3-yaml python3-dev
          mkdir -p engine3330
          python3 repairs/directory-close-2103330/native_ci.py prepare 2>&1 | tee engine3330/source-and-tests.log
      - uses: actions/cache/restore@v4
        with:
          path: kodi/tools/depends
          key: infinity-directory-3330-depends-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            infinity-jobmanager-3327-depends-${{ runner.os }}-
            infinity-cooperative-3326-depends-${{ runner.os }}-
            infinity-provider-3306-depends-build-${{ runner.os }}-
      - name: Compile ARM64 only and verify every protected source file
        run: |
          set -euo pipefail
          python3 repairs/directory-close-2103330/native_ci.py compile 2>&1 | tee engine3330/native-build.log
      - uses: actions/cache/save@v4
        if: always() && !cancelled()
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            ~/.ccache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103330-Directory-Native-Validation
          path: engine3330/
          compression-level: 1
          retention-days: 90
          if-no-files-found: error
