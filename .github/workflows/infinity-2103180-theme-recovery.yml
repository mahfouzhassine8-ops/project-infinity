name: Infinity | 2103180 Emergency Theme Recovery

on:
  push:
    branches: [cobra-2103180-theme-recovery]
    paths:
      - '.github/workflows/infinity-2103180-theme-recovery.yml'
      - 'repairs/cobra-theme-recovery-2103180/**'
  pull_request:
    branches: [infinity-cobra-2103179-buffer-resilience-rc1]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: infinity-2103180-recovery-${{ github.sha }}
  cancel-in-progress: false

env:
  NDK_VER: 21.4.7075529
  RUNTIME_COMMIT: b42760a25a27d23baa5db5770824cb8d32ec2290

jobs:
  audit-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Immutable reconstruction stack
        uses: actions/checkout@v5
        with:
          ref: cce2de3042cca22b531fa8ed9e13659c19dab8a4
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with: {ref: 4d1ed032df7e13fd27cc2170fc5e028f5059ec32, path: refinement-delta, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: b3bcb619b08205dcfc1451424b2d41e05fd37633, path: audit-delta, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: 7d95f8dd1696e340bde82cb73ce4e04a0bc2ac98, path: view-delta, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: fd2af59bab2edcaea6be9e5046720715e25e64e0, path: health-delta, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: 257a49d742890acf0c7d3e0220bded5a8aa80c57, path: experience-delta, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: 42b1afc95a07b3ce0f534232e0f774c5159ddec1, path: theme-delta, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: 0ff8b5463ae6adf26ef0f20d64bc1b10f6c5a593, path: settings-delta, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: 1465eabb045badad56142642c48292df94caaa12, path: candidate14-delta, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: 8f2c9c7b0fdd7bfcaa0d903f8df997a139c23261, path: next-delta, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: d9819b9823ff281f874daaa2bf91fdac1613aeb1, path: stability-delta, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: 6148e34be3024c5939c736a7b4316572d7bd50c0, path: insets-delta, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: 644160d0ca3baeebb6759638d3f40e2853eeed0b, path: audit166-delta, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: 2d72c733998d3c535a16d354058344007c5f7921, path: status167-delta, persist-credentials: false}
      - name: Proven status-bar surface resolver
        uses: actions/checkout@v5
        with: {ref: 3b97cd74e2f0e42b091a21fcab4019dfa319eb48, path: surface-delta, persist-credentials: false}
      - name: Exact passed 2103170 edge-to-edge recipe
        uses: actions/checkout@v5
        with: {ref: 6046c0ac64c7ef83a65550d53ffd4211c6cb5bef, path: edge170, persist-credentials: false}
      - name: Exact locked 2103171 chooser delta
        uses: actions/checkout@v5
        with: {ref: 59cf1958e5d911ede8df9b04c200025f4b39026e, path: chooser171, persist-credentials: false}
      - name: Exact passed 2103175 screen-real-estate delta
        uses: actions/checkout@v5
        with: {ref: 8f29df5a3a51e9462336412222e0d674af1d5969, path: screen175, persist-credentials: false}
      - name: Exact passed 2103176 Live TV rewind delta
        uses: actions/checkout@v5
        with: {ref: 9c26e7aaa92c6c2bbe83a284c3377c6ca61d2224, path: rewind176, persist-credentials: false}
      - name: Exact passed 2103177 final feature-freeze delta
        uses: actions/checkout@v5
        with: {ref: 3c51f790018eda816beeac6328d050e1fe242d6e, path: freeze177, persist-credentials: false}
      - name: Exact passed 2103178 timeshift / mini-player repair
        uses: actions/checkout@v5
        with: {ref: 56792d4e44b381cff2c900e7b86ed99265b55d04, path: repair178, persist-credentials: false}
      - name: Exact 2103179 buffer resilience recipe
        uses: actions/checkout@v5
        with: {ref: 0560b18c497e9861864126d96f9b784e488ebe32, path: repair179, persist-credentials: false}
      - name: Isolated 2103180 recovery delta
        uses: actions/checkout@v5
        with: {ref: '${{ github.event.pull_request.head.sha || github.sha }}', path: recovery-delta, persist-credentials: false}

      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools}

      - uses: actions/download-artifact@v5
        with: {name: Infinity-1.0.9-Cobra-Full-Feature-Candidate-2, run-id: 35044752997, github-token: '${{ github.token }}', path: run40}
      - uses: actions/download-artifact@v5
        with: {name: Infinity-Cobra-Player-Reboot-Lock-2103152, run-id: 35169846333, github-token: '${{ github.token }}', path: rollback2103152}
      - uses: actions/download-artifact@v5
        with: {name: Infinity-Cobra-Guide-Player-Refinement-2103153-Audited, run-id: 35176733529, github-token: '${{ github.token }}', path: rollback2103153}
      - uses: actions/download-artifact@v5
        with: {name: Infinity-Cobra-Adaptive-Views-EPG-Repair-RC1-2103155, run-id: 35188339917, github-token: '${{ github.token }}', path: baseline155}
      - uses: actions/download-artifact@v5
        with: {name: Infinity-Cobra-Diagnostics-Audit-RC1-2103156, run-id: 35192605567, github-token: '${{ github.token }}', path: baseline156}
      - uses: actions/download-artifact@v5
        with: {name: Infinity-Cobra-TV-Navigation-Appearance-RC1-2103157, run-id: 35200244871, github-token: '${{ github.token }}', path: baseline157}
      - uses: actions/download-artifact@v5
        with: {name: Infinity-Cobra-Health-Playback-RC1-2103158, run-id: 35206405387, github-token: '${{ github.token }}', path: baseline158}
      - uses: actions/download-artifact@v5
        with: {name: Cobra-2103158-Health-Playback-Evidence, run-id: 35206405387, github-token: '${{ github.token }}', path: evidence158}
      - uses: actions/download-artifact@v5
        with: {name: Infinity-Experience-Zip-Bridge-RC1-2103159, run-id: 35278026159, github-token: '${{ github.token }}', path: baseline159}
      - uses: actions/download-artifact@v5
        with: {name: Cobra-2103160-Visual-Theme-Runtime-v2-TEST-CANDIDATE, run-id: 35290503341, github-token: '${{ github.token }}', path: baseline160}
      - uses: actions/download-artifact@v5
        with: {name: Cobra-2103161-Theme-Management-Background-Mode-Safe-Area-TEST-CANDIDATE, run-id: 35314694255, github-token: '${{ github.token }}', path: baseline161}
      - uses: actions/download-artifact@v5
        with: {name: Cobra-2103162-Theme-Switch-Player-Rotation-TEST-CANDIDATE, run-id: 35324889607, github-token: '${{ github.token }}', path: baseline162}
      - uses: actions/download-artifact@v5
        with: {name: Cobra-2103162-Theme-Switch-Player-Rotation-TEST-CANDIDATE, run-id: 35331099172, github-token: '${{ github.token }}', path: baseline163}
      - uses: actions/download-artifact@v5
        with: {name: Cobra-2103164-Playback-Stability-TEST-CANDIDATE, run-id: 35338917341, github-token: '${{ github.token }}', path: baseline164}
      - uses: actions/download-artifact@v5
        with: {name: Cobra-2103165-Insets-PiP-Return-Player-Consistency-TEST-CANDIDATE, run-id: 35343195748, github-token: '${{ github.token }}', path: baseline165}
      - uses: actions/download-artifact@v5
        with: {name: Cobra-2103166-End-to-End-UI-Lifecycle-Audit-TEST-CANDIDATE, run-id: 35347847781, github-token: '${{ github.token }}', path: baseline166}
      - uses: actions/download-artifact@v5
        with: {name: Cobra-2103167-Status-Bar-Restore-TEST-CANDIDATE, run-id: 35371132749, github-token: '${{ github.token }}', path: baseline167}
      - name: Exact locked 2103168 native crash fix
        uses: actions/download-artifact@v5
        with:
          name: Infinity-2103168-Status-Bar-PythonInvoker-Stability-TEST-CANDIDATE
          run-id: 35374581122
          github-token: ${{ github.token }}
          path: baseline168native
      - name: Exact passed 2103170 rollback
        uses: actions/download-artifact@v5
        with:
          name: Infinity-2103170-Status-Bar-Edge-to-Edge-TEST-CANDIDATE
          run-id: 35386404644
          github-token: ${{ github.token }}
          path: baseline170
      - name: Exact locked 2103171 rollback
        uses: actions/download-artifact@v5
        with:
          name: Infinity-2103171-Chooser-Status-Bar-Surface-TEST-CANDIDATE
          run-id: 35391501653
          github-token: ${{ github.token }}
          path: baseline171
      - name: Exact passed 2103175 baseline
        uses: actions/download-artifact@v5
        with:
          name: Infinity-2103175-Fullscreen-Background-Safe-Content-TEST-CANDIDATE
          run-id: 35405052743
          github-token: ${{ github.token }}
          path: baseline175
      - name: Exact passed 2103176 baseline
        uses: actions/download-artifact@v5
        with:
          name: Infinity-2103176-Live-TV-Rewind-Catchup-TEST-CANDIDATE
          run-id: 35416469460
          github-token: ${{ github.token }}
          path: baseline176
      - name: Exact passed 2103177 baseline
        uses: actions/download-artifact@v5
        with:
          name: Infinity-2103177-Final-Feature-Freeze-TEST-CANDIDATE
          run-id: 35424620170
          github-token: ${{ github.token }}
          path: baseline177
      - name: Exact passed 2103178 baseline
        uses: actions/download-artifact@v5
        with:
          name: Infinity-2103178-Timeshift-Mini-Player-Repair-TEST-CANDIDATE
          run-id: 35426978986
          github-token: ${{ github.token }}
          path: baseline178

      - name: Reconstruct exact 2103167 shell
        run: |
          set -euo pipefail
          python3 -m pip install pyyaml
          python3 theme-delta/repairs/cobra-theme-runtime-2103160/ci.py reconstruct
          python3 theme-delta/repairs/cobra-theme-runtime-2103160/ci.py apply
          python3 settings-delta/repairs/cobra-settings-background-2103161/ci.py upgrade
          python3 candidate14-delta/repairs/cobra-theme-rotation-2103162/ci.py upgrade
          python3 next-delta/repairs/cobra-candidate14-five-fixes-2103163/ci.py upgrade
          python3 stability-delta/repairs/cobra-playback-stability-2103164/ci.py upgrade
          python3 insets-delta/repairs/cobra-inner-insets-pip-return-2103165/ci.py upgrade
          python3 audit166-delta/repairs/cobra-end-to-end-audit-2103166/ci.py upgrade
          python3 status167-delta/repairs/cobra-status-bar-restore-2103167/ci.py upgrade

      - name: Recreate exact passed 2103170 source
        run: |
          set -euo pipefail
          python3 surface-delta/repairs/cobra-status-bar-surface-2103168/ci.py upgrade
          mkdir -p audit170
          cp audit168/source-audit/source-audit.json audit170/surface-source-audit.json
          python3 edge170/repairs/statusbar-edge-to-edge-2103170/apply.py \
            --source kodi --receipt engine/background-resume-source.json --out audit170/edge-patch
          python3 edge170/repairs/statusbar-edge-to-edge-2103170/source_audit.py \
            --source kodi --patch audit170/edge-patch/patch.json --out audit170/edge-source-audit
          python3 edge170/repairs/statusbar-edge-to-edge-2103170/ci.py promote \
            --source kodi \
            --base168 baseline168native/Infinity-1.0.9-Cobra-Status-Bar-PythonInvoker-Stability-RC1.apk \
            --out audit170

      - name: Apply exact chooser-only 2103171 repair
        run: |
          set -euo pipefail
          python3 chooser171/repairs/chooser-statusbar-2103171/ci.py upgrade

      - name: Apply exact 2103175 full-window background / safe-content repair
        run: |
          set -euo pipefail
          python3 screen175/repairs/fullscreen-background-safe-content-2103175/ci.py upgrade

      - name: Apply exact passed 2103176 Live TV rewind / catch-up
        run: |
          set -euo pipefail
          python3 rewind176/repairs/cobra-live-rewind-2103176/ci.py upgrade

      - name: Apply exact passed 2103177 final feature-freeze delta
        run: |
          set -euo pipefail
          python3 freeze177/repairs/cobra-final-feature-freeze-2103177/ci.py upgrade

      - name: Apply exact passed 2103178 timeshift transport + mini-player repair
        run: |
          set -euo pipefail
          python3 repair178/repairs/cobra-timeshift-miniplayer-2103178/ci.py upgrade

      - name: Apply 2103179 evidence-driven buffer resilience
        run: |
          set -euo pipefail
          python3 repair179/repairs/cobra-buffer-resilience-2103179/ci.py upgrade

      - name: Apply chooser-independent emergency theme recovery
        run: |
          set -euo pipefail
          python3 recovery-delta/repairs/cobra-theme-recovery-2103180/apply.py --source kodi --out audit180
          python3 - <<'PY'
          from pathlib import Path
          import json
          report=json.loads(Path('audit180/patch.json').read_text())
          assert not report['native_changed'] and not report['playback_changed'] and not report['timeshift_changed']
          splash=Path('kodi/tools/android/packaging/xbmc/src/Splash.java.in').read_text()
          for token in ('Restore Built-in Theme','Cobra recovery','restoreBuiltInVisualThemeFromChooser','visual-theme.disabled-by-recovery.json'): assert token in splash
          print('PASS: recovery is Splash-only after exact 2103179 reconstruction')
          PY

      - name: Build/sign recovery APK without rebuilding native engine
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 scripts/package_background_resume.py \
            --source kodi \
            --base-apk baseline168native/Infinity-1.0.9-Cobra-Status-Bar-PythonInvoker-Stability-RC1.apk \
            --build-dir repair180-build \
            --out signed180
          apk="$(find signed180 -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$apk"
          cp "$apk" signed180/Infinity-Cobra-2103180-Emergency-Theme-Recovery.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs signed180/Infinity-Cobra-2103180-Emergency-Theme-Recovery.apk > signed180/apksigner.txt
          sha256sum signed180/Infinity-Cobra-2103180-Emergency-Theme-Recovery.apk > signed180/SHA256SUMS
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk=Path('signed180/Infinity-Cobra-2103180-Emergency-Theme-Recovery.apk')
          with zipfile.ZipFile(apk) as z:
              dex=b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
              for token in (b'Restore Built-in Theme',b'Cobra recovery',b'Built-in Cobra theme restored',b'visual-theme.disabled-by-recovery.json'): assert token in dex
          print('PASS: recovery code present in signed APK')
          PY

      - name: Publish recovery-enabled APK
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-Cobra-2103180-Emergency-Theme-Recovery
          path: |
            signed180/
            audit180/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
