name: Infinity | 2103285 native FD core rebuild
on:
  push:
    branches: [candidate-infinity-2103285-native-fd-recovery]
    paths:
      - '.github/workflows/infinity-2103285-native-fd-core.yml'
      - 'repairs/native-fd-2103285/InfinitySocketPoll.h'
      - 'repairs/native-fd-2103285/apply.py'
      - 'repairs/native-fd-2103285/manifest.json'
      - 'repairs/native-fd-2103285/tests/**'
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: infinity-2103285-native-${{ github.sha }}
  cancel-in-progress: false
env:
  NDK_VER: 21.4.7075529
jobs:
  native-engine:
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    env:
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools}
      - uses: actions/cache/restore@v4
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            ~/.ccache
          key: infinity-deep-audio-21.3-arm64-${{ runner.os }}-${{ hashFiles('patches/infinity-7.1-audited/contract.json', 'patches/infinity-responsive-v5/contract.json', 'patches/infinity-refresh/**', 'patches/infinity-media/**', 'patches/infinity-audio-policy/**') }}
          restore-keys: |
            infinity-responsive-v5-21.3-arm64-${{ runner.os }}-
            infinity-71-audited-deps-21.3-arm64-${{ runner.os }}-
      - name: Host high-FD adapter regression with ASan and UBSan
        run: |
          set -euo pipefail
          mkdir -p fd285-evidence
          c++ -std=c++17 -DINFINITY_SOCKET_POLL_TEST -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer repairs/native-fd-2103285/tests/socket_poll_test.cpp -pthread -o /tmp/fd-host-test
          ASAN_OPTIONS=detect_leaks=1 /tmp/fd-host-test 2>&1 | tee fd285-evidence/socket-poll-host-tests.txt
      - name: Reconstruct exact Kodi 21.3 native base
        run: |
          set -euo pipefail
          bash scripts/infinity_live_app_ci_1.sh
          test "$(git -C kodi rev-parse HEAD)" = a3a448d26b8d560a65655dab2cd122994dc4e146
      - name: Preserve 2103209 GIL and 2103254 Python runtime repairs
        run: |
          set -euo pipefail
          mkdir -p engine
          python3 scripts/infinity_python_invoker_hardening_v2.py apply --source kodi --receipt engine/pythoninvoker-threadstate-v2-source.json
          python3 scripts/infinity_python_invoker_hardening_v2.py verify --source kodi
          python3 scripts/infinity_python_invoker_hardening_v3.py apply --source kodi --receipt engine/pythoninvoker-runtime-v3-source.json
          python3 scripts/infinity_python_invoker_hardening_v3.py verify --source kodi
          sha256sum kodi/xbmc/interfaces/python/PythonInvoker.cpp kodi/xbmc/interfaces/python/PythonInvoker.h > fd285-evidence/protected-python-before-fd.txt
      - name: Apply exact tested native FD source and test real Neptune
        run: |
          set -euo pipefail
          python3 repairs/native-fd-2103285/apply.py --source kodi --receipt fd285-evidence/native-fd-source.json
          sha256sum -c fd285-evidence/protected-python-before-fd.txt
          python3 repairs/native-fd-2103285/tests/run_neptune.py kodi /tmp/neptune-build 2>&1 | tee fd285-evidence/neptune-tests.txt
          TOOLCHAIN="$ANDROID_HOME/ndk/$NDK_VER/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$TOOLCHAIN/aarch64-linux-android21-clang++" -std=c++17 -O2 -D_FORTIFY_SOURCE=2 -Wall -Wextra -Werror -static-libstdc++ repairs/native-fd-2103285/tests/socket_poll_test.cpp -pthread -llog -o fd285-evidence/fd-test-arm64
          "$TOOLCHAIN/x86_64-linux-android21-clang++" -std=c++17 -O2 -D_FORTIFY_SOURCE=2 -Wall -Wextra -Werror -static-libstdc++ repairs/native-fd-2103285/tests/socket_poll_test.cpp -pthread -llog -o fd285-evidence/fd-test-android-x86_64
          git -C kodi diff -- xbmc/network xbmc/filesystem lib/libUPnP/Neptune/Source/System/Bsd xbmc/platform/posix/filesystem/SMBWSDiscoveryListener.cpp > fd285-evidence/native-fd-source.diff
      - name: Full native compile with preserved render hardening
        run: |
          set -euo pipefail
          bash scripts/infinity_live_app_ci_2.sh
          python3 repairs/native-fd-2103285/apply.py --verify --source kodi --receipt fd285-evidence/native-fd-source.json
          python3 scripts/infinity_python_invoker_hardening_v3.py verify --source kodi
          sha256sum -c fd285-evidence/protected-python-before-fd.txt
      - name: Extract and bind rebuilt engine to source proofs
        run: |
          set -euo pipefail
          mkdir -p native285
          python3 - <<'PY'
          import hashlib,json,zipfile,subprocess
          from pathlib import Path
          apk=Path('engine/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2-Engine-Base.apk')
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              data=z.read('lib/arm64-v8a/libkodi.so')
          assert b'INFINITY_FD_POLL_V1' in data
          digest=hashlib.sha256(data).hexdigest()
          assert digest!='c7976ce0adb45b9264f2092a27111be4e05bde4220be2b26b1ea0e2cc74f1e2d'
          Path('native285/libkodi.so').write_bytes(data)
          for name in ['pythoninvoker-threadstate-v2-source.json','pythoninvoker-runtime-v3-source.json']:
              proof=json.loads((Path('engine')/name).read_text())
              assert all(proof['checks'].values())
          source=json.loads(Path('fd285-evidence/native-fd-source.json').read_text())
          assert source['verified']
          proof={'schema':1,'native_engine_sha256':digest,'parent_native_sha256':'c7976ce0adb45b9264f2092a27111be4e05bde4220be2b26b1ea0e2cc74f1e2d','native_base':'Kodi 21.3 with preserved Infinity GUI/Python repairs','native_fd_source':source,'skin_changed':False,'apk_built':False,'device_verified':False,'crashing_caller_proven':False}
          Path('native285/engine-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n')
          Path('native285/SHA256SUMS.txt').write_text(digest+'  libkodi.so\n')
          print('Native engine candidate built:',digest)
          PY
          readelf -h -n -d -W native285/libkodi.so > native285/elf-identity.txt
          readelf --dyn-syms -W native285/libkodi.so > fd285-evidence/native-symbols.txt
          grep -q 'ppoll' fd285-evidence/native-symbols.txt
          cp engine/pythoninvoker-*-source.json native285/
          cp engine/gui-render-hardening-source.json native285/
          cp fd285-evidence/native-fd-source.json native285/
      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103285-Native-FD-Engine
          path: native285/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103285-Native-FD-Evidence
          path: fd285-evidence/
          if-no-files-found: warn
          retention-days: 90
  dependency-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Retrieve exact pinned shairplay source for remaining native-call review
        run: |
          set -euo pipefail
          mkdir -p inputs
          curl --fail --location --retry 3 https://mirrors.kodi.tv/build-deps/sources/shairplay-096b61a.tar.bz2 -o inputs/shairplay-096b61a.tar.bz2
          echo '592a001954fd3ca86a81a907fef3892ebb53f4b91e937a049ec048e3473919f1c6e00fdf4a755d187c0b07afb0062e3613587f95817ec0786eeac5c18848ae1f  inputs/shairplay-096b61a.tar.bz2' | sha512sum -c -
      - uses: actions/upload-artifact@v7
        with: {name: Infinity-2103285-Shairplay-Source, path: inputs/, retention-days: 30, if-no-files-found: error}
