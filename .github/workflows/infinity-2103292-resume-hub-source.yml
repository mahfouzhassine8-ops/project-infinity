name: Infinity | 2103292 Resume Hub Source Prep

on:
  workflow_dispatch:
  push:
    branches: [candidate-infinity-2103292-resume-hub]
    paths:
      - 'repairs/resume-hub-2103292/source.tar.gz.b64.part*'
      - '.github/workflows/infinity-2103292-resume-hub-source.yml'

permissions:
  contents: write

concurrency:
  group: infinity-2103292-resume-hub-source
  cancel-in-progress: true

jobs:
  unpack-validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: candidate-infinity-2103292-resume-hub

      - name: Reconstruct Resume Hub source bundle
        run: |
          set -euo pipefail
          cd repairs/resume-hub-2103292
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, zlib
          parts=[Path(f"source.tar.gz.b64.part{i:02d}") for i in range(4)]
          text="".join(p.read_text() for p in parts)
          compact="".join(text.split())
          compact += "=" * ((-len(compact)) % 4)
          data=base64.b64decode(compact, validate=True)
          Path("source.tar.gz").write_bytes(data)
          d=zlib.decompressobj(16 + zlib.MAX_WBITS)
          tar=d.decompress(data)
          try:
              tar += d.flush()
          except zlib.error:
              pass
          if not tar:
              raise SystemExit("Resume Hub gzip produced no tar payload")
          Path("source.tar").write_bytes(tar)
          print(f"Decoded base64={len(compact)} gzip={len(data)} tar={len(tar)} gzip_eof={d.eof}")
          print("gzip_sha256="+hashlib.sha256(data).hexdigest())
          print("tar_sha256="+hashlib.sha256(tar).hexdigest())
          PY
          # The transported gzip lost its footer. The tar payload is authoritative only if
          # tar can parse the complete archive and every member extracts successfully.
          tar -tf source.tar > source-tar-members.txt
          test -s source-tar-members.txt
          rm -rf src
          mkdir -p src
          tar -xf source.tar -C src
          echo "Resume Hub source files:"
          find src -type f | sort
          test "$(find src -type f | wc -l)" -gt 0

      - name: Python/XML preflight
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import py_compile, xml.etree.ElementTree as ET
          root=Path('repairs/resume-hub-2103292/src')
          for p in root.rglob('*.py'):
              py_compile.compile(str(p), doraise=True)
          for p in root.rglob('*.xml'):
              ET.parse(p)
          print('PASS: Resume Hub source Python/XML preflight')
          PY

      - name: Commit unpacked source for auditability
        run: |
          set -euo pipefail
          rm -f repairs/resume-hub-2103292/source.tar.gz repairs/resume-hub-2103292/source.tar repairs/resume-hub-2103292/source-tar-members.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repairs/resume-hub-2103292/src
          if git diff --cached --quiet; then
            echo "No extracted source changes to commit"
          else
            git commit -m "Unpack and validate Resume Hub 2103292 source"
            git push origin HEAD:candidate-infinity-2103292-resume-hub
          fi
