name: Infinity | Cobra 2103150 Iron Polish
on:
  workflow_dispatch:
  push:
    branches: [infinity-cobra-2103150-iron-polish]
    paths:
      - 'scripts/infinity_cobra_mobile_tv_guide_views.py'
      - 'scripts/infinity_cobra_mobile_modernization.py'
      - 'scripts/infinity_cobra_appearance_modes.py'
      - 'scripts/infinity_cobra_post_2103148_polish.py'
      - 'scripts/infinity_cobra_post_2103148_polish_v2.py'
      - 'scripts/infinity_cobra_2103150_iron_polish.py'
      - 'scripts/infinity_cobra_2103150_iron_polish_v2.py'
      - 'scripts/infinity_cobra_task_exit.py'
      - 'scripts/infinity_experience_chooser_simplify.py'
      - 'addons/script.infinity.cobra.theme/**'
      - '.github/workflows/infinity-cobra-2103150-iron-polish.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-cobra-2103150-iron-polish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-update:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      NDK_VER: 21.4.7075529
      RUNTIME_COMMIT: b42760a25a27d23baa5db5770824cb8d32ec2290
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v5
        with:
          name: Infinity-1.0.9-Cobra-Full-Feature-Candidate-2
          run-id: 35044752997
          github-token: ${{ github.token }}
          path: run40

      - name: Verify exact signed native baseline
        run: |
          mkdir -p background-rollback background-candidate engine preflight ui-package
          cp run40/candidate/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2.apk background-rollback/Infinity-Run40-Exact-Base.apk
          echo '8ef45e9c54a79e2295e295ce1fcdd3430322a0049c7ff5227804c15aed6b4c57  background-rollback/Infinity-Run40-Exact-Base.apk' | sha256sum -c -

      - name: Reconstruct protected RC3 Runtime v3 and 2103141 player source
        run: |
          bash scripts/infinity_live_app_ci_1.sh
          mkdir -p engine/background-preimage/tools/android/packaging engine/background-preimage/cmake/scripts/android
          cp -a kodi/tools/android/packaging/xbmc engine/background-preimage/tools/android/packaging/
          cp kodi/cmake/scripts/android/Install.cmake engine/background-preimage/cmake/scripts/android/
          git -C kodi diff --binary -- xbmc > engine/native-before.patch
          python3 scripts/infinity_background_resume.py --source kodi --receipt engine/background-resume-source.json
          python3 scripts/infinity_background_control_bridge.py --source kodi --receipt engine/background-resume-source.json --packager scripts/package_background_resume.py
          mkdir -p engine/lifecycle-preimage/tools/android/packaging engine/lifecycle-preimage/cmake/scripts/android
          cp -a kodi/tools/android/packaging/xbmc engine/lifecycle-preimage/tools/android/packaging/
          cp kodi/cmake/scripts/android/Install.cmake engine/lifecycle-preimage/cmake/scripts/android/
          python3 scripts/infinity_cobra_async_lifecycle.py --source kodi --receipt engine/background-resume-source.json --packager scripts/package_background_resume.py
          python3 tests/infinity_background/test_async_lifecycle.py --before engine/lifecycle-preimage/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in --after kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in --out preflight/lifecycle-races
          git -C kodi diff --binary -- xbmc > engine/native-after-rc3.patch
          cmp engine/native-before.patch engine/native-after-rc3.patch

          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${RUNTIME_COMMIT}"
          for f in infinity_1_0_9_cobra_approved_ui.py infinity_1_0_9_cobra_zip_ui_runtime.py infinity_1_0_9_cobra_zip_ui_runtime_matcher_fix.py apply_cobra_approved_ui.py; do
            curl -fsSL "$base/scripts/$f" -o "scripts/$f"
          done
          python3 -m py_compile \
            scripts/infinity_1_0_9_cobra_approved_ui.py \
            scripts/infinity_1_0_9_cobra_zip_ui_runtime.py \
            scripts/infinity_1_0_9_cobra_zip_ui_runtime_matcher_fix.py \
            scripts/apply_cobra_approved_ui.py \
            scripts/infinity_cobra_ui_frontend.py \
            scripts/infinity_cobra_ui_frontend_matcher_fix.py \
            scripts/infinity_cobra_player_presentation_fix.py \
            scripts/infinity_cobra_player_presentation_fix_v2.py \
            scripts/infinity_cobra_mobile_tv_guide_views.py \
            scripts/infinity_cobra_mobile_modernization.py \
            scripts/infinity_cobra_appearance_modes.py \
            scripts/infinity_cobra_post_2103148_polish.py \
            scripts/infinity_cobra_post_2103148_polish_v2.py \
            scripts/infinity_cobra_2103150_iron_polish.py \
            scripts/infinity_cobra_2103150_iron_polish_v2.py \
            scripts/infinity_cobra_task_exit.py \
            scripts/infinity_experience_chooser_simplify.py
          python3 scripts/apply_cobra_approved_ui.py --source kodi
          python3 scripts/infinity_cobra_ui_frontend_matcher_fix.py --source kodi
          python3 scripts/infinity_cobra_player_presentation_fix_v2.py --source kodi
          git -C kodi diff --binary -- xbmc > engine/native-after-2103141-source.patch
          cmp engine/native-before.patch engine/native-after-2103141-source.patch

      - name: Rebuild locked 2103149 presentation stack
        run: |
          python3 scripts/infinity_cobra_mobile_tv_guide_views.py --source kodi
          python3 scripts/infinity_cobra_task_exit.py --source kodi
          python3 scripts/infinity_cobra_mobile_modernization.py --source kodi
          python3 scripts/infinity_cobra_appearance_modes.py --source kodi
          python3 scripts/infinity_cobra_post_2103148_polish_v2.py --source kodi
          JAVA=kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          for token in 'setContentDescription("Collapse Cobra drawer")' 'COBRA • COMPACT' 'COBRA • CARDS' 'COBRA • FOCUS' 'Aspect / Display' 'COBRA_SUBSCRIPTION_PREFIX' 'finishAndRemoveTask()'; do
            grep -Fq "$token" "$JAVA" || { echo "Missing locked 2103149 token: $token" >&2; exit 1; }
          done
          git -C kodi diff --binary -- xbmc > engine/native-after-2103149-stack.patch
          cmp engine/native-before.patch engine/native-after-2103149-stack.patch

      - name: Apply 2103150 warm cache virtualization orientation and video polish
        run: |
          python3 scripts/infinity_cobra_2103150_iron_polish_v2.py --source kodi
          JAVA=kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          for token in \
            'COBRA_LIBRARY_CACHE_FILE = "cobra-live-library-v1.json"' \
            'saved library • refreshing quietly' \
            'refreshing in background' \
            'addCobraDrawerAction(menu, "MOBILE"' \
            'android.widget.BaseAdapter cobraChannelAdapter' \
            'android.widget.GridView cobraChannelGrid' \
            'cobraTimelineAdapter(' \
            'COBRA • TV GRID' \
            'FAST BROWSE' \
            'TOUCH BROWSE' \
            'CINEMATIC BROWSE' \
            'session.setVideoTextureView(mPlayerTexture)' \
            'transfer.setVideoTextureView(mCobraPreviewTexture)' \
            'cobraVideoButton("▣", "Aspect / Display")'; do
            grep -Fq "$token" "$JAVA" || { echo "Missing 2103150 polish token: $token" >&2; exit 1; }
          done
          test "$(grep -Fc 'BUILDING YOUR LIVE LIBRARY…' "$JAVA")" = 1
          test "$(grep -Fc 'private void closeFullscreenToCobraView()' "$JAVA")" = 1
          git -C kodi diff --binary -- xbmc > engine/native-after-2103150-polish.patch
          cmp engine/native-before.patch engine/native-after-2103150-polish.patch

      - name: Apply protected two-card chooser
        run: |
          python3 scripts/infinity_experience_chooser_simplify.py --source kodi
          SPLASH=kodi/tools/android/packaging/xbmc/src/Splash.java.in
          grep -Fq 'launchInfinityExperience("infinity")' "$SPLASH"
          grep -Fq 'launchInfinityExperience("live")' "$SPLASH"
          grep -Fq 'Remember & launch' "$SPLASH"
          grep -Fq 'Ask every time' "$SPLASH"
          git -C kodi diff --binary -- xbmc > engine/native-after-chooser.patch
          cmp engine/native-before.patch engine/native-after-chooser.patch

      - name: Promote presentation runtime to 2103150
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          RELEASE='1.0.9-Cobra-Iron-Polish'
          VERSION=2103150
          gradle=Path('kodi/tools/android/packaging/xbmc/build.gradle.in')
          text=gradle.read_text()
          assert text.count('versionCode 2103138') == 1
          assert text.count('versionName "1.0.9-Infinity-Lifecycle-Repair-RC3"') == 1
          text=text.replace('versionCode 2103138',f'versionCode {VERSION}',1)
          text=text.replace('versionName "1.0.9-Infinity-Lifecycle-Repair-RC3"',f'versionName "{RELEASE}"',1)
          gradle.write_text(text)

          receipt=Path('engine/background-resume-source.json')
          row=json.loads(receipt.read_text())
          for rel in ('tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in','tools/android/packaging/xbmc/src/Splash.java.in','tools/android/packaging/xbmc/build.gradle.in'):
              if rel in row.get('files', {}):
                  row['files'][rel]['after']=hashlib.sha256((Path('kodi')/rel).read_bytes()).hexdigest()
          row.update(version_code=VERSION,version_name=RELEASE,cobra_ui_runtime=3,
                     locked_2103149_parent=True,rc3_lifecycle_preserved=True,
                     cobra_warm_library_cache=True,background_source_refresh=True,
                     last_good_library_fallback=True,virtualized_channel_browser=True,
                     large_library_target=12000,mobile_destination_restored=True,
                     orientation_adaptive_grid=True,orientation_adaptive_compact=True,
                     orientation_adaptive_cards=True,orientation_adaptive_focus=True,
                     portrait_focus_vertical_browser=True,landscape_focus_split_view=True,
                     touch_first_recycled_rows=True,in_place_preview_selection=True,
                     preview_fullscreen_session_reuse=True,fullscreen_preview_session_reuse=True,
                     compact_dark_player_chrome=True,player_aspect_always_reachable=True,
                     native_engine_unchanged=True)
          receipt.write_text(json.dumps(row,indent=2,sort_keys=True)+'\n')

          constants=Path('scripts/infinity_background_resume.py')
          c=constants.read_text()
          assert c.count('VERSION_CODE = 2103138') == 1
          assert c.count("RELEASE = '1.0.9-Infinity-Lifecycle-Repair-RC3'") == 1
          c=c.replace('VERSION_CODE = 2103138',f'VERSION_CODE = {VERSION}',1)
          c=c.replace("RELEASE = '1.0.9-Infinity-Lifecycle-Repair-RC3'",f"RELEASE = '{RELEASE}'",1)
          constants.write_text(c)

          pack=Path('scripts/package_background_resume.py')
          p=pack.read_text()
          old='Infinity-1.0.9-Infinity-Lifecycle-Repair-RC3'
          assert p.count(old) >= 1
          p=p.replace(old,'Infinity-'+RELEASE)
          pack.write_text(p)
          PY

      - name: Compile shell only sign and verify exact native bytes
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          python3 scripts/package_background_resume.py --source kodi --base-apk background-rollback/Infinity-Run40-Exact-Base.apk --build-dir iron-polish-build --out background-candidate
          APK=background-candidate/Infinity-1.0.9-Cobra-Iron-Polish.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee background-candidate/badging.txt
          grep -q "package: name='com.projectinfinity.kodi' versionCode='2103150' versionName='1.0.9-Cobra-Iron-Polish'" background-candidate/badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | tee background-candidate/signing.txt
          grep -qi 'd7adeb68e9341596a02bd3262b737a0f45fc6e771ed7e60285437e833b58c6d7' background-candidate/signing.txt
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          base=Path('background-rollback/Infinity-Run40-Exact-Base.apk')
          out=Path('background-candidate/Infinity-1.0.9-Cobra-Iron-Polish.apk')
          with zipfile.ZipFile(base) as a, zipfile.ZipFile(out) as b:
              libs=[n for n in a.namelist() if n.startswith('lib/') and not n.endswith('/')]
              assert libs
              for n in libs:
                  assert n in b.namelist(), n
                  assert hashlib.sha256(a.read(n)).digest()==hashlib.sha256(b.read(n)).digest(), n
              joined=b''.join(b.read(n) for n in b.namelist() if n.startswith('classes') and n.endswith('.dex'))
              for token in (b'MOBILE',b'TV GRID',b'FAST BROWSE',b'TOUCH BROWSE',b'CINEMATIC BROWSE',b'saved library',b'Aspect / Display',b'SUBSCRIPTION'):
                  assert token in joined, token
              for forbidden in (b'LAUNCH & REMEMBER',b'JUST THIS TIME',b'Record Channel'):
                  assert forbidden not in joined, forbidden
          print('PASS: 2103150 shell signed; exact protected native libraries preserved')
          PY
          sha256sum "$APK" | tee background-candidate/Infinity-1.0.9-Cobra-Iron-Polish.sha256

      - name: Package matching Cobra UI 1.3.5
        run: |
          python3 - <<'PY'
          import json,pathlib,xml.etree.ElementTree as ET
          root=pathlib.Path('addons/script.infinity.cobra.theme')
          ui=json.loads((root/'resources/cobra-ui.json').read_text())
          theme=json.loads((root/'resources/cobra-theme.json').read_text())
          addon=ET.parse(root/'addon.xml').getroot()
          assert addon.attrib['version']=='1.3.5'
          assert ui['version']=='1.3.5'
          assert ui['performance']['channel_library']=='virtualized_recycled_views'
          assert ui['performance']['warm_start']=='last_good_private_cache'
          assert ui['performance']['large_library_target']==12000
          assert 'mobile' in ui['views']['mobile']['drawer_destinations']
          assert ui['views']['tv_guide']['view_modes']=={
              'grid':'orientation_adaptive_timeline','compact':'virtual_dense_list',
              'cards':'responsive_touch_grid','focus':'adaptive_hero_with_virtual_browser'}
          assert ui['player']['mini_to_fullscreen']=='reuse_exoplayer_session'
          assert ui['player']['fullscreen_to_mini']=='reuse_exoplayer_session'
          assert ui['player']['pip_chrome']=='video_only'
          assert set(theme['palettes'])=={'dark','light','oled'}
          PY
          mkdir -p ui-package/script.infinity.cobra.theme/resources
          cp addons/script.infinity.cobra.theme/addon.xml ui-package/script.infinity.cobra.theme/
          cp addons/script.infinity.cobra.theme/resources/cobra-theme.json ui-package/script.infinity.cobra.theme/resources/
          cp addons/script.infinity.cobra.theme/resources/cobra-ui.json ui-package/script.infinity.cobra.theme/resources/
          cd ui-package
          zip -9 -r Infinity-Cobra-Mobile-TV-Guide-UI-1.3.5.zip script.infinity.cobra.theme
          sha256sum Infinity-Cobra-Mobile-TV-Guide-UI-1.3.5.zip > Infinity-Cobra-Mobile-TV-Guide-UI-1.3.5.sha256

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-Cobra-Iron-Polish-2103150
          path: |
            background-candidate/
            ui-package/Infinity-Cobra-Mobile-TV-Guide-UI-1.3.5.zip
            ui-package/Infinity-Cobra-Mobile-TV-Guide-UI-1.3.5.sha256
            engine/background-resume-source.json
            preflight/lifecycle-races/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
