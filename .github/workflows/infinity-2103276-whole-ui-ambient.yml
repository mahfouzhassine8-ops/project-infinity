name: Infinity | 2103276 Cobra Whole-UI Ambient candidate
on:
  workflow_dispatch:
  push:
    branches: [candidate-cobra-2103276-whole-ui-ambient]
    paths: ['.github/workflows/infinity-2103276-whole-ui-ambient.yml', 'repairs/whole-ui-ambient-2103276/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: whole-ui-ambient-${{ github.sha }}
  cancel-in-progress: false
env:
  NDK_VER: 21.4.7075529
  KODI_ANDROID_KEY_ALIAS: androiddebugkey
  KODI_ANDROID_KEY_PASSWORD: android
  KODI_ANDROID_STORE_PASSWORD: android
jobs:
  android-whole-ui-ambient-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103275-Immersive-Edge-Ambient-RC1-TEST-CANDIDATE
          run-id: 36783367196
          github-token: ${{ github.token }}
          path: parent275
      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103275-Immersive-Edge-Ambient-RC1-Evidence
          run-id: 36783367196
          github-token: ${{ github.token }}
          path: source275
      - name: Verify exact locked source and create rollback before mutations
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~1)" = 88b733f2a25eca1873673c27b75b51021e4ef56b || git merge-base --is-ancestor 88b733f2a25eca1873673c27b75b51021e4ef56b HEAD
          mkdir -p audit276
          git bundle create audit276/locked-2103275-rollback.bundle 88b733f2a25eca1873673c27b75b51021e4ef56b
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib,tarfile,zipfile,json,shutil
          src=Path('source275/reconstructed-2103275-shell.tar.gz');apk=Path('parent275/Infinity-2103275-Immersive-Edge-Ambient-RC1.apk')
          assert hashlib.sha256(src.read_bytes()).hexdigest()=='1a2fd49c2b9b324814fe4734c174957024b1113818cb2a4be88444c5066aee96'
          assert hashlib.sha256(apk.read_bytes()).hexdigest()=='fc6f336cf905564d6c50e3abdd30ee75fbff780a3f0da54fa9208605c26f3db8'
          with tarfile.open(src) as t:t.extractall('.',filter='data')
          for item in json.loads(Path('source275/source-verification.json').read_text())['files']:
            assert hashlib.sha256((Path('shell-kodi')/item['path']).read_bytes()).hexdigest()==item['after'],item['path']
          assert Path('shell-kodi/tools/android/packaging/xbmc/src/CobraImmersiveAmbient.java.in').read_bytes()==Path('repairs/immersive-edge-ambient-2103275/CobraImmersiveAmbient.java.in').read_bytes()
          shutil.copytree('shell-kodi','rollback275/shell-kodi');shutil.copy2(src,'audit276/locked-2103275-source.tar.gz')
          with zipfile.ZipFile(apk) as z:Path('engine/libinfinitycrash.so').write_bytes(z.read('lib/arm64-v8a/libinfinitycrash.so'))
          CHECK
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0' "ndk;$NDK_VER" >/dev/null
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          echo "KODI_ANDROID_STORE_FILE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
      - name: Apply bounded forward whole-UI ambient repair
        run: |
          set -euo pipefail
          python3 repairs/whole-ui-ambient-2103276/apply.py --root . --out audit276 --apk-sha fc6f336cf905564d6c50e3abdd30ee75fbff780a3f0da54fa9208605c26f3db8
          python3 repairs/whole-ui-ambient-2103276/verify_source.py --baseline rollback275 --root . --out audit276
      - name: Compile and permanently sign the candidate
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 scripts/package_background_resume.py --source shell-kodi --base-apk parent275/Infinity-2103275-Immersive-Edge-Ambient-RC1.apk --build-dir build276 --out signed276 2>&1 | tee audit276/android-build.log
      - name: Run explicit whole-UI tests and all locked regression suites
        run: |
          set -euo pipefail
          python3 repairs/whole-ui-ambient-2103276/stage_tests.py --build build276
          cd build276
          ./gradlew --no-daemon --console=plain :xbmc:testReleaseUnitTest             --tests '*WholeUiAmbientTest' --tests '*ImmersiveEdgeAmbientTest' --tests '*SportsHubSoccerVisibilityTest' --tests '*ProSportsIntegrationTest'             --tests '*SportsDataRepairTest' --tests '*SportsHubTest' --tests '*ProVisualTest' --tests '*ProActionsTest'             --tests '*ResponsiveWindowTest' --tests '*Cobra2103268ProductAuditTest'             --tests '*Cobra2103201ScrubberTest' --tests '*Cobra2103201SubtitleTest' --tests '*Cobra2103201MenuPolishTest'             --tests '*Cobra2103202LifecycleTest' --tests '*Cobra2103203PipControlsTest' --tests '*Cobra2103206MediaCallsTest'             --tests '*Cobra2103207CallIntegrationTest' --tests '*Cobra2103207AudioStateTest' --tests '*Cobra2103203SubtitleClarityTest'             --tests '*Cobra2103229MultiViewStabilityFillTest' --tests '*GlassChooserTest' --tests '*GlassOptionsTest'             --tests '*GlassHealthFinishTest' --tests '*RecoveryFixedTest' --tests '*PhoneGlassTest' --tests '*AmbientGlassTest'             --tests '*Cobra2103267PlayingDotRestoreTest'             2>&1 | tee ../audit276/android-product-tests.log
      - name: Enforce protected renders and candidate-only acceptance
        run: |
          set -euo pipefail
          python3 repairs/whole-ui-ambient-2103276/verify_source.py --baseline rollback275 --root . --out audit276
          python3 - <<'CHECK'
          from pathlib import Path
          import json,hashlib,xml.etree.ElementTree as E
          counts={}
          for f in Path('build276/xbmc/build/test-results/testReleaseUnitTest').glob('TEST-*.xml'):
            t=E.parse(f).getroot();assert all(int(t.attrib.get(k,0))==0 for k in ['failures','errors','skipped']),(f,t.attrib);counts[t.attrib['name']]=int(t.attrib['tests'])
          assert len(counts)==27,counts
          assert counts['com.projectinfinity.kodi.WholeUiAmbientTest']==21,counts
          assert sum(counts.values())==259,counts
          locked=Path('source275/screenshots/protected');current=Path('audit276/screenshots/protected');names=sorted(p.name for p in locked.glob('*.png'));assert len(names)==20,len(names)
          for name in names:assert (locked/name).read_bytes()==(current/name).read_bytes(),'Protected render changed: '+name
          report=json.loads(Path('signed276/background-resume-apk-audit.json').read_text());report.update(parent_locked_commit='88b733f2a25eca1873673c27b75b51021e4ef56b',automated_tests_passed=sum(counts.values()),test_methods=counts,protected_render_equality=len(names),physical_device_verified=False,candidate_locked=False,status='CI CANDIDATE ONLY — actual Fold visual acceptance required')
          Path('signed276/CANDIDATE-VERIFICATION.json').write_text(json.dumps(report,indent=2)+'\n')
          apk=Path('signed276/Infinity-2103276-Whole-UI-Ambient-RC1.apk');Path('signed276/SHA256SUMS.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'  '+apk.name+'\n')
          CHECK
      - name: Preserve source, rollback and test evidence
        if: always()
        run: |
          mkdir -p audit276/repair-source
          cp -r repairs/whole-ui-ambient-2103276/* audit276/repair-source/
          cp -r build276/xbmc/build/test-results audit276/candidate-test-results || true
          cp -r build276/xbmc/src/test audit276/staged-tests || true
          tar -czf audit276/reconstructed-2103276-shell.tar.gz shell-kodi engine/background-resume-source.json scripts/package_background_resume.py scripts/infinity_background_resume.py
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103276-Whole-UI-Ambient-RC1-TEST-CANDIDATE
          path: signed276/
          compression-level: 0
          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103276-Whole-UI-Ambient-RC1-Evidence
          path: audit276/
          retention-days: 90
