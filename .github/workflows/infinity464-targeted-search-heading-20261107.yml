name: Infinity464 isolated Umbrella TV Search All heading | diagnostic only, no APK
on:
  push:
    branches:
      - work/infinity464-targeted-crash-diagnosis-20261107
    paths:
      - .github/workflows/infinity464-targeted-search-heading-20261107.yml
      - repairs/infinity-final-release-462-20261107/replay_one_search_heading.py
      - repairs/infinity-final-release-462-20261107/verify_android_release.py
      - repairs/infinity-final-release-462-20261107/android_qa.py
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity464-single-heading-diagnostic
  cancel-in-progress: false
jobs:
  single_heading:
    name: One signed464 Umbrella TV heading replay, no full release rerun
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      INFINITY_EMULATOR_API: '37.0'
      INFINITY_EMULATOR_TARGET: google_apis
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '21'}
      - name: Require isolated signed-input replay, no runtime patch and no release claims
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast, pathlib
          root=pathlib.Path('repairs/infinity-final-release-462-20261107')
          for name in ('replay_one_search_heading.py','verify_android_release.py','android_qa.py','stage_android_release.py'):
              ast.parse((root/name).read_text(),filename=name)
          s=(root/'replay_one_search_heading.py').read_text()
          assert 'SpongeBob' in s and 'select-row' in s
          assert 'PASS_SINGLE_HEADING_REPLAY_ONLY' in s
          print('PASS scoped diagnostic scripts parsed; no signed APK modifications')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13495518701', run-id: '42204671979', github-token: ${{ github.token }}, path: parent462, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13596730735', run-id: '42428328498', github-token: ${{ github.token }}, path: signed464, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13596606000', run-id: '42428335227', github-token: ${{ github.token }}, path: signed465, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13565947121', run-id: '42351486944', github-token: ${{ github.token }}, path: current268, merge-multiple: true}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {cmdline-tools-version: '15859902', packages: 'platform-tools build-tools;35.0.0 cmdline-tools;22.0', log-accepted-android-sdk-licenses: false}
      - name: Prepare exact unmodified signed inputs and one disposable QA fixture
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y libpulse0 ffmpeg tesseract-ocr
          python3 -m pip install Pillow==11.3.0
          python3 repairs/infinity-final-release-462-20261107/stage_android_release.py --parent parent462/Infinity-2103462-Combined-Original-Signer.apk --candidate signed464/Infinity-2103464-Combined-Original-Signer.apk --recovery signed465/Infinity-2103465-Combined-Original-Signer.apk --current current268 --sdk "$ANDROID_HOME/build-tools/35.0.0" --out replay-fixture
          python3 repairs/four-repair-20261018/android37_gate.py --sdk-root "$ANDROID_HOME" --out replay-platform --pin-tools
          python3 repairs/android-checkpoint-shutdown/runtime-tests/prepare_android_emulator.py --out replay-emulator-setup
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '37.0'
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 10G
          avd-name: infinity-four-repair-api37
          pre-emulator-launch-script: python3 repairs/four-repair-20261018/android37_gate.py --sdk-root "$ANDROID_HOME" --out replay-platform --check-avd
          disable-animations: false
          emulator-options: -no-window -memory 4096 -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 repairs/infinity-final-release-462-20261107/replay_one_search_heading.py --parent parent462/Infinity-2103462-Combined-Original-Signer.apk --candidate signed464/Infinity-2103464-Combined-Original-Signer.apk --fixture replay-fixture --out replay-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Infinity464-Umbrella-Heading-Single-Replay-${{ github.run_id }}-DIAGNOSTIC-NOT-INSTALLER
          path: |
            replay-results/
            replay-fixture/SIGNED-INPUT-IDENTITY.json
          retention-days: 30
          if-no-files-found: warn
