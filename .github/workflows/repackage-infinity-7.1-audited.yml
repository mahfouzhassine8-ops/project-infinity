name: Infinity 7.1 Repackage Verified Engine Only
on:
  workflow_dispatch:
    inputs:
      engine_run_id:
        description: 'Run containing Infinity-7.1-Audited-Engine (exact source contract required)'
        required: true
        type: string
  push:
    branches: [infinity-7.1-core-unified]
    paths: ['build/infinity71-repackage.json']
permissions:
  contents: read
  actions: read
jobs:
  repackage:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Resolve the explicitly selected engine run
        id: engine
        env:
          INPUT_RUN_ID: ${{ inputs.engine_run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = os.environ.get('INPUT_RUN_ID') or str(json.loads(Path('build/infinity71-repackage.json').read_text())['engine_run_id'])
          if not run.isdecimal() or int(run) <= 0:
              raise SystemExit('A concrete positive engine run ID is required; no implicit donor substitution')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('run_id=' + run + '\n')
          PY
      - uses: actions/download-artifact@v5
        with:
          name: Infinity-7.1-Audited-Engine
          path: engine
          run-id: ${{ steps.engine.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Apply presentation assets only
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;34.0.0' >/dev/null
          mkdir -p candidate
          python3 scripts/infinity71.py overlay --apk engine/Infinity-7.1-Engine-Base.apk \
            --manifest engine/engine.json --output candidate/Infinity-7.1-Audited-unsigned.apk
      - name: Sign and prove the native and Java engine did not change
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          bash scripts/sign-infinity71.sh candidate/Infinity-7.1-Audited-unsigned.apk candidate/Infinity-7.1-Audited.apk
          python3 scripts/infinity71.py verify-overlay --apk candidate/Infinity-7.1-Audited.apk --manifest engine/engine.json
          cp engine/engine.json candidate/engine.json
      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-7.1-Audited-Candidate
          path: |
            candidate/Infinity-7.1-Audited.apk
            candidate/Infinity-7.1-Audited.sha256
            candidate/Infinity-7.1-Audited.signing.txt
            candidate/engine.json
          if-no-files-found: error
          retention-days: 30
