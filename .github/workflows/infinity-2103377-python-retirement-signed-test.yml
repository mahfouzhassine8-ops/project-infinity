name: Infinity 2103377 | Python retirement RC1 signed TEST APK

on:
  push:
    branches: [work/infinity-2103377-python-shutdown-retirement-rc1]
    paths:
      - '.github/workflows/infinity-2103377-python-retirement-signed-test.yml'
      - 'repairs/python-shutdown-package-2103377/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: infinity-2103377-python-retirement-rc1-signing
  cancel-in-progress: false

jobs:
  signed-test-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      NDK_VER: 21.4.7075529
    steps:
      - name: Checkout isolated packaging source
        uses: actions/checkout@v7
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Verify exact green native and protected signed Rails parent runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          pinned={
              38688464495:"6b80ff0936d18ce5dba6fc0f8b7afe715c40de8e",
              38629545799:"da6f640a27265e64ce43ee264690e1c92dc8ea40"
          }
          for run,commit in pinned.items():
              url="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+str(run)
              req=urllib.request.Request(url,headers={
                 "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                 "Accept":"application/vnd.github+json"})
              with urllib.request.urlopen(req,timeout=40) as response:
                  result=json.load(response)
              assert result["head_sha"]==commit,(run,"wrong signed/native source")
              assert result["status"]=="completed" and result["conclusion"]=="success",(run,"not green")
              print("Verified immutable green source",run,commit,flush=True)
          PY
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-linux-21.4.7075529-v1
      - name: Restore pinned NDK for symbol-preserving native-only package
        run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - uses: actions/download-artifact@v8
        with:
          run-id: 38629545799
          name: Infinity-Rails-Hold-RC02-Signed-APK
          github-token: ${{ github.token }}
          path: parent-rails
      - uses: actions/download-artifact@v8
        with:
          run-id: 38688464495
          name: Infinity-2103377-Python-Order-RC1-Native-Evidence
          github-token: ${{ github.token }}
          path: native-evidence
      - name: Package signed APK with permanent certificate and byte-level payload checks
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 -m py_compile repairs/python-shutdown-package-2103377/package_candidate.py
          mkdir -p shutdown-test-delivery
          python3 repairs/python-shutdown-package-2103377/package_candidate.py \
            --parent parent-rails/Infinity-2103377-Rails-Hold-Native-RC2-TEST.apk \
            --native native-evidence \
            --native-source-commit 6b80ff0936d18ce5dba6fc0f8b7afe715c40de8e \
            --out shutdown-test-delivery \
            2>&1 | tee shutdown-test-delivery/PACKAGING-VERIFICATION.log
          cat > shutdown-test-delivery/TEST-AND-ROLLBACK.md <<'MD'
          # Infinity 2103377 — Python Retirement RC1 (experimental)

          TEST ONLY. NOT LOCKED. NOT PHYSICALLY VERIFIED.

          Parent: exact signed Infinity-2103377-Rails-Hold-Native-RC2-TEST.apk
          SHA-256 17e2458552b7dbb8f14dad307015eafc2497a5ec6ddc4f7bb1707d975f37b906.

          Native build: GitHub Actions 38688464495, commit 6b80ff0936d18ce5dba6fc0f8b7afe715c40de8e.

          This APK changes only the native libkodi.so and AndroidManifest.xml
          versionName field. Its versionCode stays 2103377 and the signer must
          match the protected app. Skin 1.0.5.223 and Rails Helper 0.2.5 untouched.

          Save a separate offline copy of the locked parent. Never uninstall
          Infinity or clear app data. Test quick close, fully loaded close,
          add-on activity close, playback close, and reopening with user data intact.

          Rollback: reinstall the original signed Rails Hold RC02 APK over the test
          with the same package ID, versionCode and certificate. Never uninstall.

          Native green plus signing is NOT physical Fold save/retirement proof.
          If shutdown stalls, retain the protected baseline and capture diagnostics.
          No automatic promotion, production replacement or lock.
          MD
      - name: Upload isolated signed APK and preservation receipts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103377-Python-Retirement-RC1-Signed-Test-APK
          path: shutdown-test-delivery/
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
      - name: Preserve failure receipts without falsely publishing test APK
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103377-Python-Retirement-RC1-Package-Failure
          path: shutdown-test-delivery/
          retention-days: 30
          if-no-files-found: warn
