name: Diagnose Phone Bridge Playback State v2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-phone-playback-state-v2.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends unzip curl ripgrep
          curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
      - name: Download Stable 2 v12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9987128748/zip -o /tmp/base.zip
          mkdir -p /tmp/base
          unzip -q /tmp/base.zip -d /tmp/base
          APK=$(find /tmp/base -name '*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" /tmp/base.apk
      - name: Decode
        run: java -jar /tmp/apktool.jar d -f /tmp/base.apk -o /tmp/decoded
      - name: Inspect playback-related Android bridge points
        run: |
          set -euo pipefail
          echo '=== Main methods/fields mentioning play/video/native ==='
          MAIN=$(find /tmp/decoded -path '*/com/projectinfinity/kodi/Main.smali' | head -1)
          grep -nEi 'play|video|pause|resume|surface|native|render|audio' "$MAIN" | head -250 || true
          echo '=== Kodi package classes mentioning playback/player state ==='
          rg -n -i 'isplaying|playingvideo|hasvideo|player\.onplay|player\.onstop|player|getactiveplayers|playback|onplay|onstop|video.*play|play.*video' /tmp/decoded/smali*/com/projectinfinity/kodi 2>/dev/null | head -500 || true
          echo '=== Native methods in Kodi Android classes ==='
          rg -n '^\.method.* native ' /tmp/decoded/smali*/com/projectinfinity/kodi 2>/dev/null | head -300 || true
          echo '=== JSON RPC references ==='
          rg -n -i 'jsonrpc|Player\.|GetActivePlayers|GetProperties' /tmp/decoded/smali*/com/projectinfinity/kodi 2>/dev/null | head -400 || true
          echo '=== Media/session/service references ==='
          rg -n -i 'mediasession|mediabrowser|notification|foregroundservice|audiomanager|audiofocus' /tmp/decoded/smali*/com/projectinfinity/kodi 2>/dev/null | head -400 || true
