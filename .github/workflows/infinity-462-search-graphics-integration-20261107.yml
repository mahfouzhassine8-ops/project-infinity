name: Infinity462 integrated Search + native graphics + keyboard evidence, original signer readiness - NO APK
on:
  push:
    branches: [work/infinity-462-search-graphics-integration-20261107]
    paths:
      - .github/workflows/infinity-462-search-graphics-integration-20261107.yml
      - repairs/infinity-master-corrective-20261105/overlay/assets/addons/script.infinity.commandcenter/infinity_search.py
      - repairs/infinity-2103460-nine-corrections-20261106/fold-regressions/**
permissions: {contents: read, actions: read}
concurrency:
  group: infinity462-scoped-native-search-integration
  cancel-in-progress: true
jobs:
  source-and-verified-native:
    name: Search native UI 24 regressions + pinned compiled ARM64 keyboard/graphics input - NO APK
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env: {PYTHONDONTWRITEBYTECODE: '1'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - name: Exact graphics/keyboard parent and source-only Search integration boundary
        run: |
          set -euo pipefail
          mkdir -p integration-evidence
          python3 - <<'PY'
          import hashlib,subprocess
          from pathlib import Path
          base='4ee6a5f7346077900f09114439db947a02fa2737'
          source='b654fb0b0afb616c0749568bc06bf2b499928eb6'
          search='repairs/infinity-master-corrective-20261105/overlay/assets/addons/script.infinity.commandcenter/infinity_search.py'
          allowed={
            search,
            'repairs/infinity-2103460-nine-corrections-20261106/fold-regressions/test_unified_native_provider_selection.py',
            'repairs/infinity-2103460-nine-corrections-20261106/fold-regressions/test_native_owned_response_policy.py',
            'repairs/infinity-2103460-nine-corrections-20261106/fold-regressions/NATIVE-OWNED-RESPONSE-POLICY.md',
            '.github/workflows/infinity-462-search-graphics-integration-20261107.yml'
          }
          diff=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert diff==allowed,('Unexpected integrated edits',sorted(diff^allowed))
          expected=subprocess.check_output(['git','show',source+':'+search])
          actual=Path(search).read_bytes()
          assert hashlib.sha256(actual).hexdigest()==hashlib.sha256(expected).hexdigest()
          assert 'settings_only_drift' in actual.decode('utf-8')
          assert b'GUI_MSG_GESTURE_NOTIFY' not in actual
          print('PASS pinned Search source EXACT, native keyboard/graphics unchanged from fully linked source')
          PY
          git diff --name-only 4ee6a5f7346077900f09114439db947a02fa2737 HEAD > integration-evidence/CHANGED-FILES.txt
          python3 -m py_compile repairs/infinity-master-corrective-20261105/overlay/assets/addons/script.infinity.commandcenter/infinity_search.py
      - name: Existing 9 native Search UI + common provider contracts
        run: |
          set -euo pipefail
          cd repairs/infinity-2103460-nine-corrections-20261106/fold-regressions
          python3 -m unittest test_unified_native_provider_selection -v 2>&1 | tee "$GITHUB_WORKSPACE/integration-evidence/NATIVE-SEARCH-UI.txt"
      - name: Revised 15 fresh response/cache/route safety contracts
        run: |
          set -euo pipefail
          cd repairs/infinity-2103460-nine-corrections-20261106/fold-regressions
          python3 -m unittest test_native_owned_response_policy -v 2>&1 | tee "$GITHUB_WORKSPACE/integration-evidence/NATIVE-SEARCH-RESULTS.txt"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13586082418', run-id: '42401805296', github-token: '${{ github.token }}', path: pinned-native}
      - name: Verify full ARM64 native link artifact from EXACT graphics/keyboard parent
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          src=json.loads((Path('pinned-native')/'GRAPHICS-ENGINE-INTERNAL.json').read_text())
          assert src['status']=='PASS_FULL_ARM64_LINK_GESTURE_RENDER_CANDIDATE',src
          assert src['source_commit']=='4ee6a5f7346077900f09114439db947a02fa2737'
          assert src['protected_native_sources_unchanged']==9407
          assert src['Android']=='NOT_RUN' and src['APK'] is False and src['signed'] is False
          bin=Path('pinned-native/libkodi.so')
          assert bin.is_file() and bin.stat().st_size==src['native_bytes']
          with bin.open('rb') as fp: sha=hashlib.file_digest(fp,'sha256').hexdigest()
          assert sha==src['native_sha256'],'native artifact verification failed'
          report={'native_status':src['status'],'native_sha256':sha,
                  'native_size':bin.stat().st_size,'reused_exact_graphics_keyboard_commit':src['source_commit'],
                  'search_host_regressions_passed':24,'original_signing':False,
                  'APK':False,'Fold':'NOT_RUN','merged_runtime_verified':False}
          Path('integration-evidence/INTEGRATION-INPUTS.json').write_text(json.dumps(report,indent=2)+'\n')
          print('PASS source-bound 638 MB full Android ARM64 engine + exact revised native Search component; no APK')
          PY
      - name: Explicit release limitations
        if: always()
        run: |
          mkdir -p integration-evidence
          printf '%s\n' 'Integration SOURCE/ARTIFACT contract only; same-source native engine full link separately passed. Combined Android runtime, checkpoint/deadlock, Search actual device, original signed APK, packaging/forward recovery remain unverified.' 'This Search trust policy retains freshly completed native results even if meaningful settings/ABA occur during provider execution.' > integration-evidence/LIMITS.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity462-Integrated-Search-Graphics-Keyboard-Evidence-${{ github.run_id }}-NO-APK
          path: integration-evidence/
          retention-days: 30
          if-no-files-found: warn

  original-signer-readiness:
    name: Verify configured original APK signer certificate only - NEVER sign or upload key
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, show-progress: false}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - name: Check permanent signer availability without revealing key material
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
          INFINITY_SIGNER_SHA256: ${{ secrets.INFINITY_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p signing-readiness
          python3 - <<'PY'
          import base64,hashlib,json,os,re,subprocess,tempfile
          from pathlib import Path
          fields=('INFINITY_KEYSTORE_B64','INFINITY_STORE_PASSWORD','INFINITY_KEY_PASSWORD','INFINITY_KEY_ALIAS','INFINITY_SIGNER_SHA256')
          if not all(os.environ.get(key) for key in fields):
            status='BLOCKED_MISSING_SIGNING_FIELDS'
          else:
            expected=os.environ['INFINITY_SIGNER_SHA256'].strip().lower()
            assert re.fullmatch(r'[0-9a-f]{64}',expected),'invalid original cert pin'
            with tempfile.TemporaryDirectory(prefix='private-signing-cert-check-') as folder:
              key=Path(folder)/'signer.jks'
              pub=Path(folder)/'public.der'
              key.write_bytes(base64.b64decode(os.environ['INFINITY_KEYSTORE_B64'],validate=True))
              completed=subprocess.run(['keytool','-exportcert','-keystore',str(key),'-storepass:env','INFINITY_STORE_PASSWORD','-alias',os.environ['INFINITY_KEY_ALIAS'],'-file',str(pub)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              assert completed.returncode==0,'failed retained certificate export'
              assert hashlib.sha256(pub.read_bytes()).hexdigest()==expected,'original signer cert mismatch'
            status='READY_ORIGINAL_CERT_PIN_MATCH'
          Path('signing-readiness/STATUS.json').write_text(json.dumps({'status':status,'new_key_created':False,'APK_signed':False,'private_material_retained':False},indent=2)+'\n')
          print(status)
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity462-Original-Signer-Readiness-${{ github.run_id }}-NO-KEY-NO-APK
          path: signing-readiness/
          if-no-files-found: warn
          retention-days: 14
