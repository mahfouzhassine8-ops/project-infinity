name: Infinity504 Cast native-only release staging and delivery - no signing keys
on:
  push:
    branches: [work/infinity-2103504-cast-end-to-end-20261116]
    paths:
      - .github/workflows/infinity-504-cast-audio-release.yml
      - repairs/infinity-cast-end-to-end-2103504-20261116/release/STAGE-REQUEST.json
      - repairs/infinity-cast-end-to-end-2103504-20261116/release/INSTALL-REQUEST.json
      - repairs/infinity-cast-end-to-end-2103504-20261116/release/PUBLICATION-REQUEST.json
permissions: {contents: read, actions: read}
concurrency: {group: infinity504-cast-audio-delivery, cancel-in-progress: false}
jobs:
  stage:
    if: startsWith(github.event.head_commit.message, 'Cast504 stage:')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env: {PYTHONDONTWRITEBYTECODE: '1', GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools build-tools;35.0.0', log-accepted-android-sdk-licenses: false}
      - name: Preserve every original504 member except reviewed Cast and version metadata
        run: python repairs/infinity-cast-end-to-end-2103504-20261116/release/stage.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Infinity504-Cast-NativeOnly-${{ github.run_id }}-UNSIGNED-NOT-INSTALLABLE
          path: cast504-stage/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Infinity504-Cast-NativeOnly-${{ github.run_id }}-STAGING-RECEIPT-ONLY
          path: cast504-stage/STAGING.json
          if-no-files-found: error
          retention-days: 90
  install:
    if: startsWith(github.event.head_commit.message, 'Cast504 install:')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env: {PYTHONDONTWRITEBYTECODE: '1', GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools build-tools;35.0.0', log-accepted-android-sdk-licenses: false}
      - name: Authenticate exact original-signed installers
        run: |
          python repairs/infinity-cast-end-to-end-2103504-20261116/release/install.py prepare
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '36'
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 8G
          avd-name: infinity504-cast-audio-install-only
          disable-animations: false
          emulator-options: -no-window -memory 4096 -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python repairs/infinity-cast-end-to-end-2103504-20261116/release/install.py run
      - name: Independently require install-over receipt
        if: always()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('cast-final-install-results/INSTALL-OVER-AND-RECOVERY.json'))
          assert r['status']=='PASS_ACTUAL_ANDROID_IN_PLACE_INSTALL_AND_FORWARD_RECOVERY',r
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Infinity504-Cast-Signed-Install-${{ github.run_id }}-EVIDENCE-ONLY
          path: cast-final-install-results/
          if-no-files-found: warn
          retention-days: 90
  publish:
    if: startsWith(github.event.head_commit.message, 'Cast504 publish:')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions: {contents: write, actions: read}
    env: {PYTHONDONTWRITEBYTECODE: '1', GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'build-tools;35.0.0', log-accepted-android-sdk-licenses: false}
      - name: Publish only independently reviewed original-signed install-tested pair
        run: python repairs/infinity-cast-end-to-end-2103504-20261116/release/publish.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Infinity504-Cast-QA-Publication-${{ github.run_id }}
          path: cast504-publication/
          if-no-files-found: error
          retention-days: 90
