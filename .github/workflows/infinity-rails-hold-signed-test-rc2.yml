name: Infinity | Rails hold RC02 signed test APK
on:
  push:
    branches: [work/infinity-rails-hold-2103379-hit-test-rc2]
    paths:
      - '.github/workflows/infinity-rails-hold-signed-test-rc2.yml'
      - 'repairs/rails-hold-2103378/package_rails.py'
permissions: {contents: read, actions: read}
concurrency: {group: infinity-rails-hold-signed-test-rc2, cancel-in-progress: false}
env:
  NDK_VER: 21.4.7075529
jobs:
  signed-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Require exact successful native and real Kodi executions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request,subprocess
          required={38627975135:'99b3dd0c98b9991138163f4042b7f41825d1a23a',
                    38617595240:'6eb2b41663987c347af7de3f9f234f23eddfcac5'}
          deadline=time.monotonic()+5*3600
          while required:
              for run,sha in list(required.items()):
                  req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+str(run),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
                  with urllib.request.urlopen(req,timeout=30) as reply:r=json.load(reply)
                  assert r['head_sha']==sha,(run,'source changed')
                  if r['status']=='completed':
                      assert r['conclusion']=='success',(run,r['conclusion'])
                      del required[run]
                      print('Verified green run',run,sha,flush=True)
              if not required:break
              assert time.monotonic()<deadline,'Verification still pending; no candidate packaged'
              time.sleep(30)
          subprocess.run(['git','diff','--exit-code','99b3dd0c98b9991138163f4042b7f41825d1a23a','--','repairs/rails-hold-2103378/patch_native.py','repairs/rails-hold-2103378/native_ci.py','repairs/rails-hold-2103378/test_native.py'],check=True)
          subprocess.run(['git','diff','--exit-code','6eb2b41663987c347af7de3f9f234f23eddfcac5','--','features/infinity-rails-investigation-20261014/addons/script.infinity.rails'],check=True)
          PY
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-${{ runner.os }}-21.4.7075529-v1
      - run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - uses: actions/download-artifact@v8
        with:
          run-id: 38627975135
          name: Infinity-2103379-Rails-Hold-Native-Evidence
          github-token: ${{ github.token }}
          path: native-evidence
      - uses: actions/download-artifact@v8
        with:
          run-id: 38520156095
          name: Infinity-2103377-RC5-Optional-Shutdown-Signed-Test-APK
          github-token: ${{ github.token }}
          path: parent-apk
      - uses: actions/download-artifact@v8
        with:
          run-id: 38520156095
          name: Infinity-2103377-RC5-Optional-Shutdown-Package-Receipts
          github-token: ${{ github.token }}
          path: parent-receipts
      - uses: actions/download-artifact@v8
        with:
          run-id: 38617595240
          name: Infinity-Rails-Real-Kodi-Smoke
          github-token: ${{ github.token }}
          path: real-kodi
      - name: Re-run baseline helper tests; do not bundle mismatched helper
        run: |
          set -euo pipefail
          mkdir -p rails-delivery
          python3 -m unittest discover -s features/infinity-rails-investigation-20261014/tests -p 'test_*.py' -v > rails-delivery/helper-tests.txt 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('features/infinity-rails-investigation-20261014/addons/script.infinity.rails')
          # Helper .2.5 Mocha UI is a separately hash-pinned staged ZIP. Do not
          # silently ship old .2.4 helper with the corrected native RC02 APK.
          assert (root/'resources/lib/runtime.py').is_file()
          PY
      - name: Preserve original APK payload and permanently sign the isolated test
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          python3 repairs/rails-hold-2103378/package_rails.py \
            --parent parent-apk/Infinity-2103377-RC5-Optional-Shutdown-Signed-Test.apk \
            --receipts parent-receipts --native native-evidence --smoke real-kodi --out rails-delivery
          cp repairs/rails-hold-2103378/README.md rails-delivery/INSTALL-AND-ROLLBACK.md
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-Rails-Hold-RC02-Signed-APK
          path: rails-delivery/
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
