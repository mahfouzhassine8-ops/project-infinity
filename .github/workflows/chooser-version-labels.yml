name: Chooser version labels | unsigned shell-only owner build
on:
  push:
    branches: [work/chooser-version-labels-from-2103423-20261027]
    paths:
      - repairs/chooser-version-labels-2103423/**
      - .github/workflows/chooser-version-labels.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  chooser:
    if: github.ref == 'refs/heads/work/chooser-version-labels-from-2103423-20261027'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: repairs/dual-experience-isolation-2103420
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 40486072720
          name: Infinity-Combined-Original-Signer-40486072720
          github-token: ${{ github.token }}
          path: signed2103423
      - uses: actions/download-artifact@v4
        with:
          run-id: 40486072720
          name: Infinity-Combined-Owner-Components-40486072720
          github-token: ${{ github.token }}
          path: source-components
      - uses: actions/download-artifact@v4
        with:
          run-id: 39867073954
          name: Infinity-Receipt-Race-Android17-Investigation
          github-token: ${{ github.token }}
          path: pinned-tools
      - name: Build shell delta and exact-class preservation proof
        run: |
          set -euo pipefail
          python3 repairs/chooser-version-labels-2103423/build.py \
            --apk signed2103423/Infinity-2103423-Combined-Original-Signer.apk \
            --bundles source-components \
            --jars pinned-tools/receipt-evidence/tool-jars \
            --android pinned-tools/receipt-evidence/android-34.jar \
            --d8 "$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar" \
            --out chooser-build \
            --source "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('chooser-build/PRESERVATION.json').read_text())
          assert p['status']=='PASS_TARGETED_SHELL_ONLY'
          assert p['exact_unchanged_shell_classes']==148
          assert p['original_HM_caption_preserved'] and p['stage_measure_and_layout_unmodified']
          assert p['offline_component_history']=={'INFINITY':2103421,'COBRA':2103423}
          assert Path('chooser-build/CHOOSER_SHELL.zip').exists()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Chooser-Original-UI-Version-Labels-${{ github.run_id }}
          path: |
            chooser-build/CHOOSER_SHELL.zip
            chooser-build/catalog-row.json
            chooser-build/component.json
            chooser-build/PRESERVATION.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0


  stage_authority:
    name: Stage reviewed 2103425 chooser-only release authority (never signs)
    needs: chooser
    if: github.ref == 'refs/heads/work/chooser-version-labels-from-2103423-20261027' && contains(github.event.head_commit.message, '[stage-authority]')
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/chooser-version-labels-from-2103423-20261027
          path: chooser
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: work/infinity-cobra-isolation-from-2103420-20261026
          path: integration
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 40590499416
          name: Chooser-Original-UI-Version-Labels-40590499416
          github-token: ${{ github.token }}
          path: producer
      - name: Verify exact producer, immutable Infinity and Cobra and reserve 2103425
        run: |
          set -euo pipefail
          [[ "$(git -C integration rev-parse HEAD)" == "d49d930828d734ef3a63d1039b6dd82862e96708" ]] || {
            echo "REFUSED: integration authority changed since approved review"; exit 1;
          }
          python3 chooser/repairs/chooser-version-labels-2103423/promote.py --checkout integration --producer producer
          [[ "$(git -C integration diff --name-only)" == "repairs/dual-experience-isolation-2103420/release-authority.json" ]] || {
            echo "REFUSED: non-authority file mutation"; exit 1;
          }
          git -C integration diff --check
      - name: Emit only reviewed authority delta for connected GitHub update
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("integration/repairs/dual-experience-isolation-2103420/release-authority.json")
          j=json.loads(p.read_text())
          names=["review_ownership.py","ownership-reviewed-roots.json","release_authority.py","signer-policy.json"]
          root="repairs/dual-experience-isolation-2103420/"
          result={"generation":j["generation"],"versionCode":j["candidate_versionCode"],
            "previous_authority_sha256":j["previous_authority_sha256"],
            "source_files":{root+k:j["source_files"][root+k] for k in names},
            "owner":j["owner_update_evidence"]["owner"],
            "guard_digest_count":len(j["protected_contract"]),
            "preserved_versions":{k:j["components"][k]["version"] for k in ("INFINITY","COBRA","MINIMAL_ANDROID_CONTRACT")}}
          print("AUTHORITY_DELTA_JSON="+json.dumps(result,sort_keys=True,separators=(",",":")))
          PY

      - name: Stage authority in a new PR branch only; never touch signed integration or protected lock
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_AUTHORITY_SHA: d49d930828d734ef3a63d1039b6dd82862e96708
          PR_BRANCH: work/chooser-release-authority-2103424-20261027
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/work/infinity-cobra-isolation-from-2103420-20261026" --jq '.object.sha')
          candidate=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${PR_BRANCH}" --jq '.object.sha')
          [[ "$current" == "$EXPECTED_AUTHORITY_SHA" && "$candidate" == "$EXPECTED_AUTHORITY_SHA" ]] || {
            echo "REFUSED: reviewed integration or isolated proposal branch moved"; exit 1;
          }
          old_blob=$(gh api "repos/${GITHUB_REPOSITORY}/contents/repairs/dual-experience-isolation-2103420/release-authority.json?ref=${PR_BRANCH}" --jq '.sha')
          python3 - "$old_blob" <<'PY'
          import base64,json,os,sys
          from pathlib import Path
          p=Path("integration/repairs/dual-experience-isolation-2103420/release-authority.json")
          payload={
            "message":"release: stage verified chooser-only 2103425 owner authority; preserve Infinity and Cobra",
            "content":base64.b64encode(p.read_bytes()).decode("ascii"),
            "sha":sys.argv[1],"branch":os.environ["PR_BRANCH"]}
          Path("chooser-authority-upload.json").write_text(json.dumps(payload,separators=(",",":")))
          PY
          gh api --method PUT --input chooser-authority-upload.json "repos/${GITHUB_REPOSITORY}/contents/repairs/dual-experience-isolation-2103420/release-authority.json" --jq '.commit.sha'
