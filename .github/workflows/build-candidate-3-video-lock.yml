name: ♾️ Build Candidate 3 - Native Video Lock

on:
  push:
    paths:
      - '.github/workflows/build-candidate-3-video-lock.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;34.0.0 platform-tools'

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick librsvg2-bin unzip curl fonts-dejavu-core
          curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

      - name: Download Infinity Stable 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9978114291/zip \
            -o /tmp/stable2.zip
          mkdir -p /tmp/stable2
          unzip -q /tmp/stable2.zip -d /tmp/stable2
          APK=$(find /tmp/stable2 -name '*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" /tmp/Infinity-Stable-2.apk

      - name: Decode Stable 2
        run: |
          set -euo pipefail
          java -jar /tmp/apktool.jar d -f /tmp/Infinity-Stable-2.apk -o /tmp/decoded

      - name: Add persistent VLC-style Infinity video lock
        run: |
          set -euo pipefail
          SKIN=/tmp/decoded/assets/addons/skin.estuary
          OSD="$SKIN/xml/VideoOSD.xml"
          test -f "$OSD"

          python3 - <<'PY'
          from pathlib import Path

          osd = Path('/tmp/decoded/assets/addons/skin.estuary/xml/VideoOSD.xml')
          text = osd.read_text()

          marker = '<control type="radiobutton" id="804">'
          if marker not in text:
              raise SystemExit('ERROR: expected VideoOSD insertion point not found')

          lock_button = '''<control type="radiobutton" id="7999">\n\t\t\t\t\t\t<include content="OSDButton">\n\t\t\t\t\t\t\t<param name="texture" value="osd/fullscreen/buttons/infinity-lock.png"/>\n\t\t\t\t\t\t</include>\n\t\t\t\t\t\t<label>Lock screen</label>\n\t\t\t\t\t\t<onclick>Dialog.Close(VideoOSD)</onclick>\n\t\t\t\t\t\t<onclick>ActivateWindow(1199)</onclick>\n\t\t\t\t\t\t<visible>Player.HasVideo</visible>\n\t\t\t\t\t</control>\n\t\t\t\t\t'''

          if 'id="7999"' not in text:
              text = text.replace(marker, lock_button + marker, 1)
              osd.write_text(text)

          # Important: custom windows need their numeric id on the root window.
          # The previous candidate hid the OSD but never entered a persistent lock window.
          overlay = Path('/tmp/decoded/assets/addons/skin.estuary/xml/Custom_1199_InfinityVideoLock.xml')
          overlay.write_text('''<?xml version="1.0" encoding="utf-8"?>\n<window type="dialog" id="1199">\n    <onload>SetProperty(InfinityVideoLocked,true)</onload>\n    <onload>SetProperty(InfinityLockHint,true)</onload>\n    <onload>ClearProperty(InfinityUnlockVisible)</onload>\n    <onload>AlarmClock(InfinityHideLockHint,ClearProperty(InfinityLockHint),2,silent)</onload>\n    <onunload>CancelAlarm(InfinityHideUnlock,silent)</onunload>\n    <onunload>CancelAlarm(InfinityHideLockHint,silent)</onunload>\n    <onunload>ClearProperty(InfinityUnlockVisible)</onunload>\n    <onunload>ClearProperty(InfinityLockHint)</onunload>\n    <onunload>ClearProperty(InfinityVideoLocked)</onunload>\n    <defaultcontrol always="true">9900</defaultcontrol>\n    <controls>\n        <!-- Persistent full-screen touch catcher. While this window is open,\n             taps are consumed here instead of reopening the normal video OSD. -->\n        <control type="button" id="9900">\n            <left>0</left><top>0</top><width>100%</width><height>100%</height>\n            <texturefocus colordiffuse="00FFFFFF">white.png</texturefocus>\n            <texturenofocus colordiffuse="00FFFFFF">white.png</texturenofocus>\n            <label></label>\n            <onclick>SetProperty(InfinityUnlockVisible,true)</onclick>\n            <onclick>CancelAlarm(InfinityHideUnlock,silent)</onclick>\n            <onclick>AlarmClock(InfinityHideUnlock,ClearProperty(InfinityUnlockVisible),3,silent)</onclick>\n        </control>\n\n        <!-- Brief lock animation/status shown immediately after locking. -->\n        <control type="group">\n            <visible>!String.IsEmpty(Window.Property(InfinityLockHint))</visible>\n            <animation effect="fade" start="0" end="100" time="180">Visible</animation>\n            <animation effect="zoom" start="80" end="100" center="auto" time="180">Visible</animation>\n            <centerleft>50%</centerleft><centertop>50%</centertop>\n            <control type="image">\n                <left>-55</left><top>-70</top><width>110</width><height>110</height>\n                <texture>osd/fullscreen/buttons/infinity-lock-big.png</texture>\n            </control>\n            <control type="label">\n                <left>-220</left><top>55</top><width>440</width><height>55</height>\n                <align>center</align><aligny>center</aligny>\n                <label>Screen locked</label>\n                <font>font13</font><textcolor>white</textcolor><shadowcolor>black</shadowcolor>\n            </control>\n        </control>\n\n        <!-- While locked, one tap reveals ONLY this unlock control. -->\n        <control type="button" id="9901">\n            <centerleft>50%</centerleft><centertop>50%</centertop>\n            <width>220</width><height>120</height>\n            <texturefocus colordiffuse="DD20252B">white.png</texturefocus>\n            <texturenofocus colordiffuse="BB20252B">white.png</texturenofocus>\n            <label>🔓  Unlock</label>\n            <font>font13</font>\n            <align>center</align><aligny>center</aligny>\n            <visible>!String.IsEmpty(Window.Property(InfinityUnlockVisible))</visible>\n            <animation effect="fade" start="0" end="100" time="120">Visible</animation>\n            <animation effect="zoom" start="85" end="100" center="auto" time="120">Visible</animation>\n            <onclick>CancelAlarm(InfinityHideUnlock,silent)</onclick>\n            <onclick>ClearProperty(InfinityUnlockVisible)</onclick>\n            <onclick>SetProperty(InfinityUnlockHint,true)</onclick>\n            <onclick>Dialog.Close(1199)</onclick>\n        </control>\n\n        <!-- Unlock confirmation animation. This is intentionally behind the close;\n             if the skin closes immediately, normal controls simply return. -->\n        <control type="label">\n            <centerleft>50%</centerleft><centertop>50%</centertop>\n            <width>420</width><height>70</height>\n            <align>center</align><aligny>center</aligny>\n            <label>🔓  Screen unlocked</label>\n            <font>font13</font><textcolor>white</textcolor><shadowcolor>black</shadowcolor>\n            <visible>!String.IsEmpty(Window.Property(InfinityUnlockHint))</visible>\n            <animation effect="fade" start="0" end="100" time="120">Visible</animation>\n        </control>\n    </controls>\n</window>\n''')
          PY

          mkdir -p "$SKIN/media/osd/fullscreen/buttons"
          cat > /tmp/infinity-lock.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="74" height="74" viewBox="0 0 74 74">
            <rect x="14" y="31" width="46" height="35" rx="7" fill="white"/>
            <path d="M24 31V22c0-8 5-14 13-14s13 6 13 14v9" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/>
            <circle cx="37" cy="47" r="4" fill="#111318"/>
            <rect x="35" y="47" width="4" height="10" rx="2" fill="#111318"/>
          </svg>
          SVG
          rsvg-convert -w 74 -h 74 /tmp/infinity-lock.svg -o "$SKIN/media/osd/fullscreen/buttons/infinity-lock.png"
          rsvg-convert -w 110 -h 110 /tmp/infinity-lock.svg -o "$SKIN/media/osd/fullscreen/buttons/infinity-lock-big.png"

          echo '=== Candidate 3 persistent lock verification ==='
          grep -n 'id="7999"' "$OSD"
          grep -n 'ActivateWindow(1199)' "$OSD"
          grep -n '<window type="dialog" id="1199">' "$SKIN/xml/Custom_1199_InfinityVideoLock.xml"
          grep -n 'InfinityVideoLocked' "$SKIN/xml/Custom_1199_InfinityVideoLock.xml"
          grep -n 'InfinityUnlockVisible' "$SKIN/xml/Custom_1199_InfinityVideoLock.xml"
          grep -n 'InfinityLockHint' "$SKIN/xml/Custom_1199_InfinityVideoLock.xml"
          test -f "$SKIN/media/osd/fullscreen/buttons/infinity-lock.png"
          test -f "$SKIN/media/osd/fullscreen/buttons/infinity-lock-big.png"

      - name: Rebuild Candidate 3
        run: |
          set -euo pipefail
          java -jar /tmp/apktool.jar b /tmp/decoded -o /tmp/Infinity-Candidate-3-unsigned.apk

      - name: Sign Candidate 3
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/project-infinity.keystore -alias projectinfinity -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Infinity Candidate 3, OU=Personal Build, O=Infinity, L=Detroit, ST=Michigan, C=US" >/dev/null 2>&1
          "$BUILD_TOOLS/zipalign" -f -v 4 /tmp/Infinity-Candidate-3-unsigned.apk /tmp/Infinity-Candidate-3-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks ~/.android/project-infinity.keystore --ks-key-alias projectinfinity --ks-pass pass:android --key-pass pass:android --out /tmp/Infinity-Candidate-3.apk /tmp/Infinity-Candidate-3-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose /tmp/Infinity-Candidate-3.apk

      - name: Upload Candidate 3
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-Candidate-3-Persistent-VLC-Lock
          path: /tmp/Infinity-Candidate-3.apk
          retention-days: 30
