name: ♾️ Build Candidate 3 - Native Video Lock

on:
  push:
    paths:
      - '.github/workflows/build-candidate-3-video-lock.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;34.0.0 platform-tools'

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick librsvg2-bin unzip curl fonts-dejavu-core
          curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

      # IMPORTANT: start from the known-good "Fresh Out the Oven" lock build.
      # Artifact 9979055811 is the candidate where input blocking already works.
      - name: Download known-good lock candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9979055811/zip \
            -o /tmp/known-good.zip
          mkdir -p /tmp/known-good
          unzip -q /tmp/known-good.zip -d /tmp/known-good
          APK=$(find /tmp/known-good -name '*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" /tmp/Infinity-Known-Good-Lock.apk

      - name: Decode known-good lock build
        run: |
          set -euo pipefail
          java -jar /tmp/apktool.jar d -f /tmp/Infinity-Known-Good-Lock.apk -o /tmp/decoded

      - name: Polish visuals only - preserve working lock behavior
        run: |
          set -euo pipefail
          LOCKXML=/tmp/decoded/assets/addons/skin.estuary/xml/Custom_1199_InfinityVideoLock.xml
          test -f "$LOCKXML"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/decoded/assets/addons/skin.estuary/xml/Custom_1199_InfinityVideoLock.xml')
          s=p.read_text()
          # Preserve the known-good touch interception and button actions. Only alter visual timing.
          # Initial lock icon: remove the residual hidden-animation behavior and let visibility property
          # be the hard off-switch after the existing 1.4s alarm clears InfinityLockHint.
          s=s.replace('<animation effect="fade" start="100" end="0" time="180">Hidden</animation>',
                      '<animation effect="fade" start="100" end="0" time="220" delay="1050">Visible</animation>',1)
          # Unlock icon: make it unmistakable and keep the dialog alive long enough to render it.
          s=s.replace('AlarmClock(InfinityFinishUnlock,Dialog.Close(1199),0.65,silent)',
                      'AlarmClock(InfinityFinishUnlock,Dialog.Close(1199),1.00,silent)')
          s=s.replace('<animation effect="fade" start="100" end="0" time="180" delay="360">Visible</animation>',
                      '<animation effect="fade" start="100" end="0" time="240" delay="600">Visible</animation>')
          p.write_text(s)
          if '1.00,silent' not in s or 'delay="600"' not in s:
              raise SystemExit('visual polish replacements did not apply')
          PY

      - name: Rebuild polished Candidate 3
        run: |
          set -euo pipefail
          java -jar /tmp/apktool.jar b /tmp/decoded -o /tmp/Infinity-Candidate-3-Polished-unsigned.apk

      - name: Sign polished Candidate 3
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/project-infinity.keystore -alias projectinfinity -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Infinity Candidate 3, OU=Personal Build, O=Infinity, L=Detroit, ST=Michigan, C=US" >/dev/null 2>&1
          "$BUILD_TOOLS/zipalign" -f -v 4 /tmp/Infinity-Candidate-3-Polished-unsigned.apk /tmp/Infinity-Candidate-3-Polished-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks ~/.android/project-infinity.keystore --ks-key-alias projectinfinity --ks-pass pass:android --key-pass pass:android --out /tmp/Infinity-Candidate-3-Polished.apk /tmp/Infinity-Candidate-3-Polished-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose /tmp/Infinity-Candidate-3-Polished.apk

      - name: Upload polished Candidate 3
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-Candidate-3-Fresh-Oven-Visual-Polish
          path: /tmp/Infinity-Candidate-3-Polished.apk
          retention-days: 30
