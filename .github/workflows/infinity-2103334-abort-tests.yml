name: Infinity | 2103334 Python hypothesis comparison (manual)
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  compare:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: {python-version: '3.11.7'}
      - run: python repairs/python-exit-2103334/test_abort.py --expect-python 3.11.7 --out comparison
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103334-Python-Hypothesis-Comparison
          path: comparison/
          retention-days: 90
