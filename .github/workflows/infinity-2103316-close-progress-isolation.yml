name: Infinity | 2103316 close progress and Cobra isolation
on:
  workflow_dispatch:
  push:
    branches: [repair/2103316-close-progress-isolation]
    paths:
      - 'repairs/close-progress-isolation-2103316/**'
      - '.github/workflows/infinity-2103316-close-progress-isolation.yml'
permissions: {contents: read, actions: read, statuses: write}
concurrency:
  group: infinity-2103316-close-progress-isolation
  cancel-in-progress: false
jobs:
  candidate-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Publish candidate build run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYSTATUS'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];commit=os.environ['GITHUB_SHA'];run=os.environ['GITHUB_RUN_ID']
          data={'state':'pending','context':'infinity/2103316-candidate','description':'Compiling and checking the Android-only candidate','target_url':f'https://github.com/{repo}/actions/runs/{run}'}
          request=urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{commit}',data=json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=30) as response: assert response.status==201
          PYSTATUS
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: 'platform-tools platforms;android-35 build-tools;34.0.0'}
      - uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 37397392525
          name: Infinity-2103312-Cobra-Pro-Teams-Verification
          github-token: ${{ github.token }}
          path: parent3312
      - uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 37397392525
          name: Infinity-2103312-Cobra-Pro-Teams-RC1-APK
          github-token: ${{ github.token }}
          path: base3312
      - name: Verify locked source and stage progress / isolation delta
        run: |
          set -euo pipefail
          mkdir -p verified3312 evidence3316 "$HOME/.android"
          tar --no-same-owner -xzf parent3312/repaired-shell-source.tar.gz -C verified3312
          python3 repairs/close-progress-isolation-2103316/test_contract.py \
            --source verified3312/shell-kodi \
            --proof parent3312/SOURCE-PRESERVATION.json \
            --work contract3316
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'
          python3 repairs/close-progress-isolation-2103316/package_candidate.py prepare \
            --source verified3312/shell-kodi \
            --proof parent3312/SOURCE-PRESERVATION.json \
            --base base3312/Infinity-2103312-Cobra-Pro-Teams-RC1.apk \
            --build build3316 --out evidence3316
      - name: Compile and test continuous busy arc and independent Cobra dispatch
        env:
          KODI_ANDROID_KEY_ALIAS: androiddebugkey
          KODI_ANDROID_KEY_PASSWORD: android
          KODI_ANDROID_STORE_PASSWORD: android
        run: |
          set -euo pipefail
          export KODI_ANDROID_STORE_FILE="$HOME/.android/debug.keystore"
          cd build3316
          ./gradlew --no-daemon --console=plain \
            :xbmc:testReleaseUnitTest \
            --tests com.projectinfinity.kodi.AndroidTaskRemoval315Test \
            --tests com.projectinfinity.kodi.KodiProcessStatusTest \
            --tests com.projectinfinity.kodi.CloseProgress316Test \
            --tests com.projectinfinity.kodi.CobraCloseIsolation316Test \
            :xbmc:assembleRelease :xbmc:exportPreservationTools \
            2>&1 | tee ../evidence3316/android-build.log
      - name: Verify payload and permanently sign the install-over candidate
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 repairs/close-progress-isolation-2103316/package_candidate.py package \
            --source verified3312/shell-kodi \
            --proof parent3312/SOURCE-PRESERVATION.json \
            --base base3312/Infinity-2103312-Cobra-Pro-Teams-RC1.apk \
            --build build3316 --out evidence3316
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103316-Close-Progress-Isolation-RC1-APK
          path: evidence3316/Infinity-2103316-Close-Progress-Isolation-RC1.apk
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - name: Prepare verified delivery parts
        if: success()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          apk=Path('evidence3316/Infinity-2103316-Close-Progress-Isolation-RC1.apk')
          data=apk.read_bytes(); parts=Path('delivery3316');parts.mkdir()
          manifest={'file':apk.name,'size':len(data),'sha256':hashlib.sha256(data).hexdigest(),'parts':[]}
          for i,start in enumerate(range(0,len(data),24*1024*1024)):
              piece=data[start:start+24*1024*1024];name=f'part{i:02d}'
              (parts/name).write_bytes(piece)
              manifest['parts'].append({'file':name,'size':len(piece),'sha256':hashlib.sha256(piece).hexdigest()})
          assert len(manifest['parts'])<=8
          compact=Path('compact3316');compact.mkdir()
          (compact/'DELIVERY.json').write_text(json.dumps(manifest,indent=2)+'\n')
          for f in Path('evidence3316').iterdir():
              if f.is_file() and f.suffix not in ('.apk','.so') and f.stat().st_size<24*1024*1024:
                  shutil.copy2(f,compact/f.name)
          PY
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103316-Delivery-Evidence
          path: compact3316/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: success() && hashFiles('delivery3316/part00') != ''
        with: {name: Infinity-2103316-Delivery-Part00, path: delivery3316/part00, compression-level: 0, retention-days: 90, if-no-files-found: error}
      - uses: actions/upload-artifact@v7
        if: success() && hashFiles('delivery3316/part01') != ''
        with: {name: Infinity-2103316-Delivery-Part01, path: delivery3316/part01, compression-level: 0, retention-days: 90, if-no-files-found: error}
      - uses: actions/upload-artifact@v7
        if: success() && hashFiles('delivery3316/part02') != ''
        with: {name: Infinity-2103316-Delivery-Part02, path: delivery3316/part02, compression-level: 0, retention-days: 90, if-no-files-found: error}
      - uses: actions/upload-artifact@v7
        if: success() && hashFiles('delivery3316/part03') != ''
        with: {name: Infinity-2103316-Delivery-Part03, path: delivery3316/part03, compression-level: 0, retention-days: 90, if-no-files-found: error}
      - uses: actions/upload-artifact@v7
        if: success() && hashFiles('delivery3316/part04') != ''
        with: {name: Infinity-2103316-Delivery-Part04, path: delivery3316/part04, compression-level: 0, retention-days: 90, if-no-files-found: error}
      - uses: actions/upload-artifact@v7
        if: success() && hashFiles('delivery3316/part05') != ''
        with: {name: Infinity-2103316-Delivery-Part05, path: delivery3316/part05, compression-level: 0, retention-days: 90, if-no-files-found: error}
      - uses: actions/upload-artifact@v7
        if: success() && hashFiles('delivery3316/part06') != ''
        with: {name: Infinity-2103316-Delivery-Part06, path: delivery3316/part06, compression-level: 0, retention-days: 90, if-no-files-found: error}
      - uses: actions/upload-artifact@v7
        if: success() && hashFiles('delivery3316/part07') != ''
        with: {name: Infinity-2103316-Delivery-Part07, path: delivery3316/part07, compression-level: 0, retention-days: 90, if-no-files-found: error}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103316-Verification
          path: |
            evidence3316/
            !evidence3316/*.apk
            contract3316/
          compression-level: 1
          retention-days: 90
          if-no-files-found: warn

      - name: Publish candidate result
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PYSTATUS'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];commit=os.environ['GITHUB_SHA'];run=os.environ['GITHUB_RUN_ID']
          passed=os.environ['CANDIDATE_JOB_STATUS']=='success'
          data={'state':'success' if passed else 'failure','context':'infinity/2103316-candidate','description':'Signed candidate and preservation checks passed; device testing required' if passed else 'Candidate build or verification did not pass','target_url':f'https://github.com/{repo}/actions/runs/{run}'}
          request=urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{commit}',data=json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=30) as response: assert response.status==201
          PYSTATUS
