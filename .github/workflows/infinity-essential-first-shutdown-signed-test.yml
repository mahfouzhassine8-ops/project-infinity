name: Infinity 2103377 | Essential-first signed Fold TEST1 (not locked)

on:
  push:
    branches: [work/infinity-2103377-essential-first-shutdown-only]
    paths:
      - '.github/workflows/infinity-essential-first-shutdown-signed-test.yml'
      - 'repairs/essential-first-2103377/package_signed_fold_test.py'
  workflow_dispatch:

permissions: {contents: read, actions: read}
concurrency: {group: infinity-2103377-essential-signed-fold-test, cancel-in-progress: false}

jobs:
  matched-signed-fold-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      NDK_VER: 21.4.7075529
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-linux-21.4.7075529-v1
      - run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - name: Verify exact green native run and locked Rails parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          pinned={
              38799103180:"56fca5a4423a72e2e68e4f3f12e9ebe6076b17da",
              38733189236:"62ba1eccef24b209a1d32fb9bef39b5928ac4f4a",
              38732470818:"78826902c0a55a24b488b5b7fc69b378cebc6df8",
          }
          for run,commit in pinned.items():
              req=urllib.request.Request("https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+
                  "/actions/runs/"+str(run),headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                  "Accept":"application/vnd.github+json"})
              with urllib.request.urlopen(req,timeout=40) as response: data=json.load(response)
              assert data["status"]=="completed" and data["conclusion"]=="success" and data["head_sha"]==commit,run
              print("Exact green pinned run:",run,commit,flush=True)
          PY
      - uses: actions/download-artifact@v8
        with:
          run-id: 38733189236
          name: Infinity-2103377-Rails-Handoff-RC1-Signed-Test-APK
          github-token: ${{ github.token }}
          path: locked-rails
      - uses: actions/download-artifact@v8
        with:
          run-id: 38799103180
          name: Infinity-2103377-Essential-First-Native-Evidence
          github-token: ${{ github.token }}
          path: native-evidence
      - uses: actions/download-artifact@v8
        with:
          run-id: 38132105717
          name: Infinity-2103367-Verified-Compiler-Dependencies
          github-token: ${{ github.token }}
          path: dependency-transfer
      - uses: actions/download-artifact@v8
        with:
          run-id: 38246713743
          name: Cobra-2103374-Verified-Deadweight-Signed-Test-APK
          github-token: ${{ github.token }}
          path: locked-parent
      - uses: actions/download-artifact@v8
        with:
          run-id: 38270097041
          name: Cobra-2103375-File-Preview-Native-Signed-Test-APK
          github-token: ${{ github.token }}
          path: previous-candidate
      - uses: actions/download-artifact@v8
        with:
          run-id: 38321848412
          name: Cobra-2103376-Critical-Preview-Native-Evidence
          github-token: ${{ github.token }}
          path: locked-native-evidence
      - uses: actions/download-artifact@v8
        with:
          run-id: 38493645998
          name: Infinity-2103377-RC3-Exact-Native-Curl-Source
          github-token: ${{ github.token }}
          path: rc2-captured-source
      - uses: actions/download-artifact@v8
        with:
          run-id: 38732470818
          name: Infinity-2103377-Rails-Handoff-RC1-Native-Evidence
          github-token: ${{ github.token }}
          path: rails-locked-evidence
      - name: Pin exact protected APK bytes and source evidence
        run: |
          set -euo pipefail
          echo 'de8ce3f122db7bb8b2b3681e7c6ce9caf67cf38888b17ef1f82ff7759fa8a3db  locked-rails/Infinity-2103377-Rails-Handoff-RC1-Signed-Test.apk' | sha256sum -c
          (cd dependency-transfer && sha256sum -c SHA256SUMS)
          tar --no-same-owner -xf dependency-transfer/verified-android-dependencies.tar
          tar --no-same-owner -xf dependency-transfer/verified-compiler-cache.tar -C "$HOME"
          python3 repairs/android-checkpoint-shutdown/native_ci.py verify-dependencies
          sudo apt-get update -qq
          sudo apt-get install -y python3-yaml python3-dev libsqlite3-dev libssl-dev
      - name: Reconstruct exact green Rails/native source without recompiling native engine
        run: |
          set -euo pipefail
          mkdir -p checkpoint-build
          python3 repairs/shutdown-rc3-2103377/test_source.py \
            --source rc2-captured-source --output checkpoint-build/RC3-HOST-VERIFICATION.json
          python3 repairs/essential-first-2103377/native_ci.py prepare \
            --locked locked-parent/Cobra-2103374-Verified-Deadweight-RC1.apk \
            --previous previous-candidate/Cobra-2103375-File-Preview-Native-RC1.apk \
            --parent-proof locked-native-evidence \
            --rails-proof rails-locked-evidence \
            2>&1 | tee checkpoint-build/ESSENTIAL-SOURCE-REPLAY.log
      - name: Stage Android-only build with two changed shutdown Java classes
        run: |
          set -euo pipefail
          python3 repairs/essential-first-2103377/package_signed_fold_test.py java \
            --parent locked-rails/Infinity-2103377-Rails-Handoff-RC1-Signed-Test.apk \
            --source kodi --gradle-dir android-gradle --out android-donor-evidence
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/infinity-donor-temporary.keystore" \
            -storepass android -keypass android -alias androiddebugkey -keyalg RSA \
            -keysize 2048 -validity 1 -dname "CN=Temporary Java Donor" >/dev/null 2>&1
      - name: Compile the actual Android validator and guard service
        env:
          KODI_ANDROID_STORE_FILE: ${{ runner.temp }}/infinity-donor-temporary.keystore
          KODI_ANDROID_KEY_ALIAS: androiddebugkey
          KODI_ANDROID_STORE_PASSWORD: android
          KODI_ANDROID_KEY_PASSWORD: android
        run: |
          set -euo pipefail
          cd android-gradle
          ./gradlew --no-daemon --console=plain :xbmc:assembleRelease \
            2>&1 | tee ../android-donor-evidence/GRADLE-ANDROID-RELEASE.log
          test -s xbmc/build/outputs/apk/release/xbmc-release.apk
      - name: Merge only matched ARM64, Android DEX and same-length manifest version
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p essential-fold-test
          python3 repairs/essential-first-2103377/package_signed_fold_test.py package \
            --parent locked-rails/Infinity-2103377-Rails-Handoff-RC1-Signed-Test.apk \
            --donor android-gradle/xbmc/build/outputs/apk/release/xbmc-release.apk \
            --native native-evidence \
            --android android-donor-evidence \
            --out essential-fold-test \
            2>&1 | tee essential-fold-test/PACKAGING-VERIFICATION.log
      - name: Upload separately signed physical TEST only
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103377-Essential-First-Signed-Fold-TEST1
          path: essential-fold-test/
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
      - name: Preserve packaging or Android build failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103377-Essential-First-Signed-Fold-TEST1-FAILURE
          path: |
            essential-fold-test/*.json
            essential-fold-test/*.txt
            essential-fold-test/*.log
            android-donor-evidence/*.json
            android-donor-evidence/*.log
            checkpoint-build/ESSENTIAL-SOURCE-REPLAY.log
          retention-days: 30
          if-no-files-found: warn
