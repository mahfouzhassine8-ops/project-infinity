name: Infinity universal persistence - isolated QA candidate
on:
  push:
    branches: [work/infinity-universal-persistence-20261022]
    paths:
      - repairs/universal-persistence-2103401/**
      - .github/workflows/infinity-universal-persistence.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-universal-persistence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Exact-source host gates, ARM64 build and permanent QA signature
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    env:
      NDK_VER: 21.4.7075529
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Require isolated scope and untouched protected history
        run: |
          python3 - <<'PY'
          import subprocess
          base='f3ad961ffc4e0c0121c1f60385ba2ca3add60a6f'
          paths=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          assert paths and all(p.startswith('repairs/universal-persistence-2103401/') or p=='.github/workflows/infinity-universal-persistence.yml' for p in paths),paths
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 39779917183
          name: Infinity-2103401-SIGNED-APK-AND-MATCHING-COMPONENTS-EXPERIMENTAL
          github-token: ${{ github.token }}
          path: candidate-parent
      - uses: actions/download-artifact@v4
        with:
          run-id: 38132105717
          name: Infinity-2103367-Verified-Compiler-Dependencies
          github-token: ${{ github.token }}
          path: dependency-transfer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.7'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools build-tools;34.0.0
          log-accepted-android-sdk-licenses: false
      - name: Install build prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y python3-yaml python3-dev libsqlite3-dev libssl-dev libffi-dev
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-linux-21.4.7075529-v1
      - run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - name: Restore verified compiler inputs and isolate source delta
        run: |
          set -euo pipefail
          (cd candidate-parent && sha256sum -c SHA256SUMS)
          (cd dependency-transfer && sha256sum -c SHA256SUMS)
          tar --no-same-owner -xf dependency-transfer/verified-android-dependencies.tar
          tar --no-same-owner -xf dependency-transfer/verified-compiler-cache.tar -C "$HOME"
          python3 repairs/universal-persistence-2103401/build.py prepare --parent candidate-parent
          git diff --exit-code
      - name: Run production observer controls and retained native regression gates
        run: |
          set -euo pipefail
          PREFIX=$(python3 -c 'import sys;print(sys.prefix)')
          python3 repairs/universal-persistence-2103401/test.py --source baseline-native --overlay universal-overlay --python-prefix "$PREFIX" --out checkpoint-build/UNIVERSAL-TESTS.json 2>&1 | tee checkpoint-build/UNIVERSAL-TESTS.log
          python3 repairs/universal-persistence-2103401/regressions.py --source baseline-native --overlay universal-overlay --python-prefix "$PREFIX" --out checkpoint-build/EXISTING-REGRESSIONS.json 2>&1 | tee checkpoint-build/EXISTING-REGRESSIONS.log
          git diff --exit-code
      - name: Compile the complete verified ARM64 engine
        run: |
          set -euo pipefail
          python3 repairs/universal-persistence-2103401/build.py compile 2>&1 | tee checkpoint-build/NATIVE-COMPILATION.log
          git diff --exit-code
      - name: Sign internal QA candidate and verify exact APK payload delta
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 repairs/universal-persistence-2103401/package.py --parent candidate-parent --out internal-qa 2>&1 | tee checkpoint-build/PACKAGING.log
          (cd internal-qa && sha256sum -c SHA256SUMS)
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: Infinity-Universal-Persistence-INTERNAL-QA-NOT-ACCEPTED
          path: internal-qa/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Infinity-Universal-Persistence-Build-Evidence
          path: |
            checkpoint-build/*.json
            checkpoint-build/*.log
            checkpoint-build/*.sh
          retention-days: 90
          if-no-files-found: warn
