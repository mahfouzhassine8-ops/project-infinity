name: Infinity | 2103224 TV Show Details + Trailers

on:
  workflow_dispatch:
  push:
    branches: [infinity-cobra-2103224-tv-show-details-trailers-rc1]
    paths:
      - '.github/workflows/infinity-2103224-tv-show-details-trailers.yml'
      - 'repairs/tv-show-details-trailers-2103224/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: infinity-2103224-${{ github.sha }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}

      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}

      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools}

      - name: Download exact 2103208 source parent
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103208-Integration-Polish-TEST-CANDIDATE-Replica-1-Attempt-1
          run-id: 35676573761
          github-token: ${{ github.token }}
          path: baseline208

      - name: Download preserved 2103209 native engine
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103209-Python311-GIL-Native-Engine
          run-id: 35693288744
          github-token: ${{ github.token }}
          path: native209

      - name: Download exact locked 2103223 APK for preservation gate
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103223-Cobra-Movie-Details-Trailers-TEST-CANDIDATE
          run-id: 35792864003
          github-token: ${{ github.token }}
          path: parent223

      - name: Reconstruct exact locked 2103223 source
        run: |
          set -euo pipefail
          mkdir -p audit224 engine
          cp native209/pythoninvoker-threadstate-v2-source.json engine/pythoninvoker-threadstate-v2-source.json
          cp native209/pythoninvoker-threadstate-v2-source.stage1.json engine/pythoninvoker-threadstate-v2-source.stage1.json

          python3 repairs/python311-gil-2103209/ci.py prepare             --base-dir baseline208             --native-apk native209/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2-Engine-Base.apk             --shell shell-kodi             --out audit224/base

          python3 repairs/cobra-media-library-health-2103210/apply.py --shell shell-kodi
          python3 repairs/cobra-library-health-2103211/apply.py --shell shell-kodi
          python3 repairs/health-media-trim-2103212/apply.py --shell shell-kodi
          python3 repairs/live-blue-ambient-settings-return-2103213/apply.py --shell shell-kodi
          python3 repairs/media-details-final-2103214/apply.py --shell shell-kodi
          python3 repairs/smart-return-experience-drawer-2103215/apply.py --shell shell-kodi
          python3 repairs/smart-return-experience-display-2103216/apply.py --shell shell-kodi
          python3 repairs/media-return-context-2103217/apply.py --shell shell-kodi
          python3 repairs/drawer-owner-ui-restore-2103221/apply.py --shell shell-kodi
          python3 repairs/experience-options-ui-2103222/apply.py --shell shell-kodi
          python3 repairs/movie-details-trailers-2103223/apply.py --shell shell-kodi

          grep -F '"version_code": 2103223' engine/background-resume-source.json
          grep -F '"version_name": "1.0.9-Cobra-Movie-Details-Trailers-RC1"' engine/background-resume-source.json
          grep -F '"movie_details_full_page": true' engine/background-resume-source.json
          grep -F '"movie_trailers_option": true' engine/background-resume-source.json

      - name: Apply ONLY TV Show detail presentation and trailers
        run: |
          set -euo pipefail
          python3 repairs/tv-show-details-trailers-2103224/apply.py --shell shell-kodi

          JAVA=shell-kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          grep -F 'COBRA • MOVIE DETAILS' "$JAVA"
          grep -F 'COBRA • TV SHOW DETAILS' "$JAVA"
          grep -F 'cobraRenderMovieDetailPage(item,info)' "$JAVA"
          grep -F 'cobraRenderSeriesDetailPage(item,info)' "$JAVA"
          grep -F '▶  BROWSE EPISODES' "$JAVA"
          grep -F '▶  TRAILER' "$JAVA"
          grep -F 'Related Shows' "$JAVA"
          grep -F 'Resume Episode' "$JAVA"
          grep -F 'Play Next Episode' "$JAVA"

          grep -F '"movie_details_unchanged_from_2103223": true' engine/background-resume-source.json
          grep -F '"tv_show_details_full_page": true' engine/background-resume-source.json
          grep -F '"tv_show_trailers_option": true' engine/background-resume-source.json
          grep -F '"tv_episode_browser_unchanged": true' engine/background-resume-source.json
          grep -F '"playback_unchanged": true' engine/background-resume-source.json
          grep -F '"providers_unchanged": true' engine/background-resume-source.json
          grep -F '"choose_experience_ui_unchanged": true' engine/background-resume-source.json

      - name: Build sign and verify 2103224
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v             -keystore "$HOME/.android/debug.keystore"             -storepass android -alias androiddebugkey -keypass android             -dname "CN=Android Debug,O=Android,C=US"             -keyalg RSA -keysize 2048 -validity 10000

          python3 scripts/package_background_resume.py             --source shell-kodi             --base-apk audit224/base/Infinity-2103208-Python311-GIL-Patched-Base.apk             --build-dir build224             --out signed224

          python3 repairs/tv-show-details-trailers-2103224/verify.py             --apk signed224/Infinity-1.0.9-Cobra-Movie-TV-Details-Trailers-RC1.apk             --parent223 parent223/Infinity-1.0.9-Cobra-Movie-Details-Trailers-RC1.apk             --audit signed224/background-resume-apk-audit.json             --scope audit224/scope.json

      - name: Publish 2103224 TEST CANDIDATE
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103224-Cobra-Movie-TV-Details-Trailers-TEST-CANDIDATE
          path: signed224/
          compression-level: 0
          retention-days: 90

      - name: Preserve 2103224 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103224-Cobra-Movie-TV-Details-Trailers-Evidence
          path: |
            audit224/
            engine/background-resume-source.json
            repairs/tv-show-details-trailers-2103224/
            signed224/*.json
            signed224/*.txt
          if-no-files-found: warn
          retention-days: 90
