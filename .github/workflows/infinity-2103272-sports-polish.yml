name: Infinity | 2103272 Cobra Sports Polish RC1
on:
  workflow_dispatch:
  push:
    branches: [infinity-cobra-2103272-sports-polish-rc1]
    paths: ['.github/workflows/infinity-2103272-sports-polish.yml', 'repairs/sports-polish-2103272/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: sports-polish-${{ github.sha }}
  cancel-in-progress: false
env:
  NDK_VER: 21.4.7075529
  KODI_ANDROID_KEY_ALIAS: androiddebugkey
  KODI_ANDROID_KEY_PASSWORD: android
  KODI_ANDROID_STORE_PASSWORD: android
jobs:
  android-sports-polish-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103271-Sports-Data-RC1-TEST-CANDIDATE
          run-id: 36759239156
          github-token: ${{ github.token }}
          path: parent271
      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103271-Sports-Data-RC1-Evidence
          run-id: 36759239156
          github-token: ${{ github.token }}
          path: source271
      - name: Verify exact locked 2103271 rollback and reconstruct source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          apk=Path('parent271/Infinity-2103271-Sports-Data-RC1.apk')
          src=Path('source271/reconstructed-2103271-shell.tar.gz')
          assert hashlib.sha256(apk.read_bytes()).hexdigest()=='40de992889bda2c9f73862d2eee4937c252db10e5d9ca07777b4c4f9e37f4ad2'
          assert hashlib.sha256(src.read_bytes()).hexdigest()=='2ea8467e5d4c248c7c21cb57109c90e9fb07679ff0e06307107b155cc59f4c2c'
          with zipfile.ZipFile(apk) as z:
            Path('engine').mkdir(exist_ok=True)
            Path('engine/libinfinitycrash.so').write_bytes(z.read('lib/arm64-v8a/libinfinitycrash.so'))
          PY
          tar --no-same-owner -xzf source271/reconstructed-2103271-shell.tar.gz
          mkdir -p rollback271/engine rollback271/scripts audit272
          cp -a shell-kodi rollback271/
          cp engine/background-resume-source.json rollback271/engine/
          cp scripts/package_background_resume.py scripts/infinity_background_resume.py rollback271/scripts/
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('shell-kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='9bc85e090e74d2c5e8c4170ae08978298863424725293ac3c86d0b6a349f72bd'
          print('PASS: exact locked 2103271 Sports source reconstructed.')
          PY
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0' "ndk;$NDK_VER" >/dev/null
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          echo "KODI_ANDROID_STORE_FILE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
      - name: Apply bounded Sports presentation polish
        run: |
          set -euo pipefail
          python3 repairs/sports-polish-2103272/apply.py --root . --out audit272
          python3 repairs/sports-polish-2103272/verify_source.py --baseline rollback271 --root . --out audit272
      - name: Compile and permanently sign one forward APK
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 scripts/package_background_resume.py --source shell-kodi --base-apk parent271/Infinity-2103271-Sports-Data-RC1.apk --build-dir build272 --out signed272 2>&1 | tee audit272/android-build.log
      - name: Stage Sports polish tests and inherited locked regressions
        run: |
          set -euo pipefail
          rm -rf source267 source265
          mkdir -p source267 source265
          cp -a source271/staged-tests source267/staged-tests
          cp -a source271/screenshots source265/screenshots
          python3 repairs/sports-polish-2103272/stage_tests.py --build build272 --evidence audit272/screenshots --inherited
          cd build272
          ./gradlew --no-daemon --console=plain :xbmc:testReleaseUnitTest             --tests '*SportsPolishTest' --tests '*SportsDataRepairTest' --tests '*SportsHubTest'             --tests '*ResponsiveWindowTest' --tests '*Cobra2103268ProductAuditTest'             --tests '*Cobra2103201ScrubberTest' --tests '*Cobra2103201SubtitleTest' --tests '*Cobra2103201MenuPolishTest'             --tests '*Cobra2103202LifecycleTest' --tests '*Cobra2103203PipControlsTest' --tests '*Cobra2103206MediaCallsTest'             --tests '*Cobra2103207CallIntegrationTest' --tests '*Cobra2103207AudioStateTest' --tests '*Cobra2103203SubtitleClarityTest'             --tests '*Cobra2103229MultiViewStabilityFillTest' --tests '*GlassChooserTest' --tests '*GlassOptionsTest'             --tests '*GlassHealthFinishTest' --tests '*RecoveryFixedTest' --tests '*ProVisualTest' --tests '*ProActionsTest'             --tests '*PhoneGlassTest' --tests '*AmbientGlassTest' --tests '*Cobra2103267PlayingDotRestoreTest'             2>&1 | tee ../audit272/android-product-tests.log
      - name: Candidate acceptance and protected-payload gate
        run: |
          set -euo pipefail
          python3 repairs/sports-polish-2103272/verify_source.py --baseline rollback271 --root . --out audit272
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,xml.etree.ElementTree as E
          files=list(Path('build272/xbmc/build/test-results/testReleaseUnitTest').glob('TEST-*.xml'));assert len(files)==24,len(files)
          counts={}
          for f in files:
            t=E.parse(f).getroot();assert all(int(t.attrib.get(k,0))==0 for k in ['failures','errors','skipped']),(f,t.attrib);counts[t.attrib['name']]=int(t.attrib['tests'])
          assert counts['com.projectinfinity.kodi.SportsPolishTest']==5,counts
          assert counts['com.projectinfinity.kodi.SportsDataRepairTest']==4,counts
          assert counts['com.projectinfinity.kodi.SportsHubTest']==6,counts
          assert counts['com.projectinfinity.kodi.Cobra2103268ProductAuditTest']==15 and counts['com.projectinfinity.kodi.ResponsiveWindowTest']==8,counts
          assert sum(counts.values())==226,counts
          locked=Path('source271/screenshots/protected');current=Path('audit272/screenshots/protected');names=sorted(p.name for p in locked.glob('*.png'));assert len(names)==20,len(names)
          for name in names:assert (locked/name).read_bytes()==(current/name).read_bytes(),'Protected locked render changed: '+name
          sports=list(Path('audit272/screenshots/sports-polish').glob('*.png'));assert len(sports)==4,len(sports)
          report=json.loads(Path('signed272/background-resume-apk-audit.json').read_text());report.update(test_methods=counts,automated_tests_passed=sum(counts.values()),protected_render_equality=len(names),sports_polish_renders=len(sports),sports_visual_polish=True,sports_data_logic_preserved=True,sports_channel_resolver_preserved=True,sports_smart_multiview_preserved=True,physical_device_verified=False,update_over_install_device_verified=False,candidate_locked=False,status='AUTOMATED SPORTS POLISH TEST CANDIDATE — PASS; physical-device acceptance required')
          Path('signed272/CANDIDATE-VERIFICATION.json').write_text(json.dumps(report,indent=2)+'\n')
          apk=Path('signed272/Infinity-2103272-Sports-Polish-RC1.apk');Path('signed272/SHA256SUMS.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'  '+apk.name+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Preserve exact implementation tests renders and rollback manifest
        if: always()
        run: |
          mkdir -p audit272/repair-source
          cp -r repairs/sports-polish-2103272/* audit272/repair-source/
          cp -r build272/xbmc/build/test-results audit272/candidate-test-results || true
          cp -r build272/xbmc/src/test audit272/staged-tests || true
          tar -czf audit272/reconstructed-2103272-shell.tar.gz shell-kodi engine/background-resume-source.json scripts/package_background_resume.py scripts/infinity_background_resume.py
          cp repairs/sports-polish-2103272/ACCEPTANCE.md audit272/
          cp repairs/sports-polish-2103272/DEVICE-TEST.md audit272/
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103272-Sports-Polish-RC1-TEST-CANDIDATE
          path: signed272/
          compression-level: 0
          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103272-Sports-Polish-RC1-Evidence
          path: audit272/
          retention-days: 90
