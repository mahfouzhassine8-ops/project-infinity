name: Infinity signed80 shutdown correction - exact ARM64 native build, no APK or key
on:
  push:
    branches: [work/infinity-2103480-shutdown-apk-build-20261110]
    paths:
      - .github/workflows/infinity-2103480-shutdown-native-build.yml
      - repairs/infinity-close-startup-2103480-20261110/build_candidate/native_build.py
permissions: {contents: read, actions: read}
concurrency:
  group: infinity-signed80-shutdown-one-native-build
  cancel-in-progress: false
jobs:
  arm64:
    name: Authenticated signed80 one-file shutdown native engine
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    env:
      GH_TOKEN: '${{ github.token }}'
      NDK_VER: '21.4.7075529'
      DEPENDS: '${{ github.workspace }}/android-tools/xbmc-depends'
      TARBALLS: '${{ github.workspace }}/android-tools/xbmc-tarballs'
      BUILD_DIR: '${{ github.workspace }}/kodi-build'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551d06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools build-tools;35.0.0 platforms;android-34', log-accepted-android-sdk-licenses: false}
      - name: Exact approved scope and script syntax before artifact access
        run: |
          set -euo pipefail
          python3 -m py_compile repairs/infinity-close-startup-2103480-20261110/build_candidate/native_build.py
          python3 - <<'PY'
          import importlib.util
          p='repairs/infinity-close-startup-2103480-20261110/build_candidate/native_build.py'
          s=importlib.util.spec_from_file_location('selected_build',p)
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          m.require_scope()
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13274901825', run-id: '41726452356', merge-multiple: true, github-token: '${{ github.token }}', path: verified-inputs}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13571276665', run-id: '42364232328', merge-multiple: true, github-token: '${{ github.token }}', path: previous-review}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13595626273', run-id: '42425522122', merge-multiple: true, github-token: '${{ github.token }}', path: exact464}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13771187253', run-id: '42830516841', merge-multiple: true, github-token: '${{ github.token }}', path: signed80}
      - name: Restore exact signed80 9411 native sources with only approved shutdown correction
        run: python3 repairs/infinity-close-startup-2103480-20261110/build_candidate/native_build.py prepare
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '11698374892', run-id: '38132105717', merge-multiple: true, github-token: '${{ github.token }}', path: dependency-transfer}
      - name: Restore verified existing compiler dependencies and cache
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y python3-yaml python3-dev libsqlite3-dev libssl-dev libffi-dev
          (cd dependency-transfer && sha256sum -c SHA256SUMS)
          tar --no-same-owner -xf dependency-transfer/verified-android-dependencies.tar
          tar --no-same-owner -xf dependency-transfer/verified-compiler-cache.tar -C "$HOME"
      - uses: actions/cache@v4
        with: {path: /usr/local/lib/android/sdk/ndk/21.4.7075529, key: infinity-pinned-ndk-linux-21.4.7075529-v1}
      - name: Restore original pinned Android NDK
        run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - name: Compile and link complete ARM64 engine with original ABI preservation
        run: python3 repairs/infinity-close-startup-2103480-20261110/build_candidate/native_build.py compile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Infinity2103480-Shutdown-OneNative-${{ github.run_id }}-UNSIGNED-NO-APK
          path: |
            shutdown82-native-evidence/libkodi.so
            shutdown82-native-evidence/*.json
            shutdown82-native-evidence/*.txt
            shutdown82-native-evidence/*.sh
          retention-days: 90
          if-no-files-found: warn
