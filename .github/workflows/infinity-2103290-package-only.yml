name: Infinity | 2103290 Package Only
on:
  workflow_dispatch:
  push:
    branches: [candidate-infinity-2103290-native-responsive-layout]
    paths:
      - '.github/workflows/infinity-2103290-package-only.yml'
permissions: {contents: read, actions: read}
concurrency:
  group: infinity-2103290-package-only
  cancel-in-progress: true
env:
  NDK_VER: 21.4.7075529

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}

      - name: Reuse already-passed 2103290 native engine
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103290-Native-Responsive-Engine
          run-id: 36946876643
          github-token: ${{ github.token }}
          path: engine3290

      - name: Download exact Android source shell and 2103288 parent
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103284-Ambient-Surface-Evidence
          run-id: 36853676275
          github-token: ${{ github.token }}
          path: source284

      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103288-Evidence-First-Health-RC1-Candidate
          run-id: 36941180186
          github-token: ${{ github.token }}
          path: parent288

      - name: Verify immutable native artifact and repair scripts
        run: |
          set -euo pipefail
          test -f engine3290/libkodi.so
          test -f engine3290/ENGINE-PROOF.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=json.loads(Path('engine3290/ENGINE-PROOF.json').read_text())
          lib=Path('engine3290/libkodi.so').read_bytes()
          digest=hashlib.sha256(lib).hexdigest()
          assert digest==p['native_engine_sha256'], (digest,p['native_engine_sha256'])
          assert p['native_responsive_layout_v1'] is True
          assert p['fd_repair_preserved'] is True
          print('REUSED_NATIVE_SHA='+digest)
          PY
          python3 -m py_compile \
            repairs/native-responsive-2103290/prepare_base.py \
            repairs/native-responsive-2103290/android_shell.py \
            repairs/native-responsive-2103290/package_metadata.py

      - name: Reconstruct exact shell and prepare responsive base
        run: |
          set -euo pipefail
          test "$(sha256sum source284/reconstructed-2103284-shell.tar.gz | cut -d' ' -f1)" = d373f689b447f08deade747fef565085e634de8dcedb024ae1ff39eeb6d24621
          test "$(sha256sum parent288/Infinity-2103288-Evidence-First-Health-RC1.apk | cut -d' ' -f1)" = caba1c375cbdee32a0a9a24c7292babfeb6cba157aba8be92a6096137e17e398
          tar -xzf source284/reconstructed-2103284-shell.tar.gz
          mkdir -p audit3290 base3290 candidate3290 engine
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apk=Path('parent288/Infinity-2103288-Evidence-First-Health-RC1.apk')
          with zipfile.ZipFile(apk) as z:
              Path('engine/libinfinitycrash.so').write_bytes(z.read('lib/arm64-v8a/libinfinitycrash.so'))
          PY
          python3 repairs/native-responsive-2103290/prepare_base.py \
            --parent parent288/Infinity-2103288-Evidence-First-Health-RC1.apk \
            --native engine3290/libkodi.so \
            --out base3290/parent-native3290.apk \
            --proof audit3290/base-proof.json
          python3 - <<'PY'
          import json
          p=json.load(open('audit3290/base-proof.json'))
          assert p['only_payload_replaced']=='lib/arm64-v8a/libkodi.so'
          print('BASE3290_SHA='+p['prepared_base_sha256'])
          print('NATIVE3290_SHA='+p['native_engine_sha256'])
          with open('/tmp/engine-env','w') as f:
              f.write('BASE3290_SHA='+p['prepared_base_sha256']+'\n')
              f.write('NATIVE3290_SHA='+p['native_engine_sha256']+'\n')
          PY
          cat /tmp/engine-env >> "$GITHUB_ENV"

      - name: Build exact 2103290 Android shell delta
        run: |
          set -euo pipefail
          python3 repairs/evidence-health-2103288/apply.py apply --root . --out audit3290/evidence-health
          python3 repairs/native-responsive-2103290/android_shell.py apply \
            --root shell-kodi --receipt audit3290/android-shell-proof.json
          python3 repairs/native-responsive-2103290/android_shell.py verify \
            --root shell-kodi --receipt audit3290/android-shell-verify.json
          python3 - <<'PY'
          import json
          for p in ('audit3290/android-shell-proof.json','audit3290/android-shell-verify.json'):
              json.load(open(p))
          print('PASS: Android shell proofs are valid JSON')
          PY
          python3 repairs/native-responsive-2103290/package_metadata.py \
            --root . --base-apk-sha "$BASE3290_SHA" --native-sha "$NATIVE3290_SHA" \
            --proof audit3290/package-binding.json
          python3 - <<'PY'
          import json
          json.load(open('audit3290/package-binding.json'))
          json.load(open('engine/background-resume-source.json'))
          print('PASS: packaging metadata is valid JSON')
          PY
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0' "ndk;$NDK_VER" >/dev/null
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi

      - name: Compile Android only and permanently sign
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 scripts/package_background_resume.py \
            --source shell-kodi \
            --base-apk base3290/parent-native3290.apk \
            --build-dir build3290 \
            --out candidate3290

      - name: Final preservation gates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,re,zipfile
          from pathlib import Path
          parent=Path('parent288/Infinity-2103288-Evidence-First-Health-RC1.apk')
          apk=Path('candidate3290/Infinity-2103290-Native-Responsive-Layout-RC1.apk')
          assert apk.is_file()
          H=lambda b:hashlib.sha256(b).hexdigest()
          engine=json.load(open('engine3290/ENGINE-PROOF.json'))
          native_expected=engine['native_engine_sha256']
          with zipfile.ZipFile(parent) as a,zipfile.ZipFile(apk) as b:
              assert a.testzip() is None and b.testzip() is None
              assert H(b.read('lib/arm64-v8a/libkodi.so'))==native_expected
              for n in a.namelist():
                  if n.startswith('lib/') and not n.endswith('/') and n!='lib/arm64-v8a/libkodi.so':
                      assert a.read(n)==b.read(n),n
                  if n.startswith('assets/') and not n.endswith('/'):
                      assert a.read(n)==b.read(n),n
              native=b.read('lib/arm64-v8a/libkodi.so')
              for token in (b'INFINITY_FD_POLL_V1',b'infinity-native-responsive-v1.json',
                            b'Infinity responsive viewport:',b'Infinity responsive window:'):
                  assert token in native,token
              dex=b''.join(b.read(n) for n in b.namelist() if re.fullmatch(r'classes\d*\.dex',n))
              for token in (b'infinity_glass_chooser_2103290',b'InfinityResponsiveTrace',
                            b'Start Responsive/Fold Trace',b'native_responsive_contract='):
                  assert token in dex,token
          audit=json.load(open('candidate3290/background-resume-apk-audit.json'))
          assert audit['version_code']==2103290
          assert audit['native_engine_sha256']==native_expected
          digest=H(apk.read_bytes())
          Path('candidate3290/SHA256SUMS.txt').write_text(digest+'  '+apk.name+'\n')
          Path('candidate3290/DEVICE-TEST.md').write_text(Path('repairs/native-responsive-2103290/DEVICE-TEST.md').read_text())
          Path('candidate3290/NATIVE-ENGINE-PROOF.json').write_text(Path('engine3290/ENGINE-PROOF.json').read_text())
          Path('candidate3290/ANDROID-SHELL-PROOF.json').write_text(Path('audit3290/android-shell-proof.json').read_text())
          print('PASS PACKAGE-ONLY 2103290',digest)
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103290-Native-Responsive-Layout-RC1-Package-Only
          path: candidate3290/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
