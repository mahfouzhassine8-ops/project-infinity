name: Infinity 2103377 | Java save regression and complete Android shutdown
# TEST4 RC04 requires exact native initialization progress and all three independent shutdown cases.
# Explicit install-r receiver observation never substitutes for post-Close whole-UID death.
# Fresh, early-upgrade and fully-loaded upgrade run in independent disposable AVD jobs.

on:
  push:
    branches: [work/infinity-2103377-essential-first-shutdown-only]
    paths:
      - '.github/workflows/infinity-essential-first-java-process-verification.yml'
      - 'repairs/android-checkpoint-shutdown/runtime-tests/test_observer_upgrade_boundaries.py'
      - 'repairs/android-checkpoint-shutdown/runtime-tests/test_observer_upgrade_scenarios.py'
      - 'repairs/android-checkpoint-shutdown/runtime-tests/evidence/upgrade-receiver-38887412457.json'
      - 'repairs/android-checkpoint-shutdown/runtime-tests/essential_android_probe.py'
      - 'repairs/android-checkpoint-shutdown/runtime-tests/readonly_maps_fixture.py'
      - 'repairs/android-checkpoint-shutdown/runtime-tests/observer_upgrade_android_probe.py'
      - 'repairs/essential-first-2103377/test_runtime_native.py'
      - 'repairs/essential-first-2103377/java_save_package.py'
      - 'repairs/essential-first-2103377/InstrumentJavaWrites.java'
      - 'repairs/essential-first-2103377/tests/**'
      - 'repairs/essential-first-2103377/runtime/android/**'
  workflow_dispatch:

permissions: {contents: read, actions: read}
concurrency: {group: 'infinity-2103377-essential-java-process-verification-${{ github.sha }}', cancel-in-progress: true}

jobs:
  java-and-production-shutdown:
    name: Build once, preserve all 308 tests and permanently sign internal input
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    env:
      NDK_VER: 21.4.7075529
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.7'}
      - name: Verify exact read-only Android fixture and retained failure controls
        run: |
          set -euo pipefail
          python3 repairs/android-checkpoint-shutdown/runtime-tests/test_observer_upgrade_boundaries.py
          python3 repairs/android-checkpoint-shutdown/runtime-tests/test_observer_upgrade_scenarios.py
          python3 repairs/android-checkpoint-shutdown/runtime-tests/test_failed_close_evidence.py
          sudo apt-get update -qq
          sudo apt-get install -y libsqlite3-dev libssl-dev
          mkdir -p readonly-fixture-host
          python3 repairs/essential-first-2103377/test_runtime_native.py \
            --python-prefix "$pythonLocation" --sqlite-include /usr/include \
            --readonly-maps-fixture repairs/android-checkpoint-shutdown/runtime-tests/readonly_maps_fixture.py \
            --case readonly-maps-fixture --case readonly-maps-fixture-getfl --case readonly-maps-fixture-noino \
            --case readonly-proc-close --case readonly-proc-flush \
            --case readonly-proc-user-sync-failure --case writable-proc-real-write \
            --case readonly-proc-override --case writable-reader-retarget \
            --out readonly-fixture-host/verification.json
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-linux-21.4.7075529-v1
      - run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - uses: actions/download-artifact@v8
        with:
          run-id: 38733189236
          name: Infinity-2103377-Rails-Handoff-RC1-Signed-Test-APK
          github-token: ${{ github.token }}
          path: locked-rails
      - uses: actions/download-artifact@v8
        with:
          run-id: 38514680851
          name: Infinity-2103377-RC5-Android-274-Verified
          github-token: ${{ github.token }}
          path: verified-android
      - name: Verify locked APK and complete 274-case Android source
        run: |
          set -euo pipefail
          echo 'de8ce3f122db7bb8b2b3681e7c6ce9caf67cf38888b17ef1f82ff7759fa8a3db  locked-rails/Infinity-2103377-Rails-Handoff-RC1-Signed-Test.apk' | sha256sum -c
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path("verified-android")
          status=json.loads((root/"ANDROID-VERIFICATION.json").read_text())
          proof=json.loads((root/"SOURCE-PRESERVATION.json").read_text())
          assert status["source_commit"] == proof["source_commit"] == "5a1a427cb5bdcc248b0e2a7887f9d6682ca53877"
          assert status["totals"] == {"tests":274,"failures":0,"errors":0,"skipped":0}
          assert status["runtime_source_matches_candidate"] and status["compiled_java_inputs_match_candidate"]
          checked=0
          for rel,sha in proof["after"].items():
              p=root/"source"/rel
              if not p.is_file():
                  assert p.name in (".gitkeep",".gitignore"), rel
                  continue
              assert hashlib.sha256(p.read_bytes()).hexdigest() == sha,rel
              checked+=1
          assert checked >= 250
          for name in ("InfinityCheckpointProtocol","InfinityCloseGuardService"):
              assert (root/"source"/"tools/android/packaging/xbmc/src"/(name+".java.in")).is_file()
          print("PASS: complete 274-test Java source reproduced, checked SHA hashes",checked,flush=True)
          PY
      - uses: actions/download-artifact@v8
        with:
          run-id: 38351703759
          name: Infinity-2103377-Android-Verification
          github-token: ${{ github.token }}
          path: green-234
      - name: Download pinned Java source parser
        run: |
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/com/github/javaparser/javaparser-core/3.26.2/javaparser-core-3.26.2.jar -o javaparser-core.jar
          echo '3e3e0c65d57d12797dbead3df1ebb28e7583737d0cd1f2a898dba6febd50ab88  javaparser-core.jar' | sha256sum -c
      - name: Stage existing Java sources with audited persistence adapters
        run: |
          set -euo pipefail
          python3 repairs/essential-first-2103377/java_save_package.py java \
            --parent locked-rails/Infinity-2103377-Rails-Handoff-RC1-Signed-Test.apk \
            --source verified-android/source --gradle-dir android-gradle --out android-donor-evidence \
            --parser javaparser-core.jar --green green-234/recents-evidence
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/infinity-donor-temporary.keystore" \
            -storepass android -keypass android -alias androiddebugkey -keyalg RSA \
            -keysize 2048 -validity 1 -dname "CN=Temporary Java Donor" >/dev/null 2>&1
      - name: Compile complete Android source and run 274 preserved, 26 save and 8 completion tests
        env:
          KODI_ANDROID_STORE_FILE: ${{ runner.temp }}/infinity-donor-temporary.keystore
          KODI_ANDROID_KEY_ALIAS: androiddebugkey
          KODI_ANDROID_STORE_PASSWORD: android
          KODI_ANDROID_KEY_PASSWORD: android
        run: |
          set -euo pipefail
          cd android-gradle
          ./gradlew --no-daemon --console=plain :xbmc:testReleaseUnitTest :xbmc:assembleRelease :xbmc:exportPreservationTools \
            2>&1 | tee ../android-donor-evidence/GRADLE-ANDROID-RELEASE.log
          test -s xbmc/build/outputs/apk/release/xbmc-release.apk
      - name: Verify every original test and preserve unrelated Java instructions
        run: |
          python3 repairs/essential-first-2103377/java_save_package.py verify-java \
            --parent locked-rails/Infinity-2103377-Rails-Handoff-RC1-Signed-Test.apk \
            --donor android-gradle/xbmc/build/outputs/apk/release/xbmc-release.apk \
            --gradle-dir android-gradle --android android-donor-evidence --out essential-fold-test
      - name: Verify exact green native and permanently signed locked parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          pinned={
              38945424322:"eaa6ff3f283fea149cede0423488c4e7989a5090",
              38733189236:"62ba1eccef24b209a1d32fb9bef39b5928ac4f4a",
          }
          for run,commit in pinned.items():
              req=urllib.request.Request("https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+
                  "/actions/runs/"+str(run),headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                  "Accept":"application/vnd.github+json"})
              deadline=time.monotonic()+3600
              while True:
                  with urllib.request.urlopen(req,timeout=40) as response: data=json.load(response)
                  assert data["head_sha"]==commit,run
                  if data["status"]=="completed":
                      assert data["conclusion"]=="success",run
                      break
                  assert time.monotonic()<deadline,"Pinned full native build did not finish"
                  print("Waiting for pinned full ARM64 build",run,flush=True)
                  time.sleep(20)
              print("Exact green pinned run:",run,commit,flush=True)
          PY
      - uses: actions/download-artifact@v8
        with:
          run-id: 38945424322
          name: Infinity-2103377-Essential-First-Native-Evidence
          github-token: ${{ github.token }}
          path: native-evidence
      - uses: actions/download-artifact@v8
        with:
          run-id: 38854391733
          name: Infinity-2103377-Essential-First-Signed-Fold-TEST2
          github-token: ${{ github.token }}
          path: accepted-test2
      - uses: actions/download-artifact@v8
        with:
          run-id: 38868115575
          name: Infinity-2103377-Essential-First-Signed-Fold-TEST3
          github-token: ${{ github.token }}
          path: accepted-test3
      - name: Sign internal matched native/Android probe with protected permanent certificate
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p essential-fold-test
          python3 repairs/essential-first-2103377/java_save_package.py package \
            --parent locked-rails/Infinity-2103377-Rails-Handoff-RC1-Signed-Test.apk \
            --donor android-gradle/xbmc/build/outputs/apk/release/xbmc-release.apk \
            --native native-evidence --android android-donor-evidence \
            --accepted-test2 accepted-test2/Infinity-2103377-Essential-First-Signed-Fold-TEST2.apk \
            --accepted-test3 accepted-test3/Infinity-2103377-Essential-First-Signed-Fold-TEST3.apk \
            --gradle-dir android-gradle \
            --out essential-fold-test \
            2>&1 | tee essential-fold-test/PACKAGING-VERIFICATION.log
      - name: Retain identical internal acceptance inputs for independent Android jobs
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103377-Essential-First-Internal-Acceptance-Inputs
          path: |
            essential-fold-test/Infinity-2103377-Essential-First-Internal-Probe.apk
            essential-fold-test/*.json
            essential-fold-test/*.txt
            native-evidence/installed-addons/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Retain complete Java, signing and preservation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103377-Essential-First-Java-Process-Evidence
          path: |
            readonly-fixture-host/
            essential-fold-test/*.json
            essential-fold-test/*.txt
            essential-fold-test/*.log
            essential-fold-test/compiler-differences/
            essential-fold-test/test2-preservation/
            essential-fold-test/test3-preservation/
            android-donor-evidence/*.json
            android-donor-evidence/*.log
            android-gradle/xbmc/build/test-results/
            android-gradle/xbmc/build/reports/tests/
            android-donor-evidence/screenshots/
            android-donor-evidence/runtime/
          retention-days: 90
          compression-level: 1
          if-no-files-found: warn

  fresh-production-shutdown:
    name: Fresh production Close, save receipts, UID death and reopen
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: java-and-production-shutdown
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.7'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103377-Essential-First-Internal-Acceptance-Inputs
          path: .
      - name: Enable disposable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Fresh production Close, save receipts, UID death and reopen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          avd-name: infinity-fresh
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 repairs/android-checkpoint-shutdown/runtime-tests/essential_android_probe.py --apk essential-fold-test/Infinity-2103377-Essential-First-Internal-Probe.apk --installed-addons native-evidence/installed-addons --out android-process-evidence --require-java-save-proof
      - name: Retain independent actual Android outcome and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103377-Essential-First-Fresh-Android-Process-Evidence
          path: android-process-evidence/
          retention-days: 90
          compression-level: 1
          if-no-files-found: warn

  upgrade-early-shutdown:
    name: Independent TEST3 upgrade, early Close, UID death and reopen
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: java-and-production-shutdown
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.7'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103377-Essential-First-Internal-Acceptance-Inputs
          path: .
      - name: Enable disposable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: actions/download-artifact@v8
        with:
          run-id: 38868115575
          name: Infinity-2103377-Essential-First-Signed-Fold-TEST3
          github-token: ${{ github.token }}
          path: accepted-test3
      - name: Independent TEST3 upgrade, early Close, UID death and reopen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          avd-name: infinity-upgrade-early
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 repairs/android-checkpoint-shutdown/runtime-tests/observer_upgrade_android_probe.py --scenario early --baseline-apk accepted-test3/Infinity-2103377-Essential-First-Signed-Fold-TEST3.apk --candidate-apk essential-fold-test/Infinity-2103377-Essential-First-Internal-Probe.apk --installed-addons native-evidence/installed-addons --out observer-upgrade-early-evidence
      - name: Retain independent actual Android outcome and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103377-Essential-First-Upgrade-Early-Evidence
          path: observer-upgrade-early-evidence/
          retention-days: 90
          compression-level: 1
          if-no-files-found: warn

  upgrade-loaded-shutdown:
    name: Independent TEST3 upgrade, 37 loaded services, Close and reopen
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: java-and-production-shutdown
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.7'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103377-Essential-First-Internal-Acceptance-Inputs
          path: .
      - name: Enable disposable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: actions/download-artifact@v8
        with:
          run-id: 38868115575
          name: Infinity-2103377-Essential-First-Signed-Fold-TEST3
          github-token: ${{ github.token }}
          path: accepted-test3
      - name: Independent TEST3 upgrade, 37 loaded services, Close and reopen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          avd-name: infinity-upgrade-loaded
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 repairs/android-checkpoint-shutdown/runtime-tests/observer_upgrade_android_probe.py --scenario loaded --baseline-apk accepted-test3/Infinity-2103377-Essential-First-Signed-Fold-TEST3.apk --candidate-apk essential-fold-test/Infinity-2103377-Essential-First-Internal-Probe.apk --installed-addons native-evidence/installed-addons --out observer-upgrade-loaded-evidence
      - name: Retain independent actual Android outcome and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103377-Essential-First-Upgrade-Loaded-Evidence
          path: observer-upgrade-loaded-evidence/
          retention-days: 90
          compression-level: 1
          if-no-files-found: warn

  promote-fold-review-only:
    name: Require fresh, early and loaded acceptance before Fold review
    needs: [java-and-production-shutdown, fresh-production-shutdown, upgrade-early-shutdown, upgrade-loaded-shutdown]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.7'}
      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103377-Essential-First-Internal-Acceptance-Inputs
          path: .
      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103377-Essential-First-Fresh-Android-Process-Evidence
          path: android-process-evidence
      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103377-Essential-First-Upgrade-Early-Evidence
          path: observer-upgrade-early-evidence
      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103377-Essential-First-Upgrade-Loaded-Evidence
          path: observer-upgrade-loaded-evidence
      - name: Prepare the exact tested bytes for physical Fold review
        run: |
          python3 - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          report=json.loads(Path('android-process-evidence/ANDROID-PROCESS-PROBE.json').read_text())
          required=('passed','android_engine_death_verified','whole_package_death_verified','reopen_verified','favourites_preserved','both_java_process_save_proofs_verified','readonly_virtual_file_read_close_verified')
          assert all(report.get(key) is True for key in required), report.get('failure')
          early=json.loads(Path('observer-upgrade-early-evidence/OBSERVER-UPGRADE-PROBE.json').read_text())
          loaded=json.loads(Path('observer-upgrade-loaded-evidence/OBSERVER-UPGRADE-PROBE.json').read_text())
          for scenario,upgrade in (('early',early),('loaded',loaded)):
              assert upgrade['scenario']==scenario
              assert upgrade['candidate_apk_sha256']==report['apk_sha256']
              assert all(upgrade.get(key) is True for key in ('passed','upgrade_bytes_preserved','saved_data_reopen_verified')),upgrade.get('failure')
              assert len(upgrade['reopen_ready_services'])==37
              assert upgrade['upgrade_receiver_before_comparison']['passed'] is True
              assert upgrade['upgrade_receiver_after_comparison']['passed'] is True
              close=upgrade['candidate_'+scenario+'_close']
              assert close['passed'] and close['both_java_seals_verified'] and close['whole_package_death_verified']
              native=close['receipt']['native_receipt']
              assert native['essential_writes_sealed'] and native['essential_writes_durable'] and not native['essential_write_blockers']
              essential=[row for row in native['owners'] if row['essential']]
              assert len(essential)==16 and {row['owner'] for row in essential}==set(native['essential_owners'])
              assert all(row['required_writes_finished'] and not row['dirty_remaining'] and row['result'] in ('COMMITTED','ALREADY_DURABLE') for row in essential)
          assert early['early_ready_count']<37
          assert len(loaded['candidate_ready_services'])==37
          assert loaded['candidate_directory_creation']['mkdirs_succeeded'] is True
          assert loaded['candidate_directory_creation']['essential_settings_written'] is True
          source=Path('essential-fold-test/Infinity-2103377-Essential-First-Internal-Probe.apk')
          digest=hashlib.sha256(source.read_bytes()).hexdigest()
          assert digest==report['apk_sha256']
          root=Path('fold-test4');root.mkdir()
          target=root/'Infinity-2103377-Essential-First-Signed-Fold-TEST4.apk'
          shutil.copyfile(source,target)
          proof=json.loads(Path('essential-fold-test/ESSENTIAL-FIRST-SIGNED-TEST-PRESERVATION.json').read_text())
          assert proof['apk_sha256']==digest
          proof.update(status='HOST AND INTERNAL ANDROID PASSED; PHYSICAL FOLD REVIEW REQUIRED',file=target.name,
              apk_deliverable=True,verified_android_process_exit=True,verified_first_party_callback_on_device=True,
              internal_whole_package_death_verified=True,internal_saved_data_reopen_verified=True,
              verified_fold_reopen=False,physical_fold_accepted=False,final_lock_authorized=False,
              native_run_id=38945424322,android_run_id=int(os.environ['GITHUB_RUN_ID']),
              internal_startup_close_verified=True,internal_loaded_close_verified=True,
              independent_upgrade_avds_verified=True,upgrade_scenarios=['early','loaded'],
              internal_missing_directory_creation_verified=True,
              retained_upgrade_data_verified=True,synthetic_service_count=37,actual_diggz_ecosystem_tested=False,
              readonly_virtual_file_read_close_verified=True)
          (root/'ESSENTIAL-FIRST-SIGNED-TEST-PRESERVATION.json').write_text(json.dumps(proof,indent=2)+'\n')
          (root/'SHA256SUMS').write_text(digest+'  '+target.name+'\n')
          for name in ('CERT-VERIFICATION.txt','JAVA-REGRESSION-VERIFICATION.json','TEST-LIMITATIONS.md','TEST2-BASELINE-PRESERVATION.json','TEST3-BASELINE-PRESERVATION.json'):
              shutil.copyfile(Path('essential-fold-test')/name,root/name)
          shutil.copyfile('android-process-evidence/ANDROID-PROCESS-PROBE.json',root/'INTERNAL-ANDROID-PROCESS-PROBE.json')
          shutil.copyfile('observer-upgrade-early-evidence/OBSERVER-UPGRADE-PROBE.json',root/'INTERNAL-OBSERVER-UPGRADE-EARLY-PROBE.json')
          shutil.copyfile('observer-upgrade-loaded-evidence/OBSERVER-UPGRADE-PROBE.json',root/'INTERNAL-OBSERVER-UPGRADE-LOADED-PROBE.json')
          PY
      - name: Retain signed physical-test candidate only after every gate passes
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103377-Essential-First-Signed-Fold-TEST4
          path: fold-test4/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
