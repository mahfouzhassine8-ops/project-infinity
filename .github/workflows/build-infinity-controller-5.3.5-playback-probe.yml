name: Infinity Controller 5.3.5 Playback Probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-infinity-controller-5.3.5-playback-probe.yml'
      - 'scripts/patch-infinity-controller-5.3.5-playback-probe.py'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {actions: read, contents: read}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: 'build-tools;34.0.0 platform-tools'}
      - name: Install apktool
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends unzip curl
          curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
      - name: Download proven 5.3.4 checkpoint
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9999156186/zip" -o /tmp/base.zip
          mkdir -p /tmp/base && unzip -q /tmp/base.zip -d /tmp/base
          APK=$(find /tmp/base -name '*.apk' -type f | head -1); test -n "$APK"; cp "$APK" /tmp/base.apk
      - name: Record native hash
        run: unzip -p /tmp/base.apk lib/arm64-v8a/libkodi.so | sha256sum | awk '{print $1}' > /tmp/before.sha
      - name: Decode
        run: java -jar /tmp/apktool.jar d -f /tmp/base.apk -o /tmp/decoded
      - name: Add playback probe only
        run: python3 scripts/patch-infinity-controller-5.3.5-playback-probe.py
      - name: Verify surgical scope
        run: |
          set -euo pipefail
          P=$(find /tmp/decoded -name 'InfinityController$PlaybackProbeRunnable.smali' | head -1)
          C=$(find /tmp/decoded -path '*/com/projectinfinity/kodi/InfinityController.smali' | head -1)
          test -n "$P" && test -n "$C"
          grep -q 'Player.GetActivePlayers' "$P"
          grep -q 'type\\\":\\\"video' "$P"
          grep -q '127.0.0.1' "$P"
          ! grep -q 'JSONRPC.Ping' "$P"
          ! grep -q 'enterPictureInPictureMode' "$C"
          ! grep -q 'Player.OnPlay' "$P"
          ! grep -q 'Player.OnStop' "$P"
          grep -q 'android:supportsPictureInPicture="true"' /tmp/decoded/AndroidManifest.xml
      - name: Rebuild
        run: java -jar /tmp/apktool.jar b /tmp/decoded -o /tmp/u.apk
      - name: Verify native unchanged
        run: unzip -p /tmp/u.apk lib/arm64-v8a/libkodi.so | sha256sum | awk '{print $1}' > /tmp/after.sha && cmp /tmp/before.sha /tmp/after.sha
      - name: Sign
        env: {PASS: 'infinity${{ github.run_id }}${{ github.run_attempt }}'}
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          keytool -genkeypair -keystore /tmp/k -alias infinity -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Infinity 5.3.5, O=Project Infinity, C=US" >/dev/null 2>&1
          "$BT/zipalign" -f 4 /tmp/u.apk /tmp/a.apk
          "$BT/apksigner" sign --ks /tmp/k --ks-key-alias infinity --ks-pass env:PASS --key-pass env:PASS --out /tmp/Infinity-5.3.5-Playback-Probe.apk /tmp/a.apk
          "$BT/apksigner" verify --verbose /tmp/Infinity-5.3.5-Playback-Probe.apk
      - uses: actions/upload-artifact@v7
        with: {name: Infinity-5.3.5-Playback-Probe-Surgical, path: /tmp/Infinity-5.3.5-Playback-Probe.apk, retention-days: 30}
