name: Infinity Controller 5.3.7.2 Stable2 Body

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-infinity-controller-5.3.7.2-stable2-body.yml'
      - 'scripts/patch-infinity-controller-5.3.7.2-stable2-body.py'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;34.0.0 platform-tools'

      - name: Install apktool
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends unzip curl
          curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

      - name: Download exact Stable2 PiP v3 body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9987818547/zip" -o /tmp/target.zip
          mkdir -p /tmp/target-art
          unzip -q /tmp/target.zip -d /tmp/target-art
          APK=$(find /tmp/target-art -name '*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" /tmp/target.apk

      - name: Download exact tested 5.3.6 brain donor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9999680657/zip" -o /tmp/donor.zip
          mkdir -p /tmp/donor-art
          unzip -q /tmp/donor.zip -d /tmp/donor-art
          APK=$(find /tmp/donor-art -name '*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" /tmp/donor.apk

      - name: Record target native hash
        run: unzip -p /tmp/target.apk lib/arm64-v8a/libkodi.so | sha256sum | awk '{print $1}' > /tmp/libkodi-before.sha256

      - name: Decode target and donor
        run: |
          java -jar /tmp/apktool.jar d -f /tmp/target.apk -o /tmp/target
          java -jar /tmp/apktool.jar d -f /tmp/donor.apk -o /tmp/donor

      - name: Copy exact tested 5.3.6 brain files into Stable2 PiP v3
        run: |
          set -euo pipefail
          TD=$(find /tmp/target -type d -path '*/com/projectinfinity/kodi' | head -1)
          DD=$(find /tmp/donor -type d -path '*/com/projectinfinity/kodi' | head -1)
          test -n "$TD"
          test -n "$DD"
          for f in 'InfinityController.smali' 'InfinityController$KodiListenerRunnable.smali' 'InfinityController$ToastRunnable.smali'; do
            test -f "$DD/$f"
            cp "$DD/$f" "$TD/$f"
            sha256sum "$DD/$f" | awk '{print $1}' > "/tmp/${f}.donor.sha"
            sha256sum "$TD/$f" | awk '{print $1}' > "/tmp/${f}.target.sha"
            cmp "/tmp/${f}.donor.sha" "/tmp/${f}.target.sha"
          done

      - name: Add only the two connection stitches
        run: python3 scripts/patch-infinity-controller-5.3.7.2-stable2-body.py

      - name: Verify body, brain, and gate
        run: |
          set -euo pipefail
          MAIN=$(find /tmp/target -path '*/com/projectinfinity/kodi/Main.smali' | head -1)
          TD=$(dirname "$MAIN")
          grep -q '.method protected onUserLeaveHint()V' "$MAIN"
          grep -q 'invoke-super {p0}, Landroid/app/NativeActivity;->onUserLeaveHint()V' "$MAIN"
          grep -q 'InfinityController;->shouldAllowPiP()Z' "$MAIN"
          grep -q 'Lcom/projectinfinity/kodi/Main;->enterPictureInPictureMode()Z' "$MAIN"
          grep -q 'InfinityController;->init(Landroid/app/Activity;)V' "$MAIN"
          grep -q 'Player.OnAVStart' "$TD/InfinityController$KodiListenerRunnable.smali"
          grep -q 'Player.OnStop' "$TD/InfinityController$KodiListenerRunnable.smali"
          grep -q 'android:supportsPictureInPicture="true"' /tmp/target/AndroidManifest.xml
          grep -q 'android:resizeableActivity="true"' /tmp/target/AndroidManifest.xml

      - name: Rebuild
        run: java -jar /tmp/apktool.jar b /tmp/target -o /tmp/Infinity-5.3.7.2-Stable2-Body-unsigned.apk

      - name: Verify target libkodi stayed byte-for-byte unchanged
        run: |
          unzip -p /tmp/Infinity-5.3.7.2-Stable2-Body-unsigned.apk lib/arm64-v8a/libkodi.so | sha256sum | awk '{print $1}' > /tmp/libkodi-after.sha256
          cmp /tmp/libkodi-before.sha256 /tmp/libkodi-after.sha256

      - name: Sign APK
        env:
          PASS: infinity${{ github.run_id }}${{ github.run_attempt }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          keytool -genkeypair -keystore /tmp/infinity.keystore -alias infinity -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Infinity 5.3.7.2 Stable2 Body, O=Project Infinity, C=US" >/dev/null 2>&1
          "$BT/zipalign" -f 4 /tmp/Infinity-5.3.7.2-Stable2-Body-unsigned.apk /tmp/Infinity-5.3.7.2-Stable2-Body-aligned.apk
          "$BT/apksigner" sign --ks /tmp/infinity.keystore --ks-key-alias infinity --ks-pass env:PASS --key-pass env:PASS \
            --out /tmp/Infinity-5.3.7.2-Stable2-Body.apk /tmp/Infinity-5.3.7.2-Stable2-Body-aligned.apk
          "$BT/apksigner" verify --verbose /tmp/Infinity-5.3.7.2-Stable2-Body.apk

      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-5.3.7.2-Stable2-Body
          path: /tmp/Infinity-5.3.7.2-Stable2-Body.apk
          retention-days: 30
