name: ♾️ Build Candidate - Player Polish

on:
  push:
    paths:
      - '.github/workflows/build-candidate-player-polish.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;34.0.0 platform-tools'

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends unzip curl
          curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

      - name: Download proven Stable 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9980737918/zip -o /tmp/base.zip
          mkdir -p /tmp/base && unzip -q /tmp/base.zip -d /tmp/base
          APK=$(find /tmp/base -name '*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" /tmp/stable2.apk

      - name: Decode Stable 2
        run: java -jar /tmp/apktool.jar d -f /tmp/stable2.apk -o /tmp/decoded

      - name: Apply player visual polish only
        run: |
          set -euo pipefail
          LOCKXML=/tmp/decoded/assets/addons/skin.estuary/xml/Custom_1199_InfinityVideoLock.xml
          test -f "$LOCKXML"
          cat > "$LOCKXML" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <window type="dialog" id="1199">
            <onload>SetProperty(InfinityVideoLocked,true)</onload>
            <onload>SetProperty(InfinityLockHint,true)</onload>
            <onload>ClearProperty(InfinityUnlockVisible)</onload>
            <onload>ClearProperty(InfinityUnlocking)</onload>
            <onload>AlarmClock(InfinityHideInitial,ClearProperty(InfinityLockHint),00:00:01,silent)</onload>
            <onunload>CancelAlarm(InfinityHideInitial,silent)</onunload>
            <onunload>CancelAlarm(InfinityHideTap,silent)</onunload>
            <onunload>CancelAlarm(InfinityFinishUnlock,silent)</onunload>
            <onunload>ClearProperty(InfinityVideoLocked)</onunload>
            <onunload>ClearProperty(InfinityLockHint)</onunload>
            <onunload>ClearProperty(InfinityUnlockVisible)</onunload>
            <onunload>ClearProperty(InfinityUnlocking)</onunload>
            <defaultcontrol always="true">9900</defaultcontrol>
            <controls>
              <control type="button" id="9900">
                <left>0</left><top>0</top><width>100%</width><height>100%</height>
                <texturefocus colordiffuse="00FFFFFF">white.png</texturefocus>
                <texturenofocus colordiffuse="00FFFFFF">white.png</texturenofocus>
                <label></label>
                <onclick condition="String.IsEmpty(Window.Property(InfinityUnlocking))">SetProperty(InfinityUnlockVisible,true)</onclick>
                <onclick condition="String.IsEmpty(Window.Property(InfinityUnlocking))">CancelAlarm(InfinityHideTap,silent)</onclick>
                <onclick condition="String.IsEmpty(Window.Property(InfinityUnlocking))">AlarmClock(InfinityHideTap,ClearProperty(InfinityUnlockVisible),00:00:03,silent)</onclick>
              </control>

              <!-- Slightly smaller initial lock; same proven one-second behavior with a soft fade. -->
              <control type="image">
                <left>52</left><top>39</top><width>50</width><height>50</height>
                <texture>osd/fullscreen/buttons/infinity-lock.png</texture>
                <visible>!String.IsEmpty(Window.Property(InfinityLockHint)) + String.IsEmpty(Window.Property(InfinityUnlocking))</visible>
                <animation effect="fade" start="0" end="100" time="100">Visible</animation>
                <animation effect="fade" start="100" end="0" time="220">Hidden</animation>
              </control>

              <!-- Smaller, semi-transparent lock after touching the locked movie. -->
              <control type="button" id="9901">
                <left>45</left><top>32</top><width>64</width><height>64</height>
                <texturefocus colordiffuse="B3FFFFFF">osd/fullscreen/buttons/infinity-lock.png</texturefocus>
                <texturenofocus colordiffuse="A6FFFFFF">osd/fullscreen/buttons/infinity-lock.png</texturenofocus>
                <label></label>
                <pulseonselect>false</pulseonselect>
                <visible>!String.IsEmpty(Window.Property(InfinityUnlockVisible)) + String.IsEmpty(Window.Property(InfinityUnlocking))</visible>
                <animation effect="fade" start="0" end="70" time="120">Visible</animation>
                <animation effect="fade" start="70" end="0" time="180">Hidden</animation>
                <onfocus>CancelAlarm(InfinityHideTap,silent)</onfocus>
                <onclick>CancelAlarm(InfinityHideTap,silent)</onclick>
                <onclick>ClearProperty(InfinityUnlockVisible)</onclick>
                <onclick>SetProperty(InfinityUnlocking,true)</onclick>
                <onclick>AlarmClock(InfinityFinishUnlock,Dialog.Close(1199),00:00:00.45,silent)</onclick>
              </control>

              <!-- Brief open-lock confirmation before normal controls return. -->
              <control type="image">
                <left>52</left><top>39</top><width>50</width><height>50</height>
                <texture>osd/fullscreen/buttons/infinity-unlock.png</texture>
                <visible>!String.IsEmpty(Window.Property(InfinityUnlocking))</visible>
                <animation effect="fade" start="0" end="100" time="70">Visible</animation>
                <animation effect="zoom" start="92" end="106" center="77,64" time="130">Visible</animation>
                <animation effect="fade" start="100" end="0" time="180" delay="180">Visible</animation>
              </control>
            </controls>
          </window>
          XML
          grep -q '00:00:01' "$LOCKXML"
          grep -q 'colordiffuse="B3FFFFFF"' "$LOCKXML"
          grep -q 'infinity-unlock.png' "$LOCKXML"

      - name: Rebuild
        run: java -jar /tmp/apktool.jar b /tmp/decoded -o /tmp/Infinity-Player-Polish-unsigned.apk

      - name: Sign
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/project-infinity.keystore -alias projectinfinity -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Infinity Player Polish, OU=Personal Build, O=Infinity, L=Detroit, ST=Michigan, C=US" >/dev/null 2>&1
          "$BT/zipalign" -f 4 /tmp/Infinity-Player-Polish-unsigned.apk /tmp/Infinity-Player-Polish-aligned.apk
          "$BT/apksigner" sign --ks ~/.android/project-infinity.keystore --ks-key-alias projectinfinity --ks-pass pass:android --key-pass pass:android --out /tmp/Infinity-Player-Polish.apk /tmp/Infinity-Player-Polish-aligned.apk
          "$BT/apksigner" verify --verbose /tmp/Infinity-Player-Polish.apk

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-Player-Polish-Candidate
          path: /tmp/Infinity-Player-Polish.apk
          retention-days: 30
