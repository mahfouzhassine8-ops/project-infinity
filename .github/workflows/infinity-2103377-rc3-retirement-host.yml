name: Infinity | 2103377 RC3 early Python abort and Curl failure tests
on:
  push:
    branches: [work/infinity-2103377-rc3-early-python-retirement]
    paths:
      - '.github/workflows/infinity-2103377-rc3-retirement-host.yml'
      - 'repairs/shutdown-rc3-2103377/**'
permissions: {contents: read, actions: read}
concurrency: {group: infinity-2103377-rc3-retirement-host, cancel-in-progress: false}
jobs:
  owner-specific-curl:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/download-artifact@v8
        with:
          run-id: 38493645998
          name: Infinity-2103377-RC3-Exact-Native-Curl-Source
          github-token: '${{ github.token }}'
          path: rc2-captured-source
      - name: Test pinned early Python stop, true Curl failure and preserved saves
        run: |
          set -euo pipefail
          mkdir -p rc3-host-evidence
          python3 repairs/shutdown-rc3-2103377/test_source.py \
             --source rc2-captured-source --output rc3-host-evidence/RC3-HOST-SOURCE-VERIFICATION.json
      - name: Preserve original source and isolated test receipts
        if: always()
        run: |
          mkdir -p rc3-host-evidence
          git rev-parse HEAD > rc3-host-evidence/SOURCE-COMMIT.txt
          sha256sum repairs/shutdown-rc3-2103377/*.py > rc3-host-evidence/RC3-SOURCE-SHA256.txt
          printf '%s\n' 'HOST-ONLY: real extracted injected C++ guards, not a completed Kodi native engine or a Fold shutdown; no existing locked files changed.' > rc3-host-evidence/LIMITS.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103377-RC3-Retirement-Host-Checks
          path: rc3-host-evidence/
          retention-days: 90
