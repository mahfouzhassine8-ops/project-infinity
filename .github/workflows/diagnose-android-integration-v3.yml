name: Diagnose Android Integration v3

on:
  push:
    paths:
      - '.github/workflows/diagnose-android-integration-v3.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends unzip curl
          curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
      - name: Download Stable 2 v12 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9987128748/zip -o /tmp/base.zip
          mkdir -p /tmp/base
          unzip -q /tmp/base.zip -d /tmp/base
          APK=$(find /tmp/base -name '*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" /tmp/base.apk
      - name: Decode Stable 2
        run: java -jar /tmp/apktool.jar d -f /tmp/base.apk -o /tmp/decoded
      - name: Map launcher activity and lifecycle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('/tmp/decoded')
          man = (root/'AndroidManifest.xml').read_text(errors='ignore')
          print('=== MANIFEST LAUNCHER ACTIVITY ===')
          chosen = None
          for m in re.finditer(r'<activity\b[^>]*>', man):
              end = man.find('</activity>', m.end())
              if end < 0: continue
              body = man[m.start():end+11]
              if 'android.intent.action.MAIN' in body and 'android.intent.category.LAUNCHER' in body:
                  chosen = m.group(0)
                  print(chosen)
                  break
          if not chosen:
              raise SystemExit('Launcher activity not found')
          nm = re.search(r'android:name="([^"]+)"', chosen)
          if not nm:
              raise SystemExit('Launcher activity name missing')
          name = nm.group(1)
          print('LAUNCHER_NAME=' + name)

          # Resolve relative activity names against manifest package when needed.
          pkgm = re.search(r'<manifest[^>]*\bpackage="([^"]+)"', man)
          pkg = pkgm.group(1) if pkgm else ''
          fqcn = (pkg + name) if name.startswith('.') else name
          print('LAUNCHER_FQCN=' + fqcn)
          rel = fqcn.replace('.', '/') + '.smali'

          candidates = list(root.glob('smali*/' + rel))
          if not candidates:
              print('Exact smali not found; searching by class name...')
              leaf = fqcn.split('.')[-1] + '.smali'
              candidates = [p for d in root.glob('smali*') for p in d.rglob(leaf)]
          if not candidates:
              raise SystemExit('Launcher smali not found')

          p = candidates[0]
          print('LAUNCHER_SMALI=' + str(p))
          text = p.read_text(errors='ignore')
          print('=== CLASS HEADER ===')
          for line in text.splitlines()[:80]:
              print(line)

          print('=== LIFECYCLE METHODS PRESENT ===')
          methods = ['onCreate','onStart','onResume','onPause','onStop','onDestroy','onUserLeaveHint','onPictureInPictureModeChanged','onConfigurationChanged','onWindowFocusChanged']
          for meth in methods:
              hits = [m.start() for m in re.finditer(r'^\.method[^\n]*\b'+re.escape(meth)+r'\(', text, re.M)]
              print(f'{meth}: {len(hits)}')
              for pos in hits[:2]:
                  end = text.find('.end method', pos)
                  snippet = text[pos:(end+11 if end!=-1 else pos+1800)]
                  print('--- ' + meth + ' ---')
                  print(snippet[:3500])

          print('=== PiP API REFERENCES IN ACTIVITY ===')
          for line in text.splitlines():
              if 'PictureInPicture' in line or 'pictureInPicture' in line:
                  print(line)
          PY
