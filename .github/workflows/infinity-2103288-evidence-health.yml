name: Infinity | 2103288 Evidence-First Health Center
on:
  workflow_dispatch:
  push:
    branches: [candidate-infinity-2103288-evidence-first-health]
    paths:
      - 'repairs/evidence-health-2103288/**'
      - '.github/workflows/infinity-2103288-evidence-health.yml'
permissions: {contents: read, actions: read}
concurrency:
  group: infinity-2103288-health-${{ github.sha }}
  cancel-in-progress: false
env:
  NDK_VER: 21.4.7075529
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103284-Ambient-Surface-Evidence
          run-id: 36853676275
          github-token: ${{ github.token }}
          path: source284
      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103285-Native-FD-Crash-Repair-RC1-Candidate
          run-id: 36933314038
          github-token: ${{ github.token }}
          path: parent285
      - name: Verify exact diagnostic parent and reconstruct Android shell
        run: |
          set -euo pipefail
          test "$(sha256sum source284/reconstructed-2103284-shell.tar.gz | cut -d' ' -f1)" = d373f689b447f08deade747fef565085e634de8dcedb024ae1ff39eeb6d24621
          test "$(sha256sum parent285/Infinity-2103285-Native-FD-Crash-Repair-RC1.apk | cut -d' ' -f1)" = 64ed5ce79096a3e09d02907cf72d3a5c4ad20186da231898c92db83e540d266b
          tar -xzf source284/reconstructed-2103284-shell.tar.gz
          mkdir -p audit288
          python3 repairs/evidence-health-2103288/apply.py apply --root . --out audit288
          python3 repairs/evidence-health-2103288/apply.py verify --root . --out audit288
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0' "ndk;$NDK_VER" >/dev/null
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
      - name: Compile diagnostic-only Android layer and permanently sign
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 scripts/package_background_resume.py \
            --source shell-kodi \
            --base-apk parent285/Infinity-2103285-Native-FD-Crash-Repair-RC1.apk \
            --build-dir build288 \
            --out candidate288
          python3 repairs/evidence-health-2103288/apply.py verify --root . --out audit288
      - name: Enforce 2103285 native/asset/skin preservation and trace contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,re,zipfile
          from pathlib import Path
          base=Path('parent285/Infinity-2103285-Native-FD-Crash-Repair-RC1.apk')
          final=Path('candidate288/Infinity-2103288-Evidence-First-Health-RC1.apk')
          assert final.is_file()
          H=lambda b:hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile(base) as a,zipfile.ZipFile(final) as b:
              assert a.testzip() is None and b.testzip() is None
              assert H(a.read('lib/arm64-v8a/libkodi.so'))=='f6eb05f091bfe7a624105a0a83744a292e229b385d39c1b6a23f8bf954a2522a'
              assert a.read('lib/arm64-v8a/libkodi.so')==b.read('lib/arm64-v8a/libkodi.so')
              for n in a.namelist():
                  if n.startswith('lib/') and not n.endswith('/'): assert a.read(n)==b.read(n),n
                  if n.startswith('assets/') and not n.endswith('/'): assert a.read(n)==b.read(n),n
              dex=b''.join(b.read(n) for n in b.namelist() if re.fullmatch(r'classes\d*\.dex',n))
              for token in (b'InfinityResponsiveTrace',b'Start Responsive/Fold Trace',
                            b'Stop & export Responsive/Fold Trace',b'android-window-events.tsv',
                            b'KODI GEOMETRY UPDATED; SKIN PROFILE RELOAD NOT OBSERVED'):
                  assert token in dex,token
          report=json.loads(Path('candidate288/background-resume-apk-audit.json').read_text())
          assert report['version_code']==2103288
          assert report['native_engine_sha256']=='f6eb05f091bfe7a624105a0a83744a292e229b385d39c1b6a23f8bf954a2522a'
          assert report['native_recompiled'] is False
          digest=H(final.read_bytes())
          Path('candidate288/SHA256SUMS.txt').write_text(digest+'  '+final.name+'\n')
          Path('candidate288/DEVICE-TEST.md').write_text(Path('repairs/evidence-health-2103288/DEVICE-TEST.md').read_text())
          Path('candidate288/SOURCE-PROOF.json').write_text(Path('audit288/source-proof.json').read_text())
          print('PASS diagnostic-only candidate',digest)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103288-Evidence-First-Health-RC1-Candidate
          path: candidate288/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
  update-smoke:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103288-Evidence-First-Health-RC1-Candidate
          path: candidate288
      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103285-Native-FD-Crash-Repair-RC1-Candidate
          run-id: 36933314038
          github-token: ${{ github.token }}
          path: parent285
      - name: Enable disposable emulator
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            mkdir -p runtime288
            adb install --no-incremental parent285/Infinity-2103285-Native-FD-Crash-Repair-RC1.apk | tee runtime288/install-parent.txt
            adb install --no-incremental -r candidate288/Infinity-2103288-Evidence-First-Health-RC1.apk | tee runtime288/update.txt
            grep -q Success runtime288/update.txt
            adb shell am start -W -n com.projectinfinity.kodi/.Splash | tee runtime288/start.txt
            sleep 4
            adb shell pidof com.projectinfinity.kodi > runtime288/pid.txt
            test -s runtime288/pid.txt
            adb shell dumpsys package com.projectinfinity.kodi > runtime288/package.txt
            grep -q 'versionCode=2103288' runtime288/package.txt
            adb shell uiautomator dump /sdcard/health-ui.xml >/dev/null || true
            adb pull /sdcard/health-ui.xml runtime288/chooser-ui.xml >/dev/null || true
            printf '%s\n' \
              'PASS: 2103285 -> 2103288 update-over-install and chooser launch.' \
              'The Responsive/Fold trace itself requires physical-device reproduction; emulator launch is not Fold acceptance.' \
              > runtime288/SUMMARY.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103288-Update-Smoke-Evidence
          path: runtime288/
          if-no-files-found: warn
          retention-days: 90
