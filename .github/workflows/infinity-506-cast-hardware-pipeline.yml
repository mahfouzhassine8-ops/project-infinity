name: Infinity506 Cast hardware pipeline selected JNI Android - no Kodi build
on:
  push:
    branches: [work/infinity-2103506-receiver-compatibility-20261117, work/infinity-2103508-cast-source-reader-20261117, work/infinity-2103510-cast-dual-failure-20261117, work/infinity-2103512-cast-reliability-20261117]
    paths: [repairs/infinity-cast-hardware-pipeline-2103506-20261117/CI-PIPELINE.json, repairs/infinity-cast-source-reader-2103508-20261117/CI-PIPELINE.json, repairs/infinity-cast-source-reader-2103508-20261117/CI-RECOVERY.json, repairs/infinity-cast-dual-failure-2103510-20261117/CI-PIPELINE.json, repairs/infinity-cast-reliability-2103512-20261117/CI-PIPELINE.json]
permissions: {contents: read, actions: read}
concurrency: {group: infinity506-cast-hardware-pipeline, cancel-in-progress: false}
jobs:
  cast-hardware-pipeline:
    if: github.repository == 'mahfouzhassine8-ops/project-infinity' && github.ref == 'refs/heads/work/infinity-2103506-receiver-compatibility-20261117'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env: {PYTHONDONTWRITEBYTECODE: '1', GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;21.4.7075529', log-accepted-android-sdk-licenses: false}
      - name: Compile changed Cast JNI only; reuse authenticated506 Kodi engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python repairs/infinity-cast-hardware-pipeline-2103506-20261117/build_pipeline.py
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '36'
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 8G
          avd-name: infinity506-selected-video-pipeline
          emulator-options: -no-window -memory 4096 -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python repairs/infinity-cast-hardware-pipeline-2103506-20261117/run_pipeline.py
      - name: Require actual pipeline result independently of emulator action
        if: always()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('cast506-pipeline-results/RESULT.json'))
          assert r['pass'] is True and r['status']=='PASS_ACTUAL_ARM64_MEDIACODEC_EGL_PIPELINE',r
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Infinity506-MediaCodec-Pipeline-${{ github.run_id }}-EVIDENCE-ONLY
          path: |
            cast506-pipeline-results/
            cast506-pipeline-work/BUILD.json
            cast506-pipeline-work/ARM64.json
            cast506-pipeline-work/fixtures/
            cast506-pipeline-work/native-verification/native/libinfinitycastremux.so
          if-no-files-found: warn
          retention-days: 90

  source-reader:
    if: github.repository == 'mahfouzhassine8-ops/project-infinity' && github.ref == 'refs/heads/work/infinity-2103508-cast-source-reader-20261117' && !startsWith(github.event.head_commit.message, 'Cast508 recover:')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env: {PYTHONDONTWRITEBYTECODE: '1', GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;21.4.7075529', log-accepted-android-sdk-licenses: false}
      - name: Compile changed Cast JNI only; reuse authenticated506 Kodi engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python repairs/infinity-cast-source-reader-2103508-20261117/build_android.py
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '36'
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 8G
          avd-name: infinity508-selected-source-reader
          emulator-options: -no-window -memory 4096 -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
