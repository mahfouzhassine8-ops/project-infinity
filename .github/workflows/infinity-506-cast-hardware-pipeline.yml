          retention-days: 90

  source-reader-evidence-recovery:
    if: github.repository == 'mahfouzhassine8-ops/project-infinity' && github.ref == 'refs/heads/work/infinity-2103508-cast-source-reader-20261117' && startsWith(github.event.head_commit.message, 'Cast508 recover:')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env: {PYTHONDONTWRITEBYTECODE: '1', GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - name: Authenticate original failed transport and verify actual complete functional/media evidence
        run: |
          sudo apt-get update -qq
