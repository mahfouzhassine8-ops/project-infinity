          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Infinity508-Cast-Source-Reader-${{ github.run_id }}-EVIDENCE-ONLY
          path: |
            cast508-reader-results/
