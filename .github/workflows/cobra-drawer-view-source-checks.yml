name: Cobra | Drawer View selector source checks
on:
  push:
    branches: [infinity-cobra-drawer-view-selector-20260917]
    paths:
      - 'repairs/cobra-drawer-view/**'
      - '.github/workflows/cobra-drawer-view-source-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve and verify the exact passing 2103157 source evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/mahfouzhassine8-ops/project-infinity/actions/artifacts/10488040953/zip > baseline-evidence.zip
          echo 'bdb4d9317b8062eebaba6644dbd4c130e829ccad21c9713fb9539e303d59bd06  baseline-evidence.zip' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('baseline-evidence.zip') as archive:
              Path('baseline.java.in').write_bytes(archive.read('audit157/host/InfinityLiveActivity.java.in'))
          PY
      - name: Exact-byte guards and executable host callbacks (not Android/device tests)
        run: python3 repairs/cobra-drawer-view/tests/run.py --baseline baseline.java.in
      - name: Prepare separate candidate source and source rollback (no APK build)
        run: |
          python3 repairs/cobra-drawer-view/apply.py \
            --input baseline.java.in \
            --output drawer-output/candidate/InfinityLiveActivity.java.in \
            --rollback drawer-output/source-rollback
          cp repairs/cobra-drawer-view/README.md drawer-output/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: Cobra-Drawer-View-SOURCE-ONLY-NOT-AN-APK
          path: drawer-output/
          if-no-files-found: error
          retention-days: 90
