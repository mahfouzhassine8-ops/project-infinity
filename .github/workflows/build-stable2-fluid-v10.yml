name: Infinity Stable 2 Fluid v12

on:
  push:
    paths:
      - '.github/workflows/build-stable2-fluid-v10.yml'
      - 'tools/patch_player_ui_v2.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;34.0.0 platform-tools'
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends unzip curl
          curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
      - name: Download Stable 2 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9985837121/zip -o /tmp/base.zip
          mkdir -p /tmp/base
          unzip -q /tmp/base.zip -d /tmp/base
          APK=$(find /tmp/base -name '*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" /tmp/base.apk
      - name: Decode Stable 2
        run: java -jar /tmp/apktool.jar d -f /tmp/base.apk -o /tmp/decoded
      - name: Apply fluid volume polish
        run: python3 tools/patch_player_ui_v2.py
      - name: Verify v12 timed return patch
        run: |
          set -euo pipefail
          OSD=/tmp/decoded/assets/addons/skin.estuary/xml/VideoOSD.xml
          grep -q 'Infinity volume fluid polish v12' "$OSD"
          grep -q 'end="118,128"' "$OSD"
          grep -q 'delay="220"' "$OSD"
          grep -q 'start="118,128" end="100"' "$OSD"
          if grep -q 'Control.HasFocus(8802)' "$OSD"; then
            echo 'Sticky focus dependency still present'
            exit 1
          fi
      - name: Rebuild
        run: java -jar /tmp/apktool.jar b /tmp/decoded -o /tmp/Infinity-Stable2-FluidVolume-v12-unsigned.apk
      - name: Sign
        env:
          PASS: infinity${{ github.run_id }}${{ github.run_attempt }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          keytool -genkeypair -keystore /tmp/infinity.keystore -alias infinity -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Infinity Stable 2, O=Infinity, C=US" >/dev/null 2>&1
          "$BT/zipalign" -f 4 /tmp/Infinity-Stable2-FluidVolume-v12-unsigned.apk /tmp/Infinity-Stable2-FluidVolume-v12-aligned.apk
          "$BT/apksigner" sign --ks /tmp/infinity.keystore --ks-key-alias infinity --ks-pass env:PASS --key-pass env:PASS --out /tmp/Infinity-Stable2-FluidVolume-v12.apk /tmp/Infinity-Stable2-FluidVolume-v12-aligned.apk
          "$BT/apksigner" verify --verbose /tmp/Infinity-Stable2-FluidVolume-v12.apk
      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-Stable2-FluidVolume-v12
          path: /tmp/Infinity-Stable2-FluidVolume-v12.apk
          retention-days: 30
