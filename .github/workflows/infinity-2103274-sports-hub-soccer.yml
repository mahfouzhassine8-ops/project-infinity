name: Infinity | 2103274 Cobra Sports Hub Soccer RC1
on:
  workflow_dispatch:
  push:
    branches: [infinity-cobra-2103274-sports-hub-soccer-rc1]
    paths: ['.github/workflows/infinity-2103274-sports-hub-soccer.yml', 'repairs/sports-hub-soccer-2103274/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: sports-hub-soccer-${{ github.sha }}
  cancel-in-progress: false
env:
  NDK_VER: 21.4.7075529
  KODI_ANDROID_KEY_ALIAS: androiddebugkey
  KODI_ANDROID_KEY_PASSWORD: android
  KODI_ANDROID_STORE_PASSWORD: android
jobs:
  android-sports-hub-soccer-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103273-Pro-Sports-Soccer-RC1-TEST-CANDIDATE
          run-id: 36770912528
          github-token: ${{ github.token }}
          path: parent273
      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103273-Pro-Sports-Soccer-RC1-Evidence
          run-id: 36770912528
          github-token: ${{ github.token }}
          path: source273
      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103271-Sports-Data-RC1-Evidence
          run-id: 36759239156
          github-token: ${{ github.token }}
          path: source271
      - name: Verify exact locked 2103273 rollback and reconstruct source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          apk=Path('parent273/Infinity-2103273-Pro-Sports-Soccer-RC1.apk')
          src=Path('source273/reconstructed-2103273-shell.tar.gz')
          assert hashlib.sha256(apk.read_bytes()).hexdigest()=='0f35b65e3eb8c92e1966c8116bbccb3a55d09e368d1b59db02e9c8828d15dc3f'
          assert hashlib.sha256(src.read_bytes()).hexdigest()=='e6b507b2ab0e77289157d43ac62840a777937b381deb9462c2758e404b42740b'
          with zipfile.ZipFile(apk) as z:
            Path('engine').mkdir(exist_ok=True)
            Path('engine/libinfinitycrash.so').write_bytes(z.read('lib/arm64-v8a/libinfinitycrash.so'))
          PY
          tar --no-same-owner -xzf source273/reconstructed-2103273-shell.tar.gz
          mkdir -p rollback273/engine rollback273/scripts audit274
          cp -a shell-kodi rollback273/
          cp engine/background-resume-source.json rollback273/engine/
          cp scripts/package_background_resume.py scripts/infinity_background_resume.py rollback273/scripts/
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          activity=Path('shell-kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in')
          pro=Path('shell-kodi/tools/android/packaging/xbmc/src/CobraProUi.java.in')
          assert hashlib.sha256(activity.read_bytes()).hexdigest()=='5bb21ec202221394f150ee62f7cb28d35dbc03c0cee7b47bf152ad0fd063832d'
          assert hashlib.sha256(pro.read_bytes()).hexdigest()=='2ef9662b7cf2cb6b52ba686d6b04b37da9098a893393630ff5bc0720ef66d945'
          print('PASS: exact locked 2103273 source reconstructed.')
          PY
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0' "ndk;$NDK_VER" >/dev/null
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          echo "KODI_ANDROID_STORE_FILE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
      - name: Apply bounded main Sports Hub Soccer visibility pass
        run: |
          set -euo pipefail
          python3 repairs/sports-hub-soccer-2103274/apply.py --root . --out audit274
          python3 repairs/sports-hub-soccer-2103274/verify_source.py --baseline rollback273 --root . --out audit274
      - name: Compile and permanently sign one forward APK
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 scripts/package_background_resume.py --source shell-kodi --base-apk parent273/Infinity-2103273-Pro-Sports-Soccer-RC1.apk --build-dir build274 --out signed274 2>&1 | tee audit274/android-build.log
      - name: Stage Soccer Hub tests and locked regressions
        run: |
          set -euo pipefail
          rm -rf source267 source265
          mkdir -p source267 source265
          cp -a source271/staged-tests source267/staged-tests
          cp -a source271/screenshots source265/screenshots
          python3 repairs/sports-hub-soccer-2103274/stage_tests.py --build build274 --evidence audit274/screenshots --inherited
          cd build274
          ./gradlew --no-daemon --console=plain :xbmc:testReleaseUnitTest             --tests '*SportsHubSoccerVisibilityTest' --tests '*ProSportsIntegrationTest' --tests '*SportsDataRepairTest' --tests '*SportsHubTest'             --tests '*ProVisualTest' --tests '*ProActionsTest' --tests '*ResponsiveWindowTest' --tests '*Cobra2103268ProductAuditTest'             --tests '*Cobra2103201ScrubberTest' --tests '*Cobra2103201SubtitleTest' --tests '*Cobra2103201MenuPolishTest'             --tests '*Cobra2103202LifecycleTest' --tests '*Cobra2103203PipControlsTest' --tests '*Cobra2103206MediaCallsTest'             --tests '*Cobra2103207CallIntegrationTest' --tests '*Cobra2103207AudioStateTest' --tests '*Cobra2103203SubtitleClarityTest'             --tests '*Cobra2103229MultiViewStabilityFillTest' --tests '*GlassChooserTest' --tests '*GlassOptionsTest'             --tests '*GlassHealthFinishTest' --tests '*RecoveryFixedTest' --tests '*PhoneGlassTest' --tests '*AmbientGlassTest'             --tests '*Cobra2103267PlayingDotRestoreTest'             2>&1 | tee ../audit274/android-product-tests.log
      - name: Candidate acceptance and protected-payload gate
        run: |
          set -euo pipefail
          python3 repairs/sports-hub-soccer-2103274/verify_source.py --baseline rollback273 --root . --out audit274
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,xml.etree.ElementTree as E
          files=list(Path('build274/xbmc/build/test-results/testReleaseUnitTest').glob('TEST-*.xml'));assert len(files)==25,len(files)
          counts={}
          for f in files:
            t=E.parse(f).getroot();assert all(int(t.attrib.get(k,0))==0 for k in ['failures','errors','skipped']),(f,t.attrib);counts[t.attrib['name']]=int(t.attrib['tests'])
          assert counts['com.projectinfinity.kodi.SportsHubSoccerVisibilityTest']==4,counts
          assert counts['com.projectinfinity.kodi.ProSportsIntegrationTest']==8,counts
          assert counts['com.projectinfinity.kodi.SportsDataRepairTest']==4 and counts['com.projectinfinity.kodi.SportsHubTest']==6,counts
          assert counts['com.projectinfinity.kodi.ProVisualTest']==17 and counts['com.projectinfinity.kodi.ProActionsTest']==5,counts
          assert sum(counts.values())==233,counts
          locked=Path('source273/screenshots/protected');current=Path('audit274/screenshots/protected');names=sorted(p.name for p in locked.glob('*.png'));assert len(names)==20,len(names)
          for name in names:assert (locked/name).read_bytes()==(current/name).read_bytes(),'Protected locked render changed: '+name
          report=json.loads(Path('signed274/background-resume-apk-audit.json').read_text());report.update(test_methods=counts,automated_tests_passed=sum(counts.values()),protected_render_equality=len(names),sports_hub_soccer_section=True,sports_hub_soccer_permanent=True,sports_hub_soccer_league_directory=True,pro_sports_preserved=True,sports_repository_preserved=True,sports_channel_resolver_preserved=True,manual_multiview_preserved=True,physical_device_verified=False,update_over_install_device_verified=False,candidate_locked=False,status='AUTOMATED SPORTS HUB SOCCER TEST CANDIDATE — PASS; physical-device acceptance required')
          Path('signed274/CANDIDATE-VERIFICATION.json').write_text(json.dumps(report,indent=2)+'\n')
          apk=Path('signed274/Infinity-2103274-Sports-Hub-Soccer-RC1.apk');Path('signed274/SHA256SUMS.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'  '+apk.name+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Preserve implementation tests renders and rollback manifest
        if: always()
        run: |
          mkdir -p audit274/repair-source
          cp -r repairs/sports-hub-soccer-2103274/* audit274/repair-source/
          cp -r build274/xbmc/build/test-results audit274/candidate-test-results || true
          cp -r build274/xbmc/src/test audit274/staged-tests || true
          tar -czf audit274/reconstructed-2103274-shell.tar.gz shell-kodi engine/background-resume-source.json scripts/package_background_resume.py scripts/infinity_background_resume.py
          cp repairs/sports-hub-soccer-2103274/ACCEPTANCE.md audit274/
          cp repairs/sports-hub-soccer-2103274/DEVICE-TEST.md audit274/
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103274-Sports-Hub-Soccer-RC1-TEST-CANDIDATE
          path: signed274/
          compression-level: 0
          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103274-Sports-Hub-Soccer-RC1-Evidence
          path: audit274/
          retention-days: 90
