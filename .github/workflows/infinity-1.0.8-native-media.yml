name: Infinity 1.0.8 | Native Media Platform Hook

on:
  workflow_dispatch:
  push:
    branches: [infinity-1.0.8-native-media]
    paths:
      - '.github/workflows/infinity-1.0.8-native-media.yml'
      - 'scripts/infinity_1_0_8_media_source.py'
      - 'scripts/validate_infinity_native_media.py'
      - 'patches/infinity-media/**'

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Apply exact 1.0.8 stack plus native media hook
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' >/dev/null
          git clone --depth 1 --branch 21.3-Omega https://github.com/xbmc/xbmc.git kodi
          test "$(git -C kodi rev-parse HEAD)" = a3a448d26b8d560a65655dab2cd122994dc4e146
          python3 scripts/infinity71.py source --source kodi
          mkdir -p preflight
          python3 scripts/infinity_1_0_6_source.py kodi --receipt preflight/source-1.0.6.json
          python3 scripts/infinity_1_0_7_compat_source.py kodi --receipt preflight/source-1.0.7.json
          python3 scripts/infinity_diagnostics_source.py kodi --receipt preflight/exit-diagnostics.json
          python3 scripts/infinity_1_0_8_refresh_source.py kodi --receipt preflight/source-1.0.8.json
          python3 scripts/infinity_1_0_8_media_source.py kodi --receipt preflight/source-native-media.json
          git -C kodi diff --check
          grep -F 'versionCode 2103109' kodi/tools/android/packaging/xbmc/build.gradle.in
          grep -F 'versionName "21.3-Infinity-1.0.8-Native-Media"' kodi/tools/android/packaging/xbmc/build.gradle.in
          grep -F 'InfinityPlatformHooks.onPlaybackState' kodi/tools/android/packaging/xbmc/src/XBMCMediaSession.java.in
          grep -F 'src/InfinitySystemMediaHook.java' kodi/cmake/scripts/android/Install.cmake
      - name: Compile Android media hook against API 34
        run: |
          set -euo pipefail
          python3 scripts/validate_infinity_native_media.py \
            --source kodi \
            --android-jar "$ANDROID_HOME/platforms/android-34/android.jar" \
            --out preflight/media-java
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-1.0.8-Native-Media-Preflight
          path: preflight/
          if-no-files-found: warn
          retention-days: 30

  build:
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      NDK_VER: 21.4.7075529
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Prepare Android/Kodi toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf bison build-essential curl flex gawk git gperf lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev unzip zip zlib1g-dev ccache python3 nasm yasm
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' "ndk;$NDK_VER"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi
      - name: Clone Kodi and apply complete Infinity source stack
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 21.3-Omega https://github.com/xbmc/xbmc.git kodi
          test "$(git -C kodi rev-parse HEAD)" = a3a448d26b8d560a65655dab2cd122994dc4e146
          python3 scripts/infinity71.py source --source kodi
          mkdir -p engine
          python3 scripts/infinity_1_0_6_source.py kodi --receipt engine/source-1.0.6.json
          python3 scripts/infinity_1_0_7_compat_source.py kodi --receipt engine/source-1.0.7.json
          python3 scripts/infinity_diagnostics_source.py kodi --receipt engine/exit-diagnostics.json
          python3 scripts/infinity_1_0_8_refresh_source.py kodi --receipt engine/source-1.0.8.json
          python3 scripts/infinity_1_0_8_media_source.py kodi --receipt engine/source-native-media.json
          python3 scripts/validate_infinity_native_media.py \
            --source kodi \
            --android-jar "$ANDROID_HOME/platforms/android-34/android.jar" \
            --out engine/media-java
      - uses: actions/cache/restore@v4
        id: deps-cache
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            ~/.ccache
          key: infinity-71-audited-deps-21.3-arm64-${{ runner.os }}-${{ hashFiles('patches/infinity-7.1-audited/contract.json') }}
          restore-keys: |
            infinity-71-audited-deps-21.3-arm64-${{ runner.os }}-
            infinity-7.1-uniform-g-21.3-arm64-${{ runner.os }}-
      - name: Prepare matched dependencies
        id: depends
        run: |
          set -euo pipefail
          mkdir -p "$TARBALLS" "$DEPENDS" "$BUILD_DIR"
          cd kodi/tools/depends
          ./bootstrap
          ./configure --with-tarballs="$TARBALLS" --host=aarch64-linux-android \
            --with-sdk-path="$ANDROID_HOME" --with-ndk-path="$ANDROID_HOME/ndk/$NDK_VER" \
            --prefix="$DEPENDS" --enable-debug=yes
          make -j"$(nproc)"
          make -C target/cmakebuildsys BUILD_DIR="$BUILD_DIR"
      - name: Configure and validate matched native source
        run: |
          set -euo pipefail
          CMAKE_BIN=$(sed -n 's/^CMAKE_COMMAND:INTERNAL=//p' "$BUILD_DIR/CMakeCache.txt")
          test -x "$CMAKE_BIN"
          "$CMAKE_BIN" -S "$PWD/kodi" -B "$BUILD_DIR" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          python3 scripts/infinity71.py native-check --build-dir "$BUILD_DIR"
      - name: Build matched 1.0.8 native media engine and APK
        run: |
          set -euo pipefail
          make -C "$BUILD_DIR" -j"$(nproc)"
          make -C "$BUILD_DIR" apk -j"$(nproc)"
          APK=$(find kodi "$BUILD_DIR" -type f -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" engine/Infinity-1.0.8-Native-Media-Engine-Base.apk
          python3 scripts/infinity71.py record-engine \
            --apk engine/Infinity-1.0.8-Native-Media-Engine-Base.apk \
            --output engine/engine.json --source-commit "$GITHUB_SHA"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging \
            engine/Infinity-1.0.8-Native-Media-Engine-Base.apk | tee engine/badging.txt
          grep -q "package: name='com.projectinfinity.kodi' versionCode='2103109'" engine/badging.txt
      - name: Build presentation and inject current Infinity upper layer
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          mkdir -p candidate
          python3 scripts/infinity71.py overlay \
            --apk engine/Infinity-1.0.8-Native-Media-Engine-Base.apk \
            --manifest engine/engine.json --output candidate/locked-unsigned.apk
          python3 scripts/infinity_1_0_6_presentation_fix.py \
            candidate/locked-unsigned.apk candidate/presentation-unsigned.apk \
            candidate/presentation-1.0.6.json
          python3 scripts/infinity_compat_palette.py \
            candidate/presentation-unsigned.apk candidate/palette-unsigned.apk \
            --receipt candidate/palette.json
          python3 scripts/infinity_1_0_7_compat_package.py \
            candidate/palette-unsigned.apk candidate/compat-unsigned.apk \
            --receipt candidate/compat-package.json
          python3 scripts/infinity_upper_layer_repack.py \
            candidate/compat-unsigned.apk candidate/Infinity-1.0.8-Native-Media-Update-unsigned.apk
      - name: Permanently sign update and verify identity
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in INFINITY_KEYSTORE_B64 INFINITY_STORE_PASSWORD INFINITY_KEY_PASSWORD INFINITY_KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then echo "Missing permanent signing secret: $name" >&2; exit 2; fi
          done
          bash scripts/sign-infinity71.sh \
            candidate/Infinity-1.0.8-Native-Media-Update-unsigned.apk \
            candidate/Infinity-1.0.8-Native-Media-Update.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs \
            candidate/Infinity-1.0.8-Native-Media-Update.apk | tee candidate/signing-verification.txt
          grep -qi 'd7adeb68e9341596a02bd3262b737a0f45fc6e771ed7e60285437e833b58c6d7' \
            candidate/signing-verification.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging \
            candidate/Infinity-1.0.8-Native-Media-Update.apk | tee candidate/badging.txt
          grep -q "package: name='com.projectinfinity.kodi' versionCode='2103109'" candidate/badging.txt
      - name: Final native media + current hook gates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, zipfile, xml.etree.ElementTree as ET
          apk='candidate/Infinity-1.0.8-Native-Media-Update.apk'
          required=[
            'assets/addons/service.infinity.compat/addon.xml',
            'assets/addons/service.infinity.compat/theme_contract.py',
            'assets/addons/service.infinity.compat/layout_service.py',
            'assets/addons/service.infinity.compat/resources/xml/VideoOSD.xml',
            'assets/addons/service.infinity.compat/resources/xml/Custom_1197_InfinityPlayerPanel.xml',
            'assets/addons/service.infinity.refresh/addon.xml',
          ]
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              missing=[n for n in required if n not in names]
              assert not missing, missing
              for xml in ('assets/addons/service.infinity.compat/addon.xml',
                          'assets/addons/service.infinity.compat/resources/xml/VideoOSD.xml',
                          'assets/addons/service.infinity.compat/resources/xml/Custom_1197_InfinityPlayerPanel.xml'):
                  ET.fromstring(z.read(xml))
              dex=b''.join(z.read(n) for n in z.namelist() if re.fullmatch(r'classes\d*\.dex', n))
              for needle in (b'InfinityPlatformHooks', b'InfinitySystemMediaHook',
                             b'com.projectinfinity.platform_hook_api', b'infinity_media_playback'):
                  assert needle in dex, needle
          receipt=json.load(open('engine/source-native-media.json'))
          assert receipt['versionCode']==2103109
          assert receipt['platform_hook_api']==1
          assert receipt['single_media_session'] is True
          assert receipt['samsung_private_api'] is False
          assert receipt['device_tested'] is False
          print('PASS: signed update contains Platform Hook API 1, native system-media integration and current Infinity upper layer.')
          print('Real Samsung One UI / lock-screen / Bluetooth / PiP behavior remains a device-test gate.')
          PY
          cp engine/source-1.0.6.json candidate/
          cp engine/source-1.0.7.json candidate/
          cp engine/source-1.0.8.json candidate/
          cp engine/source-native-media.json candidate/
          cp engine/exit-diagnostics.json candidate/
          cp engine/engine.json candidate/
      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-1.0.8-Native-Media-Update
          path: |
            candidate/Infinity-1.0.8-Native-Media-Update.apk
            candidate/Infinity-1.0.8-Native-Media-Update.sha256
            candidate/Infinity-1.0.8-Native-Media-Update.signing.txt
            candidate/signing-verification.txt
            candidate/badging.txt
            candidate/source-1.0.6.json
            candidate/source-1.0.7.json
            candidate/source-1.0.8.json
            candidate/source-native-media.json
            candidate/exit-diagnostics.json
            candidate/presentation-1.0.6.json
            candidate/palette.json
            candidate/compat-package.json
            candidate/engine.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-1.0.8-Native-Media-Engine
          path: |
            engine/Infinity-1.0.8-Native-Media-Engine-Base.apk
            engine/engine.json
            engine/source-native-media.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - uses: actions/cache/save@v4
        if: always() && steps.depends.conclusion == 'success' && steps.deps-cache.outputs.cache-hit != 'true'
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            ~/.ccache
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}
