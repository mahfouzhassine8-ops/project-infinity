name: Infinity | 2103282 native video ambient candidate
on:
  workflow_dispatch:
  push:
    branches: [candidate-infinity-native-video-ambient-from-2103281]
    paths: ['repairs/infinity-native-ambient-2103282/**', '.github/workflows/infinity-native-ambient-2103282.yml']
permissions: {contents: read, actions: read}
concurrency:
  group: infinity-native-ambient-${{ github.ref }}
  cancel-in-progress: true
env:
  NDK_VER: 21.4.7075529
  KODI_ANDROID_KEY_ALIAS: androiddebugkey
  KODI_ANDROID_KEY_PASSWORD: android
  KODI_ANDROID_STORE_PASSWORD: android
jobs:
  build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: actions/download-artifact@v8
        with:
          name: Cobra-2103281-Remaining-Repair-Evidence
          run-id: 36823023157
          github-token: ${{ github.token }}
          path: evidence281
      - uses: actions/download-artifact@v8
        with:
          name: Cobra-2103281-Remaining-Repair-Candidate
          run-id: 36823023157
          github-token: ${{ github.token }}
          path: locked281
      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103279-End-to-End-Repair-RC1-Evidence
          run-id: 36810766190
          github-token: ${{ github.token }}
          path: evidence279
      - name: Verify exact authorized parent and reconstruct its source
        run: |
          set -euo pipefail
          mkdir -p audit282
          git branch rollback-2103281 bf9e70d68f696fae156c9f33dedf1224c37d7137
          git bundle create audit282/locked-2103281-rollback.bundle rollback-2103281
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,tarfile,zipfile,shutil
          archive=Path('evidence281/reconstructed-2103281-shell.tar.gz');apk=Path('locked281/Infinity-2103281-Remaining-Audit-RC1.apk')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='01a15f32fd2e4f3961dbf0a565bb55f14a9d7d802b55d3937bc30cee477c3de3'
          assert hashlib.sha256(apk.read_bytes()).hexdigest()=='4c119343d623be5c15233e7b1ed7fa82e3d1f92c3a5ec56f7d3f85b0707cbfe5'
          with tarfile.open(archive) as t:t.extractall('.',filter='data')
          shutil.copytree('shell-kodi','rollback281/shell-kodi')
          with zipfile.ZipFile(apk) as z:Path('engine/libinfinitycrash.so').write_bytes(z.read('lib/arm64-v8a/libinfinitycrash.so'))
          PY
          python3 repairs/infinity-native-ambient-2103282/apply.py
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0' "ndk;$NDK_VER" >/dev/null
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          echo "KODI_ANDROID_STORE_FILE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
      - name: Build presentation library and test directional output
        run: |
          set -euo pipefail
          python3 -m pip install pillow
          c++ -std=c++17 -O2 -fPIC -shared repairs/infinity-native-ambient-2103282/ambient.cpp -lz -o engine/libinfinityambient-host.so
          python3 repairs/infinity-native-ambient-2103282/test_native.py -v 2>&1 | tee audit282/native-tests.txt
          "$ANDROID_HOME/ndk/$NDK_VER/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++" -std=c++17 -O2 -fPIC -shared -static-libstdc++ -Wl,--no-undefined -Wl,-z,max-page-size=16384 repairs/infinity-native-ambient-2103282/ambient.cpp -lz -o engine/libinfinityambient.so
          readelf -h -l -d -Ws engine/libinfinityambient.so > audit282/native-elf.txt
          python3 repairs/infinity-native-ambient-2103282/test_observer.py -v 2>&1 | tee audit282/observer-tests.txt
      - name: Compile Android and permanently sign forward APK
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 scripts/package_background_resume.py --source shell-kodi --base-apk locked281/Infinity-2103281-Remaining-Audit-RC1.apk --build-dir build282 --out candidate282
          python3 repairs/infinity-native-ambient-2103282/stage.py runtime
          (cd build282 && ./gradlew --no-daemon --console=plain :xbmc:assembleReleaseAndroidTest)
          mkdir -p instrumentation
          testapk=$(find build282/xbmc/build/outputs/apk/androidTest -name '*.apk' | head -1)
          bash scripts/sign-infinity71.sh "$testapk" instrumentation/Cobra-preservation-tests.apk
      - name: Run unchanged Cobra regression suites and ambient gate checks
        run: |
          python3 repairs/infinity-native-ambient-2103282/stage.py unit
          python3 - <<'PY'
          import subprocess,json
          from pathlib import Path
          classes=json.loads(Path('audit282/test-classes.json').read_text())
          args=['./gradlew','--no-daemon','--console=plain',':xbmc:testReleaseUnitTest']
          for name in classes:args+=['--tests',name]
          subprocess.run(args,cwd='build282',check=True)
          PY
      - name: Enforce exact Cobra source and rendered preservation
        run: python3 repairs/infinity-native-ambient-2103282/verify_android.py
      - uses: actions/upload-artifact@v7
        with: {name: Infinity-2103282-Native-Ambient-Candidate, path: candidate282/, retention-days: 90}
      - uses: actions/upload-artifact@v7
        with: {name: Infinity-2103282-Preservation-Instrumentation, path: instrumentation/, retention-days: 90}
      - name: Archive exact source and regression evidence
        if: always()
        run: |
          mkdir -p audit282
          cp -r build282/xbmc/build/test-results audit282/test-results || true
          tar -czf audit282/reconstructed-2103282-shell.tar.gz shell-kodi engine/background-resume-source.json engine/libinfinityambient.so scripts/package_background_resume.py scripts/infinity_background_resume.py repairs/infinity-native-ambient-2103282
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: Infinity-2103282-Native-Ambient-Evidence, path: audit282/, retention-days: 90}
  runtime:
    needs: build-test
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: {name: Infinity-2103282-Native-Ambient-Candidate, path: candidate282}
      - uses: actions/download-artifact@v8
        with: {name: Infinity-2103282-Preservation-Instrumentation, path: instrumentation}
      - uses: actions/download-artifact@v8
        with:
          name: Cobra-2103281-Remaining-Repair-Candidate
          run-id: 36823023157
          github-token: ${{ github.token }}
          path: locked281
      - name: Start deterministic regression provider
        run: |
          sudo chmod 666 /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 repairs/remaining-audit-2103281/media.py
          python3 repairs/end-to-end-2103279/runtime_server.py > runtime-http.log 2>&1 &
          python3 repairs/infinity-native-ambient-2103282/stage.py runner
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash runtime282.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: Infinity-2103282-Cobra-Update-Runtime-Evidence, path: remaining-runtime/, retention-days: 90}
