      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'build-tools;35.0.0', log-accepted-android-sdk-licenses: false}
      - name: Publish only independently reviewed original-signed install-tested pair
        run: python repairs/infinity-cast-source-reader-2103508-20261117/release/publish.py
