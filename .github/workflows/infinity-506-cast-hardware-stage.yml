          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '36'
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 8G
          avd-name: infinity508-cast-reader-install-only
          disable-animations: false
          emulator-options: -no-window -memory 4096 -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python repairs/infinity-cast-source-reader-2103508-20261117/release/install.py run
      - name: Independently require install-over receipt
        if: always()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('cast-final-install-results/INSTALL-OVER-AND-RECOVERY.json'))
          assert r['status']=='PASS_ACTUAL_ANDROID_IN_PLACE_INSTALL_AND_FORWARD_RECOVERY',r
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Infinity508-Cast-Source-Reader-Signed-Install-${{ github.run_id }}-EVIDENCE-ONLY
          path: cast-final-install-results/
          if-no-files-found: warn
          retention-days: 90
  source-reader-publish:
    if: startsWith(github.event.head_commit.message, 'Cast508 publish:')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions: {contents: write, actions: read}
    env: {PYTHONDONTWRITEBYTECODE: '1', GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
