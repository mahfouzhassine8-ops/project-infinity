name: Infinity506 Cast hardware exact unsigned staging - no rebuild
on:
  push:
    branches: [work/infinity-2103506-receiver-compatibility-20261117]
    paths: [repairs/infinity-cast-hardware-pipeline-2103506-20261117/release/STAGE-REQUEST.json]
permissions: {contents: read, actions: read}
concurrency: {group: infinity506-cast-hardware-stage, cancel-in-progress: false}
jobs:
  stage:
    if: github.repository == 'mahfouzhassine8-ops/project-infinity' && github.ref == 'refs/heads/work/infinity-2103506-receiver-compatibility-20261117'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env: {GH_TOKEN: '${{ github.token }}', PYTHONDONTWRITEBYTECODE: '1'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'build-tools;35.0.0', log-accepted-android-sdk-licenses: false}
      - name: Exact506 payload, compiled artifacts and genuine selected gate before staging
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python repairs/infinity-cast-hardware-pipeline-2103506-20261117/release/stage.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'Infinity506-Cast-Hardware-${{ github.run_id }}-UNSIGNED-NOT-INSTALLABLE', path: cast506-stage/, if-no-files-found: error, retention-days: 90, compression-level: 6}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Infinity506-Cast-Hardware-Staging-${{ github.run_id }}-RECEIPTS-ONLY
          path: |
            cast506-stage/STAGING.json
            cast506-stage/EXTERNAL-API.json
            cast506-stage/MEDIA.json
          if-no-files-found: warn
          retention-days: 90
