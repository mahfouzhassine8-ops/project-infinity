name: Infinity451 authorized touch objects only - no engine link APK or signing
on:
  workflow_dispatch:
  push:
    branches: [work/infinity-native-touch-from-2103451-20261105]
    paths:
      - repairs/infinity-native-touch-2103451-20261105/COMPILE-REQUEST.json
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-native-touch-451-objects-${{ github.ref }}
  cancel-in-progress: false
jobs:
  touch-objects:
    if: github.ref == 'refs/heads/work/infinity-native-touch-from-2103451-20261105'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      NDK_VER: '21.4.7075529'
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools build-tools;35.0.0 platforms;android-34'
          log-accepted-android-sdk-licenses: false
      - name: Verify exact authority immutable inputs and unchanged native producer
        run: python3 repairs/infinity-native-touch-2103451-20261105/compile_only.py metadata
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '13274901825'
          run-id: '41726452356'
          merge-multiple: true
          github-token: ${{ github.token }}
          path: verified-inputs
      - name: Restore exact frozen451 and apply only the reviewed touch patch
        run: python3 repairs/infinity-native-touch-2103451-20261105/compile_only.py restore
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11698374892'
          run-id: '38132105717'
          merge-multiple: true
          github-token: ${{ github.token }}
          path: dependency-transfer
      - name: Restore unchanged verified compiler dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y python3-yaml python3-dev libsqlite3-dev libssl-dev libffi-dev
          (cd dependency-transfer && sha256sum -c SHA256SUMS)
          tar --no-same-owner -xf dependency-transfer/verified-android-dependencies.tar
          tar --no-same-owner -xf dependency-transfer/verified-compiler-cache.tar -C "$HOME"
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-linux-21.4.7075529-v1
      - name: Restore unchanged pinned Android NDK
        run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - name: Compile only the two actual Android ARM64 touch translation units
        run: python3 repairs/infinity-native-touch-2103451-20261105/compile_only.py compile
      - name: Retain source and object evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity451-Touch-Objects-${{ github.run_id }}-NOT-APK
          path: |
            touch-compile-evidence/*.json
            touch-compile-evidence/configure-only.sh
          if-no-files-found: warn
          retention-days: 90
