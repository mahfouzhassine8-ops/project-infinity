name: Infinity | 2103221 Options UI + Owner Guard

on:
  workflow_dispatch:
  push:
    branches: [infinity-cobra-2103221-options-ui-owner-guard-rc1]
    paths:
      - '.github/workflows/infinity-2103221-options-ui-owner-guard.yml'
      - 'repairs/options-ui-owner-guard-2103221/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: infinity-2103221-\${{ github.sha }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools}

      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103208-Integration-Polish-TEST-CANDIDATE-Replica-1-Attempt-1
          run-id: 35676573761
          github-token: \${{ github.token }}
          path: baseline208

      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103209-Python311-GIL-Native-Engine
          run-id: 35693288744
          github-token: \${{ github.token }}
          path: native209

      - name: Reconstruct exact 2103220 source
        run: |
          set -euo pipefail
          mkdir -p audit221 engine
          python3 -m py_compile repairs/options-ui-owner-guard-2103221/apply.py repairs/options-ui-owner-guard-2103221/verify.py
          cp native209/pythoninvoker-threadstate-v2-source.json engine/pythoninvoker-threadstate-v2-source.json
          cp native209/pythoninvoker-threadstate-v2-source.stage1.json engine/pythoninvoker-threadstate-v2-source.stage1.json
          python3 repairs/python311-gil-2103209/ci.py prepare \
            --base-dir baseline208 \
            --native-apk native209/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2-Engine-Base.apk \
            --shell shell-kodi \
            --out audit221/base
          python3 repairs/cobra-media-library-health-2103210/apply.py --shell shell-kodi
          python3 repairs/cobra-library-health-2103211/apply.py --shell shell-kodi
          python3 repairs/health-media-trim-2103212/apply.py --shell shell-kodi
          python3 repairs/live-blue-ambient-settings-return-2103213/apply.py --shell shell-kodi
          python3 repairs/media-details-final-2103214/apply.py --shell shell-kodi
          python3 repairs/smart-return-experience-drawer-2103215/apply.py --shell shell-kodi
          python3 repairs/smart-return-experience-display-2103216/apply.py --shell shell-kodi
          python3 repairs/media-return-context-2103217/apply.py --shell shell-kodi
          python3 repairs/active-section-owner-2103219/apply.py --shell shell-kodi
          python3 repairs/active-section-lifecycle-2103220/apply.py --shell shell-kodi
          grep -F '"version_code": 2103220' engine/background-resume-source.json
          grep -F '"smart_return_untouched": true' engine/background-resume-source.json

      - name: Restore both option UIs and harden owner guard
        run: |
          set -euo pipefail
          python3 repairs/options-ui-owner-guard-2103221/apply.py --shell shell-kodi
          SPLASH=shell-kodi/tools/android/packaging/xbmc/src/Splash.java.in
          LIVE=shell-kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          grep -F 'experience-options-infinity' "$SPLASH"
          grep -F 'experience-options-cobra' "$SPLASH"
          grep -F 'experience-option-recovery' "$SPLASH"
          ! sed -n '/private void showExperienceCardSettings/,/^  }/p' "$SPLASH" | grep -F 'AlertDialog.Builder'
          grep -F '2103221 drawer-owner guard' "$LIVE"
          test "$(grep -Fc 'cobraSelectActiveSection(destination);' "$LIVE")" -eq 1
          grep -F '"version_code": 2103221' engine/background-resume-source.json

      - name: Build, sign and verify
        env:
          INFINITY_KEYSTORE_B64: \${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: \${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: \${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: \${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          python3 scripts/package_background_resume.py \
            --source shell-kodi \
            --base-apk audit221/base/Infinity-2103208-Python311-GIL-Patched-Base.apk \
            --build-dir build221 \
            --out signed221
          python3 repairs/options-ui-owner-guard-2103221/verify.py \
            --apk signed221/Infinity-1.0.9-Cobra-Options-UI-Owner-Guard-RC1.apk \
            --audit signed221/background-resume-apk-audit.json \
            --base audit221/base/Infinity-2103208-Python311-GIL-Patched-Base.apk \
            --source shell-kodi
          cat > signed221/DEVICE-TEST.txt <<'EOF'
          INFINITY 2103221 — DEVICE ACCEPTANCE

          OPTIONS UI
          1. Choose Your Experience -> Infinity gear:
             - must open a dark Infinity-styled panel, never a white stock Android dialog.
             - verify Remember & launch Infinity, Launch Infinity just this time,
               Ask every time, Infinity Health Center.
          2. Choose Your Experience -> Cobra gear:
             - must open a dark Cobra/Infinity-styled panel, never a white stock Android dialog.
             - verify Remember & launch Cobra, Launch Cobra just this time,
               Ask every time, Infinity Health Center, Cobra Recovery.
          3. Cobra Settings -> Experience & Display still owns Smart Return. It must NOT
             reappear in the chooser gear menu.

          ACTIVE SECTION
          4. Drawer -> Movies. Browse a title/See All if desired. Use Android native edge
             Back/swipe out, then return/reopen Cobra. It must return to Movies, not Live TV.
          5. Repeat with TV Shows. It must return to TV Shows.
          6. Select Live TV from the drawer. Only now may Live TV become the active section.
          7. Repeat with Recordings/My List where configured.
          8. Confirm See All/Genre Back remains inside Movies/TV Shows.

          REGRESSION
          - Playback, providers, timeshift/rewind, PiP/background, Health Center, blue Live TV
            Ambient, media details and native engine must remain unchanged.
          - Do not lock 2103221 until the two UI checks and Movies/TV Shows lifecycle checks pass.
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103221-Options-UI-Owner-Guard-TEST-CANDIDATE
          path: signed221/
          compression-level: 0
          retention-days: 90

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103221-Options-UI-Owner-Guard-Evidence
          path: |
            audit221/
            engine/background-resume-source.json
            repairs/options-ui-owner-guard-2103221/
            signed221/*.json
            signed221/*.txt
          if-no-files-found: warn
          retention-days: 90
