name: Infinity | 2103168 Status Bar + PythonInvoker Stability

on:
  workflow_dispatch:
  push:
    branches: [infinity-cobra-2103168-statusbar-pythoninvoker-stability-rc1]
    paths:
      - '.github/workflows/infinity-2103168-statusbar-pythoninvoker-stability.yml'
      - 'repairs/pythoninvoker-forwardport-2103168/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: infinity-2103168-${{ github.sha }}
  cancel-in-progress: false

env:
  NDK_VER: 21.4.7075529
  RUNTIME_COMMIT: b42760a25a27d23baa5db5770824cb8d32ec2290

jobs:
  package-and-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - name: Immutable reconstruction stack
        uses: actions/checkout@v5
        with:
          ref: cce2de3042cca22b531fa8ed9e13659c19dab8a4
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with: {ref: 4d1ed032df7e13fd27cc2170fc5e028f5059ec32, path: refinement-delta, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: b3bcb619b08205dcfc1451424b2d41e05fd37633, path: audit-delta, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: 7d95f8dd1696e340bde82cb73ce4e04a0bc2ac98, path: view-delta, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: fd2af59bab2edcaea6be9e5046720715e25e64e0, path: health-delta, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: 257a49d742890acf0c7d3e0220bded5a8aa80c57, path: experience-delta, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: 42b1afc95a07b3ce0f534232e0f774c5159ddec1, path: theme-delta, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: 0ff8b5463ae6adf26ef0f20d64bc1b10f6c5a593, path: settings-delta, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: 1465eabb045badad56142642c48292df94caaa12, path: candidate14-delta, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: 8f2c9c7b0fdd7bfcaa0d903f8df997a139c23261, path: next-delta, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: d9819b9823ff281f874daaa2bf91fdac1613aeb1, path: stability-delta, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: 6148e34be3024c5939c736a7b4316572d7bd50c0, path: insets-delta, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: 644160d0ca3baeebb6759638d3f40e2853eeed0b, path: audit166-delta, persist-credentials: false}
      - name: Exact 2103167 recipe
        uses: actions/checkout@v5
        with: {ref: 2d72c733998d3c535a16d354058344007c5f7921, path: status167-delta, persist-credentials: false}
      - name: Isolated 2103168 repair
        uses: actions/checkout@v5
        with: {ref: '${{ github.sha }}', path: repair168, persist-credentials: false}

      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools}

      - uses: actions/download-artifact@v5
        with: {name: Infinity-1.0.9-Cobra-Full-Feature-Candidate-2, run-id: 35044752997, github-token: '${{ github.token }}', path: run40}
      - uses: actions/download-artifact@v5
        with: {name: Infinity-Cobra-Player-Reboot-Lock-2103152, run-id: 35169846333, github-token: '${{ github.token }}', path: rollback2103152}
      - uses: actions/download-artifact@v5
        with: {name: Infinity-Cobra-Guide-Player-Refinement-2103153-Audited, run-id: 35176733529, github-token: '${{ github.token }}', path: rollback2103153}
      - uses: actions/download-artifact@v5
        with: {name: Infinity-Cobra-Adaptive-Views-EPG-Repair-RC1-2103155, run-id: 35188339917, github-token: '${{ github.token }}', path: baseline155}
      - uses: actions/download-artifact@v5
        with: {name: Infinity-Cobra-Diagnostics-Audit-RC1-2103156, run-id: 35192605567, github-token: '${{ github.token }}', path: baseline156}
      - uses: actions/download-artifact@v5
        with: {name: Infinity-Cobra-TV-Navigation-Appearance-RC1-2103157, run-id: 35200244871, github-token: '${{ github.token }}', path: baseline157}
      - uses: actions/download-artifact@v5
        with: {name: Infinity-Cobra-Health-Playback-RC1-2103158, run-id: 35206405387, github-token: '${{ github.token }}', path: baseline158}
      - uses: actions/download-artifact@v5
        with: {name: Cobra-2103158-Health-Playback-Evidence, run-id: 35206405387, github-token: '${{ github.token }}', path: evidence158}
      - uses: actions/download-artifact@v5
        with: {name: Infinity-Experience-Zip-Bridge-RC1-2103159, run-id: 35278026159, github-token: '${{ github.token }}', path: baseline159}
      - uses: actions/download-artifact@v5
        with:
          name: Cobra-2103160-Visual-Theme-Runtime-v2-TEST-CANDIDATE
          run-id: 35290503341
          github-token: ${{ github.token }}
          path: baseline160
      - uses: actions/download-artifact@v5
        with:
          name: Cobra-2103161-Theme-Management-Background-Mode-Safe-Area-TEST-CANDIDATE
          run-id: 35314694255
          github-token: ${{ github.token }}
          path: baseline161
      - uses: actions/download-artifact@v5
        with:
          name: Cobra-2103162-Theme-Switch-Player-Rotation-TEST-CANDIDATE
          run-id: 35324889607
          github-token: ${{ github.token }}
          path: baseline162
      - uses: actions/download-artifact@v5
        with:
          name: Cobra-2103162-Theme-Switch-Player-Rotation-TEST-CANDIDATE
          run-id: 35331099172
          github-token: ${{ github.token }}
          path: baseline163
      - uses: actions/download-artifact@v5
        with:
          name: Cobra-2103164-Playback-Stability-TEST-CANDIDATE
          run-id: 35338917341
          github-token: ${{ github.token }}
          path: baseline164
      - uses: actions/download-artifact@v5
        with:
          name: Cobra-2103165-Insets-PiP-Return-Player-Consistency-TEST-CANDIDATE
          run-id: 35343195748
          github-token: ${{ github.token }}
          path: baseline165
      - uses: actions/download-artifact@v5
        with:
          name: Cobra-2103166-End-to-End-UI-Lifecycle-Audit-TEST-CANDIDATE
          run-id: 35347847781
          github-token: ${{ github.token }}
          path: baseline166
      - name: Exact successful 2103167 APK
        uses: actions/download-artifact@v5
        with:
          name: Cobra-2103167-Status-Bar-Restore-TEST-CANDIDATE
          run-id: 35371132749
          github-token: ${{ github.token }}
          path: baseline167
      - name: Proven PythonInvoker native engine
        uses: actions/download-artifact@v5
        with:
          name: Infinity-2103164-PythonInvoker-Native-Engine
          run-id: 35349443743
          github-token: ${{ github.token }}
          path: native164

      - name: Reconstruct exact successful 2103167 source
        run: |
          set -euo pipefail
          python3 -m pip install pyyaml
          python3 theme-delta/repairs/cobra-theme-runtime-2103160/ci.py reconstruct
          python3 theme-delta/repairs/cobra-theme-runtime-2103160/ci.py apply
          python3 settings-delta/repairs/cobra-settings-background-2103161/ci.py upgrade
          python3 candidate14-delta/repairs/cobra-theme-rotation-2103162/ci.py upgrade
          python3 next-delta/repairs/cobra-candidate14-five-fixes-2103163/ci.py upgrade
          python3 stability-delta/repairs/cobra-playback-stability-2103164/ci.py upgrade
          python3 insets-delta/repairs/cobra-inner-insets-pip-return-2103165/ci.py upgrade
          python3 audit166-delta/repairs/cobra-end-to-end-audit-2103166/ci.py upgrade
          python3 status167-delta/repairs/cobra-status-bar-restore-2103167/ci.py upgrade
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          def sha(p):return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          expected=json.loads(Path('baseline167/background-resume-source.json').read_text())
          current=json.loads(Path('engine/background-resume-source.json').read_text())
          assert expected['version_code']==current['version_code']==2103167
          assert expected['files'].keys()==current['files'].keys()
          for rel,row in expected['files'].items():
              assert sha(Path('kodi')/rel)==row['after']==current['files'][rel]['after'],rel
          assert sha('baseline167/Infinity-1.0.9-Cobra-Status-Bar-Restore-RC1.apk')=='e44b1c884292fbbf75ab8ce3bf58ea273e783ff3f818cceeb8d1956e888b541a'
          print('PASS: exact successful 2103167 source and APK')
          PY
          mv kodi shell-kodi

      - name: Prove native repair and promote to 2103168
        run: |
          set -euo pipefail
          mkdir -p audit168
          cp native164/pythoninvoker-threadstate-source.json engine/pythoninvoker-threadstate-source.json
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          proof=json.loads(Path('engine/pythoninvoker-threadstate-source.json').read_text())
          assert proof['upstream_fix']=='0186f895271d4ce7d240b4e9f40da03b4833539d'
          assert all(proof['checks'].values())
          with zipfile.ZipFile('native164/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2-Engine-Base.apk') as z:
              native=z.read('lib/arm64-v8a/libkodi.so')
          assert b'thread state cleaned while waiting for child threads' in native
          assert b'm_threadState != nullptr' not in native
          print('PASS: proven repaired native engine')
          PY
          python3 repair168/repairs/pythoninvoker-forwardport-2103168/ci.py promote \
            --shell shell-kodi \
            --base167 baseline167/Infinity-1.0.9-Cobra-Status-Bar-Restore-RC1.apk \
            --native-apk native164/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2-Engine-Base.apk \
            --out audit168/native-base

      - name: Build shell, sign and verify forward update
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 scripts/package_background_resume.py \
            --source shell-kodi \
            --base-apk audit168/native-base/Infinity-2103167-PythonInvoker-Patched-Base.apk \
            --build-dir rotation-build \
            --out signed168
          python3 repair168/repairs/pythoninvoker-forwardport-2103168/ci.py verify \
            --final signed168/Infinity-1.0.9-Cobra-Status-Bar-PythonInvoker-Stability-RC1.apk \
            --base167 baseline167/Infinity-1.0.9-Cobra-Status-Bar-Restore-RC1.apk \
            --native-apk native164/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2-Engine-Base.apk \
            --audit signed168/background-resume-apk-audit.json

      - name: Run exact 2103167 regression matrix on 2103168 shell
        run: |
          set -euo pipefail
          python3 theme-delta/repairs/cobra-theme-runtime-2103160/tests/android.py --build rotation-build --out audit168/android
          cp candidate14-delta/repairs/cobra-theme-rotation-2103162/tests/Cobra2103162ThemeRotationTest.java rotation-build/xbmc/src/test/java/com/projectinfinity/kodi/
          cp stability-delta/repairs/cobra-playback-stability-2103164/tests/Cobra2103164PlaybackStabilityTest.java rotation-build/xbmc/src/test/java/com/projectinfinity/kodi/
          cp insets-delta/repairs/cobra-inner-insets-pip-return-2103165/tests/Cobra2103165InsetsPipPlayerTest.java rotation-build/xbmc/src/test/java/com/projectinfinity/kodi/
          cp audit166-delta/repairs/cobra-end-to-end-audit-2103166/tests/Cobra2103166EndToEndUiAuditTest.java rotation-build/xbmc/src/test/java/com/projectinfinity/kodi/
          cp status167-delta/repairs/cobra-status-bar-restore-2103167/tests/Cobra2103167StatusBarRestoreTest.java rotation-build/xbmc/src/test/java/com/projectinfinity/kodi/
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('experience-delta/repairs/infinity-experience-2103159/tests/android.py')
          s=importlib.util.spec_from_file_location('runner168',p);r=importlib.util.module_from_spec(s);s.loader.exec_module(r)
          out=Path('audit168/targeted');env=r.test_environment(out)
          r.run_ui_gate([
            './gradlew','--no-daemon','--console=plain',':xbmc:testReleaseUnitTest',
            '--tests','com.projectinfinity.kodi.Cobra2103162ThemeRotationTest',
            '--tests','com.projectinfinity.kodi.Cobra2103164PlaybackStabilityTest',
            '--tests','com.projectinfinity.kodi.Cobra2103165InsetsPipPlayerTest',
            '--tests','com.projectinfinity.kodi.Cobra2103166EndToEndUiAuditTest',
            '--tests','com.projectinfinity.kodi.Cobra2103167StatusBarRestoreTest',
            '--stacktrace'],Path('rotation-build'),env,out)
          PY
          python3 repair168/repairs/pythoninvoker-forwardport-2103168/ci.py deliver

      - name: Upload installable 2103168 TEST CANDIDATE
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103168-Status-Bar-PythonInvoker-Stability-TEST-CANDIDATE
          path: signed168/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Preserve 2103168 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103168-Status-Bar-PythonInvoker-Stability-Evidence
          path: |
            audit168/
            engine/pythoninvoker-threadstate-source.json
            repair168/repairs/pythoninvoker-forwardport-2103168/
            signed168/*.json
            signed168/*.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Preserve exact 2103167 rollback
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103167-Exact-Rollback-Before-2103168
          path: baseline167/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
