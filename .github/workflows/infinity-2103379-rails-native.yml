name: Infinity | 2103379 Rails hold coordinates native test
on:
  push:
    branches: [work/infinity-rails-hold-2103379-hit-test-rc2]
    paths:
      - '.github/workflows/infinity-2103378-rails-native.yml'
      - 'repairs/rails-hold-2103378/native_ci.py'
      - 'repairs/rails-hold-2103378/patch_native.py'
      - 'repairs/rails-hold-2103378/test_native.py'
      - 'repairs/rails-hold-2103378/test_focus_dispatch.py'
permissions: {contents: read, actions: read}
concurrency: {group: infinity-2103379-rails-native, cancel-in-progress: false}
env:
  NDK_VER: 21.4.7075529
jobs:
  native-engine:
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    env:
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-${{ runner.os }}-21.4.7075529-v1
      - run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - uses: actions/download-artifact@v8
        with:
          run-id: 38132105717
          name: Infinity-2103367-Verified-Compiler-Dependencies
          github-token: ${{ github.token }}
          path: dependency-transfer
      - uses: actions/download-artifact@v8
        with:
          run-id: 38246713743
          name: Cobra-2103374-Verified-Deadweight-Signed-Test-APK
          github-token: ${{ github.token }}
          path: locked-parent
      - uses: actions/download-artifact@v8
        with:
          run-id: 38270097041
          name: Cobra-2103375-File-Preview-Native-Signed-Test-APK
          github-token: ${{ github.token }}
          path: previous-candidate
      - uses: actions/download-artifact@v8
        with:
          run-id: 38321848412
          name: Cobra-2103376-Critical-Preview-Native-Evidence
          github-token: ${{ github.token }}
          path: locked-native-evidence
      - uses: actions/download-artifact@v8
        with:
          run-id: 38323908660
          name: Cobra-2103376-Critical-Preview-Signed-Test-APK
          github-token: ${{ github.token }}
          path: protected-2103376-apk
      - name: Restore verified compiler dependencies
        run: |
          set -euo pipefail
          (cd dependency-transfer && sha256sum -c SHA256SUMS)
          tar --no-same-owner -xf dependency-transfer/verified-android-dependencies.tar
          tar --no-same-owner -xf dependency-transfer/verified-compiler-cache.tar -C "$HOME"
          python3 repairs/android-checkpoint-shutdown/native_ci.py verify-dependencies
          sudo apt-get update -qq
          sudo apt-get install -y python3-yaml python3-dev libsqlite3-dev libssl-dev
      - uses: actions/download-artifact@v8
        with:
          run-id: 38493645998
          name: Infinity-2103377-RC3-Exact-Native-Curl-Source
          github-token: '${{ github.token }}'
          path: rc2-captured-source
      - name: Recheck early local saves and exact owner-specific Curl guards
        run: |
          set -euo pipefail
          mkdir -p checkpoint-build
          python3 repairs/shutdown-rc3-2103377/test_source.py \
            --source rc2-captured-source --output checkpoint-build/RC3-HOST-VERIFICATION.json
      - name: Reconstruct locked native source and stage RC3 plus RC5 optional service repairs
        run: |
          set -euo pipefail
          python3 repairs/rails-hold-2103378/native_ci.py prepare \
            --locked locked-parent/Cobra-2103374-Verified-Deadweight-RC1.apk \
            --previous previous-candidate/Cobra-2103375-File-Preview-Native-RC1.apk \
            --parent-proof locked-native-evidence \
            2>&1 | tee checkpoint-build/rc5-source-preparation.log
      - name: Test real C++ classifier and cooperative-stop selection, unchanged 17 saves
        run: |
          set -euo pipefail
          python3 repairs/shutdown-rc5-2103377/native_ci.py verify             2>&1 | tee checkpoint-build/rc5-native-host-verification.log
      - name: Compile full matched Kodi engine including RC5 optional service correction
        run: |
          set -euo pipefail
          python3 repairs/rails-hold-2103378/native_ci.py compile \
            2>&1 | tee checkpoint-build/rc5-native-compilation.log
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103379-Rails-Hold-Native
          path: checkpoint-build/libkodi.so
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
      - name: Preserve native correction receipts and exact resume point
        if: always()
        run: |
          mkdir -p checkpoint-build vfs-diagnostic-package
          git rev-parse HEAD > checkpoint-build/VFS-TRACE-COMMIT.txt
          printf '%s\n' 'RC5 OPTIONAL TRAKT AND SKIN DIAGNOSTIC STOP-ONLY; OTHER UNKNOWN PYTHON WRITERS AND 17 REQUIRED SAVE OWNERS RETAINED. FOLD SHUTDOWN NOT VERIFIED; NOT LOCKED.' > checkpoint-build/VFS-TRACE-SCOPE.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103379-Rails-Hold-Native-Evidence
          path: |
            checkpoint-build/
            vfs-diagnostic-package/*.json
            vfs-diagnostic-package/*.txt
          retention-days: 90
          compression-level: 1
          if-no-files-found: error


