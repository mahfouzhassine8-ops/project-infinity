name: Infinity functional startup - native diagnostic host and ARM64 verification
on:
  push:
    branches: [work/infinity-2103482-functional-startup-20261111]
    paths:
      - .github/workflows/infinity-functional-startup-native.yml
      - repairs/infinity-functional-startup-2103482-20261111/build_diagnostic.py
      - repairs/infinity-functional-startup-2103482-20261111/native/**
permissions: {contents: read, actions: read}
concurrency:
  group: infinity-functional-startup-internal-native
  cancel-in-progress: false
jobs:
  focused-host:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13862739074', run-id: '43036765104', merge-multiple: true, github-token: '${{ github.token }}', path: diagnostic-host}
      - name: Reuse successful exact-source host proof; no repeated cases for runner-only correction
        run: |
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          task='repairs/infinity-functional-startup-2103482-20261111/'
          source=subprocess.check_output(['git','rev-parse','679807f7'],text=True).strip()
          paths=[task+p for p in ('native','test_trace.py','test_cpython_initialization.py','prepare_instrumentation.py')]
          assert not subprocess.check_output(['git','diff','--name-only',source,'HEAD','--',*paths],text=True).strip()
          host=json.loads(Path('diagnostic-host/HOST-TRACE-RESULTS.json').read_text())
          python=json.loads(Path('diagnostic-host/CPYTHON-INITIALIZATION-RESULTS.json').read_text())
          assert host['all_selected_assertions_passed'] and len(host['results'])==15
          assert python==json.loads(Path(task+'CPYTHON-INITIALIZATION-RESULTS.json').read_text())
          proof=dict(status='PASS_REUSED_EXACT_NATIVE_AND_TEST_SOURCES',run=43036765104,artifact=13862739074,source=source,repeated_cases=False)
          Path('diagnostic-host/REUSE.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps(proof))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'Infinity-FunctionalStartup-Host-${{ github.run_id }}', path: diagnostic-host/, retention-days: 90, if-no-files-found: error}
  arm64-diagnostic:
    needs: focused-host
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      GH_TOKEN: '${{ github.token }}'
      NDK_VER: '21.4.7075529'
      DEPENDS: '${{ github.workspace }}/android-tools/xbmc-depends'
      TARBALLS: '${{ github.workspace }}/android-tools/xbmc-tarballs'
      BUILD_DIR: '${{ github.workspace }}/kodi-build'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools build-tools;35.0.0 platforms;android-34', log-accepted-android-sdk-licenses: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13274901825', run-id: '41726452356', merge-multiple: true, github-token: '${{ github.token }}', path: verified-inputs}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13571276665', run-id: '42364232328', merge-multiple: true, github-token: '${{ github.token }}', path: previous-review}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13595626273', run-id: '42425522122', merge-multiple: true, github-token: '${{ github.token }}', path: exact464}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13771187253', run-id: '42830516841', merge-multiple: true, github-token: '${{ github.token }}', path: signed80}
      - name: Source-bound internal diagnostic preparation
        run: python3 repairs/infinity-functional-startup-2103482-20261111/build_diagnostic.py prepare
      - name: Retained dependency tooling
        run: |
          bash repairs/infinity-functional-startup-2103482-20261111/prepare_ci_tooling.sh
      - uses: actions/cache@v4
        with: {path: /usr/local/lib/android/sdk/ndk/21.4.7075529, key: infinity-pinned-ndk-linux-21.4.7075529-v1}
      - name: Retained pinned NDK
        run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - name: Restore required native dependencies through original recipe
        run: python3 repairs/infinity-functional-startup-2103482-20261111/build_diagnostic.py dependencies
      - name: Compile full diagnostic ARM64 engine and verify linkage
        run: python3 repairs/infinity-functional-startup-2103482-20261111/build_diagnostic.py compile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Infinity-FunctionalStartup-InternalNative-${{ github.run_id }}-Attempt${{ github.run_attempt }}-NO-INSTALLER
          path: |
            functional-startup-native/libkodi.so
            functional-startup-native/*.json
            functional-startup-native/*.txt
          retention-days: 90
          if-no-files-found: error
