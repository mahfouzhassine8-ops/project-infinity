name: Infinity | 2103377 RC3 exact native Curl source capture
on:
  push:
    branches: [work/infinity-2103377-rc3-curl-early-save]
    paths:
      - '.github/workflows/infinity-2103377-rc3-source-capture.yml'
permissions: {contents: read, actions: read}
concurrency: {group: infinity-2103377-rc3-source-capture, cancel-in-progress: false}
env:
  NDK_VER: 21.4.7075529
jobs:
  pin-source-curl:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-${{ runner.os }}-21.4.7075529-v1
      - run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - uses: actions/download-artifact@v8
        with:
          run-id: 38132105717
          name: Infinity-2103367-Verified-Compiler-Dependencies
          github-token: ${{ github.token }}
          path: dependency-transfer
      - uses: actions/download-artifact@v8
        with:
          run-id: 38246713743
          name: Cobra-2103374-Verified-Deadweight-Signed-Test-APK
          github-token: ${{ github.token }}
          path: locked-parent
      - uses: actions/download-artifact@v8
        with:
          run-id: 38270097041
          name: Cobra-2103375-File-Preview-Native-Signed-Test-APK
          github-token: ${{ github.token }}
          path: previous-candidate
      - uses: actions/download-artifact@v8
        with:
          run-id: 38321848412
          name: Cobra-2103376-Critical-Preview-Native-Evidence
          github-token: ${{ github.token }}
          path: locked-native-evidence
      - uses: actions/download-artifact@v8
        with:
          run-id: 38323908660
          name: Cobra-2103376-Critical-Preview-Signed-Test-APK
          github-token: ${{ github.token }}
          path: protected-2103376-apk
      - name: Restore verified compiler dependencies
        run: |
          set -euo pipefail
          (cd dependency-transfer && sha256sum -c SHA256SUMS)
          tar --no-same-owner -xf dependency-transfer/verified-android-dependencies.tar
          tar --no-same-owner -xf dependency-transfer/verified-compiler-cache.tar -C "$HOME"
          python3 repairs/android-checkpoint-shutdown/native_ci.py verify-dependencies
          sudo apt-get update -qq
          sudo apt-get install -y python3-yaml python3-dev libsqlite3-dev libssl-dev
      - name: Reconstruct exact green RC2 native source without compiling
        run: |
          set -euo pipefail
          mkdir -p checkpoint-build
          python3 repairs/shutdown-final-2103377/native_ci.py prepare --locked locked-parent/Cobra-2103374-Verified-Deadweight-RC1.apk --previous previous-candidate/Cobra-2103375-File-Preview-Native-RC1.apk --parent-proof locked-native-evidence 2>&1 | tee checkpoint-build/rc3-source-staging.log
      - name: Pin actual Curl, file-open and native checkpoint source bytes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, shutil, sys
          from pathlib import Path
          sys.path.insert(0,str(Path("repairs/shutdown-final-2103377").resolve()))
          import native_ci
          source=native_ci.wide().lifecycle().SOURCE
          proof=json.loads(Path("checkpoint-build/FINAL-SHUTDOWN-SOURCE-PRESERVATION.json").read_text())
          names=[
             "xbmc/filesystem/CurlFile.cpp","xbmc/filesystem/CurlFile.h",
             "xbmc/filesystem/File.cpp","xbmc/filesystem/File.h",
             "xbmc/platform/android/activity/InfinityAndroidCheckpoint.cpp",
             "xbmc/interfaces/generic/ScriptInvocationManager.cpp",
             "xbmc/utils/JobManager.cpp"
          ]
          out=Path("rc3-source")
          for name in names:
              src=source/name
              data=src.read_bytes()
              digest=hashlib.sha256(data).hexdigest()
              assert proof["after"][name]==digest,(name,digest,proof["after"].get(name))
              target=out/name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
          manifest=dict(source_commit=__import__("os").environ["GITHUB_SHA"],
                        rc2_parent="e3e22e77753f0a036274866b6b173f1387091591",
                        files={n:proof["after"][n] for n in names},
                        note="actual staged RC2 native source bytes; read-only capture; no native build or APK")
          (out/"PINNED-SOURCE.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print("PASS exact RC2 native Curl source bytes captured and hash-matched",len(names))
          PY
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103377-RC3-Exact-Native-Curl-Source
          path: rc3-source/
          if-no-files-found: error
          retention-days: 30
