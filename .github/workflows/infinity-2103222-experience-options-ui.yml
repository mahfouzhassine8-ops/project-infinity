name: Infinity | 2103222 Experience Options UI

on:
  workflow_dispatch:
  push:
    branches: [infinity-cobra-2103222-experience-options-ui-rc1]
    paths:
      - '.github/workflows/infinity-2103222-experience-options-ui.yml'
      - 'repairs/experience-options-ui-2103222/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: infinity-2103222-${{ github.sha }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}

      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}

      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools}

      - name: Download exact 2103208 source parent
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103208-Integration-Polish-TEST-CANDIDATE-Replica-1-Attempt-1
          run-id: 35676573761
          github-token: ${{ github.token }}
          path: baseline208

      - name: Download preserved 2103209 native engine
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103209-Python311-GIL-Native-Engine
          run-id: 35693288744
          github-token: ${{ github.token }}
          path: native209

      - name: Download exact locked 2103221 APK for preservation gate
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103221-Drawer-Owner-UI-Restore-TEST-CANDIDATE
          run-id: 35769768579
          github-token: ${{ github.token }}
          path: parent221

      - name: Reconstruct exact locked 2103221 source
        run: |
          set -euo pipefail
          mkdir -p audit222 engine
          cp native209/pythoninvoker-threadstate-v2-source.json engine/pythoninvoker-threadstate-v2-source.json
          cp native209/pythoninvoker-threadstate-v2-source.stage1.json engine/pythoninvoker-threadstate-v2-source.stage1.json

          python3 repairs/python311-gil-2103209/ci.py prepare             --base-dir baseline208             --native-apk native209/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2-Engine-Base.apk             --shell shell-kodi             --out audit222/base

          python3 repairs/cobra-media-library-health-2103210/apply.py --shell shell-kodi
          python3 repairs/cobra-library-health-2103211/apply.py --shell shell-kodi
          python3 repairs/health-media-trim-2103212/apply.py --shell shell-kodi
          python3 repairs/live-blue-ambient-settings-return-2103213/apply.py --shell shell-kodi
          python3 repairs/media-details-final-2103214/apply.py --shell shell-kodi
          python3 repairs/smart-return-experience-drawer-2103215/apply.py --shell shell-kodi
          python3 repairs/smart-return-experience-display-2103216/apply.py --shell shell-kodi
          python3 repairs/media-return-context-2103217/apply.py --shell shell-kodi
          python3 repairs/drawer-owner-ui-restore-2103221/apply.py --shell shell-kodi

          grep -F '"version_code": 2103221' engine/background-resume-source.json
          grep -F '"version_name": "1.0.9-Cobra-Drawer-Owner-UI-Restore-RC1"' engine/background-resume-source.json
          grep -F '"smart_return_untouched": true' engine/background-resume-source.json

      - name: Apply ONLY both Choose Your Experience settings UIs
        run: |
          set -euo pipefail
          python3 repairs/experience-options-ui-2103222/apply.py --shell shell-kodi

          SPLASH=shell-kodi/tools/android/packaging/xbmc/src/Splash.java.in
          python3 - <<'PY'
          from pathlib import Path
          p=Path('shell-kodi/tools/android/packaging/xbmc/src/Splash.java.in')
          s=p.read_text()
          sig='private void showExperienceCardSettings(String experience)'
          i=s.index(sig); b=s.index('{',i); d=0
          for j in range(b,len(s)):
              if s[j]=='{': d+=1
              elif s[j]=='}':
                  d-=1
                  if d==0:
                      m=s[i:j+1]
                      break
          for token in (
              'Cobra options','Infinity options','Remember & launch ',
              'Launch ','Ask every time','Infinity Health Center','Cobra Recovery',
              'experience_options_ui_row','experience_options_ui_dialog',
              'showInfinityHealthCenter()','showCobraRecovery()',
              'launchInfinityExperience(experience);'
          ):
              assert token in m, token
          assert 'Smart Return' not in m
          assert 'CobraVisualRenderer.DialogBuilder' not in m
          assert 'Theme_Material_Dialog_Alert' in m
          print('PASS: only the two chooser gear menus use the isolated branded options surface')
          PY

          grep -F '"experience_options_ui_fixed": true' engine/background-resume-source.json
          grep -F '"smart_return_untouched": true' engine/background-resume-source.json
          grep -F '"drawer_owner_untouched": true' engine/background-resume-source.json
          grep -F '"global_dialog_renderer_untouched": true' engine/background-resume-source.json

      - name: Build sign and verify 2103222
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v             -keystore "$HOME/.android/debug.keystore"             -storepass android -alias androiddebugkey -keypass android             -dname "CN=Android Debug,O=Android,C=US"             -keyalg RSA -keysize 2048 -validity 10000

          python3 scripts/package_background_resume.py             --source shell-kodi             --base-apk audit222/base/Infinity-2103208-Python311-GIL-Patched-Base.apk             --build-dir build222             --out signed222

          python3 repairs/experience-options-ui-2103222/verify.py             --apk signed222/Infinity-1.0.9-Experience-Options-UI-RC1.apk             --parent221 parent221/Infinity-1.0.9-Cobra-Drawer-Owner-UI-Restore-RC1.apk             --audit signed222/background-resume-apk-audit.json             --scope audit222/scope.json

      - name: Publish 2103222 TEST CANDIDATE
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103222-Experience-Options-UI-TEST-CANDIDATE
          path: signed222/
          compression-level: 0
          retention-days: 90

      - name: Preserve 2103222 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103222-Experience-Options-UI-Evidence
          path: |
            audit222/
            engine/background-resume-source.json
            repairs/experience-options-ui-2103222/
            signed222/*.json
            signed222/*.txt
          if-no-files-found: warn
          retention-days: 90
