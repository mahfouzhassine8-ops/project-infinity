name: Infinity 2103407 Search overload signed QA
on:
  push:
    branches: [work/infinity-2103407-search-overload-single-flight-20261025]
    paths:
      - "repairs/infinity-2103407-search-pressure/**"
      - ".github/workflows/infinity-2103407-search-signed-qa.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-2103407-search-signed-qa
  cancel-in-progress: false
jobs:
  signed-search:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cobra and original 2103406 preservation scope
        run: |
          set -euo pipefail
          git diff --name-only a84c2b7752d29c200dbd573b19ca065ec0574c46 HEAD | tee /tmp/scope
          if grep -v -E '^(repairs/infinity-2103407-search-pressure/|\.github/workflows/infinity-2103407-search-pressure-host-gate\.yml$|\.github/workflows/infinity-2103407-search-signed-qa\.yml$)' /tmp/scope; then
            echo 'FAIL unapproved source' >&2
            exit 1
          fi
          if grep -i cobra /tmp/scope; then exit 1; fi
      - uses: actions/download-artifact@v4
        with:
          run-id: 40191243446
          name: Infinity-2103406-SIGABRT-RECORDER-ORIGINAL-SIGNER-QA
          github-token: ${{ github.token }}
          path: input
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.7"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;35.0.0 platforms;android-34"
          log-accepted-android-sdk-licenses: false
      - name: Verify parent and extract actual signed Search source
        run: |
          set -euo pipefail
          (cd input/stage && sha256sum -c SHA256SUMS)
          mkdir -p work/old work/patched
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          p=Path('input/stage/Infinity-2103406-SIGABRT-Crash-Recorder-QA.apk')
          digest=hashlib.sha256()
          with p.open('rb') as f:
              for chunk in iter(lambda:f.read(4*1024*1024),b''):digest.update(chunk)
          assert digest.hexdigest()=='a388be6cbcda5a2fb9b740300fde09e247519d9a23552ead30e84080fd9852cf'
          with ZipFile(p) as z:
              content=z.read('assets/addons/script.infinity.commandcenter/infinity_search.py')
              assert b'Infinity Tracked' in z.read('assets/addons/script.infinity.commandcenter/addon.xml')
          assert hashlib.sha256(content).hexdigest()=='a5640a725d07440e914fd5f8d83a29196ea9cbb1104686f1929b5140040b2c44'
          Path('work/old/infinity_search.py').write_bytes(content)
          print('PASS: original signed 2103406 and exactly shipped Search')
          PY
      - name: Run reviewed single-flight Search overload correction and tests
        env:
          SIGNED_SEARCH: work/old/infinity_search.py
          PATCHED_SEARCH: work/patched/infinity_search.py
        run: |
          set -euo pipefail
          python3 repairs/infinity-2103407-search-pressure/patch_search_pressure.py "$SIGNED_SEARCH" "$PATCHED_SEARCH"
          echo 'bb6e8791ca7644ca9d370b5871d69ded71790557069b56535e920baa6cf50531  work/patched/infinity_search.py' | sha256sum -c -
          python3 -m unittest -v repairs/infinity-2103407-search-pressure/test_search_pressure.py 2>&1 | tee work/SEARCH-PRESSURE-TESTS.txt
          python3 -m py_compile repairs/infinity-2103407-search-pressure/package_search_pressure.py
      - name: Exact scoped Search APK and matched helper native hash stage
        run: |
          set -euo pipefail
          python3 repairs/infinity-2103407-search-pressure/package_search_pressure.py stage --input input/stage --source work/patched/infinity_search.py --output release
          python3 repairs/infinity-2103407-search-pressure/package_search_pressure.py verify --input input/stage --output release --signed release/unsigned-2103407.apk
      - name: Sign original Infinity release key and inspect APK/ZIP preservation
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$INFINITY_KEYSTORE_B64"
          test -n "$INFINITY_STORE_PASSWORD"
          test -n "$INFINITY_KEY_PASSWORD"
          test -n "$INFINITY_KEY_ALIAS"
          printf '%s' "$INFINITY_KEYSTORE_B64" | base64 -d > release/.key.jks
          chmod 600 release/.key.jks
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          "$SDK/zipalign" -P 16 -f 4 release/unsigned-2103407.apk release/.aligned.apk
          "$SDK/apksigner" sign --ks release/.key.jks --ks-key-alias "$INFINITY_KEY_ALIAS" --ks-pass env:INFINITY_STORE_PASSWORD --key-pass env:INFINITY_KEY_PASSWORD --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out release/Infinity-2103407-Search-Single-Flight-SIGNED-QA.apk release/.aligned.apk
          "$SDK/apksigner" verify --verbose --print-certs input/stage/Infinity-2103406-SIGABRT-Crash-Recorder-QA.apk > release/ORIGINAL-SIGNATURE.txt
          "$SDK/apksigner" verify --verbose --print-certs release/Infinity-2103407-Search-Single-Flight-SIGNED-QA.apk > release/NEW-SIGNATURE.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          rx=re.compile(r'Signer #1 certificate SHA-256 digest:\s*([0-9a-fA-F]{64})')
          def get(file):
              m=rx.search(Path(file).read_text())
              assert m,file
              return m.group(1).lower()
          expected='d7adeb68e9341596a02bd3262b737a0f45fc6e771ed7e60285437e833b58c6d7'
          assert get('release/NEW-SIGNATURE.txt')==get('release/ORIGINAL-SIGNATURE.txt')==expected
          print('PASS: identical original permanent Infinity signer')
          PY
          "$SDK/aapt" dump badging release/Infinity-2103407-Search-Single-Flight-SIGNED-QA.apk | grep -E "^package: name='com.projectinfinity.kodi' versionCode='2103407'"
          python3 repairs/infinity-2103407-search-pressure/package_search_pressure.py verify --input input/stage --output release --signed release/Infinity-2103407-Search-Single-Flight-SIGNED-QA.apk
          rm -f release/.key.jks release/.aligned.apk release/unsigned-2103407.apk
          (cd release && sha256sum *.apk *.zip > SHA256SUMS)
      - name: Explicit device QA gate
        run: |
          cat > release/DEVICE-ACCEPTANCE.txt <<'EOF'
          Infinity 2103407 Search single-flight QA; signed install-over 2103406.
          No uninstall or clear-data. Confirm startup and WatchNixtoons2 Infinity Tracked.
          Search provider and Search All; rapidly repeat submit/cancel/submit.
          Second concurrent provider RPC should return busy; next Search should recover.
          Physical Android 17 Fold is final acceptance. SIGSEGV root cause is unproven.
          Unchanged: Cobra, crash recorder, skin, shutdown safeguards and user data.
          Matching components: CC 0.3.5.39, Watched Bridge 1.0.20,
          UI Repair 0.1.22, unchanged Skin 1.0.5.243.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: Infinity-2103407-SEARCH-SINGLE-FLIGHT-ORIGINAL-SIGNER-QA
          path: |
            release/*.apk
            release/*.zip
            release/SHA256SUMS
            release/*RECEIPT.json
            release/*SIGNATURE.txt
            release/DEVICE-ACCEPTANCE.txt
            work/SEARCH-PRESSURE-TESTS.txt
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Infinity-2103407-SEARCH-BUILD-BLOCKER
          path: |
            release/*RECEIPT.json
            release/*SIGNATURE.txt
            work/SEARCH-PRESSURE-TESTS.txt
          retention-days: 30
          if-no-files-found: warn
