name: Infinity | Kodi Port Analysis
on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Official stable Kodi source tag to analyze against the locked Infinity baseline'
        type: string
        default: '21.3-Omega'
        required: true
      target_sha:
        description: 'Optional expected 40-character commit; rejects a moved tag'
        type: string
        default: ''
        required: false
  workflow_call:
    inputs:
      target_tag:
        type: string
        required: true
      target_sha:
        type: string
        default: ''
        required: false
permissions:
  contents: read
concurrency:
  group: infinity-kodi-analysis-${{ inputs.target_tag }}-${{ inputs.target_sha }}
  cancel-in-progress: false
jobs:
  source-only:
    if: github.repository == 'mahfouzhassine8-ops/project-infinity'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PORT_WORKSPACE: ${{ runner.temp }}/infinity-port-${{ github.run_id }}-${{ github.run_attempt }}
      PORT_EVIDENCE: ${{ github.workspace }}/port-evidence
      FAST_JAVA_OUT: ${{ github.workspace }}/fast-java-check
      EXPORT_DIR: ${{ github.workspace }}/analysis-export
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check out exact delivered RC3 recipe, NOT old main or RC2
        uses: actions/checkout@v7.0.1
        with:
          repository: mahfouzhassine8-ops/project-infinity
          ref: 5f7d9b311568cca053d9c0e082463baca1bd99e0
          path: pinned-infinity-recipe
          persist-credentials: false

      - name: Run infrastructure regression tests
        run: python3 -m unittest discover -s upstream/tests -v

      - name: Install source-analysis utilities only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends patch imagemagick fonts-dejavu-core

      - name: Download, inventory, diff and replay against the new Kodi source
        env:
          TARGET_TAG: ${{ inputs.target_tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 upstream/port.py \
            --recipe-root "$GITHUB_WORKSPACE/pinned-infinity-recipe" \
            --workspace "$PORT_WORKSPACE" \
            --output "$PORT_EVIDENCE" \
            --target-tag "$TARGET_TAG" \
            --target-sha "$TARGET_SHA"

      - name: Resolve exact analyzed target commit
        id: target
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path(os.environ['PORT_EVIDENCE'],'port-report.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write('sha='+report['target']['commit']+'\n')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android API only for the fast Infinity Java contract compile
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Fast compile Infinity Android runtime contracts against the replayed source
        id: java-check
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 upstream/validate_candidate_java.py \
            --source "$PORT_WORKSPACE/candidate" \
            --android-jar "$ANDROID_HOME/platforms/android-34/android.jar" \
            --out "$FAST_JAVA_OUT" \
            --contract "$GITHUB_WORKSPACE/pinned-infinity-recipe/patches/infinity-7.1-audited/contract.json"

      - name: Record targeted Java compatibility result
        if: always()
        env:
          JAVA_OUTCOME: ${{ steps.java-check.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          status='passed' if os.environ.get('JAVA_OUTCOME') == 'success' else 'failed'
          Path(os.environ['PORT_EVIDENCE'],'fast-java-status.json').write_text(
              json.dumps({'status':status,'scope':'Infinity Android/Java runtime contract only'},indent=2)+'\n')
          PY

      - name: Produce readable smart compatibility report and System Tray status payload
        run: |
          python3 upstream/smart_analyze.py \
            --port-report "$PORT_EVIDENCE/port-report.json" \
            --ownership "$PORT_EVIDENCE/ownership-manifest.json" \
            --java-status "$PORT_EVIDENCE/fast-java-status.json" \
            --output "$PORT_EVIDENCE"
          cat "$PORT_EVIDENCE/SMART-ANALYSIS.md" >> "$GITHUB_STEP_SUMMARY"
          test -s "$PORT_EVIDENCE/system-tray-status.json"

      - name: Create portable analysis ZIP for Save As / sharing
        env:
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          set -euo pipefail
          SAFE_TAG=$(printf '%s' "$TARGET_TAG" | tr -c 'A-Za-z0-9._-' '_')
          mkdir -p "$EXPORT_DIR"
          python3 upstream/export_analysis.py \
            --evidence "$PORT_EVIDENCE" \
            --output "$EXPORT_DIR/Infinity-Kodi-${SAFE_TAG}-Analysis-Report.zip"
          test -s "$EXPORT_DIR/Infinity-Kodi-${SAFE_TAG}-Analysis-Report.zip"

      - name: Mark this exact Kodi tag and commit as analyzed
        run: |
          mkdir -p analysis-cache-marker
          printf '%s %s\n' '${{ inputs.target_tag }}' '${{ steps.target.outputs.sha }}' > analysis-cache-marker/analyzed.txt

      - uses: actions/cache/save@v4
        with:
          path: analysis-cache-marker
          key: infinity-kodi-smart-analysis-${{ inputs.target_tag }}-${{ steps.target.outputs.sha }}

      - name: Upload portable analysis ZIP
        uses: actions/upload-artifact@v7.0.1
        with:
          name: infinity-kodi-portable-analysis-${{ inputs.target_tag }}
          path: analysis-export/*.zip
          if-no-files-found: error
          retention-days: 90

      - name: Preserve smart report, source diff, replay evidence and downloaded candidate source
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: infinity-kodi-smart-analysis-${{ inputs.target_tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            port-evidence/
            fast-java-check/
          if-no-files-found: warn
          retention-days: 90
