name: Infinity 462 keyboard ARM64 verification from exact source - no APK
on:
  push:
    branches:
      - ci/infinity-462-keyboard-build-verified-20261107
    paths:
      - .github/workflows/infinity-462-keyboard-verified-arm64-evidence.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-462-verified-arm64-keyboard
  cancel-in-progress: false
jobs:
  keyboard-arm64:
    name: Exact APK462 plus one reviewed keyboard TU - real ARM64 object only
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      NDK_VER: '21.4.7075529'
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools build-tools;35.0.0 platforms;android-34', log-accepted-android-sdk-licenses: false}
      - name: Enforce isolated experiment contains NO runtime edits
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          parent='92bb6ecbb21c14f62f40555ba2aaef198e3847e2'
          paths=set(subprocess.check_output(['git','diff','--name-only',parent,'HEAD'],text=True).splitlines())
          expected={'.github/workflows/infinity-462-keyboard-verified-arm64-evidence.yml'}
          assert paths==expected, ('Unexpected source change', sorted(paths))
          print('PASS unchanged native candidate, Search and original protected components')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13274901825', run-id: '41726452356', merge-multiple: true, github-token: '${{ github.token }}', path: verified-inputs}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13571276665', run-id: '42364232328', merge-multiple: true, github-token: '${{ github.token }}', path: previous-review}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13571601535', run-id: '42365578534', merge-multiple: true, github-token: '${{ github.token }}', path: keyboard-after}
      - name: Restore exact 9411-file APK462 source map and only the keyboard correction
        run: |
          set -euo pipefail
          python3 repairs/infinity-native-keyboard-scaling-462-20261107/compile_keyboard.py restore
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '11698374892', run-id: '38132105717', merge-multiple: true, github-token: '${{ github.token }}', path: dependency-transfer}
      - name: Restore original pinned compiler prerequisites
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y python3-yaml python3-dev libsqlite3-dev libssl-dev libffi-dev
          (cd dependency-transfer && sha256sum -c SHA256SUMS)
          tar --no-same-owner -xf dependency-transfer/verified-android-dependencies.tar
          tar --no-same-owner -xf dependency-transfer/verified-compiler-cache.tar -C "$HOME"
      - uses: actions/cache@v4
        with: {path: /usr/local/lib/android/sdk/ndk/21.4.7075529, key: infinity-pinned-ndk-linux-21.4.7075529-v1}
      - name: Restore unchanged pinned NDK
        run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - name: Compile genuine ARM64 keyboard object with corrected libc++ symbol checks
        run: |
          set -euo pipefail
          python3 repairs/infinity-native-keyboard-scaling-462-20261107/compile_keyboard.py compile
          test -s native-ownership-review/GUIKeyboardFactory.cpp.o
          test -s native-ownership-review/KEYBOARD-ARM64-VERIFIED.json
          sha256sum native-ownership-review/GUIKeyboardFactory.cpp.o | tee native-ownership-review/KEYBOARD-OBJECT-SHA256.txt
          printf '%s\n' 'Object compile only. Full native engine, graphics race, Search-settings consistency, Android runtime and APK signing remain unverified.' > native-ownership-review/RELEASE-LIMITS.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity462-Keyboard-Verified-ARM64-Object-${{ github.run_id }}-NO-APK
          path: native-ownership-review/
          retention-days: 90
          if-no-files-found: warn
