name: Infinity Stable 2 PiP v3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-stable2-pip-v3.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;34.0.0 platform-tools'
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends unzip curl
          curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
      - name: Download Stable 2 v12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9987128748/zip -o /tmp/base.zip
          mkdir -p /tmp/base
          unzip -q /tmp/base.zip -d /tmp/base
          APK=$(find /tmp/base -name '*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" /tmp/base.apk
      - name: Decode
        run: java -jar /tmp/apktool.jar d -f /tmp/base.apk -o /tmp/decoded
      - name: Patch real Main activity for native PiP
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('/tmp/decoded')
          man=root/'AndroidManifest.xml'
          s=man.read_text()
          pat=r'<activity\b[^>]*android:name="com\.projectinfinity\.kodi\.Main"[^>]*>'
          m=re.search(pat,s)
          if not m: raise SystemExit('Main manifest activity not found')
          tag=m.group(0)
          if 'android:supportsPictureInPicture=' not in tag:
              tag=tag[:-1]+' android:supportsPictureInPicture="true">'
          if 'android:resizeableActivity=' not in tag:
              tag=tag[:-1]+' android:resizeableActivity="true">'
          s=s[:m.start()]+tag+s[m.end():]
          man.write_text(s)

          p=root/'smali/com/projectinfinity/kodi/Main.smali'
          if not p.exists():
              hits=[x for d in root.glob('smali*') for x in d.rglob('Main.smali') if 'projectinfinity/kodi' in str(x)]
              if not hits: raise SystemExit('Main.smali not found')
              p=hits[0]
          t=p.read_text()
          if 'onUserLeaveHint()V' in t:
              raise SystemExit('Unexpected existing onUserLeaveHint; refusing unsafe duplicate')
          method='''\n.method protected onUserLeaveHint()V\n    .locals 2\n\n    invoke-super {p0}, Landroid/app/NativeActivity;->onUserLeaveHint()V\n\n    sget v0, Landroid/os/Build$VERSION;->SDK_INT:I\n    const/16 v1, 0x1a\n    if-lt v0, v1, :pip_done\n\n    invoke-virtual {p0}, Lcom/projectinfinity/kodi/Main;->enterPictureInPictureMode()Z\n\n    :pip_done\n    return-void\n.end method\n'''
          p.write_text(t+method)
          print('Patched PiP into',p)
          PY
      - name: Verify patch
        run: |
          set -euo pipefail
          grep -q 'android:name="com.projectinfinity.kodi.Main"' /tmp/decoded/AndroidManifest.xml
          grep -q 'android:supportsPictureInPicture="true"' /tmp/decoded/AndroidManifest.xml
          grep -q 'onUserLeaveHint()V' /tmp/decoded/smali/com/projectinfinity/kodi/Main.smali
          grep -q 'enterPictureInPictureMode()Z' /tmp/decoded/smali/com/projectinfinity/kodi/Main.smali
      - name: Rebuild
        run: java -jar /tmp/apktool.jar b /tmp/decoded -o /tmp/Infinity-Stable2-PiP-v3-unsigned.apk
      - name: Sign
        env:
          PASS: infinity${{ github.run_id }}${{ github.run_attempt }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          keytool -genkeypair -keystore /tmp/infinity.keystore -alias infinity -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Infinity Stable 2 PiP v3, O=Infinity, C=US" >/dev/null 2>&1
          "$BT/zipalign" -f 4 /tmp/Infinity-Stable2-PiP-v3-unsigned.apk /tmp/Infinity-Stable2-PiP-v3-aligned.apk
          "$BT/apksigner" sign --ks /tmp/infinity.keystore --ks-key-alias infinity --ks-pass env:PASS --key-pass env:PASS --out /tmp/Infinity-Stable2-PiP-v3.apk /tmp/Infinity-Stable2-PiP-v3-aligned.apk
          "$BT/apksigner" verify --verbose /tmp/Infinity-Stable2-PiP-v3.apk
      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-Stable2-PiP-v3
          path: /tmp/Infinity-Stable2-PiP-v3.apk
          retention-days: 30
