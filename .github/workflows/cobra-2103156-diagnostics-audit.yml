name: Infinity | Cobra 2103156 Diagnostics Audit
on:
  workflow_dispatch:
  push:
    branches: [infinity-cobra-2103156-diagnostics-audit-rc1]
    paths:
      - '.github/workflows/cobra-2103156-diagnostics-audit.yml'
      - 'repairs/cobra-diagnostics-2103156/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: cobra-2103156-diagnostics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit-and-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      NDK_VER: 21.4.7075529
      RUNTIME_COMMIT: b42760a25a27d23baa5db5770824cb8d32ec2290
    steps:
      - name: Check out immutable reconstruction stack
        uses: actions/checkout@v5
        with:
          ref: cce2de3042cca22b531fa8ed9e13659c19dab8a4
          fetch-depth: 0
          persist-credentials: false
      - name: Check out locked 2103155 recipe
        uses: actions/checkout@v5
        with:
          ref: 4d1ed032df7e13fd27cc2170fc5e028f5059ec32
          path: refinement-delta
          persist-credentials: false
      - name: Check out isolated diagnostics delta
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: audit-delta
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v5
        with:
          name: Infinity-1.0.9-Cobra-Full-Feature-Candidate-2
          run-id: 35044752997
          github-token: ${{ github.token }}
          path: run40
      - uses: actions/download-artifact@v5
        with:
          name: Infinity-Cobra-Player-Reboot-Lock-2103152
          run-id: 35169846333
          github-token: ${{ github.token }}
          path: rollback2103152
      - uses: actions/download-artifact@v5
        with:
          name: Infinity-Cobra-Guide-Player-Refinement-2103153-Audited
          run-id: 35176733529
          github-token: ${{ github.token }}
          path: rollback2103153
      - name: Download exact locked 2103155 APK and matching UI
        uses: actions/download-artifact@v5
        with:
          name: Infinity-Cobra-Adaptive-Views-EPG-Repair-RC1-2103155
          run-id: 35188339917
          github-token: ${{ github.token }}
          path: baseline155
      - name: Reproduce locked 2103155 and preserve exact rollback
        run: |
          set -euo pipefail
          python3 -m pip install pyyaml
          python3 audit-delta/repairs/cobra-diagnostics-2103156/ci.py reconstruct
      - name: Run executable diagnostics and save-provider failure regressions
        run: |
          set -euo pipefail
          python3 audit-delta/repairs/cobra-diagnostics-2103156/tests/run.py --baseline rollback156/2103155-activity.java.in --out audit156/diagnostics
          python3 audit-delta/repairs/cobra-diagnostics-2103156/tests/runtime_host.py --out audit156/runtime-host
      - name: Apply audited diagnostics observer and rerun EPG and layout algorithms
        run: |
          set -euo pipefail
          python3 audit-delta/repairs/cobra-diagnostics-2103156/apply.py --source kodi --receipt audit156/repair.json
          SRC=kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          cmp "$SRC" audit156/diagnostics/InfinityLiveActivity.java.in
          python3 refinement-delta/repairs/cobra-epg-rc1/tests/run_tests.py --source "$SRC" --out audit156/epg-host
          python3 refinement-delta/repairs/cobra-epg-rc1/tests/run_short.py --source "$SRC" --host audit156/epg-host --out audit156/epg-short
          python3 refinement-delta/repairs/cobra-epg-rc1/tests/run_inherited.py --source "$SRC" --repository refinement-delta --mode-harness preflight/mode-regressions/CobraModesHarness.java --out audit156/inherited
          python3 audit-delta/repairs/cobra-diagnostics-2103156/ci.py promote
      - name: Compile sign and verify Android shell with exact native donor
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test ! -e signed156
          python3 scripts/package_background_resume.py --source kodi --base-apk background-rollback/Infinity-Run40-Exact-Base.apk --build-dir diagnostics-build --out signed156
          python3 audit-delta/repairs/cobra-diagnostics-2103156/ci.py verify
      - name: Upload signed diagnostics candidate
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-Cobra-Diagnostics-Audit-RC1-2103156
          path: signed156/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Preserve all audit results even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Cobra-2103156-Audit-Evidence
          path: |
            audit156/
            work/
            preflight/
            engine/background-resume-source.json
            engine/native-before.patch
            engine/native-after-2103156.patch
            signed156/*.txt
            signed156/*.json
            audit-delta/repairs/cobra-diagnostics-2103156/
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve locked baseline rollback
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Cobra-2103155-Complete-Rollback-For-2103156
          path: rollback156/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
