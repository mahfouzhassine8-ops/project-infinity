name: Infinity502 consolidated unsigned QA staging - reuse verified artifacts
on:
  push:
    branches: [work/infinity-2103502-six-repairs-20261116]
    paths: [repairs/infinity-six-repairs-2103502-20261116/release/QA-STAGE-REQUEST.json]
permissions: {contents: read, actions: read}
concurrency: {group: infinity502-combined-stage, cancel-in-progress: false}
jobs:
  stage:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env: {PYTHONDONTWRITEBYTECODE: '1', GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools build-tools;35.0.0', log-accepted-android-sdk-licenses: false}
      - name: Assemble original502-derived combined payload and exact preservation receipt
        run: python repairs/infinity-six-repairs-2103502-20261116/release/stage_combined.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Infinity502-Consolidated-${{ github.run_id }}-UNSIGNED-NOT-INSTALLABLE
          path: |
            six502-qa-stage/Infinity-2103504-Combined-QA-UNSIGNED-NOT-INSTALLABLE.apk
            six502-qa-stage/evidence/
          if-no-files-found: error
          retention-days: 90
