name: Infinity 2103514 startup diagnostics ARM64
on:
  push:
    branches: [work/infinity-2103514-targeted-20261118]
    paths: [repairs/infinity-2103514-targeted-20261118/CI-NATIVE.json]
permissions: {contents: read, actions: read}
concurrency: {group: infinity-514-startup-diagnostic-arm64, cancel-in-progress: false}
jobs:
  arm64:
    if: github.ref == 'refs/heads/work/infinity-2103514-targeted-20261118'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      GH_TOKEN: '${{ github.token }}'
      NDK_VER: '21.4.7075529'
      DEPENDS: '${{ github.workspace }}/android-tools/xbmc-depends'
      TARBALLS: '${{ github.workspace }}/android-tools/xbmc-tarballs'
      BUILD_DIR: '${{ github.workspace }}/kodi-build'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - name: Frozen reviewed producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dea5df6063b49d65099c7958722f2b9f33895600
          path: native-retained
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
          sparse-checkout: |
            .github/workflows
            repairs/infinity-six-repairs-2103502-20261116
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - name: Authorize exact native inputs and retained artifact identities
        run: python repairs/infinity-2103514-targeted-20261118/native_build.py gate
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools build-tools;35.0.0 platforms;android-34', log-accepted-android-sdk-licenses: false}
      - name: Retained authenticated source reconstruction input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13274901825', run-id: '41726452356', merge-multiple: true, github-token: '${{ github.token }}', path: verified-inputs}
      - name: Retained intermediate source map
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13571276665', run-id: '42364232328', merge-multiple: true, github-token: '${{ github.token }}', path: previous-review}
      - name: Historical comparison input required by unchanged reconstruction machinery
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13595626273', run-id: '42425522122', merge-multiple: true, github-token: '${{ github.token }}', path: exact464}
      - name: Historical source-chain comparison only - never candidate or ABI baseline
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13771187253', run-id: '42830516841', merge-multiple: true, github-token: '${{ github.token }}', path: signed80}
      - name: Frozen producer intermediate source-map and comparison input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13990558917', run-id: '43314732573', merge-multiple: true, github-token: '${{ github.token }}', path: baseline500-native}
      - name: Exact ELF shipped in signed502 and its complete 9414-file source map
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '14187138056', run-id: '43774504911', merge-multiple: true, github-token: '${{ github.token }}', path: baseline502-native}
      - name: Authenticate the exact signed 2103514 engine and source map
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '14226277189', run-id: '43861331996', merge-multiple: true, github-token: '${{ github.token }}', path: baseline514-native}
      - name: Reconstruct all 9418 signed-baseline source files and apply the tested overlay
        run: python repairs/infinity-2103514-targeted-20261118/native_build.py prepare
      - name: Official Ubuntu dependency tooling with signature verification
        run: python repairs/infinity-2103514-targeted-20261118/native_build.py tooling
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with: {path: /usr/local/lib/android/sdk/ndk/21.4.7075529, key: infinity-pinned-ndk-linux-21.4.7075529-v1}
      - name: Unchanged verified NDK and dependency recipe
        run: |
          bash native-retained/native502-lock-provenance/native500-frozen-tools/repairs/android-checkpoint-shutdown/install_ndk.sh
          python repairs/infinity-2103514-targeted-20261118/native_build.py dependencies
      - name: Full ARM64 compile/link and exact 2103514 ABI comparison
        run: python repairs/infinity-2103514-targeted-20261118/native_build.py compile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: Infinity514-Startup-Native-ARM64-${{ github.run_id }}-NO-INSTALLER
          path: |
            native502-lock-output/libkodi.so
            native502-lock-output/ARM64-514.json
            native502-lock-output/ABI-514.json
            native502-lock-output/SOURCE-PRESERVATION-514.json
            native502-lock-output/NATIVE-SOURCE-MAP.json
            native502-lock-output/INPUT-514-AUTHENTICATION.json
          if-no-files-found: error
          compression-level: 1
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Infinity514-Startup-Native-Evidence-${{ github.run_id }}-NO-INSTALLER
          path: |
            native502-lock-output/*.json
            native502-lock-output/*.log
            native502-lock-output/*.txt
            native502-lock-output/provenance/*.json
            native502-lock-output/provenance/*.log
            native502-lock-output/provenance/*.txt
          if-no-files-found: warn
          retention-days: 90
