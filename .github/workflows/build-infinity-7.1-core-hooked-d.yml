name: Infinity 7.1 Core Hooked Candidate D

on:
  workflow_dispatch:
  push:
    branches:
      - infinity-7.1-core-unified
    paths:
      - '.github/workflows/build-infinity-7.1-core-hooked-d.yml'
      - 'scripts/patch-infinity-7.1-native-fold.py'
      - 'scripts/patch-infinity-7.1-native-hook.py'
      - 'scripts/patch-infinity-7.1-native-contract-d.py'
      - 'scripts/patch-infinity-7.1-app-hook.py'
      - 'scripts/patch-infinity-7.1-app-contract-d.py'
      - 'scripts/patch-infinity-tablet-7.0.py'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    env:
      KODI_TAG: 21.3-Omega
      KODI_SHA: a3a448d26b8d560a65655dab2cd122994dc4e146
      NDK_VER: 21.4.7075529
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf bison build-essential curl flex gawk git gperf lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev unzip zip zlib1g-dev ccache python3 nasm yasm librsvg2-bin
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;33.0.1" "build-tools;34.0.0" "ndk;${NDK_VER}"
          curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

      - name: Clone exact Kodi 21.3
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "${KODI_TAG}" https://github.com/xbmc/xbmc.git kodi
          test "$(git -C kodi rev-parse HEAD)" = "${KODI_SHA}"

      - name: Apply complete Infinity native foundation
        run: |
          set -euxo pipefail
          python3 scripts/patch-infinity-7.1-native-fold.py
          python3 scripts/patch-infinity-7.1-native-hook.py
          python3 scripts/patch-infinity-7.1-native-contract-d.py
          grep -q 'InfinitySyncDisplayState' kodi/xbmc/platform/android/activity/XBMCApp.cpp
          grep -q 'appPlayer->IsPlaying() && appPlayer->HasVideo()' kodi/xbmc/platform/android/activity/XBMCApp.cpp
          grep -q '"_infinityHasActiveVideo"' kodi/xbmc/platform/android/activity/JNIMainActivity.cpp
          grep -q '"_infinitySyncDisplayState"' kodi/xbmc/platform/android/activity/JNIMainActivity.cpp
          grep -q '"_infinitySystemThemeMode"' kodi/xbmc/platform/android/activity/JNIMainActivity.cpp
          grep -q '"_infinityWindowWidth"' kodi/xbmc/platform/android/activity/JNIMainActivity.cpp
          grep -q '"_infinityWindowHeight"' kodi/xbmc/platform/android/activity/JNIMainActivity.cpp
          grep -q '"_infinityBridgeVersion"' kodi/xbmc/platform/android/activity/JNIMainActivity.cpp

      - name: Cache Kodi depends
        uses: actions/cache@v4
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            ~/.ccache
          key: infinity-7.1-hooked-d-21.3-arm64-${{ runner.os }}-${{ hashFiles('scripts/patch-infinity-7.1-native-fold.py', 'scripts/patch-infinity-7.1-native-hook.py', 'scripts/patch-infinity-7.1-native-contract-d.py') }}
          restore-keys: |
            infinity-7.1-hooked-21.3-arm64-${{ runner.os }}-
            infinity-7.1-kodi-21.3-arm64-${{ runner.os }}-

      - name: Configure and build Kodi 21.3 core
        run: |
          set -euxo pipefail
          mkdir -p "${TARBALLS}" "${DEPENDS}" "${BUILD_DIR}"
          cd kodi/tools/depends
          ./bootstrap
          ./configure \
            --with-tarballs="${TARBALLS}" \
            --host=aarch64-linux-android \
            --with-sdk-path="${ANDROID_HOME}" \
            --with-ndk-path="${ANDROID_HOME}/ndk/${NDK_VER}" \
            --prefix="${DEPENDS}" \
            --enable-debug=yes
          make -j"$(nproc)"
          make -C target/cmakebuildsys BUILD_DIR="${BUILD_DIR}"
          make -C "${BUILD_DIR}" -j"$(nproc)"
          CORE=$(find "${BUILD_DIR}" -type f -name 'libkodi.so' -print -quit)
          test -n "$CORE"
          cp "$CORE" /tmp/libkodi-7.1-hooked-d.so
          sha256sum /tmp/libkodi-7.1-hooked-d.so > /tmp/core.sha256

      - name: Download proven Infinity 7.0 body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9987818547/zip" -o /tmp/base.zip
          mkdir -p /tmp/base-art
          unzip -q /tmp/base.zip -d /tmp/base-art
          APK=$(find /tmp/base-art -name '*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" /tmp/base.apk

      - name: Decode and preserve proven 7.0 lock
        run: |
          set -euxo pipefail
          java -jar /tmp/apktool.jar d -f /tmp/base.apk -o /tmp/target
          python3 scripts/patch-infinity-tablet-7.0.py
          SKIN=/tmp/target/assets/addons/skin.estuary
          mkdir -p "$SKIN/media/osd/fullscreen/buttons"
          printf '%s' '<svg xmlns="http://www.w3.org/2000/svg" width="74" height="74" viewBox="0 0 74 74"><rect x="14" y="31" width="46" height="35" rx="7" fill="white"/><path d="M24 31V22c0-8 5-14 13-14s13 6 13 14v9" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/><circle cx="37" cy="47" r="4" fill="#000000"/><rect x="35" y="47" width="4" height="10" rx="2" fill="#000000"/></svg>' > /tmp/lock.svg
          printf '%s' '<svg xmlns="http://www.w3.org/2000/svg" width="74" height="74" viewBox="0 0 74 74"><rect x="14" y="31" width="46" height="35" rx="7" fill="white"/><path d="M24 31V22c0-8 5-14 13-14 6 0 11 3 13 8" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/><circle cx="37" cy="47" r="4" fill="#000000"/><rect x="35" y="47" width="4" height="10" rx="2" fill="#000000"/></svg>' > /tmp/unlock.svg
          rsvg-convert -w 74 -h 74 /tmp/lock.svg -o "$SKIN/media/osd/fullscreen/buttons/infinity-lock.png"
          rsvg-convert -w 74 -h 74 /tmp/unlock.svg -o "$SKIN/media/osd/fullscreen/buttons/infinity-unlock.png"

      - name: Apply Infinity app bridge and Candidate D contract
        run: |
          set -euxo pipefail
          python3 scripts/patch-infinity-7.1-app-hook.py
          python3 scripts/patch-infinity-7.1-app-contract-d.py

      - name: Inject rebuilt Candidate D core
        run: |
          set -euxo pipefail
          test -d /tmp/target/lib/arm64-v8a
          cp /tmp/libkodi-7.1-hooked-d.so /tmp/target/lib/arm64-v8a/libkodi.so

      - name: Verify one uniform bridge contract
        run: |
          set -euxo pipefail
          MAIN=$(find /tmp/target -path '*/com/projectinfinity/kodi/Main.smali' | head -1)
          BRIDGE=$(find /tmp/target -path '*/com/projectinfinity/kodi/InfinityCoreBridge.smali' | head -1)
          test -n "$MAIN" && test -n "$BRIDGE"
          grep -q 'id="7999"' /tmp/target/assets/addons/skin.estuary/xml/VideoOSD.xml
          grep -q '_infinityHasActiveVideo()Z' "$MAIN"
          grep -q '_infinitySyncDisplayState()V' "$MAIN"
          grep -q '_infinitySystemThemeMode()I' "$MAIN"
          grep -q '_infinityWindowWidth()I' "$MAIN"
          grep -q '_infinityWindowHeight()I' "$MAIN"
          grep -q '_infinityBridgeVersion()I' "$MAIN"
          grep -q 'getSystemThemeMode' "$BRIDGE"
          grep -q 'getNativeWindowWidth' "$BRIDGE"
          grep -q 'getNativeWindowHeight' "$BRIDGE"
          grep -q 'getBridgeVersion' "$BRIDGE"
          grep -q 'const/4 v4, 0x0' "$BRIDGE"
          grep -q 'onPictureInPictureModeChanged' "$MAIN"
          grep -q 'onConfigurationChanged(Landroid/content/res/Configuration;)V' "$MAIN"
          grep -q 'android:supportsPictureInPicture="true"' /tmp/target/AndroidManifest.xml
          grep -q 'android:resizeableActivity="true"' /tmp/target/AndroidManifest.xml
          ! test -f '/tmp/target/assets/addons/skin.estuary/colors/Infinity OLED.xml'
          ! test -f '/tmp/target/assets/addons/skin.estuary/colors/Infinity Light.xml'

      - name: Rebuild APK
        run: java -jar /tmp/apktool.jar b /tmp/target -o /tmp/Infinity-7.1-Core-Hooked-D-unsigned.apk

      - name: Align sign and verify
        env:
          PASS: infinity${{ github.run_id }}${{ github.run_attempt }}
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          keytool -genkeypair -keystore /tmp/infinity.keystore -alias infinity -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Infinity 7.1 Candidate D, O=Project Infinity, C=US" >/dev/null 2>&1
          "$BT/zipalign" -f 4 /tmp/Infinity-7.1-Core-Hooked-D-unsigned.apk /tmp/Infinity-7.1-Core-Hooked-D-aligned.apk
          "$BT/apksigner" sign --ks /tmp/infinity.keystore --ks-key-alias infinity --ks-pass env:PASS --key-pass env:PASS --out /tmp/Infinity-7.1-Core-Hooked-D.apk /tmp/Infinity-7.1-Core-Hooked-D-aligned.apk
          "$BT/apksigner" verify --verbose /tmp/Infinity-7.1-Core-Hooked-D.apk
          unzip -p /tmp/Infinity-7.1-Core-Hooked-D.apk lib/arm64-v8a/libkodi.so | sha256sum > /tmp/final-core.sha256
          sha256sum /tmp/Infinity-7.1-Core-Hooked-D.apk > /tmp/Infinity-7.1-Core-Hooked-D.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-7.1-Core-Hooked-Candidate-D
          path: |
            /tmp/Infinity-7.1-Core-Hooked-D.apk
            /tmp/Infinity-7.1-Core-Hooked-D.sha256
            /tmp/final-core.sha256
          retention-days: 30
