name: Infinity | 2103209 Python 3.11 GIL Stability

on:
  workflow_dispatch:
    inputs:
      reuse_native:
        description: 'Reuse the proven native engine from failed run 35693288744; skip native rebuild'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
  push:
    branches: [infinity-cobra-2103209-python311-gil-stability-rc1]
    paths:
      - '.github/workflows/infinity-2103209-python311-gil-stability.yml'
      - 'scripts/infinity_python_invoker_hardening.py'
      - 'scripts/infinity_python_invoker_hardening_v2.py'
      - 'repairs/python311-gil-2103209/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: infinity-2103209-python311-gil-${{ github.sha }}
  cancel-in-progress: false

env:
  NDK_VER: 21.4.7075529
  RUNTIME_COMMIT: b42760a25a27d23baa5db5770824cb8d32ec2290

jobs:
  native-engine:
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    env:
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
    steps:
      - name: Checkout isolated 2103209 repair
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Restore matched Kodi 21.3 native dependencies
        uses: actions/cache/restore@v4
        id: deps-cache
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            ~/.ccache
          key: infinity-deep-audio-21.3-arm64-${{ runner.os }}-${{ hashFiles('patches/infinity-7.1-audited/contract.json', 'patches/infinity-responsive-v5/contract.json', 'patches/infinity-refresh/**', 'patches/infinity-media/**', 'patches/infinity-audio-policy/**') }}
          restore-keys: |
            infinity-responsive-v5-21.3-arm64-${{ runner.os }}-
            infinity-71-audited-deps-21.3-arm64-${{ runner.os }}-

      - name: Reconstruct accepted Kodi 21.3 + Infinity/Cobra native source
        run: |
          set -euo pipefail
          bash scripts/infinity_live_app_ci_1.sh

      - name: Apply complete PythonInvoker repair including Python 3.11 GIL follow-up
        run: |
          set -euo pipefail
          mkdir -p engine
          python3 scripts/infinity_python_invoker_hardening_v2.py apply \
            --source kodi \
            --receipt engine/pythoninvoker-threadstate-v2-source.json
          python3 scripts/infinity_python_invoker_hardening_v2.py verify --source kodi
          grep -Fq 'PyEval_RestoreThread(m_mainThreadState);' kodi/xbmc/interfaces/python/PythonInvoker.cpp
          grep -Fq 'thread state cleaned while waiting for child threads' kodi/xbmc/interfaces/python/PythonInvoker.cpp
          ! grep -Fq 'assert(m_threadState != nullptr)' kodi/xbmc/interfaces/python/PythonInvoker.cpp

      - name: Full native rebuild
        id: native_compile
        run: |
          set -euo pipefail
          bash scripts/infinity_live_app_ci_2.sh
          python3 scripts/infinity_python_invoker_hardening_v2.py verify --source kodi
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path

          FOLLOWUP = 'ddb60bd932b929724a9b0d2226043dc54d0d1912'
          OLD_ENGINE = 'e230a498a716ce0b82acedfce494fc521457af646c2f504965b247dcb5ee9281'
          proof = json.loads(Path('engine/pythoninvoker-threadstate-v2-source.json').read_text())
          assert proof['upstream_followup'] == FOLLOWUP
          assert all(proof['checks'].values())
          apk = Path('engine/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2-Engine-Base.apk')
          assert apk.is_file()
          with zipfile.ZipFile(apk) as z:
              native = z.read('lib/arm64-v8a/libkodi.so')
          digest = hashlib.sha256(native).hexdigest()
          assert digest != OLD_ENGINE, 'Rebuilt engine unexpectedly equals broken 2103208 engine'
          Path('engine/2103209-native-engine-sha256.txt').write_text(digest + '\n')
          print('PASS: rebuilt Python 3.11 GIL native engine', digest)
          PY

      - name: Preserve native engine and source proof
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103209-Python311-GIL-Native-Engine
          path: |
            engine/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2-Engine-Base.apk
            engine/pythoninvoker-threadstate-v2-source.json
            engine/pythoninvoker-threadstate-v2-source.stage1.json
            engine/2103209-native-engine-sha256.txt
            engine/live-app-shell-engine.json
            engine/gui-render-hardening-source.json
            engine/base-badging.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  package-and-audit:
    needs: native-engine
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout isolated 2103209 repair
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Download exact successful 2103208 parent
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103208-Integration-Polish-TEST-CANDIDATE-Replica-1-Attempt-1
          run-id: 35676573761
          github-token: ${{ github.token }}
          path: baseline208

      - name: Download rebuilt Python 3.11 native engine
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103209-Python311-GIL-Native-Engine
          path: native209

      - name: Build controlled 2103209 source and native base
        run: |
          set -euo pipefail
          mkdir -p audit209 engine
          cp native209/pythoninvoker-threadstate-v2-source.json engine/pythoninvoker-threadstate-v2-source.json
          cp native209/pythoninvoker-threadstate-v2-source.stage1.json engine/pythoninvoker-threadstate-v2-source.stage1.json
          python3 repairs/python311-gil-2103209/ci.py prepare \
            --base-dir baseline208 \
            --native-apk native209/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2-Engine-Base.apk \
            --shell shell-kodi \
            --out audit209/native-base

      - name: Create intermediate Android build keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          test -s "$HOME/.android/debug.keystore"

      - name: Build Android shell, permanently sign, and verify candidate
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 scripts/package_background_resume.py \
            --source shell-kodi \
            --base-apk audit209/native-base/Infinity-2103208-Python311-GIL-Patched-Base.apk \
            --build-dir build209 \
            --out signed209
          python3 repairs/python311-gil-2103209/ci.py verify \
            --final signed209/Infinity-1.0.9-Cobra-Python311-GIL-Stability-RC1.apk \
            --base-dir baseline208 \
            --native-apk native209/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2-Engine-Base.apk \
            --audit signed209/background-resume-apk-audit.json
          python3 repairs/python311-gil-2103209/ci.py deliver

      - name: Publish 2103209 TEST CANDIDATE
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103209-Python311-GIL-Stability-TEST-CANDIDATE
          path: signed209/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Preserve complete 2103209 audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103209-Python311-GIL-Stability-Evidence
          path: |
            audit209/
            engine/pythoninvoker-threadstate-v2-source.json
            engine/pythoninvoker-threadstate-v2-source.stage1.json
            repairs/python311-gil-2103209/
            scripts/infinity_python_invoker_hardening.py
            scripts/infinity_python_invoker_hardening_v2.py
            signed209/*.json
            signed209/*.txt
          if-no-files-found: warn
          retention-days: 90
