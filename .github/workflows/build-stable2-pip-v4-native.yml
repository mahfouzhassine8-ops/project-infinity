name: Infinity Stable 2 PiP v4 Native

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-stable2-pip-v4-native.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;34.0.0 platform-tools'

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends unzip curl
          curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

      - name: Download Stable 2 v12
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9987128748/zip" -o /tmp/base.zip
          mkdir -p /tmp/base
          unzip -q /tmp/base.zip -d /tmp/base
          APK=$(find /tmp/base -name '*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" /tmp/base.apk

      - name: Decode Stable 2
        shell: bash
        run: java -jar /tmp/apktool.jar d -f /tmp/base.apk -o /tmp/decoded

      - name: Patch native Android PiP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('/tmp/decoded')
          manifest = root / 'AndroidManifest.xml'
          data = manifest.read_text()
          pat = r'<activity\b[^>]*android:name="com\.projectinfinity\.kodi\.Main"[^>]*>'
          m = re.search(pat, data)
          if not m:
              raise SystemExit('Infinity Main activity not found')
          tag = m.group(0)
          for key, value in (
              ('android:supportsPictureInPicture', 'true'),
              ('android:resizeableActivity', 'true'),
          ):
              if key + '=' in tag:
                  tag = re.sub(re.escape(key) + r'="[^"]*"', key + '="' + value + '"', tag)
              else:
                  tag = tag[:-1] + ' ' + key + '="' + value + '">'
          data = data[:m.start()] + tag + data[m.end():]
          manifest.write_text(data)

          main = None
          for d in sorted(root.glob('smali*')):
              p = d / 'com/projectinfinity/kodi/Main.smali'
              if p.exists():
                  main = p
                  break
          if main is None:
              raise SystemExit('Infinity Main.smali not found')

          s = main.read_text()
          s = re.sub(r'\n\.method protected onUserLeaveHint\(\)V.*?\n\.end method\n', '\n', s, flags=re.S)

          method = '''
.method protected onUserLeaveHint()V
    .locals 4

    invoke-super {p0}, Landroid/app/NativeActivity;->onUserLeaveHint()V

    sget v0, Landroid/os/Build$VERSION;->SDK_INT:I
    const/16 v1, 0x1a
    if-lt v0, v1, :done

    invoke-virtual {p0}, Lcom/projectinfinity/kodi/Main;->isInPictureInPictureMode()Z
    move-result v1
    if-nez v1, :done

    new-instance v1, Landroid/app/PictureInPictureParams$Builder;
    invoke-direct {v1}, Landroid/app/PictureInPictureParams$Builder;-><init>()V

    new-instance v2, Landroid/util/Rational;
    const/16 v0, 0x10
    const/16 v3, 0x9
    invoke-direct {v2, v0, v3}, Landroid/util/Rational;-><init>(II)V

    invoke-virtual {v1, v2}, Landroid/app/PictureInPictureParams$Builder;->setAspectRatio(Landroid/util/Rational;)Landroid/app/PictureInPictureParams$Builder;
    move-result-object v1
    invoke-virtual {v1}, Landroid/app/PictureInPictureParams$Builder;->build()Landroid/app/PictureInPictureParams;
    move-result-object v1
    invoke-virtual {p0, v1}, Lcom/projectinfinity/kodi/Main;->enterPictureInPictureMode(Landroid/app/PictureInPictureParams;)Z

    :done
    return-void
.end method
'''
          main.write_text(s + '\n' + method)
          print('Patched', main)
          PY

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          MAIN=$(find /tmp/decoded -path '*/com/projectinfinity/kodi/Main.smali' | head -1)
          test -n "$MAIN"
          grep -q 'android:supportsPictureInPicture="true"' /tmp/decoded/AndroidManifest.xml
          grep -q 'android:resizeableActivity="true"' /tmp/decoded/AndroidManifest.xml
          grep -q 'onUserLeaveHint()V' "$MAIN"
          grep -q 'enterPictureInPictureMode(Landroid/app/PictureInPictureParams;)Z' "$MAIN"

      - name: Rebuild
        shell: bash
        run: java -jar /tmp/apktool.jar b /tmp/decoded -o /tmp/Infinity-Stable2-PiP-v4-Native-unsigned.apk

      - name: Sign
        shell: bash
        env:
          PASS: infinity${{ github.run_id }}${{ github.run_attempt }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          keytool -genkeypair -keystore /tmp/infinity.keystore -alias infinity -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Infinity Stable 2 PiP v4 Native, O=Infinity, C=US" >/dev/null 2>&1
          "$BT/zipalign" -f 4 /tmp/Infinity-Stable2-PiP-v4-Native-unsigned.apk /tmp/Infinity-Stable2-PiP-v4-Native-aligned.apk
          "$BT/apksigner" sign --ks /tmp/infinity.keystore --ks-key-alias infinity --ks-pass env:PASS --key-pass env:PASS --out /tmp/Infinity-Stable2-PiP-v4-Native.apk /tmp/Infinity-Stable2-PiP-v4-Native-aligned.apk
          "$BT/apksigner" verify --verbose /tmp/Infinity-Stable2-PiP-v4-Native.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Infinity-Stable2-PiP-v4-Native
          path: /tmp/Infinity-Stable2-PiP-v4-Native.apk
          retention-days: 30
