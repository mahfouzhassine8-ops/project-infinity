name: Infinity 1.0.9 | Candidate 2 Manifest Gate Repair

on:
  push:
    branches: [infinity-cobra-full-feature-candidate-2]
    paths:
      - '.github/workflows/infinity-cobra-candidate-2-gate-fix.yml'

permissions:
  contents: write
  actions: read

jobs:
  patch:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Download proven run 39 manifest
        uses: actions/download-artifact@v4
        with:
          name: Infinity-1.0.9-Cobra-Full-Feature-Candidate-2
          path: recovered
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34972144687

      - name: Prove numeric configChanges validator against run 39
        run: |
          set -euo pipefail
          python3 scripts/validate_candidate2_compiled_manifest.py recovered/candidate/manifest.txt

      - name: Patch only the false compiled-manifest gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/infinity_live_app_ci_3.sh')
          text = path.read_text()
          old = "grep -q 'density' candidate/manifest.txt\ngrep -q 'uiMode' candidate/manifest.txt"
          new = "python3 scripts/validate_candidate2_compiled_manifest.py candidate/manifest.txt"
          if text.count(old) != 1:
              raise SystemExit(
                  'Refusing patch: expected Candidate 2 density/uiMode gate '
                  'not found exactly once'
              )
          path.write_text(text.replace(old, new))
          PY

          git diff --check
          git diff -- scripts/infinity_live_app_ci_3.sh
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'scripts/infinity_live_app_ci_3.sh'

      - name: Commit guarded Stage-3 fix
        run: |
          set -euo pipefail
          git config user.name 'Infinity CI Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/infinity_live_app_ci_3.sh
          test "$(git diff --cached --name-only)" = 'scripts/infinity_live_app_ci_3.sh'
          git commit -m 'Fix Candidate 2 compiled manifest validation [skip ci]'
          git push origin HEAD:infinity-cobra-full-feature-candidate-2
