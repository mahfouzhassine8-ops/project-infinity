name: Infinity | Cobra EPG Repair RC1
on:
  workflow_dispatch:
  push:
    branches: [infinity-cobra-epg-repair-rc1]
    paths:
      - 'repairs/cobra-epg-rc1/**'
      - '.github/workflows/cobra-epg-repair-rc1.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: cobra-epg-repair-rc1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  host-regressions:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v5
        with:
          name: Cobra-2103154-Layout-Evidence
          run-id: 35180825737
          github-token: ${{ github.token }}
          path: inherited154
      - name: Apply verified repair to a separate generated source
        run: |
          mkdir -p epg-evidence
          python3 repairs/cobra-epg-rc1/apply_epg_repair.py --source inherited154/preflight/2103154-final.java.in --output epg-evidence/InfinityLiveActivity.java.in --receipt epg-evidence/repair-receipt.json
      - name: Execute original 41 cases and 25 new edge cases
        run: python3 repairs/cobra-epg-rc1/tests/run_tests.py --source epg-evidence/InfinityLiveActivity.java.in --out epg-evidence/host
      - name: Exercise production short guide request with structured transport doubles
        run: python3 repairs/cobra-epg-rc1/tests/run_short.py --source epg-evidence/InfinityLiveActivity.java.in --host epg-evidence/host --out epg-evidence/short
      - name: Preserve inherited parser and layout assertions
        run: python3 repairs/cobra-epg-rc1/tests/run_inherited.py --source epg-evidence/InfinityLiveActivity.java.in --repository . --mode-harness inherited154/preflight/mode-regressions/CobraModesHarness.java --out epg-evidence/inherited
      - name: Verify patcher rejects unknown baselines and preserves player and layout members
        run: python3 repairs/cobra-epg-rc1/tests/run_guards.py --source inherited154/preflight/2103154-final.java.in --out epg-evidence/guards
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Cobra-EPG-Repair-RC1-Host-Evidence
          path: epg-evidence/
          if-no-files-found: error
          retention-days: 90
  android-java-compile:
    needs: host-regressions
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      NDK_VER: 21.4.7075529
      RUNTIME_COMMIT: b42760a25a27d23baa5db5770824cb8d32ec2290
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cce2de3042cca22b531fa8ed9e13659c19dab8a4
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: refinement-delta
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v5
        with:
          name: Infinity-1.0.9-Cobra-Full-Feature-Candidate-2
          run-id: 35044752997
          github-token: ${{ github.token }}
          path: run40
      - uses: actions/download-artifact@v5
        with:
          name: Cobra-2103154-Layout-Evidence
          run-id: 35180825737
          github-token: ${{ github.token }}
          path: inherited154
      - uses: actions/download-artifact@v5
        with:
          name: Cobra-EPG-Repair-RC1-Host-Evidence
          path: host-results
      - name: Reconstruct immutable shell and compile repaired production Java only
        run: |
          python3 -m pip install pyyaml
          python3 refinement-delta/repairs/cobra-epg-rc1/ci_compile.py --evidence inherited154 --host-results host-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Cobra-EPG-Repair-RC1-Android-Compile-Evidence
          path: |
            compile-evidence/
            engine/background-resume-source.json
            engine/native-before.patch
            preflight/2103153-refinement.json
          if-no-files-found: warn
          retention-days: 90
