name: Infinity | 2103258 Glass Settings Light Dark RC1
on:
  workflow_dispatch:
  push:
    branches: [infinity-2103258-glass-settings-light-dark-rc1]
    paths:
      - '.github/workflows/infinity-2103258-glass-settings.yml'
      - 'repairs/glass-settings-2103258/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-glass-settings-${{ github.ref }}
  cancel-in-progress: false
env:
  NDK_VER: 21.4.7075529
jobs:
  settings-verification:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Download exact passed 2103257 APK
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103257-Glass-Chooser-Light-Dark-RC1-TEST-CANDIDATE
          run-id: 36302398518
          github-token: ${{ github.token }}
          path: parent257
      - name: Download exact source and chooser evidence
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103257-Glass-Chooser-Light-Dark-RC1-Evidence
          run-id: 36302398518
          github-token: ${{ github.token }}
          path: source257
      - name: Verify exact parent and reuse engine and diagnostic recorder
        run: |
          set -euo pipefail
          test "$(sha256sum source257/reconstructed-2103257-shell.tar.gz | cut -d' ' -f1)" = '87a00611987a0a0575055b578578082428179d22add905b56c9fd4fef35365fc'
          test "$(sha256sum parent257/Infinity-2103257-Glass-Chooser-Light-Dark-RC1.apk | cut -d' ' -f1)" = 'bc0ff18f0edf6c55eef7caa4582917738d0488c1ab58365f0669065d105867df'
          tar -xzf source257/reconstructed-2103257-shell.tar.gz
          python3 - <<'PY'
          import zipfile,hashlib
          from pathlib import Path
          with zipfile.ZipFile('parent257/Infinity-2103257-Glass-Chooser-Light-Dark-RC1.apk') as z:
              assert z.testzip() is None and len(z.namelist())==len(set(z.namelist()))
              assert hashlib.sha256(z.read('lib/arm64-v8a/libkodi.so')).hexdigest()=='c7976ce0adb45b9264f2092a27111be4e05bde4220be2b26b1ea0e2cc74f1e2d'
              Path('engine/libinfinitycrash.so').write_bytes(z.read('lib/arm64-v8a/libinfinitycrash.so'))
          PY
      - name: Patch only options presentation and prove exact callback preservation
        run: |
          set -euo pipefail
          python3 repairs/glass-settings-2103258/apply.py --root . --evidence audit258
          mkdir -p audit258/gesture-preserved
          cp source257/gesture-preserved/InfinityLiveActivity-before.java.in audit258/gesture-preserved/
          python3 repairs/cobra-no-hold-2103256/test_gesture.py --source shell-kodi --evidence audit258/gesture-preserved
      - name: Prepare matched Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0' "ndk;$NDK_VER" >/dev/null
      - name: Compile Android UI only and sign test candidate
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
          python3 scripts/package_background_resume.py --source shell-kodi --base-apk parent257/Infinity-2103257-Glass-Chooser-Light-Dark-RC1.apk --build-dir build258 --out signed258 2>&1 | tee audit258/android-build.log
      - name: Test all four settings panels plus prior chooser and render actual Views
        run: |
          set -euo pipefail
          python3 repairs/glass-settings-2103258/stage_tests.py --build-dir build258 --evidence audit258/screenshots
          export KODI_ANDROID_KEY_ALIAS=androiddebugkey KODI_ANDROID_KEY_PASSWORD=android KODI_ANDROID_STORE_PASSWORD=android
          export KODI_ANDROID_STORE_FILE="$HOME/.android/debug.keystore"
          cd build258
          ./gradlew --no-daemon --console=plain :xbmc:testReleaseUnitTest --tests com.projectinfinity.kodi.GlassChooserTest --tests com.projectinfinity.kodi.GlassOptionsTest 2>&1 | tee ../audit258/android-view-tests.log
      - name: Gate publication on all tests and byte-identical native and chooser payload
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,sys,xml.etree.ElementTree as ET
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from package_background_resume import verify_bytes
          parent=Path('parent257/Infinity-2103257-Glass-Chooser-Light-Dark-RC1.apk')
          apk=Path('signed258/Infinity-2103258-Glass-Settings-Light-Dark-RC1.apk')
          kept=verify_bytes(parent,apk)
          for name,expected in [('GlassChooserTest',6),('GlassOptionsTest',7)]:
              t=ET.parse('build258/xbmc/build/test-results/testReleaseUnitTest/TEST-com.projectinfinity.kodi.'+name+'.xml').getroot()
              assert int(t.attrib['tests'])==expected
              assert all(int(t.attrib.get(k,0))==0 for k in ['failures','errors','skipped'])
          screenshots=sorted(p.name for p in Path('audit258/screenshots').glob('*.png'));assert len(screenshots)==12
          for name in ['infinity','cobra']:
              for mode in ['light','dark']:assert name+'-settings-'+mode+'.png' in screenshots
          source=json.loads(Path('audit258/source-verification.json').read_text())
          assert source['all_other_source_files_byte_identical']==225
          assert source['settings_callbacks_byte_identical'] and source['chooser_source_and_art_byte_identical']
          result=json.loads(Path('signed258/background-resume-apk-audit.json').read_text());result.update(kept)
          result.update(source_verification=source,android_test_methods=13,settings_variants_rendered=4,
              prior_chooser_screenshots=8,settings_callback_harness=True,physical_device_verified=False,
              stable_lock=False,startup_sound_integrated=False,historical_startup_hang_fixed=False)
          Path('signed258/CANDIDATE-VERIFICATION.json').write_text(json.dumps(result,indent=2)+'\n')
          Path('signed258/SHA256SUMS.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'  '+apk.name+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Preserve reconstructed source and test evidence
        if: always()
        run: |
          mkdir -p audit258
          cp -r repairs/glass-settings-2103258 audit258/repair-source
          if [ -d build258/xbmc/build/test-results ]; then cp -r build258/xbmc/build/test-results audit258/; fi
          if [ -d shell-kodi ] && [ -f engine/background-resume-source.json ]; then
            tar -czf audit258/reconstructed-2103258-shell.tar.gz shell-kodi engine/background-resume-source.json scripts/package_background_resume.py scripts/infinity_background_resume.py
          fi
      - name: Publish signed PHONE TEST CANDIDATE
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103258-Glass-Settings-Light-Dark-RC1-TEST-CANDIDATE
          path: signed258/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
      - name: Publish all four settings renders and verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103258-Glass-Settings-Light-Dark-RC1-Evidence
          path: audit258/
          if-no-files-found: error
          retention-days: 90
