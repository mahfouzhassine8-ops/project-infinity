name: Infinity Search native-owned fresh provider result correction | HOST
on:
  push:
    branches: [work/infinity-search-native-owned-response-20261107]
    paths:
      - .github/workflows/infinity-native-owned-response-candidate-20261107.yml
      - repairs/infinity-master-corrective-20261105/overlay/assets/addons/script.infinity.commandcenter/infinity_search.py
      - repairs/infinity-2103460-nine-corrections-20261106/fold-regressions/**
permissions: {contents: read}
concurrency:
  group: infinity-native-owned-search-host-20261107
  cancel-in-progress: true
jobs:
  common-provider-native-result:
    name: Existing Search UI + fresh native result policy + frozen-source review
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env: {PYTHONDONTWRITEBYTECODE: '1'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - name: No touch/Cobra/native/signer/provider source changed
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import subprocess
          base='c75e6de691cc6263236d778cd16b50573e7eb348'
          allowed={
            '.github/workflows/infinity-native-owned-response-candidate-20261107.yml',
            'repairs/infinity-master-corrective-20261105/overlay/assets/addons/script.infinity.commandcenter/infinity_search.py',
            'repairs/infinity-2103460-nine-corrections-20261106/fold-regressions/test_native_owned_response_policy.py',
            'repairs/infinity-2103460-nine-corrections-20261106/fold-regressions/test_unified_native_provider_selection.py',
            'repairs/infinity-2103460-nine-corrections-20261106/fold-regressions/NATIVE-OWNED-RESPONSE-POLICY.md'
          }
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert changed==allowed, ('Unexpected or missing changes', sorted(changed ^ allowed))
          print('PASS exact source scope: one Search production function, two tests, one policy doc, one CI workflow')
          PY
          git diff --name-only c75e6de691cc6263236d778cd16b50573e7eb348 HEAD | tee evidence/CHANGED-FILES.txt
          python3 -m py_compile repairs/infinity-master-corrective-20261105/overlay/assets/addons/script.infinity.commandcenter/infinity_search.py
      - name: Run original nine native Search UI contracts, updated for scoped one-function change
        run: |
          set -euo pipefail
          cd repairs/infinity-2103460-nine-corrections-20261106/fold-regressions
          python3 -m unittest test_unified_native_provider_selection -v 2>&1 | tee "$GITHUB_WORKSPACE/evidence/ORIGINAL-SEARCH-CONTRACT.txt"
      - name: Run fresh-provider-result + cache/manifest/disable/source safety matrix
        run: |
          set -euo pipefail
          cd repairs/infinity-2103460-nine-corrections-20261106/fold-regressions
          python3 -m unittest test_native_owned_response_policy -v 2>&1 | tee "$GITHUB_WORKSPACE/evidence/NATIVE-FRESH-POLICY.txt"
      - name: Explicit release gates
        if: always()
        run: |
          printf '%s\n' 'SOURCE/UNIT HOST ONLY. Semantics: fresh completed native-provider results are authoritative even if provider/dependency settings metadata changes.' 'Meaningful config and A-B-A within the provider request are delegated to the native provider; this is NOT verified snapshot consistency.' 'No APK, signing, installation, full Android Search integration, Fold testing, updated signer/recovery verification, or promotion to original locked baseline.' > evidence/RELEASE-LIMITS.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-Search-NativeOwned-Host-${{ github.run_id }}-NO-APK
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
