name: Infinity 2103377 | Rails handoff RC1 signed TEST APK

on:
  push:
    branches: [work/infinity-2103377-rails-handoff-rc1]
    paths:
      - '.github/workflows/infinity-rails-handoff-rc1-signed.yml'
      - 'repairs/rails-handoff-package-2103377/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: infinity-2103377-rails-handoff-rc1-signing
  cancel-in-progress: false

jobs:
  signed-test-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      NDK_VER: 21.4.7075529
    steps:
      - name: Checkout isolated packaging source
        uses: actions/checkout@v7
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Verify exact green native and protected signed Rails parent runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          pinned={
              38732470818:"78826902c0a55a24b488b5b7fc69b378cebc6df8",
              38629545799:"da6f640a27265e64ce43ee264690e1c92dc8ea40"
          }
          for run,commit in pinned.items():
              url="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+str(run)
              req=urllib.request.Request(url,headers={
                 "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                 "Accept":"application/vnd.github+json"})
              with urllib.request.urlopen(req,timeout=40) as response:
                  result=json.load(response)
              assert result["head_sha"]==commit,(run,"wrong signed/native source")
              if run==38732470818:
                  import time
                  for attempt in range(180):
                      if result["status"]=="completed":break
                      if attempt%10==0:
                          print("Awaiting pinned native completion",run,"cycle",attempt,flush=True)
                      time.sleep(30)
                      with urllib.request.urlopen(req,timeout=40) as response:
                          result=json.load(response)
                      assert result["head_sha"]==commit,(run,"unexpected native source")
                  else:
                      raise RuntimeError("Native build has not completed after 90 minutes")
              assert result["status"]=="completed" and result["conclusion"]=="success",(run,"not green")
              print("Verified immutable green source",run,commit,flush=True)
          PY
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-linux-21.4.7075529-v1
      - name: Restore pinned NDK for symbol-preserving native-only package
        run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - uses: actions/download-artifact@v8
        with:
          run-id: 38629545799
          name: Infinity-Rails-Hold-RC02-Signed-APK
          github-token: ${{ github.token }}
          path: parent-rails
      - uses: actions/download-artifact@v8
        with:
          run-id: 38732470818
          name: Infinity-2103377-Rails-Handoff-RC1-Native-Evidence
          github-token: ${{ github.token }}
          path: native-evidence
      - name: Package signed APK with permanent certificate and byte-level payload checks
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 -m py_compile repairs/rails-handoff-package-2103377/package_candidate.py
          mkdir -p rails-handoff-test-delivery
          python3 repairs/rails-handoff-package-2103377/package_candidate.py \
            --parent parent-rails/Infinity-2103377-Rails-Hold-Native-RC2-TEST.apk \
            --native native-evidence \
            --native-source-commit 78826902c0a55a24b488b5b7fc69b378cebc6df8 \
            --out rails-handoff-test-delivery \
            2>&1 | tee rails-handoff-test-delivery/PACKAGING-VERIFICATION.log
          cat > rails-handoff-test-delivery/TEST-AND-ROLLBACK.md <<'MD'
          # Infinity 2103377 — Rails Handoff RC1 (experimental)

          TEST ONLY, NOT LOCKED OR PHYSICALLY VERIFIED.
          Exact parent: signed Rails Hold RC02, SHA256
          17e2458552b7dbb8f14dad307015eafc2497a5ec6ddc4f7bb1707d975f37b906.
          Matched ARM64 native run 38732470818, commit 78826902c0a55a24b488b5b7fc69b378cebc6df8.

          Changes only the Kodi native library and AndroidManifest versionName.
          Preserves signer, versionCode 2103377, all 17 save owners, Python RC1,
          Mocha Rails, skin 1.0.5.223, helper versions, playback and data.
          Promotes only Movie/TV Add-on Rail directory requests from LOW to
          NORMAL priority and discards obsolete rail callback IDs/URLs.

          Test TV-first -> Movies and Movies-first -> TV after cold open;
          repeated switching, Mocha holds, regular taps, quick/full shutdown,
          and save receipts. No Android ANR permitted before acceptance.

          Keep protected Rails Hold RC02 APK for in-place rollback. Never
          uninstall, clear data, change skin, or reset provider settings.
          Physical Fold validation and explicit user lock are still required.
          MD
      - name: Upload isolated signed APK and preservation receipts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103377-Rails-Handoff-RC1-Signed-Test-APK
          path: rails-handoff-test-delivery/
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
      - name: Preserve failure receipts without falsely publishing test APK
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103377-Rails-Handoff-RC1-Package-Failure
          path: rails-handoff-test-delivery/
          retention-days: 30
          if-no-files-found: warn
