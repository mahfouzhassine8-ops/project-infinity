name: Infinity 2103377 | Disposable emulator setup control
# Infrastructure-only control. This does not test, sign or promote an APK.
on:
  push:
    branches: [work/infinity-2103377-essential-first-shutdown-only]
    paths: ['.github/workflows/infinity-emulator-setup-verification.yml']
  workflow_dispatch:

permissions: {contents: read}
concurrency: {group: 'infinity-2103377-emulator-setup-only-${{ github.sha }}', cancel-in-progress: true}

jobs:
  disposable-emulator-setup:
    name: Actual stable SDK install, Linux loader and executable revision
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.7'}
      - name: Verify bounded setup retries and retained genuine failures
        run: python3 repairs/android-checkpoint-shutdown/runtime-tests/test_prepare_android_emulator.py
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install emulator runtime library before executable verification
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0
      - name: Prepare verified emulator with bounded invalid-ZIP retry
        run: python3 repairs/android-checkpoint-shutdown/runtime-tests/prepare_android_emulator.py --out emulator-setup-only-evidence
      - name: Retain actual infrastructure result and all download/loader logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103377-Emulator-Setup-Only-Evidence
          path: emulator-setup-only-evidence/
          retention-days: 90
          if-no-files-found: warn
