name: Infinity | 2103217 Media Return Context

on:
  workflow_dispatch:
  push:
    branches: [infinity-cobra-2103217-media-return-context-rc1]
    paths:
      - '.github/workflows/infinity-2103217-media-return-context.yml'
      - 'repairs/media-return-context-2103217/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: infinity-2103217-${{ github.sha }}
  cancel-in-progress: false

jobs:
  package-and-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Download exact successful 2103208 presentation parent
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103208-Integration-Polish-TEST-CANDIDATE-Replica-1-Attempt-1
          run-id: 35676573761
          github-token: ${{ github.token }}
          path: baseline208

      - name: Download preserved 2103209 native engine
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103209-Python311-GIL-Native-Engine
          run-id: 35693288744
          github-token: ${{ github.token }}
          path: native209

      - name: Reconstruct exact protected chain through locked 2103216
        run: |
          set -euo pipefail
          mkdir -p audit217 engine
          cp native209/pythoninvoker-threadstate-v2-source.json engine/pythoninvoker-threadstate-v2-source.json
          cp native209/pythoninvoker-threadstate-v2-source.stage1.json engine/pythoninvoker-threadstate-v2-source.stage1.json
          python3 repairs/python311-gil-2103209/ci.py prepare             --base-dir baseline208             --native-apk native209/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2-Engine-Base.apk             --shell shell-kodi             --out audit217/native-base
          python3 repairs/cobra-media-library-health-2103210/apply.py --shell shell-kodi
          python3 repairs/cobra-library-health-2103211/apply.py --shell shell-kodi
          python3 repairs/health-media-trim-2103212/apply.py --shell shell-kodi
          python3 repairs/live-blue-ambient-settings-return-2103213/apply.py --shell shell-kodi
          python3 repairs/media-details-final-2103214/apply.py --shell shell-kodi
          python3 repairs/smart-return-experience-drawer-2103215/apply.py --shell shell-kodi
          python3 repairs/smart-return-experience-display-2103216/apply.py --shell shell-kodi
          grep -F '"version_code": 2103216' engine/background-resume-source.json
          grep -F '"smart_return_location": "Cobra Settings > Experience & Display"' engine/background-resume-source.json

      - name: Apply media return context correction
        run: |
          set -euo pipefail
          python3 repairs/media-return-context-2103217/apply.py --shell shell-kodi
          grep -F 'cobraCaptureVodLandingReturn(series)' shell-kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          grep -F 'cobraRestoreVodLandingReturn()' shell-kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          grep -F '"COBRA • TV SHOWS".equals(mCobraStageTitle)' shell-kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          grep -F 'cobra_smart_return_experience_display' shell-kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          ! grep -F 'cobra_settings_return' shell-kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in

      - name: Create intermediate Android build keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v             -keystore "$HOME/.android/debug.keystore"             -storepass android             -alias androiddebugkey             -keypass android             -dname "CN=Android Debug,O=Android,C=US"             -keyalg RSA -keysize 2048 -validity 10000

      - name: Build sign and verify 2103217
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 scripts/package_background_resume.py             --source shell-kodi             --base-apk audit217/native-base/Infinity-2103208-Python311-GIL-Patched-Base.apk             --build-dir build217             --out signed217
          python3 repairs/media-return-context-2103217/verify.py             --final signed217/Infinity-1.0.9-Cobra-Media-Return-Context-RC1.apk             --audit signed217/background-resume-apk-audit.json             --base audit217/native-base/Infinity-2103208-Python311-GIL-Patched-Base.apk

      - name: Publish 2103217 TEST CANDIDATE
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103217-Media-Return-Context-TEST-CANDIDATE
          path: signed217/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Preserve 2103217 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103217-Media-Return-Context-Evidence
          path: |
            audit217/
            engine/background-resume-source.json
            repairs/media-return-context-2103217/
            signed217/*.json
            signed217/*.txt
          if-no-files-found: warn
          retention-days: 90
