name: Infinity | System stability verified-series candidate 2103366
on:
  workflow_dispatch:
  push:
    branches: [work/infinity-system-stability-scope-2103366]
    paths:
      - 'repairs/android-checkpoint-shutdown/**'
      - 'repairs/chooser-weather-snapshot-2103302/**'
      - '.github/workflows/infinity-2103366-system-stability-scope.yml'
      - 'tools/checkpoint-apk/**'
permissions: {contents: read, actions: read}
# The previous native batch populates validated dependency/compiler caches.
# The final source compiles with its own script pins; no old engine is packaged.
concurrency: {group: infinity-system-stability-scope-2103366, cancel-in-progress: true}
env:
  NDK_VER: 21.4.7075529
jobs:
  android-shell:
    if: github.ref == 'refs/heads/work/infinity-system-stability-scope-2103366'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Restore pinned NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-${{ runner.os }}-21.4.7075529-v1
      - name: Install and verify pinned Android toolchain with retry
        run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 37735801149
          name: Infinity-2103335-Delivery-Evidence
          github-token: ${{ github.token }}
          path: checkpoint-parent
      - uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 37735801149
          name: Infinity-2103335-Native-Trace-Bridge-RC1-APK
          github-token: ${{ github.token }}
          path: checkpoint-base
      - name: Verify protected shell and stage complete Android compilation
        run: |
          set -euo pipefail
          mkdir -p checkpoint-source checkpoint-android "$HOME/.android"
          tar --no-same-owner -xzf checkpoint-parent/repaired-shell-source.tar.gz -C checkpoint-source
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Compile Only,O=Android,C=US'
          python3 repairs/android-checkpoint-shutdown/system-stability-2103366/test_source_contracts.py
          python3 repairs/android-checkpoint-shutdown/test_android_assets.py --base checkpoint-base/Infinity-2103335-Native-Trace-Bridge-RC1.apk
          python3 repairs/chooser-weather-snapshot-2103302/test_weather_snapshot.py
          python3 tools/checkpoint-apk/package.py stage --engine checkpoint-engine --source checkpoint-source/shell-kodi --base checkpoint-base/Infinity-2103335-Native-Trace-Bridge-RC1.apk --build checkpoint-shell-build --out checkpoint-android
      - name: Compile every Java class and run inherited exporter tests
        env:
          KODI_ANDROID_KEY_ALIAS: androiddebugkey
          KODI_ANDROID_KEY_PASSWORD: android
          KODI_ANDROID_STORE_PASSWORD: android
          KODI_ANDROID_STORE_FILE: /home/runner/.android/debug.keystore
        run: |
          set -euo pipefail
          : > checkpoint-android/compile.log
          built=false
          for attempt in 1 2 3; do
            if ./checkpoint-shell-build/gradlew --no-daemon --console=plain -p checkpoint-shell-build :xbmc:testReleaseUnitTest :xbmc:assembleRelease 2>&1 | tee -a checkpoint-android/compile.log; then
              built=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          [ "$built" = true ]
          python3 repairs/android-checkpoint-shutdown/runtime_delta.py verify --group android --source checkpoint-source/shell-kodi
      - name: Retain compiled shell for packaging without recompilation
        run: tar -czf checkpoint-android/runtime-shell-source.tar.gz -C checkpoint-source shell-kodi
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103366-Android-Donor-Internal
          path: checkpoint-shell-build/xbmc/build/outputs/apk/release/xbmc-release.apk
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-Checkpoint-Work-Android-Validation
          path: |
            checkpoint-android/
            checkpoint-shell-build/xbmc/build/test-results/testReleaseUnitTest/
            checkpoint-shell-build/xbmc/build/reports/tests/testReleaseUnitTest/
          retention-days: 90
          if-no-files-found: error
  native-engine:
    if: github.ref == 'refs/heads/work/infinity-system-stability-scope-2103366'
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    env:
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - name: Restore pinned NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-${{ runner.os }}-21.4.7075529-v1
      - name: Install and verify pinned Android toolchain with retry
        run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - name: Let the preceding native batch finish and publish its dependency cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          base='https://api.github.com/repos/mahfouzhassine8-ops/project-infinity/actions/runs/38108460557'
          def get(url):
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=60) as response:return json.load(response)
          assert get(base)['head_sha']=='055c3f614d3927bbfacffc9d5e9749b38e16fb49'
          deadline=time.monotonic()+6*60*60
          while time.monotonic()<deadline:
              job=next((j for j in get(base+'/jobs?per_page=100')['jobs'] if j['name']=='native-engine'),None)
              if job and job['status']=='completed':
                  assert job['conclusion'] in ('success','failure'),'Unfinished/cancelled predecessor cache is not accepted'
                  print('Predecessor settled:',job['conclusion'],'— compiled engine is not reused; dependencies still require their exact completion proof')
                  break
              print('Waiting for the existing dependency/native batch',flush=True)
              time.sleep(60)
          else:raise RuntimeError('Predecessor wait expired; refusing a duplicate unverified dependency build')
          PY
      - name: Restore work-branch preservation-parent dependencies
        id: parent-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            android-tools/INFINITY-DEPENDENCIES-COMPLETE.json
            ~/.ccache
          key: infinity-checkpoint-3334-deps-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            infinity-checkpoint-3334-deps-${{ runner.os }}-38108460557
            infinity-checkpoint-3334-deps-${{ runner.os }}-38095227571
            infinity-checkpoint-3334-deps-${{ runner.os }}-38086419225
            infinity-checkpoint-3334-deps-${{ runner.os }}-38077503263
            infinity-checkpoint-3334-deps-${{ runner.os }}-37988206145
            infinity-checkpoint-3334-deps-${{ runner.os }}-37924572074
            infinity-checkpoint-3334-deps-${{ runner.os }}-37912556867
            infinity-checkpoint-3334-deps-${{ runner.os }}-37903323079
            infinity-checkpoint-3334-deps-${{ runner.os }}-
      - name: Reconstruct protected lineage and run source and persistence gates
        run: |
          set -euo pipefail
          mkdir -p checkpoint-build
          sudo apt-get update -qq
          sudo apt-get install -y python3-yaml python3-dev libsqlite3-dev libssl-dev
          python3 repairs/android-checkpoint-shutdown/system-stability-2103366/test_source_contracts.py
          python3 repairs/android-checkpoint-shutdown/native_ci.py prepare 2>&1 | tee checkpoint-build/prepare.log
      - name: Compile reviewed native runtime integration
        run: |
          set -euo pipefail
          python3 repairs/android-checkpoint-shutdown/native_ci.py verify-dependencies
          python3 repairs/android-checkpoint-shutdown/native_ci.py compile --completed-cache 2>&1 | tee checkpoint-build/compile.log
      - name: Preserve dependencies for subsequent work-branch builds
        uses: actions/cache/save@v4
        if: always() && !cancelled()
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            android-tools/INFINITY-DEPENDENCIES-COMPLETE.json
            ~/.ccache
          key: infinity-checkpoint-3334-deps-${{ runner.os }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-Checkpoint-Work-Native-Validation
          path: |
            checkpoint-build/
            !checkpoint-build/libkodi.so
          compression-level: 1
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-Checkpoint-Work-Native-Internal
          path: checkpoint-build/libkodi.so
          compression-level: 1
          retention-days: 90
          if-no-files-found: error
  package-test-apk:
    needs: [android-shell, native-engine]
    if: github.ref == 'refs/heads/work/infinity-system-stability-scope-2103366'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: '${{ github.sha }}'}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - name: Restore pinned NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-${{ runner.os }}-21.4.7075529-v1
      - name: Install and verify pinned Android toolchain with retry
        run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - name: Install host crypto contract test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y python3-dev libssl-dev
      - name: Verify packaging gates
        run: |
          python3 tools/checkpoint-apk/test_package.py
          python3 tools/checkpoint-apk/test_verify_2103361.py
          python3 tools/checkpoint-apk/test_verify_2103364_android_only.py
          python3 tools/checkpoint-apk/test_verify_2103365.py
          python3 repairs/android-checkpoint-shutdown/system-stability-2103366/test_source_contracts.py
      - uses: actions/download-artifact@v8
        with:
          run-id: 37735801149
          name: Infinity-2103335-Delivery-Evidence
          github-token: ${{ github.token }}
          path: parent
      - uses: actions/download-artifact@v8
        with:
          run-id: 37735801149
          name: Infinity-2103335-Native-Trace-Bridge-RC1-APK
          github-token: ${{ github.token }}
          path: base
      - uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: ${{ github.run_id }}
          name: Infinity-Checkpoint-Work-Native-Internal
          github-token: ${{ github.token }}
          path: engine
      - uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: ${{ github.run_id }}
          name: Infinity-Checkpoint-Work-Native-Validation
          github-token: ${{ github.token }}
          path: engine-proof
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.run_id }}
          name: Infinity-2103366-Android-Donor-Internal
          github-token: ${{ github.token }}
          path: shell/xbmc/build/outputs/apk/release
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.run_id }}
          name: Infinity-Checkpoint-Work-Android-Validation
          github-token: ${{ github.token }}
          path: evidence
      - name: Check exact green preservation comparator
        run: python3 tools/checkpoint-apk/test_verify_2103362.py
      - name: Check signed APK crypto contracts
        run: python3 repairs/android-checkpoint-shutdown/writers/test_crypto_contract.py --runtime repairs/android-checkpoint-shutdown/runtime/native/overlay --apk base/Infinity-2103335-Native-Trace-Bridge-RC1.apk
      - name: Restore already compiled shell and associated native proof
        run: |
          set -euo pipefail
          cp engine-proof/ENGINE-PROOF.json engine/ENGINE-PROOF.json
          cp evidence/checkpoint-android/COMPAT-ASSET-ASSOCIATION.json evidence/COMPAT-ASSET-ASSOCIATION.json
          mkdir -p source
          tar --no-same-owner -xzf evidence/checkpoint-android/runtime-shell-source.tar.gz -C source
      - uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 38100173431
          name: Infinity-2103365-Android-Close-RC1-APK
          github-token: ${{ github.token }}
          path: installed-baseline
      - name: Associate green engine and verify preserved payload and permanent signer
        env:
          GITHUB_SHA: ${{ github.sha }}
          INFINITY_ENGINE_SOURCE_COMMIT: ${{ github.sha }}
          INFINITY_NATIVE_RUN_ID: ${{ github.run_id }}
          INFINITY_ANDROID_RUN_ID: ${{ github.run_id }}
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 tools/checkpoint-apk/package.py package --source source/shell-kodi --base base/Infinity-2103335-Native-Trace-Bridge-RC1.apk --build shell --out evidence --engine engine
      - name: Verify exact protected 2103365 payload and reviewed integration delta
        run: python3 tools/checkpoint-apk/verify_2103365.py --baseline installed-baseline/Infinity-2103365-Android-Close-RC1.apk --candidate evidence/Infinity-2103366-System-Stability-RC2.apk --report evidence/GREEN-2103365-SYSTEM-STABILITY.json
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103366-System-Stability-RC2-APK
          path: evidence/Infinity-2103366-System-Stability-RC2.apk
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103366-System-Stability-Evidence
          path: |
            evidence/
            !evidence/*.apk
            !evidence/*.so
            shell/xbmc/build/test-results/testReleaseUnitTest/
          retention-days: 90
          if-no-files-found: error
