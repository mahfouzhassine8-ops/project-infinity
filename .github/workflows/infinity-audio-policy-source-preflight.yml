name: Infinity Audio Policy | Source Preparation
on:
  workflow_dispatch:
  push:
    branches: [infinity-1.0.8-audio-policy-integration]
    paths: ['.github/workflows/infinity-audio-policy-source-preflight.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Export pinned source inputs without signing secrets or device data
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' >/dev/null
          mkdir -p export/project export/responsive export/kodi export/android-tools
          git archive HEAD scripts patches addons tests .github/workflows docs | tar -x -C export/project
          git fetch --depth=1 origin 9407bd8e14b02b435f86333da2e4469467eaa151
          git archive 9407bd8e14b02b435f86333da2e4469467eaa151 scripts patches addons tests .github/workflows | tar -x -C export/responsive
          git clone --depth=1 --branch 21.3-Omega https://github.com/xbmc/xbmc.git kodi
          test "$(git -C kodi rev-parse HEAD)" = a3a448d26b8d560a65655dab2cd122994dc4e146
          git -C kodi archive HEAD | tar -x -C export/kodi
          find export -type f \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff*' \) -delete
          cp "$ANDROID_HOME/platforms/android-34/android.jar" export/android-tools/
          cp "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar" export/android-tools/
          cp "$ANDROID_HOME/build-tools/34.0.0/lib/d8.jar" export/android-tools/
          cp "$ANDROID_HOME/build-tools/34.0.0/aapt" export/android-tools/
          cp "$ANDROID_HOME/build-tools/34.0.0/zipalign" export/android-tools/
          printf '%s\n' "project=$GITHUB_SHA" 'responsive=9407bd8e14b02b435f86333da2e4469467eaa151' 'kodi=a3a448d26b8d560a65655dab2cd122994dc4e146' > export/INPUTS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-Audio-Policy-Source-Inputs
          path: export/
          if-no-files-found: error
          retention-days: 7
