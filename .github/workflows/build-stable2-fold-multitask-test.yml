name: Infinity Stable 2 Fold and Multitask Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-stable2-fold-multitask-test.yml'
      - 'scripts/patch-native-fold-multitask-test.py'
      - 'scripts/patch-fold-multitask-manifest.py'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;33.0.1' 'ndk;21.4.7075529'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            autoconf bison build-essential curl flex gawk git gperf \
            lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev \
            unzip zip zlib1g-dev python3 ccache

      - name: Clone untouched official Kodi 21.2 Omega source
        run: |
          set -euo pipefail
          git clone --depth=1 --branch 21.2-Omega https://github.com/xbmc/xbmc.git /tmp/xbmc
          grep -q 'VERSION_MAJOR 21' /tmp/xbmc/version.txt
          grep -q 'VERSION_MINOR 2' /tmp/xbmc/version.txt

      - name: Apply fold and multitask native lifecycle patch
        run: python3 scripts/patch-native-fold-multitask-test.py

      - name: Verify NO silver-line renderer patch is present
        run: |
          set -euo pipefail
          APP=/tmp/xbmc/xbmc/platform/android/activity/XBMCApp.cpp
          RENDERER=/tmp/xbmc/xbmc/cores/VideoPlayer/VideoRenderers/LinuxRendererGLES.cpp
          grep -q 'Infinity Fold Test' "$APP"
          grep -q 'GUI_MSG_WINDOW_RESIZE' "$APP"
          ! grep -q 'Infinity PiP v5.3 - surgical renderer bypass' "$RENDERER"
          ! grep -q 'Infinity PiP renderer surface map' "$RENDERER"
          echo 'Verified: fold/multitask test only; no silver-line renderer modification.'

      - name: Build Kodi Android dependency mesh
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -euo pipefail
          cd /tmp/xbmc/tools/depends
          ./bootstrap
          ./configure \
            --with-tarballs=/tmp/xbmc-tarballs \
            --host=aarch64-linux-android \
            --with-sdk-path="$ANDROID_HOME" \
            --with-ndk-path="$ANDROID_HOME/ndk/21.4.7075529" \
            --prefix=/tmp/xbmc-depends \
            --disable-debug
          make -j2

      - name: Configure Kodi native build
        run: |
          set -euo pipefail
          mkdir -p /tmp/xbmc-build
          make -C /tmp/xbmc/tools/depends/target/cmakebuildsys BUILD_DIR=/tmp/xbmc-build

      - name: Build fold and multitask native core
        run: |
          set -euo pipefail
          cmake --build /tmp/xbmc-build --parallel 2
          LIB=$(find /tmp/xbmc-build -type f -name 'libkodi.so' | head -1)
          test -n "$LIB"
          cp "$LIB" /tmp/libkodi-fold-multitask-test.so
          file /tmp/libkodi-fold-multitask-test.so
          sha256sum /tmp/libkodi-fold-multitask-test.so

      - name: Install APK patching tools
        run: |
          curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

      - name: Download Stable 2 v12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9987128748/zip" \
            -o /tmp/base.zip
          mkdir -p /tmp/base
          unzip -q /tmp/base.zip -d /tmp/base
          APK=$(find /tmp/base -name '*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" /tmp/base.apk

      - name: Decode Stable 2
        run: java -jar /tmp/apktool.jar d -f /tmp/base.apk -o /tmp/decoded

      - name: Apply foldable and multitask manifest configuration
        run: python3 scripts/patch-fold-multitask-manifest.py

      - name: Inject fold and multitask native core
        run: |
          set -euo pipefail
          TARGET=/tmp/decoded/lib/arm64-v8a/libkodi.so
          test -f "$TARGET"
          cp /tmp/libkodi-fold-multitask-test.so "$TARGET"
          cmp -s /tmp/libkodi-fold-multitask-test.so "$TARGET"

      - name: Verify final test package
        run: |
          set -euo pipefail
          grep -q 'smallestScreenSize' /tmp/decoded/AndroidManifest.xml
          grep -q 'screenLayout' /tmp/decoded/AndroidManifest.xml
          grep -q 'density' /tmp/decoded/AndroidManifest.xml
          grep -q 'android.supports_size_changes' /tmp/decoded/AndroidManifest.xml
          grep -q 'android:resizeableActivity="true"' /tmp/decoded/AndroidManifest.xml
          test -f /tmp/decoded/lib/arm64-v8a/libkodi.so
          echo 'Final package = Stable 2 + fold/cover + resize/multitask lifecycle experiment; silver-line renderer untouched.'

      - name: Rebuild test APK
        run: java -jar /tmp/apktool.jar b /tmp/decoded -o /tmp/Infinity-Stable2-Fold-Multitask-Test-unsigned.apk

      - name: Align and sign test APK
        env:
          PASS: infinity${{ github.run_id }}${{ github.run_attempt }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/33.0.1"
          keytool -genkeypair \
            -keystore /tmp/infinity.keystore \
            -alias infinity \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Infinity Fold Multitask Test, O=Infinity, C=US" \
            >/dev/null 2>&1
          "$BT/zipalign" -f 4 /tmp/Infinity-Stable2-Fold-Multitask-Test-unsigned.apk /tmp/Infinity-Stable2-Fold-Multitask-Test-aligned.apk
          "$BT/apksigner" sign \
            --ks /tmp/infinity.keystore \
            --ks-key-alias infinity \
            --ks-pass env:PASS \
            --key-pass env:PASS \
            --out /tmp/Infinity-Stable2-Fold-Multitask-Test.apk \
            /tmp/Infinity-Stable2-Fold-Multitask-Test-aligned.apk
          "$BT/apksigner" verify --verbose /tmp/Infinity-Stable2-Fold-Multitask-Test.apk

      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-Stable2-Fold-Multitask-Test
          path: /tmp/Infinity-Stable2-Fold-Multitask-Test.apk
          retention-days: 30
