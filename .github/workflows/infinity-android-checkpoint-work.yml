name: Infinity | Android checkpoint work-branch validation
on:
  workflow_dispatch:
  push:
    branches: [work/android-checkpoint-shutdown-2103335]
    paths:
      - 'repairs/android-checkpoint-shutdown/**'
      - '.github/workflows/infinity-android-checkpoint-work.yml'
permissions: {contents: read, actions: read}
# Let the compiling revision retain its compiler cache before the corrected
# candidate starts. Its APK remains a separate candidate identity.
concurrency: {group: infinity-android-checkpoint-work, cancel-in-progress: false}
env:
  NDK_VER: 21.4.7075529
jobs:
  android-shell:
    if: github.ref == 'refs/heads/work/android-checkpoint-shutdown-2103335'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          run-id: 37869282921
          name: Infinity-2103341-Android-Donor-Internal
          github-token: ${{ github.token }}
          path: reused-shell
      - uses: actions/download-artifact@v8
        with:
          run-id: 37869282921
          name: Infinity-Checkpoint-Work-Android-Validation
          github-token: ${{ github.token }}
          path: reused-android
      - name: Verify exact reuse of the passed 2103341 Android compilation
        run: |
          set -euo pipefail
          mkdir -p reuse-source
          tar --no-same-owner -xzf reused-android/checkpoint-android/runtime-shell-source.tar.gz -C reuse-source
          python3 repairs/android-checkpoint-shutdown/runtime_delta.py verify --group android --source reuse-source/shell-kodi
          test -s reused-shell/xbmc-release.apk
          python3 - <<'PY'
          import ast, json
          from pathlib import Path
          tree = ast.parse(Path('tools/checkpoint-apk/package.py').read_text())
          identity = {node.targets[0].id: ast.literal_eval(node.value)
                      for node in tree.body if isinstance(node, ast.Assign)
                      and isinstance(node.targets[0], ast.Name)
                      and node.targets[0].id in ('VERSION', 'RELEASE')}
          assert identity == {'VERSION': 2103341, 'RELEASE': '1.0.9-Checkpoint-Directory-Fix-RC1'}, identity
          Path('reused-android/checkpoint-android/ANDROID-REUSE.json').write_text(json.dumps({
              'candidate': 2103341, 'android_validation_run': 37869282921,
              'android_source_commit': '194e74a764bd06719c6e6de442bcfb07419f6e2b',
              'full_shell_compile_passed': True, 'protected_source_map_verified': True,
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103341-Android-Donor-Internal
          path: reused-shell/xbmc-release.apk
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-Checkpoint-Work-Android-Validation
          path: reused-android/
          retention-days: 90
          if-no-files-found: error
  native-engine:
    if: github.ref == 'refs/heads/work/android-checkpoint-shutdown-2103335'
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    env:
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - name: Restore pinned NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-${{ runner.os }}-21.4.7075529-v1
      - name: Install and verify pinned Android toolchain with retry
        run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - name: Restore work-branch preservation-parent dependencies
        id: parent-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            android-tools/INFINITY-DEPENDENCIES-COMPLETE.json
            ~/.ccache
          key: infinity-checkpoint-3334-deps-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            infinity-checkpoint-3334-deps-${{ runner.os }}-37869282921
            infinity-checkpoint-3334-deps-${{ runner.os }}-
            infinity-python-exit-3334-arm64-${{ runner.os }}-37724566406
      - name: Reconstruct protected lineage and run source and persistence gates
        run: |
          set -euo pipefail
          mkdir -p checkpoint-build
          sudo apt-get update -qq
          sudo apt-get install -y python3-yaml python3-dev libsqlite3-dev
          python3 repairs/android-checkpoint-shutdown/native_ci.py prepare 2>&1 | tee checkpoint-build/prepare.log
      - name: Compile reviewed native runtime integration
        run: |
          set -euo pipefail
          if python3 repairs/android-checkpoint-shutdown/native_ci.py verify-dependencies; then
            python3 repairs/android-checkpoint-shutdown/native_ci.py compile --completed-cache 2>&1 | tee checkpoint-build/compile.log
          else
            python3 repairs/android-checkpoint-shutdown/native_ci.py compile 2>&1 | tee checkpoint-build/compile.log
          fi
      - name: Preserve dependencies for subsequent work-branch builds
        uses: actions/cache/save@v4
        if: always() && !cancelled()
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            android-tools/INFINITY-DEPENDENCIES-COMPLETE.json
            ~/.ccache
          key: infinity-checkpoint-3334-deps-${{ runner.os }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-Checkpoint-Work-Native-Validation
          path: |
            checkpoint-build/
            !checkpoint-build/libkodi.so
          compression-level: 1
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-Checkpoint-Work-Native-Internal
          path: checkpoint-build/libkodi.so
          compression-level: 1
          retention-days: 90
          if-no-files-found: error
  package-test-apk:
    needs: [android-shell, native-engine]
    if: github.ref == 'refs/heads/work/android-checkpoint-shutdown-2103335'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: '${{ github.sha }}'}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - name: Restore pinned NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-${{ runner.os }}-21.4.7075529-v1
      - name: Install and verify pinned Android toolchain with retry
        run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - name: Verify packaging gates
        run: python3 tools/checkpoint-apk/test_package.py
      - uses: actions/download-artifact@v8
        with:
          run-id: 37735801149
          name: Infinity-2103335-Delivery-Evidence
          github-token: ${{ github.token }}
          path: parent
      - uses: actions/download-artifact@v8
        with:
          run-id: 37735801149
          name: Infinity-2103335-Native-Trace-Bridge-RC1-APK
          github-token: ${{ github.token }}
          path: base
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.run_id }}
          name: Infinity-Checkpoint-Work-Native-Internal
          github-token: ${{ github.token }}
          path: engine
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.run_id }}
          name: Infinity-Checkpoint-Work-Native-Validation
          github-token: ${{ github.token }}
          path: engine-proof
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.run_id }}
          name: Infinity-2103341-Android-Donor-Internal
          github-token: ${{ github.token }}
          path: shell/xbmc/build/outputs/apk/release
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.run_id }}
          name: Infinity-Checkpoint-Work-Android-Validation
          github-token: ${{ github.token }}
          path: evidence
      - name: Restore already compiled shell and associated native proof
        run: |
          set -euo pipefail
          cp engine-proof/ENGINE-PROOF.json engine/ENGINE-PROOF.json
          cp evidence/checkpoint-android/COMPAT-ASSET-ASSOCIATION.json evidence/COMPAT-ASSET-ASSOCIATION.json
          mkdir -p source
          tar --no-same-owner -xzf evidence/checkpoint-android/runtime-shell-source.tar.gz -C source
      - name: Associate green engine and verify preserved payload and permanent signer
        env:
          GITHUB_SHA: ${{ github.sha }}
          INFINITY_ENGINE_SOURCE_COMMIT: ${{ github.sha }}
          INFINITY_NATIVE_RUN_ID: ${{ github.run_id }}
          INFINITY_ANDROID_RUN_ID: 37869282921
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 tools/checkpoint-apk/package.py package --source source/shell-kodi --base base/Infinity-2103335-Native-Trace-Bridge-RC1.apk --build shell --out evidence --engine engine
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103341-Checkpoint-Directory-Fix-RC1-APK
          path: evidence/Infinity-2103341-Checkpoint-Directory-Fix-RC1.apk
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103341-Checkpoint-Test-Evidence
          path: |
            evidence/
            !evidence/*.apk
            !evidence/*.so
            shell/xbmc/build/test-results/testReleaseUnitTest/
          retention-days: 90
          if-no-files-found: error
