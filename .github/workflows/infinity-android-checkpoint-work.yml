name: Infinity | Android checkpoint work-branch validation
on:
  workflow_dispatch:
  push:
    branches: [work/android-checkpoint-shutdown-2103335]
    paths:
      - 'repairs/android-checkpoint-shutdown/**'
      - '.github/workflows/infinity-android-checkpoint-work.yml'
permissions: {contents: read, actions: read}
concurrency: {group: infinity-android-checkpoint-work, cancel-in-progress: false}
env:
  NDK_VER: 21.4.7075529
jobs:
  android-shell:
    if: github.ref == 'refs/heads/work/android-checkpoint-shutdown-2103335'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 ndk;21.4.7075529'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 37735801149
          name: Infinity-2103335-Delivery-Evidence
          github-token: ${{ github.token }}
          path: checkpoint-parent
      - uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 37735801149
          name: Infinity-2103335-Native-Trace-Bridge-RC1-APK
          github-token: ${{ github.token }}
          path: checkpoint-base
      - name: Verify protected shell and stage complete Android compilation
        run: |
          set -euo pipefail
          mkdir -p checkpoint-source checkpoint-android "$HOME/.android"
          tar --no-same-owner -xzf checkpoint-parent/repaired-shell-source.tar.gz -C checkpoint-source
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Compile Only,O=Android,C=US'
          python3 repairs/android-checkpoint-shutdown/android_ci.py --source checkpoint-source/shell-kodi --base checkpoint-base/Infinity-2103335-Native-Trace-Bridge-RC1.apk --build checkpoint-shell-build --out checkpoint-android
      - name: Compile every Java class and run inherited exporter tests
        env:
          KODI_ANDROID_KEY_ALIAS: androiddebugkey
          KODI_ANDROID_KEY_PASSWORD: android
          KODI_ANDROID_STORE_PASSWORD: android
          KODI_ANDROID_STORE_FILE: /home/runner/.android/debug.keystore
        run: |
          set -euo pipefail
          ./checkpoint-shell-build/gradlew --no-daemon --console=plain -p checkpoint-shell-build :xbmc:testReleaseUnitTest :xbmc:assembleRelease 2>&1 | tee checkpoint-android/compile.log
          python3 repairs/android-checkpoint-shutdown/runtime_delta.py verify --group android --source checkpoint-source/shell-kodi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-Checkpoint-Work-Android-Validation
          path: |
            checkpoint-android/
            checkpoint-shell-build/xbmc/build/test-results/testReleaseUnitTest/
            checkpoint-shell-build/xbmc/build/reports/tests/testReleaseUnitTest/
          retention-days: 90
          if-no-files-found: error
  native-engine:
    if: github.ref == 'refs/heads/work/android-checkpoint-shutdown-2103335'
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    env:
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - name: Restore completed preservation-parent dependencies
        id: parent-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            ~/.ccache
          key: infinity-python-exit-3334-arm64-${{ runner.os }}-37724566406
      - name: Reconstruct protected lineage and run source and persistence gates
        run: |
          set -euo pipefail
          mkdir -p checkpoint-build
          sudo apt-get update -qq
          sudo apt-get install -y python3-yaml python3-dev libsqlite3-dev
          python3 repairs/android-checkpoint-shutdown/native_ci.py prepare 2>&1 | tee checkpoint-build/prepare.log
      - name: Compile reviewed native runtime integration
        env:
          CACHE_HIT: ${{ steps.parent-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$CACHE_HIT" = true ]; then
            python3 repairs/android-checkpoint-shutdown/native_ci.py compile --completed-cache 2>&1 | tee checkpoint-build/compile.log
          else
            python3 repairs/android-checkpoint-shutdown/native_ci.py compile 2>&1 | tee checkpoint-build/compile.log
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-Checkpoint-Work-Native-Validation
          path: |
            checkpoint-build/
            !checkpoint-build/libkodi.so
          compression-level: 1
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-Checkpoint-Work-Native-Internal
          path: checkpoint-build/libkodi.so
          compression-level: 1
          retention-days: 90
          if-no-files-found: error
