name: Infinity controlled frozen451 plus touch ARM64 engine - no APK signing or runtime
on:
  workflow_dispatch:
  push:
    branches: [work/infinity-master-testing-from-2103451-20261105, work/infinity-native-keyboard-scaling-462-20261107]
    paths: [repairs/infinity-master-testing-20261105/NATIVE-BUILD-REQUEST.json, repairs/infinity-native-keyboard-scaling-462-20261107/REVIEW-REQUEST.json, repairs/infinity-native-keyboard-scaling-462-20261107/review_sources.py]
permissions: {contents: read, actions: read}
concurrency:
  group: infinity-master-controlled-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: github.ref == 'refs/heads/work/infinity-master-testing-from-2103451-20261105'
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    env:
      GH_TOKEN: ${{ github.token }}
      NDK_VER: '21.4.7075529'
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools build-tools;35.0.0 platforms;android-34', log-accepted-android-sdk-licenses: false}
      - name: Verify exact approved source and original input identities
        run: python3 repairs/infinity-master-testing-20261105/native_build.py metadata
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13274901825', run-id: '41726452356', merge-multiple: true, github-token: '${{ github.token }}', path: verified-inputs}
      - name: Restore exact frozen451 plus ONLY the two approved touch files
        run: python3 repairs/infinity-master-testing-20261105/native_build.py restore
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '11698374892', run-id: '38132105717', merge-multiple: true, github-token: '${{ github.token }}', path: dependency-transfer}
      - name: Restore verified original compiler dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y python3-yaml python3-dev libsqlite3-dev libssl-dev libffi-dev
          (cd dependency-transfer && sha256sum -c SHA256SUMS)
          tar --no-same-owner -xf dependency-transfer/verified-android-dependencies.tar
          tar --no-same-owner -xf dependency-transfer/verified-compiler-cache.tar -C "$HOME"
      - uses: actions/cache@v4
        with: {path: /usr/local/lib/android/sdk/ndk/21.4.7075529, key: infinity-pinned-ndk-linux-21.4.7075529-v1}
      - name: Restore unchanged pinned NDK
        run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - name: Compile and link complete authorized ARM64 native engine
        run: python3 repairs/infinity-master-testing-20261105/native_build.py compile
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-Controlled-Touch-Native-${{ github.run_id }}-INTERNAL-NOT-APK
          path: |
            controlled-native/libkodi.so
            controlled-native/*.json
            controlled-native/*.txt
            controlled-native/compile-native.sh
          if-no-files-found: warn
          retention-days: 90

  native-462-source-review:
    name: Exact APK462 selected native ownership proof; no production patch, APK or signing
    if: github.ref == 'refs/heads/work/infinity-native-keyboard-scaling-462-20261107'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      stage: ${{ steps.scope.outputs.stage }}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Verify exact source-only scope and authenticated existing inputs
        id: scope
        run: python3 repairs/infinity-native-keyboard-scaling-462-20261107/review_sources.py metadata
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.scope.outputs.stage != 'verify-compiled-keyboard'
        with: {artifact-ids: '13274901825', run-id: '41726452356', merge-multiple: true, github-token: '${{ github.token }}', path: verified-inputs}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.scope.outputs.stage == 'restore-review'
        with: {artifact-ids: '13493978721', run-id: '42199527560', merge-multiple: true, github-token: '${{ github.token }}', path: compiled462}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.scope.outputs.stage != 'restore-review'
        with: {artifact-ids: '13571276665', run-id: '42364232328', merge-multiple: true, github-token: '${{ github.token }}', path: previous-review}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.scope.outputs.stage == 'verify-compiled-keyboard'
        with: {artifact-ids: '13571623548', run-id: '42365858072', merge-multiple: true, github-token: '${{ github.token }}', path: compiled-keyboard}
      - name: Read exact selected native ownership source; reuse completed full map proof
        run: python3 repairs/infinity-native-keyboard-scaling-462-20261107/review_sources.py ${{ steps.scope.outputs.stage }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity462-Native-Ownership-Source-Review-${{ github.run_id }}-NO-APK
          path: native-ownership-review/
          if-no-files-found: error
          retention-days: 90

  native-462-keyboard-arm64:
    name: Exact APK462 plus one proven keyboard ownership source - ARM64 object only
    needs: native-462-source-review
    if: github.ref == 'refs/heads/work/infinity-native-keyboard-scaling-462-20261107' && needs.native-462-source-review.outputs.stage == 'compile-keyboard'
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      NDK_VER: '21.4.7075529'
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools build-tools;35.0.0 platforms;android-34', log-accepted-android-sdk-licenses: false}
      - name: Verify dependency and prior host-proof artifact identities
        run: |
          python3 - <<'PY'
          import json,subprocess
          for aid,run,size,digest in [
            (11698374892,38132105717,1199235695,'c26ea3ea6f21fe42e5ff9ff1d3f0adc5bf7adaa775348d812c14a0a377227b69'),
            (13571601535,42365578534,278733,'7d8a230d4eff1a97372b9448ecb83d568a6e349236c5b4e25bf9db5542c464fb')]:
            row=json.loads(subprocess.check_output(['gh','api',f'repos/mahfouzhassine8-ops/project-infinity/actions/artifacts/{aid}'],text=True))
            assert (row['workflow_run']['id'],row['size_in_bytes'],row['digest'],row['expired'])==(run,size,'sha256:'+digest,False)
          print('PASS original dependency/prior host-proof artifact identities')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13274901825', run-id: '41726452356', merge-multiple: true, github-token: '${{ github.token }}', path: verified-inputs}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13571276665', run-id: '42364232328', merge-multiple: true, github-token: '${{ github.token }}', path: previous-review}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13571601535', run-id: '42365578534', merge-multiple: true, github-token: '${{ github.token }}', path: keyboard-after}
      - name: Restore exact462 and apply only proven isolated ownership source
        run: python3 repairs/infinity-native-keyboard-scaling-462-20261107/compile_keyboard.py restore
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '11698374892', run-id: '38132105717', merge-multiple: true, github-token: '${{ github.token }}', path: dependency-transfer}
      - name: Restore verified original compiler dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y python3-yaml python3-dev libsqlite3-dev libssl-dev libffi-dev
          (cd dependency-transfer && sha256sum -c SHA256SUMS)
          tar --no-same-owner -xf dependency-transfer/verified-android-dependencies.tar
          tar --no-same-owner -xf dependency-transfer/verified-compiler-cache.tar -C "$HOME"
      - uses: actions/cache@v4
        with: {path: /usr/local/lib/android/sdk/ndk/21.4.7075529, key: infinity-pinned-ndk-linux-21.4.7075529-v1}
      - name: Restore unchanged pinned NDK
        run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - name: Compile only actual Android ARM64 keyboard translation unit
        run: python3 repairs/infinity-native-keyboard-scaling-462-20261107/compile_keyboard.py compile
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity462-Keyboard-ARM64-Object-${{ github.run_id }}-NO-APK
          path: native-ownership-review/
          if-no-files-found: error
          retention-days: 90
