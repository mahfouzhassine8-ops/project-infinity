name: Build Map Point APK

on:
  pull_request:
    branches:
      - main
    paths:
      - 'map-point/**'
      - '.github/workflows/build-map-point.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed debug APK
        working-directory: map-point
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp map-point/app/build/outputs/apk/debug/app-debug.apk out/Map-Point-1.0.0.apk

      - name: SHA-256
        run: sha256sum out/Map-Point-1.0.0.apk | tee out/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Map-Point-1.0.0-APK
          path: out/*
