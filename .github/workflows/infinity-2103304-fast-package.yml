name: Infinity | 303-194 fast APK package
on:
  workflow_dispatch:
  push:
    branches: [repair/2103303-194-responsive-regressions]
    paths:
      - 'repairs/mobile-regressions-2103304/**'
      - '.github/workflows/infinity-2103304-fast-package.yml'
permissions: {contents: read, actions: read}
concurrency:
  group: infinity-2103304-fast-package
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 ndk;21.4.7075529'
      - name: Download locked 2103303 APK candidate
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103303-E2E-Mobile-Repair-RC1-Candidate-NOT-DEVICE-ACCEPTED
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 37170612805
          github-token: ${{ github.token }}
          path: baseline303
      - name: Download passed Android source proof
        uses: actions/download-artifact@v8
        with:
          name: Infinity-303-194-Repair-Android-Validation-NO-APK
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 37189658834
          github-token: ${{ github.token }}
          path: validated-android
      - name: Download passed native engine proof
        uses: actions/download-artifact@v8
        with:
          name: Infinity-303-194-Repair-Native-Validation-NO-APK
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 37189319805
          github-token: ${{ github.token }}
          path: validated-native
      - name: Package and sign fast update
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p verified-source candidate "$HOME/.android"
          unzip -q baseline303/*.zip -d baseline303/unpacked
          cp baseline303/unpacked/Infinity-2103303-1.0.9-E2E-Mobile-Repair-RC1.apk baseline303/base.apk
          tar --no-same-owner -xzf validated-android/repaired-shell-source.tar.gz -C verified-source
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          python3 repairs/mobile-regressions-2103304/package_candidate.py \
            --source verified-source/shell-kodi \
            --source-proof validated-android/ANDROID-SOURCE-PROOF.json \
            --source-receipt validated-android/source-delta.json \
            --base-apk baseline303/base.apk \
            --engine validated-native/engine3304 \
            --build-dir release-build3304 --out candidate 2>&1 | tee package.log
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103304-Responsive-Repair-RC1-APK-NOT-DEVICE-ACCEPTED
          path: candidate/
          compression-level: 1
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103304-Fast-Package-Log
          path: package.log
          retention-days: 90
          if-no-files-found: warn
