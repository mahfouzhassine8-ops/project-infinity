name: Infinity Stable 2 PiP v1

on:
  push:
    paths:
      - '.github/workflows/build-stable2-pip-v1.yml'
      - 'tools/patch_pip_v1.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;34.0.0 platform-tools'
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends unzip curl
          curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
      - name: Download Stable 2 v12 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9987128748/zip -o /tmp/base.zip
          mkdir -p /tmp/base
          unzip -q /tmp/base.zip -d /tmp/base
          APK=$(find /tmp/base -name '*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" /tmp/base.apk
      - name: Decode Stable 2
        run: java -jar /tmp/apktool.jar d -f /tmp/base.apk -o /tmp/decoded
      - name: Apply PiP v1
        run: python3 tools/patch_pip_v1.py
      - name: Verify PiP manifest
        run: |
          set -euo pipefail
          MAN=/tmp/decoded/AndroidManifest.xml
          grep -q 'android:supportsPictureInPicture="true"' "$MAN"
          grep -q 'android:resizeableActivity="true"' "$MAN"
          grep -q 'android:configChanges="[^"]*screenSize' "$MAN"
      - name: Rebuild
        run: java -jar /tmp/apktool.jar b /tmp/decoded -o /tmp/Infinity-Stable2-PiP-v1-unsigned.apk
      - name: Sign
        env:
          PASS: infinity${{ github.run_id }}${{ github.run_attempt }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          keytool -genkeypair -keystore /tmp/infinity.keystore -alias infinity -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Infinity Stable 2 PiP, O=Infinity, C=US" >/dev/null 2>&1
          "$BT/zipalign" -f 4 /tmp/Infinity-Stable2-PiP-v1-unsigned.apk /tmp/Infinity-Stable2-PiP-v1-aligned.apk
          "$BT/apksigner" sign --ks /tmp/infinity.keystore --ks-key-alias infinity --ks-pass env:PASS --key-pass env:PASS --out /tmp/Infinity-Stable2-PiP-v1.apk /tmp/Infinity-Stable2-PiP-v1-aligned.apk
          "$BT/apksigner" verify --verbose /tmp/Infinity-Stable2-PiP-v1.apk
      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-Stable2-PiP-v1
          path: /tmp/Infinity-Stable2-PiP-v1.apk
          retention-days: 30
