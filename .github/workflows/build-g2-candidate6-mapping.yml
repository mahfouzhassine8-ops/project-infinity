name: G2 Candidate 6 - Hardened Mapping Only
run-name: 'G2 Candidate #6 | reuse successful G2 #5 engine'
on:
  workflow_dispatch:
  push:
    branches: [g2-candidate-6-mapping]
    paths:
      - '.github/workflows/build-g2-candidate6-mapping.yml'
      - 'mapping/g2-candidate6/**'
      - 'scripts/g2_candidate6*.py'
      - 'tests/g2_candidate6/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: g2-candidate6-mapping
  cancel-in-progress: false
jobs:
  mapping-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Fetch ONLY the exact successful G2 number 5 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p baseline results candidate
          command -v zip
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/mahfouzhassine8-ops/project-infinity/actions/artifacts/10076770816' \
            -o baseline/artifact.json
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/mahfouzhassine8-ops/project-infinity/actions/artifacts/10076770816/zip' \
            -o baseline/original.zip
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          s=json.loads(Path('mapping/g2-candidate6/baseline.json').read_text())
          meta=json.loads(Path('baseline/artifact.json').read_text())
          assert meta['id']==s['artifact_id'] and not meta['expired']
          assert meta['workflow_run']['id']==s['run_id']
          assert meta['workflow_run']['head_sha']==s['source_commit']
          data=Path('baseline/original.zip').read_bytes()
          assert hashlib.sha256(data).hexdigest()==s['artifact_zip_sha256']
          with zipfile.ZipFile('baseline/original.zip') as z:
              names=[n for n in z.namelist() if n.endswith('.apk')]
              assert names==['Infinity-7.1-Uniform-G.apk']
              apk=z.read(names[0])
          assert hashlib.sha256(apk).hexdigest()==s['apk_sha256']
          Path('baseline/G2-Candidate-5.apk').write_bytes(apk)
          PY
      - name: Static native cross-reference and host policy tests - no engine build
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 21.3-Omega https://github.com/xbmc/xbmc.git reference-kodi
          test "$(git -C reference-kodi rev-parse HEAD)" = a3a448d26b8d560a65655dab2cd122994dc4e146
          python3 scripts/g2_candidate6_native_reference.py --source reference-kodi | tee results/native-reference.txt
          python3 tests/g2_candidate6/test_bridge_host.py 2>&1 | tee results/host-policy.txt
      - name: Compile guarded adapter, preserve G2 5 engine, verify every other class and APK member
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar \
            -o apktool.jar
          echo '56d59c524fc764263ba8d345754d8daf55b1887818b15cd3b594f555d249e2db  apktool.jar' | sha256sum -c -
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs baseline/G2-Candidate-5.apk > results/baseline-signature.txt
          python3 scripts/g2_candidate6.py --base baseline/G2-Candidate-5.apk \
            --apktool apktool.jar --sdk "$ANDROID_HOME" --output candidate/G2-Candidate-6-unsigned.apk \
            2>&1 | tee results/mapping-build.txt
      - name: Negative mapping and real SDK signing regression tests - disposable fixtures only
        run: |
          set -euo pipefail
          java -jar apktool.jar d -f baseline/G2-Candidate-5.apk -o baseline/decoded > results/decode.txt
          export G2_BASE_APK="$PWD/baseline/G2-Candidate-5.apk"
          export G2_BASE_DECODED="$PWD/baseline/decoded"
          export G2_UNSIGNED_APK="$PWD/candidate/G2-Candidate-6-unsigned.apk"
          python3 tests/g2_candidate6/test_mapper.py 2>&1 | tee results/mapping-tests.txt
          python3 tests/g2_candidate6/test_signing.py 2>&1 | tee results/signing-tests.txt
      - name: Sign ONLY if the original G2 5 certificate is available
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 scripts/g2_candidate6_sign.py --unsigned candidate/G2-Candidate-6-unsigned.apk \
            --output candidate/G2-Candidate-6.apk --sdk "$ANDROID_HOME"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads(Path('candidate/G2-Candidate-6.signing-status.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## G2 Candidate #6 - mapping only\n')
              f.write('Baseline: successful G2 #5, run 34273293502. No Kodi/native rebuild.\n\n')
              f.write('27 Python tests and 17 JVM policy cases passed. Device testing is pending.\n\n')
              f.write('Signing status: **'+s['status']+'**.\n\n')
              f.write('Keep testing installed #5. An unsigned APK is NOT an installable update.\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: G2-Candidate-6-Mapping-Only
          path: |
            candidate/
            results/
            mapping/g2-candidate6/baseline.json
            docs/G2-CANDIDATE-6-MAPPING.md
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: G2-Candidate-5-Preserved-Base
          path: |
            baseline/G2-Candidate-5.apk
            baseline/artifact.json
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
