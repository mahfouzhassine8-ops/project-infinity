name: Infinity Core outcomes - scoped diagnostic host and ARM64
on:
  push:
    branches: [work/infinity-core-outcomes-qa-20261112]
    paths:
      - .github/workflows/infinity-core-outcomes-qa-native.yml
      - repairs/infinity-core-outcomes-qa-2103483-20261112/observer.py
      - repairs/infinity-core-outcomes-qa-2103483-20261112/native/**
      - repairs/infinity-core-outcomes-qa-2103483-20261112/make_overlay.py
      - repairs/infinity-core-outcomes-qa-2103483-20261112/build_native.py
      - repairs/infinity-core-outcomes-qa-2103483-20261112/test*.py
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency: {group: infinity-core-outcomes-native, cancel-in-progress: false}
jobs:
  selected-host:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      GH_TOKEN: '${{ github.token }}'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - name: Reuse passing exact-source host job; old runner tooling failure remains separate
        run: |
          gh api repos/mahfouzhassine8-ops/project-infinity/actions/artifacts/13912312753/zip > host-proof.zip
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          from zipfile import ZipFile
          task='repairs/infinity-core-outcomes-qa-2103483-20261112/'
          protected=[task+n for n in ('observer.py','native','make_overlay.py','test_observer.py','test_native_sink.py')]
          assert not subprocess.check_output(['git','diff','--name-only','84c52957160827da6f0e7ae8d8846ce68d50dd4d','HEAD','--',*protected],text=True).strip()
          jobs=json.loads(subprocess.check_output(['gh','api','repos/mahfouzhassine8-ops/project-infinity/actions/runs/43148325530/jobs'],text=True))['jobs']
          assert next(j for j in jobs if j['id']==130951315904)['conclusion']=='success'
          assert hashlib.sha256(Path('host-proof.zip').read_bytes()).hexdigest()=='92210de77f29be2069cc61230c13af8ad1dbeb346229ad842a0535ea5328205d'
          with ZipFile('host-proof.zip') as z:
              host=json.loads(z.read('HOST-CORE-OUTCOMES.json'));native=json.loads(z.read('NATIVE-SINK-HOST.json'))
          assert host['status']=='PASS_SELECTED_PYTHON_OUTCOME_HOST' and host['testsRun']==13 and host['Python']==[3,11,7] and host['skipped']==0
          assert native['status']=='PASS_ACTUAL_NATIVE_CALLBACK_AND_PINNED_PYTHON_LOADER_DELEGATE' and native['Python']==[3,11,7]
          Path('REUSE-HOST.json').write_text(json.dumps(dict(status='PASS_REUSED_EXACT_SOURCE_NATIVE_AND_PYTHON_HOST',run=43148325530,job=130951315904,artifact=13912312753,repeated_cases=False),indent=2)+'\n')
          print(Path('REUSE-HOST.json').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with: {name: 'Infinity-Core-Outcomes-ReusedHost-${{ github.run_id }}', path: REUSE-HOST.json, retention-days: 90}
  arm64:
    needs: selected-host
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      GH_TOKEN: '${{ github.token }}'
      NDK_VER: '21.4.7075529'
      DEPENDS: '${{ github.workspace }}/android-tools/xbmc-depends'
      TARBALLS: '${{ github.workspace }}/android-tools/xbmc-tarballs'
      BUILD_DIR: '${{ github.workspace }}/kodi-build'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools build-tools;35.0.0 platforms;android-34', log-accepted-android-sdk-licenses: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13274901825', run-id: '41726452356', merge-multiple: true, github-token: '${{ github.token }}', path: verified-inputs}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13571276665', run-id: '42364232328', merge-multiple: true, github-token: '${{ github.token }}', path: previous-review}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13595626273', run-id: '42425522122', merge-multiple: true, github-token: '${{ github.token }}', path: exact464}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13771187253', run-id: '42830516841', merge-multiple: true, github-token: '${{ github.token }}', path: signed80}
      - name: Exact83 source restoration and scoped diagnostic overlay
        run: python repairs/infinity-core-outcomes-qa-2103483-20261112/build_native.py prepare
      - name: Retained dependency tooling
        run: bash repairs/infinity-core-outcomes-qa-2103483-20261112/prepare_ci_tooling.sh
      - uses: actions/cache@v4
        with: {path: /usr/local/lib/android/sdk/ndk/21.4.7075529, key: infinity-pinned-ndk-linux-21.4.7075529-v1}
      - name: Retained NDK and dependencies
        run: |
          bash repairs/android-checkpoint-shutdown/install_ndk.sh
          python repairs/infinity-core-outcomes-qa-2103483-20261112/build_native.py dependencies
      - name: Actual full ARM64 compilation and ABI verification
        run: python repairs/infinity-core-outcomes-qa-2103483-20261112/build_native.py compile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Infinity-Core-Outcomes-ARM64-${{ github.run_id }}-NO-INSTALLER
          path: |
            core-outcomes-native/libkodi.so
            core-outcomes-native/*.json
            core-outcomes-native/*.txt
          if-no-files-found: error
          retention-days: 90
