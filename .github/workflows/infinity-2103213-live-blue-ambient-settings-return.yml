name: Infinity | 2103213 Live Blue Ambient + Settings Return

on:
  workflow_dispatch:
  push:
    branches: [infinity-cobra-2103213-live-blue-ambient-settings-return-rc1]
    paths:
      - '.github/workflows/infinity-2103213-live-blue-ambient-settings-return.yml'
      - 'repairs/live-blue-ambient-settings-return-2103213/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: infinity-2103213-${{ github.sha }}
  cancel-in-progress: false

env:
  NDK_VER: 21.4.7075529
  RUNTIME_COMMIT: b42760a25a27d23baa5db5770824cb8d32ec2290

jobs:
  package-and-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout scoped 2103213 successor
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Download exact successful 2103208 presentation parent
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103208-Integration-Polish-TEST-CANDIDATE-Replica-1-Attempt-1
          run-id: 35676573761
          github-token: ${{ github.token }}
          path: baseline208

      - name: Download preserved 2103209 Python 3.11 GIL native engine
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103209-Python311-GIL-Native-Engine
          run-id: 35693288744
          github-token: ${{ github.token }}
          path: native209

      - name: Reconstruct exact 2103209 shell without native rebuild
        run: |
          set -euo pipefail
          mkdir -p audit213 engine
          cp native209/pythoninvoker-threadstate-v2-source.json engine/pythoninvoker-threadstate-v2-source.json
          cp native209/pythoninvoker-threadstate-v2-source.stage1.json engine/pythoninvoker-threadstate-v2-source.stage1.json
          python3 repairs/python311-gil-2103209/ci.py prepare \
            --base-dir baseline208 \
            --native-apk native209/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2-Engine-Base.apk \
            --shell shell-kodi \
            --out audit213/native-base

      - name: Recreate exact successful 2103210 2103211 and locked 2103212 source
        run: |
          set -euo pipefail
          python3 repairs/cobra-media-library-health-2103210/apply.py --shell shell-kodi
          python3 repairs/cobra-library-health-2103211/apply.py --shell shell-kodi
          python3 repairs/health-media-trim-2103212/apply.py --shell shell-kodi
          test "$(sha256sum shell-kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in | cut -d' ' -f1)" = "18f1adf33bedeeefb856e68dda7fa8eca1edbdb86b4c7da11b43bf284dd496cf"
          test "$(sha256sum shell-kodi/tools/android/packaging/xbmc/src/Splash.java.in | cut -d' ' -f1)" = "7c9e8930a41da2e7c5a75fd9d18195413e1f09701d6e3dcaa196a2f848baca9c"
          test "$(sha256sum shell-kodi/tools/android/packaging/xbmc/src/Main.java.in | cut -d' ' -f1)" = "ddf18d30c4040369b30e861ded588a53846ff3de319a89a219344771f8db9318"

      - name: Apply blue Live TV Ambient and Settings return
        run: |
          set -euo pipefail
          python3 repairs/live-blue-ambient-settings-return-2103213/apply.py --shell shell-kodi
          grep -F 'LIVE TV AMBIENT BLUE' shell-kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          grep -F 'COBRA_LIVE_AMBIENT_BLUE' shell-kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          grep -F 'cobraReturnFromSettings()' shell-kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          grep -F 'cobra_settings_return' shell-kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          grep -F '"live_tv_blue": true' audit213/scope.json
          grep -F '"movie_tv_library_unchanged": true' audit213/scope.json
          grep -F '"video_recolored": false' audit213/scope.json

      - name: Create intermediate Android build keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          test -s "$HOME/.android/debug.keystore"

      - name: Build Android shell sign and verify 2103213
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 scripts/package_background_resume.py \
            --source shell-kodi \
            --base-apk audit213/native-base/Infinity-2103208-Python311-GIL-Patched-Base.apk \
            --build-dir build213 \
            --out signed213
          python3 repairs/live-blue-ambient-settings-return-2103213/verify.py \
            --final signed213/Infinity-1.0.9-Cobra-Live-Blue-Ambient-Return-RC1.apk \
            --audit signed213/background-resume-apk-audit.json \
            --base audit213/native-base/Infinity-2103208-Python311-GIL-Patched-Base.apk

      - name: Publish 2103213 TEST CANDIDATE
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103213-Live-Blue-Ambient-Settings-Return-TEST-CANDIDATE
          path: signed213/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Preserve 2103213 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103213-Live-Blue-Ambient-Settings-Return-Evidence
          path: |
            audit213/
            engine/background-resume-source.json
            repairs/live-blue-ambient-settings-return-2103213/
            signed213/*.json
            signed213/*.txt
          if-no-files-found: warn
          retention-days: 90
