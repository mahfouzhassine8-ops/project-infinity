name: Infinity 7.1 Architecture Audit Inputs

on:
  workflow_dispatch:
  push:
    branches: [infinity-7.1-core-unified]
    paths:
      - '.github/workflows/audit-infinity-7.1-architecture.yml'

permissions:
  contents: read
  actions: read

jobs:
  collect:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Collect exact source and existing donor for offline audit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-inputs
          git archive --format=tar.gz HEAD > audit-inputs/infinity-source.tar.gz
          curl --fail --location --retry 3 \
            https://codeload.github.com/xbmc/xbmc/tar.gz/a3a448d26b8d560a65655dab2cd122994dc4e146 \
            -o audit-inputs/kodi-21.3-source.tar.gz
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPO/actions/artifacts/9987818547" \
            -o audit-inputs/donor-artifact.json
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPO/actions/artifacts/9987818547/zip" \
            -o audit-inputs/donor.zip
          curl --fail --location --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar \
            -o audit-inputs/apktool.jar
          printf 'Infinity source commit: %s\nKodi source commit: a3a448d26b8d560a65655dab2cd122994dc4e146\nDonor artifact: 9987818547\nNo native compilation performed.\n' "$SOURCE_SHA" > audit-inputs/PROVENANCE.txt
          (cd audit-inputs && sha256sum *.tar.gz *.zip *.jar > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-7.1-Architecture-Audit-Inputs
          path: audit-inputs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
