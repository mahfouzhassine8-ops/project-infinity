name: Infinity | Whole-Stack Stability Audit

on:
  workflow_dispatch:
    inputs:
      certify:
        description: 'Fail the run while certification blockers remain'
        type: boolean
        default: false
  push:
    branches: [infinity-stability-rc]
    paths:
      - 'addons/**'
      - 'tests/**'
      - 'kodi-config/addons.txt'
      - 'scripts/infinity_stability_audit.py'
      - 'stability/**'
      - '.github/workflows/infinity-stability-audit.yml'

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify locked external companion ledger
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          baseline = json.loads(Path('stability/infinity-stability-baseline.json').read_text())
          artifacts = json.loads(Path('stability/canonical-companion-artifacts.json').read_text())
          live = next(x for x in baseline['external_companions'] if x['addon_id'] == 'script.infinity.live')
          receipt = next(x for x in artifacts['artifacts'] if x['addon_id'] == 'script.infinity.live')
          assert live['target_version'] == '0.1.12'
          assert live['status'] == 'locked_user_accepted'
          assert live['historical_source_commit_reachable'] is False
          assert receipt['version'] == live['target_version']
          assert receipt['sha256'] == live['sha256']
          assert receipt['zip_crc'] == 'passed'
          assert receipt['python_syntax'] == 'passed'
          assert receipt['python_cache_entries'] == 0
          branch = ET.parse('addons/script.infinity.live/addon.xml').getroot()
          if branch.attrib.get('version') != live['target_version']:
              print('INFO: branch Live source is a stale shadow and is not the locked artifact authority:', branch.attrib.get('version'))
          print('PASS: locked Live 0.1.12 artifact receipt is pinned; dead historical commit is not treated as reachable')
          PY

      - name: Run Compat Guard clean-core regression tests
        run: python3 -m unittest discover -s tests/infinity_compat -p 'test_candidate_107.py' -v

      - name: Run Support Exporter safety regression tests
        run: python3 -m unittest discover -s tests/infinity_compat -p 'test_support.py' -v

      - name: Run fast whole-stack inventory audit
        run: python3 scripts/infinity_stability_audit.py --report stability-report.json

      - name: Enforce certification gate when requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.certify }}
        run: python3 scripts/infinity_stability_audit.py --strict --report stability-report.json

      - name: Upload stability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: infinity-stability-report
          path: stability-report.json
          if-no-files-found: error
          retention-days: 90
