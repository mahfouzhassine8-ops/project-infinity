name: Infinity receipt race - isolated Android17 investigation
on:
  push:
    branches: [work/infinity-universal-persistence-android-20261022]
    paths:
      - repairs/universal-persistence-2103401/ReceiptRaceProbe.java
      - repairs/universal-persistence-2103401/receipt_probe.py
      - .github/workflows/infinity-universal-receipt-investigation.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-receipt-investigation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  investigate:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, show-progress: false}
      - uses: actions/download-artifact@v4
        with:
          run-id: 39862996414
          name: Infinity-Universal-Persistence-INTERNAL-QA-NOT-ACCEPTED
          github-token: ${{ github.token }}
          path: signed
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools build-tools;34.0.0 platforms;android-34
          log-accepted-android-sdk-licenses: false
      - name: Prepare exact signed production methods and diagnostic harness
        run: |
          set -euo pipefail
          mkdir receipt-tools
          cat > receipt-tools/pom.xml <<'XML'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>local.infinity.audit</groupId><artifactId>receipt-inspection</artifactId><version>1</version>
            <dependencies>
              <dependency><groupId>org.smali</groupId><artifactId>baksmali</artifactId><version>2.5.2</version></dependency>
              <dependency><groupId>org.smali</groupId><artifactId>smali</artifactId><version>2.5.2</version></dependency>
            </dependencies>
          </project>
          XML
          mvn -B -q -f receipt-tools/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.6.1:build-classpath -Dmdep.outputFile="$GITHUB_WORKSPACE/receipt-tools-classpath.txt"
          python3 repairs/universal-persistence-2103401/receipt_probe.py prepare --out receipt-evidence
      - name: Prepare verified Android17 infrastructure
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0
          python3 repairs/four-repair-20261018/android37_gate.py --sdk-root "$ANDROID_HOME" --out api37-support --pin-tools
          python3 - <<'PYSETUP'
          import pathlib,subprocess,sys
          # RC5's download failed while reading ZIP content before installation.
          # Retry only that observed infrastructure error; preserve every log,
          # run the unchanged shared verifier and never retry an app assertion.
          for attempt in range(1,4):
              out=pathlib.Path('emulator-setup')/('attempt-'+str(attempt))
              code=subprocess.run([sys.executable,'repairs/android-checkpoint-shutdown/runtime-tests/prepare_android_emulator.py','--out',str(out)]).returncode
              if code==0:break
              logs='\n'.join(p.read_text(errors='replace') for p in out.glob('sdkmanager-attempt-*.log'))
              if attempt==3 or 'Error reading Zip content from a SeekableByteChannel' not in logs:
                  raise SystemExit(code)
          PYSETUP
          sudo chmod 666 /dev/kvm
      - name: Reproduce original receipt read/write race on Android17 ART
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '37.0'
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 8G
          avd-name: infinity-four-repair-api37
          pre-emulator-launch-script: python3 repairs/four-repair-20261018/android37_gate.py --sdk-root "$ANDROID_HOME" --out api37-support --check-avd
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 repairs/universal-persistence-2103401/receipt_probe.py android --out receipt-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Infinity-Receipt-Race-Android17-Investigation
          path: |
            receipt-evidence/
            api37-support/
            emulator-setup/
          retention-days: 90
          if-no-files-found: error
