name: Infinity | File Preview Signed Candidate 2103375
on:
  push:
    branches: [work/infinity-zip-preview-native-2103375]
    paths:
      - 'repairs/zip-preview-2103375/manifest_patch.py'
      - 'repairs/zip-preview-2103375/package_native.py'
      - 'repairs/zip-preview-2103375/verify_android_parent.py'
      - '.github/workflows/infinity-2103375-file-preview-package.yml'
permissions: {contents: read, actions: read}
concurrency: {group: infinity-file-preview-package-2103375, cancel-in-progress: false}
jobs:
  verify-and-sign:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      NDK_VER: 21.4.7075529
      KODI_ANDROID_KEY_ALIAS: androiddebugkey
      KODI_ANDROID_KEY_PASSWORD: android
      KODI_ANDROID_STORE_PASSWORD: android
      KODI_ANDROID_STORE_FILE: /home/runner/.android/debug.keystore
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: '${{ github.sha }}'}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-${{ runner.os }}-21.4.7075529-v1
      - run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - uses: actions/download-artifact@v8
        with:
          run-id: 38232872153
          name: Cobra-2103373-Targeted-Isolation-Evidence
          github-token: ${{ github.token }}
          path: locked-evidence
      - uses: actions/download-artifact@v8
        with:
          run-id: 38232872153
          name: Cobra-2103373-Targeted-Isolation-Signed-Test-APK
          github-token: ${{ github.token }}
          path: locked-apk
      - uses: actions/download-artifact@v8
        with:
          run-id: 38246713743
          name: Cobra-2103374-Verified-Deadweight-Signed-Test-APK
          github-token: ${{ github.token }}
          path: locked-parent
      - uses: actions/download-artifact@v8
        with:
          run-id: 38246713743
          name: Cobra-2103374-Verified-Deadweight-Evidence
          github-token: ${{ github.token }}
          path: locked-2103374-evidence
      - uses: actions/download-artifact@v8
        with:
          run-id: 38265764946
          name: Cobra-2103375-Zip-Preview-Native-Internal
          github-token: ${{ github.token }}
          path: native-engine
      - uses: actions/download-artifact@v8
        with:
          run-id: 38265764946
          name: Cobra-2103375-Zip-Preview-Native-Evidence
          github-token: ${{ github.token }}
          path: native-proof
      - name: Stage unchanged locked Java and all 207 existing regression cases
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" cleanup-evidence preview-package
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Compile Only,O=Android,C=US'
          fi
          python3 repairs/verified-deadweight-2103374/gate.py prepare --parent locked-evidence --base locked-apk/Cobra-2103373-Targeted-Isolation-RC1.apk --build cleanup-build --out cleanup-evidence
      - name: Run all 207 unchanged Android regression cases
        run: |
          set -euo pipefail
          ./cleanup-build/gradlew --no-daemon --console=plain -p cleanup-build :xbmc:testReleaseUnitTest 2>&1 | tee cleanup-evidence/test.log
      - name: Require exact test membership and exact locked 2103374 runtime sources
        run: |
          set -euo pipefail
          python3 repairs/verified-deadweight-2103374/gate.py review --parent locked-evidence --base locked-apk/Cobra-2103373-Targeted-Isolation-RC1.apk --build cleanup-build --out cleanup-evidence
          python3 repairs/zip-preview-2103375/verify_android_parent.py --locked locked-2103374-evidence --fresh cleanup-evidence --build cleanup-build
      - name: Package reviewed native-only delta and sign with permanent Infinity identity
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: python3 repairs/zip-preview-2103375/package_native.py --parent locked-parent/Cobra-2103374-Verified-Deadweight-RC1.apk --engine native-engine --proof native-proof --tests cleanup-evidence --out preview-package
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Cobra-2103375-File-Preview-Native-Signed-Test-APK
          path: preview-package/Cobra-2103375-File-Preview-Native-RC1.apk
          if-no-files-found: error
          retention-days: 90
      - name: Preserve test and packaging evidence
        if: always()
        run: |
          mkdir -p preview-package
          if [ -d cleanup-evidence/source ]; then tar -czf preview-package/runtime-source.tar.gz -C cleanup-evidence source; fi
          if [ -d cleanup-build/xbmc/src/test ]; then tar -czf preview-package/test-source.tar.gz -C cleanup-build/xbmc/src test; fi
          cp repairs/zip-preview-2103375/*.py repairs/zip-preview-2103375/*.json preview-package/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Cobra-2103375-File-Preview-Package-Evidence
          path: |
            preview-package/*.json
            preview-package/*.txt
            preview-package/*.py
            preview-package/*.tar.gz
            cleanup-evidence/*.json
            cleanup-evidence/*.log
            cleanup-evidence/runtime/
            cleanup-evidence/screenshots/
            cleanup-build/xbmc/build/test-results/testReleaseUnitTest/
          if-no-files-found: error
          retention-days: 90
