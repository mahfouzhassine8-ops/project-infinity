name: Infinity462 keyboard candidate complete ARM64 engine verification - NO APK
on:
  push:
    branches: [ci/infinity462-keyboard-full-engine-unreleased-20261107]
    paths: [.github/workflows/infinity462-keyboard-full-engine-unreleased.yml]
permissions: {contents: read, actions: read}
concurrency:
  group: infinity462-keyboard-full-engine-unreleased
  cancel-in-progress: false
jobs:
  full-arm64-internal:
    name: Link exact 462 native engine with one keyboard candidate; no APK/no signing
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    env:
      GH_TOKEN: ${{ github.token }}
      NDK_VER: '21.4.7075529'
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools build-tools;35.0.0 platforms;android-34', log-accepted-android-sdk-licenses: false}
      - name: Fail closed if any existing source or signing files changed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          base='92bb6ecbb21c14f62f40555ba2aaef198e3847e2'
          allowed={'.github/workflows/infinity462-keyboard-full-engine-unreleased.yml'}
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert changed == allowed, ('Unexpected changed paths',changed)
          assert subprocess.check_output(['git','show',base+':repairs/infinity-native-keyboard-scaling-462-20261107/native/xbmc/guilib/GUIKeyboardFactory.cpp']) == open('repairs/infinity-native-keyboard-scaling-462-20261107/native/xbmc/guilib/GUIKeyboardFactory.cpp','rb').read()
          print('PASS only isolated CI workflow differs; protected 462 source candidate identical')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13274901825', run-id: '41726452356', merge-multiple: true, github-token: '${{ github.token }}', path: verified-inputs}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13571276665', run-id: '42364232328', merge-multiple: true, github-token: '${{ github.token }}', path: previous-review}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13571601535', run-id: '42365578534', merge-multiple: true, github-token: '${{ github.token }}', path: keyboard-after}
      - name: Restore exact 462 native source map and one keyboard correction
        run: python3 repairs/infinity-native-keyboard-scaling-462-20261107/compile_keyboard.py restore
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '11698374892', run-id: '38132105717', merge-multiple: true, github-token: '${{ github.token }}', path: dependency-transfer}
      - name: Verify and restore pinned original compiler dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y python3-yaml python3-dev libsqlite3-dev libssl-dev libffi-dev
          (cd dependency-transfer && sha256sum -c SHA256SUMS)
          tar --no-same-owner -xf dependency-transfer/verified-android-dependencies.tar
          tar --no-same-owner -xf dependency-transfer/verified-compiler-cache.tar -C "$HOME"
      - uses: actions/cache@v4
        with: {path: /usr/local/lib/android/sdk/ndk/21.4.7075529, key: infinity-pinned-ndk-linux-21.4.7075529-v1}
      - name: Restore unchanged pinned NDK
        run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - name: Link complete ARM64 native engine using existing original build recipe
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          root=Path.cwd()
          out=root/'native-ownership-review'
          sys.path.insert(0,str(root/'repairs/universal-persistence-2103401'))
          path=root/'repairs/universal-persistence-2103401/build.py'
          spec=importlib.util.spec_from_file_location('original_full_engine_builder',path)
          builder=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)
          builder.OUT=out
          proof=builder.compile_engine()
          native=out/'libkodi.so'
          assert native.is_file() and native.stat().st_size>50_000_000
          mapping=json.loads((out/'NATIVE-SOURCE-MAP.json').read_text())
          original=json.loads((root/'previous-review/NATIVE-SOURCE-MAP.json').read_text())
          assert len(original)==len(mapping)==9411
          assert {n for n in mapping if mapping[n]!=original[n]}=={'xbmc/guilib/GUIKeyboardFactory.cpp'}
          tool=Path(os.environ['ANDROID_HOME'])/'ndk/21.4.7075529/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf'
          elf=subprocess.check_output([str(tool),'-h',str(native)],text=True)
          assert 'ELF64' in elf and 'AArch64' in elf and 'DYN' in elf
          (out/'FULL-ENGINE-ABI.txt').write_text(elf)
          complete={
           'status':'PASS_FULL_ARM64_LINK_ONE_KEYBOARD_CANDIDATE',
           'source_commit':os.environ['GITHUB_SHA'],
           'protected_native_files_unchanged':9410,
           'native_sha256':builder.patch.sha(native.read_bytes()),
           'native_bytes':native.stat().st_size,
           'graphics_repair':False,
           'search_settings_repair':False,
           'APK':False,
           'signed':False,
           'Android_runtime':'NOT_RUN',
           'Fold':'NOT_RUN',
          }
          (out/'FULL-ENGINE-INTERNAL-ONLY.json').write_text(json.dumps(complete,indent=2,sort_keys=True)+'\n')
          print(json.dumps(complete,sort_keys=True))
          PY
      - name: Explain explicit release limits
        if: always()
        run: |
          mkdir -p native-ownership-review
          printf '%s\n' 'INTERNAL NATIVE LINK ONLY. No APK was produced, signed, installed or delivered. Graphics synchronization, Search settings/ABA acceptance and on-device behavior remain unresolved.' > native-ownership-review/LIMITS.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity462-Keyboard-Full-ARM64-Native-UNRELEASED-${{ github.run_id }}
          path: native-ownership-review/
          retention-days: 30
          if-no-files-found: warn
