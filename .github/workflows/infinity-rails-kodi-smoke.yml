name: Infinity | Rails helper real Kodi smoke
on:
  push:
    branches: [work/infinity-rails-hold-2103378]
    paths:
      - '.github/workflows/infinity-rails-kodi-smoke.yml'
      - 'features/infinity-rails-investigation-20261014/addons/script.infinity.rails/**'
      - 'repairs/rails-hold-2103378/*kodi_smoke.py'
permissions: {contents: read}
jobs:
  real-kodi:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y kodi xvfb xdotool fonts-dejavu-core
          python3 repairs/rails-hold-2103378/setup_kodi_smoke.py
      - name: Exercise callback, real dialog and normal plugin launch
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x720x24 > /tmp/rails-xvfb.log 2>&1 &
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1
          kodi --standalone > /tmp/rails-kodi-console.log 2>&1 &
          for attempt in $(seq 1 60); do
            window=$(xdotool search --name '^Kodi' 2>/dev/null | head -1 || true)
            if [ -n "$window" ]; then break; fi
            sleep 1
          done
          sleep 10
          xdotool windowfocus --sync "$window"
          xdotool key --window "$window" F12
          for attempt in $(seq 1 120); do
            if [ -f "$HOME/.kodi/userdata/rail-smoke-result.json" ]; then break; fi
            sleep 1
          done
          python3 -c 'import json,pathlib; p=pathlib.Path.home()/".kodi/userdata/rail-smoke-result.json"; r=json.loads(p.read_text()); print(json.dumps(r,indent=2)); assert r["passed"]'
      - name: Collect isolated Kodi receipts
        if: always()
        run: |
          mkdir -p smoke-evidence
          for file in "$HOME/.kodi/userdata/rail-smoke-result.json" "$HOME/.kodi/userdata/rail-options.png" "$HOME/.kodi/temp/kodi.log" /tmp/rails-kodi-console.log /tmp/rails-xvfb.log; do
            if [ -f "$file" ]; then cp "$file" smoke-evidence/; fi
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-Rails-Real-Kodi-Smoke
          path: smoke-evidence/
          retention-days: 30
