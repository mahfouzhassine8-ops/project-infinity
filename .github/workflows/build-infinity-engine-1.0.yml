name: Infinity Engine Standalone V1

on:
  workflow_dispatch:
  push:
    branches:
      - infinity-engine-donor-v1
    paths:
      - '.github/workflows/build-infinity-engine-1.0.yml'
      - 'engine/**'

jobs:
  build-arm64:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      KODI_TAG: 21.3-Omega
      KODI_SHA: a3a448d26b8d560a65655dab2cd122994dc4e146
      INFINITY_PACKAGE: com.infinity.engine
      NDK_VER: 21.4.7075529
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install host dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf bison build-essential curl flex gawk git gperf lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev unzip zip zlib1g-dev ccache python3 nasm yasm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Toolchain preflight
        run: |
          set -euxo pipefail
          java -version
          JAVA_MAJOR=$(java -version 2>&1 | awk -F'[".]' '/version/ {print $2; exit}')
          test "${JAVA_MAJOR}" -ge 17
          command -v sdkmanager
          command -v keytool
          sdkmanager --version
          test -n "${ANDROID_HOME:-}"
          test -d "${ANDROID_HOME}"

      - name: Install exact Android requirements
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;33.0.1" "ndk;${NDK_VER}"
          test -d "${ANDROID_HOME}/platforms/android-34"
          test -d "${ANDROID_HOME}/build-tools/33.0.1"
          test -d "${ANDROID_HOME}/ndk/${NDK_VER}"

      - name: Clone and verify exact Kodi 21.3 source
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "${KODI_TAG}" https://github.com/xbmc/xbmc.git kodi
          cd kodi
          test "$(git rev-parse HEAD)" = "${KODI_SHA}"

      - name: Give Infinity a standalone Android identity
        run: |
          set -euxo pipefail
          grep -q '^APP_PACKAGE org.xbmc.kodi$' kodi/version.txt
          sed -i "s/^APP_PACKAGE org\.xbmc\.kodi$/APP_PACKAGE ${INFINITY_PACKAGE}/" kodi/version.txt
          grep -q "^APP_PACKAGE ${INFINITY_PACKAGE}$" kodi/version.txt
          test "$(grep '^APP_PACKAGE ' kodi/version.txt | awk '{print $2}')" != "org.xbmc.kodi"

      - name: Apply and preflight unified Infinity modernization
        run: |
          set -euxo pipefail
          python3 engine/patches/apply_phase1.py
          MAIN=kodi/tools/android/packaging/xbmc/src/Main.java.in
          MEDIA=kodi/tools/android/packaging/xbmc/src/XBMCMediaSession.java.in
          MANIFEST=kodi/tools/android/packaging/xbmc/AndroidManifest.xml.in
          grep -q 'public static final class InfinityEngineState' "$MAIN"
          grep -q 'onConfigurationChanged(Configuration newConfig)' "$MAIN"
          grep -q 'onMultiWindowModeChanged(boolean isInMultiWindowMode)' "$MAIN"
          grep -q 'onPictureInPictureModeChanged(boolean isInPictureInPictureMode)' "$MAIN"
          grep -q 'enterInfinityPictureInPicture' "$MAIN"
          grep -q 'Main.InfinityEngineState.updatePlaybackState' "$MEDIA"
          grep -q 'android:supportsPictureInPicture="true"' "$MANIFEST"
          grep -q 'android:resizeableActivity="true"' "$MANIFEST"
          grep -q 'android:screenOrientation="unspecified"' "$MANIFEST"
          test ! -e kodi/tools/android/packaging/xbmc/src/InfinityEngineState.java.in

      - name: Cache Kodi depends
        uses: actions/cache@v4
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            ~/.ccache
          key: infinity-standalone-v1-kodi-21.3-arm64-${{ runner.os }}-ndk-${{ env.NDK_VER }}-v2
          restore-keys: |
            infinity-standalone-v1-kodi-21.3-arm64-${{ runner.os }}-
            infinity-unified-v1-kodi-21.3-arm64-${{ runner.os }}-
            infinity-donor-v1-kodi-21.3-arm64-${{ runner.os }}-
            infinity-kodi-21.3-arm64-${{ runner.os }}-

      - name: Configure Android dependencies
        run: |
          set -euxo pipefail
          mkdir -p "${TARBALLS}" "${DEPENDS}"
          cd kodi/tools/depends
          ./bootstrap
          ./configure \
            --with-tarballs="${TARBALLS}" \
            --host=aarch64-linux-android \
            --with-sdk-path="${ANDROID_HOME}" \
            --with-ndk-path="${ANDROID_HOME}/ndk/${NDK_VER}" \
            --prefix="${DEPENDS}" \
            --enable-debug=yes

      - name: Build Android dependencies
        run: |
          set -euxo pipefail
          make -C kodi/tools/depends -j"$(nproc)"

      - name: Configure Infinity engine
        run: |
          set -euxo pipefail
          mkdir -p "${BUILD_DIR}"
          make -C kodi/tools/depends/target/cmakebuildsys BUILD_DIR="${BUILD_DIR}"
          test -f "${BUILD_DIR}/CMakeCache.txt"
          grep -q "^APP_PACKAGE ${INFINITY_PACKAGE}$" kodi/version.txt

      - name: Build Infinity engine
        run: |
          set -euxo pipefail
          make -C "${BUILD_DIR}" -j"$(nproc)"

      - name: Create Android debug signing key
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Package standalone APK
        run: |
          set -euxo pipefail
          make -C "${BUILD_DIR}" apk
          APK=$(find kodi "${BUILD_DIR}" -type f -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" "${GITHUB_WORKSPACE}/Infinity-Engine-Standalone-V1.apk"

      - name: Verify standalone identity and APK
        run: |
          set -euxo pipefail
          test -s Infinity-Engine-Standalone-V1.apk
          unzip -t Infinity-Engine-Standalone-V1.apk >/dev/null
          unzip -l Infinity-Engine-Standalone-V1.apk | grep -q 'lib/arm64-v8a/'
          AAPT="${ANDROID_HOME}/build-tools/33.0.1/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging Infinity-Engine-Standalone-V1.apk | tee Infinity-Engine-Standalone-V1.badging.txt
          grep -q "package: name='${INFINITY_PACKAGE}'" Infinity-Engine-Standalone-V1.badging.txt
          if grep -q "package: name='org.xbmc.kodi'" Infinity-Engine-Standalone-V1.badging.txt; then
            echo 'Refusing artifact: APK would overwrite Kodi'
            exit 1
          fi
          sha256sum Infinity-Engine-Standalone-V1.apk | tee Infinity-Engine-Standalone-V1.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-Engine-Standalone-V1
          path: |
            Infinity-Engine-Standalone-V1.apk
            Infinity-Engine-Standalone-V1.sha256
            Infinity-Engine-Standalone-V1.badging.txt
          retention-days: 30
