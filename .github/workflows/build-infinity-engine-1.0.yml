name: Infinity Engine Donor V1

on:
  workflow_dispatch:
  push:
    branches:
      - infinity-engine-donor-v1
    paths:
      - '.github/workflows/build-infinity-engine-1.0.yml'
      - 'engine/**'

jobs:
  build-arm64:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      KODI_TAG: 21.3-Omega
      KODI_SHA: a3a448d26b8d560a65655dab2cd122994dc4e146
      NDK_VER: 21.4.7075529
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install host dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf bison build-essential curl flex gawk git gperf lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev unzip zip zlib1g-dev ccache python3 nasm yasm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Toolchain preflight
        run: |
          set -euxo pipefail
          java -version
          JAVA_MAJOR=$(java -version 2>&1 | awk -F'[".]' '/version/ {print $2; exit}')
          test "${JAVA_MAJOR}" -ge 17
          command -v sdkmanager
          sdkmanager --version
          test -n "${ANDROID_HOME:-}"
          test -d "${ANDROID_HOME}"

      - name: Install exact Android requirements
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;33.0.1" "ndk;${NDK_VER}"
          test -d "${ANDROID_HOME}/platforms/android-34"
          test -d "${ANDROID_HOME}/build-tools/33.0.1"
          test -d "${ANDROID_HOME}/ndk/${NDK_VER}"

      - name: Clone and verify exact Kodi 21.3 source
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "${KODI_TAG}" https://github.com/xbmc/xbmc.git kodi
          cd kodi
          test "$(git rev-parse HEAD)" = "${KODI_SHA}"

      - name: Apply Infinity Engine Phase 1 core changes
        run: |
          set -euxo pipefail
          python3 engine/patches/apply_phase1.py
          grep -q 'InfinityEngineState.updateWindow' kodi/tools/android/packaging/xbmc/src/Main.java.in
          grep -q 'InfinityEngineState.updatePlaybackState' kodi/tools/android/packaging/xbmc/src/XBMCMediaSession.java.in
          test -f kodi/tools/android/packaging/xbmc/src/InfinityEngineState.java.in

      - name: Cache Kodi depends
        uses: actions/cache@v4
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            ~/.ccache
          key: infinity-donor-v1-kodi-21.3-arm64-${{ runner.os }}-${{ hashFiles('engine/**') }}
          restore-keys: |
            infinity-kodi-21.3-arm64-${{ runner.os }}-

      - name: Configure Android dependencies
        run: |
          set -euxo pipefail
          mkdir -p "${TARBALLS}" "${DEPENDS}"
          cd kodi/tools/depends
          ./bootstrap
          ./configure \
            --with-tarballs="${TARBALLS}" \
            --host=aarch64-linux-android \
            --with-sdk-path="${ANDROID_HOME}" \
            --with-ndk-path="${ANDROID_HOME}/ndk/${NDK_VER}" \
            --prefix="${DEPENDS}" \
            --enable-debug=yes

      - name: Build Android dependencies
        run: |
          set -euxo pipefail
          make -C kodi/tools/depends -j"$(nproc)"

      - name: Configure Infinity engine
        run: |
          set -euxo pipefail
          mkdir -p "${BUILD_DIR}"
          make -C kodi/tools/depends/target/cmakebuildsys BUILD_DIR="${BUILD_DIR}"
          test -f "${BUILD_DIR}/CMakeCache.txt"

      - name: Build Infinity engine
        run: |
          set -euxo pipefail
          make -C "${BUILD_DIR}" -j"$(nproc)"

      - name: Package APK
        run: |
          set -euxo pipefail
          make -C "${BUILD_DIR}" apk
          APK=$(find kodi "${BUILD_DIR}" -type f -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" "${GITHUB_WORKSPACE}/Infinity-Engine-Donor-V1.apk"

      - name: Static smoke checks
        run: |
          set -euxo pipefail
          test -s Infinity-Engine-Donor-V1.apk
          unzip -t Infinity-Engine-Donor-V1.apk >/dev/null
          unzip -l Infinity-Engine-Donor-V1.apk | grep -q 'lib/arm64-v8a/'
          sha256sum Infinity-Engine-Donor-V1.apk | tee Infinity-Engine-Donor-V1.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-Engine-Donor-V1
          path: |
            Infinity-Engine-Donor-V1.apk
            Infinity-Engine-Donor-V1.sha256
          retention-days: 30
