name: onn TV remote source audit

on:
  workflow_dispatch:
  push:
    branches: [infinity-cobra-2103221-onn4kpro-tv-remote-ui-rc4]
    paths:
      - '.github/workflows/onn-tv-remote-source-audit.yml'
      - 'repairs/onn4kpro-tv-grid-only-2103220/**'
      - 'repairs/onn4kpro-tv-remote-ui-2103221/**'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Download exact 2103208 Android source parent
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103208-Integration-Polish-TEST-CANDIDATE-Replica-1-Attempt-1
          run-id: 35676573761
          github-token: ${{ github.token }}
          path: baseline208

      - name: Download preserved 2103209 mobile engine for source reconstruction only
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103209-Python311-GIL-Native-Engine
          run-id: 35693288744
          github-token: ${{ github.token }}
          path: native209

      - name: Reconstruct and apply exact 2103220 TV Grid source
        run: |
          set -euo pipefail
          mkdir -p engine audit219
          cp native209/pythoninvoker-threadstate-v2-source.json engine/pythoninvoker-threadstate-v2-source.json
          cp native209/pythoninvoker-threadstate-v2-source.stage1.json engine/pythoninvoker-threadstate-v2-source.stage1.json
          python3 repairs/python311-gil-2103209/ci.py prepare \
            --base-dir baseline208 \
            --native-apk native209/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2-Engine-Base.apk \
            --shell shell-kodi \
            --out audit219/mobile-source-base
          python3 repairs/cobra-media-library-health-2103210/apply.py --shell shell-kodi
          python3 repairs/cobra-library-health-2103211/apply.py --shell shell-kodi
          python3 repairs/health-media-trim-2103212/apply.py --shell shell-kodi
          python3 repairs/live-blue-ambient-settings-return-2103213/apply.py --shell shell-kodi
          python3 repairs/media-details-final-2103214/apply.py --shell shell-kodi
          python3 repairs/smart-return-experience-drawer-2103215/apply.py --shell shell-kodi
          python3 repairs/smart-return-experience-display-2103216/apply.py --shell shell-kodi
          python3 repairs/media-return-context-2103217/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-2103218/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-remote-2103219/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-grid-only-2103220/apply.py --shell shell-kodi

      - name: Print TV groups player preview remote source contexts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('shell-kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in')
          s=p.read_text()
          lines=s.splitlines()

          def method(name):
              start=s.find(name)
              if start < 0:
                  print('NOT FOUND:',name); return
              brace=s.find('{',start)
              if brace < 0:
                  print('NO BRACE:',name); return
              depth=0; end=None
              for i in range(brace,len(s)):
                  ch=s[i]
                  if ch=='{': depth+=1
                  elif ch=='}':
                      depth-=1
                      if depth==0:
                          end=i+1; break
              print('\n===== '+name+' =====')
              print(s[start:end])

          for name in (
              'private boolean cobraMotionEnabled(',
              'private void cobraPolishFocusable(',
              'private void cobraAnimateChildrenIn(',
              'private void cobraAnimatePanelIn(',
              'private void cobraInspectProgramme(',
              '@Override public boolean dispatchKeyEvent(',
              'private Button cobraTextButton(',
              'private CobraIconButton cobraIcon(',
              'private void cobraPolishDrawerRow(',
          ):
              method(name)

          print('\n===== FOCUS LISTENERS =====')
          for n,line in enumerate(lines,1):
              if 'setOnFocusChangeListener' in line or 'KEYCODE_DPAD' in line:
                  print(f'{n:05d}: {line}')

          print('\n===== TV SETTINGS / PHONE-ONLY REFERENCES =====')
          phone_pat=re.compile(r'PictureInPicture|PIP|Background Mode|Play in Background|DISPLAY|Performance|120|refresh|rotation|orientation|Media During Calls|phone call|file picker|Ask every time|gesture|swipe|touch',re.I)
          for n,line in enumerate(lines,1):
              if phone_pat.search(line):
                  print(f'{n:05d}: {line}')

          print('\n===== TV GROUP / PLAYER / PREVIEW REFERENCES =====')
          tvui_pat=re.compile(r'group|category|preview|player chrome|player drawer|timeshift|seek|subtitle|audio track|more|quick peek|focusable|requestFocus|dpad',re.I)
          for n,line in enumerate(lines,1):
              if tvui_pat.search(line):
                  print(f'{n:05d}: {line}')

          print('\n===== TV MODE / VIEW REFERENCES =====')
          mode_pat=re.compile(r'TV Grid|Normal|Cinema|Focus|Compact|GuideStyle|mCobraGuideStyle|view mode|mode label|cobraMode',re.I)
          for n,line in enumerate(lines,1):
              if mode_pat.search(line):
                  print(f'{n:05d}: {line}')

          def token_method(token):
              start=s.find(token)
              if start < 0:
                  print('TOKEN NOT FOUND:',token); return
              line_start=s.rfind('\n',0,start)+1
              brace=s.find('{',start)
              if brace < 0:
                  print('NO BRACE:',token); return
              depth=0; end=None
              for i in range(brace,len(s)):
                  ch=s[i]
                  if ch=='{': depth+=1
                  elif ch=='}':
                      depth-=1
                      if depth==0:
                          end=i+1; break
              print('\n===== TOKEN '+token+' =====')
              print(s[line_start:end])

          for token in (
              'cobraBuildModeChrome()',
              'cobraTouchFirstDevice()',
              'closeCobraExperienceDrawer()',
              'static CobraModeLayout solve(',
              'cobraDrawerView(',
              'cobraBackgroundPlaybackRequested(',
              'cobraChannelBackgroundEnabled(',
              'cobraMiniBackground',
              'pauseCobraForBackground(',
              'cobraBackgroundModeLabel(',
              'cobraMiniBackgroundLabel(',
              'cobraInstallModeList(',
              'scheduleChromeHide(',
              'showPlayerSettingsDrawer(',
              'closeCobraPlayerDrawer(',
              'openPlayerOverlay(',
              'showTrackChooser(',
              'cobraOpenSheet(',
          ):
              token_method(token)

          for name in (
              'private void showCobraMode'
              'private void cobraShowMode',
              'private void cobraSetMode',
              'private void cobraSetGuideStyle',
              'private void showCobraVisual',
              'private void cobraShowVisual',
              'private void cobraRenderGuideBrowser',
              'private String cobraGuideViewMode(',
              'private String cobraGuideViewModeLabel(',
              'private void showCobraViewModeMenu(',
              'private void cobraSetGuideMode(',
              'private void cobraApplyMode(',
              'private void toggleCobraDrawer(',
              'private void closeCobraExperienceDrawer(',
              'private void cobraDrawerDestination(',
              'private LinearLayout cobraDrawerViewRow(',
              'private LinearLayout cobraBrandHeader(',
              'private void cobraPremiumViewMenu(',
              'private void cobraSwitchMode(',
              'private void showSettings(',
              'private void cobraAddDisplayPerformance',
              'private void cobraAddBackground',
              'private void cobraAddPlayInBackground',
              'private void cobraShowBackgroundMode',
              'private void cobraAddRotation',
              'private void cobraAddMediaDuringCalls',
              'private void cobraShowMediaDuringCalls',
              'private void enterCobraPip',
              'private void cobraEnterPictureInPicture',
              'private void cobraApplyPlayerRotation',
              'private void cobraUpdatePlayerRotationButton',
              'private void cobraShowVisualMenu(',
              'private PictureInPictureParams cobraPipParams(',
              'private void configureCobraPip(',
              'private void enterCobraPictureInPicture(',
              'private boolean cobraWantsFullscreenPip(',
              'private void onCobraUserLeaveHint',
              'private void cobraAddPresentationSettings(',
              'private String cobraPlayerRotationMode(',
              'private int cobraPlayerRotationMode(',
              'private void cobraShowChannelPreferences(',
              'private void cobraToggleModeGroups(',
              'private void cobraDirectory(',
              'private void cobraOpenTvDirectory(',
              'private void cobraRenderGridMode(',
              'private void cobraBuildPlayerChrome(',
              'private void showCobraPlayerDrawer(',
              'private void cobraRenderPlayerDrawer(',
              'private void closeCobraPlayerDrawer(',
              'private void showPlayerChromeTemporarily(',
              'private void hidePlayerChrome(',
              'private void cobraRefreshModeDetails(',
              'private void updateCobraPreviewDetails(',
              'private void startCobraPreview(',
              'private FrameLayout cobraPreviewPanel(',
              'private void cobraShowQuickPeek(',
              'private void cobraRefreshQuickPeek(',
              'private void showCobraAudioSubtitleMenu(',
              'private void showCobraMoreMenu(',
              'private void showCobraPlayerMoreMenu(',
              'private void showCobraTracks(',
          ):
              method(name)
          PY

      - name: Print TV manifest compatibility flags
        run: |
          set -euo pipefail
          grep -n -E 'supportsPictureInPicture|resizeableActivity|screenOrientation|LEANBACK|touchscreen|television|autoEnterEnabled' shell-kodi/tools/android/packaging/xbmc/AndroidManifest.xml.in || true
