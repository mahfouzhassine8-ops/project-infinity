name: Infinity | 2103268 Display Player Product Audit RC1
on:
  workflow_dispatch:
  push:
    branches: [infinity-cobra-2103268-display-player-audit-rc1]
    paths: ['.github/workflows/infinity-2103268-display-player-audit.yml', 'repairs/display-player-2103268/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: cobra-display-player-${{ github.sha }}
  cancel-in-progress: false
env:
  NDK_VER: 21.4.7075529
  KODI_ANDROID_KEY_ALIAS: androiddebugkey
  KODI_ANDROID_KEY_PASSWORD: android
  KODI_ANDROID_STORE_PASSWORD: android
jobs:
  android-product-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103267-Cobra-Playing-Dot-Restore-RC1-TEST-CANDIDATE
          run-id: 36684966394
          github-token: ${{ github.token }}
          path: parent267
      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103267-Cobra-Playing-Dot-Restore-RC1-Evidence
          run-id: 36684966394
          github-token: ${{ github.token }}
          path: source267
      - uses: actions/download-artifact@v8
        with:
          name: Infinity-2103265-Phone-Glass-Polish-RC1-Evidence
          run-id: 36671687282
          github-token: ${{ github.token }}
          path: source265
      - name: Verify exact locked baseline and preserve rollback
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          assert hashlib.sha256(Path('parent267/Infinity-2103267-Cobra-Playing-Dot-Restore-RC1.apk').read_bytes()).hexdigest()=='686d606534906358d35934bf6430972279efeab387731b4178d2dfbd2fe12070'
          assert hashlib.sha256(Path('source267/reconstructed-2103267-shell.tar.gz').read_bytes()).hexdigest()=='2d7444bfac5a9fa8a364c1edc6c3fb58886159d41cbb51bb6cee0d8252567e18'
          with zipfile.ZipFile('parent267/Infinity-2103267-Cobra-Playing-Dot-Restore-RC1.apk') as z:
            Path('engine').mkdir(exist_ok=True)
            Path('engine/libinfinitycrash.so').write_bytes(z.read('lib/arm64-v8a/libinfinitycrash.so'))
          PY
          tar --no-same-owner -xzf source267/reconstructed-2103267-shell.tar.gz
          mkdir -p rollback267/engine rollback267/scripts audit268
          cp -a shell-kodi rollback267/
          cp engine/background-resume-source.json rollback267/engine/
          cp scripts/package_background_resume.py scripts/infinity_background_resume.py rollback267/scripts/
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0' "ndk;$NDK_VER" >/dev/null
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          echo "KODI_ANDROID_STORE_FILE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
      - name: Compile locked baseline and demonstrate product failures
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import package_background_resume as p
          p.BASE_APK_SHA256='686d606534906358d35934bf6430972279efeab387731b4178d2dfbd2fe12070'
          p.prepare(Path('shell-kodi').resolve(),Path('parent267/Infinity-2103267-Cobra-Playing-Dot-Restore-RC1.apk').resolve(),Path('build267').resolve(),Path('audit268').resolve())
          PY
          python3 repairs/display-player-2103268/stage_tests.py --build build267 --evidence audit268/baseline-screenshots
          cd build267
          set +e
          ./gradlew --no-daemon --console=plain :xbmc:testReleaseUnitTest \
            --tests '*Cobra2103268ProductAuditTest.fullscreenBestFitFillsWithoutStretchingAcrossRepresentativeSourcesAndPanes' \
            --tests '*Cobra2103268ProductAuditTest.displayScrollAffordanceIsVisibleAndSelectedBottomChoiceRevealsItself' \
            --tests '*Cobra2103268ProductAuditTest.channelCustomResetIsReachablePersistsAndDoesNotAffectOtherChannel' \
            --tests '*Cobra2103268ProductAuditTest.allFiveTransportControlsStayReachableOnCoverAndLargeText' \
            --tests '*Cobra2103268ProductAuditTest.channelsDotTracksActualSessionIndependentlyOfDrawerFocus' \
            --tests '*Cobra2103268ProductAuditTest.everyDisplayChoiceChangesActualPaneThroughItsVisibleControlAndRecordsObservation' 2>&1 | tee ../audit268/baseline-product-tests.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -ne 0
          cd ..
          python3 - <<'PY'
          import xml.etree.ElementTree as E
          t=E.parse('build267/xbmc/build/test-results/testReleaseUnitTest/TEST-com.projectinfinity.kodi.Cobra2103268ProductAuditTest.xml').getroot()
          assert int(t.attrib['tests'])==6 and int(t.attrib['failures'])==5 and int(t.attrib.get('errors',0))==0,t.attrib
          for c in t.findall('testcase'):
            f=c.find('failure')
            if c.attrib['name'].startswith('everyDisplayChoice'):assert f is None
            else:
              expected={'fullscreenBestFit':'No unexplained','displayScrollAffordance':'15 choices must announce scrolling','channelCustomReset':'cobra-channel-custom-reset','allFiveTransport':'escapes pane','channelsDot':'Actual player Channels must carry locked playing dot'}
              message=next(v for k,v in expected.items() if c.attrib['name'].startswith(k))
              assert f is not None and f.attrib['type']=='java.lang.AssertionError' and message in f.attrib.get('message',''),(c.attrib,f.attrib if f is not None else None)
          PY
      - name: Apply scoped forward repairs and source-preservation gate
        run: |
          python3 repairs/display-player-2103268/apply.py --root . --out audit268
          python3 repairs/display-player-2103268/verify_source.py --baseline rollback267 --root . --out audit268
      - name: Compile and permanently sign one forward APK
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 scripts/package_background_resume.py --source shell-kodi --base-apk parent267/Infinity-2103267-Cobra-Playing-Dot-Restore-RC1.apk --build-dir build268 --out signed268 2>&1 | tee audit268/android-build.log
      - name: Run intended-outcome Display Player and locked preservation regressions
        run: |
          set -euo pipefail
          python3 repairs/display-player-2103268/stage_tests.py --build build268 --evidence audit268/screenshots --inherited
          cd build268
          ./gradlew --no-daemon --console=plain :xbmc:testReleaseUnitTest \
            --tests '*Cobra2103268ProductAuditTest' --tests '*Cobra2103201ScrubberTest' \
            --tests '*Cobra2103201SubtitleTest' --tests '*Cobra2103202LifecycleTest' \
            --tests '*Cobra2103203PipControlsTest' --tests '*Cobra2103206MediaCallsTest' \
            --tests '*Cobra2103207CallIntegrationTest' --tests '*Cobra2103207AudioStateTest' --tests '*Cobra2103203SubtitleClarityTest' \
            --tests '*Cobra2103229MultiViewStabilityFillTest' \
            --tests '*GlassChooserTest' --tests '*GlassOptionsTest' --tests '*GlassHealthFinishTest' \
            --tests '*RecoveryFixedTest' --tests '*ProVisualTest' --tests '*ProActionsTest' \
            --tests '*PhoneGlassTest' --tests '*AmbientGlassTest' --tests '*Cobra2103267PlayingDotRestoreTest' \
            2>&1 | tee ../audit268/android-product-tests.log
      - name: Candidate acceptance and protected APK payload gate
        run: |
          set -euo pipefail
          python3 repairs/display-player-2103268/verify_source.py --baseline rollback267 --root . --out audit268
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,xml.etree.ElementTree as E
          files=list(Path('build268/xbmc/build/test-results/testReleaseUnitTest').glob('TEST-*.xml'));assert len(files)==19,len(files)
          counts={}
          for f in files:
            t=E.parse(f).getroot();assert all(int(t.attrib.get(k,0))==0 for k in ['failures','errors','skipped']),(f,t.attrib);counts[t.attrib['name']]=int(t.attrib['tests'])
          assert counts['com.projectinfinity.kodi.Cobra2103268ProductAuditTest']==15,counts
          locked=Path('source267/screenshots/protected');current=Path('audit268/screenshots/protected');names=sorted(p.name for p in locked.glob('*.png'));assert len(names)==20
          for name in names:assert (locked/name).read_bytes()==(current/name).read_bytes(),'Protected render changed: '+name
          report=json.loads(Path('signed268/background-resume-apk-audit.json').read_text());report.update(test_methods=counts,automated_tests_passed=sum(counts.values()),protected_render_equality=len(names),physical_device_verified=False,update_over_install_device_verified=False,candidate_locked=False,status='AUTOMATED TEST CANDIDATE — PASS; physical-device acceptance required',best_fit_interpretation='Fullscreen proportional full cover; physical review required',infinity_skin_touched=False)
          Path('signed268/CANDIDATE-VERIFICATION.json').write_text(json.dumps(report,indent=2)+'\n')
          apk=Path('signed268/Infinity-2103268-Cobra-Display-Player-RC1.apk');Path('signed268/SHA256SUMS.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'  '+apk.name+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Preserve exact source tests renders and rollback manifest
        if: always()
        run: |
          mkdir -p audit268/repair-source
          cp -r repairs/display-player-2103268/* audit268/repair-source/
          cp -r build267/xbmc/build/test-results audit268/baseline-test-results || true
          cp -r build268/xbmc/build/test-results audit268/candidate-test-results || true
          cp -r build268/xbmc/src/test audit268/staged-tests || true
          tar -czf audit268/reconstructed-2103268-shell.tar.gz shell-kodi engine/background-resume-source.json scripts/package_background_resume.py scripts/infinity_background_resume.py
          cp source267/source-verification.json audit268/locked-2103267-source-verification.json
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103268-Cobra-Display-Player-RC1-TEST-CANDIDATE
          path: signed268/
          compression-level: 0
          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103268-Cobra-Display-Player-RC1-Evidence
          path: audit268/
          retention-days: 90
