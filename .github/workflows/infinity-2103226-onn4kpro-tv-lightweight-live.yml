name: Infinity | 2103226 onn TV Lightweight Live RC9 FAST

on:
  workflow_dispatch:
  push:
    branches: [infinity-cobra-2103226-onn4kpro-tv-lightweight-live-rc9]
    paths:
      - '.github/workflows/infinity-2103226-onn4kpro-tv-lightweight-live.yml'
      - 'repairs/onn4kpro-tv-lightweight-live-2103226/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: infinity-2103226-onn-tv-fast-${{ github.sha }}
  cancel-in-progress: false

env:
  NDK_VER: 21.4.7075529

jobs:
  fast-tv-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Checkout isolated RC9 TV branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Download exact 2103208 Android source parent
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103208-Integration-Polish-TEST-CANDIDATE-Replica-1-Attempt-1
          run-id: 35676573761
          github-token: ${{ github.token }}
          path: baseline208

      - name: Download preserved 2103209 source reconstruction engine
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103209-Python311-GIL-Native-Engine
          run-id: 35693288744
          github-token: ${{ github.token }}
          path: native209

      - name: Download exact locked 2103225 RC8 TV APK
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103225-Onn4KPro-TV-Handoff-Focus-TEST-CANDIDATE
          run-id: 35895797009
          github-token: ${{ github.token }}
          path: base225

      - name: Reconstruct exact locked RC8 source and apply RC9 lightweight TV architecture
        run: |
          set -euo pipefail
          mkdir -p engine audit220 audit221 audit224 audit225 audit226 candidate226
          cp native209/pythoninvoker-threadstate-v2-source.json engine/pythoninvoker-threadstate-v2-source.json
          cp native209/pythoninvoker-threadstate-v2-source.stage1.json engine/pythoninvoker-threadstate-v2-source.stage1.json
          python3 repairs/python311-gil-2103209/ci.py prepare \
            --base-dir baseline208 \
            --native-apk native209/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2-Engine-Base.apk \
            --shell shell-kodi \
            --out audit226/mobile-source-base
          python3 repairs/cobra-media-library-health-2103210/apply.py --shell shell-kodi
          python3 repairs/cobra-library-health-2103211/apply.py --shell shell-kodi
          python3 repairs/health-media-trim-2103212/apply.py --shell shell-kodi
          python3 repairs/live-blue-ambient-settings-return-2103213/apply.py --shell shell-kodi
          python3 repairs/media-details-final-2103214/apply.py --shell shell-kodi
          python3 repairs/smart-return-experience-drawer-2103215/apply.py --shell shell-kodi
          python3 repairs/smart-return-experience-display-2103216/apply.py --shell shell-kodi
          python3 repairs/media-return-context-2103217/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-2103218/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-remote-2103219/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-grid-only-2103220/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-remote-ui-2103221/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-player-multiview-2103222/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-hardening-2103223/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-native-remote-2103224/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-handoff-focus-2103225/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-lightweight-live-2103226/apply.py --shell shell-kodi

          python3 - <<'PY'
          import json
          r=json.load(open('engine/background-resume-source.json'))
          assert r['version_code']==2103226
          assert r['version_name']=='1.0.9-Cobra-Onn4KPro-TV-Lightweight-Live-RC9'
          assert r['tv_target_abi']=='armeabi-v7a'
          assert r['mobile_parent_untouched'] is True
          assert r['native_engine_rebuilt'] is False
          assert r['playback_engine_unchanged'] is True
          assert r['tv_lightweight_live_architecture'] is True
          assert r['tv_persistent_player_surface'] is True
          assert r['tv_player_back_opens_channels'] is True
          assert r['tv_channel_drawer_bottom_overlay'] is True
          assert r['tv_player_surface_not_resized_by_overlays'] is True
          assert r['tv_guide_preview_decoder_disabled'] is True
          assert r['tv_channel_library_index_cached'] is True
          assert r['tv_channel_group_counts_cached'] is True
          assert r['tv_drawer_stage_shift_disabled'] is True
          assert r['tv_fixed_orientation_policy'] is True
          assert r['tv_multiview_row_focus_visible'] is True
          assert r['tv_player_footer_unclipped'] is True
          assert r['multiview_two_to_one_session_preserved'] is True
          print('PASS: exact 2103226 RC9 lightweight TV source receipt')
          PY

          JAVA=shell-kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          grep -Fq 'cobra_tv_grid_only_2103220' "$JAVA"
          grep -Fq 'cobra_tv_remote_ui_2103221' "$JAVA"
          grep -Fq 'cobra_tv_player_multiview_2103222' "$JAVA"
          grep -Fq 'cobra_tv_hardening_2103223' "$JAVA"
          grep -Fq 'cobra_tv_native_remote_2103224' "$JAVA"
          grep -Fq 'cobra_tv_handoff_focus_2103225' "$JAVA"
          grep -Fq 'cobra_tv_lightweight_live_2103226' "$JAVA"
          grep -Fq 'Browse channels' "$JAVA"
          grep -Fq 'cobraTvEnsureLibraryIndex' "$JAVA"
          grep -Fq 'cobraTvIndexedGroups' "$JAVA"
          grep -Fq 'mCobraGuideShell.setVisibility(View.GONE)' "$JAVA"
          grep -Fq 'cobraPosition(mPlayerTexture,0,0,w,h)' "$JAVA"
          ! grep -A80 -F 'private void cobraShowGuideShell' "$JAVA" | grep -Fq 'startCobraPreview(mGuidePreviewChannel)'
          grep -Fq 'versionCode 2103226' shell-kodi/tools/android/packaging/xbmc/build.gradle.in
          grep -Fq 'versionName "1.0.9-Cobra-Onn4KPro-TV-Lightweight-Live-RC9"' shell-kodi/tools/android/packaging/xbmc/build.gradle.in

      - name: Verify exact locked RC8 TV base
        run: |
          set -euo pipefail
          BASE="$(find base225 -type f -name 'Infinity-1.0.9-Cobra-Onn4KPro-TV-Handoff-Focus-RC8.apk' -print -quit)"
          test -n "$BASE"
          printf '%s  %s\n' 'b4e97e83a40eeb6db02fe491be842427ac6c0a8c6254ec0648300b4e23e6e8e6' "$BASE" | sha256sum -c -
          cp "$BASE" candidate226/Infinity-2103225-RC8-LOCKED-ROLLBACK.apk

      - name: Ensure donor debug keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Fast compile RC9 Android TV layer, preserve exact ARMv7 engine, sign and verify
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BASE=candidate226/Infinity-2103225-RC8-LOCKED-ROLLBACK.apk
          python3 repairs/onn4kpro-tv-lightweight-live-2103226/package.py \
            --source shell-kodi \
            --base-apk "$BASE" \
            --build-dir tv-android-build-226 \
            --out candidate226
          FINAL=candidate226/Infinity-1.0.9-Cobra-Onn4KPro-TV-Lightweight-Live-RC9.apk
          test -f "$FINAL"
          sha256sum "$FINAL" | tee candidate226/Infinity-1.0.9-Cobra-Onn4KPro-TV-Lightweight-Live-RC9.sha256
          rm -f "$BASE"

      - name: Write physical onn acceptance checklist
        run: |
          cat > candidate226/DEVICE-TEST.txt <<'EOF'
          INFINITY / COBRA 2103226 — ONN. 4K PRO TV LIGHTWEIGHT LIVE RC9
          PHYSICAL DEVICE ACCEPTANCE REQUIRED

          ARCHITECTURE
          1. Open top-level drawer -> Live TV. Drawer must disappear immediately.
          2. Live TV opens as a lightweight channel/EPG browser with no autoplay preview decoder.
          3. Select a channel. Browser remains visible behind the transparent player until the first real video frame renders.
          4. Once video renders, playback becomes the persistent Live-TV canvas.

          PERSISTENT PLAYER / CHANNEL OVERLAY
          5. During fullscreen playback press Back after chrome is hidden. A bottom channel overlay must appear over the still-playing video.
          6. The video must NOT shrink, detach, restart, or go black when the channel overlay opens/closes.
          7. Channels -> Favorites / Recent / All / Groups must remain remote navigable.
          8. Select another channel from the overlay; overlay closes and playback retunes on the same player surface.
          9. MENU opens the top-level Cobra drawer; choosing Live TV returns to channel browsing over the current player.
          10. Choosing Movies / Shows / Recordings / My List / Settings leaves Live TV cleanly and stops the TV player.

          20K CHANNEL PERFORMANCE
          11. Open Channel Groups repeatedly. It should appear promptly; counts must not be recomputed from all ~20K channels each time.
          12. Open Groups from the player channel overlay repeatedly. It must remain responsive.
          13. Move rapidly through 50+ channels. Focus must remain deterministic with no progressive slowdown.
          14. Repeat Live TV -> channel -> overlay -> channel at least 20 times.

          BLACK-SCREEN / TRANSITION REGRESSION
          15. Initial channel selection must not expose a multi-second black UI while waiting for the first frame.
          16. Back to channel browsing must be immediate because the player remains attached.
          17. No ~6-second fullscreen -> guide surface handoff should occur during ordinary Live TV navigation.
          18. Genuine provider buffering may still show normal playback buffering.

          PLAYER / MULTI-VIEW REGRESSION
          19. Verify header, transport, timeline, Channels, Display, Multi-View and More.
          20. Verify Multi-View Favorites/Recent/All/Groups focus and selection.
          21. Verify two simultaneous videos; remove either tile and ensure the survivor continues.
          22. Verify third/fourth screens, audio switching, Pause/Resume, Enlarge/Restore, Full screen/Return Multi.
          23. Verify rewind/timeshift, 1080p/4K, audio/subtitles, recordings/reminders.

          PRESERVATION
          - Exact RC8 / 2103225 remains rollback.
          - armeabi-v7a / ELF32 ARM only.
          - Permanent Infinity package/signer unchanged.
          - Native libkodi.so byte-identical; no native rebuild.
          - ARM64 phone/Fold source untouched.
          - TV PiP/rotation/120-Hz mobile behavior remains absent.
          - Do not lock/promote RC9 until physical acceptance passes.
          EOF

      - name: Publish onn 4K Pro TV 2103226 LIGHTWEIGHT LIVE TEST CANDIDATE
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103226-Onn4KPro-TV-Lightweight-Live-TEST-CANDIDATE
          path: |
            candidate226/Infinity-1.0.9-Cobra-Onn4KPro-TV-Lightweight-Live-RC9.apk
            candidate226/Infinity-1.0.9-Cobra-Onn4KPro-TV-Lightweight-Live-RC9.sha256
            candidate226/signing-verification.txt
            candidate226/badging.txt
            candidate226/manifest.txt
            candidate226/ONN-TV-2103226-VERIFICATION.json
            candidate226/tv-lightweight-live-source.json
            candidate226/DEVICE-TEST.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Preserve 2103226 RC9 source/packaging evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103226-Onn4KPro-TV-Lightweight-Live-Evidence
          path: |
            audit226/
            engine/background-resume-source.json
            repairs/onn4kpro-tv-player-multiview-2103222/
            repairs/onn4kpro-tv-hardening-2103223/
            repairs/onn4kpro-tv-native-remote-2103224/
            repairs/onn4kpro-tv-handoff-focus-2103225/
            repairs/onn4kpro-tv-lightweight-live-2103226/
            candidate226/*.json
            candidate226/*.txt
          if-no-files-found: warn
          retention-days: 90
