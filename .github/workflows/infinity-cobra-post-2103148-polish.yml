name: Infinity | Cobra Post-2103148 Polish
on:
  workflow_dispatch:
  push:
    branches: [infinity-cobra-post-2103148-polish]
    paths:
      - 'scripts/infinity_cobra_mobile_tv_guide_views.py'
      - 'scripts/infinity_cobra_mobile_modernization.py'
      - 'scripts/infinity_cobra_appearance_modes.py'
      - 'scripts/infinity_cobra_post_2103148_polish.py'
      - 'scripts/infinity_cobra_post_2103148_polish_v2.py'
      - 'scripts/infinity_cobra_task_exit.py'
      - 'scripts/infinity_experience_chooser_simplify.py'
      - 'addons/script.infinity.cobra.theme/**'
      - '.github/workflows/infinity-cobra-post-2103148-polish.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-cobra-post-2103148-polish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-update:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      NDK_VER: 21.4.7075529
      RUNTIME_COMMIT: b42760a25a27d23baa5db5770824cb8d32ec2290
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v5
        with:
          name: Infinity-1.0.9-Cobra-Full-Feature-Candidate-2
          run-id: 35044752997
          github-token: ${{ github.token }}
          path: run40
      - name: Verify exact signed native baseline
        run: |
          mkdir -p background-rollback background-candidate engine preflight ui-package
          cp run40/candidate/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2.apk background-rollback/Infinity-Run40-Exact-Base.apk
          echo '8ef45e9c54a79e2295e295ce1fcdd3430322a0049c7ff5227804c15aed6b4c57  background-rollback/Infinity-Run40-Exact-Base.apk' | sha256sum -c -
      - name: Reconstruct exact RC3 Runtime v3 and 2103141 presentation source
        run: |
          bash scripts/infinity_live_app_ci_1.sh
          mkdir -p engine/background-preimage/tools/android/packaging engine/background-preimage/cmake/scripts/android
          cp -a kodi/tools/android/packaging/xbmc engine/background-preimage/tools/android/packaging/
          cp kodi/cmake/scripts/android/Install.cmake engine/background-preimage/cmake/scripts/android/
          git -C kodi diff --binary -- xbmc > engine/native-before.patch
          python3 scripts/infinity_background_resume.py --source kodi --receipt engine/background-resume-source.json
          python3 scripts/infinity_background_control_bridge.py --source kodi --receipt engine/background-resume-source.json --packager scripts/package_background_resume.py
          mkdir -p engine/lifecycle-preimage/tools/android/packaging engine/lifecycle-preimage/cmake/scripts/android
          cp -a kodi/tools/android/packaging/xbmc engine/lifecycle-preimage/tools/android/packaging/
          cp kodi/cmake/scripts/android/Install.cmake engine/lifecycle-preimage/cmake/scripts/android/
          python3 scripts/infinity_cobra_async_lifecycle.py --source kodi --receipt engine/background-resume-source.json --packager scripts/package_background_resume.py
          python3 tests/infinity_background/test_async_lifecycle.py --before engine/lifecycle-preimage/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in --after kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in --out preflight/lifecycle-races
          git -C kodi diff --binary -- xbmc > engine/native-after-rc3.patch
          cmp engine/native-before.patch engine/native-after-rc3.patch

          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${RUNTIME_COMMIT}"
          for f in infinity_1_0_9_cobra_approved_ui.py infinity_1_0_9_cobra_zip_ui_runtime.py infinity_1_0_9_cobra_zip_ui_runtime_matcher_fix.py apply_cobra_approved_ui.py; do
            curl -fsSL "$base/scripts/$f" -o "scripts/$f"
          done
          python3 -m py_compile \
            scripts/infinity_1_0_9_cobra_approved_ui.py \
            scripts/infinity_1_0_9_cobra_zip_ui_runtime.py \
            scripts/infinity_1_0_9_cobra_zip_ui_runtime_matcher_fix.py \
            scripts/apply_cobra_approved_ui.py \
            scripts/infinity_cobra_ui_frontend.py \
            scripts/infinity_cobra_ui_frontend_matcher_fix.py \
            scripts/infinity_cobra_player_presentation_fix.py \
            scripts/infinity_cobra_player_presentation_fix_v2.py \
            scripts/infinity_cobra_mobile_tv_guide_views.py \
            scripts/infinity_cobra_mobile_modernization.py \
            scripts/infinity_cobra_appearance_modes.py \
            scripts/infinity_cobra_post_2103148_polish.py \
            scripts/infinity_cobra_post_2103148_polish_v2.py \
            scripts/infinity_cobra_task_exit.py \
            scripts/infinity_experience_chooser_simplify.py
          python3 scripts/apply_cobra_approved_ui.py --source kodi
          python3 scripts/infinity_cobra_ui_frontend_matcher_fix.py --source kodi
          python3 scripts/infinity_cobra_player_presentation_fix_v2.py --source kodi
          git -C kodi diff --binary -- xbmc > engine/native-after-2103141-source.patch
          cmp engine/native-before.patch engine/native-after-2103141-source.patch
      - name: Apply corrected structural ZIP UI bridge
        run: |
          python3 scripts/infinity_cobra_mobile_tv_guide_views.py --source kodi
          JAVA=kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          for token in \
            'addRail("MOBILE VIEW"' \
            'addRail("TV GUIDE"' \
            'mCobraPreviewPlayer' \
            'LIVE PREVIEW' \
            'TAP VIDEO FOR FULLSCREEN' \
            'setTag("cobra_channel_actions")' \
            'showCobraChannelActions(item)' \
            'guideTitleAt(item, when)' \
            'guideFirstActivationPreview' \
            'guideSecondActivationFullscreen' \
            'closeFullscreenToCobraView()' \
            'COBRA_UI_RUNTIME = 3' \
            'closePlayerSettingsDrawer()' \
            'Crop / Fill' \
            'isCobraAsyncAlive()'; do
            grep -Fq "$token" "$JAVA" || { echo "Missing corrected structural UI token: $token" >&2; exit 1; }
          done
          ! grep -Fq 'COBRA VIEW  •  ' "$JAVA"
          git -C kodi diff --binary -- xbmc > engine/native-after-structural-ui.patch
          cmp engine/native-before.patch engine/native-after-structural-ui.patch
      - name: Apply Cobra task-exit isolation
        run: |
          python3 scripts/infinity_cobra_task_exit.py --source kodi
          JAVA=kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          grep -Fq 'moveTaskToBack(true);' "$JAVA"
          grep -Fq 'returnToInfinity' "$JAVA"
          grep -Fq 'closeFullscreenToCobraView()' "$JAVA"
          grep -Fq 'closeCobraChannelActions()' "$JAVA"
          git -C kodi diff --binary -- xbmc > engine/native-after-task-exit.patch
          cmp engine/native-before.patch engine/native-after-task-exit.patch
      - name: Apply modern mobile mini-player drawer and category grid
        run: |
          python3 scripts/infinity_cobra_mobile_modernization.py --source kodi
          JAVA=kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          for token in \
            'setTag("cobra_experience_drawer")' \
            'addCobraDrawerAction(drawer, "SEARCH"' \
            'addCobraDrawerAction(drawer, "TV"' \
            'addCobraDrawerAction(drawer, "MOVIES"' \
            'addCobraDrawerAction(drawer, "SHOWS"' \
            'addCobraDrawerAction(drawer, "RECORDINGS"' \
            'addCobraDrawerAction(drawer, "MY LIST"' \
            'FAVORITES & CATEGORIES' \
            'Schedule Recording' \
            'Add to Group' \
            'Share to a Friend' \
            'View Channel EPG' \
            'Hide Channel' \
            'mGuidePreviewArmed && mUi.guideSecondActivationFullscreen' \
            'setContentDescription("Fullscreen")' \
            'setContentDescription("Closed captions")'; do
            grep -Fq "$token" "$JAVA" || { echo "Missing modern mobile token: $token" >&2; exit 1; }
          done
          ! grep -Fq '"●  Record Channel"' "$JAVA"
          ! grep -Fq '"■  Stop Recording"' "$JAVA"
          git -C kodi diff --binary -- xbmc > engine/native-after-mobile-modernization.patch
          cmp engine/native-before.patch engine/native-after-mobile-modernization.patch
      - name: Apply Cobra appearance modes
        run: |
          python3 scripts/infinity_cobra_appearance_modes.py --source kodi
          JAVA=kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          for token in \
            'COBRA_APPEARANCE_MODE = "cobra_appearance_mode"' \
            'APPEARANCE  •  ' \
            'showCobraAppearancePicker()' \
            'Follow System' \
            'True OLED Black' \
            'cobraEffectiveAppearanceMode()' \
            'optJSONObject("palettes")' \
            'cobraThemeColor("background", mTheme.background)' \
            'cobraThemeColor("text", mTheme.text)'; do
            grep -Fq "$token" "$JAVA" || { echo "Missing Cobra appearance token: $token" >&2; exit 1; }
          done
          grep -Fq 'host.setBackground(surface(Color.BLACK' "$JAVA"
          grep -Fq 'controls.setBackgroundColor(Color.argb(158, 0, 0, 0))' "$JAVA"
          git -C kodi diff --binary -- xbmc > engine/native-after-appearance.patch
          cmp engine/native-before.patch engine/native-after-appearance.patch
      - name: Apply post-2103148 drawer navigation player and subscription polish
        run: |
          python3 scripts/infinity_cobra_post_2103148_polish_v2.py --source kodi
          JAVA=kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          for token in \
            'setContentDescription("Collapse Cobra drawer")' \
            'VIEW MODE  •  ' \
            'Button power = action("⏻  POWER")' \
            'setTag("cobra_power_menu")' \
            'showGuideCards()' \
            'COBRA • COMPACT' \
            'COBRA • CARDS' \
            'COBRA • FOCUS' \
            'Aspect / Display' \
            'Best Fit' \
            'COBRA_SUBSCRIPTION_PREFIX' \
            'player_api.php?username=' \
            'mPlayerChrome.addView(state' \
            'finishAndRemoveTask()' \
            'if (!"root".equals(mCobraInternalScreen))'; do
            grep -Fq "$token" "$JAVA" || { echo "Missing post-2103148 polish token: $token" >&2; exit 1; }
          done
          git -C kodi diff --binary -- xbmc > engine/native-after-post-polish.patch
          cmp engine/native-before.patch engine/native-after-post-polish.patch
      - name: Apply two-card chooser with per-card settings
        run: |
          python3 scripts/infinity_experience_chooser_simplify.py --source kodi
          SPLASH=kodi/tools/android/packaging/xbmc/src/Splash.java.in
          grep -Fq 'launchInfinityExperience("infinity")' "$SPLASH"
          grep -Fq 'launchInfinityExperience("live")' "$SPLASH"
          grep -Fq 'showExperienceCardSettings("infinity")' "$SPLASH"
          grep -Fq 'showExperienceCardSettings("live")' "$SPLASH"
          grep -Fq 'setContentDescription("Infinity settings")' "$SPLASH"
          grep -Fq 'setContentDescription("Cobra settings")' "$SPLASH"
          grep -Fq 'Remember & launch' "$SPLASH"
          grep -Fq 'just this time' "$SPLASH"
          grep -Fq 'Ask every time' "$SPLASH"
          grep -Fq '.remove(INFINITY_EXPERIENCE_DEFAULT)' "$SPLASH"
          ! grep -Fq 'LAUNCH & REMEMBER' "$SPLASH"
          ! grep -Fq 'JUST THIS TIME' "$SPLASH"
          ! grep -Fq 'Remember my choice' "$SPLASH"
          git -C kodi diff --binary -- xbmc > engine/native-after-chooser.patch
          cmp engine/native-before.patch engine/native-after-chooser.patch
      - name: Promote presentation runtime to 2103149
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          RELEASE='1.0.9-Cobra-Post-2103148-Polish'
          VERSION=2103149
          gradle=Path('kodi/tools/android/packaging/xbmc/build.gradle.in')
          text=gradle.read_text()
          assert text.count('versionCode 2103138') == 1
          assert text.count('versionName "1.0.9-Infinity-Lifecycle-Repair-RC3"') == 1
          text=text.replace('versionCode 2103138',f'versionCode {VERSION}',1)
          text=text.replace('versionName "1.0.9-Infinity-Lifecycle-Repair-RC3"',f'versionName "{RELEASE}"',1)
          gradle.write_text(text)

          receipt=Path('engine/background-resume-source.json')
          row=json.loads(receipt.read_text())
          for rel in ('tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in','tools/android/packaging/xbmc/src/Splash.java.in','tools/android/packaging/xbmc/build.gradle.in'):
              if rel in row.get('files', {}):
                  row['files'][rel]['after']=hashlib.sha256((Path('kodi')/rel).read_bytes()).hexdigest()
          row.update(version_code=VERSION,version_name=RELEASE,cobra_ui_runtime=3,
                     rc3_lifecycle_preserved=True,cobra_ui_package_installer=True,
                     player_settings_dismiss_fix=True,deterministic_crop_fill=True,
                     structural_ui_bridge=True,mobile_view_contract=True,
                     tv_guide_view_contract=True,long_press_channel_actions=True,
                     inline_live_preview=True,main_menu_view_destinations=True,
                     guide_preview_then_fullscreen=True,fullscreen_back_restores_preview=True,
                     cobra_ui_json_structural_parser=True,
                     cobra_terminal_back_backgrounds_task=True,
                     infinity_handoff_explicit_toggle_only=True,
                     two_card_experience_chooser=True,
                     chooser_direct_launch_just_this_time=True,
                     chooser_card_gear_settings=True,
                     chooser_remember_via_card_settings=True,
                     chooser_ask_every_time=True,
                     mobile_preview_controls=True,favorites_category_hub=True,
                     filtered_category_grid=True,first_tap_preview_second_tap_fullscreen=True,
                     schedule_recording_context_action=True,add_to_group_context_action=True,
                     share_channel_context_action=True,hide_channel_context_action=True,
                     cobra_appearance_modes=True,cobra_follow_system_appearance=True,
                     cobra_light_mode=True,cobra_dark_mode=True,cobra_oled_black_mode=True,
                     cobra_palette_zip_contract=True,dark_video_overlay_in_light_mode=True,
                     push_content_drawer=True,drawer_collapse_control=True,
                     drawer_view_mode=True,drawer_power_menu=True,
                     internal_back_navigation=True,four_distinct_guide_renderers=True,
                     player_light_mode_contrast_hardened=True,
                     player_status_badge_auto_hides=True,pip_video_only_chrome=True,
                     expanded_aspect_modes=True,subscription_expiry_status=True)
          receipt.write_text(json.dumps(row,indent=2,sort_keys=True)+'\n')

          constants=Path('scripts/infinity_background_resume.py')
          c=constants.read_text()
          assert c.count('VERSION_CODE = 2103138') == 1
          assert c.count("RELEASE = '1.0.9-Infinity-Lifecycle-Repair-RC3'") == 1
          c=c.replace('VERSION_CODE = 2103138',f'VERSION_CODE = {VERSION}',1)
          c=c.replace("RELEASE = '1.0.9-Infinity-Lifecycle-Repair-RC3'",f"RELEASE = '{RELEASE}'",1)
          constants.write_text(c)

          pack=Path('scripts/package_background_resume.py')
          p=pack.read_text()
          old='Infinity-1.0.9-Infinity-Lifecycle-Repair-RC3'
          assert p.count(old) >= 1
          p=p.replace(old,'Infinity-'+RELEASE)
          pack.write_text(p)
          PY
      - name: Compile Android presentation shell only, sign and verify
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          python3 scripts/package_background_resume.py --source kodi --base-apk background-rollback/Infinity-Run40-Exact-Base.apk --build-dir structural-ui-build --out background-candidate
          APK=background-candidate/Infinity-1.0.9-Cobra-Post-2103148-Polish.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee background-candidate/badging.txt
          grep -q "package: name='com.projectinfinity.kodi' versionCode='2103149' versionName='1.0.9-Cobra-Post-2103148-Polish'" background-candidate/badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | tee background-candidate/signing.txt
          grep -qi 'd7adeb68e9341596a02bd3262b737a0f45fc6e771ed7e60285437e833b58c6d7' background-candidate/signing.txt
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          base=Path('background-rollback/Infinity-Run40-Exact-Base.apk')
          out=Path('background-candidate/Infinity-1.0.9-Cobra-Post-2103148-Polish.apk')
          with zipfile.ZipFile(base) as a, zipfile.ZipFile(out) as b:
              libs=[n for n in a.namelist() if n.startswith('lib/') and not n.endswith('/')]
              assert libs
              for n in libs:
                  assert n in b.namelist(), n
                  assert hashlib.sha256(a.read(n)).digest()==hashlib.sha256(b.read(n)).digest(), n
              joined=b''.join(b.read(n) for n in b.namelist() if n.startswith('classes') and n.endswith('.dex'))
              for token in (b'INSTALL COBRA UI PACKAGE',b'MOBILE VIEW',b'TV GUIDE',b'Choose Your Experience',b'Infinity settings',b'Cobra settings',b'Remember & launch',b'Ask every time',b'FAVORITES & CATEGORIES',b'Schedule Recording',b'Add to Group',b'Share to a Friend',b'View Channel EPG',b'Hide Channel',b'APPEARANCE',b'Follow System',b'True OLED Black',b'VIEW MODE',b'POWER',b'Aspect / Display',b'Best Fit',b'SUBSCRIPTION',b'Expires',b'TV Grid',b'Compact',b'Cards',b'Focus'):
                  assert token in joined, token
              for forbidden in (b'LAUNCH & REMEMBER',b'JUST THIS TIME',b'Remember my choice',b'Record Channel'):
                  assert forbidden not in joined, forbidden
          print('PASS: post-2103148 Cobra polish signed; exact native libraries preserved')
          PY
          sha256sum "$APK" | tee background-candidate/Infinity-1.0.9-Cobra-Post-2103148-Polish.sha256
      - name: Package matching Mobile + TV Guide UI 1.3.4
        run: |
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          root=pathlib.Path('addons/script.infinity.cobra.theme')
          ui=json.loads((root/'resources/cobra-ui.json').read_text())
          theme=json.loads((root/'resources/cobra-theme.json').read_text())
          addon=ET.parse(root/'addon.xml').getroot()
          assert addon.attrib['version']=='1.3.4'
          assert ui['version']=='1.3.4'
          appearance=ui['appearance']; mobile=ui['views']['mobile']; guide=ui['views']['tv_guide']; player=ui['player']; settings=ui['settings']; nav=ui['navigation']
          assert appearance['modes']==['system','light','dark','oled']
          assert appearance['player_overlay']=='dark_high_contrast'
          assert mobile['drawer_mode']=='push_content'
          assert mobile['drawer_collapse_control'] is True
          assert 'view_mode' in mobile['drawer_destinations'] and 'power' in mobile['drawer_destinations']
          assert guide['view_modes']=={'grid':'timeline_grid','compact':'dense_list','cards':'touch_cards','focus':'large_preview_channel_strip'}
          assert guide['first_activation']=='preview' and guide['second_activation']=='fullscreen'
          assert player['pip_chrome']=='video_only'
          assert player['status_badge']=='auto_hide_with_chrome'
          assert len(player['aspect_modes'])==7
          assert settings['subscription_account_status'] is True
          assert settings['guide_view_selector_location']=='drawer'
          assert nav['internal_back_returns_to_cobra_root'] is True
          assert set(theme['palettes'])=={'dark','light','oled'}
          PY
          mkdir -p ui-package/script.infinity.cobra.theme/resources
          cp addons/script.infinity.cobra.theme/addon.xml ui-package/script.infinity.cobra.theme/
          cp addons/script.infinity.cobra.theme/resources/cobra-theme.json ui-package/script.infinity.cobra.theme/resources/
          cp addons/script.infinity.cobra.theme/resources/cobra-ui.json ui-package/script.infinity.cobra.theme/resources/
          cd ui-package
          zip -9 -r Infinity-Cobra-Mobile-TV-Guide-UI-1.3.4.zip script.infinity.cobra.theme
          sha256sum Infinity-Cobra-Mobile-TV-Guide-UI-1.3.4.zip > Infinity-Cobra-Mobile-TV-Guide-UI-1.3.4.sha256
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-Cobra-Post-2103148-Polish-2103149
          path: |
            background-candidate/
            ui-package/Infinity-Cobra-Mobile-TV-Guide-UI-1.3.4.zip
            ui-package/Infinity-Cobra-Mobile-TV-Guide-UI-1.3.4.sha256
            engine/background-resume-source.json
            preflight/lifecycle-races/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
