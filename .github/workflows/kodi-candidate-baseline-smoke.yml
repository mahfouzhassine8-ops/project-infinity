name: Infinity | Kodi Candidate Baseline Smoke

on:
  push:
    branches: [infinity-kodi-candidate-stage-v1]
    paths:
      - '.github/workflows/kodi-candidate-builder.yml'
      - '.github/workflows/kodi-candidate-baseline-smoke.yml'
      - '.github/workflows/infinity-kodi-watch.yml'
      - 'upstream/tests/test_candidate_builder.py'

permissions:
  contents: read

jobs:
  baseline-candidate:
    uses: ./.github/workflows/kodi-candidate-builder.yml
    with:
      target_tag: '21.3-Omega'
      target_sha: 'a3a448d26b8d560a65655dab2cd122994dc4e146'
    permissions:
      contents: read
