# Cobra Live approved UI + ZIP-driven presentation runtime v3
name: Infinity 1.0.9 | Cobra Full Feature Candidate 2

on:
  workflow_dispatch:
  push:
    branches: [infinity-cobra-full-feature-candidate-2]
    paths:
      - '.github/workflows/infinity-cobra-full-feature-candidate-2.yml'
      - 'scripts/infinity_live_app_ci_*.sh'
      - 'scripts/infinity_1_0_9_cobra_full*.py'
      - 'scripts/infinity_1_0_9_cobra_approved_ui.py'
      - 'scripts/infinity_1_0_9_cobra_zip_ui_runtime.py'
      - 'scripts/apply_cobra_approved_ui.py'
      - 'scripts/infinity_1_0_9_cobra_device_parity.py'
      - 'scripts/infinity_1_0_9_cobra_legit.py'
      - 'scripts/infinity_1_0_9_single_app.py'
      - 'scripts/infinity_1_0_9_live_app_shell.py'
      - 'scripts/infinity_1_0_9_live_release.py'
      - 'scripts/cobra_provider_contract.py'
      - 'scripts/package_cobra_theme.py'
      - 'scripts/infinity_touch_startup_guard.py'
      - 'scripts/infinity_gui_render_hardening.py'
      - 'scripts/infinity_gui_render_hardening_v2.py'
      - 'scripts/infinity_gui_render_hardening_v3.py'
      - 'scripts/infinity_player_rotation.py'
      - 'scripts/infinity_1_0_8_deep_rebrand.py'
      - 'scripts/infinity_1_0_8_deep_rebrand_preimage.py'
      - 'scripts/infinity_1_0_8_deep_audio_rebrand.py'
      - 'scripts/infinity_audio_policy_source.py'
      - 'scripts/infinity-responsive-v5.py'
      - 'scripts/validate_infinity_audio_policy.py'
      - 'scripts/validate_infinity_skin_contract.py'
      - 'scripts/validate_candidate2_compiled_manifest.py'
      - 'scripts/validate-infinity71-java.py'
      - 'scripts/infinity71.py'
      - 'scripts/infinity_upper_layer_repack.py'
      - 'scripts/sign-infinity71.sh'
      - 'patches/infinity-cobra/**'
      - 'patches/infinity-cobra-v2/**'
      - 'patches/infinity-7.1-audited/**'
      - 'patches/infinity-responsive-v5/**'
      - 'patches/infinity-refresh/**'
      - 'patches/infinity-media/**'
      - 'patches/infinity-audio-policy/**'
      - 'addons/script.infinity.cobra.theme/**'
      - 'tests/cobra_live/**'
      - 'tests/cobra_full/**'
      - 'tests/infinity_live/**'
      - 'tests/infinity_audio/**'
      - 'tests/infinity_rotation/**'
      - 'docs/cobra-candidate-2-feature-contract.md'

permissions:
  contents: read
  actions: read

concurrency:
  group: infinity-cobra-full-feature-c2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    env:
      NDK_VER: 21.4.7075529
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: actions/cache/restore@v4
        id: deps-cache
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            ~/.ccache
          key: infinity-deep-audio-21.3-arm64-${{ runner.os }}-${{ hashFiles('patches/infinity-7.1-audited/contract.json', 'patches/infinity-responsive-v5/contract.json', 'patches/infinity-refresh/**', 'patches/infinity-media/**', 'patches/infinity-audio-policy/**') }}
          restore-keys: |
            infinity-responsive-v5-21.3-arm64-${{ runner.os }}-
            infinity-71-audited-deps-21.3-arm64-${{ runner.os }}-

      - name: Preflight full Cobra Candidate 2 contracts
        run: bash scripts/infinity_live_app_ci_1.sh

      - name: Apply approved Cobra UI + ZIP runtime v3
        run: |
          python3 -m py_compile scripts/infinity_1_0_9_cobra_zip_ui_runtime.py
          python3 scripts/apply_cobra_approved_ui.py --source kodi
          grep -Fq 'COBRA_UI_RUNTIME = 3' kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          grep -Fq '.kodi/addons/script.infinity.cobra.theme/resources/cobra-ui.json' kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          grep -Fq 'mUi.destinationEnabled(label)' kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          grep -Fq 'mUi.orderPlayerActions(' kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          grep -Fq 'mUi.orderSettingsActions(' kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          grep -Fq 'showPlayerSettingsDrawer()' kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          grep -Fq 'removeSelectedMultiTile()' kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          grep -Fq 'multiToSingle()' kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          python3 scripts/package_cobra_theme.py --output candidate/Infinity-Cobra-Theme-1.2.0.zip

      - name: Build source-backed Kodi 21.3 + Cobra Full Feature Candidate 2
        id: compile
        run: bash scripts/infinity_live_app_ci_2.sh

      - name: Package, permanently sign and verify Candidate 2
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: bash scripts/infinity_live_app_ci_3.sh

      - uses: actions/cache/save@v4
        if: always() && steps.compile.conclusion == 'success' && steps.deps-cache.outputs.cache-hit != 'true'
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            ~/.ccache
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-1.0.9-Cobra-Full-Feature-Candidate-2
          path: |
            candidate/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2.apk
            candidate/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2.sha256
            candidate/Infinity-Cobra-Theme-1.2.0.zip
            candidate/Infinity-Cobra-Theme-1.2.0.zip.sha256
            candidate/signing-verification.txt
            candidate/badging.txt
            candidate/manifest.txt
            candidate/cobra-theme.json
            candidate/cobra-full-branding-apk.json
            candidate/cobra-full-source.json
            candidate/live-app-shell-engine.json
            candidate/live-release-source.json
            candidate/touch-startup-guard-source.json
            candidate/player-rotation-source.json
            candidate/cumulative-audio-source.json
            candidate/deep-audio-rebrand-source.json
            candidate/FEATURE-CONTRACT.md
            candidate/DEVICE-TEST.txt
            engine/gui-render-hardening-source.json
            engine/live-app-shell-engine.json
            engine/overlay-inventory.json
            engine/base-badging.txt
            preflight/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
