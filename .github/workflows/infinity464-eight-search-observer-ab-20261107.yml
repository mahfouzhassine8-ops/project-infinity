name: Infinity464 eight real Search All cycles | controlled QA observer only
on:
  push:
    branches: [work/infinity464-targeted-crash-diagnosis-20261107]
    paths:
      - .github/workflows/infinity464-eight-search-observer-ab-20261107.yml
      - repairs/infinity-final-release-462-20261107/replay_eight_searches.py
      - repairs/infinity-final-release-462-20261107/prepare_eight_observer.py
permissions: {contents: read, actions: read}
concurrency:
  group: infinity464-eight-search-observer-ab
  cancel-in-progress: false
jobs:
  eight_searches:
    name: Eight actual Search All cycles, two real Umbrella heading opens, exact signed464
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      INFINITY_EMULATOR_API: '37.0'
      INFINITY_EMULATOR_TARGET: google_apis
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '21'}
      - name: Scope guard, parse QA scripts and dry-run disposable observer transform
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast, subprocess, pathlib, tempfile, shutil
          root=pathlib.Path('repairs/infinity-final-release-462-20261107')
          for name in ('replay_eight_searches.py','prepare_eight_observer.py','verify_android_release.py','android_qa.py','stage_android_release.py'):
              ast.parse((root/name).read_text(),filename=name)
          s=(root/'replay_eight_searches.py').read_text()
          assert all(q in s for q in ('The Matrix','Just Friends','Inception','Toy Story','Spirited Away','Finding Nemo','Re:zero','SpongeBob'))
          assert 'PASS_EIGHT_NATIVE_SEARCHES_AND_TWO_REAL_HEADING_ROUTES_QA_ONLY' in s
          with tempfile.TemporaryDirectory() as tmp:
              dst=pathlib.Path(tmp)/'home/addons/script.infinity.finalreleaseqa/qa.py'
              dst.parent.mkdir(parents=True)
              shutil.copyfile(root/'android_qa.py',dst)
              subprocess.run(['python3',str(root/'prepare_eight_observer.py'),'--fixture',tmp],check=True)
              ast.parse(dst.read_text(),filename=str(dst))
              assert dst.read_text().count("if kind=='select-row-no-list-read':")==1
          assert subprocess.check_output(['git','diff','--name-only','54b8999b509a160737d2fe44030500fc99eb6f17','HEAD'],text=True).splitlines() == sorted([
             '.github/workflows/infinity464-eight-search-observer-ab-20261107.yml',
             'repairs/infinity-final-release-462-20261107/prepare_eight_observer.py',
             'repairs/infinity-final-release-462-20261107/replay_eight_searches.py',
          ]), 'ONLY_QA_DIAGNOSTIC_FILES_CAN_CHANGE'
          print('PASS static A/B preflight. Original APK, Search, Cobra, native engine, providers and original QA source are unchanged.')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13495518701', run-id: '42204671979', github-token: '${{ github.token }}', path: parent462, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13596730735', run-id: '42428328498', github-token: '${{ github.token }}', path: signed464, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13596606000', run-id: '42428335227', github-token: '${{ github.token }}', path: signed465, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13565947121', run-id: '42351486944', github-token: '${{ github.token }}', path: current268, merge-multiple: true}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {cmdline-tools-version: '15859902', packages: 'platform-tools build-tools;35.0.0 cmdline-tools;22.0', log-accepted-android-sdk-licenses: false}
      - name: Reuse pinned original signed APKs, create disposable fixture only
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y libpulse0 ffmpeg tesseract-ocr
          python3 -m pip install Pillow==11.3.0
          python3 repairs/infinity-final-release-462-20261107/stage_android_release.py --parent parent462/Infinity-2103462-Combined-Original-Signer.apk --candidate signed464/Infinity-2103464-Combined-Original-Signer.apk --recovery signed465/Infinity-2103465-Combined-Original-Signer.apk --current current268 --sdk "$ANDROID_HOME/build-tools/35.0.0" --out eight-fixture
          python3 repairs/infinity-final-release-462-20261107/prepare_eight_observer.py --fixture eight-fixture
          python3 repairs/four-repair-20261018/android37_gate.py --sdk-root "$ANDROID_HOME" --out eight-platform --pin-tools
          python3 repairs/android-checkpoint-shutdown/runtime-tests/prepare_android_emulator.py --out eight-emulator-setup
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '37.0'
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 10G
          avd-name: infinity-four-repair-api37
          pre-emulator-launch-script: python3 repairs/four-repair-20261018/android37_gate.py --sdk-root "$ANDROID_HOME" --out eight-platform --check-avd
          disable-animations: false
          emulator-options: -no-window -memory 4096 -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 repairs/infinity-final-release-462-20261107/replay_eight_searches.py --parent parent462/Infinity-2103462-Combined-Original-Signer.apk --candidate signed464/Infinity-2103464-Combined-Original-Signer.apk --fixture eight-fixture --out eight-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Infinity464-Eight-Search-AB-${{ github.run_id }}-DIAGNOSTIC-NOT-APK
          path: |
            eight-results/
            eight-fixture/SIGNED-INPUT-IDENTITY.json
          retention-days: 30
          if-no-files-found: warn
