name: Infinity | 2103377 matched lifecycle native verification
on:
  push:
    branches: [work/infinity-2103377-close-recents-preservation]
    paths:
      - 'repairs/close-lifecycle-native-2103377/**'
      - '.github/workflows/infinity-2103377-lifecycle-native.yml'
permissions: {contents: read, actions: read}
concurrency: {group: infinity-2103377-lifecycle-native, cancel-in-progress: false}
env:
  NDK_VER: 21.4.7075529
jobs:
  native-engine:
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    env:
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-${{ runner.os }}-21.4.7075529-v1
      - name: Restore unchanged pinned Android compiler
        run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - uses: actions/download-artifact@v8
        with:
          run-id: 38132105717
          name: Infinity-2103367-Verified-Compiler-Dependencies
          github-token: ${{ github.token }}
          path: dependency-transfer
      - uses: actions/download-artifact@v8
        with:
          run-id: 38246713743
          name: Cobra-2103374-Verified-Deadweight-Signed-Test-APK
          github-token: ${{ github.token }}
          path: locked-parent
      - uses: actions/download-artifact@v8
        with:
          run-id: 38270097041
          name: Cobra-2103375-File-Preview-Native-Signed-Test-APK
          github-token: ${{ github.token }}
          path: previous-candidate
      - uses: actions/download-artifact@v8
        with:
          run-id: 38321848412
          name: Cobra-2103376-Critical-Preview-Native-Evidence
          github-token: ${{ github.token }}
          path: locked-native-evidence
      - name: Verify and restore completed compiler dependencies
        run: |
          set -euo pipefail
          (cd dependency-transfer && sha256sum -c SHA256SUMS)
          tar --no-same-owner -xf dependency-transfer/verified-android-dependencies.tar
          tar --no-same-owner -xf dependency-transfer/verified-compiler-cache.tar -C "$HOME"
          python3 repairs/android-checkpoint-shutdown/native_ci.py verify-dependencies
          sudo apt-get update -qq
          sudo apt-get install -y python3-yaml python3-dev libsqlite3-dev libssl-dev
      - name: Reconstruct exact locked native source and apply only the saved entry wrapper
        run: |
          set -euo pipefail
          mkdir -p checkpoint-build
          python3 repairs/close-lifecycle-native-2103377/native_ci.py prepare --locked locked-parent/Cobra-2103374-Verified-Deadweight-RC1.apk --previous previous-candidate/Cobra-2103375-File-Preview-Native-RC1.apk --parent-proof locked-native-evidence 2>&1 | tee checkpoint-build/prepare-lifecycle.log
      - name: Compile full matched native engine and verify exported entry functions
        run: |
          set -euo pipefail
          python3 repairs/close-lifecycle-native-2103377/native_ci.py compile 2>&1 | tee checkpoint-build/compile-lifecycle.log
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103377-Lifecycle-Native-Internal
          path: checkpoint-build/libkodi.so
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
      - name: Record explicit scope and resume point
        if: always()
        run: |
          mkdir -p checkpoint-build
          git rev-parse HEAD > checkpoint-build/LIFECYCLE-COMMIT.txt
          printf '%s\n' 'NATIVE VERIFICATION ONLY. NO APK, SIGNING, RELEASE OR LOCK. THE SHUTDOWN BLOCKER REMAINS UNRESOLVED. THE SAVED 274-TEST JAVA CANDIDATE IS REQUIRED FOR THIS NEW NATIVE ENTRY. NO PHYSICAL FOLD ACCEPTANCE.' > checkpoint-build/LIFECYCLE-SCOPE.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103377-Lifecycle-Native-Evidence
          path: |
            checkpoint-build/
            !checkpoint-build/libkodi.so
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
