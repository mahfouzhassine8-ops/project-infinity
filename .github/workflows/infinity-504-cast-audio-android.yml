name: Infinity504 Cast AAC selected Android JNI relay - no Kodi build
on:
  push:
    branches: [work/infinity-2103504-cast-end-to-end-20261116, work/infinity-2103506-receiver-compatibility-20261117]
    paths: [repairs/infinity-cast-end-to-end-2103504-20261116/CI-ANDROID.json, repairs/infinity-cast-receiver-2103506-20261117/CI-HARDWARE.json]
permissions: {contents: read, actions: read}
concurrency: {group: infinity504-cast-audio-android, cancel-in-progress: false}
jobs:
  cast-audio-android:
    if: github.repository == 'mahfouzhassine8-ops/project-infinity' && github.ref == 'refs/heads/work/infinity-2103504-cast-end-to-end-20261116'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env: {PYTHONDONTWRITEBYTECODE: '1', GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;21.4.7075529', log-accepted-android-sdk-licenses: false}
      - name: Build only disposable probe with original504 engine and DEX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python repairs/infinity-cast-end-to-end-2103504-20261116/build_android.py
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '36'
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 8G
          avd-name: infinity504-cast-audio-selected
          disable-animations: false
          emulator-options: -no-window -memory 4096 -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python repairs/infinity-cast-end-to-end-2103504-20261116/run_android.py
      - name: Require actual selected probe success, independently of emulator action exit
        if: always()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('cast504-android-results/ANDROID-CAST-AUDIO.json'))
          assert r['pass'] is True and r['status']=='PASS_ACTUAL_ARM64_ANDROID_AAC_JNI_RELAY',r
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Infinity504-Cast-AAC-Android-${{ github.run_id }}-EVIDENCE-ONLY
          path: |
            cast504-android-results/
            cast504-android-work/BUILD.json
            cast504-android-work/fixtures/
          if-no-files-found: warn
          retention-days: 90

  receiver-hardware-inventory:
    if: github.repository == 'mahfouzhassine8-ops/project-infinity' && github.ref == 'refs/heads/work/infinity-2103506-receiver-compatibility-20261117'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env: {PYTHONDONTWRITEBYTECODE: '1', GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;21.4.7075529', log-accepted-android-sdk-licenses: false}
      - name: Compile Cast metadata only and separate original506-engine capability probe
        run: |
          python repairs/infinity-cast-receiver-2103506-20261117/build_probe.py
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '36'
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 8G
          avd-name: infinity506-receiver-capability-only
          emulator-options: -no-window -memory 4096 -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python repairs/infinity-cast-receiver-2103506-20261117/run_probe.py
      - name: Require inventory receipt; never confuse it with a working transcode
        if: always()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('cast506-hardware-results/RESULT.json'))
          assert r['pass'] is True and r['status']=='PASS_SELECTED_CODEC_INVENTORY',r
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Infinity506-Receiver-Capability-${{ github.run_id }}-EVIDENCE-ONLY
          path: |
            cast506-hardware-results/
            cast506-hardware-work/BUILD.json
            cast506-hardware-work/native-verification/CAST506-METADATA-ARM64.json
          if-no-files-found: warn
          retention-days: 90
