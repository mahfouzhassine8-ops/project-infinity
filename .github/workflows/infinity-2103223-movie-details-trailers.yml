name: Infinity | 2103223 Movie Details + Trailers

on:
  workflow_dispatch:
  push:
    branches: [infinity-cobra-2103223-movie-details-trailers-rc1]
    paths:
      - '.github/workflows/infinity-2103223-movie-details-trailers.yml'
      - 'repairs/movie-details-trailers-2103223/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: infinity-2103223-${{ github.sha }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}

      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}

      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools}

      - name: Download exact 2103208 source parent
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103208-Integration-Polish-TEST-CANDIDATE-Replica-1-Attempt-1
          run-id: 35676573761
          github-token: ${{ github.token }}
          path: baseline208

      - name: Download preserved 2103209 native engine
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103209-Python311-GIL-Native-Engine
          run-id: 35693288744
          github-token: ${{ github.token }}
          path: native209

      - name: Download exact locked 2103222 APK for preservation gate
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103222-Experience-Options-UI-TEST-CANDIDATE
          run-id: 35790247022
          github-token: ${{ github.token }}
          path: parent222

      - name: Reconstruct exact locked 2103222 source
        run: |
          set -euo pipefail
          mkdir -p audit223 engine
          cp native209/pythoninvoker-threadstate-v2-source.json engine/pythoninvoker-threadstate-v2-source.json
          cp native209/pythoninvoker-threadstate-v2-source.stage1.json engine/pythoninvoker-threadstate-v2-source.stage1.json

          python3 repairs/python311-gil-2103209/ci.py prepare             --base-dir baseline208             --native-apk native209/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2-Engine-Base.apk             --shell shell-kodi             --out audit223/base

          python3 repairs/cobra-media-library-health-2103210/apply.py --shell shell-kodi
          python3 repairs/cobra-library-health-2103211/apply.py --shell shell-kodi
          python3 repairs/health-media-trim-2103212/apply.py --shell shell-kodi
          python3 repairs/live-blue-ambient-settings-return-2103213/apply.py --shell shell-kodi
          python3 repairs/media-details-final-2103214/apply.py --shell shell-kodi
          python3 repairs/smart-return-experience-drawer-2103215/apply.py --shell shell-kodi
          python3 repairs/smart-return-experience-display-2103216/apply.py --shell shell-kodi
          python3 repairs/media-return-context-2103217/apply.py --shell shell-kodi
          python3 repairs/drawer-owner-ui-restore-2103221/apply.py --shell shell-kodi
          python3 repairs/experience-options-ui-2103222/apply.py --shell shell-kodi

          grep -F '"version_code": 2103222' engine/background-resume-source.json
          grep -F '"version_name": "1.0.9-Experience-Options-UI-RC1"' engine/background-resume-source.json
          grep -F '"smart_return_untouched": true' engine/background-resume-source.json
          grep -F '"drawer_owner_untouched": true' engine/background-resume-source.json

      - name: Apply ONLY movie detail presentation and trailers
        run: |
          set -euo pipefail
          python3 repairs/movie-details-trailers-2103223/apply.py --shell shell-kodi

          JAVA=shell-kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          grep -F 'COBRA • MOVIE DETAILS' "$JAVA"
          grep -F 'cobraRenderMovieDetailPage(item,info)' "$JAVA"
          grep -F '▶  TRAILER' "$JAVA"
          grep -F 'Trailers' "$JAVA"
          grep -F 'Related Movies' "$JAVA"
          grep -F 'youtube_trailer' "$JAVA"
          grep -F 'cobraRestoreVodDetailReturn()' "$JAVA"
          grep -F 'Browse Episodes' "$JAVA"

          grep -F '"movie_details_full_page": true' engine/background-resume-source.json
          grep -F '"movie_trailers_option": true' engine/background-resume-source.json
          grep -F '"tv_show_details_unchanged": true' engine/background-resume-source.json
          grep -F '"playback_unchanged": true' engine/background-resume-source.json
          grep -F '"providers_unchanged": true' engine/background-resume-source.json
          grep -F '"choose_experience_ui_unchanged": true' engine/background-resume-source.json

      - name: Build sign and verify 2103223
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v             -keystore "$HOME/.android/debug.keystore"             -storepass android -alias androiddebugkey -keypass android             -dname "CN=Android Debug,O=Android,C=US"             -keyalg RSA -keysize 2048 -validity 10000

          python3 scripts/package_background_resume.py             --source shell-kodi             --base-apk audit223/base/Infinity-2103208-Python311-GIL-Patched-Base.apk             --build-dir build223             --out signed223

          python3 repairs/movie-details-trailers-2103223/verify.py             --apk signed223/Infinity-1.0.9-Cobra-Movie-Details-Trailers-RC1.apk             --parent222 parent222/Infinity-1.0.9-Experience-Options-UI-RC1.apk             --audit signed223/background-resume-apk-audit.json             --scope audit223/scope.json

      - name: Publish 2103223 TEST CANDIDATE
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103223-Cobra-Movie-Details-Trailers-TEST-CANDIDATE
          path: signed223/
          compression-level: 0
          retention-days: 90

      - name: Preserve 2103223 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103223-Cobra-Movie-Details-Trailers-Evidence
          path: |
            audit223/
            engine/background-resume-source.json
            repairs/movie-details-trailers-2103223/
            signed223/*.json
            signed223/*.txt
          if-no-files-found: warn
          retention-days: 90
