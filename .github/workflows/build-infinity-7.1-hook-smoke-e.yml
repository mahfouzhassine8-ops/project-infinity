name: Infinity 7.1 Minimal Hook Smoke Candidate E

on:
  workflow_dispatch:
  push:
    branches:
      - infinity-7.1-core-unified
    paths:
      - '.github/workflows/build-infinity-7.1-hook-smoke-e.yml'
      - 'scripts/patch-infinity-7.1-native-fold.py'
      - 'scripts/patch-infinity-7.1-native-hook.py'
      - 'scripts/patch-infinity-7.1-app-hook.py'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    env:
      KODI_TAG: 21.3-Omega
      KODI_SHA: a3a448d26b8d560a65655dab2cd122994dc4e146
      NDK_VER: 21.4.7075529
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf bison build-essential curl flex gawk git gperf lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev unzip zip zlib1g-dev ccache python3 nasm yasm
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VER}"
          curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

      - name: Clone exact Kodi 21.3
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "${KODI_TAG}" https://github.com/xbmc/xbmc.git kodi
          test "$(git -C kodi rev-parse HEAD)" = "${KODI_SHA}"

      - name: Apply only minimal native hook foundation
        run: |
          set -euxo pipefail
          python3 scripts/patch-infinity-7.1-native-fold.py
          python3 scripts/patch-infinity-7.1-native-hook.py
          grep -q '"_infinityHasActiveVideo"' kodi/xbmc/platform/android/activity/JNIMainActivity.cpp
          grep -q '"_infinitySyncDisplayState"' kodi/xbmc/platform/android/activity/JNIMainActivity.cpp
          grep -q 'appPlayer->IsPlaying() && appPlayer->HasVideo()' kodi/xbmc/platform/android/activity/XBMCApp.cpp

      - name: Cache Kodi depends
        uses: actions/cache@v4
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            ~/.ccache
          key: infinity-7.1-hook-smoke-e-21.3-arm64-${{ runner.os }}-${{ hashFiles('scripts/patch-infinity-7.1-native-fold.py', 'scripts/patch-infinity-7.1-native-hook.py') }}
          restore-keys: |
            infinity-7.1-hooked-d-21.3-arm64-${{ runner.os }}-
            infinity-7.1-hooked-21.3-arm64-${{ runner.os }}-
            infinity-7.1-kodi-21.3-arm64-${{ runner.os }}-

      - name: Configure and build hooked Kodi 21.3 core
        run: |
          set -euxo pipefail
          mkdir -p "${TARBALLS}" "${DEPENDS}" "${BUILD_DIR}"
          cd kodi/tools/depends
          ./bootstrap
          ./configure \
            --with-tarballs="${TARBALLS}" \
            --host=aarch64-linux-android \
            --with-sdk-path="${ANDROID_HOME}" \
            --with-ndk-path="${ANDROID_HOME}/ndk/${NDK_VER}" \
            --prefix="${DEPENDS}" \
            --enable-debug=yes
          make -j"$(nproc)"
          make -C target/cmakebuildsys BUILD_DIR="${BUILD_DIR}"
          make -C "${BUILD_DIR}" -j"$(nproc)"
          CORE=$(find "${BUILD_DIR}" -type f -name 'libkodi.so' -print -quit)
          test -n "$CORE"
          cp "$CORE" /tmp/libkodi-hook-smoke-e.so
          test -s /tmp/libkodi-hook-smoke-e.so
          sha256sum /tmp/libkodi-hook-smoke-e.so > /tmp/core.sha256

      - name: Download exact proven Infinity 7.0 body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9987818547/zip" -o /tmp/base.zip
          mkdir -p /tmp/base-art
          unzip -q /tmp/base.zip -d /tmp/base-art
          APK=$(find /tmp/base-art -name '*.apk' -type f -print -quit)
          test -n "$APK"
          cp "$APK" /tmp/base.apk
          unzip -l /tmp/base.apk | grep -q 'lib/arm64-v8a/libkodi.so'

      - name: Decode body and inventory native libraries
        run: |
          set -euxo pipefail
          java -jar /tmp/apktool.jar d -f /tmp/base.apk -o /tmp/target
          test -f /tmp/target/AndroidManifest.xml
          MAIN=$(find /tmp/target -path '*/com/projectinfinity/kodi/Main.smali' -print -quit)
          test -n "$MAIN"
          find /tmp/target/lib/arm64-v8a -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/native-before.txt
          sha256sum /tmp/target/lib/arm64-v8a/*.so | sort > /tmp/native-hashes-before.txt

      - name: Apply only required Android hook
        run: |
          set -euxo pipefail
          python3 scripts/patch-infinity-7.1-app-hook.py
          MAIN=$(find /tmp/target -path '*/com/projectinfinity/kodi/Main.smali' -print -quit)
          BRIDGE=$(find /tmp/target -path '*/com/projectinfinity/kodi/InfinityCoreBridge.smali' -print -quit)
          test -n "$MAIN" && test -n "$BRIDGE"
          grep -q '_infinityHasActiveVideo()Z' "$MAIN"
          grep -q '_infinitySyncDisplayState()V' "$MAIN"
          grep -q 'hasActiveVideoPlayer' "$BRIDGE"
          grep -q 'syncDisplayState' "$BRIDGE"
          grep -q 'android:supportsPictureInPicture="true"' /tmp/target/AndroidManifest.xml
          grep -q 'android:resizeableActivity="true"' /tmp/target/AndroidManifest.xml

      - name: Inject only rebuilt libkodi and verify no other native library changed
        run: |
          set -euxo pipefail
          cp /tmp/libkodi-hook-smoke-e.so /tmp/target/lib/arm64-v8a/libkodi.so
          find /tmp/target/lib/arm64-v8a -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/native-after.txt
          diff -u /tmp/native-before.txt /tmp/native-after.txt
          sha256sum /tmp/target/lib/arm64-v8a/*.so | sort > /tmp/native-hashes-after.txt
          python3 - <<'PY'
          from pathlib import Path
          b={ln.split()[1].split('/')[-1]:ln.split()[0] for ln in Path('/tmp/native-hashes-before.txt').read_text().splitlines()}
          a={ln.split()[1].split('/')[-1]:ln.split()[0] for ln in Path('/tmp/native-hashes-after.txt').read_text().splitlines()}
          changed=[k for k in sorted(a) if a[k] != b.get(k)]
          print('Changed native libraries:', changed)
          if changed != ['libkodi.so']:
              raise SystemExit(f'unexpected native library changes: {changed}')
          PY

      - name: Static startup integrity audit
        run: |
          set -euxo pipefail
          MAIN=$(find /tmp/target -path '*/com/projectinfinity/kodi/Main.smali' -print -quit)
          test -n "$MAIN"
          grep -q '^\.method public native _infinityHasActiveVideo()Z' "$MAIN"
          grep -q '^\.method public native _infinitySyncDisplayState()V' "$MAIN"
          test "$(grep -c '^\.method public onUserLeaveHint()V' "$MAIN")" -eq 1
          test "$(grep -c '^\.method public onPictureInPictureModeChanged(ZLandroid/content/res/Configuration;)V' "$MAIN")" -eq 1
          test "$(grep -c '^\.method public onMultiWindowModeChanged(ZLandroid/content/res/Configuration;)V' "$MAIN")" -eq 1
          ! grep -q '_infinitySystemThemeMode' "$MAIN"
          ! grep -q '_infinityWindowWidth' "$MAIN"
          ! grep -q '_infinityWindowHeight' "$MAIN"
          ! grep -q '_infinityBridgeVersion' "$MAIN"

      - name: Rebuild minimal smoke APK
        run: java -jar /tmp/apktool.jar b /tmp/target -o /tmp/Infinity-7.1-Hook-Smoke-E-unsigned.apk

      - name: Align sign and verify
        env:
          PASS: infinity${{ github.run_id }}${{ github.run_attempt }}
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          keytool -genkeypair -keystore /tmp/infinity.keystore -alias infinity -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Infinity 7.1 Hook Smoke E, O=Project Infinity, C=US" >/dev/null 2>&1
          "$BT/zipalign" -f 4 /tmp/Infinity-7.1-Hook-Smoke-E-unsigned.apk /tmp/Infinity-7.1-Hook-Smoke-E-aligned.apk
          "$BT/apksigner" sign --ks /tmp/infinity.keystore --ks-key-alias infinity --ks-pass env:PASS --key-pass env:PASS --out /tmp/Infinity-7.1-Hook-Smoke-E.apk /tmp/Infinity-7.1-Hook-Smoke-E-aligned.apk
          "$BT/apksigner" verify --verbose /tmp/Infinity-7.1-Hook-Smoke-E.apk
          sha256sum /tmp/Infinity-7.1-Hook-Smoke-E.apk > /tmp/Infinity-7.1-Hook-Smoke-E.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-7.1-Hook-Smoke-Candidate-E
          path: |
            /tmp/Infinity-7.1-Hook-Smoke-E.apk
            /tmp/Infinity-7.1-Hook-Smoke-E.sha256
            /tmp/core.sha256
            /tmp/native-before.txt
            /tmp/native-hashes-before.txt
            /tmp/native-hashes-after.txt
          retention-days: 30
