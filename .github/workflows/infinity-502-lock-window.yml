name: Infinity502 selected Android lock window - isolated component
on:
  push:
    branches: [work/infinity-2103502-six-repairs-20261116]
    paths: [repairs/infinity-six-repairs-2103502-20261116/lock/android/CI-WINDOW.json]
permissions: {contents: read}
concurrency: {group: infinity502-lock-window, cancel-in-progress: false}
jobs:
  window:
    if: github.repository == 'mahfouzhassine8-ops/project-infinity' && github.ref == 'refs/heads/work/infinity-2103502-six-repairs-20261116'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - name: Explicit selected component check and reviewed input gate
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('repairs/infinity-six-repairs-2103502-20261116/lock/android')
          request=json.loads((root/'CI-WINDOW.json').read_text())
          assert request['selected_check']=='isolated_android_video_lock_window'
          assert request['Infinity_application_execution'] is False
          assert request['Infinity_shutdown'] == 'NOT_SELECTED'
          assert request['owner_installer'] is False
          assert request['baseline']==2103502
          assert request['review']['approved'] is True
          assert request['review']['reviewer']=='Astra'
          for name,digest in request['inputs'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          source=request['source_commit']
          assert subprocess.check_output(['git','rev-parse',source],text=True).strip()==source
          changed=subprocess.check_output(['git','diff','--name-only',source,os.environ['GITHUB_SHA']],text=True).splitlines()
          assert changed==[str(root/'CI-WINDOW.json')],changed
          PY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools build-tools;35.0.0 platforms;android-34', log-accepted-android-sdk-licenses: false}
      - name: Compile actual State and Dialog in separate disposable package
        run: |
          python - <<'PY'
          import hashlib,urllib.request
          from pathlib import Path
          target=Path('lock-window-work/ecj-3.37.0.jar')
          target.parent.mkdir()
          data=urllib.request.urlopen('https://repo.maven.apache.org/maven2/org/eclipse/jdt/ecj/3.37.0/ecj-3.37.0.jar',timeout=60).read()
          assert hashlib.sha256(data).hexdigest()=='cde026ff966b48b5e5f148b6f041ceff3cf4f85cf75155f4ec0f40e4ee14b545'
          target.write_bytes(data)
          PY
          python repairs/infinity-six-repairs-2103502-20261116/lock/android/build_probe.py \
            --work lock-window-work/build \
            --android-jar "$ANDROID_HOME/platforms/android-34/android.jar" \
            --ecj lock-window-work/ecj-3.37.0.jar \
            --d8 "$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar" \
            --aapt2 "$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" --debug-sign
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '36'
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 6G
          avd-name: infinity502-lock-window
          disable-animations: false
          emulator-options: -no-window -memory 4096 -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python repairs/infinity-six-repairs-2103502-20261116/lock/android/run_profiles.py --work lock-window-work --sdk "$ANDROID_HOME/build-tools/35.0.0"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Infinity502-Lock-Android-Window-${{ github.run_id }}-EVIDENCE-ONLY
          path: |
            lock-window-work/build/BUILD.json
            lock-window-work/results/
          if-no-files-found: warn
          retention-days: 90
