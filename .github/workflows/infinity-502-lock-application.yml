name: Infinity502 selected lock Stop watched application integration - no release
on:
  push:
    branches: [work/infinity-2103502-six-repairs-20261116]
    paths: [repairs/infinity-six-repairs-2103502-20261116/lock/application/CI-APPLICATION.json]
permissions: {contents: read, actions: read}
concurrency: {group: infinity502-lock-application, cancel-in-progress: false}
jobs:
  application:
    if: github.repository == 'mahfouzhassine8-ops/project-infinity' && github.ref == 'refs/heads/work/infinity-2103502-six-repairs-20261116'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env: {PYTHONDONTWRITEBYTECODE: '1'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - name: Exact independently reviewed application input set and native binding
        run: python repairs/infinity-six-repairs-2103502-20261116/lock/application/gate.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools build-tools;35.0.0 platforms;android-34', log-accepted-android-sdk-licenses: false}
      - name: Authenticate502 and reuse reviewed native engine in disposable assembly
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python repairs/infinity-six-repairs-2103502-20261116/lock/application/stage.py
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '36'
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 8G
          avd-name: infinity502-lock-application
          disable-animations: false
          emulator-options: -no-window -memory 4096 -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python repairs/infinity-six-repairs-2103502-20261116/lock/application/verify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Infinity502-Lock-Application-${{ github.run_id }}-EVIDENCE-ONLY
          path: lock-app-work/evidence/
          if-no-files-found: warn
          retention-days: 90
