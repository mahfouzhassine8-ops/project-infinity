name: Infinity feature-only verification
on:
  push:
    branches: [work/infinity-2103402-final-stabilization-20261024, work/infinity-final-corrective-from-2103407-20261025, work/infinity-final-release-462-20261107]
    paths: ['repairs/infinity-2103402-final/android17/REQUEST.json', 'repairs/infinity-final-closure-2103407/ANDROID17-REQUEST.json', 'repairs/infinity-final-release-462-20261107/SCOPE.json', 'repairs/infinity-final-release-462-20261107/ANDROID-SCOPE.json', 'repairs/infinity-final-release-462-20261107/RELEASE-REQUEST.json']
  workflow_dispatch:
