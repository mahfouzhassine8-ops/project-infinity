name: Infinity feature-only verification
on:
  push:
    branches: [work/infinity-2103402-final-stabilization-20261024, work/infinity-final-corrective-from-2103407-20261025]
    paths: ['repairs/infinity-2103402-final/android17/REQUEST.json', 'repairs/infinity-final-closure-2103407/ANDROID17-REQUEST.json']
  workflow_dispatch:
    inputs:
      source_ref:
        description: Corrective source/test branch or exact commit
        required: true
        type: string
        default: work/infinity-saved-route-android-20261023
      authorization:
        description: User-approved feature correction and exact test scope
        required: true
        type: string
      feature:
        description: Run only this selected feature (never Close or shutdown)
        required: true
        type: choice
        default: select-a-feature
        options: [select-a-feature, saved-navigation, provider-pov, provider-umbrella, provider-seren, provider-future, multiimage, tracking-recovery, tracking-actions, tracking-continue, final-participant, final-continue, final-actions, final-pov, final-search-pov-enter, final-search-pov-button, final-search-all-enter, infinity-performance-host, infinity-performance-android, cobra-owner-host, cobra-android-launch]
      candidate_build:
        description: Existing signed build run (no rebuild)
        required: true
        type: string
        default: '39994772688'
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-feature-${{ inputs.source_ref || github.ref }}-${{ inputs.feature || 'explicit-request' }}-${{ github.ref == 'refs/heads/work/infinity-final-corrective-from-2103407-20261025' && github.sha || 'serial' }}
  cancel-in-progress: false
jobs:
  cobra-host:
    name: Cobra2103428 production DEX host integration and exact owner preparation
    if: github.event_name == 'workflow_dispatch' && inputs.feature == 'cobra-owner-host'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AUTHORIZED_SCOPE: ${{ inputs.authorization }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.source_ref }}", fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Admit exact authorized Cobra branch
        run: |
          test -n "$AUTHORIZED_SCOPE"
          test "$(git branch --show-current)" = work/cobra-only-from-2103427-20261028
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/lock/infinity-cobra-2103427-user-approved-20261028)" = 782242090483982c39a78f9c4da932a4751bdafc
      - uses: actions/download-artifact@v4
        with:
          run-id: 40769526963
          name: Infinity-Combined-Original-Signer-40769526963
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          run-id: 40769526963
          name: Infinity-Combined-Owner-Components-40769526963
          github-token: ${{ github.token }}
          path: baseline-components
      - uses: actions/download-artifact@v4
        with:
          run-id: 39867073954
          name: Infinity-Receipt-Race-Android17-Investigation
          github-token: ${{ github.token }}
          path: tools
      - name: Compile Cobra-only production delta and prepare translated actual DEX
        run: |
          set -euo pipefail
          target=repairs/cobra-next-from-2103427
          python3 "$target/build.py" --bundles baseline-components --jars tools/receipt-evidence/tool-jars --android tools/receipt-evidence/android-34.jar --d8 "$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar" --out cobra-build
          curl -fL https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip -o dex2jar.zip
          echo 'ee7c45eb3c1d2474a6145d8d447e651a736a22d9664b6d3d3be5a5a817dda23a  dex2jar.zip' | sha256sum -c -
          unzip -q dex2jar.zip -d dex2jar
          python3 "$target/host_tests.py" --work cobra-build --apk baseline/Infinity-2103427-Combined-Original-Signer.apk --dex2jar dex2jar/dex-tools-v2.4 --out cobra-host
          python3 "$target/host_tests.py" --work cobra-build --apk baseline/Infinity-2103427-Combined-Original-Signer.apk --dex2jar dex2jar/dex-tools-v2.4 --out cobra-baseline-host --baseline-measure
      - name: Execute selected host integration and comparable baseline work count
        run: |
          set -euo pipefail
          mvn -B -q -f cobra-host/pom.xml dependency:resolve
          python3 - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile
          for folder in ['cobra-host','cobra-baseline-host']:
              for artifact,name in [('monitor','monitor.jar'),('espresso-idling-resource','espresso.jar')]:
                  archives=list((Path.home()/'.m2/repository/androidx/test').rglob(artifact+'-*.aar'))
                  assert len(archives)==1
                  with ZipFile(archives[0]) as z:(Path(folder)/'android-test-libs'/name).write_bytes(z.read('classes.jar'))
          PYCODE
          mvn -B -q -f cobra-host/pom.xml test 2>&1 | tee cobra-host/TEST-OUTPUT.txt
          mvn -B -q -f cobra-baseline-host/pom.xml -Dcobra.measure.baseline=true test 2>&1 | tee cobra-baseline-host/TEST-OUTPUT.txt
      - name: Verify exact unchanged code and prepare immutable owners (no APK signing)
        run: |
          python3 repairs/cobra-next-from-2103427/package_owners.py --bundles baseline-components --work cobra-build --jars tools/receipt-evidence/tool-jars --out prepared-owners/components --source "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: Cobra-Prepared-Owners-${{ github.run_id }}
          path: prepared-owners/components/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cobra-Host-Evidence-${{ github.run_id }}
          path: |
            cobra-host/INPUTS.json
            cobra-host/TEST-OUTPUT.txt
            cobra-host/target/surefire-reports/
            cobra-baseline-host/INPUTS.json
            cobra-baseline-host/TEST-OUTPUT.txt
            cobra-baseline-host/target/surefire-reports/
            cobra-build/BUILD.json
            prepared-owners/CORRECTIVE-PRESERVATION.json
          retention-days: 90
          if-no-files-found: error
  cobra-android:
    name: Exact signed Cobra-only Android17 launch observation
    if: github.event_name == 'workflow_dispatch' && inputs.feature == 'cobra-android-launch'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      INFINITY_EMULATOR_API: '37.1'
      INFINITY_EMULATOR_TARGET: google_apis_ps16k
      AUTHORIZED_SCOPE: ${{ inputs.authorization }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.source_ref }}", fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.candidate_build }}
          pattern: Infinity-Combined-Original-Signer-*
          merge-multiple: true
          github-token: ${{ github.token }}
          path: runtime-signed
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - name: Prepare exact API37 infrastructure and verify original signing
        run: |
          set -euo pipefail
          test -n "$AUTHORIZED_SCOPE"
          mkdir -p runtime-results
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs runtime-signed/Infinity-*-Combined-Original-Signer.apk > runtime-results/SIGNATURE.txt
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0
          python3 repairs/infinity-final-closure-2103407/api37_environment_gate.py --sdk-root "$ANDROID_HOME" --out runtime-platform --pin-tools
          python3 repairs/android-checkpoint-shutdown/runtime-tests/prepare_android_emulator.py --out runtime-emulator-setup
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '37.1'
          arch: x86_64
          target: google_apis_ps16k
          profile: pixel_2
          disk-size: 8G
          avd-name: infinity-four-repair-api37
          pre-emulator-launch-script: python3 repairs/infinity-final-closure-2103407/api37_environment_gate.py --sdk-root "$ANDROID_HOME" --out runtime-platform --check-avd
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 repairs/cobra-next-from-2103427/run_android_probe.py --signed runtime-signed --out runtime-results/probe --signature runtime-results/SIGNATURE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cobra-Android17-Launch-${{ github.run_id }}
          path: |
            runtime-results/
            runtime-platform/
            runtime-emulator-setup/
          retention-days: 90
          if-no-files-found: error
  performance-android:
    name: Existing signed2103426 focused Android17 journey
    if: github.event_name == 'workflow_dispatch' && inputs.feature == 'infinity-performance-android'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SELECTED_FEATURE: ${{ inputs.feature }}
      AUTHORIZED_SCOPE: ${{ inputs.authorization }}
      CANDIDATE_BUILD: ${{ inputs.candidate_build }}
      INFINITY_EMULATOR_API: '37.1'
      INFINITY_EMULATOR_TARGET: google_apis_ps16k
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.source_ref }}", fetch-depth: 0, persist-credentials: false, show-progress: false}
      - name: Admit only the existing signed candidate and selected finite test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os,subprocess
          scope=json.loads(Path('repairs/infinity-only-performance-2103425/runtime/SCOPE.json').read_text())
          assert os.environ['AUTHORIZED_SCOPE'].strip()
          assert os.environ['CANDIDATE_BUILD']=='40647343407'
          assert subprocess.check_output(['git','branch','--show-current'],text=True).strip()==scope['branch']
          assert scope['shutdown']=='FROZEN_NOT_RUN' and scope['unchanged_APK_required'] is True
          PY
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Focused host transport and workflow isolation controls
        run: |
          python3 -m pip install PyYAML==6.0.2
          PYTHONPATH=repairs/infinity-only-performance-2103425/runtime python3 -m unittest -v test_probe
      - uses: actions/download-artifact@v4
        with:
          run-id: 40647343407
          name: Infinity-Combined-Original-Signer-40647343407
          github-token: ${{ github.token }}
          path: runtime-signed
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Record the previously successful SDK Java prerequisite
        run: |
          mkdir -p runtime-platform
          java -version > runtime-platform/JAVA-VERSION.txt 2>&1
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - name: Preserve SDK bootstrap diagnostics on setup failure
        if: failure()
        run: |
          "$ANDROID_HOME/cmdline-tools/22.0/bin/sdkmanager" --version > runtime-platform/sdkmanager-version.txt 2>&1 || true
      - name: Verify original APK and reuse the documented Android17 environment
        run: |
          set -euo pipefail
          mkdir -p runtime-platform
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs runtime-signed/Infinity-2103426-Combined-Original-Signer.apk > runtime-platform/APK-SIGNATURE.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('runtime-signed/Infinity-2103426-Combined-Original-Signer.apk')
          with p.open('rb') as f: assert hashlib.file_digest(f,'sha256').hexdigest()=='5a9e5702a99606cc51b094f9f786edf091b6852306d9a70eaab2787f256e7f39'
          assert 'Signer #1 certificate SHA-256 digest: d7adeb68e9341596a02bd3262b737a0f45fc6e771ed7e60285437e833b58c6d7' in Path('runtime-platform/APK-SIGNATURE.txt').read_text()
          PY
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0 ffmpeg
          python3 repairs/infinity-final-closure-2103407/api37_environment_gate.py --sdk-root "$ANDROID_HOME" --out runtime-platform --pin-tools
          python3 repairs/android-checkpoint-shutdown/runtime-tests/prepare_android_emulator.py --out runtime-emulator-setup
          sudo chmod 666 /dev/kvm
      - name: Execute only the selected finite journey; leave application running
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '37.1'
          arch: x86_64
          target: google_apis_ps16k
          profile: pixel_2
          disk-size: 8G
          avd-name: infinity-four-repair-api37
          pre-emulator-launch-script: python3 repairs/infinity-final-closure-2103407/api37_environment_gate.py --sdk-root "$ANDROID_HOME" --out runtime-platform --check-avd
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell getprop > runtime-platform/runtime-properties.txt
            adb shell getconf PAGE_SIZE > runtime-platform/runtime-pagesize.txt
            adb shell sha256sum /system/lib64/libndk_translation.so > runtime-platform/native-bridge-sha256.txt
            python3 repairs/infinity-only-performance-2103425/runtime/probe.py --apk runtime-signed/Infinity-2103426-Combined-Original-Signer.apk --out runtime-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Infinity-2103426-Focused-Android17-${{ github.run_id }}
          path: |
            runtime-platform/
            runtime-emulator-setup/
            runtime-results/
            repairs/infinity-only-performance-2103425/runtime/SCOPE.json
          retention-days: 90
          if-no-files-found: error
  performance-host:
    if: github.event_name == 'workflow_dispatch' && inputs.feature == 'infinity-performance-host'
