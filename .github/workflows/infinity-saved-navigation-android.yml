name: Infinity saved routes - actual Android17 verification
on:
  push:
    branches: [work/infinity-saved-route-android-20261023]
    paths:
      - repairs/save-later-multiimage-20261023/android*.py
      - repairs/save-later-multiimage-20261023/NavigationBindingProbe.java
      - repairs/save-later-multiimage-20261023/ANDROID-INPUT-PINS.json
      - repairs/save-later-multiimage-20261023/ANDROID-FAVORITES-REFERENCE.json
      - .github/workflows/infinity-saved-navigation-android.yml
  workflow_dispatch:
    inputs:
      phase:
        description: Remaining safe gate; full matrix available for a changed APK
        type: choice
        options: [focused, full]
        default: focused
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-saved-route-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android17:
    name: Actual Android17 ${{ matrix.mode }}
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # Same signed APK: retain eight executed passing modes from 39998374579.
        # Only the remaining safe gate needs the evidence-backed dialog wait fix.
        mode: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.phase == 'full' && '["safe","pending","opaque","native-opaque","lost-file","provider-pov","provider-umbrella","provider-seren","provider-future"]' || '["safe"]') }}
    env:
      CANDIDATE_BUILD: '39994772688'
      CANDIDATE_COMMIT: '3d3730c490220a1169e9dea280832c42da4971e8'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - name: Require exact production checkpoint and successful signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,subprocess
          prefix='repairs/save-later-multiimage-20261023/'
          allowed={prefix+n for n in ('android_probe.py','android_runtime_checks.py','android_inputs.py','android_binding.py','NavigationBindingProbe.java','ANDROID-INPUT-PINS.json','ANDROID-FAVORITES-REFERENCE.json')}
          allowed.add('.github/workflows/infinity-saved-navigation-android.yml')
          paths=subprocess.check_output(['git','diff','--name-only',os.environ['CANDIDATE_COMMIT'],'HEAD'],text=True).splitlines()
          assert set(paths)<=allowed,paths
          r=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['CANDIDATE_BUILD']],text=True))
          assert r['head_sha']==os.environ['CANDIDATE_COMMIT'] and r['conclusion']=='success',r.get('conclusion')
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.CANDIDATE_BUILD }}
          name: Infinity-Saved-Navigation-MultiImage-INTERNAL-QA-NOT-ACCEPTED
          github-token: ${{ github.token }}
          path: signed
      - uses: actions/download-artifact@v4
        if: matrix.mode != 'opaque'
        with:
          run-id: 39136763823
          name: Infinity-2103387-Permanent-Signed-EXPERIMENTAL-UNQUALIFIED
          github-token: ${{ github.token }}
          path: archived-compatible-fixture
      - uses: actions/download-artifact@v4
        if: matrix.mode == 'safe'
        with:
          run-id: 39868217775
          name: Infinity-Universal-Persistence-INTERNAL-QA-NOT-ACCEPTED
          github-token: ${{ github.token }}
          path: rc8-input
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.7'}
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools build-tools;34.0.0
          log-accepted-android-sdk-licenses: false
      - name: Verify signed identity, provider source pins, and API37 infrastructure
        run: |
          set -euo pipefail
          (cd signed && sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          import hashlib,json,os,pathlib,sys
          sys.path.insert(0,'repairs/2103390-bugfixes/group7/finish92')
          import delivery92
          files=list(pathlib.Path('signed').glob('*.apk'));assert len(files)==1
          apk=files[0];digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          r=json.load(open('signed/CANDIDATE.json'))
          assert r['source_commit']==os.environ['CANDIDATE_COMMIT'] and r['apk_sha256']==digest
          delivery92.verify_signature(apk,pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/34.0.0')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('TEST_APK='+str(apk)+'\nTEST_APK_SHA='+digest+'\n')
          PY
          python3 repairs/save-later-multiimage-20261023/android_inputs.py stage --out android-provider-inputs
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0
          python3 repairs/four-repair-20261018/android37_gate.py --sdk-root "$ANDROID_HOME" --out api37-support --pin-tools
          python3 - <<'PY'
          import pathlib,subprocess,sys
          for attempt in range(1,4):
              out=pathlib.Path('emulator-setup')/('attempt-'+str(attempt))
              code=subprocess.run([sys.executable,'repairs/android-checkpoint-shutdown/runtime-tests/prepare_android_emulator.py','--out',str(out)]).returncode
              if code==0:break
              logs='\n'.join(p.read_text(errors='replace') for p in out.glob('sdkmanager-attempt-*.log'))
              if attempt==3 or 'Error reading Zip content from a SeekableByteChannel' not in logs:raise SystemExit(code)
          PY
          sudo chmod 666 /dev/kvm
      - name: Actual original routes, native failures and protected Close/reopen
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '37.0'
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 8G
          avd-name: infinity-four-repair-api37
          pre-emulator-launch-script: python3 repairs/four-repair-20261018/android37_gate.py --sdk-root "$ANDROID_HOME" --out api37-support --check-avd
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            if [ '${{ matrix.mode }}' = safe ]; then python3 repairs/save-later-multiimage-20261023/android_binding.py --apk "$TEST_APK" --parent rc8-input/Infinity-2103401-Universal-Persistence-RC8-NOT-ACCEPTED.apk --out art-binding; fi
            python3 repairs/save-later-multiimage-20261023/android_probe.py --apk "$TEST_APK" --expected-sha "$TEST_APK_SHA" --mode ${{ matrix.mode }} --versioncheck-fixture archived-compatible-fixture/versioncheck-companion/service.xbmc.versioncheck-0.5.28+infinity.1-Android-TEST.zip --out android-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Infinity-Saved-Routes-Actual-Android17-${{ matrix.mode }}-Evidence
          path: |
            android-results/
            art-binding/
            api37-support/
            emulator-setup/
            android-provider-inputs/INPUTS.json
          retention-days: 90
          if-no-files-found: warn
