          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs signed2103426/Infinity-2103426-Combined-Original-Signer.apk > continuation-results/BASELINE-SIGNATURE.txt
          python3 "$target/stage.py" --baseline signed2103426/Infinity-2103426-Combined-Original-Signer.apk --out staged-continuation
          python3 "$target/verify_host.py" --input staged-continuation/input-addons --staged staged-continuation --out continuation-results/HOST.json 2>&1 | tee continuation-results/INTEGRATION.txt
          PYTHONPATH=repairs/infinity-only-performance-2103425 python3 - <<'PYCODE' 2>&1 | tee continuation-results/RETAINED-EDGE-CONTROLS.txt
          import unittest
