      - name: Admit selected continuation and exact signed2103426
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          from pathlib import Path
          scope=json.loads(Path('repairs/infinity-only-performance-2103425/continuation/SCOPE.json').read_text())
          assert os.environ['AUTHORIZED_SCOPE'].strip()
          assert os.environ['BASELINE_BUILD']=='40647343407'
          branch=subprocess.check_output(['git','branch','--show-current'],text=True).strip()
          assert branch==scope['branch']
          assert scope['shutdown']=='FROZEN_NOT_RUN'
          assert subprocess.check_output(['git','rev-parse','origin/lock/infinity-cobra-2103425-fold-approved-chooser-20261028'],text=True).strip()=='db730100a3bfea7e06d2e6c3434e89aeb6fa8a15'
          PYCODE
      - uses: actions/download-artifact@v4
        with:
          run-id: 40647343407
          name: Infinity-Combined-Original-Signer-40647343407
          github-token: ${{ github.token }}
          path: signed2103426
      - name: Compile genuine continuation and selected host integration
        run: |
          set -euo pipefail
          python3 -m pip install lxml==6.0.2 PyYAML==6.0.2
          target=repairs/infinity-only-performance-2103425/continuation
