            python3 "$FEATURE_PROBE" --apk "$TEST_APK" --expected-sha "$TEST_APK_SHA" --case "$SELECTED_CASE" --authorization "$AUTHORIZED_SCOPE" --out feature-results
      - uses: actions/upload-artifact@v4
