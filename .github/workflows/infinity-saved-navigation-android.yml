      - name: One unchanged signed combined APK, one matching recovery and all matching checksums
        run: python3 repairs/infinity-final-release-462-20261107/package_verified_release.py --candidate publication-input464/Infinity-2103464-Combined-Original-Signer.apk --recovery publication-input465/signed465/Infinity-2103465-Combined-Original-Signer.apk --android publication-android/release-android-results --review repairs/infinity-final-release-462-20261107/ENGINEERING-REVIEW.json --sdk "$ANDROID_HOME/build-tools/35.0.0" --out publication-ready
      - name: Private draft, complete uploaded asset verification, then explicitly authorized prerelease publication
        run: python3 repairs/infinity-final-release-462-20261107/publish_verified_release.py --request repairs/infinity-final-release-462-20261107/RELEASE-REQUEST.json --payload publication-ready --out PUBLICATION-RECEIPT.json
      - uses: actions/upload-artifact@v4
