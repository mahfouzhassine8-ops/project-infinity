      source_ref:
        description: Corrective source/test branch or exact commit
        required: true
        type: string
        default: work/infinity-saved-route-android-20261023
      authorization:
        description: User-approved feature correction and exact test scope
        required: true
        type: string
      feature:
        description: Run only this selected feature (never Close or shutdown)
        required: true
        type: choice
        default: select-a-feature
        options: [select-a-feature, saved-navigation, provider-pov, provider-umbrella, provider-seren, provider-future, multiimage, tracking-recovery, tracking-actions, tracking-continue, final-participant, final-continue, final-actions, final-pov, final-search-pov-enter, final-search-pov-button, final-search-all-enter, infinity-performance-host, infinity-performance-android, cobra-owner-host, cobra-android-launch, cobra-cards-baseline, cobra-cards-host, cobra-fold-more433, cobra-rejected434-controls, infinity-seamless-loading434, cobra-drawer436-prepare, cobra-drawer436-android, cobra-quality444-final, external-player447-android, preview-resume448-android, preview-chrome449-android, preview-layout450-android, preview-fullscreen451-android, three-corrections-android]
      candidate_build:
        description: Existing signed build run (no rebuild)
        required: true
        type: string
        default: '39994772688'
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-feature-${{ inputs.source_ref || github.ref }}-${{ inputs.feature || 'explicit-request' }}-${{ github.ref == 'refs/heads/work/infinity-final-corrective-from-2103407-20261025' && github.sha || 'serial' }}
  cancel-in-progress: false
jobs:
  final464-verified-publication:
    name: Verified original signed464 and matching465 recovery publication; all engineering gates required
    if: github.event_name == 'push' && github.ref == 'refs/heads/work/infinity-final-release-462-20261107' && startsWith(github.event.head_commit.message, 'Publish final464:')
    runs-on: ubuntu-22.04
    permissions: {contents: write, actions: read}
    timeout-minutes: 35
    env: {GH_TOKEN: '${{ github.token }}', PYTHONDONTWRITEBYTECODE: '1'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '21'}
      - name: Exact explicit publication request and source-bound final evidence before packaging
        run: |
          python3 - <<'PYGATE'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('repairs/infinity-final-release-462-20261107')
          r=json.loads((root/'RELEASE-REQUEST.json').read_text())
          assert r['operation']=='publish-verified464' and r['publication'] is True and r['prerelease'] is True
          assert r['repository']=='mahfouzhassine8-ops/project-infinity' and r['tag']=='infinity-2103464-fold-acceptance'
          manual=json.loads((root/'ENGINEERING-REVIEW.json').read_text())
          assert manual['status']=='PASS_SELECTED_ENGINEERING_RELEASE_GATES' and manual['accepted_pointer_updated'] is False
          assert hashlib.sha256((root/'ENGINEERING-REVIEW.json').read_bytes()).hexdigest()==r['ENGINEERING_REVIEW_sha256']
          assert hashlib.sha256((root/'VERIFICATION.md').read_bytes()).hexdigest()==r['VERIFICATION_md_sha256']
          base='repos/'+r['repository']+'/actions/runs/'+str(int(r['Android_run']))
          run=json.loads(subprocess.check_output(['gh','api',base],text=True))
          assert run['status']=='completed' and run['conclusion']=='success' and run['head_sha']==r['Android_source']
          rows=json.loads(subprocess.check_output(['gh','api',base+'/artifacts?per_page=100'],text=True))['artifacts']
          match=[a for a in rows if a['id']==int(r['Android_artifact']) and not a['expired']]
          assert len(match)==1 and match[0]['digest']==r['Android_artifact_digest']
          with Path(os.environ['GITHUB_ENV']).open('a') as f:f.write('FINAL_ANDROID_RUN='+str(int(r['Android_run']))+'\nFINAL_ANDROID_ARTIFACT='+str(int(r['Android_artifact']))+'\n')
          PYGATE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13596730735', run-id: '42428328498', github-token: '${{ github.token }}', path: publication-input464, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13597150672', run-id: '42429020127', github-token: '${{ github.token }}', path: publication-input465, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
