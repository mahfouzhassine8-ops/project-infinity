          cp staged-continuation/STAGE.json staged-continuation/SOURCE-PLAN.json continuation-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Infinity-Performance-Continuation-Host-${{ github.run_id }}
          path: continuation-results/
          retention-days: 90
          if-no-files-found: error
  android17:
    if: inputs.feature != 'infinity-performance-host' && inputs.feature != 'infinity-performance-android' && inputs.feature != 'cobra-owner-host' && inputs.feature != 'cobra-android-launch'
    name: Selected feature ${{ inputs.feature || 'explicit baseline Search request' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 150
