name: Infinity feature-only verification
on:
  push:
    branches: [work/infinity-2103402-final-stabilization-20261024, work/infinity-final-corrective-from-2103407-20261025]
    paths: ['repairs/infinity-2103402-final/android17/REQUEST.json', 'repairs/infinity-final-closure-2103407/ANDROID17-REQUEST.json']
  workflow_dispatch:
    inputs:
      source_ref:
        description: Corrective source/test branch or exact commit
        required: true
        type: string
        default: work/infinity-saved-route-android-20261023
      authorization:
        description: User-approved feature correction and exact test scope
        required: true
        type: string
      feature:
        description: Run only this selected feature (never Close or shutdown)
        required: true
        type: choice
        default: select-a-feature
        options: [select-a-feature, saved-navigation, provider-pov, provider-umbrella, provider-seren, provider-future, multiimage, tracking-recovery, tracking-actions, tracking-continue, final-participant, final-continue, final-actions, final-pov, final-search-pov-enter, final-search-pov-button, final-search-all-enter, infinity-performance-host, infinity-performance-android]
      candidate_build:
        description: Existing signed build run (no rebuild)
        required: true
        type: string
        default: '39994772688'
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-feature-${{ inputs.source_ref || github.ref }}-${{ inputs.feature || 'explicit-request' }}-${{ github.ref == 'refs/heads/work/infinity-final-corrective-from-2103407-20261025' && github.sha || 'serial' }}
  cancel-in-progress: false
jobs:
  performance-android:
    name: Existing signed2103426 focused Android17 journey
    if: github.event_name == 'workflow_dispatch' && inputs.feature == 'infinity-performance-android'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SELECTED_FEATURE: ${{ inputs.feature }}
      AUTHORIZED_SCOPE: ${{ inputs.authorization }}
      CANDIDATE_BUILD: ${{ inputs.candidate_build }}
      INFINITY_EMULATOR_API: '37.1'
      INFINITY_EMULATOR_TARGET: google_apis_ps16k
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.source_ref }}", fetch-depth: 0, persist-credentials: false, show-progress: false}
      - name: Admit only the existing signed candidate and selected finite test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os,subprocess
          scope=json.loads(Path('repairs/infinity-only-performance-2103425/runtime/SCOPE.json').read_text())
          assert os.environ['AUTHORIZED_SCOPE'].strip()
          assert os.environ['CANDIDATE_BUILD']=='40647343407'
          assert subprocess.check_output(['git','branch','--show-current'],text=True).strip()==scope['branch']
          assert scope['shutdown']=='FROZEN_NOT_RUN' and scope['unchanged_APK_required'] is True
          PY
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Focused host transport and workflow isolation controls
        run: |
          python3 -m pip install PyYAML==6.0.2
          PYTHONPATH=repairs/infinity-only-performance-2103425/runtime python3 -m unittest -v test_probe
      - uses: actions/download-artifact@v4
        with:
          run-id: 40647343407
          name: Infinity-Combined-Original-Signer-40647343407
          github-token: ${{ github.token }}
          path: runtime-signed
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - name: Verify original APK and reuse the documented Android17 environment
        run: |
          set -euo pipefail
          mkdir -p runtime-platform
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs runtime-signed/Infinity-2103426-Combined-Original-Signer.apk > runtime-platform/APK-SIGNATURE.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('runtime-signed/Infinity-2103426-Combined-Original-Signer.apk')
          with p.open('rb') as f: assert hashlib.file_digest(f,'sha256').hexdigest()=='5a9e5702a99606cc51b094f9f786edf091b6852306d9a70eaab2787f256e7f39'
          assert 'Signer #1 certificate SHA-256 digest: d7adeb68e9341596a02bd3262b737a0f45fc6e771ed7e60285437e833b58c6d7' in Path('runtime-platform/APK-SIGNATURE.txt').read_text()
          PY
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0 ffmpeg
          python3 repairs/infinity-final-closure-2103407/api37_environment_gate.py --sdk-root "$ANDROID_HOME" --out runtime-platform --pin-tools
          python3 repairs/android-checkpoint-shutdown/runtime-tests/prepare_android_emulator.py --out runtime-emulator-setup
          sudo chmod 666 /dev/kvm
      - name: Execute only the selected finite journey; leave application running
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '37.1'
          arch: x86_64
          target: google_apis_ps16k
          profile: pixel_2
          disk-size: 8G
          avd-name: infinity-four-repair-api37
          pre-emulator-launch-script: python3 repairs/infinity-final-closure-2103407/api37_environment_gate.py --sdk-root "$ANDROID_HOME" --out runtime-platform --check-avd
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell getprop > runtime-platform/runtime-properties.txt
            adb shell getconf PAGE_SIZE > runtime-platform/runtime-pagesize.txt
            adb shell sha256sum /system/lib64/libndk_translation.so > runtime-platform/native-bridge-sha256.txt
            python3 repairs/infinity-only-performance-2103425/runtime/probe.py --apk runtime-signed/Infinity-2103426-Combined-Original-Signer.apk --out runtime-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Infinity-2103426-Focused-Android17-${{ github.run_id }}
          path: |
            runtime-platform/
            runtime-emulator-setup/
            runtime-results/
            repairs/infinity-only-performance-2103425/runtime/SCOPE.json
          retention-days: 90
          if-no-files-found: error
  performance-host:
    name: Selected Infinity performance source verification (host only)
    if: github.event_name == 'workflow_dispatch' && inputs.feature == 'infinity-performance-host'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AUTHORIZED_SCOPE: ${{ inputs.authorization }}
      BASELINE_BUILD: ${{ inputs.candidate_build }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.source_ref }}", fetch-depth: 0, persist-credentials: false, show-progress: false}
      - name: Admit this exact host correction and immutable baseline
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          scope=json.loads(Path('repairs/infinity-only-performance-2103425/SCOPE.json').read_text())
          assert os.environ['AUTHORIZED_SCOPE'].strip()
          assert os.environ['BASELINE_BUILD']=='40606707330'
          branch=subprocess.check_output(['git','branch','--show-current'],text=True).strip()
          assert branch==scope['branch']
          assert scope['owner']=='INFINITY' and scope['shutdown']=='NOT_RUN_FROZEN'
          baseline=scope['baseline_source']
          assert subprocess.check_output(['git','rev-parse','origin/lock/infinity-cobra-2103425-fold-approved-chooser-20261028'],text=True).strip()==baseline
          paths=subprocess.check_output(['git','diff','--name-only',baseline,'HEAD'],text=True).splitlines()
          assert all(p.startswith('repairs/infinity-only-performance-2103425/') or p=='.github/workflows/infinity-saved-navigation-android.yml' for p in paths)
          PY
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          run-id: 40606707330
          name: Infinity-Combined-Original-Signer-40606707330
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          run-id: 40606707330
          name: Infinity-Combined-Owner-Components-40606707330
          github-token: ${{ github.token }}
          path: baseline-components
      - name: Reverify baseline original signer; stage exact owned source generation
        run: |
          set -euo pipefail
          mkdir -p performance-results
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs baseline/Infinity-2103425-Combined-Original-Signer.apk > performance-results/BASELINE-SIGNATURE.txt
          python3 - <<'PY'
          from pathlib import Path
          raw=Path('performance-results/BASELINE-SIGNATURE.txt').read_text()
          assert 'Signer #1 certificate SHA-256 digest: d7adeb68e9341596a02bd3262b737a0f45fc6e771ed7e60285437e833b58c6d7' in raw
          assert 'Verified using v2 scheme (APK Signature Scheme v2): true' in raw
          PY
          python3 repairs/infinity-only-performance-2103425/stage.py --baseline baseline/Infinity-2103425-Combined-Original-Signer.apk --bundles baseline-components --out staged-performance
          cp staged-performance/PRESERVATION.json staged-performance/SIGNING-BLOCKERS.json performance-results/
      - name: Compare selected actual-source host behavior and allocations
        run: |
          set -euo pipefail
          python3 -m pip install PyYAML==6.0.2
          target=repairs/infinity-only-performance-2103425
          original=staged-performance/baseline-addons/script.infinity.commandcenter
          candidate=staged-performance/candidate-addons/script.infinity.commandcenter
          python3 "$target/verify.py" --root "$original" --baseline-root "$original" --phase baseline --out performance-results/BASELINE-HOST.json
          python3 "$target/verify.py" --root "$candidate" --baseline-root "$original" --phase candidate --out performance-results/CANDIDATE-HOST.json
          python3 "$target/test_edges.py" 2>&1 | tee performance-results/EDGE-CONTROLS.txt
      - name: Upload source inputs and truthful host-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-Performance-Source-Verification-${{ github.run_id }}
          path: |
            performance-results/
            staged-performance/candidate-addons/
            repairs/infinity-only-performance-2103425/SCOPE.json
          retention-days: 90
          if-no-files-found: error
  android17:
    if: inputs.feature != 'infinity-performance-host' && inputs.feature != 'infinity-performance-android'
    name: Selected feature ${{ inputs.feature || 'explicit baseline Search request' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      CANDIDATE_BUILD: ${{ inputs.candidate_build }}
      CANDIDATE_ARTIFACT: Infinity-Saved-Navigation-MultiImage-INTERNAL-QA-NOT-ACCEPTED
      AUTHORIZED_SCOPE: ${{ inputs.authorization }}
      SELECTED_CASE: ${{ inputs.feature }}
      FEATURE_PROBE: repairs/save-later-multiimage-20261023/android_feature_probe.py
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.source_ref || github.sha }}", fetch-depth: 0, persist-credentials: false, show-progress: false}
      - name: Validate explicitly requested 2103402 push scope
        if: github.event_name == 'push' && github.ref == 'refs/heads/work/infinity-2103402-final-stabilization-20261024'
        run: python3 repairs/infinity-2103402-final/android17/push_request.py
      - name: Validate explicitly requested signed407 final-scope reference
        if: github.event_name == 'push' && github.ref == 'refs/heads/work/infinity-final-corrective-from-2103407-20261025'
        run: python3 repairs/infinity-final-closure-2103407/android17_request.py
      - name: Require one explicitly authorized feature
        run: |
          python3 - <<'PYCODE'
          import os
          allowed={'saved-navigation','provider-pov','provider-umbrella','provider-seren','provider-future','multiimage','tracking-recovery','tracking-actions','tracking-continue','final-participant','final-continue','final-actions','final-pov','final-search-pov-enter','final-search-pov-button','final-search-all-enter'}
          assert os.environ['SELECTED_CASE'] in allowed, 'Select one feature explicitly'
          assert os.environ['AUTHORIZED_SCOPE'].strip(), 'Record the user-authorized feature scope'
          assert os.environ['CANDIDATE_BUILD'].isdigit(), 'Signed build run must be numeric'
          PYCODE
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.CANDIDATE_BUILD }}
          name: ${{ env.CANDIDATE_ARTIFACT }}
          github-token: ${{ github.token }}
          path: signed
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.7'}
      - name: Bind signed407 metadata to the existing feature probe without APK changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/work/infinity-final-corrective-from-2103407-20261025' && env.CANDIDATE_REQUEST_PATH == ''
        run: python3 repairs/infinity-final-closure-2103407/prepare_signed407_fixture.py signed
      - name: Recover physically tested signed408 for exact install-over feature verification
        if: env.CANDIDATE_REQUEST_PATH != ''
        uses: actions/download-artifact@v4
        with:
          run-id: 40277375964
          name: Infinity-2103408-Integrated-INTERNAL-NOT-FINAL-40277375964
          github-token: ${{ github.token }}
          path: baseline408
      - name: Bind integrated candidate metadata without changing APK or component bytes
        if: env.CANDIDATE_REQUEST_PATH != ''
        run: python3 repairs/infinity-final-closure-2103407/prepare_candidate_fixture.py signed baseline408
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools build-tools;34.0.0
          log-accepted-android-sdk-licenses: false
      - name: Verify signed identity, provider source pins, and API37 infrastructure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd signed && sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys
          sys.path.insert(0,'repairs/2103390-bugfixes/group7/finish92')
          import delivery92
          files=list(pathlib.Path('signed').glob('*.apk'));assert len(files)==1
          apk=files[0];digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          r=json.load(open('signed/CANDIDATE.json'))
          assert r['apk_sha256']==digest
          if os.environ['GITHUB_EVENT_NAME']=='push':
              request=json.load(open(os.environ.get('CANDIDATE_REQUEST_PATH') or os.environ.get('BASELINE_REQUEST_PATH','repairs/infinity-2103402-final/android17/REQUEST.json')))
              if request.get('kind')=='integrated-candidate':
                  assert digest==request['candidate_apk_sha256'] and r['source_commit']==request['candidate_source_commit'], 'Requested integrated candidate differs'
              else:
                  assert digest==request['baseline_apk_sha256'] and r['source_commit']==request['baseline_commit'], 'Requested locked baseline differs'
          run=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['CANDIDATE_BUILD']}"],text=True))
          assert run['head_sha']==r['source_commit'] and run['conclusion']=='success', 'Signed build/source mismatch'
          test_commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          delivery92.verify_signature(apk,pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/34.0.0')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('TEST_APK='+str(apk)+'\nTEST_APK_SHA='+digest+'\nCANDIDATE_SOURCE_COMMIT='+r['source_commit']+'\nTEST_SOURCE_COMMIT='+test_commit+'\n')
          PY
          if [[ "$SELECTED_CASE" == final-* ]]; then
            python3 repairs/save-later-multiimage-20261023/tracking/final-eight/android_selected.py inputs android-provider-inputs "$SELECTED_CASE"
          else
            python3 repairs/save-later-multiimage-20261023/android_inputs.py stage --out android-provider-inputs
          fi
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0
          if [[ "$SELECTED_CASE" == final-continue || "$SELECTED_CASE" == final-actions || "${FEATURE_STRESS:-}" == signed409-50-30-20 ]]; then
            sudo apt-get install -y ffmpeg
          fi
          python3 "${INFINITY_API37_GATE:-repairs/four-repair-20261018/android37_gate.py}" --sdk-root "$ANDROID_HOME" --out api37-support --pin-tools
          python3 - <<'PY'
          import pathlib,subprocess,sys
          for attempt in range(1,4):
              out=pathlib.Path('emulator-setup')/('attempt-'+str(attempt))
              code=subprocess.run([sys.executable,'repairs/android-checkpoint-shutdown/runtime-tests/prepare_android_emulator.py','--out',str(out)]).returncode
              if code==0:break
              logs='\n'.join(p.read_text(errors='replace') for p in out.glob('sdkmanager-attempt-*.log'))
              if attempt==3 or 'Error reading Zip content from a SeekableByteChannel' not in logs:raise SystemExit(code)
          PY
          sudo chmod 666 /dev/kvm
      - name: Execute only the selected feature; leave the app running
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ env.INFINITY_EMULATOR_API || '37.0' }}
          arch: x86_64
          target: ${{ env.INFINITY_EMULATOR_TARGET || 'google_apis' }}
          profile: pixel_2
          disk-size: 8G
          avd-name: infinity-four-repair-api37
          pre-emulator-launch-script: python3 "${INFINITY_API37_GATE:-repairs/four-repair-20261018/android37_gate.py}" --sdk-root "$ANDROID_HOME" --out api37-support --check-avd
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell getprop > api37-support/runtime-properties.txt
            adb shell getconf PAGE_SIZE > api37-support/runtime-pagesize.txt
            adb shell sha256sum /system/lib64/libndk_translation.so > api37-support/runtime-native-bridge-sha256.txt
            if [ "${INFINITY_PAGE_COMPAT:-}" = true ]; then python3 repairs/infinity-final-closure-2103407/api37_page_compat_setup.py --request "$CANDIDATE_REQUEST_PATH" --out api37-support/OS-PAGE-COMPAT.json; fi
            python3 "$FEATURE_PROBE" --apk "$TEST_APK" --expected-sha "$TEST_APK_SHA" --case "$SELECTED_CASE" --authorization "$AUTHORIZED_SCOPE" --out feature-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Infinity-Feature-${{ env.SELECTED_CASE }}-${{ github.run_id }}-Evidence
          path: |
            android17-request-evidence.json
            signed/FIXTURE-METADATA-EVIDENCE.json
            feature-results/
            api37-support/
            emulator-setup/
            android-provider-inputs/INPUTS.json
          retention-days: 90
          if-no-files-found: warn
