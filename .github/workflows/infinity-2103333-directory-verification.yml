name: Infinity | 2103333 install-over directory close verification
on:
  workflow_dispatch:
  push:
    branches: [repair/infinity-directory-verify-2103333]
    paths:
      - 'repairs/directory-verify-2103333/package.py'
      - '.github/workflows/infinity-2103333-directory-verification.yml'
permissions: {contents: read, actions: read}
concurrency: {group: infinity-2103333-directory-apk, cancel-in-progress: false}
env:
  NDK_VER: 21.4.7075529
  INFINITY_NATIVE_SOURCE_COMMIT: 16cb5ccebb2b85107132ca0a04a5e639208476e0
  INFINITY_NATIVE_RUN_ID: '37709784725'
jobs:
  repair-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 ndk;21.4.7075529'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 37687616440
          name: Infinity-2103327-Delivery-Evidence
          github-token: ${{ github.token }}
          path: parent3327
      - uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 37687616440
          name: Infinity-2103327-JobManager-Close-RC1-APK
          github-token: ${{ github.token }}
          path: base3327
      - uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 37711193442
          name: Infinity-2103330-Delivery-Evidence
          github-token: ${{ github.token }}
          path: parent3330
      - uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 37711193442
          name: Infinity-2103330-Directory-Close-RC1-APK
          github-token: ${{ github.token }}
          path: base3330
      - name: Verify 3330 source delta, 3330 signed APK provenance and monotonic 3333 install path
        run: |
          set -euo pipefail
          mkdir -p evidence3333
          python3 -m py_compile repairs/directory-close-2103330/*.py repairs/directory-verify-2103333/package.py
          python3 repairs/directory-verify-2103333/package.py --help > evidence3333/import-check.txt
          python3 - <<'PY'
          import hashlib,json,tarfile
          from pathlib import Path
          apk=Path('base3327/Infinity-2103327-JobManager-Close-RC1.apk')
          assert hashlib.sha256(apk.read_bytes()).hexdigest()=='02449fea9c76ad6a370f2ca26a88fdee3a681f83bdc3efa73f8e213f22d4c4d5'
          prior=json.load(open('parent3330/APK-VERIFICATION.json'))
          repaired=Path('base3330/Infinity-2103330-Directory-Close-RC1.apk')
          assert prior['candidate']==2103330 and prior['source_commit']=='58ea53584f1998ce9a7b94e331f028bdc0bc61bf'
          assert prior['native_source_commit']=='16cb5ccebb2b85107132ca0a04a5e639208476e0'
          assert prior['native_validation_run']=='37709784725'
          assert prior['validation_run']=='37711193442'
          assert hashlib.sha256(repaired.read_bytes()).hexdigest()==prior['apk_sha256']
          assert 2103333>2103332
          with tarfile.open('parent3327/repaired-shell-source.tar.gz') as archive:
              archive.extractall('host-parent',filter='data')
          PY
          python3 repairs/directory-close-2103330/test_source.py --source host-parent/shell-kodi --proof parent3327/SOURCE-PRESERVATION.json 2>&1 | tee evidence3333/android-source-tests.log
      - name: Require the exact successful repaired native run with no fallback
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test "$(gh api repos/${{ github.repository }}/actions/runs/$INFINITY_NATIVE_RUN_ID --jq .head_sha)" = "$INFINITY_NATIVE_SOURCE_COMMIT"
          gh run watch "$INFINITY_NATIVE_RUN_ID" --repo '${{ github.repository }}' --exit-status --interval 30
          gh api repos/${{ github.repository }}/actions/runs/$INFINITY_NATIVE_RUN_ID > evidence3333/native-run.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('evidence3333/native-run.json'))
          assert r['conclusion']=='success' and r['head_sha']==os.environ['INFINITY_NATIVE_SOURCE_COMMIT']
          PY
      - uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 37709784725
          name: Infinity-2103330-Directory-Native-Validation
          github-token: ${{ github.token }}
          path: native3330
      - name: Prepare preserved Android code at version 2103333 with exact passed native 3330
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          python3 repairs/directory-verify-2103333/package.py prepare --base base3327/Infinity-2103327-JobManager-Close-RC1.apk --build build3333 --out evidence3333 --engine native3330
      - name: Compile and test all 19 required regression suites
        env:
          KODI_ANDROID_KEY_ALIAS: androiddebugkey
          KODI_ANDROID_KEY_PASSWORD: android
          KODI_ANDROID_STORE_PASSWORD: android
        run: |
          set -euo pipefail
          export KODI_ANDROID_STORE_FILE="$HOME/.android/debug.keystore"
          python3 - <<'PY' 2>&1 | tee evidence3333/android-build.log
          import subprocess,sys
          sys.path.insert(0,'repairs/directory-verify-2103333')
          import package
          args=['./gradlew','--no-daemon','--console=plain',':xbmc:testReleaseUnitTest']
          for name in sorted(package.EXPECTED):args += ['--tests','com.projectinfinity.kodi.'+name]
          args += [':xbmc:assembleRelease',':xbmc:exportPreservationTools']
          subprocess.run(args,cwd='build3333',check=True)
          PY
      - name: Verify signer, all payloads, DEX, manifest, suites, exact 3330 native and APK parity
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 repairs/directory-verify-2103333/package.py package --base base3327/Infinity-2103327-JobManager-Close-RC1.apk --build build3333 --out evidence3333 --engine native3330
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103333-Directory-Close-Verification-RC1-APK
          path: evidence3333/Infinity-2103333-Directory-Close-Verification-RC1.apk
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - name: Prepare compact evidence
        if: success()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          out=Path('compact3333');out.mkdir()
          apk=Path('evidence3333/Infinity-2103333-Directory-Close-Verification-RC1.apk')
          (out/'DELIVERY.json').write_text(json.dumps({'file':apk.name,'size':apk.stat().st_size,'sha256':hashlib.sha256(apk.read_bytes()).hexdigest()},indent=2)+'\n')
          for p in Path('evidence3333').iterdir():
              if p.is_file() and p.suffix not in ('.apk','.so') and p.stat().st_size<24*1024*1024:shutil.copy2(p,out/p.name)
          (out/'PAIRING-NOTE.txt').write_text('APK 2103333: unchanged skin candidate 1.0.5.204. Approved rollback remains APK 2103327 with skin 1.0.5.201. Fold physical acceptance pending.\\n')
          PY
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103333-Delivery-Evidence
          path: compact3333/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103333-Verification
          path: |
            evidence3333/
            !evidence3333/*.apk
            !evidence3333/*.so
            build3333/xbmc/build/test-results/testReleaseUnitTest/
            build3333/xbmc/build/reports/tests/testReleaseUnitTest/
          compression-level: 1
          retention-days: 90
          if-no-files-found: warn
