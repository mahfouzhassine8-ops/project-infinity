name: Infinity | 2103338 join-target diagnostic APK
on:
  workflow_dispatch:
  push:
    branches: [diagnostic/infinity-join-target-2103338]
    paths:
      - 'repairs/join-target-2103338/**'
      - '.github/workflows/infinity-2103338-join-target.yml'
permissions: {contents: read, actions: read}
concurrency: {group: infinity-2103338-join-target, cancel-in-progress: false}
env:
  NDK_VER: 21.4.7075529
jobs:
  diagnostic-host-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: {python-version: '3.11.7'}
      - name: Run prepared diagnostic preservation and real-thread tests
        run: |
          set -euo pipefail
          mkdir -p diagnostic-host
          python3 repairs/join-target-2103338/test_integration.py
          python3 repairs/join-target-2103338/diagnostic/run_tests.py --out "$GITHUB_WORKSPACE/diagnostic-host/HOST-TEST-RESULTS.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103338-Diagnostic-Host-Tests
          path: diagnostic-host/
          retention-days: 90
          if-no-files-found: error
  android-shell:
    needs: diagnostic-host-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 ndk;21.4.7075529'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v8
        with:
          run-id: 37735801149
          name: Infinity-2103335-Delivery-Evidence
          github-token: ${{ github.token }}
          path: checkpoint-parent
      - uses: actions/download-artifact@v8
        with:
          run-id: 37735801149
          name: Infinity-2103335-Native-Trace-Bridge-RC1-APK
          github-token: ${{ github.token }}
          path: checkpoint-base
      - name: Stage the verified Android shell with diagnostic candidate version
        run: |
          set -euo pipefail
          mkdir -p checkpoint-source checkpoint-android "$HOME/.android"
          tar --no-same-owner -xzf checkpoint-parent/repaired-shell-source.tar.gz -C checkpoint-source
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Compile Only,O=Android,C=US'
          python3 repairs/android-checkpoint-shutdown/test_android_assets.py --base checkpoint-base/Infinity-2103335-Native-Trace-Bridge-RC1.apk
          python3 repairs/join-target-2103338/package.py stage --engine join-build --source checkpoint-source/shell-kodi --base checkpoint-base/Infinity-2103335-Native-Trace-Bridge-RC1.apk --build checkpoint-shell-build --out checkpoint-android
      - name: Compile Android and run the inherited native-trace exporter regression
        env:
          KODI_ANDROID_KEY_ALIAS: androiddebugkey
          KODI_ANDROID_KEY_PASSWORD: android
          KODI_ANDROID_STORE_PASSWORD: android
          KODI_ANDROID_STORE_FILE: /home/runner/.android/debug.keystore
        run: |
          set -euo pipefail
          ./checkpoint-shell-build/gradlew --no-daemon --console=plain -p checkpoint-shell-build :xbmc:testReleaseUnitTest :xbmc:assembleRelease 2>&1 | tee checkpoint-android/compile.log
          python3 repairs/android-checkpoint-shutdown/runtime_delta.py verify --group android --source checkpoint-source/shell-kodi
          tar -czf checkpoint-android/runtime-shell-source.tar.gz -C checkpoint-source shell-kodi
          cp -r checkpoint-shell-build/xbmc/build/test-results/testReleaseUnitTest checkpoint-android/unit-test-results
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103338-Android-Donor-Internal
          path: checkpoint-shell-build/xbmc/build/outputs/apk/release/xbmc-release.apk
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103338-Android-Validation
          path: checkpoint-android/
          retention-days: 90
          if-no-files-found: error
  native-engine:
    needs: diagnostic-host-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    env:
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            android-tools/INFINITY-DEPENDENCIES-COMPLETE.json
            ~/.ccache
          key: infinity-join-target-3338-deps-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            infinity-checkpoint-3334-deps-${{ runner.os }}-37771220035
            infinity-checkpoint-3334-deps-${{ runner.os }}-
            infinity-python-exit-3334-arm64-${{ runner.os }}-37724566406
      - name: Reconstruct the verified parent and apply the hash-gated diagnostic delta
        run: |
          set -euo pipefail
          mkdir -p join-build
          sudo apt-get update -qq
          sudo apt-get install -y python3-yaml python3-dev libsqlite3-dev
          python3 repairs/join-target-2103338/native_ci.py prepare 2>&1 | tee join-build/prepare.log
      - name: Rebuild ARM64 and verify the protected source map and diagnostic engine identity
        run: |
          set -euo pipefail
          if python3 repairs/join-target-2103338/native_ci.py verify-dependencies; then
            python3 repairs/join-target-2103338/native_ci.py compile --completed-cache 2>&1 | tee join-build/compile.log
          else
            python3 repairs/join-target-2103338/native_ci.py compile 2>&1 | tee join-build/compile.log
          fi
      - uses: actions/cache/save@v4
        if: always() && !cancelled()
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            android-tools/INFINITY-DEPENDENCIES-COMPLETE.json
            ~/.ccache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103338-Native-Internal
          path: |
            join-build/libkodi.so
            join-build/ENGINE-PROOF.json
            join-build/SOURCE-MANIFEST.json
            join-build/elf-identity.txt
          compression-level: 1
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103338-Native-Validation
          path: |
            join-build/
            !join-build/libkodi.so
          compression-level: 1
          retention-days: 90
          if-no-files-found: error
  package-diagnostic-apk:
    needs: [android-shell, native-engine]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: '${{ github.sha }}'}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 ndk;21.4.7075529'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v8
        with:
          run-id: 37735801149
          name: Infinity-2103335-Native-Trace-Bridge-RC1-APK
          github-token: ${{ github.token }}
          path: base
      - uses: actions/download-artifact@v8
        with:
          run-id: 37829134564
          name: Infinity-2103337-Checkpoint-Installed-Fix-RC1-APK
          github-token: ${{ github.token }}
          path: previous-apk
      - uses: actions/download-artifact@v8
        with:
          run-id: 37829134564
          name: Infinity-2103337-Checkpoint-Test-Evidence
          github-token: ${{ github.token }}
          path: previous-evidence
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.run_id }}
          name: Infinity-2103338-Native-Internal
          github-token: ${{ github.token }}
          path: engine
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.run_id }}
          name: Infinity-2103338-Android-Donor-Internal
          github-token: ${{ github.token }}
          path: shell/xbmc/build/outputs/apk/release
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.run_id }}
          name: Infinity-2103338-Android-Validation
          github-token: ${{ github.token }}
          path: evidence
      - name: Package and verify the engine, preserved 2103337 payload and permanent signer
        env:
          INFINITY_NATIVE_RUN_ID: ${{ github.run_id }}
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 tools/checkpoint-apk/test_package.py
          mkdir -p source
          tar --no-same-owner -xzf evidence/runtime-shell-source.tar.gz -C source
          python3 repairs/join-target-2103338/package.py package --source source/shell-kodi --base base/Infinity-2103335-Native-Trace-Bridge-RC1.apk --build shell --out evidence --engine engine --previous-apk previous-apk/Infinity-2103337-Checkpoint-Installed-Fix-RC1.apk --previous-receipt previous-evidence
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103338-Join-Target-Diagnostic-RC1-APK
          path: evidence/Infinity-2103338-Join-Target-Diagnostic-RC1.apk
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103338-Delivery-Evidence
          path: |
            evidence/
            !evidence/*.apk
            !evidence/*.so
          retention-days: 90
          if-no-files-found: error
