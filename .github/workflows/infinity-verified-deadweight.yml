name: Infinity | Verified dead-weight candidate 2103374
on:
  push:
    branches: [work/infinity-verified-deadweight-2103374]
    paths: ['.github/workflows/infinity-verified-deadweight.yml', 'repairs/verified-deadweight-2103374/**']
permissions: {contents: read, actions: read}
concurrency:
  group: infinity-verified-deadweight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-and-package:
    if: github.ref == 'refs/heads/work/infinity-verified-deadweight-2103374'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      NDK_VER: 21.4.7075529
      KODI_ANDROID_KEY_ALIAS: androiddebugkey
      KODI_ANDROID_KEY_PASSWORD: android
      KODI_ANDROID_STORE_PASSWORD: android
      KODI_ANDROID_STORE_FILE: /home/runner/.android/debug.keystore
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-${{ runner.os }}-21.4.7075529-v1
      - name: Verify existing pinned toolchain
        run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - uses: actions/download-artifact@v8
        with:
          run-id: 38232872153
          name: Cobra-2103373-Targeted-Isolation-Evidence
          github-token: ${{ github.token }}
          path: locked-evidence
      - uses: actions/download-artifact@v8
        with:
          run-id: 38232872153
          name: Cobra-2103373-Targeted-Isolation-Signed-Test-APK
          github-token: ${{ github.token }}
          path: locked-apk
      - name: Stage exact locked source and only eight reviewed removals
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" cleanup-evidence
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Compile Only,O=Android,C=US'
          fi
          python3 repairs/verified-deadweight-2103374/gate.py prepare --parent locked-evidence --base locked-apk/Cobra-2103373-Targeted-Isolation-RC1.apk --build cleanup-build --out cleanup-evidence
      - name: Run all 206 unchanged cases plus compiled-helper absence case
        run: |
          set -euo pipefail
          ./cleanup-build/gradlew --no-daemon --console=plain -p cleanup-build :xbmc:testReleaseUnitTest :xbmc:exportPreservationTools 2>&1 | tee cleanup-evidence/test.log
      - name: Require every inherited case and exact surviving source members
        if: success()
        run: python3 repairs/verified-deadweight-2103374/gate.py review --parent locked-evidence --base locked-apk/Cobra-2103373-Targeted-Isolation-RC1.apk --build cleanup-build --out cleanup-evidence
      - name: Assemble Android donor only; retain locked native engine and assets
        if: success()
        run: ./cleanup-build/gradlew --no-daemon --console=plain -p cleanup-build :xbmc:assembleRelease
      - name: Prove compiled preservation and permanently sign test candidate
        if: success()
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: python3 repairs/verified-deadweight-2103374/gate.py package --parent locked-evidence --base locked-apk/Cobra-2103373-Targeted-Isolation-RC1.apk --build cleanup-build --out cleanup-evidence
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Cobra-2103374-Verified-Deadweight-Signed-Test-APK
          path: cleanup-evidence/Cobra-2103374-Verified-Deadweight-RC1.apk
          if-no-files-found: error
          retention-days: 90
      - name: Preserve source, test and failure evidence
        if: always()
        run: |
          mkdir -p cleanup-evidence
          if [ -d cleanup-evidence/source ]; then tar -czf cleanup-evidence/runtime-source.tar.gz -C cleanup-evidence source; fi
          if [ -d cleanup-build/xbmc/src/test ]; then tar -czf cleanup-evidence/test-source.tar.gz -C cleanup-build/xbmc/src test; fi
          cp repairs/verified-deadweight-2103374/*.py repairs/verified-deadweight-2103374/*.json cleanup-evidence/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Cobra-2103374-Verified-Deadweight-Evidence
          path: |
            cleanup-evidence/*.json
            cleanup-evidence/*.txt
            cleanup-evidence/*.log
            cleanup-evidence/*.patch
            cleanup-evidence/*.py
            cleanup-evidence/*.tar.gz
            cleanup-evidence/compiler-differences/
            cleanup-evidence/runtime/
            cleanup-evidence/screenshots/
            cleanup-build/xbmc/build/test-results/testReleaseUnitTest/
          if-no-files-found: error
          retention-days: 90
