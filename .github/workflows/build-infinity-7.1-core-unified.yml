name: Infinity 7.1 Core Unified Candidate B

on:
  workflow_dispatch:
  push:
    branches:
      - infinity-7.1-core-unified
    paths:
      - '.github/workflows/build-infinity-7.1-core-unified.yml'
      - 'scripts/patch-infinity-7.1-native-fold.py'
      - 'scripts/patch-infinity-7.1-conjoined-pip.py'
      - 'scripts/patch-infinity-tablet-7.0.py'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    env:
      KODI_TAG: 21.3-Omega
      KODI_SHA: a3a448d26b8d560a65655dab2cd122994dc4e146
      NDK_VER: 21.4.7075529
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install host dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf bison build-essential curl flex gawk git gperf lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev unzip zip zlib1g-dev ccache python3 nasm yasm librsvg2-bin
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;33.0.1" "build-tools;34.0.0" "ndk;${NDK_VER}"
          curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

      - name: Clone exact Kodi 21.3 source
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "${KODI_TAG}" https://github.com/xbmc/xbmc.git kodi
          ACTUAL=$(git -C kodi rev-parse HEAD)
          test "$ACTUAL" = "${KODI_SHA}"

      - name: Apply Infinity 7.1 native Fold synchronization
        run: |
          set -euxo pipefail
          python3 scripts/patch-infinity-7.1-native-fold.py
          grep -q 'InfinitySyncDisplayState' kodi/xbmc/platform/android/activity/XBMCApp.cpp
          grep -q 'winSystemAndroid->UpdateDisplayModes' kodi/xbmc/platform/android/activity/XBMCApp.cpp
          grep -q 'm_displayChangeEvent.Set' kodi/xbmc/platform/android/activity/XBMCApp.cpp
          grep -q 'm_inputHandler.setDPI' kodi/xbmc/platform/android/activity/XBMCApp.cpp

      - name: Cache Kodi depends
        uses: actions/cache@v4
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            ~/.ccache
          key: infinity-7.1-kodi-21.3-arm64-${{ runner.os }}-${{ hashFiles('scripts/patch-infinity-7.1-native-fold.py') }}
          restore-keys: |
            infinity-7.1-kodi-21.3-arm64-${{ runner.os }}-

      - name: Configure and build Kodi 21.3 native core
        run: |
          set -euxo pipefail
          mkdir -p "${TARBALLS}" "${DEPENDS}" "${BUILD_DIR}"
          cd kodi/tools/depends
          ./bootstrap
          ./configure \
            --with-tarballs="${TARBALLS}" \
            --host=aarch64-linux-android \
            --with-sdk-path="${ANDROID_HOME}" \
            --with-ndk-path="${ANDROID_HOME}/ndk/${NDK_VER}" \
            --prefix="${DEPENDS}" \
            --enable-debug=yes
          make -j"$(nproc)"
          make -C target/cmakebuildsys BUILD_DIR="${BUILD_DIR}"
          make -C "${BUILD_DIR}" -j"$(nproc)"
          CORE=$(find "${BUILD_DIR}" kodi -type f -name 'libkodi.so' | head -1)
          test -n "$CORE"
          cp "$CORE" /tmp/libkodi-7.1.so
          sha256sum /tmp/libkodi-7.1.so | tee /tmp/libkodi-7.1.sha256

      - name: Download proven 7.0 body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -fsSL -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9987818547/zip" \
            -o /tmp/base.zip
          mkdir -p /tmp/base-art
          unzip -q /tmp/base.zip -d /tmp/base-art
          APK=$(find /tmp/base-art -name '*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" /tmp/base.apk

      - name: Decode 7.0 and preserve working lock
        run: |
          set -euxo pipefail
          java -jar /tmp/apktool.jar d -f /tmp/base.apk -o /tmp/target
          python3 scripts/patch-infinity-tablet-7.0.py
          SKIN=/tmp/target/assets/addons/skin.estuary
          mkdir -p "$SKIN/media/osd/fullscreen/buttons"
          printf '%s' '<svg xmlns="http://www.w3.org/2000/svg" width="74" height="74" viewBox="0 0 74 74"><rect x="14" y="31" width="46" height="35" rx="7" fill="white"/><path d="M24 31V22c0-8 5-14 13-14s13 6 13 14v9" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/><circle cx="37" cy="47" r="4" fill="#000000"/><rect x="35" y="47" width="4" height="10" rx="2" fill="#000000"/></svg>' > /tmp/lock.svg
          printf '%s' '<svg xmlns="http://www.w3.org/2000/svg" width="74" height="74" viewBox="0 0 74 74"><rect x="14" y="31" width="46" height="35" rx="7" fill="white"/><path d="M24 31V22c0-8 5-14 13-14 6 0 11 3 13 8" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/><circle cx="37" cy="47" r="4" fill="#000000"/><rect x="35" y="47" width="4" height="10" rx="2" fill="#000000"/></svg>' > /tmp/unlock.svg
          rsvg-convert -w 74 -h 74 /tmp/lock.svg -o "$SKIN/media/osd/fullscreen/buttons/infinity-lock.png"
          rsvg-convert -w 74 -h 74 /tmp/unlock.svg -o "$SKIN/media/osd/fullscreen/buttons/infinity-unlock.png"

      - name: Apply proven Standalone-style PiP outside core
        run: python3 scripts/patch-infinity-7.1-conjoined-pip.py

      - name: Remove known crashing theme experiment for stabilization
        run: |
          set -euxo pipefail
          rm -f '/tmp/target/assets/addons/skin.estuary/colors/Infinity OLED.xml'
          rm -f '/tmp/target/assets/addons/skin.estuary/colors/Infinity Light.xml'

      - name: Inject rebuilt Kodi 21.3 Infinity core
        run: |
          set -euxo pipefail
          test -d /tmp/target/lib/arm64-v8a
          cp /tmp/libkodi-7.1.so /tmp/target/lib/arm64-v8a/libkodi.so
          sha256sum /tmp/target/lib/arm64-v8a/libkodi.so > /tmp/injected.sha256
          cmp /tmp/libkodi-7.1.sha256 /tmp/injected.sha256 || true

      - name: Verify uniform boundaries before packaging
        run: |
          set -euxo pipefail
          MAIN=$(find /tmp/target -path '*/com/projectinfinity/kodi/Main.smali' | head -1)
          BRIDGE=$(find /tmp/target -path '*/com/projectinfinity/kodi/InfinityCoreBridge.smali' | head -1)
          test -n "$MAIN"
          test -n "$BRIDGE"
          grep -q 'id="7999"' /tmp/target/assets/addons/skin.estuary/xml/VideoOSD.xml
          grep -q 'setAutoEnterEnabled' "$BRIDGE"
          grep -q 'onUserLeaveHint()V' "$MAIN"
          grep -q 'android:supportsPictureInPicture="true"' /tmp/target/AndroidManifest.xml
          grep -q 'android:resizeableActivity="true"' /tmp/target/AndroidManifest.xml
          ! test -f '/tmp/target/assets/addons/skin.estuary/colors/Infinity OLED.xml'
          ! test -f '/tmp/target/assets/addons/skin.estuary/colors/Infinity Light.xml'

      - name: Rebuild APK
        run: java -jar /tmp/apktool.jar b /tmp/target -o /tmp/Infinity-7.1-Core-Unified-unsigned.apk

      - name: Align sign and verify
        env:
          PASS: infinity${{ github.run_id }}${{ github.run_attempt }}
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          keytool -genkeypair -keystore /tmp/infinity.keystore -alias infinity -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Infinity 7.1 Core Unified, O=Project Infinity, C=US" >/dev/null 2>&1
          "$BT/zipalign" -f 4 /tmp/Infinity-7.1-Core-Unified-unsigned.apk /tmp/Infinity-7.1-Core-Unified-aligned.apk
          "$BT/apksigner" sign --ks /tmp/infinity.keystore --ks-key-alias infinity --ks-pass env:PASS --key-pass env:PASS --out /tmp/Infinity-7.1-Core-Unified.apk /tmp/Infinity-7.1-Core-Unified-aligned.apk
          "$BT/apksigner" verify --verbose /tmp/Infinity-7.1-Core-Unified.apk
          unzip -p /tmp/Infinity-7.1-Core-Unified.apk lib/arm64-v8a/libkodi.so | sha256sum > /tmp/final-core.sha256
          sha256sum /tmp/Infinity-7.1-Core-Unified.apk > /tmp/Infinity-7.1-Core-Unified.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-7.1-Core-Unified-Candidate-B
          path: |
            /tmp/Infinity-7.1-Core-Unified.apk
            /tmp/Infinity-7.1-Core-Unified.sha256
            /tmp/final-core.sha256
          retention-days: 30
