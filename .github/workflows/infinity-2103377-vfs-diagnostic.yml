name: Infinity | 2103377 VFS diagnostic evidence build
on:
  push:
    branches: [work/infinity-2103377-close-recents-preservation]
    paths:
      - 'repairs/shutdown-vfs-trace-2103377/**'
      - '.github/workflows/infinity-2103377-vfs-diagnostic.yml'
permissions: {contents: read, actions: read}
concurrency: {group: infinity-2103377-vfs-diagnostic, cancel-in-progress: true}
env:
  NDK_VER: 21.4.7075529
jobs:
  native-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    env:
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-${{ runner.os }}-21.4.7075529-v1
      - run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - uses: actions/download-artifact@v8
        with:
          run-id: 38132105717
          name: Infinity-2103367-Verified-Compiler-Dependencies
          github-token: ${{ github.token }}
          path: dependency-transfer
      - uses: actions/download-artifact@v8
        with:
          run-id: 38246713743
          name: Cobra-2103374-Verified-Deadweight-Signed-Test-APK
          github-token: ${{ github.token }}
          path: locked-parent
      - uses: actions/download-artifact@v8
        with:
          run-id: 38270097041
          name: Cobra-2103375-File-Preview-Native-Signed-Test-APK
          github-token: ${{ github.token }}
          path: previous-candidate
      - uses: actions/download-artifact@v8
        with:
          run-id: 38321848412
          name: Cobra-2103376-Critical-Preview-Native-Evidence
          github-token: ${{ github.token }}
          path: locked-native-evidence
      - uses: actions/download-artifact@v8
        with:
          run-id: 38323908660
          name: Cobra-2103376-Critical-Preview-Signed-Test-APK
          github-token: ${{ github.token }}
          path: protected-2103376-apk
      - name: Restore verified compiler dependencies
        run: |
          set -euo pipefail
          (cd dependency-transfer && sha256sum -c SHA256SUMS)
          tar --no-same-owner -xf dependency-transfer/verified-android-dependencies.tar
          tar --no-same-owner -xf dependency-transfer/verified-compiler-cache.tar -C "$HOME"
          python3 repairs/android-checkpoint-shutdown/native_ci.py verify-dependencies
          sudo apt-get update -qq
          sudo apt-get install -y python3-yaml python3-dev libsqlite3-dev libssl-dev
      - name: Preserve green inputs and verify observation-only tracing
        run: |
          set -euo pipefail
          mkdir -p checkpoint-build
          python3 repairs/shutdown-vfs-trace-2103377/native_ci.py prepare --locked locked-parent/Cobra-2103374-Verified-Deadweight-RC1.apk --previous previous-candidate/Cobra-2103375-File-Preview-Native-RC1.apk --parent-proof locked-native-evidence 2>&1 | tee checkpoint-build/prepare-vfs-trace.log
      - name: Compile complete native engine with VFS trace
        run: |
          set -euo pipefail
          python3 repairs/shutdown-vfs-trace-2103377/native_ci.py compile 2>&1 | tee checkpoint-build/compile-vfs-trace.log
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103377-VFS-Diagnostic-Native-Internal
          path: checkpoint-build/libkodi.so
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
      - name: Sign explicit diagnostic while preserving all locked Java and feature payloads
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          python3 repairs/shutdown-vfs-trace-2103377/package_diagnostic.py --parent protected-2103376-apk/Cobra-2103376-Critical-Preview-RC1.apk --engine checkpoint-build/libkodi.so --evidence checkpoint-build --out vfs-diagnostic-package
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103377-VFS-Diagnostic-Signed-APK
          path: |
            vfs-diagnostic-package/Infinity-2103377-VFS-Diagnostic-RC1.apk
            vfs-diagnostic-package/SCOPE.txt
          retention-days: 90
          if-no-files-found: error
      - name: Preserve diagnostic receipts and exact resume point
        if: always()
        run: |
          mkdir -p checkpoint-build vfs-diagnostic-package
          git rev-parse HEAD > checkpoint-build/VFS-TRACE-COMMIT.txt
          printf '%s\n' 'DIAGNOSTIC EVIDENCE ONLY. SHUTDOWN CORRECTION UNRESOLVED. ORIGINAL APK/SKIN LOCKS UNCHANGED. SAVED 274-TEST CANDIDATE PRESERVED; THIS DIAGNOSTIC USES LOCKED 2103376 JAVA. NO PROMOTION OR DEVICE ACCEPTANCE.' > checkpoint-build/VFS-TRACE-SCOPE.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103377-VFS-Diagnostic-Evidence
          path: |
            checkpoint-build/
            !checkpoint-build/libkodi.so
            vfs-diagnostic-package/*.json
            vfs-diagnostic-package/*.txt
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
