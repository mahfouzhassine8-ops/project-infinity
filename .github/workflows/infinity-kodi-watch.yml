name: Infinity | Kodi Update Watcher
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: infinity-kodi-upstream-watcher
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      tag: ${{ steps.check.outputs.tag }}
      target_sha: ${{ steps.check.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check official Kodi source tags
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 upstream/watch.py check
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: kodi-update-check
          path: watch-output/
          if-no-files-found: error
          retention-days: 30

  dedupe-analysis:
    needs: check
    if: needs.check.outputs.has_update == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cache_hit: ${{ steps.seen.outputs.cache-hit }}
    steps:
      - name: Check whether this exact Kodi tag and commit was already analyzed
        id: seen
        uses: actions/cache/restore@v4
        with:
          path: .kodi-analysis-marker
          key: infinity-kodi-smart-analysis-${{ needs.check.outputs.tag }}-${{ needs.check.outputs.target_sha }}
          lookup-only: true

  source-analysis:
    needs: [check, dedupe-analysis]
    if: needs.check.outputs.has_update == 'true' && needs.dedupe-analysis.outputs.cache_hit != 'true'
    uses: ./.github/workflows/infinity-kodi-analyze.yml
    with:
      target_tag: ${{ needs.check.outputs.tag }}
      target_sha: ${{ needs.check.outputs.target_sha }}
    permissions:
      contents: read

  report:
    needs: [check, dedupe-analysis, source-analysis]
    if: always() && needs.check.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HAS_UPDATE: ${{ needs.check.outputs.has_update }}
      TARGET_TAG: ${{ needs.check.outputs.tag }}
      TARGET_SHA: ${{ needs.check.outputs.target_sha }}
      CACHE_HIT: ${{ needs.dedupe-analysis.outputs.cache_hit }}
      ANALYSIS_RESULT: ${{ needs.source-analysis.result }}
    steps:
      - name: Write simple System Tray status payload and workflow summary
        run: |
          mkdir -p kodi-status
          python3 - <<'PY'
          import json, os, re
          has_update=os.environ.get('HAS_UPDATE') == 'true'
          cache_hit=os.environ.get('CACHE_HIT') == 'true'
          analysis=os.environ.get('ANALYSIS_RESULT','')
          target=os.environ.get('TARGET_TAG','')
          sha=os.environ.get('TARGET_SHA','')

          if not has_update:
              state='up_to_date'
              summary='Kodi 21.3-Omega is still the latest stable source tracked by Infinity.'
              action='No action needed'
              export_available=False
          elif cache_hit:
              state='already_analyzed'
              summary=f'{target} was already downloaded, compared and analyzed.'
              action='View latest analysis'
              export_available=True
          elif analysis == 'success':
              state='analysis_ready'
              summary=f'{target} was downloaded, compared and fast-validated. No Infinity APK was built.'
              action='View analysis'
              export_available=True
          else:
              state='analysis_blocked'
              summary=f'{target} was detected, but fast source analysis needs review.'
              action='Review analysis'
              export_available=bool(target)

          safe_tag=re.sub(r'[^A-Za-z0-9._-]','_',target) if target else ''
          export_name=f'Infinity-Kodi-{safe_tag}-Analysis-Report.zip' if safe_tag else ''
          payload={
              'schema':1,
              'title':'Kodi Update',
              'state':state,
              'current_version':'21.3-Omega',
              'available_version':target or '21.3-Omega',
              'target_commit':sha,
              'summary':summary,
              'action_label':action,
              'export_available':export_available,
              'export_action_label':'Export Analysis ZIP' if export_available else '',
              'export_default_filename':export_name,
              'save_destination':'user_selected' if export_available else 'not_applicable',
              'automatic_full_build':False,
              'production_modified':False,
          }
          with open('kodi-status/system-tray-status.json','w',encoding='utf-8') as f:
              json.dump(payload,f,indent=2)
              f.write('\n')

          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as s:
              s.write('## Kodi Update\n\n')
              s.write(f"**Status:** {state}\n\n{summary}\n\n")
              if export_available:
                  s.write(f"**Portable report:** `{export_name}`\n\n")
              s.write('**Full Infinity APK build:** not started.\n')
          PY
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: kodi-system-tray-status
          path: kodi-status/system-tray-status.json
          if-no-files-found: error
          retention-days: 30
