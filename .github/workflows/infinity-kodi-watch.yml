name: Infinity | Kodi Update Watcher
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: infinity-kodi-upstream-watcher
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      tag: ${{ steps.check.outputs.tag }}
      target_sha: ${{ steps.check.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check official Kodi source tags
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 upstream/watch.py check
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: kodi-update-check
          path: watch-output/
          if-no-files-found: error
          retention-days: 30

  report:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Write simple update status
        env:
          HAS_UPDATE: ${{ needs.check.outputs.has_update }}
          TARGET_TAG: ${{ needs.check.outputs.tag }}
          TARGET_SHA: ${{ needs.check.outputs.target_sha }}
        run: |
          if [ "$HAS_UPDATE" = "true" ]; then
            {
              echo '## Kodi update available'
              echo
              echo "**Infinity baseline:** Kodi 21.3-Omega"
              echo "**Latest detected:** $TARGET_TAG"
              echo "**Target commit:** \`$TARGET_SHA\`"
              echo
              echo '**Action:** review/analyze when we choose. No APK build was started.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '## Kodi is up to date'
              echo
              echo '**Infinity baseline:** Kodi 21.3-Omega'
              echo '**Update available:** No'
              echo
              echo 'No APK build was started.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
