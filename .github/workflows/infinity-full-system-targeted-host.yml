name: Infinity | Essential-First Save Protection - SOURCE ONLY (not APK acceptance)
on:
  # Every feature commit on the active repair branch gets a shutdown contract
  # check; no stock Kodi result or local-source green is promoted to a release.
  push:
    branches: [work/infinity-full-repair-20261017-gpt6]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  protected-writes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - name: Compile real native durability implementation, fail closed for essential files
        run: |
          set -euo pipefail
          g++ -std=c++17 -pthread -Wall -Wextra -Werror \
            -Irepairs/essential-first-2103377/runtime/xbmc/platform/android/activity \
            repairs/full-system-20261017/test_installer_stage_durability.cpp \
            -o /tmp/infinity-stage-durability-test
          /tmp/infinity-stage-durability-test
      - name: Guard exact TEST4 source against future independent shutdown overlay leaks
        run: python3 -m unittest discover -s repairs/full-system-20261017 -p 'test_shutdown_source_lineage.py' -v
      - name: Check THE CREW and all optional / protected write error boundaries (native C++ plus 11 negative controls)
        run: python3 repairs/full-system-20261017/test_write_error_scope.py
      - name: Compile real Infinity optional-writer error attribution and essential fail-closed cases
        run: |
          set -euo pipefail
          python3 -m py_compile repairs/full-system-20261017/optional_writer_provenance_patch.py repairs/full-system-20261017/test_optional_writer_provenance.py
          python3 repairs/full-system-20261017/test_optional_writer_provenance.py
      - name: Preflight FAST 2103384 APK signing code (no native rebuild)
        run: |
          set -euo pipefail
          python3 -m py_compile repairs/full-system-20261017/package_2103384_vfs.py repairs/full-system-20261017/package_write_integrity_2103384.py
          python3 - <<'PY'
          import importlib.util
          for stem in ('package_2103384_vfs','package_write_integrity_2103384'):
              path=f'repairs/full-system-20261017/{stem}.py'
              spec=importlib.util.spec_from_file_location(stem,path)
              candidate=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(candidate)
              assert candidate.CODE==2103384 and candidate.PARENT_CODE==2103383
              assert len(candidate.NAME)==len(candidate.PARENT_NAME)
          PY
      - name: Verify FULL skin/Rails package rejection and no Kodi substitution
        run: python3 -m unittest discover -s repairs/full-system-20261017 -p 'test_infinity_full_stack_assets.py' -v
      - name: Syntax-compile exact full-stack setup and real-APK emulator runner
        run: python3 -m py_compile repairs/full-system-20261017/infinity_full_stack_assets.py repairs/full-system-20261017/infinity_full_stack_android.py repairs/full-system-20261017/infinity_full_stack_close.py repairs/full-system-20261017/infinity_official_skin_dependencies.py
      - name: Verify real Infinity Essential-First Close receipts reject generic Kodi and incomplete saves
        run: python3 -m unittest discover -s repairs/full-system-20261017 -p 'test_infinity_full_stack_close.py' -v
      - name: Verify strict Rotate restoration source and invariants
        run: |
          python3 repairs/full-system-20261017/test_player_rotate_source.py
          python3 -m py_compile repairs/full-system-20261017/player_rotate_226.py
