name: Infinity500 focused Cast discovery | CI component only
on:
  push:
    branches: [work/infinity-2103500-consolidated-repair-20261115]
    paths: [repairs/infinity-consolidated-2103500-20261115/CI-DISCOVERY.json]
permissions: {contents: read, actions: read}
concurrency:
  group: infinity500-discovery
  cancel-in-progress: false
jobs:
  discovery:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - name: Require authenticated500 preimages and scoped production changes
        run: python repairs/infinity-consolidated-2103500-20261115/verify_scope.py > SOURCE-SCOPE.json
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools build-tools;35.0.0 platforms;android-34', log-accepted-android-sdk-licenses: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '14128448982', run-id: '43632329510', merge-multiple: true, github-token: '${{ github.token }}', path: signed500}
      - name: Compile only existing Cast component against exact signed500
        run: |
          set -euo pipefail
          task=repairs/infinity-consolidated-2103500-20261115
          cast=repairs/infinity-movies-continue-cast-2103486-20261112/cast
          mkdir -p cast-sdk-work/tools
          ln -s "$ANDROID_HOME/platforms/android-34/android.jar" cast-sdk-work/tools/android.jar
          ln -s "$ANDROID_HOME/build-tools/35.0.0/aapt2" cast-sdk-work/tools/aapt2
          ln -s "$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar" cast-sdk-work/tools/d8.jar
          ln -s "$ANDROID_HOME/build-tools/35.0.0/core-lambda-stubs.jar" cast-sdk-work/tools/core-lambda-stubs.jar
          python "$cast/resolve_sdk.py" cast-sdk-work/maven
          python "$task/build_discovery.py" component cast-sdk-work signed500/Infinity-2103500-Combined-Original-Signer.apk
          python "$task/build_discovery.py" probe cast-sdk-work signed500/Infinity-2103500-Combined-Original-Signer.apk
      - name: Disposable CI-only package and test key; never an Infinity installer
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 cast-sdk-work/probe/CI-ONLY-UNSIGNED-NOT-OWNER-INSTALLER.apk cast-sdk-work/probe/aligned.apk
          keytool -genkeypair -keystore cast-sdk-work/probe/component-ci-only.jks -storepass component-ci-only -keypass component-ci-only -alias component -dname 'CN=Disposable Cast Component CI' -keyalg RSA -keysize 2048 -validity 2 -noprompt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks cast-sdk-work/probe/component-ci-only.jks --ks-pass pass:component-ci-only --out cast-sdk-work/probe/CI-ONLY-OTHER-PACKAGE.apk cast-sdk-work/probe/aligned.apk
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '36'
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 6G
          avd-name: infinity500-discovery
          disable-animations: false
          emulator-options: -no-window -memory 4096 -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python repairs/infinity-consolidated-2103500-20261115/run_discovery_probe.py cast-sdk-android cast-sdk-work/probe/CI-ONLY-OTHER-PACKAGE.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Infinity500-Discovery-${{ github.run_id }}-EVIDENCE-NOT-INSTALLER
          path: |
            SOURCE-SCOPE.json
            cast-sdk-android/
            cast-sdk-work/component-reuse86/COMPONENT-RESULT.json
            cast-sdk-work/component-reuse86/RESOURCE-IDENTITY.json
            cast-sdk-work/component-reuse86/SOURCE-JAVA.json
            cast-sdk-work/component-reuse86/BUILD-SOURCES.json
            cast-sdk-work/component-reuse86/dex/
          retention-days: 30
          if-no-files-found: warn
