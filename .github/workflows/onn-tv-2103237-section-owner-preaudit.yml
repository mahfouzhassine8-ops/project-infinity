name: onn TV 2103237 section owner preaudit

on:
  workflow_dispatch:
  push:
    branches: [infinity-cobra-2103237-onn4kpro-tv-section-owner-player-cleanup-rc17]
    paths:
      - '.github/workflows/onn-tv-2103237-section-owner-preaudit.yml'
      - 'repairs/onn4kpro-tv-section-owner-2103237/**'

permissions:
  contents: read
  actions: read

jobs:
  preaudit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download exact 2103208 Android source parent
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103208-Integration-Polish-TEST-CANDIDATE-Replica-1-Attempt-1
          run-id: 35676573761
          github-token: ${{ github.token }}
          path: baseline208

      - name: Download preserved 2103209 source reconstruction engine
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103209-Python311-GIL-Native-Engine
          run-id: 35693288744
          github-token: ${{ github.token }}
          path: native209

      - name: Reconstruct exact locked RC16 source
        run: |
          set -euo pipefail
          mkdir -p engine audit237
          cp native209/pythoninvoker-threadstate-v2-source.json engine/pythoninvoker-threadstate-v2-source.json
          cp native209/pythoninvoker-threadstate-v2-source.stage1.json engine/pythoninvoker-threadstate-v2-source.stage1.json
          python3 repairs/python311-gil-2103209/ci.py prepare \
            --base-dir baseline208 \
            --native-apk native209/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2-Engine-Base.apk \
            --shell shell-kodi \
            --out audit237/mobile-source-base
          python3 repairs/cobra-media-library-health-2103210/apply.py --shell shell-kodi
          python3 repairs/cobra-library-health-2103211/apply.py --shell shell-kodi
          python3 repairs/health-media-trim-2103212/apply.py --shell shell-kodi
          python3 repairs/live-blue-ambient-settings-return-2103213/apply.py --shell shell-kodi
          python3 repairs/media-details-final-2103214/apply.py --shell shell-kodi
          python3 repairs/smart-return-experience-drawer-2103215/apply.py --shell shell-kodi
          python3 repairs/smart-return-experience-display-2103216/apply.py --shell shell-kodi
          python3 repairs/media-return-context-2103217/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-2103218/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-remote-2103219/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-grid-only-2103220/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-remote-ui-2103221/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-player-multiview-2103222/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-hardening-2103223/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-native-remote-2103224/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-handoff-focus-2103225/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-navigation-motion-2103230/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-adaptive-ui-polish-2103231/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-integrated-drawer-2103232/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-glass-system-2103233/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-integrated-shell-playing-2103234/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-final-polish-2103235/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-pulsing-dot-2103236/apply.py --shell shell-kodi
          python3 - <<'PY'
          import json,hashlib,pathlib
          r=json.load(open('engine/background-resume-source.json'))
          assert r['version_code']==2103236
          assert r['version_name']=='1.0.9-Cobra-Onn4KPro-TV-Pulsing-Dot-RC16'
          assert r['tv_grid_pulsing_playing_dot'] is True
          assert r['tv_right_select_scope']=='live-tv-only'
          assert r['tv_movies_dedicated_search'] is True
          assert r['tv_shows_dedicated_search'] is True
          assert r['tv_ambient_mode_retired'] is True
          src=pathlib.Path('shell-kodi/tools/android/packaging/xbmc/src')
          for n in ('InfinityLiveActivity.java.in','Splash.java.in'):
            p=src/n
            print(n,hashlib.sha256(p.read_bytes()).hexdigest(),p.stat().st_size)
          PY
          cp shell-kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in audit237/InfinityLiveActivity-RC16.java.in
          cp shell-kodi/tools/android/packaging/xbmc/src/Splash.java.in audit237/Splash-RC16.java.in
          cp engine/background-resume-source.json audit237/RC16-source-receipt.json

      - name: Dry-run RC17 section owner and player cleanup
        run: |
          set -euo pipefail
          python3 -m py_compile repairs/onn4kpro-tv-section-owner-2103237/apply.py
          python3 repairs/onn4kpro-tv-section-owner-2103237/apply.py --shell shell-kodi
          python3 - <<'PY'
          import json,pathlib
          r=json.load(open('engine/background-resume-source.json'))
          assert r['version_code']==2103237
          assert r['version_name']=='1.0.9-Cobra-Onn4KPro-TV-Section-Owner-RC17'
          assert r['chooser_card_settings_removed'] is True
          assert r['chooser_infinity_settings_removed'] is True
          assert r['chooser_cobra_settings_removed'] is True
          assert r['cobra_explicit_start_destination']=='live_tv'
          assert r['tv_cobra_startup_integrated_shell'] is True
          assert r['tv_cobra_startup_drawer_open'] is True
          assert r['tv_cobra_startup_groups_visible'] is True
          assert r['tv_drawer_right_select'] is True and r['tv_drawer_left_back'] is True
          assert r['tv_directory_right_select'] is True and r['tv_directory_left_back'] is True
          assert r['tv_right_select_scope']=='live-tv-only'
          assert r['tv_left_back_scope']=='live-tv-drawer-directory-only'
          assert r['tv_section_owner_persistent'] is True
          assert r['tv_movies_persistent_until_drawer_change'] is True
          assert r['tv_shows_persistent_until_drawer_change'] is True
          assert r['tv_smart_return_cannot_override_vod_owner'] is True
          assert r['tv_vod_channels_control_removed'] is True
          assert r['tv_vod_multiview_control_removed'] is True
          assert r['tv_vod_live_rewind_removed'] is True
          assert r['tv_vod_go_live_removed'] is True
          assert r['tv_vod_live_timeline_removed'] is True
          assert r['tv_vod_live_record_removed'] is True
          assert r['tv_vod_display_preserved'] is True
          assert r['tv_vod_more_preserved'] is True
          assert r['tv_grid_pulsing_playing_dot'] is True
          assert r['tv_ambient_mode_retired'] is True
          assert r['native_engine_rebuilt'] is False
          assert r['playback_engine_unchanged'] is True
          a=pathlib.Path('shell-kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in').read_text()
          s=pathlib.Path('shell-kodi/tools/android/packaging/xbmc/src/Splash.java.in').read_text()
          assert 'experience-settings-infinity' not in s
          assert 'experience-settings-cobra' not in s
          assert 'cobra_start_destination' in s
          assert 'COBRA_SECTION_OWNER' in a
          assert 'cobraOpenLiveTvStartup' in a
          assert 'cobraOnDemandPlayer' in a
          assert 'class CobraTvPlayingDot extends View' in a
          assert 'cobra_movies_search' in a and 'cobra_shows_search' in a
          print('PASS: RC17 startup/section-owner/VOD-player source gates')
          PY
          cp shell-kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in audit237/InfinityLiveActivity-RC17.java.in
          cp shell-kodi/tools/android/packaging/xbmc/src/Splash.java.in audit237/Splash-RC17.java.in
          cp engine/background-resume-source.json audit237/RC17-source-receipt.json

      - name: Preserve RC17 source audit
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103237-Section-Owner-Preaudit
          path: audit237/
          retention-days: 30
