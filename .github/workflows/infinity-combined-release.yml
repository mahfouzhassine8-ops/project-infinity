      - uses: actions/upload-artifact@v4
        with: {name: 'Infinity-Combined-Original-Signer-${{ github.run_id }}', path: signed-combined/, if-no-files-found: error, retention-days: 90, compression-level: 0}
      - uses: actions/upload-artifact@v4
