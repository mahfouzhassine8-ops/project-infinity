          One owner journey: save a never-played title without creating progress; play/partially stop/resume the exact saved TV episode; verify Progress Shows and unfinished Next Episodes; complete it; play/resume a saved movie; confirm normal Movies/TV and existing Search. A successor is shown only when the existing local catalogue proves it; provider-only completion withholds an unproved next episode.

          ENGINEERING-EVIDENCE.zip contains exact signed receipts, hashes, source pins and selected Android results. These are engineering evidence, not a Fold acceptance claim.
          '''
          (payload/'INSTALL-AND-RECOVERY.md').write_text(instructions)
          gate=dict(status='PASS_EXACT_SIGNED_PAIR_AND_SELECTED_ANDROID_PUBLICATION_GATE',request_sha256=sha(task/'PUBLICATION-REQUEST.json'),signed_pair_request_sha256=sha(task/'SIGNED-PAIR-REQUEST.json'),Android_run=android['run_id'],Android_source=source,Android_artifact=android['artifact'],selected_cases=sorted(expected),Fold='PENDING_OWNER_ACCEPTANCE',shutdown='NOT_SELECTED',accepted_pointer_updated=False,APK_modified=False)
          Path('WATCHLIST-PUBLICATION-GATE.json').write_text(json.dumps(gate,indent=2)+'\n')
          print('PASS exact unchanged signed468/469 and all ten selected Android cases; Fold pending')
          PYGATE
      - name: Upload private draft, verify every asset hash and size, then publish engineering prerelease
        run: |
          python3 - <<'PYPUBLISH'
          import hashlib,json,os,subprocess
          from pathlib import Path
          task=Path('repairs/infinity-watchlist-playback-2103466-20261108');request=json.loads((task/'PUBLICATION-REQUEST.json').read_text())
          repo='mahfouzhassine8-ops/project-infinity';base='repos/'+repo+'/';payload=Path('watchlist-publication-ready')
          def sha(path):
            with Path(path).open('rb') as stream:return hashlib.file_digest(stream,'sha256').hexdigest()
          def api(path,method='GET',body=None):
            args=['gh','api','--method',method,base+path]
            if body is not None:args+=['--input','-']
            return json.loads(subprocess.check_output(args,input=json.dumps(body) if body is not None else None,text=True))
          tag=request['release_tag']
          existing=subprocess.run(['gh','api',base+'releases/tags/'+tag],text=True,capture_output=True)
          assert existing.returncode!=0 and '404' in existing.stderr,'Existing tag/release is never replaced'
          notes='Engineering-verified Watchlist prerelease. Exact original-signed 2103468 candidate and 2103469 forward recovery; selected synthetic-media Android cases passed. Physical Fold acceptance remains pending. No shutdown acceptance, real-account/debrid claim, or accepted-pointer update. See INSTALL-AND-RECOVERY.md and ENGINEERING-EVIDENCE.zip.'
          release=api('releases','POST',dict(tag_name=tag,target_commitish=os.environ['GITHUB_SHA'],name=request['release_title'],body=notes,draft=True,prerelease=True,make_latest='false'))
          release_id=release['id'];assert release['draft'] is True and release['prerelease'] is True
          def upload(paths):subprocess.run(['gh','release','upload',tag,'--repo',repo]+[str(path) for path in paths],check=True)
          def verified():
            assets=api('releases/'+str(release_id)+'/assets?per_page=100')
            wanted={path.name:path for path in payload.iterdir() if path.is_file()}
            assert len(assets)==len(wanted) and {a['name'] for a in assets}==set(wanted)
            for asset in assets:
              path=wanted[asset['name']]
              assert asset['state']=='uploaded' and asset['size']==path.stat().st_size and asset['digest']=='sha256:'+sha(path)
            return assets
          upload(sorted(payload.iterdir()));assets=verified()
          downloads=dict(status='ENGINEERING_PRERELEASE_FOLD_ACCEPTANCE_PENDING',tag=tag,Fold='PENDING_OWNER_ACCEPTANCE',accepted_pointer_updated=False,release_url=release['html_url'],assets=[dict(name=a['name'],size_in_bytes=a['size'],sha256=a['digest'].removeprefix('sha256:'),url=a['browser_download_url']) for a in sorted(assets,key=lambda a:a['name'])])
          downloads['checksums_url']='https://github.com/'+repo+'/releases/download/'+tag+'/SHA256SUMS'
          (payload/'DOWNLOADS.json').write_text(json.dumps(downloads,indent=2)+'\n')
          (payload/'SHA256SUMS').write_text(''.join(sha(path)+'  '+path.name+'\n' for path in sorted(payload.iterdir()) if path.is_file()))
          upload([payload/'DOWNLOADS.json',payload/'SHA256SUMS']);assets=verified()
          published=api('releases/'+str(release_id),'PATCH',dict(draft=False,prerelease=True,make_latest='false'))
          assert published['draft'] is False and published['prerelease'] is True and published['tag_name']==tag
          final=verified()
          assert next(a['browser_download_url'] for a in final if a['name']=='SHA256SUMS')==downloads['checksums_url']
          receipt=dict(status='PUBLISHED_EXACT_ORIGINAL_SIGNED_PAIR_ENGINEERING_PRERELEASE',release_id=release_id,release_url=published['html_url'],tag=tag,prerelease=True,Fold='PENDING_OWNER_ACCEPTANCE',accepted_pointer_updated=False,signer_keys_accessed=False,APK_modified=False,assets=[dict(name=a['name'],size_in_bytes=a['size'],digest=a['digest'],url=a['browser_download_url']) for a in sorted(final,key=lambda a:a['name'])])
          Path('WATCHLIST-PUBLICATION-RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          Path('DOWNLOADS.json').write_bytes((payload/'DOWNLOADS.json').read_bytes())
          print(published['html_url'])
          PYPUBLISH
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Infinity-Watchlist-Publication-Receipt-${{ github.run_id }}-FOLD-PENDING
          path: |
            WATCHLIST-PUBLICATION-GATE.json
            WATCHLIST-PUBLICATION-RECEIPT.json
            DOWNLOADS.json
            watchlist-publication-ready/SHA256SUMS
            watchlist-publication-ready/INSTALL-AND-RECOVERY.md
          if-no-files-found: warn
          retention-days: 90
