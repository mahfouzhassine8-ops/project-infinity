name: Infinity combined release | owner gate before original signing
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare authenticated owners or sign one reviewed coordinated435 candidate
        type: choice
        required: true
        default: final-combined
        options: [final-combined, authenticate-infinity-owner]
      cobra_producer_run:
        description: Successful source-bound Cobra435 host producer (authentication only)
        type: string
        required: false
        default: '0'
      infinity_producer_run:
        description: Successful separate Infinity loading host producer (authentication only)
        type: string
        required: false
        default: '41123338242'
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-combined-original-key-release
  cancel-in-progress: false
jobs:
  authenticate-infinity-owner:
    name: Authenticate separately verified Infinity435 and prepare coordinated owners only
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work/cobra-only-from-2103427-20261028' && inputs.operation == 'authenticate-infinity-owner'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
      LOADING_OPERATION: authenticate-infinity-owner
      COBRA_PRODUCER_RUN: ${{ inputs.cobra_producer_run }}
      INFINITY_PRODUCER_RUN: ${{ inputs.infinity_producer_run }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Admit exact selected source and focused release protocol
        run: |
          set -euo pipefail
          test "$COBRA_PRODUCER_RUN" -gt 0
          test "$INFINITY_PRODUCER_RUN" -gt 0
          python3 -m pip install Pillow==12.3.0 PyYAML==6.0.3
          python3 repairs/cobra-next-from-2103427/cards-from-2103431/consolidated435/test_release_protocol.py
          python3 repairs/dual-experience-isolation-2103420/signer_policy.py check --out AUTHENTICATION-SIGNER-ROUTES.json
      - uses: actions/download-artifact@v4
        with:
          run-id: 41040277352
          name: Infinity-Combined-Owner-Components-41040277352
          github-token: ${{ github.token }}
          path: protected433-components
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.cobra_producer_run }}
          name: Cobra-Cards-Prepared-Owners-${{ inputs.cobra_producer_run }}
          github-token: ${{ github.token }}
          path: cobra435-components
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.cobra_producer_run }}
          name: Cobra-Cards-Host-Evidence-${{ inputs.cobra_producer_run }}
          github-token: ${{ github.token }}
          path: cobra435-evidence
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.infinity_producer_run }}
          name: Infinity-Seamless-Loading-Host-Evidence-${{ inputs.infinity_producer_run }}
          github-token: ${{ github.token }}
          path: loading435-evidence
      - name: Recheck both official owner producers before module-key access
        run: |
          python3 repairs/cobra-next-from-2103427/cards-from-2103431/consolidated435/prepare_combined.py precheck \
            --cobra-components cobra435-components --cobra-evidence cobra435-evidence \
            --cobra-run "$COBRA_PRODUCER_RUN" \
            --loading-evidence loading435-evidence --loading-run "$INFINITY_PRODUCER_RUN" \
            --out owner-precheck
      - name: Authenticate only the tested76-file Infinity source with the original key
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          python3 repairs/cobra-next-from-2103427/cards-from-2103431/consolidated435/authenticate_infinity.py \
            --baseline protected433-components/INFINITY.zip --evidence loading435-evidence \
            --producer-run "$INFINITY_PRODUCER_RUN" --out infinity435-authenticated
      - name: Integrate exact authenticated owners and genuine version metadata without APK creation
        run: |
          python3 repairs/cobra-next-from-2103427/cards-from-2103431/consolidated435/prepare_combined.py finish \
            --precheck owner-precheck --authenticated infinity435-authenticated \
            --loading-evidence loading435-evidence --cobra-components cobra435-components --out prepared435
      - uses: actions/upload-artifact@v4
        with:
          name: Coordinated435-Prepared-Owners-${{ github.run_id }}
          path: prepared435/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Preserve preparation diagnostics without private key material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Coordinated435-Preparation-Evidence-${{ github.run_id }}
          path: |
            AUTHENTICATION-SIGNER-ROUTES.json
            owner-precheck/PRECHECK.json
            infinity435-authenticated/AUTHENTICATED-OWNER.json
            infinity435-authenticated/MODULE-AUTHENTICATION.txt
            infinity435-authenticated/stage/candidate-addons/script.infinity.commandcenter/INFINITY-MODULES.v1
            infinity435-authenticated/stage/candidate-addons/script.infinity.commandcenter/INFINITY-MODULES.v1.sig
            prepared435/COORDINATED-OWNERS.json
          if-no-files-found: warn
          retention-days: 90
  combined:
    name: Drawer436 original-key candidate; frozen435 Infinity and shared payload
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work/cobra-only-from-2103435-20261031' && inputs.operation == 'final-combined'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: repairs/dual-experience-isolation-2103420
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Admit exact436 authority and selected release protocol before any keys
        id: selected
        run: |
          set -euo pipefail
          python3 -m pip install Pillow==12.3.0 PyYAML==6.0.3
          python3 repairs/cobra-2103435-followups/drawer-only/release-stage/test_release.py
          python3 - <<'PYCODE'
          import json,os
          from pathlib import Path
          from release_gate import remote_authority
          a=remote_authority(Path('.'),os.environ['GITHUB_SHA'])
          assert a['candidate_versionCode']==2103436 and a['generation']==21
          assert a['target_owners']==['COBRA','CHOOSER_SHELL']
          run=a['owner_update_evidence']['producer_run']
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('producer_run='+str(run)+'\n')
          PYCODE
          python3 repairs/dual-experience-isolation-2103420/signer_policy.py check --out SIGNER-ROUTES.json
      - uses: actions/download-artifact@v4
        with:
          run-id: 41125367621
          name: Infinity-Combined-Owner-Components-41125367621
          github-token: ${{ github.token }}
          path: combined-build/components
      - uses: actions/download-artifact@v4
        with:
          run-id: 41125367621
          name: Infinity-Combined-Original-Signer-41125367621
          github-token: ${{ github.token }}
          path: protected435
      - uses: actions/download-artifact@v4
        with:
          run-id: 39867073954
          name: Infinity-Receipt-Race-Android17-Investigation
          github-token: ${{ github.token }}
          path: tools
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.selected.outputs.producer_run }}
          name: Cobra-Drawer436-Mutable-Owners-${{ steps.selected.outputs.producer_run }}
          github-token: ${{ github.token }}
          path: drawer436-mutable
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.selected.outputs.producer_run }}
          name: Cobra-Drawer436-Preparation-Evidence-${{ steps.selected.outputs.producer_run }}
          github-token: ${{ github.token }}
          path: drawer436-evidence
      - name: Verify exact official source-bound owners and assemble original container
        run: |
          set -euo pipefail
          cp drawer436-mutable/COBRA.zip drawer436-mutable/CHOOSER_SHELL.zip drawer436-mutable/catalog.json combined-build/components/
          python3 repairs/cobra-2103435-followups/drawer-only/release-stage/register.py check-registered \
            --run-id "${{ steps.selected.outputs.producer_run }}" --evidence drawer436-evidence \
            --mutable drawer436-mutable --bundles combined-build/components --out REGISTERED436-CHECK.json
          python3 repairs/dual-experience-isolation-2103420/component_bundles.py combine \
            --bundles combined-build/components --catalog combined-build/components/catalog.json \
            --out combined-build/combined-unsigned.apk --version 2103436
          python3 - <<'PYCODE'
          import hashlib,json
          from pathlib import Path
          with Path('combined-build/combined-unsigned.apk').open('rb') as f:actual=hashlib.file_digest(f,'sha256').hexdigest()
          assert actual==json.loads(Path('drawer436-evidence/APK-PRESERVATION.json').read_text())['unsigned_apk_sha256']
          PYCODE
      - name: Hard original pre-sign payload ownership and source guard
        run: |
          python3 repairs/dual-experience-isolation-2103420/release_gate.py \
            --apk combined-build/combined-unsigned.apk --jars tools/receipt-evidence/tool-jars --work gate-dex \
            --repository . --expected-head "$GITHUB_SHA" --expected-generation 21 --out SIGNING-DECISION.json
      - name: Original signer - reachable only after complete owner verification
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          python3 repairs/dual-experience-isolation-2103420/assemble.py sign \
            --apk combined-build/combined-unsigned.apk --jars tools/receipt-evidence/tool-jars --work signer-dex \
            --repository . --expected-head "$GITHUB_SHA" --expected-generation 21 \
            --sdk "$ANDROID_HOME/build-tools/35.0.0" --out signed-combined
      - name: Full signed435-to-signed436 member, original certificate and matching ZIP check
        run: |
          mkdir -p signed436-review
          cp -r combined-build/components signed436-review/
          cp drawer436-evidence/PREPARATION.json signed436-review/
          python3 repairs/cobra-2103435-followups/drawer-only/release-stage/prepare.py compare \
            --prepared signed436-review --signed435 protected435/Infinity-2103435-Combined-Original-Signer.apk \
            --sdk "$ANDROID_HOME/build-tools/35.0.0" --out signed-combined/preservation \
            --candidate signed-combined/Infinity-2103436-Combined-Original-Signer.apk
          cp repairs/dual-experience-isolation-2103420/release-authority.json signed-combined/
          cp SIGNING-DECISION.json REGISTERED436-CHECK.json SIGNER-ROUTES.json signed-combined/
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib
          p=Path('combined-build/components')
          (p/'SHA256SUMS').write_text(''.join(hashlib.sha256((p/n).read_bytes()).hexdigest()+'  '+n+'\n' for n in ['COBRA.zip','INFINITY.zip','MINIMAL_ANDROID_CONTRACT.zip','CHOOSER_SHELL.zip']))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: Infinity-Combined-Original-Signer-${{ github.run_id }}
          path: signed-combined/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - uses: actions/upload-artifact@v4
        with:
          name: Infinity-Combined-Owner-Components-${{ github.run_id }}
          path: combined-build/components/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cobra-Drawer436-Signing-Evidence-${{ github.run_id }}
          path: |
            SIGNING-DECISION.json
            REGISTERED436-CHECK.json
            SIGNER-ROUTES.json
            signed-combined/preservation/
          if-no-files-found: warn
          retention-days: 90
