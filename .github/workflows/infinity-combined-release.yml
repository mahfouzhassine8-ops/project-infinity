  prepare-three:
    name: Three scoped corrections with original module signatures and forward recovery; internal QA only
    if: github.event_name == 'workflow_dispatch' && github.repository == 'mahfouzhassine8-ops/project-infinity' && github.ref == 'refs/heads/work/infinity-three-corrections-20261108' && inputs.operation == 'prepare-three'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env: {GH_TOKEN: '${{ github.token }}', PYTHONDONTWRITEBYTECODE: '1'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '21'}
      - name: Exact committed scope, original workflow identity and unchanged protected release implementations
        run: |
          python3 repairs/infinity-three-corrections-20261108/admit_preparation.py
          python3 repairs/dual-experience-isolation-2103420/signer_policy.py check --out three-preflight/SIGNER-ROUTES.json
          python3 repairs/infinity-three-corrections-20261108/prepare_three.py versions --out three-preflight/VERSION-AVAILABILITY.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13596730735', run-id: '42428328498', github-token: '${{ github.token }}', path: three-baseline, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13595626273', run-id: '42425522122', github-token: '${{ github.token }}', path: three-components, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13606537849', run-id: '42453405536', github-token: '${{ github.token }}', path: three-native, merge-multiple: true}
      - name: Actual installed-source evidence, complete79-file modules and two-file Trakt correction with installed customizations preserved
        run: |
          python3 repairs/infinity-three-corrections-20261108/prepare_three.py inputs --apk three-baseline/Infinity-2103464-Combined-Original-Signer.apk --baseline three-components --native three-native --archive repairs/infinity-three-corrections-20261108/inputs/Infinity_Source_Exports_For_Work.zip --out three-prepared
      - name: Existing original-key SignInfinityModules after exact source and signature preflight
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess,tempfile
          from pathlib import Path
          proof=json.loads(Path('three-prepared/INPUTS-VERIFIED.json').read_text())
          assert proof['source']==os.environ['GITHUB_SHA']
          assert proof['status']=='PASS_PINNED464_PLUS_THREE_APPROVED_CORRECTIONS'
          first=Path('repairs/infinity-final-closure-2103407')
          with tempfile.TemporaryDirectory(prefix='infinity-original-module-sign-') as temporary:
            temp=Path(temporary);key=temp/'original.jks'
            key.write_bytes(base64.b64decode(os.environ['INFINITY_KEYSTORE_B64'],validate=True));key.chmod(0o600)
            classes=temp/'classes';classes.mkdir()
            subprocess.run(['javac','--release','8','-g:none','-d',str(classes),str(first/'SignInfinityModules.java')],check=True)
            env={n:os.environ[n] for n in ('PATH','JAVA_HOME','INFINITY_STORE_PASSWORD','INFINITY_KEY_PASSWORD','INFINITY_KEY_ALIAS')}
            for version in (2103466,2103467):
              root=Path('three-prepared')/str(version)/'modules'
              pins=json.loads((root.parent/'INPUTS.json').read_text())['modules']
              actual={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
              assert actual==pins,'STAGED_SOURCE_CHANGED_BEFORE_ORIGINAL_KEY_ACCESS'
              subprocess.run(['java','-cp',str(classes),'SignInfinityModules',str(key),str(root/'script.infinity.commandcenter/INFINITY-MODULES.v1')],env=env,check=True)
          PY
      - name: Real unchanged Java installer upgrade, refusal, idempotency and forward-recovery checks
        run: python3 repairs/infinity-three-corrections-20261108/verify_module_pair.py --prepared three-prepared --out three-module-audit
      - name: Existing owner-bundle assembly with every APK member, DEX, skin and Cobra compared before APK signing
        run: python3 repairs/infinity-three-corrections-20261108/prepare_three.py finish --apk three-baseline/Infinity-2103464-Combined-Original-Signer.apk --baseline three-components --native three-native --out three-prepared
      - uses: actions/upload-artifact@v4
        with: {name: 'Infinity2103466-ThreeCorrections-Prepared-${{ github.run_id }}-INTERNAL', path: three-prepared/2103466/publish/, if-no-files-found: error, retention-days: 90, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: 'Infinity2103467-ThreeCorrections-Recovery-Prepared-${{ github.run_id }}-INTERNAL', path: three-prepared/2103467/publish/, if-no-files-found: error, retention-days: 90, compression-level: 0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Infinity-ThreeCorrections-Preparation-Evidence-${{ github.run_id }}-NOT-INSTALLER
          path: |
            three-preflight/
            three-module-audit/
            three-prepared/INPUTS-VERIFIED.json
            three-prepared/device-audit/DEVICE-SOURCE-VERIFICATION.json
            three-prepared/2103466/INPUTS.json
            three-prepared/2103467/INPUTS.json
          if-no-files-found: warn
          retention-days: 90
