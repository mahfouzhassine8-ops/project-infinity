name: Infinity combined release | owner gate before original signing
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare verified Cards Preview440 or sign its exact reviewed combined candidate
        type: choice
        required: true
        default: final-combined
        options: [final-combined, prepare-preview440]
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-combined-original-key-release
  cancel-in-progress: false
jobs:
  prepare-preview440:
    name: Cards Preview440 owner preparation; frozen Infinity437/shared payload
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work/cobra-fullscreen-display-from-2103438-20261031' && inputs.operation == 'prepare-preview440'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Focused release protocol and sole signer checks before key access
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 repairs/cobra-2103438-preview-restoration/tests/test_release440.py
          python3 repairs/dual-experience-isolation-2103420/signer_policy.py check --out SIGNER-ROUTES.json
      - uses: actions/download-artifact@v4
        with:
          run-id: 41250066560
          name: Infinity-Combined-Owner-Components-41250066560
          github-token: ${{ github.token }}
          path: protected438-components
      - uses: actions/download-artifact@v4
        with:
          run-id: 41250066560
          name: Infinity-Combined-Original-Signer-41250066560
          github-token: ${{ github.token }}
          path: protected438
      - uses: actions/download-artifact@v4
        with:
          run-id: 39867073954
          name: Infinity-Receipt-Race-Android17-Investigation
          github-token: ${{ github.token }}
          path: tools
      - name: Prepare Preview-only owner and verify exact signed438 preservation
        env:
          CARDS_TOOLS_ROOT: ${{ github.workspace }}/tools
        run: |
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar" tools/d8.jar
          python3 repairs/cobra-2103438-preview-restoration/release440.py prepare \
            --bundles protected438-components --baseline protected438/Infinity-2103438-Combined-Original-Signer.apk \
            --sdk "$ANDROID_HOME/build-tools/35.0.0" --out prepared440
      - uses: actions/upload-artifact@v4
        with:
          name: Infinity440-Prepared-${{ github.run_id }}
          path: prepared440/publish/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity440-Preparation-Evidence-${{ github.run_id }}
          path: |
            SIGNER-ROUTES.json
            prepared440/*.log
            prepared440/*.json
            prepared440/owner/*.json
            prepared440/*.txt
            prepared440/preservation/
          if-no-files-found: warn
          retention-days: 90
  combined:
    name: Cards Preview440 original-key testing APK; frozen Infinity437
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work/cobra-fullscreen-display-from-2103438-20261031' && inputs.operation == 'final-combined'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: repairs/dual-experience-isolation-2103420
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Admit exact440 authority and sole signer before keys
        id: selected
        run: |
          set -euo pipefail
          python3 -m pip install PyYAML==6.0.3
          python3 repairs/cobra-2103438-preview-restoration/tests/test_release440.py
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          from release_gate import remote_authority,require
          a=remote_authority(Path('.'),os.environ['GITHUB_SHA'])
          require(a['candidate_versionCode']==2103440 and a['generation']==26,'EXACT440_AUTHORITY')
          require(a['target_owners']==['COBRA','CHOOSER_SHELL'] and a['update_kind']=='owner_update','CARDS_ONLY')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('producer_run='+str(a['owner_update_evidence']['producer_run'])+'\n')
          PYCODE
          python3 repairs/dual-experience-isolation-2103420/signer_policy.py check --out SIGNER-ROUTES.json
      - uses: actions/download-artifact@v4
        with:
          run-id: 41250066560
          name: Infinity-Combined-Original-Signer-41250066560
          github-token: ${{ github.token }}
          path: protected438
      - uses: actions/download-artifact@v4
        with:
          run-id: 39867073954
          name: Infinity-Receipt-Race-Android17-Investigation
          github-token: ${{ github.token }}
          path: tools
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.selected.outputs.producer_run }}
          name: Infinity440-Prepared-${{ steps.selected.outputs.producer_run }}
          github-token: ${{ github.token }}
          path: prepared440
      - name: Verify official artifact bytes, registered source and exact438 preservation before keys
        run: |
          set -euo pipefail
          python3 repairs/cobra-2103438-preview-restoration/release440.py check_registered \
            --prepared prepared440 --run-id "${{ steps.selected.outputs.producer_run }}" --out REGISTERED440-CHECK.json
          mkdir -p combined-build
          cp -r prepared440/components combined-build/
          python3 repairs/dual-experience-isolation-2103420/component_bundles.py combine \
            --bundles combined-build/components --catalog combined-build/components/catalog.json \
            --out combined-build/combined-unsigned.apk --version 2103440
          python3 - <<'PYCODE'
          from pathlib import Path
          from inventory import file_sha,load
          from release_gate import require
          require(file_sha('combined-build/combined-unsigned.apk')==load('prepared440/preservation/APK-PRESERVATION.json')['candidate_sha256'],'EXACT_VERIFIED_UNSIGNED_APK')
          PYCODE
      - name: Hard original pre-sign payload ownership and source guard
        run: |
          python3 repairs/dual-experience-isolation-2103420/release_gate.py \
            --apk combined-build/combined-unsigned.apk --jars tools/receipt-evidence/tool-jars --work gate-dex \
            --repository . --expected-head "$GITHUB_SHA" --expected-generation 26 --out SIGNING-DECISION.json
      - name: Original signer after all source and payload gates
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          python3 repairs/dual-experience-isolation-2103420/assemble.py sign \
            --apk combined-build/combined-unsigned.apk --jars tools/receipt-evidence/tool-jars --work signer-dex \
            --repository . --expected-head "$GITHUB_SHA" --expected-generation 26 \
            --sdk "$ANDROID_HOME/build-tools/35.0.0" --out signed-combined
      - name: Signed438-to-signed440 exact member and original certificate comparison
        run: |
          python3 repairs/cobra-2103438-preview-restoration/release440.py compare \
            --baseline protected438/Infinity-2103438-Combined-Original-Signer.apk \
            --candidate signed-combined/Infinity-2103440-Combined-Original-Signer.apk \
            --plan prepared440/PREPARATION.json --out signed-combined/preservation --sdk "$ANDROID_HOME/build-tools/35.0.0"
          cp repairs/dual-experience-isolation-2103420/release-authority.json signed-combined/
          cp SIGNING-DECISION.json REGISTERED440-CHECK.json SIGNER-ROUTES.json signed-combined/
          python3 - <<'PYCODE'
          from pathlib import Path
          from inventory import file_sha
          p=Path('combined-build/components')
          (p/'SHA256SUMS').write_text(''.join(file_sha(p/n)+'  '+n+'\n' for n in ['COBRA.zip','INFINITY.zip','MINIMAL_ANDROID_CONTRACT.zip','CHOOSER_SHELL.zip']))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: Infinity-Combined-Original-Signer-${{ github.run_id }}
          path: signed-combined/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - uses: actions/upload-artifact@v4
        with:
          name: Infinity-Combined-Owner-Components-${{ github.run_id }}
          path: combined-build/components/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity440-Signing-Evidence-${{ github.run_id }}
          path: |
            SIGNING-DECISION.json
            REGISTERED440-CHECK.json
            SIGNER-ROUTES.json
            signed-combined/preservation/
          if-no-files-found: warn
          retention-days: 90
