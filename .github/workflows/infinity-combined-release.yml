name: Infinity combined release | owner gate before original signing
on:
  push:
    branches: [work/infinity-only-stability-speed-from-2103425-20261028]
    paths:
      - repairs/dual-experience-isolation-2103420/release-authority.json
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare authenticated Infinity owner inputs, or sign the reviewed combined vector
        type: choice
        required: true
        default: final-combined
        options: [final-combined, prepare-infinity-owner]
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-combined-original-key-release
  cancel-in-progress: false
jobs:
  prepare-infinity-owner:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare-infinity-owner' && github.ref == 'refs/heads/work/infinity-only-stability-speed-from-2103426-20261028'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: repairs/dual-experience-isolation-2103420
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Focused branch/owner gate controls only
        run: python3 -m unittest -v test_release_gate
      - uses: actions/download-artifact@v4
        with:
          run-id: 40647343407
          name: Infinity-Combined-Original-Signer-40647343407
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          run-id: 40647343407
          name: Infinity-Combined-Owner-Components-40647343407
          github-token: ${{ github.token }}
          path: baseline-components
      - name: Verify immutable signed2103426 before owner preparation
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs baseline/Infinity-2103426-Combined-Original-Signer.apk > baseline/REVERIFIED-SIGNATURE.txt
          python3 - <<'PY'
          from pathlib import Path
          signature=Path('baseline/REVERIFIED-SIGNATURE.txt').read_text()
          assert 'Signer #1 certificate SHA-256 digest: d7adeb68e9341596a02bd3262b737a0f45fc6e771ed7e60285437e833b58c6d7' in signature
          assert 'Verified using v2 scheme (APK Signature Scheme v2): true' in signature
          PY
      - name: Install pinned source transformation dependency
        run: python3 -m pip install lxml==6.0.2
      - name: Exact source gate then original-key manifest authentication (no APK)
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          python3 repairs/infinity-only-performance-2103425/continuation/prepare_release.py \
            --baseline baseline/Infinity-2103426-Combined-Original-Signer.apk \
            --bundles baseline-components --out prepared-owners
      - uses: actions/upload-artifact@v4
        with:
          name: Infinity-Performance-Prepared-Owners-${{ github.run_id }}
          path: prepared-owners/components/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Infinity-Performance-Owner-Evidence-${{ github.run_id }}
          path: |
            prepared-owners/PREPARED-OWNERS.json
            prepared-owners/MODULE-AUTHENTICATION.txt
            prepared-owners/source/STAGE.json
            baseline/REVERIFIED-SIGNATURE.txt
            repairs/infinity-only-performance-2103425/continuation/RELEASE-AUTHORIZATION.json
          retention-days: 90
          if-no-files-found: error
  combined:
    if: github.ref == 'refs/heads/work/infinity-only-stability-speed-from-2103425-20261028' && inputs.operation != 'prepare-infinity-owner'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: repairs/dual-experience-isolation-2103420
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scope, remote authority, evidence and retired signers
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          git diff --name-only db730100a3bfea7e06d2e6c3434e89aeb6fa8a15 HEAD > release-evidence/CHANGED-PATHS.txt
          python3 - <<'PY'
          from pathlib import Path
          import os
          from release_gate import remote_authority
          for name in Path('release-evidence/CHANGED-PATHS.txt').read_text().splitlines():
              if not (name.startswith('repairs/infinity-only-performance-2103425/') or name in (
                  'repairs/dual-experience-isolation-2103420/release_gate.py',
                  'repairs/dual-experience-isolation-2103420/test_release_gate.py',
                  'repairs/dual-experience-isolation-2103420/release-authority.json',
                  '.github/workflows/infinity-saved-navigation-android.yml',
                  '.github/workflows/infinity-combined-release.yml')):
                  raise SystemExit('Outside authorized boundary work: ' + name)
          remote_authority(Path('.'),os.environ['GITHUB_SHA'])
          PY
          python3 repairs/dual-experience-isolation-2103420/signer_policy.py check --out release-evidence/SIGNER-ROUTES.json
          python3 -m unittest -v test_release_gate 2>&1 | tee release-evidence/HOST-NEGATIVE-CONTROLS.txt
      - name: Recover immutable signed2103420 and matching ZIPs
        uses: actions/download-artifact@v4
        with:
          run-id: 40413893227
          name: Infinity-2103420-P0-Original-Signer-40413893227
          github-token: ${{ github.token }}
          path: baseline
      - name: Recover pinned DEX toolchain
        uses: actions/download-artifact@v4
        with:
          run-id: 39867073954
          name: Infinity-Receipt-Race-Android17-Investigation
          github-token: ${{ github.token }}
          path: tools
      - name: Rebuild and verify the selected owner modules
        run: |
          set -euo pipefail
          python3 repairs/dual-experience-isolation-2103420/build_candidate.py \
            --baseline baseline/p0-candidate/Infinity-2103420-P0-Corrective-SIGNED.apk \
            --jars tools/receipt-evidence/tool-jars \
            --android tools/receipt-evidence/android-34.jar \
            --d8 "$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar" --out combined-build
          cp combined-build/ASSEMBLY.json release-evidence/
          cp repairs/dual-experience-isolation-2103420/release-authority.json release-evidence/
          cp -r repairs/dual-experience-isolation-2103420/results/scoped-correction/final release-evidence/focused-evidence
      - name: Hard pre-sign gate against fresh actual APK contents
        run: |
          set -euo pipefail
          generation=$(python3 -c 'from inventory import HERE,load; print(load(HERE/"release-authority.json")["generation"])')
          python3 repairs/dual-experience-isolation-2103420/release_gate.py \
            --apk combined-build/combined-unsigned.apk --jars tools/receipt-evidence/tool-jars --work gate-dex \
            --repository . --expected-head "$GITHUB_SHA" --expected-generation "$generation" \
            --out release-evidence/SIGNING-DECISION.json
      - name: Original signer - reachable only after complete owner verification
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          generation=$(python3 -c 'from inventory import HERE,load; print(load(HERE/"release-authority.json")["generation"])')
          python3 repairs/dual-experience-isolation-2103420/assemble.py sign \
            --apk combined-build/combined-unsigned.apk --jars tools/receipt-evidence/tool-jars --work signer-dex \
            --repository . --expected-head "$GITHUB_SHA" --expected-generation "$generation" \
            --sdk "$ANDROID_HOME/build-tools/35.0.0" --out signed-combined
          cp repairs/dual-experience-isolation-2103420/release-authority.json signed-combined/
          cp repairs/dual-experience-isolation-2103420/DATA-AND-LIFECYCLE-CONTRACT.md signed-combined/
      - name: Recover exact signed2103426 for complete final member comparison
        uses: actions/download-artifact@v4
        with:
          run-id: 40647343407
          name: Infinity-Combined-Original-Signer-40647343407
          github-token: ${{ github.token }}
          path: previous2103426
      - name: Verify signed APK and exact matching components; no runtime execution
        run: |
          python3 repairs/infinity-only-performance-2103425/continuation/verify_delivery.py \
            --baseline previous2103426/Infinity-2103426-Combined-Original-Signer.apk \
            --signed signed-combined --bundles combined-build/components \
            --sdk "$ANDROID_HOME/build-tools/35.0.0"
      - name: Upload signed install-over candidate
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-Combined-Original-Signer-${{ github.run_id }}
          path: signed-combined/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - name: Upload exact independently addressable component bundles
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-Combined-Owner-Components-${{ github.run_id }}
          path: combined-build/components/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Preserve verification and real refusal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-Combined-Gate-Evidence-${{ github.run_id }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90
