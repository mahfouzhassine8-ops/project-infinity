name: Infinity combined release | owner gate before original signing
on:
  push:
    branches: [work/cobra-only-from-2103427-20261028]
    paths: [repairs/dual-experience-isolation-2103420/release-authority.json]
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare authenticated owners or sign one reviewed coordinated434 candidate
        type: choice
        required: true
        default: final-combined
        options: [final-combined, authenticate-infinity-owner]
      cobra_producer_run:
        description: Successful source-bound Cobra434 host producer (authentication only)
        type: string
        required: false
        default: '0'
      infinity_producer_run:
        description: Successful separate Infinity loading host producer (authentication only)
        type: string
        required: false
        default: '41076160374'
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-combined-original-key-release
  cancel-in-progress: false
jobs:
  authenticate-infinity-owner:
    name: Authenticate separately verified Infinity434 and prepare coordinated owners only
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work/cobra-only-from-2103427-20261028' && inputs.operation == 'authenticate-infinity-owner'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
      LOADING_OPERATION: authenticate-infinity-owner
      COBRA_PRODUCER_RUN: ${{ inputs.cobra_producer_run }}
      INFINITY_PRODUCER_RUN: ${{ inputs.infinity_producer_run }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Admit exact selected source and focused release protocol
        run: |
          set -euo pipefail
          test "$COBRA_PRODUCER_RUN" -gt 0
          test "$INFINITY_PRODUCER_RUN" -gt 0
          python3 -m pip install Pillow==12.3.0 PyYAML==6.0.3
          python3 repairs/cobra-next-from-2103427/cards-from-2103431/consolidated434/test_release_protocol.py
          python3 repairs/dual-experience-isolation-2103420/signer_policy.py check --out AUTHENTICATION-SIGNER-ROUTES.json
      - uses: actions/download-artifact@v4
        with:
          run-id: 41040277352
          name: Infinity-Combined-Owner-Components-41040277352
          github-token: ${{ github.token }}
          path: protected433-components
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.cobra_producer_run }}
          name: Cobra-Cards-Prepared-Owners-${{ inputs.cobra_producer_run }}
          github-token: ${{ github.token }}
          path: cobra434-components
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.cobra_producer_run }}
          name: Cobra-Cards-Host-Evidence-${{ inputs.cobra_producer_run }}
          github-token: ${{ github.token }}
          path: cobra434-evidence
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.infinity_producer_run }}
          name: Infinity-Seamless-Loading-Host-Evidence-${{ inputs.infinity_producer_run }}
          github-token: ${{ github.token }}
          path: loading434-evidence
      - name: Recheck both official owner producers before module-key access
        run: |
          python3 repairs/cobra-next-from-2103427/cards-from-2103431/consolidated434/prepare_combined.py precheck \
            --cobra-components cobra434-components --cobra-evidence cobra434-evidence \
            --cobra-run "$COBRA_PRODUCER_RUN" \
            --loading-evidence loading434-evidence --loading-run "$INFINITY_PRODUCER_RUN" \
            --out owner-precheck
      - name: Authenticate only the tested76-file Infinity source with the original key
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          python3 repairs/infinity-seamless-loading-2103433/authenticate.py \
            --baseline protected433-components/INFINITY.zip --evidence loading434-evidence \
            --producer-run "$INFINITY_PRODUCER_RUN" --out infinity434-authenticated
      - name: Integrate exact authenticated owners and genuine version metadata without APK creation
        run: |
          python3 repairs/cobra-next-from-2103427/cards-from-2103431/consolidated434/prepare_combined.py finish \
            --precheck owner-precheck --authenticated infinity434-authenticated \
            --loading-evidence loading434-evidence --cobra-components cobra434-components --out prepared434
      - uses: actions/upload-artifact@v4
        with:
          name: Coordinated434-Prepared-Owners-${{ github.run_id }}
          path: prepared434/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Preserve preparation diagnostics without private key material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Coordinated434-Preparation-Evidence-${{ github.run_id }}
          path: |
            AUTHENTICATION-SIGNER-ROUTES.json
            owner-precheck/PRECHECK.json
            infinity434-authenticated/AUTHENTICATED-OWNER.json
            infinity434-authenticated/MODULE-AUTHENTICATION.txt
            infinity434-authenticated/stage/candidate-addons/script.infinity.commandcenter/INFINITY-MODULES.v1
            infinity434-authenticated/stage/candidate-addons/script.infinity.commandcenter/INFINITY-MODULES.v1.sig
            prepared434/COORDINATED-OWNERS.json
          if-no-files-found: warn
          retention-days: 90
  combined:
    if: github.ref == 'refs/heads/work/cobra-only-from-2103427-20261028' && (github.event_name == 'push' || inputs.operation == 'final-combined')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: repairs/dual-experience-isolation-2103420
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scope, remote authority, evidence and retired signers
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          git diff --name-only 782242090483982c39a78f9c4da932a4751bdafc HEAD > release-evidence/CHANGED-PATHS.txt
          python3 - <<'PY'
          from pathlib import Path
          import os
          from release_gate import remote_authority
          for name in Path('release-evidence/CHANGED-PATHS.txt').read_text().splitlines():
              if not (name.startswith(('repairs/cobra-next-from-2103427/','repairs/infinity-seamless-loading-2103433/')) or name in (
                  'repairs/dual-experience-isolation-2103420/release_gate.py',
                  'repairs/dual-experience-isolation-2103420/release_authority.py',
                  'repairs/dual-experience-isolation-2103420/ownership-reviewed-roots.json',
                  'repairs/dual-experience-isolation-2103420/test_release_gate.py',
                  'repairs/dual-experience-isolation-2103420/release-authority.json',
                  '.github/workflows/infinity-saved-navigation-android.yml',
                  '.github/workflows/infinity-combined-release.yml')):
                  raise SystemExit('Outside authorized boundary work: ' + name)
          remote_authority(Path('.'),os.environ['GITHUB_SHA'])
          PY
          python3 repairs/dual-experience-isolation-2103420/signer_policy.py check --out release-evidence/SIGNER-ROUTES.json
          python3 -m unittest -v test_release_gate 2>&1 | tee release-evidence/HOST-NEGATIVE-CONTROLS.txt
      - name: Recover immutable signed2103420 and matching ZIPs
        uses: actions/download-artifact@v4
        with:
          run-id: 40413893227
          name: Infinity-2103420-P0-Original-Signer-40413893227
          github-token: ${{ github.token }}
          path: baseline
      - name: Recover pinned DEX toolchain
        uses: actions/download-artifact@v4
        with:
          run-id: 39867073954
          name: Infinity-Receipt-Race-Android17-Investigation
          github-token: ${{ github.token }}
          path: tools
      - name: Rebuild and verify the selected owner modules
        run: |
          set -euo pipefail
          python3 repairs/dual-experience-isolation-2103420/build_candidate.py \
            --baseline baseline/p0-candidate/Infinity-2103420-P0-Corrective-SIGNED.apk \
            --jars tools/receipt-evidence/tool-jars \
            --android tools/receipt-evidence/android-34.jar \
            --d8 "$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar" --out combined-build
          cp combined-build/ASSEMBLY.json release-evidence/
          cp repairs/dual-experience-isolation-2103420/release-authority.json release-evidence/
          cp -r repairs/dual-experience-isolation-2103420/results/scoped-correction/final release-evidence/focused-evidence
      - name: Verify official coordinated owner and authentication evidence before APK keys
        run: |
          set -euo pipefail
          python3 repairs/cobra-next-from-2103427/cards-from-2103431/consolidated434/register_combined.py check-registered \
            --bundles combined-build/components --work registered434-evidence
          cp registered434-evidence/REGISTERED434-CHECK.json release-evidence/
          cp registered434-evidence/prepared/COORDINATED-OWNERS.json release-evidence/
          cp registered434-evidence/prepared/MODULE-AUTHENTICATION.txt release-evidence/
      - name: Hard pre-sign gate against fresh actual APK contents
        run: |
          set -euo pipefail
          generation=$(python3 -c 'from inventory import HERE,load; print(load(HERE/"release-authority.json")["generation"])')
          python3 repairs/dual-experience-isolation-2103420/release_gate.py \
            --apk combined-build/combined-unsigned.apk --jars tools/receipt-evidence/tool-jars --work gate-dex \
            --repository . --expected-head "$GITHUB_SHA" --expected-generation "$generation" \
            --out release-evidence/SIGNING-DECISION.json
      - name: Original signer - reachable only after complete owner verification
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          generation=$(python3 -c 'from inventory import HERE,load; print(load(HERE/"release-authority.json")["generation"])')
          python3 repairs/dual-experience-isolation-2103420/assemble.py sign \
            --apk combined-build/combined-unsigned.apk --jars tools/receipt-evidence/tool-jars --work signer-dex \
            --repository . --expected-head "$GITHUB_SHA" --expected-generation "$generation" \
            --sdk "$ANDROID_HOME/build-tools/35.0.0" --out signed-combined
          cp repairs/dual-experience-isolation-2103420/release-authority.json signed-combined/
          cp repairs/dual-experience-isolation-2103420/DATA-AND-LIFECYCLE-CONTRACT.md signed-combined/
      - name: Recover exact signed2103431 for complete final member comparison
        uses: actions/download-artifact@v4
        with:
          run-id: 40971769136
          name: Infinity-Combined-Original-Signer-40971769136
          github-token: ${{ github.token }}
          path: previous2103431
      - name: Recover protected signed2103432 for final preservation comparison
        uses: actions/download-artifact@v4
        with:
          run-id: 41021114800
          name: Infinity-Combined-Original-Signer-41021114800
          github-token: ${{ github.token }}
          path: previous2103432
      - name: Recover protected signed2103433 for full current-owner comparison
        uses: actions/download-artifact@v4
        with:
          run-id: 41040277352
          name: Infinity-Combined-Original-Signer-41040277352
          github-token: ${{ github.token }}
          path: previous2103433
      - name: Verify signed APK and exact matching components; no runtime execution
        run: |
          python3 repairs/cobra-next-from-2103427/cards-from-2103431/consolidated434/verify_delivery.py \
            --recovery431 previous2103431/Infinity-2103431-Combined-Original-Signer.apk \
            --recovery432 previous2103432/Infinity-2103432-Combined-Original-Signer.apk \
            --baseline433 previous2103433/Infinity-2103433-Combined-Original-Signer.apk \
            --signed signed-combined --bundles combined-build/components \
            --sdk "$ANDROID_HOME/build-tools/35.0.0"
      - name: Upload signed install-over candidate
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-Combined-Original-Signer-${{ github.run_id }}
          path: signed-combined/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - name: Upload exact independently addressable component bundles
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-Combined-Owner-Components-${{ github.run_id }}
          path: combined-build/components/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Preserve verification and real refusal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-Combined-Gate-Evidence-${{ github.run_id }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90
