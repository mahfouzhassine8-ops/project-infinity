          assert file_sha('final-parent/Infinity-2103462-Combined-Original-Signer.apk')==r.PARENT
          r.official(Path('reviewed/2103464'),2103464)
          r.official(Path('reviewed/2103465'),2103465)
          PYVERIFY
      - name: Selected real production Java installer upgrade and forward recovery
        run: |
          if [ "$REVIEW_VERSION" = 2103464 ]; then
            python3 repairs/infinity-final-release-462-20261107/verify_module_upgrade.py --parent final-parent/Infinity-2103462-Combined-Original-Signer.apk --candidate reviewed/2103464 --recovery reviewed/2103465 --current final-current-components --out final-module-audit
          else
            mkdir final-module-audit
            cp repairs/infinity-final-release-462-20261107/MODULE-UPGRADE-RECOVERY.json final-module-audit/
          fi
      - name: Admit exact payload to engineering authority, preserve every locked reference
        run: python3 repairs/infinity-final-release-462-20261107/register_engineering.py --prepared "reviewed/$REVIEW_VERSION" --version "$REVIEW_VERSION" --audit final-module-audit/MODULE-UPGRADE-RECOVERY.json --out final-authority-review
      - uses: actions/upload-artifact@v4
