          python3 repairs/dual-experience-isolation-2103420/component_bundles.py combine --bundles "reviewed/$SIGN_VERSION/components" --catalog "reviewed/$SIGN_VERSION/components/catalog.json" --out combined-unsigned.apk --version "$SIGN_VERSION"
          python3 - <<'PYHASH'
          import os,sys
