name: Infinity combined release | owner gate before original signing
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare authenticated Infinity437 or sign its exact reviewed combined candidate
        type: choice
        required: true
        default: final-combined
        options: [final-combined, prepare-loading437]
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-combined-original-key-release
  cancel-in-progress: false
jobs:
  prepare-loading437:
    name: Infinity437 loading owner preparation; frozen436 Cobra and shared payload
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work/infinity-only-from-2103436-20261031' && inputs.operation == 'prepare-loading437'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Focused release protocol and sole signer checks before key access
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 repairs/infinity-2103436-end-to-end-loading/tests/test_release437.py
          python3 repairs/dual-experience-isolation-2103420/signer_policy.py check --out SIGNER-ROUTES.json
      - uses: actions/download-artifact@v4
        with:
          run-id: 41182386594
          name: Infinity-Combined-Owner-Components-41182386594
          github-token: ${{ github.token }}
          path: protected436-components
      - uses: actions/download-artifact@v4
        with:
          run-id: 41182386594
          name: Infinity-Combined-Original-Signer-41182386594
          github-token: ${{ github.token }}
          path: protected436
      - name: Verify source and original436 inputs; authenticate Infinity module only
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          python3 repairs/infinity-2103436-end-to-end-loading/release437.py prepare \
            --bundles protected436-components --baseline protected436/Infinity-2103436-Combined-Original-Signer.apk \
            --sdk "$ANDROID_HOME/build-tools/35.0.0" --out prepared437
      - uses: actions/upload-artifact@v4
        with:
          name: Infinity437-Prepared-${{ github.run_id }}
          path: prepared437/publish/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity437-Preparation-Evidence-${{ github.run_id }}
          path: |
            SIGNER-ROUTES.json
            prepared437/*.log
            prepared437/*.json
            prepared437/*.txt
            prepared437/preservation/
          if-no-files-found: warn
          retention-days: 90
  combined:
    name: Infinity437 original-key testing APK; exact frozen436 Cobra
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work/infinity-only-from-2103436-20261031' && inputs.operation == 'final-combined'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: repairs/dual-experience-isolation-2103420
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Admit exact437 authority and sole signer before keys
        id: selected
        run: |
          set -euo pipefail
          python3 -m pip install PyYAML==6.0.3
          python3 repairs/infinity-2103436-end-to-end-loading/tests/test_release437.py
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          from release_gate import remote_authority,require
          a=remote_authority(Path('.'),os.environ['GITHUB_SHA'])
          require(a['candidate_versionCode']==2103437 and a['generation']==22,'EXACT437_AUTHORITY')
          require(a['target_owners']==['INFINITY','CHOOSER_SHELL'],'INFINITY_ONLY')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('producer_run='+str(a['owner_update_evidence']['producer_run'])+'\n')
          PYCODE
          python3 repairs/dual-experience-isolation-2103420/signer_policy.py check --out SIGNER-ROUTES.json
      - uses: actions/download-artifact@v4
        with:
          run-id: 41182386594
          name: Infinity-Combined-Original-Signer-41182386594
          github-token: ${{ github.token }}
          path: protected436
      - uses: actions/download-artifact@v4
        with:
          run-id: 39867073954
          name: Infinity-Receipt-Race-Android17-Investigation
          github-token: ${{ github.token }}
          path: tools
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.selected.outputs.producer_run }}
          name: Infinity437-Prepared-${{ steps.selected.outputs.producer_run }}
          github-token: ${{ github.token }}
          path: prepared437
      - name: Verify official artifact bytes, registered source and exact436 preservation before keys
        run: |
          set -euo pipefail
          python3 repairs/infinity-2103436-end-to-end-loading/release437.py check_registered \
            --prepared prepared437 --run-id "${{ steps.selected.outputs.producer_run }}" --out REGISTERED437-CHECK.json
          mkdir -p combined-build
          cp -r prepared437/components combined-build/
          python3 repairs/dual-experience-isolation-2103420/component_bundles.py combine \
            --bundles combined-build/components --catalog combined-build/components/catalog.json \
            --out combined-build/combined-unsigned.apk --version 2103437
          python3 - <<'PYCODE'
          from pathlib import Path
          from inventory import file_sha,load
          from release_gate import require
          require(file_sha('combined-build/combined-unsigned.apk')==load('prepared437/preservation/APK-PRESERVATION.json')['candidate_sha256'],'EXACT_VERIFIED_UNSIGNED_APK')
          PYCODE
      - name: Hard original pre-sign payload ownership and source guard
        run: |
          python3 repairs/dual-experience-isolation-2103420/release_gate.py \
            --apk combined-build/combined-unsigned.apk --jars tools/receipt-evidence/tool-jars --work gate-dex \
            --repository . --expected-head "$GITHUB_SHA" --expected-generation 22 --out SIGNING-DECISION.json
      - name: Original signer after all source and payload gates
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          python3 repairs/dual-experience-isolation-2103420/assemble.py sign \
            --apk combined-build/combined-unsigned.apk --jars tools/receipt-evidence/tool-jars --work signer-dex \
            --repository . --expected-head "$GITHUB_SHA" --expected-generation 22 \
            --sdk "$ANDROID_HOME/build-tools/35.0.0" --out signed-combined
      - name: Signed436-to-signed437 exact member and original certificate comparison
        run: |
          python3 repairs/infinity-2103436-end-to-end-loading/release437.py compare \
            --baseline protected436/Infinity-2103436-Combined-Original-Signer.apk \
            --candidate signed-combined/Infinity-2103437-Combined-Original-Signer.apk \
            --plan prepared437/PREPARATION.json --out signed-combined/preservation --sdk "$ANDROID_HOME/build-tools/35.0.0"
          cp repairs/dual-experience-isolation-2103420/release-authority.json signed-combined/
          cp SIGNING-DECISION.json REGISTERED437-CHECK.json SIGNER-ROUTES.json signed-combined/
          python3 - <<'PYCODE'
          from pathlib import Path
          from inventory import file_sha
          p=Path('combined-build/components')
          (p/'SHA256SUMS').write_text(''.join(file_sha(p/n)+'  '+n+'\n' for n in ['COBRA.zip','INFINITY.zip','MINIMAL_ANDROID_CONTRACT.zip','CHOOSER_SHELL.zip']))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: Infinity-Combined-Original-Signer-${{ github.run_id }}
          path: signed-combined/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - uses: actions/upload-artifact@v4
        with:
          name: Infinity-Combined-Owner-Components-${{ github.run_id }}
          path: combined-build/components/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity437-Signing-Evidence-${{ github.run_id }}
          path: |
            SIGNING-DECISION.json
            REGISTERED437-CHECK.json
            SIGNER-ROUTES.json
            signed-combined/preservation/
          if-no-files-found: warn
          retention-days: 90
