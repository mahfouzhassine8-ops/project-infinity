      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13495518701', run-id: '42204671979', github-token: '${{ github.token }}', path: final-parent, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13565947121', run-id: '42351486944', github-token: '${{ github.token }}', path: final-current-components, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13595626273', run-id: '42425522122', github-token: '${{ github.token }}', path: reviewed/2103464, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13594949809', run-id: '42425522122', github-token: '${{ github.token }}', path: reviewed/2103465, merge-multiple: true}
      - name: Authenticate official prepared archives before actual Java host execution
        run: |
          python3 - <<'PYVERIFY'
