          python3 repairs/infinity-final-release-462-20261107/final_release.py compare --parent final-parent/Infinity-2103462-Combined-Original-Signer.apk --candidate combined-unsigned.apk --prepared "reviewed/$SIGN_VERSION" --out unsigned-preservation
