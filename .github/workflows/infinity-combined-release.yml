      - name: Exact registered engineering-only sign request and sole signer check
        run: |
          python3 - <<'PYCHECK'
          import json,os
          from pathlib import Path
          r=json.loads(Path('repairs/infinity-final-release-462-20261107/REQUEST.json').read_text())
          a=json.loads(Path('repairs/dual-experience-isolation-2103420/release-authority.json').read_text())
          assert r['operation']=='sign-final464465' and r['publication'] is False
          assert r['version'] in (2103464,2103465) and r['version']==a['candidate_versionCode']
          assert a['generation']==(51 if r['version']==2103464 else 52)
          with Path(os.environ['GITHUB_ENV']).open('a') as f:f.write('SIGN_VERSION='+str(r['version'])+'\nSIGN_GENERATION='+str(a['generation'])+'\n')
          PYCHECK
          python3 repairs/dual-experience-isolation-2103420/signer_policy.py check --out SIGNER-ROUTES.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13495518701', run-id: '42204671979', github-token: '${{ github.token }}', path: final-parent, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13595626273', run-id: '42425522122', github-token: '${{ github.token }}', path: reviewed/2103464, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13594949809', run-id: '42425522122', github-token: '${{ github.token }}', path: reviewed/2103465, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {run-id: '39867073954', name: Infinity-Receipt-Race-Android17-Investigation, github-token: '${{ github.token }}', path: tools}
