name: Infinity combined release | owner gate before original signing
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare an exact owner candidate or sign the registered combined payload
        type: choice
        required: true
        default: final-combined
        options: [final-combined, prepare-preview451, prepare-kodi452, prepare-kodi453]
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-combined-original-key-release
  cancel-in-progress: false
jobs:
  prepare-preview451:
    name: Preview 451 owner preparation; exact450 frozen payload
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work/infinity-preview-2103450-fullscreen-display-20261102' && inputs.operation == 'prepare-preview451'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Focused release protocol and sole signer checks before key access
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 repairs/infinity-preview-2103450-fullscreen-display/test_release451.py
          python3 repairs/dual-experience-isolation-2103420/signer_policy.py check --out SIGNER-ROUTES.json
      - uses: actions/download-artifact@v4
        with:
          run-id: 41541654995
          name: Infinity-Combined-Owner-Components-41541654995
          github-token: ${{ github.token }}
          path: protected450-components
      - uses: actions/download-artifact@v4
        with:
          run-id: 41541654995
          name: Infinity-Combined-Original-Signer-41541654995
          github-token: ${{ github.token }}
          path: protected450
      - uses: actions/download-artifact@v4
        with:
          run-id: 39867073954
          name: Infinity-Receipt-Race-Android17-Investigation
          github-token: ${{ github.token }}
          path: tools
      - name: Prepare tested Preview presentation and call audio and verify exact signed450 preservation
        env:
          CARDS_TOOLS_ROOT: ${{ github.workspace }}/tools
        run: |
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar" tools/d8.jar
          python3 repairs/infinity-preview-2103450-fullscreen-display/release451.py prepare \
            --bundles protected450-components --baseline protected450/Infinity-2103450-Combined-Original-Signer.apk \
            --sdk "$ANDROID_HOME/build-tools/35.0.0" --out prepared451
      - uses: actions/upload-artifact@v4
        with:
          name: Infinity451-Prepared-${{ github.run_id }}
          path: prepared451/publish/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity451-Preparation-Evidence-${{ github.run_id }}
          path: |
            SIGNER-ROUTES.json
            prepared451/*.log
            prepared451/*.json
            prepared451/owner/*.json
            prepared451/owner-preservation/*.json
            prepared451/*.txt
            prepared451/preservation/
          if-no-files-found: warn
          retention-days: 90
  prepare-kodi452:
    name: Kodi 452 native-only owner preparation; exact451 frozen payload
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work/infinity-kodi-2103451-checkpoint-anr-20261103' && inputs.operation == 'prepare-kodi452'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Selected Kodi release contracts and sole signer check before preparation
        run: |
          set -euo pipefail
          python3 -m pip install PyYAML==6.0.3
          python3 repairs/infinity-kodi-2103451-checkpoint-anr/test_release452.py
          python3 repairs/dual-experience-isolation-2103420/signer_policy.py check --out SIGNER-ROUTES.json
          python3 repairs/infinity-kodi-2103451-checkpoint-anr/release452.py metadata --out INPUT-METADATA.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '13200361701'
          run-id: '41568721264'
          merge-multiple: true
          github-token: ${{ github.token }}
          path: protected451
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '13200925524'
          run-id: '41568721264'
          merge-multiple: true
          github-token: ${{ github.token }}
          path: protected451-components
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '13276398254'
          run-id: '41729462691'
          merge-multiple: true
          github-token: ${{ github.token }}
          path: compiled-native
      - name: Assemble only the existing compiled Kodi repair and truthful version metadata
        run: |
          python3 repairs/infinity-kodi-2103451-checkpoint-anr/release452.py prepare \
            --bundles protected451-components --baseline protected451/Infinity-2103451-Combined-Original-Signer.apk \
            --native compiled-native --sdk "$ANDROID_HOME/build-tools/35.0.0" --out prepared452
      - uses: actions/upload-artifact@v4
        with:
          name: Infinity452-Prepared-${{ github.run_id }}
          path: prepared452/publish/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity452-Preparation-Evidence-${{ github.run_id }}
          path: |
            SIGNER-ROUTES.json
            INPUT-METADATA.json
            prepared452/BASELINE-SIGNATURE.txt
            prepared452/PREPARATION.json
            prepared452/preservation/
          if-no-files-found: warn
          retention-days: 90
  prepare-kodi453:
    name: Kodi 453 native-only owner preparation; exact452 frozen payload
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work/infinity-kodi-2103453-controlled-test-20261104' && inputs.operation == 'prepare-kodi453'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Selected Kodi release contracts and sole signer check before preparation
        run: |
          set -euo pipefail
          python3 -m pip install PyYAML==6.0.3
          python3 repairs/infinity-kodi-2103453-controlled-test/test_release453.py
          python3 repairs/dual-experience-isolation-2103420/signer_policy.py check --out SIGNER-ROUTES.json
          python3 repairs/infinity-kodi-2103453-controlled-test/release453.py metadata --out INPUT-METADATA.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '13282546349'
          run-id: '41742368066'
          merge-multiple: true
          github-token: ${{ github.token }}
          path: protected452
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '13282361545'
          run-id: '41742368066'
          merge-multiple: true
          github-token: ${{ github.token }}
          path: protected452-components
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '13298763260'
          run-id: '41778685295'
          merge-multiple: true
          github-token: ${{ github.token }}
          path: compiled-native
      - name: Assemble only the existing compiled Kodi repair and truthful version metadata
        run: |
          python3 repairs/infinity-kodi-2103453-controlled-test/release453.py prepare \
            --bundles protected452-components --baseline protected452/Infinity-2103452-Combined-Original-Signer.apk \
            --native compiled-native --sdk "$ANDROID_HOME/build-tools/35.0.0" --out prepared453
      - uses: actions/upload-artifact@v4
        with:
          name: Infinity453-Prepared-${{ github.run_id }}
          path: prepared453/publish/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity453-Preparation-Evidence-${{ github.run_id }}
          path: |
            SIGNER-ROUTES.json
            INPUT-METADATA.json
            prepared453/BASELINE-SIGNATURE.txt
            prepared453/PREPARATION.json
            prepared453/preservation/
            prepared453/recovery/
          if-no-files-found: warn
          retention-days: 90
  combined:
    name: Registered combined original-key testing APK; exact owner preservation
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'final-combined' && (github.ref == 'refs/heads/work/infinity-preview-2103450-fullscreen-display-20261102' || github.ref == 'refs/heads/work/infinity-kodi-2103451-checkpoint-anr-20261103' || github.ref == 'refs/heads/work/infinity-kodi-2103453-controlled-test-20261104')
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: repairs/dual-experience-isolation-2103420
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Admit exact registered authority and sole signer before keys
        id: selected
        run: |
          set -euo pipefail
          python3 -m pip install PyYAML==6.0.3
          if [ "$GITHUB_REF" = 'refs/heads/work/infinity-kodi-2103453-controlled-test-20261104' ]; then
            python3 repairs/infinity-kodi-2103453-controlled-test/test_release453.py
          elif [ "$GITHUB_REF" = 'refs/heads/work/infinity-kodi-2103451-checkpoint-anr-20261103' ]; then
            python3 repairs/infinity-kodi-2103451-checkpoint-anr/test_release452.py
          else
            python3 repairs/infinity-preview-2103450-fullscreen-display/test_release451.py
          fi
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          from release_gate import remote_authority,require
          a=remote_authority(Path('.'),os.environ['GITHUB_SHA'])
          p453=os.environ['GITHUB_REF']=='refs/heads/work/infinity-kodi-2103453-controlled-test-20261104'
          p0=os.environ['GITHUB_REF']=='refs/heads/work/infinity-kodi-2103451-checkpoint-anr-20261103'
          version,generation,baseline,owner=(2103453,39,2103452,'INFINITY_KODI_PAUSE_STOP_PLAY') if p453 else ((2103452,38,2103451,'INFINITY_KODI_P0_NATIVE') if p0 else (2103451,37,2103450,'INFINITY_PREVIEW_FULLSCREEN_DISPLAY'))
          require(a['candidate_versionCode']==version and a['generation']==generation,'EXACT_SELECTED_AUTHORITY')
          require(a['target_owners']==['INFINITY','CHOOSER_SHELL'] and a['update_kind']=='owner_update','EXACT_OWNER_UPDATE')
          require(a['owner_update_evidence']['owner']==owner,'EXACT_APPROVED_SCOPE')
          if p0 or p453:
              require(a['owner_update_evidence']['Android']=='BLOCKED_NO_AUTHORIZED_COMPATIBLE_TARGET','TRUTHFUL_ANDROID_PENDING')
              require(a['owner_update_evidence']['native_sha256']==('d0b6f115e839fbe39e764e2fecad47418c501ab1ece853294578652cd0b80b98' if p453 else 'f89a40b5653c0091a06edd44f6ac5cdf056a649301b6751ee638c8ba88db9674'),'EXACT_COMPILED_NATIVE')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('producer_run='+str(a['owner_update_evidence']['producer_run'])+'\n')
              f.write('version='+str(version)+'\ngeneration='+str(generation)+'\nbaseline='+str(baseline)+'\n')
              f.write('baseline_run='+str(41742368066 if p453 else (41568721264 if p0 else 41541654995))+'\n')
              f.write('prepared_prefix='+('Infinity453' if p453 else ('Infinity452' if p0 else 'Infinity451'))+'\n')
          PYCODE
          python3 repairs/dual-experience-isolation-2103420/signer_policy.py check --out SIGNER-ROUTES.json
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.selected.outputs.baseline_run }}
          name: Infinity-Combined-Original-Signer-${{ steps.selected.outputs.baseline_run }}
          github-token: ${{ github.token }}
          path: protected-baseline
      - uses: actions/download-artifact@v4
        with:
          run-id: 39867073954
          name: Infinity-Receipt-Race-Android17-Investigation
          github-token: ${{ github.token }}
          path: tools
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.selected.outputs.producer_run }}
          name: ${{ steps.selected.outputs.prepared_prefix }}-Prepared-${{ steps.selected.outputs.producer_run }}
          github-token: ${{ github.token }}
          path: prepared-owner
      - name: Verify official artifact bytes, source and exact predecessor preservation before keys
        run: |
          set -euo pipefail
          python3 - "${{ steps.selected.outputs.producer_run }}" <<'PYCODE'
          import os,sys
          from pathlib import Path
          p453=os.environ['GITHUB_REF']=='refs/heads/work/infinity-kodi-2103453-controlled-test-20261104'
          p0=os.environ['GITHUB_REF']=='refs/heads/work/infinity-kodi-2103451-checkpoint-anr-20261103'
          sys.path.insert(0,'repairs/infinity-kodi-2103453-controlled-test' if p453 else ('repairs/infinity-kodi-2103451-checkpoint-anr' if p0 else 'repairs/infinity-preview-2103450-fullscreen-display'))
          if p453: import release453 as r
          elif p0: import release452 as r
          else: import release451 as r
          r.check_registered(Path('prepared-owner'),int(sys.argv[1]),Path('REGISTERED-CANDIDATE-CHECK.json'))
          PYCODE
          mkdir -p combined-build
          cp -r prepared-owner/components combined-build/
          python3 repairs/dual-experience-isolation-2103420/component_bundles.py combine \
            --bundles combined-build/components --catalog combined-build/components/catalog.json \
            --out combined-build/combined-unsigned.apk --version "${{ steps.selected.outputs.version }}"
          python3 - <<'PYCODE'
          from inventory import file_sha,load
          from release_gate import require
          require(file_sha('combined-build/combined-unsigned.apk')==load('prepared-owner/preservation/APK-PRESERVATION.json')['candidate_sha256'],'EXACT_VERIFIED_UNSIGNED_APK')
          PYCODE
      - name: Hard original pre-sign payload ownership and source guard
        run: |
          python3 repairs/dual-experience-isolation-2103420/release_gate.py \
            --apk combined-build/combined-unsigned.apk --jars tools/receipt-evidence/tool-jars --work gate-dex \
            --repository . --expected-head "$GITHUB_SHA" --expected-generation "${{ steps.selected.outputs.generation }}" --out SIGNING-DECISION.json
      - name: Original signer after all source and payload gates
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          python3 repairs/dual-experience-isolation-2103420/assemble.py sign \
            --apk combined-build/combined-unsigned.apk --jars tools/receipt-evidence/tool-jars --work signer-dex \
            --repository . --expected-head "$GITHUB_SHA" --expected-generation "${{ steps.selected.outputs.generation }}" \
            --sdk "$ANDROID_HOME/build-tools/35.0.0" --out signed-combined
      - name: Signed predecessor-to-candidate exact member and original certificate comparison
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = 'refs/heads/work/infinity-kodi-2103453-controlled-test-20261104' ]; then
            python3 repairs/infinity-kodi-2103453-controlled-test/release453.py compare \
              --baseline protected-baseline/Infinity-2103452-Combined-Original-Signer.apk \
              --candidate signed-combined/Infinity-2103453-Combined-Original-Signer.apk \
              --out signed-combined/preservation --sdk "$ANDROID_HOME/build-tools/35.0.0"
            cp -r prepared-owner/recovery signed-combined/
          elif [ "$GITHUB_REF" = 'refs/heads/work/infinity-kodi-2103451-checkpoint-anr-20261103' ]; then
            python3 repairs/infinity-kodi-2103451-checkpoint-anr/release452.py compare \
              --baseline protected-baseline/Infinity-2103451-Combined-Original-Signer.apk \
              --candidate signed-combined/Infinity-2103452-Combined-Original-Signer.apk \
              --out signed-combined/preservation --sdk "$ANDROID_HOME/build-tools/35.0.0"
          else
            python3 repairs/infinity-preview-2103450-fullscreen-display/release451.py compare \
              --baseline protected-baseline/Infinity-2103450-Combined-Original-Signer.apk \
              --candidate signed-combined/Infinity-2103451-Combined-Original-Signer.apk \
              --plan prepared-owner/PREPARATION.json --out signed-combined/preservation --sdk "$ANDROID_HOME/build-tools/35.0.0"
          fi
          cp repairs/dual-experience-isolation-2103420/release-authority.json signed-combined/
          cp SIGNING-DECISION.json REGISTERED-CANDIDATE-CHECK.json SIGNER-ROUTES.json signed-combined/
          cp prepared-owner/PREPARATION.json signed-combined/
          python3 - <<'PYCODE'
          from pathlib import Path
          from inventory import file_sha,load,save
          p=Path('combined-build/components')
          (p/'SHA256SUMS').write_text(''.join(file_sha(p/n)+'  '+n+'\n' for n in ['COBRA.zip','INFINITY.zip','MINIMAL_ANDROID_CONTRACT.zip','CHOOSER_SHELL.zip']))
          evidence=load('prepared-owner/PREPARATION.json')
          save('signed-combined/VERIFICATION-STATUS.json',dict(Android=evidence['Android'],physical_Fold='PENDING',application_tests_run_in_packaging=False,shutdown_tests_run_in_packaging=False,accepted_pointer_updated=False))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: Infinity-Combined-Original-Signer-${{ github.run_id }}
          path: signed-combined/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - uses: actions/upload-artifact@v4
        with:
          name: Infinity-Combined-Owner-Components-${{ github.run_id }}
          path: combined-build/components/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-Combined-Signing-Evidence-${{ github.run_id }}
          path: |
            SIGNING-DECISION.json
            REGISTERED-CANDIDATE-CHECK.json
            SIGNER-ROUTES.json
            signed-combined/preservation/
          if-no-files-found: warn
          retention-days: 90
