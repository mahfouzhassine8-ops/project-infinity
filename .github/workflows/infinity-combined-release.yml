          sys.path.insert(0,'repairs/dual-experience-isolation-2103420')
          from inventory import file_sha,load
          assert file_sha('combined-unsigned.apk')==load(Path('reviewed')/os.environ['SIGN_VERSION']/'PREPARATION.json')['unsigned_sha256']
