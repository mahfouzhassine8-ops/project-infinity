        run: python3 repairs/dual-experience-isolation-2103420/assemble.py sign --apk combined-unsigned.apk --jars tools/receipt-evidence/tool-jars --work signer-dex --repository . --expected-head "$GITHUB_SHA" --expected-generation "$SIGN_GENERATION" --sdk "$ANDROID_HOME/build-tools/35.0.0" --out signed-combined
      - name: Every signed member, permanent certificate and source-bound engineering receipt
        run: |
          python3 repairs/infinity-final-release-462-20261107/final_release.py compare --parent final-parent/Infinity-2103462-Combined-Original-Signer.apk --candidate "signed-combined/Infinity-$SIGN_VERSION-Combined-Original-Signer.apk" --prepared "reviewed/$SIGN_VERSION" --out signed-combined/preservation --sdk "$ANDROID_HOME/build-tools/35.0.0"
          cp SIGNING-DECISION.json REGISTERED-CANDIDATE-CHECK.json SIGNER-ROUTES.json signed-combined/
