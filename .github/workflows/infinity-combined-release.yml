        with:
          name: Infinity451-Prepared-${{ github.run_id }}
          path: prepared451/publish/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity451-Preparation-Evidence-${{ github.run_id }}
          path: |
            SIGNER-ROUTES.json
            prepared451/*.log
            prepared451/*.json
            prepared451/owner/*.json
