name: Infinity combined release | owner gate before original signing
on:
  push:
    branches: [work/infinity-final-release-462-20261107, work/infinity-tracking-integration-20261108]
    paths: [repairs/infinity-final-release-462-20261107/REQUEST.json, repairs/infinity-tracking-integration-2103469-20261108/MODULE-REQUEST.json]
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare an exact owner candidate or sign the registered combined payload
        type: choice
        required: true
        default: final-combined
        options: [final-combined, prepare-preview451, prepare-kodi452, prepare-kodi453, prepare-ui454-455, prepare-controlled456-457, review-controlled456-457, prepare-browser458-459, review-browser458-459, prepare-six460-461, review-six460-461, package-nine-quick-updates, verify-nine-update-recovery, prepare-nine-native462-463, package-umbrella-pov-462, verify-three-native, prepare-three, sign-three, watchlist-verify-native, prepare-watchlist, sign-watchlist, publish-watchlist, prepare-tracking-modules, prepare-tracking-release, sign-tracking]
      prepared_run:
        description: Completed official controlled preparation run for read-only authority review
        type: string
        required: false
        default: "0"
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-combined-original-key-release
  cancel-in-progress: false
jobs:
  final464465-preflight:
    name: Exact462 final consolidation scope and existing signer policy before keys
    if: github.event_name == 'push' && github.ref == 'refs/heads/work/infinity-final-release-462-20261107' && startsWith(github.event.head_commit.message, 'Prepare final464465:')
    runs-on: ubuntu-22.04
    permissions: {contents: read, actions: write}
    timeout-minutes: 20
    env: {GH_TOKEN: '${{ github.token }}', PYTHONDONTWRITEBYTECODE: '1'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - name: Verify selected preparation and record actual workflow-policy inventory
        run: |
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          out=Path('final-preflight');out.mkdir()
          (out/'SOURCE.json').write_text(json.dumps({'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'status':'PREFLIGHT_STARTED_NO_KEYS'},indent=2)+'\n')
          request=json.loads(Path('repairs/infinity-final-release-462-20261107/REQUEST.json').read_text())
          assert request['operation']=='prepare-final464465' and request['publication'] is False
          import hashlib
          authority=json.loads(Path('repairs/dual-experience-isolation-2103420/release-authority.json').read_text())
          for path,want in authority['source_files'].items():
            if path=='repairs/dual-experience-isolation-2103420/signer-policy.json':
              old=json.loads(subprocess.check_output(['git','show','776e2e4:'+path],text=True))
              actual=json.loads(Path(path).read_text())
              review=json.loads(Path('repairs/infinity-final-release-462-20261107/WORKFLOW-REVIEW.json').read_text())
              assert {r['id'] for r in review['reviewed']}=={410227798,410317730,410707721,410565232,410705046,410710260,410690287,410686341,410239306,410333805}
              expected=json.loads(json.dumps(old))
              expected['reviewed_workflow_ids']=sorted(set(old['reviewed_workflow_ids'])|{r['id'] for r in review['reviewed']})
              for r in review['reviewed']:
                assert r['APK_signing'] is False
                assert r['original_key_access']==(r['id'] in (410707721,410710260))
                item={k:r[k] for k in ['id','path','source','workflow_sha256','original_key_access']};item['review_role']=r['role']
                expected['retired_original_key_workflows' if r['original_key_access'] else 'additional_unsigned_owner_workflows'].append(item)
              assert actual==expected and actual['sole_original_key_workflow_id']==397702717,'ONLY_REVIEWED_AUDIT_CATALOG_UPDATE_ALLOWED'
              continue
            assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==want,'PROTECTED_RELEASE_SOURCE_CHANGED:'+path
          for path in ['repairs/infinity-final-closure-2103407/SignInfinityModules.java','repairs/infinity-final-closure-2103407/ORIGINAL-INFINITY-PUBLIC-KEY.pem']:
            original=subprocess.check_output(['git','show','776e2e4:'+path])
            assert Path(path).read_bytes()==original,'ORIGINAL_MODULE_SIGNER_CHANGED:'+path
          workflow='.github/workflows/infinity-combined-release.yml'
          previous=subprocess.check_output(['git','show','776e2e4:'+workflow],text=True)
          current=Path(workflow).read_text()
          assert previous.splitlines()[previous.splitlines().index('  prepare-preview451:'):]==current.splitlines()[current.splitlines().index('  prepare-preview451:'):],'EXISTING_ORIGINAL_SIGNER_JOBS_CHANGED'
          policy=json.loads(Path('repairs/dual-experience-isolation-2103420/signer-policy.json').read_text())
          workflows=[]
          for page in range(1,21):
            rows=json.loads(subprocess.check_output(['gh','api','repos/mahfouzhassine8-ops/project-infinity/actions/workflows?per_page=100&page='+str(page)],text=True))['workflows']
            workflows+=rows
            if len(rows)<100:break
          known=set(policy['reviewed_workflow_ids'])
          unknown=[dict(id=r['id'],name=r['name'],path=r['path'],state=r['state']) for r in workflows if r['state']=='active' and r['id'] not in known]
          (out/'WORKFLOW-POLICY-INVENTORY.json').write_text(json.dumps({'unknown_active_workflows':unknown,'sole_original_signer':policy['sole_original_key_workflow_id']},indent=2)+'\n')
          print(json.dumps({'unreviewed_active_workflows':unknown}))
          PY
          python3 repairs/dual-experience-isolation-2103420/signer_policy.py retire --out final-preflight/SIGNER-ROUTES.json
      - name: Audit unused exact candidate and forward-recovery version codes
        run: python3 repairs/infinity-final-release-462-20261107/prepare_release.py versions final-preflight/VERSION-AVAILABILITY.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'Infinity464465-Policy-Version-Preflight-${{ github.run_id }}-NO-KEY-NO-APK', path: final-preflight/, if-no-files-found: error, retention-days: 30}
  final464465-prepare:
    name: Current components and native engine consolidation through existing module signer
    needs: final464465-preflight
    if: github.event_name == 'push' && needs.final464465-preflight.result == 'success' && github.ref == 'refs/heads/work/infinity-final-release-462-20261107'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env: {GH_TOKEN: '${{ github.token }}', PYTHONDONTWRITEBYTECODE: '1'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13495518701', run-id: '42204671979', github-token: '${{ github.token }}', path: final-parent, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13494984568', run-id: '42204671979', github-token: '${{ github.token }}', path: final-parent-bundles, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13565947121', run-id: '42351486944', github-token: '${{ github.token }}', path: final-current-components, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13586082418', run-id: '42401805296', github-token: '${{ github.token }}', path: final-native, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '13571276665', run-id: '42364232328', github-token: '${{ github.token }}', path: final-original-map, merge-multiple: true}
      - name: Exact signed parent, current component authentication and bounded metadata before keys
        run: |
          python3 repairs/infinity-final-release-462-20261107/prepare_release.py inputs --apk final-parent/Infinity-2103462-Combined-Original-Signer.apk --bundles final-parent-bundles --current final-current-components --native final-native --review final-original-map --sdk "$ANDROID_HOME/build-tools/35.0.0" --out final-prepared
      - name: Existing original module signer on strictly bounded .62 and .63 manifests
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess,tempfile
          from pathlib import Path
          import sys
          sys.path.insert(0,'repairs/dual-experience-isolation-2103420')
          from signer_policy import check
          check(json.loads(Path('repairs/dual-experience-isolation-2103420/signer-policy.json').read_text()))
          proof=json.loads(Path('final-prepared/INPUTS-VERIFIED.json').read_text())
          assert proof['source']==os.environ['GITHUB_SHA']
          assert proof['status']=='PASS_EXACT_AUTHENTICATED_INPUTS_AND_BOUNDED_GENERATED_METADATA'
          first=Path('repairs/infinity-final-closure-2103407')
          with tempfile.TemporaryDirectory(prefix='infinity-original-module-sign-') as temporary:
            temp=Path(temporary);key=temp/'original.jks'
            key.write_bytes(base64.b64decode(os.environ['INFINITY_KEYSTORE_B64'],validate=True));key.chmod(0o600)
            classes=temp/'classes';classes.mkdir()
            subprocess.run(['javac','--release','8','-g:none','-d',str(classes),str(first/'SignInfinityModules.java')],check=True)
            env={n:os.environ[n] for n in ('PATH','JAVA_HOME','INFINITY_STORE_PASSWORD','INFINITY_KEY_PASSWORD','INFINITY_KEY_ALIAS')}
            for version in (2103464,2103465):
              root=Path('final-prepared')/str(version)/'addons'
              pins=json.loads((root.parent/'INPUTS.json').read_text())['source_files']
              actual={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
              assert actual==pins,'STAGED_SOURCE_CHANGED_BEFORE_ORIGINAL_KEY_ACCESS'
              subprocess.run(['java','-cp',str(classes),'SignInfinityModules',str(key),str(root/'script.infinity.commandcenter/INFINITY-MODULES.v1')],env=env,check=True)
          PY
      - name: Original owner bundle assembly and exact complete APK member comparison
        run: python3 repairs/infinity-final-release-462-20261107/prepare_release.py finish --apk final-parent/Infinity-2103462-Combined-Original-Signer.apk --bundles final-parent-bundles --native final-native --out final-prepared
      - uses: actions/upload-artifact@v4
        with: {name: 'Infinity2103464-Prepared-${{ github.run_id }}', path: final-prepared/2103464/publish/, if-no-files-found: error, retention-days: 90}
      - uses: actions/upload-artifact@v4
        with: {name: 'Infinity2103465-Prepared-${{ github.run_id }}', path: final-prepared/2103465/publish/, if-no-files-found: error, retention-days: 90}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Infinity464465-Consolidation-Preparation-Evidence-${{ github.run_id }}-NOT-RELEASE
          path: |
            final-prepared/*.json
            final-prepared/*.txt
            final-prepared/2103464/INPUTS.json
            final-prepared/2103465/INPUTS.json
          if-no-files-found: warn
          retention-days: 30
