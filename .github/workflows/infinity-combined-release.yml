name: Infinity combined release | owner gate before original signing
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare scoped Infinity external-request446 or sign its exact reviewed combined candidate
        type: choice
        required: true
        default: final-combined
        options: [final-combined, prepare-external446]
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-combined-original-key-release
  cancel-in-progress: false
jobs:
  prepare-external446:
    name: Infinity external-request446 owner preparation; frozen Cobra445 and shared payload
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work/infinity-2103445-external-video-lifecycle-20261101' && inputs.operation == 'prepare-external446'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Focused release protocol and sole signer checks before key access
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 repairs/infinity-2103445-external-video-lifecycle/tests/test_release446.py
          python3 repairs/dual-experience-isolation-2103420/signer_policy.py check --out SIGNER-ROUTES.json
      - uses: actions/download-artifact@v4
        with:
          run-id: 41349763470
          name: Infinity-Combined-Owner-Components-41349763470
          github-token: ${{ github.token }}
          path: protected445-components
      - uses: actions/download-artifact@v4
        with:
          run-id: 41349763470
          name: Infinity-Combined-Original-Signer-41349763470
          github-token: ${{ github.token }}
          path: protected445
      - uses: actions/download-artifact@v4
        with:
          run-id: 39867073954
          name: Infinity-Receipt-Race-Android17-Investigation
          github-token: ${{ github.token }}
          path: tools
      - name: Rebuild exact host-tested Infinity DEX and compare signed445 preservation
        run: |
          set -euo pipefail
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar" tools/d8.jar
          sudo mkdir -p /workspace/cobra-evidence
          sudo ln -s "$GITHUB_WORKSPACE/tools" /workspace/cobra-evidence/tools
          mkdir -p /tmp/cobra445-prepared/components
          cp protected445-components/INFINITY.zip /tmp/cobra445-prepared/components/INFINITY.zip
          python3 repairs/infinity-2103445-external-video-lifecycle/release446.py prepare \
            --bundles protected445-components --baseline protected445/Infinity-2103445-Combined-Original-Signer.apk \
            --sdk "$ANDROID_HOME/build-tools/35.0.0" --out prepared446
      - uses: actions/upload-artifact@v4
        with:
          name: Infinity446-Prepared-${{ github.run_id }}
          path: prepared446/publish/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity446-Preparation-Evidence-${{ github.run_id }}
          path: |
            SIGNER-ROUTES.json
            prepared446/*.log
            prepared446/*.json
            prepared446/owner/*.json
            prepared446/*.txt
            prepared446/preservation/
          if-no-files-found: warn
          retention-days: 90
  combined:
    name: Infinity external-request446 original-key testing APK; frozen Cobra445
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work/infinity-2103445-external-video-lifecycle-20261101' && inputs.operation == 'final-combined'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: repairs/dual-experience-isolation-2103420
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Admit exact446 authority and sole signer before keys
        id: selected
        run: |
          set -euo pipefail
          python3 -m pip install PyYAML==6.0.3
          python3 repairs/infinity-2103445-external-video-lifecycle/tests/test_release446.py
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          from release_gate import remote_authority,require
          a=remote_authority(Path('.'),os.environ['GITHUB_SHA'])
          require(a['candidate_versionCode']==2103446 and a['generation']==33,'EXACT446_AUTHORITY')
          require(a['target_owners']==['INFINITY','CHOOSER_SHELL'] and a['update_kind']=='owner_update','EXACT446_INFINITY_OWNER_UPDATE')
          require(a['owner_update_evidence']['owner']=='INFINITY_EXTERNAL_REQUEST_RACE','APPROVED_REQUEST_RACE_ONLY')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('producer_run='+str(a['owner_update_evidence']['producer_run'])+'\n')
          PYCODE
          python3 repairs/dual-experience-isolation-2103420/signer_policy.py check --out SIGNER-ROUTES.json
      - uses: actions/download-artifact@v4
        with:
          run-id: 41349763470
          name: Infinity-Combined-Original-Signer-41349763470
          github-token: ${{ github.token }}
          path: protected445
      - uses: actions/download-artifact@v4
        with:
          run-id: 39867073954
          name: Infinity-Receipt-Race-Android17-Investigation
          github-token: ${{ github.token }}
          path: tools
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.selected.outputs.producer_run }}
          name: Infinity446-Prepared-${{ steps.selected.outputs.producer_run }}
          github-token: ${{ github.token }}
          path: prepared446
      - name: Verify official artifact bytes, registered source and exact445 preservation before keys
        run: |
          set -euo pipefail
          python3 - "${{ steps.selected.outputs.producer_run }}" <<'PYCODE'
          import sys
          from pathlib import Path
          sys.path.insert(0,'repairs/infinity-2103445-external-video-lifecycle')
          import release446 as r
          r.check_registered(Path('prepared446'),int(sys.argv[1]),Path('REGISTERED446-CHECK.json'))
          PYCODE
          mkdir -p combined-build
          cp -r prepared446/components combined-build/
          python3 repairs/dual-experience-isolation-2103420/component_bundles.py combine \
            --bundles combined-build/components --catalog combined-build/components/catalog.json \
            --out combined-build/combined-unsigned.apk --version 2103446
          python3 - <<'PYCODE'
          from pathlib import Path
          from inventory import file_sha,load
          from release_gate import require
          require(file_sha('combined-build/combined-unsigned.apk')==load('prepared446/preservation/APK-PRESERVATION.json')['candidate_sha256'],'EXACT_VERIFIED_UNSIGNED_APK')
          PYCODE
      - name: Hard original pre-sign payload ownership and source guard
        run: |
          python3 repairs/dual-experience-isolation-2103420/release_gate.py \
            --apk combined-build/combined-unsigned.apk --jars tools/receipt-evidence/tool-jars --work gate-dex \
            --repository . --expected-head "$GITHUB_SHA" --expected-generation 33 --out SIGNING-DECISION.json
      - name: Original signer after all source and payload gates
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          python3 repairs/dual-experience-isolation-2103420/assemble.py sign \
            --apk combined-build/combined-unsigned.apk --jars tools/receipt-evidence/tool-jars --work signer-dex \
            --repository . --expected-head "$GITHUB_SHA" --expected-generation 33 \
            --sdk "$ANDROID_HOME/build-tools/35.0.0" --out signed-combined
      - name: Signed445-to-signed446 exact member and original certificate comparison
        run: |
          python3 repairs/infinity-2103445-external-video-lifecycle/release446.py compare \
            --baseline protected445/Infinity-2103445-Combined-Original-Signer.apk \
            --candidate signed-combined/Infinity-2103446-Combined-Original-Signer.apk \
            --plan prepared446/PREPARATION.json --out signed-combined/preservation --sdk "$ANDROID_HOME/build-tools/35.0.0"
          cp repairs/dual-experience-isolation-2103420/release-authority.json signed-combined/
          cp SIGNING-DECISION.json REGISTERED446-CHECK.json SIGNER-ROUTES.json signed-combined/
          cp prepared446/OWNER-PRESERVATION.json prepared446/PREPARATION.json signed-combined/
          python3 - <<'PYCODE'
          from pathlib import Path
          from inventory import file_sha
          p=Path('combined-build/components')
          (p/'SHA256SUMS').write_text(''.join(file_sha(p/n)+'  '+n+'\n' for n in ['COBRA.zip','INFINITY.zip','MINIMAL_ANDROID_CONTRACT.zip','CHOOSER_SHELL.zip']))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: Infinity-Combined-Original-Signer-${{ github.run_id }}
          path: signed-combined/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - uses: actions/upload-artifact@v4
        with:
          name: Infinity-Combined-Owner-Components-${{ github.run_id }}
          path: combined-build/components/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity446-Signing-Evidence-${{ github.run_id }}
          path: |
            SIGNING-DECISION.json
            REGISTERED446-CHECK.json
            SIGNER-ROUTES.json
            signed-combined/preservation/
          if-no-files-found: warn
          retention-days: 90
