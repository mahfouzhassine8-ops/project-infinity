name: Infinity | Background Resume RC1
on:
  workflow_dispatch:
  push:
    branches: [infinity-cobra-background-resume-rc1]
    paths:
      - '.github/workflows/infinity-background-resume.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-background-resume-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      NDK_VER: 21.4.7075529
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Preserve exact source snapshots
        run: |
          mkdir -p background-audit
          git archive --format=zip --output=background-audit/baseline-source.zip 2674c05e605afbf19a2fe54bdab1a552e76ec394
          git archive --format=zip --output=background-audit/postponed-background-source.zip 7abb31b47756f2faf4e8688e515f8cb52a40565f
          sha256sum background-audit/*-source.zip > background-audit/source-sha256.txt
      - name: Reconstruct and test successful APK source without native rebuild
        run: bash scripts/infinity_live_app_ci_1.sh
      - name: Export Android source for isolated background audit
        if: success()
        run: |
          zip -q -r background-audit/android-source.zip kodi/tools/android/packaging/xbmc kodi/cmake/scripts/android/Install.cmake engine preflight
          cp "$ANDROID_HOME/platforms/android-35/android.jar" background-audit/android-35.jar
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-Background-Resume-Source-Audit
          path: background-audit/
          if-no-files-found: error
          retention-days: 90
