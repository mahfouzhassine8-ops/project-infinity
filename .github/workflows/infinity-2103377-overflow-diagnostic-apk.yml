name: Infinity | 2103377 package green overflow diagnostic
on:
  push:
    branches: [work/infinity-2103377-overflow-diagnostic-apk]
    paths:
      - '.github/workflows/infinity-2103377-overflow-diagnostic-apk.yml'
permissions: {contents: read, actions: read}
concurrency: {group: infinity-2103377-shutdown-wide-package, cancel-in-progress: false}
env:
  NDK_VER: 21.4.7075529
jobs:
  package-verified-engine:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-${{ runner.os }}-21.4.7075529-v1
      - run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - uses: actions/download-artifact@v8
        with:
          run-id: 38401246574
          name: Infinity-2103377-Shutdown-Wide-Native-Internal
          github-token: ${{ github.token }}
          path: verified-engine
      - uses: actions/download-artifact@v8
        with:
          run-id: 38401246574
          name: Infinity-2103377-Shutdown-Wide-Evidence
          github-token: ${{ github.token }}
          path: verified-native-evidence
      - uses: actions/download-artifact@v8
        with:
          run-id: 38323908660
          name: Cobra-2103376-Critical-Preview-Signed-Test-APK
          github-token: ${{ github.token }}
          path: protected-2103376-apk
      - name: Verify exact green engine and all preserved source checkpoints
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          evidence=Path('verified-native-evidence/checkpoint-build')
          proof=json.loads((evidence/'ENGINE-PROOF.json').read_text())
          assert proof['source_commit']=='9e67d3406f1e9fbc91e3fd1a1eeda94e4b73deb9'
          assert proof['complete_native_engine_compiled'] and proof['four_diagnostic_capabilities_implemented'] and not proof['final_2103377_repair']
          assert proof['vfs_trace_compiled'] and not proof['shutdown_corrected']
          engine=Path('verified-engine/libkodi.so')
          assert hashlib.sha256(engine.read_bytes()).hexdigest()==proof['native_sha256']
          native_tests=json.loads((evidence/'vfs-trace-tests/VFS-TRACE-TESTS.json').read_text())
          assert native_tests['passed'] and native_tests['count']==18 and all(native_tests['capabilities'].values())
          source_tests=json.loads((evidence/'vfs-source-tests/VFS-SOURCE-CAPABILITIES.json').read_text())
          assert source_tests['passed'] and source_tests['concrete_classifier_types']==29
          overflow=json.loads((evidence/'overflow-tests/OVERFLOW-VERIFICATION.json').read_text())
          assert overflow['passed'] and overflow['count']==3
          assert all(case['passed'] and case['critical_bytes']<2097152 for case in overflow['cases'])
          assert not overflow['shutdown_repaired'] and not overflow['shutdown_timeouts_changed']
          host=json.loads(Path('repairs/shutdown-wide-trace-2103377/HOST-VERIFICATION.json').read_text())
          saved=json.loads((evidence/'SAVED-274-CANDIDATE-PRESERVATION.json').read_text())
          targeted=json.loads((evidence/'TARGETED-DIAGNOSTIC-PRESERVATION.json').read_text())
          for manifest in [host['source_files'],saved['candidate_files'],targeted['source_files']]:
              for name,digest in manifest.items():
                  assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          assert saved['exact_hashes_preserved'] and saved['tests']==274
          subprocess.run(['git','merge-base','--is-ancestor',proof['source_commit'],'HEAD'],check=True)
          delta=subprocess.check_output(['git','diff','--name-only',proof['source_commit'],'HEAD'],text=True).splitlines()
          assert delta==['.github/workflows/infinity-2103377-overflow-diagnostic-apk.yml'],delta
          print('PASS: exact green overflow-fix engine, 18 diagnostic tests, 3 overflow scenarios, four capabilities, 274-test source and original targeted diagnostic preserved. No engine recompilation.')
          PY
      - name: Permanently sign diagnostic and verify locked payload preservation
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          python3 repairs/shutdown-wide-trace-2103377/package_diagnostic.py --parent protected-2103376-apk/Cobra-2103376-Critical-Preview-RC1.apk --engine verified-engine/libkodi.so --evidence verified-native-evidence/checkpoint-build --out shutdown-wide-package
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103377-Overflow-Fixed-Wide-Diagnostic-Signed-APK
          path: |
            shutdown-wide-package/Infinity-2103377-Shutdown-Wide-Diagnostic-RC1.apk
            shutdown-wide-package/SCOPE.txt
          retention-days: 90
          if-no-files-found: error
      - name: Preserve packaging receipts
        if: always()
        run: |
          mkdir -p shutdown-wide-package
          git rev-parse HEAD > shutdown-wide-package/PACKAGING-COMMIT.txt
          printf '%s\n' 'Exact green native run 38401246574; diagnostic overflow capture fixed and tested on host. DIAGNOSTIC ONLY: shutdown is not repaired. Locked 2103376, skin 1.0.5.211 and accepted lifecycle work are preserved.' > shutdown-wide-package/RELEASE-SCOPE.txt
          cp repairs/shutdown-wide-trace-2103377/README.md shutdown-wide-package/DIAGNOSTIC-COVERAGE.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103377-Overflow-Fixed-Wide-Diagnostic-Verification
          path: |
            shutdown-wide-package/*.json
            shutdown-wide-package/*.txt
            shutdown-wide-package/*.md
            verified-native-evidence/checkpoint-build/ENGINE-PROOF.json
            verified-native-evidence/checkpoint-build/overflow-tests/OVERFLOW-VERIFICATION.json
            verified-native-evidence/checkpoint-build/SAVED-274-CANDIDATE-PRESERVATION.json
            verified-native-evidence/checkpoint-build/TARGETED-DIAGNOSTIC-PRESERVATION.json
            verified-native-evidence/checkpoint-build/VFS-TRACE-PRESERVATION.json
            verified-native-evidence/checkpoint-build/vfs-trace-tests/VFS-TRACE-TESTS.json
            verified-native-evidence/checkpoint-build/vfs-source-tests/VFS-SOURCE-CAPABILITIES.json
          retention-days: 90
          if-no-files-found: error
