name: Infinity | 2103221 Drawer Owner + UI Restore

on:
  workflow_dispatch:
  push:
    branches: [infinity-cobra-2103221-drawer-owner-ui-restore-rc1]
    paths:
      - '.github/workflows/infinity-2103221-drawer-owner-ui-restore.yml'
      - 'repairs/drawer-owner-ui-restore-2103221/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: infinity-2103221-${{ github.sha }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: platform-tools}

      - name: Download exact 2103208 source parent
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103208-Integration-Polish-TEST-CANDIDATE-Replica-1-Attempt-1
          run-id: 35676573761
          github-token: ${{ github.token }}
          path: baseline208

      - name: Download preserved 2103209 native engine
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103209-Python311-GIL-Native-Engine
          run-id: 35693288744
          github-token: ${{ github.token }}
          path: native209

      - name: Download exact passed 2103217 candidate for preservation gate
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103217-Media-Return-Context-TEST-CANDIDATE
          run-id: 35719901011
          github-token: ${{ github.token }}
          path: parent217

      - name: Reconstruct exact locked 2103217
        run: |
          set -euo pipefail
          mkdir -p audit221 engine
          cp native209/pythoninvoker-threadstate-v2-source.json engine/pythoninvoker-threadstate-v2-source.json
          cp native209/pythoninvoker-threadstate-v2-source.stage1.json engine/pythoninvoker-threadstate-v2-source.stage1.json
          python3 repairs/python311-gil-2103209/ci.py prepare             --base-dir baseline208             --native-apk native209/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2-Engine-Base.apk             --shell shell-kodi             --out audit221/base
          python3 repairs/cobra-media-library-health-2103210/apply.py --shell shell-kodi
          python3 repairs/cobra-library-health-2103211/apply.py --shell shell-kodi
          python3 repairs/health-media-trim-2103212/apply.py --shell shell-kodi
          python3 repairs/live-blue-ambient-settings-return-2103213/apply.py --shell shell-kodi
          python3 repairs/media-details-final-2103214/apply.py --shell shell-kodi
          python3 repairs/smart-return-experience-drawer-2103215/apply.py --shell shell-kodi
          python3 repairs/smart-return-experience-display-2103216/apply.py --shell shell-kodi
          python3 repairs/media-return-context-2103217/apply.py --shell shell-kodi
          grep -F '"version_code": 2103217' engine/background-resume-source.json

      - name: Apply only drawer ownership + approved chooser settings restoration
        run: |
          set -euo pipefail
          python3 repairs/drawer-owner-ui-restore-2103221/apply.py --shell shell-kodi
          JAVA=shell-kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          SPLASH=shell-kodi/tools/android/packaging/xbmc/src/Splash.java.in
          grep -F 'COBRA_DRAWER_OWNER_PREF' "$JAVA"
          grep -F 'cobraHandleDrawerOwnedBack()' "$JAVA"
          grep -F 'cobraSelectDrawerOwner(destination);' "$JAVA"
          grep -F 'new CobraVisualRenderer.DialogBuilder(this,vtheme(),"chooser.settings")' "$SPLASH"
          grep -F 'new CobraVisualRenderer.DialogBuilder(this,vtheme(),"chooser.recovery")' "$SPLASH"
          ! sed -n '/private void showExperienceCardSettings/,/private void showInfinityExperienceChooser/p' "$SPLASH" | grep -F 'new android.app.AlertDialog.Builder'
          grep -F '"smart_return_untouched": true' engine/background-resume-source.json

      - name: Build sign and verify
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v             -keystore "$HOME/.android/debug.keystore"             -storepass android -alias androiddebugkey -keypass android             -dname "CN=Android Debug,O=Android,C=US"             -keyalg RSA -keysize 2048 -validity 10000
          python3 scripts/package_background_resume.py             --source shell-kodi             --base-apk audit221/base/Infinity-2103208-Python311-GIL-Patched-Base.apk             --build-dir build221             --out signed221
          python3 repairs/drawer-owner-ui-restore-2103221/verify.py             --apk signed221/Infinity-1.0.9-Cobra-Drawer-Owner-UI-Restore-RC1.apk             --parent217 parent217/Infinity-1.0.9-Cobra-Media-Return-Context-RC1.apk             --audit signed221/background-resume-apk-audit.json             --scope audit221/scope.json

      - name: Publish 2103221 TEST CANDIDATE
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103221-Drawer-Owner-UI-Restore-TEST-CANDIDATE
          path: signed221/
          compression-level: 0
          retention-days: 90

      - name: Preserve 2103221 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103221-Drawer-Owner-UI-Restore-Evidence
          path: |
            audit221/
            engine/background-resume-source.json
            repairs/drawer-owner-ui-restore-2103221/
            signed221/*.json
            signed221/*.txt
          if-no-files-found: warn
          retention-days: 90
