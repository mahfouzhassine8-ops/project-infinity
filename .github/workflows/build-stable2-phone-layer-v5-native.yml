name: Infinity Stable 2 Phone Layer v5 Native

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-stable2-phone-layer-v5-native.yml'
      - 'scripts/patch-native-pip-v5.py'
      - 'scripts/patch-phone-layer-v4.py'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;33.0.1' 'ndk;21.4.7075529'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            autoconf bison build-essential curl flex gawk git gperf \
            lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev \
            unzip zip zlib1g-dev python3 ccache

      - name: Clone exact Kodi 21.2 source
        run: |
          git clone --depth=1 --branch infinity-pip-v5-omega-21.2 \
            https://github.com/mahfouzhassine8-ops/xbmc.git /tmp/xbmc
          grep -q 'VERSION_MAJOR 21' /tmp/xbmc/version.txt
          grep -q 'VERSION_MINOR 2' /tmp/xbmc/version.txt

      - name: Patch Kodi native PiP resize path
        run: python3 scripts/patch-native-pip-v5.py

      - name: Verify native source patch
        run: |
          grep -q 'Infinity PiP native window resized' /tmp/xbmc/xbmc/platform/android/activity/XBMCApp.cpp
          grep -q 'Infinity PiP SurfaceView changed' /tmp/xbmc/xbmc/platform/android/activity/XBMCApp.cpp
          grep -q 'ApplyWindowResize(width, height)' /tmp/xbmc/xbmc/platform/android/activity/XBMCApp.cpp

      - name: Build Kodi Android dependencies
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -euo pipefail
          cd /tmp/xbmc/tools/depends
          ./bootstrap
          ./configure \
            --with-tarballs=/tmp/xbmc-tarballs \
            --host=aarch64-linux-android \
            --with-sdk-path="$ANDROID_HOME" \
            --with-ndk-path="$ANDROID_HOME/ndk/21.4.7075529" \
            --prefix=/tmp/xbmc-depends \
            --disable-debug
          make -j2

      - name: Configure Kodi build
        run: |
          set -euo pipefail
          mkdir -p /tmp/xbmc-build
          make -C /tmp/xbmc/tools/depends/target/cmakebuildsys BUILD_DIR=/tmp/xbmc-build

      - name: Build Kodi native core
        run: |
          set -euo pipefail
          cmake --build /tmp/xbmc-build --parallel 2
          LIB=$(find /tmp/xbmc-build -type f -name 'libkodi.so' | head -1)
          test -n "$LIB"
          cp "$LIB" /tmp/libkodi-pip-v5.so
          file /tmp/libkodi-pip-v5.so

      - name: Install APK patching tools
        run: |
          curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

      - name: Download Stable 2 v12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9987128748/zip" \
            -o /tmp/base.zip
          mkdir -p /tmp/base
          unzip -q /tmp/base.zip -d /tmp/base
          APK=$(find /tmp/base -name '*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" /tmp/base.apk

      - name: Decode Stable 2
        run: java -jar /tmp/apktool.jar d -f /tmp/base.apk -o /tmp/decoded

      - name: Apply working native Android PiP layer
        run: python3 scripts/patch-phone-layer-v4.py

      - name: Inject patched Kodi 21.2 native core
        run: |
          set -euo pipefail
          TARGET=$(find /tmp/decoded/lib -type f -name 'libkodi.so' | grep 'arm64-v8a' | head -1)
          test -n "$TARGET"
          cp /tmp/libkodi-pip-v5.so "$TARGET"
          echo "Injected native core into $TARGET"

      - name: Verify PiP v5 package wiring
        run: |
          set -euo pipefail
          MAIN=$(find /tmp/decoded -path '*/com/projectinfinity/kodi/Main.smali' | head -1)
          test -n "$MAIN"
          grep -q 'android:supportsPictureInPicture="true"' /tmp/decoded/AndroidManifest.xml
          grep -q 'onPictureInPictureModeChanged' "$MAIN"
          test -f /tmp/decoded/lib/arm64-v8a/libkodi.so

      - name: Rebuild Infinity
        run: java -jar /tmp/apktool.jar b /tmp/decoded -o /tmp/Infinity-Stable2-PhoneLayer-v5-Native-unsigned.apk

      - name: Sign
        env:
          PASS: infinity${{ github.run_id }}${{ github.run_attempt }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/33.0.1"
          keytool -genkeypair \
            -keystore /tmp/infinity.keystore \
            -alias infinity \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Infinity Phone Layer v5 Native, O=Infinity, C=US" \
            >/dev/null 2>&1
          "$BT/zipalign" -f 4 \
            /tmp/Infinity-Stable2-PhoneLayer-v5-Native-unsigned.apk \
            /tmp/Infinity-Stable2-PhoneLayer-v5-Native-aligned.apk
          "$BT/apksigner" sign \
            --ks /tmp/infinity.keystore \
            --ks-key-alias infinity \
            --ks-pass env:PASS \
            --key-pass env:PASS \
            --out /tmp/Infinity-Stable2-PhoneLayer-v5-Native.apk \
            /tmp/Infinity-Stable2-PhoneLayer-v5-Native-aligned.apk
          "$BT/apksigner" verify --verbose /tmp/Infinity-Stable2-PhoneLayer-v5-Native.apk

      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-Stable2-PhoneLayer-v5-Native
          path: /tmp/Infinity-Stable2-PhoneLayer-v5-Native.apk
          retention-days: 30
