name: Infinity 2103402 matching ARM64 native-owner signed corrective QA
on:
  push:
    branches: [work/infinity-2103402-native-owner-corrective-20261024, work/infinity-final-corrective-from-2103407-20261025]
    paths:
      - ".github/workflows/infinity-2103402-native-owner-build.yml"
      - "repairs/infinity-final-closure-2103407/NATIVE-BUILD-REQUEST.json"
      - "repairs/infinity-2103402-final/native_ownership_qa.py"
      - "repairs/infinity-2103402-final/restore_reviewed_engine.py"
      - "repairs/infinity-2103402-final/package_native_owner.py"
permissions:
  contents: read
  actions: read
concurrency:
  group: infinity-matching-native-owner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-sign:
    if: github.ref == 'refs/heads/work/infinity-2103402-native-owner-corrective-20261024'
    name: Recompile exact reviewed 9407 native sources and sign verified install-over APK
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    env:
      NDK_VER: "21.4.7075529"
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Reject source changes outside four exact native owner correction adapters
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          parent="98ac3730a6e64f95f788c4b2f5e41c4f718a8e7d"
          paths=subprocess.check_output(['git','diff','--name-only',parent,'HEAD'],text=True).splitlines()
          whitelist={
            'repairs/infinity-2103402-final/native_ownership_qa.py',
            'repairs/infinity-2103402-final/restore_reviewed_engine.py',
            'repairs/infinity-2103402-final/package_native_owner.py',
            '.github/workflows/infinity-2103402-native-owner-qa.yml',
            '.github/workflows/infinity-2103402-native-owner-build.yml',
          }
          assert paths and set(paths)<=whitelist, ('Unapproved change',paths)
          assert not any('cobra' in p.lower() for p in paths),paths
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 40089463702
          name: Infinity-Saved-Navigation-MultiImage-INTERNAL-QA-NOT-ACCEPTED
          github-token: ${{ github.token }}
          path: protected-2103401
      - uses: actions/download-artifact@v4
        with:
          run-id: 40144024130
          name: Infinity-2103402-FUNCTIONAL-UI-QA-SIGNED-UNVERIFIED-ON-FOLD
          github-token: ${{ github.token }}
          path: signed-2103402-qa
      - uses: actions/download-artifact@v4
        with:
          run-id: 38132105717
          name: Infinity-2103367-Verified-Compiler-Dependencies
          github-token: ${{ github.token }}
          path: dependency-transfer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.7"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;35.0.0 platforms;android-34"
          log-accepted-android-sdk-licenses: false
      - name: Verify exact accepted source and user-tested QA components before native compilation
        run: |
          set -euo pipefail
          (cd protected-2103401 && sha256sum -c SHA256SUMS)
          (cd signed-2103402-qa && sha256sum -c SHA256SUMS)
          echo "bc55f659aadf2a806297abdd6104ddd362906179e96b9c2b391eee8556a4f0a8  protected-2103401/Infinity-Targeted-Source-and-Evidence.zip" | sha256sum -c
          echo "df545f4b03e56a9b212c9a7cf34a900fe594b153b8ee2b655dff6fd84195c801  protected-2103401/NATIVE-SOURCE-MAP.json" | sha256sum -c
          python3 repairs/infinity-2103402-final/native_ownership_qa.py \
            --source protected-2103401/Infinity-Targeted-Source-and-Evidence.zip \
            --map protected-2103401/NATIVE-SOURCE-MAP.json \
            --baseline protected-2103401/Infinity-2103401-Universal-Performance-QA.apk \
            --qa signed-2103402-qa/Infinity-2103402-Functional-Corrective-QA.apk \
            --out native-owner-overlay
          python3 repairs/infinity-2103402-final/restore_reviewed_engine.py \
            --source protected-2103401/Infinity-Targeted-Source-and-Evidence.zip \
            --map protected-2103401/NATIVE-SOURCE-MAP.json \
            --receipt protected-2103401/SOURCE-DELTA.json \
            --overlay native-owner-overlay \
            --target kodi \
            --out native-owner-build
      - name: Restore same verified compiler dependency foundation as successful 2103401
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y python3-yaml python3-dev libsqlite3-dev libssl-dev libffi-dev
          (cd dependency-transfer && sha256sum -c SHA256SUMS)
          tar --no-same-owner -xf dependency-transfer/verified-android-dependencies.tar
          tar --no-same-owner -xf dependency-transfer/verified-compiler-cache.tar -C "$HOME"
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-linux-21.4.7075529-v1
      - run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - name: Compile complete 9407-file ARM64 native engine with only four reviewed changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,os,pathlib,sys
          root=pathlib.Path.cwd()
          suite=root/'repairs/universal-persistence-2103401'
          sys.path.insert(0,str(suite))
          spec=importlib.util.spec_from_file_location('existing_verified_native_producer',suite/'build.py')
          producer=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(producer)
          producer.OUT=root/'native-owner-build'
          result=producer.compile_engine()
          assert result['complete_native_engine_compiled'] is True
          assert result['reviewed_file_count']==9407
          print('Verified original ARM64 producer compiled modified ownership source:',result['native_sha256'])
          PY
      - name: Package exact previously accepted QA assets and only new native engine
        run: |
          set -euo pipefail
          python3 repairs/infinity-2103402-final/package_native_owner.py stage \
            --qa signed-2103402-qa \
            --components signed-2103402-qa \
            --compiled-so native-owner-build/libkodi.so \
            --out native-owner-package
      - name: Sign with original Infinity release certificate and reject unauthorized content
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${INFINITY_KEYSTORE_B64:?Existing original signing key missing}"
          : "${INFINITY_STORE_PASSWORD:?Existing original signing key password missing}"
          : "${INFINITY_KEY_PASSWORD:?Existing original private key password missing}"
          : "${INFINITY_KEY_ALIAS:?Existing original signing key alias missing}"
          printf '%s' "$INFINITY_KEYSTORE_B64" | base64 -d > native-owner-package/.release-keystore.jks
          chmod 600 native-owner-package/.release-keystore.jks
          ALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$ALIGN" -P 16 -f 4 native-owner-package/unsigned-native-ownership.apk native-owner-package/aligned-native-owner.apk
          "$SIGNER" sign \
            --ks native-owner-package/.release-keystore.jks \
            --ks-key-alias "$INFINITY_KEY_ALIAS" \
            --ks-pass env:INFINITY_STORE_PASSWORD \
            --key-pass env:INFINITY_KEY_PASSWORD \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out native-owner-package/Infinity-2103402-Matching-Native-Ownership-QA.apk \
            native-owner-package/aligned-native-owner.apk
          "$SIGNER" verify --verbose --print-certs protected-2103401/Infinity-2103401-Universal-Performance-QA.apk > native-owner-package/BASELINE-SIGNATURE.txt
          "$SIGNER" verify --verbose --print-certs native-owner-package/Infinity-2103402-Matching-Native-Ownership-QA.apk > native-owner-package/MATCHING-SIGNATURE.txt
          python3 - <<'PY'
          import re,pathlib
          root=pathlib.Path('native-owner-package')
          # Use one explicit certificate owner; reject every mismatch.
          pattern=re.compile(r'Signer #1 certificate SHA-256 digest:\s*([0-9a-fA-F]{64})')
          def read(p):
              m=pattern.search((root/p).read_text())
              if not m: raise RuntimeError('Signer certificate not found')
              return m.group(1).lower()
          original='d7adeb68e9341596a02bd3262b737a0f45fc6e771ed7e60285437e833b58c6d7'
          assert read('BASELINE-SIGNATURE.txt')==read('MATCHING-SIGNATURE.txt')==original, 'Changed app signing identity'
          PY
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging native-owner-package/Infinity-2103402-Matching-Native-Ownership-QA.apk | grep -E "^package: name='com.projectinfinity.kodi' versionCode='2103402'"
          python3 repairs/infinity-2103402-final/package_native_owner.py verify \
            --qa signed-2103402-qa \
            --components signed-2103402-qa \
            --signed native-owner-package/Infinity-2103402-Matching-Native-Ownership-QA.apk \
            --out native-owner-package
          for f in script.infinity.commandcenter-0.3.5.36.zip script.infinity.uirepair-0.1.18.zip script.infinity.watchedbridge-1.0.16.zip skin.infinity.diggz-1.0.5.243.zip; do
             cp "signed-2103402-qa/$f" native-owner-package/
          done
          rm -f native-owner-package/.release-keystore.jks native-owner-package/unsigned-native-ownership.apk native-owner-package/aligned-native-owner.apk
          (cd native-owner-package && sha256sum *.apk *.zip > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: Infinity-2103402-MATCHING-NATIVE-OWNER-SIGNED-QA-NOT-FOLD-VERIFIED
          path: |
            native-owner-package/*.apk
            native-owner-package/*.zip
            native-owner-package/*.json
            native-owner-package/*SIGNATURE.txt
            native-owner-package/SHA256SUMS
            native-owner-build/ENGINE-PROOF.json
            native-owner-overlay/EXACT-NATIVE-OWNER-REPAIR.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Infinity-2103402-Native-Owner-Build-Failure-Evidence
          path: |
            native-owner-build/*.json
            native-owner-overlay/*.json
            kodi-build/CMakeCache.txt
          retention-days: 30
          if-no-files-found: warn

  final-native:
    if: github.ref == 'refs/heads/work/infinity-final-corrective-from-2103407-20261025'
    name: Full matching ARM64 engine from exact407 source - internal integration, not final APK
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    env:
      NDK_VER: "21.4.7075529"
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Validate exact native request and protected final scope
        run: |
          set -euo pipefail
          python3 repairs/infinity-final-closure-2103407/native_build_request.py
          python3 - <<'PY'
          import subprocess
          baseline='0e8739d2d0e1be0ab8f127519b526556426fb160'
          allowed={'.github/workflows/infinity-2103407-search-pressure-host-gate.yml',
                   '.github/workflows/infinity-saved-navigation-android.yml',
                   '.github/workflows/infinity-2103402-native-owner-build.yml'}
          names=subprocess.check_output(['git','diff','--name-only',baseline,'HEAD'],text=True).splitlines()
          assert all(n.startswith('repairs/infinity-final-closure-2103407/') or n in allowed for n in names),names
          assert not any('cobra' in n.lower() for n in names),names
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 40089463702
          name: Infinity-Saved-Navigation-MultiImage-INTERNAL-QA-NOT-ACCEPTED
          github-token: ${{ github.token }}
          path: native-foundation
      - uses: actions/download-artifact@v4
        with:
          run-id: 40149635167
          name: Infinity-2103402-MATCHING-NATIVE-OWNER-SIGNED-QA-NOT-FOLD-VERIFIED
          github-token: ${{ github.token }}
          path: retained-owner
      - uses: actions/download-artifact@v4
        with:
          run-id: 40158384817
          name: Infinity-2103402-REUSABLE-ARM64-Context-Favourites-Engine
          github-token: ${{ github.token }}
          path: retained-final-compile
      - uses: actions/download-artifact@v4
        with:
          run-id: 40230842944
          name: Infinity-2103407-SEARCH-SINGLE-FLIGHT-ORIGINAL-SIGNER-QA
          github-token: ${{ github.token }}
          path: signed407
      - uses: actions/download-artifact@v4
        with:
          run-id: 38132105717
          name: Infinity-2103367-Verified-Compiler-Dependencies
          github-token: ${{ github.token }}
          path: dependency-transfer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.7"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;35.0.0 platforms;android-34"
          log-accepted-android-sdk-licenses: false
      - name: Verify protected original signer and reconstruct exact407 native lineage
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            signed407/release/Infinity-2103407-Search-Single-Flight-SIGNED-QA.apk > SIGNED407-SIGNATURE.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          value=Path('SIGNED407-SIGNATURE.txt').read_text()
          match=re.search(r'Signer #1 certificate SHA-256 digest:\s*([a-fA-F0-9]{64})',value)
          assert match and match.group(1).lower()=='d7adeb68e9341596a02bd3262b737a0f45fc6e771ed7e60285437e833b58c6d7'
          PY
          python3 repairs/infinity-final-closure-2103407/reconstruct_signed407_native.py \
            --foundation native-foundation --owner retained-owner/native-owner-package \
            --compiled retained-final-compile/native-owner-build \
            --signed407 signed407/release/Infinity-2103407-Search-Single-Flight-SIGNED-QA.apk \
            --target kodi --evidence signed407-native
      - name: Selected six source plus two identity-audit checks - no application or shutdown suite
        env:
          FINAL_NATIVE_SOURCE_ROOT: ${{ github.workspace }}/kodi
          FINAL_NATIVE_SOURCE_MAP: ${{ github.workspace }}/signed407-native/SIGNED407-NATIVE-SOURCE-MAP.json
        run: |
          set -euo pipefail
          python3 -m unittest discover -s repairs/infinity-final-closure-2103407 \
            -p test_native_integration.py -v 2>&1 | tee NATIVE-SOURCE-CHECKS.txt
          python3 -m unittest discover -s repairs/infinity-final-closure-2103407 \
            -p test_identity_audit.py -v 2>&1 | tee NATIVE-IDENTITY-AUDIT-CHECKS.txt
      - name: Apply exactly seven owned source edits and four verifier files
        run: |
          set -euo pipefail
          python3 repairs/infinity-final-closure-2103407/stage_native_modules.py \
            --native kodi --map signed407-native/SIGNED407-NATIVE-SOURCE-MAP.json --out final-native
      - name: Restore existing verified compiler dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y python3-yaml python3-dev libsqlite3-dev libssl-dev libffi-dev
          (cd dependency-transfer && sha256sum -c SHA256SUMS)
          tar --no-same-owner -xf dependency-transfer/verified-android-dependencies.tar
          tar --no-same-owner -xf dependency-transfer/verified-compiler-cache.tar -C "$HOME"
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-linux-21.4.7075529-v1
      - run: bash repairs/android-checkpoint-shutdown/install_ndk.sh
      - name: Compile complete matching9411-source ARM64 engine with unchanged verified producer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,os,pathlib,subprocess,sys
          root=pathlib.Path.cwd();suite=root/'repairs/universal-persistence-2103401'
          sys.path.insert(0,str(suite))
          spec=importlib.util.spec_from_file_location('retained_complete_native_producer',suite/'build.py')
          producer=importlib.util.module_from_spec(spec);spec.loader.exec_module(producer)
          producer.OUT=root/'final-native'
          proof=producer.compile_engine()
          assert proof['complete_native_engine_compiled'] is True and proof['reviewed_file_count']==9411
          readelf=pathlib.Path(os.environ['ANDROID_HOME'])/'ndk/21.4.7075529/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-readelf'
          dynamic=subprocess.check_output([str(readelf),'--dyn-syms','--wide','final-native/libkodi.so'],text=True)
          assert any('InfinityCommandCenterIdentityV1' in line and 'GLOBAL' in line and 'DEFAULT' in line for line in dynamic.splitlines())
          (root/'final-native/NATIVE-MODULE-ABI.txt').write_text('\n'.join(line for line in dynamic.splitlines() if 'InfinityCommandCenterIdentityV1' in line)+'\n')
          print('Complete ARM64 compilation and original-key native module ABI verified; integrated Android17/Fold NOT RUN')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Infinity-Final-Native-Modules-${{ github.run_id }}-INTERNAL-NOT-APK
          path: |
            final-native/libkodi.so
            final-native/*.json
            final-native/*.txt
            signed407-native/*.json
            NATIVE-REQUEST-EVIDENCE.json
            SIGNED407-SIGNATURE.txt
            NATIVE-SOURCE-CHECKS.txt
            NATIVE-IDENTITY-AUDIT-CHECKS.txt
            kodi-build/CMakeCache.txt
          retention-days: 90
          if-no-files-found: warn
