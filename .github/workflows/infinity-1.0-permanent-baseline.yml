name: Infinity 1.0 Permanent Baseline
run-name: 'Infinity 1.0 | frozen golden master | permanent signing baseline'

on:
  workflow_dispatch:
  push:
    branches: [infinity-android-first]
    paths: ['.github/workflows/infinity-1.0-permanent-baseline.yml']

permissions:
  contents: read
  actions: read

jobs:
  sign-baseline:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;34.0.0'

      - name: Require permanent Infinity signing identity
        shell: bash
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in INFINITY_KEYSTORE_B64 INFINITY_STORE_PASSWORD INFINITY_KEY_PASSWORD INFINITY_KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required permanent signing secret: $name" >&2
              exit 2
            fi
          done

      - name: Download frozen RC3 #2 Golden Master unsigned candidate
        uses: actions/download-artifact@v8
        with:
          name: Infinity-RC3-Unsigned-Candidate
          path: golden
          run-id: 34316336433
          github-token: ${{ github.token }}

      - name: Sign frozen Golden Master with permanent identity
        shell: bash
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p signed
          bash scripts/sign-infinity71.sh \
            golden/Infinity-Android-First-unsigned.apk \
            signed/Infinity-1.0-Permanent-Baseline.apk
          grep -q 'Signing mode: stable-secret' signed/Infinity-1.0-Permanent-Baseline.signing.txt
          cp golden/package-check.json signed/golden-package-check.json
          cp golden/presentation.json signed/golden-presentation.json

      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-1.0-Permanent-Baseline
          path: signed/
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
