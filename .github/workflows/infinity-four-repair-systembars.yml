name: Infinity | Android 11 first-touch correction | signed 2103386 and Android gates
on:
  push:
    branches: [work/infinity-post-2103384-feature-restoration]
    paths: ['repairs/four-repair-20261018/SYSTEMBARS.marker']
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency: {group: infinity-four-repair-systembars, cancel-in-progress: true}
jobs:
  sign:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v8
        with:
          run-id: 39106462774
          name: Infinity-2103385-UI-Restoration-Signed-EXPERIMENTAL-and-Return
          github-token: ${{ github.token }}
          path: parent385
      - name: Verify exact input and all unchanged native and shutdown sources
        run: |
          git diff --exit-code 229bb4613e827eefe0bfd16bea836d164bf80520 HEAD -- scripts features repairs ':!repairs/four-repair-20261018'
          git diff --exit-code 229bb4613e827eefe0bfd16bea836d164bf80520 HEAD -- repairs/four-repair-20261018/native_patch.py repairs/four-repair-20261018/native_ci.py repairs/four-repair-20261018/package_apk.py
      - name: Apply exact single-method API30 correction and permanently sign
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          python3 repairs/four-repair-20261018/package_systembars.py --parent parent385/Infinity-2103385-UI-Restoration-TEST1.apk --tools dex-tools --out signed386 --sign
      - id: identity
        run: |
          python3 - <<'PYCODE'
          import json,os
          r=json.load(open('signed386/SIGNED-2103386.json'))
          assert r['permanently_signed'] and r['native_engine_unchanged']
          assert r['changed_unsigned_payload']==['AndroidManifest.xml','classes.dex']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('sha='+r['sha256']+'\n')
          PYCODE
      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103386-Android11-Input-Signed-EXPERIMENTAL
          path: |
            signed386/Infinity-2103386-UI-Restoration-TEST2.apk
            signed386/SIGNED-2103386.json
            signed386/DEX-INSTRUCTION-PRESERVATION.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  signed-android:
    needs: sign
    name: Actual signed feature APK ${{ matrix.case }} vs LOCKED 2103384
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        case: [fresh, loaded]
    env:
      INFINITY_CANDIDATE_SHA: ${{ needs.sign.outputs.sha }}
      INFINITY_NEW_CODE: '2103386'
      INFINITY_CANDIDATE_FILE: 'Infinity-2103386-UI-Restoration-TEST2.apk'
      INFINITY_LOCKED_APK_SHA: b571676731bb9bdccb25134c557be613e15cc9adaf77d6675dabc8e0586e54af
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.7'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Download EXACT approved signed 2103384 APK from locked source
        uses: actions/download-artifact@v8
        with:
          run-id: 39091057069
          name: Infinity-2103384-FAST-SIGNED-Experimental-APK-and-Return
          github-token: ${{ github.token }}
          path: approved-2103384
      - name: Download only the exact candidate signed APK artifact named in this invocation
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.run_id }}
          name: Infinity-2103386-Android11-Input-Signed-EXPERIMENTAL
          github-token: ${{ github.token }}
          path: candidate-input
      - name: Download known unchanged test service fixtures; do not substitute stock Kodi
        uses: actions/download-artifact@v8
        with:
          run-id: 38976250598
          name: Infinity-2103377-INTERNAL-OBSERVER-STAGE-DIAGNOSTIC-Inputs
          github-token: ${{ github.token }}
          path: test4-inputs
      - name: Verify locked base, candidate identity, signer, higher version, and fixed original native Close tests
        run: |
          set -euo pipefail
          git diff --exit-code 5389b4572cd32037fedf0e7d88b7f79abb120952 HEAD -- \
            repairs/locked-baselines/INFINITY-2103384-SHUTDOWN-LOCK.json \
            repairs/full-system-20261017/write_error_scope_patch.py \
            repairs/full-system-20261017/InfinityProtectedWrites.stagefix.h \
            repairs/full-system-20261017/shutdown_native_ci.py \
            repairs/essential-first-2103377/runtime/xbmc/platform/android/activity/InfinityAndroidCheckpoint.h \
            repairs/essential-first-2103377/runtime/xbmc/platform/android/activity/InfinityScriptPersistence.h
          python3 - <<'PY'
          import hashlib, os, re, shutil
          from pathlib import Path
          locked=Path('approved-2103384/Infinity-2103384-Optional-VFS-Shutdown-TEST1.apk')
          fixed='b571676731bb9bdccb25134c557be613e15cc9adaf77d6675dabc8e0586e54af'
          assert locked.is_file() and hashlib.sha256(locked.read_bytes()).hexdigest()==fixed
          expected=os.environ['INFINITY_CANDIDATE_SHA']
          filename=os.environ['INFINITY_CANDIDATE_FILE']
          code=os.environ['INFINITY_NEW_CODE']
          assert re.fullmatch('[a-f0-9]{64}',expected)
          assert re.fullmatch('[A-Za-z0-9][A-Za-z0-9_.-]*\.apk',filename)
          assert code.isdecimal() and int(code)>2103384
          matches=list(Path('candidate-input').rglob(filename))
          assert len(matches)==1 and matches[0].is_file(), 'Not exactly one signed Infinity candidate file'
          actual=hashlib.sha256(matches[0].read_bytes()).hexdigest()
          assert actual==expected and actual!=fixed,'Cannot test mismatched or locked APK as new feature'
          Path('verified-candidate').mkdir(exist_ok=True)
          shutil.copyfile(matches[0],'verified-candidate/Infinity-Candidate.apk')
          print('PASS actual new signed candidate preimage: version',code,'sha256',actual,flush=True)
          PY
          python3 repairs/full-system-20261017/infinity_only_gate.py apk \
            --apk verified-candidate/Infinity-Candidate.apk \
            --expected-sha "$INFINITY_CANDIDATE_SHA" \
            --version-code "$INFINITY_NEW_CODE" \
            --aapt "$ANDROID_HOME/build-tools/34.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            --out feature-android/CANDIDATE-SIGNED-IDENTITY.json
          python3 repairs/full-system-20261017/infinity_only_gate.py apk \
            --apk approved-2103384/Infinity-2103384-Optional-VFS-Shutdown-TEST1.apk \
            --expected-sha "$INFINITY_LOCKED_APK_SHA" --version-code 2103384 \
            --aapt "$ANDROID_HOME/build-tools/34.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            --out feature-android/LOCKED-SIGNED-IDENTITY.json
          git diff --exit-code 9dea86a7bf1896993e33ab885aa678a25eddaa0f -- \
            repairs/android-checkpoint-shutdown/runtime-tests/run_internal_observer_stage_case.py \
            repairs/android-checkpoint-shutdown/runtime-tests/essential_android_probe.py \
            repairs/android-checkpoint-shutdown/runtime-tests/observer_upgrade_android_probe.py
      - name: Prepare disposable Android emulator; actual Infinity APK required
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0
          python3 repairs/android-checkpoint-shutdown/runtime-tests/prepare_android_emulator.py --out emulator-setup
          sudo chmod 666 /dev/kvm
      - name: Fresh or upgraded Infinity startup, REAL Essential-First Close and reopen
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          avd-name: infinity-post-2103384-feature
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: >-
            python3 repairs/four-repair-20261018/run_locked_android_case.py
            --case ${{ matrix.case }}
            --baseline-apk approved-2103384/Infinity-2103384-Optional-VFS-Shutdown-TEST1.apk
            --apk verified-candidate/Infinity-Candidate.apk
            --installed-addons test4-inputs/rc05-inputs/native-evidence/installed-addons
            --out feature-android
            --expected-sha256 "$INFINITY_CANDIDATE_SHA"
      - name: Green ONLY if actual newly signed Infinity real Android receipt passed
        run: |
          set -euo pipefail
          python3 repairs/full-system-20261017/infinity_only_gate.py phase \
            --report feature-android/INTERNAL-CASE-IDENTITY.json \
            --expected-sha "$INFINITY_CANDIDATE_SHA" \
            --case ${{ matrix.case }} \
            --out feature-android/REAL-ANDROID-VERDICT.json
      - name: Preserve real Android evidence including failures; never imply physical Fold lock
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103386-Candidate-Android-${{ matrix.case }}
          path: |
            feature-android/
            emulator-setup/
          retention-days: 90
          if-no-files-found: warn

  actual-ui:
    needs: sign
    name: Full UI, Stop paths and Close on API ${{ matrix.api }}
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions: {contents: write, actions: read}
    env:
      APK_SHA: ${{ needs.sign.outputs.sha }}
      UI_PACKAGE_RUN: '39114438060'
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.7'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.run_id }}
          name: Infinity-2103386-Android11-Input-Signed-EXPERIMENTAL
          github-token: ${{ github.token }}
          path: signed
      - uses: actions/download-artifact@v8
        with:
          run-id: 38976250598
          name: Infinity-2103377-INTERNAL-OBSERVER-STAGE-DIAGNOSTIC-Inputs
          github-token: ${{ github.token }}
          path: first-party-input
      - name: Retrieve unchanged original complete skin and Rails
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p full-input
          gh api repos/$GITHUB_REPOSITORY/releases/416125865 > /tmp/ui-release.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/ui-release.json'))
          assert r['draft'] is True and r['tag_name']=='infinity-ci-assets-20261017'
          a=next(a for a in r['assets'] if a['id']==651868759)
          assert a['digest']=='sha256:852dce3899b1976556b3b46f696a805b668eca4a513df6194c642d108da58834'
          PY
          curl --fail --location --silent --show-error --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/651868759 -o full-input/inputs.zip
          echo '852dce3899b1976556b3b46f696a805b668eca4a513df6194c642d108da58834  full-input/inputs.zip' | sha256sum -c
          unzip -q full-input/inputs.zip -d full-input
      - name: Download the exact completed skin/helper package under test
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ env.UI_PACKAGE_RUN }}
          name: Infinity-UI-Restoration-Current-Skins-and-Helper
          github-token: ${{ github.token }}
          path: ui-candidate
      - name: Verify signer and stage exact full candidate, dependencies and disposable fixtures
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          r=json.load(open('signed/SIGNED-2103386.json'))
          assert r['source_commit']==os.environ['GITHUB_SHA']
          assert r['permanently_signed'] and r['native_engine_unchanged']
          assert r['sha256']==os.environ['APK_SHA']
          assert hashlib.sha256((Path('signed')/r['file']).read_bytes()).hexdigest()==r['sha256']
          PY
          echo 'cc07fe41ccef2b9eca52b8b273ac5ad9a6c1f498a008d64ac0526a7e62dbe699  ui-candidate/skin.infinity.diggz-1.0.5.227-Coordinated-TEST.zip' | sha256sum -c
          echo '792154bc91f3a2839dec29b6c560c854105913df6d78a79d39cb253207f947d7  ui-candidate/script.infinity.uirepair-0.1.0-TEST.zip' | sha256sum -c
          mkdir -p full-input/additional-addons
          python3 repairs/full-system-20261017/infinity_official_skin_dependencies.py --additional full-input/additional-addons --out full-stack/OMEGA-SKIN-DEPENDENCIES.json
          python3 repairs/four-repair-20261018/prepare_ui_android.py --skin full-input/skin.infinity.diggz-1.0.5.225-PhaseD-TEST.zip --rails full-input/script.infinity.rails-0.2.6-Stability-Evidence-RC1-TEST.zip --first-party first-party-input/rc05-inputs/native-evidence/installed-addons --additional full-input/additional-addons --candidate ui-candidate/skin.infinity.diggz-1.0.5.227-Coordinated-TEST.zip --helper ui-candidate/script.infinity.uirepair-0.1.0-TEST.zip --out full-stack
      - name: Prepare isolated emulator and public test media
        run: |
          set -euo pipefail
          python3 repairs/full-system-20261017/infinity_only_gate.py apk --apk signed/Infinity-2103386-UI-Restoration-TEST2.apk --expected-sha "$APK_SHA" --version-code 2103386 --aapt "$ANDROID_HOME/build-tools/34.0.0/aapt" --apksigner "$ANDROID_HOME/build-tools/34.0.0/apksigner" --out full-stack/SIGNED-IDENTITY.json
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0 ffmpeg
          ffmpeg -v error -f lavfi -i testsrc2=size=640x360:rate=24 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 120 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -y infinity-ui-fixture.mp4
          python3 repairs/android-checkpoint-shutdown/runtime-tests/prepare_android_emulator.py --out emulator-setup
          sudo chmod 666 /dev/kvm
      - name: Real candidate taps, holds, themes, Stop choices, Stop Home, Essential-First Close and reopen
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          # Original API30 failure and modern API35; exact same input/actions
          # and dismissal assertions, with window/input evidence retained.
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          avd-name: infinity-four-repair-ui
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: >-
            python3 repairs/four-repair-20261018/android_ui.py
            --apk signed/Infinity-2103386-UI-Restoration-TEST2.apk --expected-sha "$APK_SHA"
            --addons full-stack/addons --input-proof full-stack/FULL-STACK-INPUTS.json
            --test-variant ui-restoration --out full-stack/android
      - name: Require actual UI and unchanged Close receipts
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('full-stack/android/FULL-STACK-ANDROID.json'))
          assert r['passed'] and r['ui_emulator_smoke_passed'] and r['close_certified'] and r['reopen_succeeded']
          assert r['skin_version']=='1.0.5.227' and not r['physical_fold_accepted'] and not r['crash_fixed']
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103386-Full-UI-Android-API-${{ matrix.api }}
          path: |
            full-stack/android/
            full-stack/*.json
            emulator-setup/
            ui-candidate/BUILD-1.0.5.227.json
          if-no-files-found: warn
          retention-days: 90
