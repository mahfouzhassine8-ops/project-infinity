name: Infinity | 2103377 Gemini vs verified barrier
on:
  push:
    branches: [experiment/infinity-2103377-hardstop-feasibility]
    paths:
      - 'repairs/shutdown-comparison-2103377/**'
      - '.github/workflows/infinity-2103377-shutdown-comparison.yml'
permissions: {contents: read}
concurrency: {group: infinity-2103377-shutdown-comparison, cancel-in-progress: false}
jobs:
  linux-process-sqlite-wal:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Ensure production source and all locked branches are untouched
        run: |
          python3 - <<'PY'
          import subprocess
          parent="40a5ac471c4bf67aaeb6acaf0ec6612097e06b53"
          subprocess.run(["git","merge-base","--is-ancestor",parent,"HEAD"],check=True)
          paths=set(subprocess.check_output(["git","diff","--name-only",parent,"HEAD"],text=True).splitlines())
          allowed={
            ".github/workflows/infinity-2103377-hardstop-feasibility.yml",
            "repairs/hardstop-feasibility-2103377/native_worker.cpp",
            "repairs/hardstop-feasibility-2103377/app_state_child.py",
            "repairs/hardstop-feasibility-2103377/verify.py",
            "repairs/shutdown-comparison-2103377/compare.py",
            ".github/workflows/infinity-2103377-shutdown-comparison.yml",
          }
          assert paths <= allowed,(paths - allowed)
          assert "repairs/shutdown-comparison-2103377/compare.py" in paths
          print("PASS: only isolated experiment and workflows changed; approved Kodi, skin, APK untouched")
          PY
      - name: Compare hard-exit versus verified writer-barrier cancellation
        run: |
          set -euo pipefail
          ulimit -c 0
          python3 repairs/shutdown-comparison-2103377/compare.py --out shutdown-comparison-evidence 2>&1 | tee shutdown-comparison-evidence.log
      - name: Preserve evidence with original source commit
        if: always()
        run: |
          mkdir -p shutdown-comparison-evidence
          git rev-parse HEAD > shutdown-comparison-evidence/SOURCE-COMMIT.txt
          sha256sum repairs/shutdown-comparison-2103377/compare.py > shutdown-comparison-evidence/SOURCE-SHA256.txt
          cp shutdown-comparison-evidence.log shutdown-comparison-evidence/TEST-OUTPUT.txt || true
          printf '%s\n' 'HOST-ONLY: no physical Fold, no production Kodi engine changes or APK, no claim of fully verified shutdown.' > shutdown-comparison-evidence/LIMITS.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103377-Gemini-Versus-Verified-Barrier-Results
          path: |
            shutdown-comparison-evidence/*.json
            shutdown-comparison-evidence/*.txt
          retention-days: 90
          if-no-files-found: error
