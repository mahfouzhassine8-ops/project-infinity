name: Infinity | 2103231 onn TV Adaptive UI Polish RC11 FAST

on:
  workflow_dispatch:
  push:
    branches: [infinity-cobra-2103231-onn4kpro-tv-adaptive-ui-polish-rc11]
    paths:
      - '.github/workflows/infinity-2103231-onn4kpro-tv-adaptive-ui-polish.yml'
      - 'repairs/onn4kpro-tv-adaptive-ui-polish-2103231/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: infinity-2103231-onn-tv-fast-${{ github.sha }}
  cancel-in-progress: false

env:
  NDK_VER: 21.4.7075529

jobs:
  fast-tv-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Checkout isolated RC11 TV branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Download exact 2103208 Android source parent
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103208-Integration-Polish-TEST-CANDIDATE-Replica-1-Attempt-1
          run-id: 35676573761
          github-token: ${{ github.token }}
          path: baseline208

      - name: Download preserved 2103209 source reconstruction engine
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103209-Python311-GIL-Native-Engine
          run-id: 35693288744
          github-token: ${{ github.token }}
          path: native209

      - name: Download exact locked 2103230 RC10 TV APK
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103230-Onn4KPro-TV-Navigation-Motion-TEST-CANDIDATE
          run-id: 35919850555
          github-token: ${{ github.token }}
          path: base230

      - name: Reconstruct exact locked RC10 source and apply RC11 adaptive polish
        run: |
          set -euo pipefail
          mkdir -p engine audit220 audit221 audit224 audit225 audit230 audit231 candidate231
          cp native209/pythoninvoker-threadstate-v2-source.json engine/pythoninvoker-threadstate-v2-source.json
          cp native209/pythoninvoker-threadstate-v2-source.stage1.json engine/pythoninvoker-threadstate-v2-source.stage1.json
          python3 repairs/python311-gil-2103209/ci.py prepare \
            --base-dir baseline208 \
            --native-apk native209/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2-Engine-Base.apk \
            --shell shell-kodi \
            --out audit231/mobile-source-base
          python3 repairs/cobra-media-library-health-2103210/apply.py --shell shell-kodi
          python3 repairs/cobra-library-health-2103211/apply.py --shell shell-kodi
          python3 repairs/health-media-trim-2103212/apply.py --shell shell-kodi
          python3 repairs/live-blue-ambient-settings-return-2103213/apply.py --shell shell-kodi
          python3 repairs/media-details-final-2103214/apply.py --shell shell-kodi
          python3 repairs/smart-return-experience-drawer-2103215/apply.py --shell shell-kodi
          python3 repairs/smart-return-experience-display-2103216/apply.py --shell shell-kodi
          python3 repairs/media-return-context-2103217/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-2103218/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-remote-2103219/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-grid-only-2103220/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-remote-ui-2103221/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-player-multiview-2103222/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-hardening-2103223/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-native-remote-2103224/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-handoff-focus-2103225/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-navigation-motion-2103230/apply.py --shell shell-kodi
          python3 repairs/onn4kpro-tv-adaptive-ui-polish-2103231/apply.py --shell shell-kodi

          python3 - <<'PY'
          import json
          r=json.load(open('engine/background-resume-source.json'))
          assert r['version_code']==2103231
          assert r['version_name']=='1.0.9-Cobra-Onn4KPro-TV-Adaptive-UI-Polish-RC11'
          assert r['tv_target_abi']=='armeabi-v7a'
          assert r['tv_hamburger_removed'] is True
          assert r['tv_drawer_back_menu_preserved'] is True
          assert r['tv_grid_group_dropdown_removed'] is True
          assert r['tv_grid_settings_next_to_search'] is True
          assert r['tv_grid_settings_returns_to_guide'] is True
          assert r['tv_mini_player_adaptive_large'] is True
          assert r['tv_mini_player_preserved'] is True
          assert r['tv_preview_engine_preserved'] is True
          assert r['tv_navigation_hierarchy']=='drawer-groups-grid-player'
          assert r['tv_back_reverses_hierarchy'] is True
          assert r['tv_multiview_row_focus_visible'] is True
          assert r['multiview_two_to_one_session_preserved'] is True
          assert r['native_engine_rebuilt'] is False
          assert r['playback_engine_unchanged'] is True
          print('PASS: exact RC11 adaptive UI source receipt')
          PY

          JAVA=shell-kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          grep -Fq 'cobra_tv_navigation_motion_2103230' "$JAVA"
          grep -Fq 'cobra_tv_adaptive_ui_2103231' "$JAVA"
          grep -Fq 'cobra_tv_grid_settings' "$JAVA"
          grep -Fq 'startCobraPreview(mGuidePreviewChannel)' "$JAVA"
          grep -Fq 'mCobraPreviewPlayer=session' "$JAVA"
          ! grep -A120 -F 'private void cobraBuildModeChrome' "$JAVA" | grep -Fq 'cobra_tv_toolbar_menu'
          ! grep -A120 -F 'private void cobraModeBrowserHeader' "$JAVA" | grep -Fq 'name+"  ▾"'
          grep -Fq 'versionCode 2103231' shell-kodi/tools/android/packaging/xbmc/build.gradle.in
          grep -Fq 'versionName "1.0.9-Cobra-Onn4KPro-TV-Adaptive-UI-Polish-RC11"' shell-kodi/tools/android/packaging/xbmc/build.gradle.in

      - name: Verify exact locked RC10 TV base
        run: |
          set -euo pipefail
          BASE="$(find base230 -type f -name 'Infinity-1.0.9-Cobra-Onn4KPro-TV-Navigation-Motion-RC10.apk' -print -quit)"
          test -n "$BASE"
          printf '%s  %s\n' 'c0f43132993ad0dce094b442d25f0b797228498b821a9cadbd0c6c2f47ccdc88' "$BASE" | sha256sum -c -
          cp "$BASE" candidate231/Infinity-2103230-RC10-LOCKED-ROLLBACK.apk

      - name: Ensure donor debug keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Fast compile RC11 Android TV layer, preserve exact ARMv7 engine, sign and verify
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BASE=candidate231/Infinity-2103230-RC10-LOCKED-ROLLBACK.apk
          python3 repairs/onn4kpro-tv-adaptive-ui-polish-2103231/package.py \
            --source shell-kodi \
            --base-apk "$BASE" \
            --build-dir tv-android-build-231 \
            --out candidate231
          FINAL=candidate231/Infinity-1.0.9-Cobra-Onn4KPro-TV-Adaptive-UI-Polish-RC11.apk
          test -f "$FINAL"
          sha256sum "$FINAL" | tee candidate231/Infinity-1.0.9-Cobra-Onn4KPro-TV-Adaptive-UI-Polish-RC11.sha256
          rm -f "$BASE"

      - name: Write physical onn acceptance checklist
        run: |
          cat > candidate231/DEVICE-TEST.txt <<'EOF'
          INFINITY / COBRA 2103231 — ONN. 4K PRO TV ADAPTIVE UI POLISH RC11
          PHYSICAL DEVICE ACCEPTANCE REQUIRED

          BASELINE
          - Exact locked RC10 / 2103230 is parent and rollback.
          - No native engine rebuild.
          - Drawer -> Groups -> Grid -> Player hierarchy is protected.

          TV GRID CLEANUP
          1. TV Grid must have NO on-screen hamburger button.
          2. Drawer remains reachable by Back hierarchy and remote Menu.
          3. Large Favorites/All/group dropdown beneath mini player is removed.
          4. Search remains present.
          5. Settings gear appears immediately to the right of Search.
          6. Settings opens normal Cobra Settings and Back returns to the exact guide state.

          MINI PLAYER / ADAPTIVE LAYOUT
          7. Existing RC10 mini player remains functional; it is not a replacement decoder/player.
          8. Mini player is visibly larger than RC10.
          9. Programme details use the remaining top-band space without clipping.
          10. EPG begins directly below the enlarged preview/details band.
          11. Verify at 1080p and 4K output; no overlap, clipping, offscreen focus or dead space.

          NAVIGATION
          12. Drawer -> TV -> Groups -> choose group -> Grid works exactly as locked RC10.
          13. Back: Grid -> Groups -> Drawer.
          14. Player Back/header arrow -> Grid.
          15. Channels in fullscreen remains a separate player function.
          16. Search -> Settings D-pad movement is deterministic.

          STABILITY / POLISH
          17. Repeat Groups <-> Grid at least 20 times.
          18. Repeat Grid <-> Player at least 20 times.
          19. Verify no progressive slowdown, focus loss or layout drift.
          20. Note any black-screen duration separately from provider buffering.

          REGRESSION
          21. Verify Multi-View 2/3/4 screens, filters, groups, focus and survivor.
          22. Verify rewind/timeshift, audio/subtitles, recordings/reminders.
          23. Phone/Fold source remains untouched.
          24. Permanent package/signer and armeabi-v7a native engine remain preserved.

          Do not lock/promote RC11 until physical acceptance passes.
          EOF

      - name: Publish onn 4K Pro TV 2103231 ADAPTIVE UI TEST CANDIDATE
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103231-Onn4KPro-TV-Adaptive-UI-Polish-TEST-CANDIDATE
          path: |
            candidate231/Infinity-1.0.9-Cobra-Onn4KPro-TV-Adaptive-UI-Polish-RC11.apk
            candidate231/Infinity-1.0.9-Cobra-Onn4KPro-TV-Adaptive-UI-Polish-RC11.sha256
            candidate231/signing-verification.txt
            candidate231/badging.txt
            candidate231/manifest.txt
            candidate231/ONN-TV-2103231-VERIFICATION.json
            candidate231/tv-adaptive-ui-source.json
            candidate231/DEVICE-TEST.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Preserve 2103231 RC11 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103231-Onn4KPro-TV-Adaptive-UI-Polish-Evidence
          path: |
            audit231/
            engine/background-resume-source.json
            repairs/onn4kpro-tv-player-multiview-2103222/
            repairs/onn4kpro-tv-hardening-2103223/
            repairs/onn4kpro-tv-native-remote-2103224/
            repairs/onn4kpro-tv-handoff-focus-2103225/
            repairs/onn4kpro-tv-navigation-motion-2103230/
            repairs/onn4kpro-tv-adaptive-ui-polish-2103231/
            candidate231/*.json
            candidate231/*.txt
          if-no-files-found: warn
          retention-days: 90
