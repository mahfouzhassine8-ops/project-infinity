name: Infinity | 2103377 RC3 Android recovery and 274 tests
on:
  push:
    branches: [work/infinity-2103377-rc3-curl-early-save]
    paths:
      - '.github/workflows/infinity-2103377-rc3-android.yml'
permissions: {contents: read, actions: read}
concurrency: {group: infinity-2103377-rc3-java-274, cancel-in-progress: false}
jobs:
  rc3-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      KODI_ANDROID_KEY_ALIAS: androiddebugkey
      KODI_ANDROID_KEY_PASSWORD: android
      KODI_ANDROID_STORE_PASSWORD: android
      KODI_ANDROID_STORE_FILE: /home/runner/.android/debug.keystore
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v8
        with:
          run-id: 38351703759
          name: Infinity-2103377-Android-Verification
          github-token: '${{ github.token }}'
          path: green-234
      - uses: actions/download-artifact@v8
        with:
          run-id: 38323908660
          name: Cobra-2103376-Critical-Preview-Signed-Test-APK
          github-token: '${{ github.token }}'
          path: parent-apk
      - name: Reconstruct 274-test lifecycle candidate and exact new RC3 UI
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname 'CN=Compile Only,O=Android,C=US'
          fi
          python3 repairs/shutdown-recents-2103377/lifecycle/verify_android.py prepare \
             --green green-234 --apk parent-apk/Cobra-2103376-Critical-Preview-RC1.apk \
             --build rc3-build --out rc3-android
          python3 - <<'PY'
          from pathlib import Path
          for name in ['rc3-build/xbmc/build.gradle','rc3-build/xbmc/AndroidManifest.xml']:
              p=Path(name);s=p.read_text()
              assert s.count('1.0.9-Close-Recents-RC1')==1,(name,'version anchor')
              p.write_text(s.replace('1.0.9-Close-Recents-RC1','1.0.9-RC3-Curl-Early-Save'))
          PY
          python3 repairs/shutdown-rc3-2103377/android_stage.py apply \
              --build rc3-build --folder rc3-android
      - name: Compile release Java and execute all 274 original tests unchanged
        run: |
          set -euo pipefail
          ./rc3-build/gradlew --no-daemon --console=plain -p rc3-build :xbmc:testReleaseUnitTest \
            2>&1 | tee rc3-android/RC3-ANDROID-274-TESTS.log
      - name: Verify exact 274 original JUnit cases and RC3 Java source parity
        run: |
          set -euo pipefail
          python3 repairs/shutdown-recents-2103377/lifecycle/verify_android.py review \
            --green green-234 --apk parent-apk/Cobra-2103376-Critical-Preview-RC1.apk \
            --build rc3-build --out rc3-android
      - name: Assemble unsigned RC3 Java donor and record verified tested source
        run: |
          set -euo pipefail
          ./rc3-build/gradlew --no-daemon --console=plain -p rc3-build :xbmc:assembleRelease
          cp rc3-build/xbmc/build/outputs/apk/release/xbmc-release.apk rc3-android/donor.apk
          python3 repairs/shutdown-rc3-2103377/android_stage.py verify \
             --build rc3-build --folder rc3-android
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103377-RC3-Android-274-Verified
          path: |
            rc3-android/
            !rc3-android/green-source/
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
