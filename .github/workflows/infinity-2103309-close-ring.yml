name: Infinity | 2103309 live close ring
on:
  workflow_dispatch:
  push:
    branches: [repair/2103309-close-ring]
    paths: ['repairs/close-ring-2103309/**', '.github/workflows/infinity-2103309-close-ring.yml']
permissions: {contents: read, actions: read}
concurrency:
  group: infinity-2103309-close-ring
  cancel-in-progress: false
jobs:
  candidate-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: 'platform-tools platforms;android-35 build-tools;34.0.0'}
      - name: Download the exact source retained by APK 3308
        uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 37296166633
          name: Cobra-Pro-2103307-Verification
          github-token: ${{ github.token }}
          path: parent-source
      - name: Download the user-selected 2103308 APK
        uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 37375758809
          name: Infinity-2103308-Close-Reopen-RC1-APK-NOT-DEVICE-ACCEPTED
          github-token: ${{ github.token }}
          path: base3308
      - name: Download the matching 3308 build proof
        uses: actions/download-artifact@v8
        with:
          repository: mahfouzhassine8-ops/project-infinity
          run-id: 37375758809
          name: Infinity-3308-Close-Reopen-Packaging-Verification
          github-token: ${{ github.token }}
          path: proof3308
      - name: Verify inherited source and stage the ring
        run: |
          set -euo pipefail
          mkdir -p source3309 evidence3309 "$HOME/.android"
          tar --no-same-owner -xzf parent-source/repaired-shell-source.tar.gz -C source3309
          python3 repairs/close-ring-2103309/test_plan.py --source source3309/shell-kodi | tee evidence3309/plan-tests.txt
          python3 repairs/close-ring-2103309/apply.py --source source3309/shell-kodi --out evidence3309
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          python3 repairs/close-ring-2103309/build.py prepare --source source3309/shell-kodi --base base3308/Infinity-2103308-Close-Reopen-RC1.apk --base-proof proof3308/APK-VERIFICATION.json --build build3309 --out evidence3309
      - name: Compile and test production close state and chooser views
        env:
          KODI_ANDROID_KEY_ALIAS: androiddebugkey
          KODI_ANDROID_KEY_PASSWORD: android
          KODI_ANDROID_STORE_PASSWORD: android
        run: |
          set -euo pipefail
          export KODI_ANDROID_STORE_FILE="$HOME/.android/debug.keystore"
          cd build3309
          ./gradlew --no-daemon --console=plain :xbmc:testReleaseUnitTest :xbmc:assembleRelease :xbmc:exportPreservationTools 2>&1 | tee ../evidence3309/android-build.log
      - name: Verify protected payload and bytecode then permanently sign
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 repairs/close-ring-2103309/build.py package --source source3309/shell-kodi --base base3308/Infinity-2103308-Close-Reopen-RC1.apk --base-proof proof3308/APK-VERIFICATION.json --build build3309 --out evidence3309 2>&1 | tee evidence3309/package.log
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103309-Close-Ring-RC1-APK
          path: evidence3309/*.apk
          compression-level: 1
          retention-days: 90
          if-no-files-found: error
      - name: Export test results and exact Android source
        if: always()
        run: |
          mkdir -p evidence3309
          cp repairs/close-ring-2103309/README.md evidence3309/
          if test -d build3309/xbmc/build/test-results; then cp -a build3309/xbmc/build/test-results evidence3309/; fi
          if test -d build3309/xbmc/build/reports/tests; then cp -a build3309/xbmc/build/reports/tests evidence3309/test-reports; fi
          if test -d source3309/shell-kodi; then tar -czf evidence3309/repaired-shell-source.tar.gz -C source3309 shell-kodi; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103309-Close-Ring-Verification
          path: |
            evidence3309/
            !evidence3309/*.apk
          retention-days: 90
          if-no-files-found: error
