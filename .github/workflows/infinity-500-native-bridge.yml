name: Infinity500 actual embedded Python native bridge - Android ARM64
on:
  push:
    branches: [work/infinity-2103500-consolidated-repair-20261115]
    paths: [repairs/infinity-consolidated-2103500-20261115/CI-BRIDGE.json]
permissions: {contents: read, actions: read}
concurrency: {group: infinity500-native-bridge, cancel-in-progress: false}
jobs:
  bridge:
    if: github.ref == 'refs/heads/work/infinity-2103500-consolidated-repair-20261115'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      GH_TOKEN: '${{ github.token }}'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.7'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'platform-tools build-tools;35.0.0 platforms;android-34 ndk;21.4.7075529', log-accepted-android-sdk-licenses: false}
      - name: Authenticated signed500 runtime inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '14128448982', run-id: '43632329510', merge-multiple: true, github-token: '${{ github.token }}', path: signed500}
      - name: Resolve selected successful native artifact
        id: selected
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('repairs/infinity-consolidated-2103500-20261115/CI-BRIDGE.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('variant='+data['variant']+'\n')
              if data['variant']=='candidate':
                  out.write('run='+str(int(data['native_run']))+'\nartifact='+str(int(data['native_artifact']))+'\n')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.selected.outputs.variant == 'candidate'
        with:
          artifact-ids: '${{ steps.selected.outputs.artifact }}'
          run-id: '${{ steps.selected.outputs.run }}'
          merge-multiple: true
          github-token: '${{ github.token }}'
          path: candidate500-native
      - name: Compile fixture against actual exported500 interfaces; no copied ledger
        run: |
          python repairs/infinity-consolidated-2103500-20261115/build_bridge_probe.py signed500/Infinity-2103500-Combined-Original-Signer.apk candidate500-native bridge500-work
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '36'
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 6G
          avd-name: infinity500-observer-bridge
          disable-animations: false
          emulator-options: -no-window -memory 4096 -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python repairs/infinity-consolidated-2103500-20261115/run_bridge_probe.py bridge500-work bridge500-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Infinity500-Embedded-Bridge-${{ github.run_id }}-EVIDENCE-ONLY
          path: |
            bridge500-results/
            bridge500-work/BUILD.json
            bridge500-work/bridge_types.h
            bridge500-work/bridge_symbols.h
          if-no-files-found: warn
          retention-days: 90
