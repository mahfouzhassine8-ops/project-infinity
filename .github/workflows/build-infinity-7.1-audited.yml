name: Infinity 7.1 Architecture Audited Build

on:
  workflow_dispatch:
  push:
    branches: [infinity-7.1-core-unified]
    paths:
      - '.github/workflows/build-infinity-7.1-audited.yml'
      - 'patches/infinity-7.1-audited/**'
      - 'tests/infinity71/**'
      - 'scripts/validate-infinity71-java.py'
      - 'build/infinity71-engine-request.json'

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Validate exact source, Java API, actual DEX contract, and regressions
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' >/dev/null
          git clone --depth 1 --branch 21.3-Omega https://github.com/xbmc/xbmc.git kodi
          test "$(git -C kodi rev-parse HEAD)" = a3a448d26b8d560a65655dab2cd122994dc4e146
          python3 scripts/infinity71.py source --source kodi
          python3 scripts/validate-infinity71-java.py --source kodi \
            --android-jar "$ANDROID_HOME/platforms/android-34/android.jar" --out preflight/java
          mkdir -p preflight/dex
          "$ANDROID_HOME/build-tools/34.0.0/d8" \
            --lib "$ANDROID_HOME/platforms/android-34/android.jar" --min-api 21 \
            --output preflight/dex preflight/java/compile-check.jar
          c++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -Ikodi/xbmc/platform/android/activity tests/infinity71/test_bridge_state.cpp \
            -o preflight/bridge-state-tests
          preflight/bridge-state-tests | tee preflight/native-state.txt
          INFINITY_KODI_SOURCE="$PWD/kodi" INFINITY_TEST_DEX="$PWD/preflight/dex/classes.dex" \
            python3 tests/infinity71/test_contract.py 2>&1 | tee preflight/regressions.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-7.1-Audit-Preflight
          path: |
            preflight/native-state.txt
            preflight/regressions.txt
            preflight/java/Main.javap.txt
          if-no-files-found: warn
          retention-days: 30

  engine:
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      NDK_VER: 21.4.7075529
      DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Prepare the same pinned toolchain and signing prerequisite
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf bison build-essential curl flex gawk git gperf lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev unzip zip zlib1g-dev ccache python3 nasm yasm
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' "ndk;$NDK_VER"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
      - name: Apply one coherent source-built bridge to exact Kodi 21.3
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 21.3-Omega https://github.com/xbmc/xbmc.git kodi
          test "$(git -C kodi rev-parse HEAD)" = a3a448d26b8d560a65655dab2cd122994dc4e146
          python3 scripts/infinity71.py source --source kodi
      - uses: actions/cache/restore@v4
        id: deps-cache
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            ~/.ccache
          key: infinity-71-audited-deps-21.3-arm64-${{ runner.os }}-${{ hashFiles('patches/infinity-7.1-audited/contract.json') }}
          restore-keys: |
            infinity-71-audited-deps-21.3-arm64-${{ runner.os }}-
            infinity-7.1-uniform-g-21.3-arm64-${{ runner.os }}-
            infinity-7.1-hooked-d-21.3-arm64-${{ runner.os }}-
            infinity-7.1-kodi-21.3-arm64-${{ runner.os }}-
      - name: Prepare matched dependencies and native build configuration
        id: depends
        run: |
          set -euo pipefail
          mkdir -p "$TARBALLS" "$DEPENDS" "$BUILD_DIR"
          cd kodi/tools/depends
          ./bootstrap
          ./configure --with-tarballs="$TARBALLS" --host=aarch64-linux-android \
            --with-sdk-path="$ANDROID_HOME" --with-ndk-path="$ANDROID_HOME/ndk/$NDK_VER" \
            --prefix="$DEPENDS" --enable-debug=yes
          make -j"$(nproc)"
          make -C target/cmakebuildsys BUILD_DIR="$BUILD_DIR"
      - name: Compile-check every changed C++ translation unit BEFORE the full engine
        run: |
          set -euo pipefail
          CMAKE_BIN=$(sed -n 's/^CMAKE_COMMAND:INTERNAL=//p' "$BUILD_DIR/CMakeCache.txt")
          test -x "$CMAKE_BIN"
          "$CMAKE_BIN" -S "$PWD/kodi" -B "$BUILD_DIR" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          python3 scripts/infinity71.py native-check --build-dir "$BUILD_DIR"
      - name: Build the complete matched Kodi native stack and base APK
        run: |
          set -euo pipefail
          make -C "$BUILD_DIR" -j"$(nproc)"
          make -C "$BUILD_DIR" apk -j"$(nproc)"
          APK=$(find kodi "$BUILD_DIR" -type f -name '*.apk' -print -quit)
          test -n "$APK"
          mkdir -p engine
          cp "$APK" engine/Infinity-7.1-Engine-Base.apk
          python3 scripts/infinity71.py record-engine --apk engine/Infinity-7.1-Engine-Base.apk \
            --output engine/engine.json --source-commit "$GITHUB_SHA"
          printf '%s\n' 'Engine base only. Device tests are pending. The installable candidate adds the preserved player lock in a separate job.' > engine/README.txt
      - name: Save reusable engine BEFORE any presentation work
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-7.1-Audited-Engine
          path: engine/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/cache/save@v4
        if: always() && steps.depends.conclusion == 'success' && steps.deps-cache.outputs.cache-hit != 'true'
        with:
          path: |
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            ~/.ccache
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

  presentation:
    needs: engine
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v5
        with:
          name: Infinity-7.1-Audited-Engine
          path: engine
      - name: Add the original lock without rebuilding Java or native code
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;34.0.0' >/dev/null
          mkdir -p candidate
          python3 scripts/infinity71.py overlay --apk engine/Infinity-7.1-Engine-Base.apk \
            --manifest engine/engine.json --output candidate/Infinity-7.1-Audited-unsigned.apk
      - name: Sign and verify the candidate
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          bash scripts/sign-infinity71.sh candidate/Infinity-7.1-Audited-unsigned.apk candidate/Infinity-7.1-Audited.apk
          python3 scripts/infinity71.py verify-overlay --apk candidate/Infinity-7.1-Audited.apk --manifest engine/engine.json
          cp engine/engine.json candidate/engine.json
      - uses: actions/upload-artifact@v7
        with:
          name: Infinity-7.1-Audited-Candidate
          path: |
            candidate/Infinity-7.1-Audited.apk
            candidate/Infinity-7.1-Audited.sha256
            candidate/Infinity-7.1-Audited.signing.txt
            candidate/engine.json
          if-no-files-found: error
          retention-days: 30
