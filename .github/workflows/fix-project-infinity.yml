name: One-time Project Infinity workflow repair

on:
  push:
    paths:
      - '.github/workflows/fix-project-infinity.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Repair package-ID step
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/build-kodi.yml')
          text = path.read_text()
          start = text.index("      - name: Apply custom package ID\n")
          end = text.index("      - name: Apply custom icon\n", start)
          lines = [
              "      - name: Apply custom package ID",
              "        if: github.event.inputs.package_id != 'org.xbmc.kodi'",
              "        run: |",
              "          set -euo pipefail",
              '          PKG="${{ github.event.inputs.package_id }}"',
              '          echo "📦 Setting package ID: $PKG"',
              "",
              "          # Kodi reads APP_PACKAGE from version.txt during CMake configuration.",
              '          sed -i -E "s|^APP_PACKAGE[[:space:]]+org\\.xbmc\\.kodi$|APP_PACKAGE $PKG|" ~/kodi/version.txt',
              "",
              "          # Keep Android packaging references in sync with the package ID too.",
              "          find ~/kodi/tools/android/packaging -type f -print0 | \\",
              '            xargs -0 sed -i "s|org\\.xbmc\\.kodi|$PKG|g" 2>/dev/null || true',
              "",
              '          echo "Package value now:"',
              "          grep '^APP_PACKAGE ' ~/kodi/version.txt",
              '          grep -q "^APP_PACKAGE $PKG$" ~/kodi/version.txt',
              "",
          ]
          new_block = "\n".join(lines)
          path.write_text(text[:start] + new_block + text[end:])
          PY

      - name: Remove one-time repair workflow
        run: rm -f .github/workflows/fix-project-infinity.yml

      - name: Commit repair
        run: |
          git config user.name "ChatGPT Project Infinity"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-kodi.yml .github/workflows/fix-project-infinity.yml
          git commit -m "Fix Project Infinity package ID handling"
          git push
