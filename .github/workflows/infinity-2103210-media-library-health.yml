name: Infinity | 2103210 Media Library + Health

on:
  workflow_dispatch:
  push:
    branches: [infinity-cobra-2103210-media-library-health-rc1]
    paths:
      - '.github/workflows/infinity-2103210-media-library-health.yml'
      - 'repairs/cobra-media-library-health-2103210/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: infinity-2103210-${{ github.sha }}
  cancel-in-progress: false

env:
  NDK_VER: 21.4.7075529
  RUNTIME_COMMIT: b42760a25a27d23baa5db5770824cb8d32ec2290

jobs:
  package-and-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout scoped 2103210 successor
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Download exact successful 2103208 presentation parent
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103208-Integration-Polish-TEST-CANDIDATE-Replica-1-Attempt-1
          run-id: 35676573761
          github-token: ${{ github.token }}
          path: baseline208

      - name: Download preserved 2103209 Python 3.11 GIL native engine
        uses: actions/download-artifact@v8
        with:
          name: Infinity-2103209-Python311-GIL-Native-Engine
          run-id: 35693288744
          github-token: ${{ github.token }}
          path: native209

      - name: Reconstruct 2103209 shell without rebuilding native engine
        run: |
          set -euo pipefail
          mkdir -p audit210 engine
          cp native209/pythoninvoker-threadstate-v2-source.json engine/pythoninvoker-threadstate-v2-source.json
          cp native209/pythoninvoker-threadstate-v2-source.stage1.json engine/pythoninvoker-threadstate-v2-source.stage1.json
          python3 repairs/python311-gil-2103209/ci.py prepare \
            --base-dir baseline208 \
            --native-apk native209/Infinity-1.0.9-Cobra-Full-Feature-Candidate-2-Engine-Base.apk \
            --shell shell-kodi \
            --out audit210/native-base

      - name: Apply Movies Shows and chooser Health Center delta with Live TV lock
        run: |
          set -euo pipefail
          python3 repairs/cobra-media-library-health-2103210/apply.py --shell shell-kodi
          grep -F "script.kodihealthcenter" shell-kodi/tools/android/packaging/xbmc/src/Main.java.in
          grep -F "renderVodBrowse(items, series, failures)" shell-kodi/tools/android/packaging/xbmc/src/InfinityLiveActivity.java.in
          grep -F '"live_tv_source_untouched": true' audit210/scope.json

      - name: Create intermediate Android build keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          test -s "$HOME/.android/debug.keystore"

      - name: Build Android shell sign and verify 2103210
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 scripts/package_background_resume.py \
            --source shell-kodi \
            --base-apk audit210/native-base/Infinity-2103208-Python311-GIL-Patched-Base.apk \
            --build-dir build210 \
            --out signed210
          python3 repairs/cobra-media-library-health-2103210/verify.py \
            --final signed210/Infinity-1.0.9-Cobra-Media-Library-Health-RC1.apk \
            --audit signed210/background-resume-apk-audit.json \
            --base audit210/native-base/Infinity-2103208-Python311-GIL-Patched-Base.apk

      - name: Publish 2103210 TEST CANDIDATE
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103210-Cobra-Media-Library-Health-TEST-CANDIDATE
          path: signed210/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Preserve 2103210 evidence and Live TV lock
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-2103210-Cobra-Media-Library-Health-Evidence
          path: |
            audit210/
            engine/background-resume-source.json
            repairs/cobra-media-library-health-2103210/
            signed210/*.json
            signed210/*.txt
          if-no-files-found: warn
          retention-days: 90
