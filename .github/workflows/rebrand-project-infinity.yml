name: ♾️ Rebrand Infinity APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rebrand-project-infinity.yml'

jobs:
  rebrand:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;34.0.0 platform-tools'

      - name: Install branding tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick librsvg2-bin unzip curl
          curl -fsSL -o /tmp/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

      - name: Download successful Build #4 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9973783754/zip \
            -o /tmp/project-infinity-artifact.zip
          mkdir -p /tmp/pi
          unzip -q /tmp/project-infinity-artifact.zip -d /tmp/pi
          APK=$(find /tmp/pi -name '*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" /tmp/Project-Infinity-source.apk
          echo "Source APK: $APK"

      - name: Decode and apply Infinity branding
        run: |
          set -euo pipefail
          java -jar /tmp/apktool.jar d -f /tmp/Project-Infinity-source.apk -o /tmp/pi-decoded

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('/tmp/pi-decoded')
          changed = 0
          for p in root.glob('res/values*/strings.xml'):
              text = p.read_text(errors='ignore')
              new = re.sub(
                  r'(<string\s+name="app_name"[^>]*>).*?(</string>)',
                  r'\1Infinity\2',
                  text,
                  flags=re.S,
              )
              if new != text:
                  p.write_text(new)
                  changed += 1
          print(f'Updated app_name in {changed} strings.xml file(s)')

          manifest = root / 'AndroidManifest.xml'
          text = manifest.read_text()
          text = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/project_infinity_icon"', text, count=1)
          if 'android:roundIcon=' in text:
              text = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@drawable/project_infinity_icon"', text, count=1)
          manifest.write_text(text)
          PY

          mkdir -p /tmp/pi-decoded/res/drawable-nodpi
          cat > /tmp/project-infinity.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
            <rect width="512" height="512" rx="112" fill="#111318"/>
            <text x="256" y="330" text-anchor="middle" font-size="300" font-family="DejaVu Sans" font-weight="bold" fill="#ffffff">∞</text>
          </svg>
          SVG
          rsvg-convert -w 512 -h 512 /tmp/project-infinity.svg -o /tmp/pi-decoded/res/drawable-nodpi/project_infinity_icon.png

      - name: Rebuild branded APK
        run: |
          set -euo pipefail
          java -jar /tmp/apktool.jar b /tmp/pi-decoded -o /tmp/Infinity-unsigned.apk

      - name: Sign branded APK
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/project-infinity.keystore \
            -alias projectinfinity \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Infinity, OU=Personal Build, O=Infinity, L=Detroit, ST=Michigan, C=US" \
            >/dev/null 2>&1

          "$BUILD_TOOLS/zipalign" -f -v 4 \
            /tmp/Infinity-unsigned.apk \
            /tmp/Infinity-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks ~/.android/project-infinity.keystore \
            --ks-key-alias projectinfinity \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out /tmp/Infinity.apk \
            /tmp/Infinity-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose /tmp/Infinity.apk

      - name: Upload Infinity APK
        uses: actions/upload-artifact@v7
        with:
          name: Infinity.apk
          path: /tmp/Infinity.apk
          retention-days: 30
