name: ♾️ Rebrand Infinity APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rebrand-project-infinity.yml'

jobs:
  rebrand:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;34.0.0 platform-tools'

      - name: Install diagnostic tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends unzip curl binutils
          curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

      - name: Download known working base APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9973783754/zip -o /tmp/base.zip
          mkdir -p /tmp/base
          unzip -q /tmp/base.zip -d /tmp/base
          APK=$(find /tmp/base -name '*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" /tmp/Infinity-base.apk

      - name: Decode and trace every Kodi source
        run: |
          set -euo pipefail
          java -jar /tmp/apktool.jar d -f /tmp/Infinity-base.apk -o /tmp/decoded
          REPORT=/tmp/Infinity-Kodi-Diagnostic.txt
          {
            echo 'INFINITY KODI DIAGNOSTIC REPORT'
            echo '================================'
            echo
            echo 'Exact permission sentence / fragments in decoded files:'
            grep -RIna --binary-files=text -E 'requires access to your device media and files|notice_dialog|networkperm_dialog|record_audio_dialog' /tmp/decoded 2>/dev/null || true
            echo
            echo 'Kodi literals in Splash-related decoded code:'
            grep -RIna --binary-files=text -E 'Kodi|notice_dialog' /tmp/decoded/smali* 2>/dev/null | grep -Ei 'Splash|permission|notice_dialog|media and files' || true
            echo
            echo 'Android resource app-name/permission strings:'
            grep -RIna --binary-files=text -E 'app_name|application_name|notice_dialog|Kodi requires access' /tmp/decoded/res 2>/dev/null || true
            echo
            echo 'Manifest Kodi/label references:'
            grep -nEi 'Kodi|label=' /tmp/decoded/AndroidManifest.xml 2>/dev/null || true
            echo
            echo 'All textual Kodi occurrences (first 2000):'
            grep -RIna --binary-files=text 'Kodi' /tmp/decoded 2>/dev/null | head -2000 || true
            echo
            echo 'Raw APK printable strings matching permission text / Kodi (first 1000):'
            strings -a /tmp/Infinity-base.apk | grep -Ei 'Kodi|requires access to your device media and files|notice_dialog' | head -1000 || true
          } > "$REPORT"
          echo '=== DIAGNOSTIC PREVIEW ==='
          sed -n '1,300p' "$REPORT"

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-Kodi-Diagnostic
          path: /tmp/Infinity-Kodi-Diagnostic.txt
          retention-days: 30
