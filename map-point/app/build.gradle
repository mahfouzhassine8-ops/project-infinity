plugins {
    id 'com.android.application'
}

android {
    namespace 'com.infinity.mappoint'
    compileSdk 35

    defaultConfig {
        applicationId 'com.infinity.mappoint'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '2.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
}
