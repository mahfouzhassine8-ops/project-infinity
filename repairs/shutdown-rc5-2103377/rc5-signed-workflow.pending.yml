name: Infinity | 2103377 RC5 full native signed test package
on:
  push:
    branches: [work/infinity-2103377-rc5-green-package]
    paths:
      - '.github/workflows/infinity-2103377-rc5-signed-test.yml'
      - 'repairs/shutdown-rc5-2103377/package_rc5.py'
permissions: {contents: read, actions: read}
concurrency: {group: infinity-2103377-rc5-signed-test, cancel-in-progress: false}
env:
  NDK_VER: 21.4.7075529
jobs:
  signed-rc5-test-candidate:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.4.7075529
          key: infinity-pinned-ndk-${{ runner.os }}-21.4.7075529-v1
      - run: bash repairs/android-checkpoint-shutdown/install_ndk.sh

      # Reuse exact successful compiled native engine without rebuilding.
      - uses: actions/download-artifact@v8
        with:
          run-id: 38517386755
          name: Infinity-2103377-RC5-Optional-Python-Native-Evidence
          github-token: '${{ github.token }}'
          path: native-evidence
      # The original RC2 pruning test result was verified on its own runner;
      # RC3's native build preserved the code but did not rerun that old fixture.
      # Fetch its exact green receipt, never fabricate or re-run nine passes.
      - uses: actions/download-artifact@v8
        with:
          run-id: 38488207608
          name: Infinity-2103377-Drain-RC2-Native-Evidence
          github-token: '${{ github.token }}'
          path: preserved-rc2-evidence
      # 274 unchanged Android unit tests were executed against this donor.
      - uses: actions/download-artifact@v8
        with:
          run-id: 38514680851
          name: Infinity-2103377-RC5-Android-274-Verified
          github-token: '${{ github.token }}'
          path: android-evidence
      # Only this locked-parent APK is permitted as the protected payload.
      - uses: actions/download-artifact@v8
        with:
          run-id: 38323908660
          name: Cobra-2103376-Critical-Preview-Signed-Test-APK
          github-token: '${{ github.token }}'
          path: parent-apk

      - name: Verify exact green source commits, binary hash and 274 preserved cases
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          n=Path('native-evidence/checkpoint-build')
          a=Path('android-evidence')
          proof=json.loads((n/'ENGINE-PROOF.json').read_text())
          checks=json.loads((n/'RC3-HOST-VERIFICATION.json').read_text())
          android=json.loads((a/'ANDROID-VERIFICATION.json').read_text())
          donor=json.loads((a/'RC3-ANDROID-VERIFICATION.json').read_text())
          assert proof['source_commit']=='645b0e8b15c45d4c170a8b664073a87cb848b831'
          assert proof['complete_native_engine_compiled']
          assert proof.get('rc5_trakt_stop_only_compiled') is True
          assert proof.get('rc5_continuity_stop_only_compiled') is True
          assert proof.get('rc5_17_required_save_owners_unchanged') is True
          host=json.loads((n/'RC5-OPTIONAL-HOST-TESTS.json').read_text())
          assert host['passed']==host['total'] and host['passed']>=17
          assert host['checks']['real_cpp_classifier_compiles_executes']
          assert host['checks']['real_cpp_begin_checkpoint_compiles_executes']
          assert proof['rc3_python_stop_at_native_request_compiled']
          assert proof['rc3_curl_cancel_semantic_error_compiled']
          assert proof['rc3_final_save_authority_unchanged']
          assert proof['unknown_writers_abandoned'] is False
          assert proof['rc3_five_service_physical_retirement_proven'] is False
          assert hashlib.sha256((n/'libkodi.so').read_bytes()).hexdigest()==proof['native_sha256']
          assert checks['passed']==checks['total']==10
          assert android['source_commit']=='5a1a427cb5bdcc248b0e2a7887f9d6682ca53877'
          assert android['totals']==dict(tests=274,errors=0,failures=0,skipped=0)
          assert donor['verified_unmodified_274_cases']==274 and donor['tests_freshly_executed']
          assert hashlib.sha256((a/'donor.apk').read_bytes()).hexdigest()==donor['donor_sha256']
          print('GREEN: exact native RC5 binary, 17 targeted host tests, 274 Android passes. Fold shutdown remains unverified.')
          PY

      - name: Reuse original nine RC2 pruning cases without recompilation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,shutil
          from pathlib import Path
          original=Path('preserved-rc2-evidence/checkpoint-build/RC2-PRUNE-HOST-TESTS.json')
          verified=json.loads(original.read_text())
          assert verified['tests']==verified['passed']==9
          assert len(verified['checks'])==9 and all(verified['checks'].values())
          assert verified['scope'].startswith('C++ native method compiled')
          parent=json.loads(Path('preserved-rc2-evidence/checkpoint-build/ENGINE-PROOF.json').read_text())
          current=json.loads(Path('native-evidence/checkpoint-build/ENGINE-PROOF.json').read_text())
          assert parent['source_commit']=='633b8d9444527eb8df5dbbf291c787fd03766b2d'
          assert parent['rc2_optional_queued_prune_compiled'] and current['rc2_optional_queued_prune_compiled']
          target=Path('native-evidence/checkpoint-build/RC2-PRUNE-HOST-TESTS.json')
          assert not target.exists()
          shutil.copyfile(original,target)
          assert target.read_bytes()==original.read_bytes()
          print('PASS: original 9/9 RC2 host tests reused by exact proof; no native recompilation.')
          PY
      - name: Permanently sign RC5 with original certificate and verify unchanged parent payload
        env:
          INFINITY_KEYSTORE_B64: '${{ secrets.INFINITY_KEYSTORE_B64 }}'
          INFINITY_STORE_PASSWORD: '${{ secrets.INFINITY_STORE_PASSWORD }}'
          INFINITY_KEY_PASSWORD: '${{ secrets.INFINITY_KEY_PASSWORD }}'
          INFINITY_KEY_ALIAS: '${{ secrets.INFINITY_KEY_ALIAS }}'
        run: |
          set -euo pipefail
          python3 repairs/shutdown-rc5-2103377/package_rc5.py \
            --parent parent-apk/Cobra-2103376-Critical-Preview-RC1.apk \
            --donor android-evidence/donor.apk \
            --native native-evidence \
            --android android-evidence \
            --out rc5-signed

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Infinity-2103377-RC5-Optional-Shutdown-Signed-Test-APK
          path: rc5-signed/Infinity-2103377-RC5-Optional-Shutdown-Signed-Test.apk
          if-no-files-found: error
          retention-days: 90
          compression-level: 1

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infinity-2103377-RC5-Optional-Shutdown-Package-Receipts
          path: |
            rc5-signed/*.json
            rc5-signed/*.txt
            rc5-signed/*.sha256
          retention-days: 90
          if-no-files-found: warn
