  infinity514-scoped-qa:
    name: Exact signed 2103514 scoped QA through the existing original-key gate
    if: github.event_name == 'workflow_dispatch' && github.repository == 'mahfouzhassine8-ops/project-infinity' && github.ref == 'refs/heads/work/infinity-2103460-nine-corrections-20261106' && (inputs.operation == 'prepare-514-scoped-qa' || inputs.operation == 'sign-514-scoped-qa')
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    env:
      GH_TOKEN: '${{ github.token }}'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: 'build-tools;35.0.0', log-accepted-android-sdk-licenses: false}
      - name: Unchanged single original signing route
        run: python repairs/dual-experience-isolation-2103420/signer_policy.py check --out SIGNER-ROUTES.json
      - name: Frozen source, successful Android ARM64 native result and signed 2103514 baseline
        if: inputs.operation == 'prepare-514-scoped-qa'
        run: python repairs/infinity-2103514-targeted-20261118/release_driver.py preflight
      - name: Existing original module signer for the two approved manifests only
        if: inputs.operation == 'prepare-514-scoped-qa'
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: python repairs/infinity-2103514-targeted-20261118/release_driver.py sign-modules
      - name: Actual key-free assembly and full baseline member and owner comparisons
        if: inputs.operation == 'prepare-514-scoped-qa'
        run: python repairs/infinity-2103514-targeted-20261118/release_driver.py prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.operation == 'prepare-514-scoped-qa'
        with:
          name: 'Infinity514-Prepared-${{ github.run_id }}'
          path: infinity514-unsigned-preparation/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.operation == 'prepare-514-scoped-qa'
        with:
          name: 'Infinity514-Preparation-Evidence-${{ github.run_id }}'
          path: |
            infinity514-unsigned-preparation/PREPARATION.json
            infinity514-unsigned-preparation/*/AUTHORITY-PROPOSAL.json
            infinity514-unsigned-preparation/*/PRESERVATION.json
          if-no-files-found: error
          retention-days: 90
      - name: Exact registered owner candidate or recovery
        if: inputs.operation == 'sign-514-scoped-qa'
        id: selected
        run: python repairs/infinity-2103514-targeted-20261118/release_driver.py select
      - name: Unchanged original APK signer, package identity and payload guard
        if: inputs.operation == 'sign-514-scoped-qa'
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.INFINITY_STORE_PASSWORD }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
        run: python repairs/dual-experience-isolation-2103420/assemble.py sign --apk '${{ steps.selected.outputs.apk }}' --jars movies-cast-original-dex-tools --work signer-dex --repository . --expected-head "$GITHUB_SHA" --expected-generation '${{ steps.selected.outputs.generation }}' --sdk "$ANDROID_HOME/build-tools/35.0.0" --out infinity514-original-signed
      - name: Verify original certificate and every signed member against 2103514 and staging
        if: inputs.operation == 'sign-514-scoped-qa'
        run: python repairs/infinity-2103514-targeted-20261118/release_driver.py post-sign
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.operation == 'sign-514-scoped-qa'
        with:
          name: 'Infinity514-OriginalSigned-${{ github.run_id }}-QA'
          path: infinity514-original-signed/
          if-no-files-found: error
          retention-days: 90
