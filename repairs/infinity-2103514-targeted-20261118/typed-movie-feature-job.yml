  infinity514-typed-movie-playback:
    name: Infinity typed saved-movie actual playback
    if: github.event_name == 'workflow_dispatch' && github.repository == 'mahfouzhassine8-ops/project-infinity' && github.ref == 'refs/heads/work/infinity-2103514-targeted-20261118' && inputs.feature == 'infinity514-typed-movie-playback'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      GH_TOKEN: '${{ github.token }}'
      SELECTED_AUTHORIZATION: '${{ inputs.authorization }}'
      PREPARATION_RUN: '${{ inputs.candidate_build }}'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {cmdline-tools-version: '15859902', packages: 'platform-tools build-tools;35.0.0 cmdline-tools;22.0', log-accepted-android-sdk-licenses: false}
      - name: Install the existing fixture media tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr
          python -m pip install Pillow==11.3.0
      - name: Existing accelerated emulator configuration
        run: |
          python repairs/four-repair-20261018/android37_gate.py --sdk-root "$ANDROID_HOME" --out infinity514-movie-platform --pin-tools
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '37.0'
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 10G
          avd-name: infinity-four-repair-api37
          pre-emulator-launch-script: python repairs/four-repair-20261018/android37_gate.py --sdk-root "$ANDROID_HOME" --out infinity514-movie-platform --check-avd
          emulator-options: -no-window -memory 4096 -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: >-
            python repairs/infinity-2103514-targeted-20261118/typed_movie_playback_android.py
            --out infinity514-movie-playback
            --preparation-run "$PREPARATION_RUN"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: 'Infinity514-Typed-Movie-Playback-${{ github.run_id }}-EVIDENCE'
          path: |
            infinity514-movie-playback/TYPED-MOVIE-PLAYBACK.json
            infinity514-movie-playback/typed-movie-observation.png
          if-no-files-found: warn
          retention-days: 90
